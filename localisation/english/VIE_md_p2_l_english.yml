l_english:

 ### Phase 2 ideas (generated)
 VIE_rule_of_law_idea:0 "Nhà nước Pháp quyền Xã hội Chủ nghĩa"
 VIE_rule_of_law_idea_desc:0 "Hiến pháp năm 2013 cùng một loạt các bộ luật mới giúp cho hoạt động của nhà nước trở nên minh bạch, có thể dự đoán được hơn."
 VIE_party_discipline_idea:0 "Chiến dịch 'Đốt Lò'"
 VIE_party_discipline_idea_desc:0 "Chiến dịch phòng chống tham nhũng bền bỉ, không có vùng cấm trong Đảng và Nhà nước đã tạo nên một làn sóng chấn chỉnh mạnh mẽ trong giới chính trị."
 VIE_official_caution:0 "Cán bộ Sợ sai, Phòng thủ"
 VIE_official_caution_desc:0 "Tâm lý lo sợ bị thanh tra, khởi tố khiến nhiều cán bộ trì trệ, chậm trễ đặt bút ký phê duyệt các dự án đầu tư."
 VIE_streamlined_state_idea:0 "Tinh gọn Bộ máy Nhà nước"
 VIE_streamlined_state_idea_desc:0 "Các bộ ngành và cơ quan trung ương được sáp nhập, cắt giảm hàng vạn biên chế và chức danh trung gian."
 VIE_reorg_disruption:0 "Xáo trộn Thời kỳ Sáp nhập"
 VIE_reorg_disruption_desc:0 "Việc sáp nhập công sở, sắp xếp lại nhân sự và tâm lý lo lắng vị trí công tác làm chậm nhịp vận hành của bộ máy trong một thời gian ngắn."
 VIE_provincial_merger_idea:0 "Mở rộng Không gian Tỉnh thành"
 VIE_provincial_merger_idea_desc:0 "63 tỉnh thành được sắp xếp sáp nhập lại thành 34 tỉnh thành và xóa bỏ cấp quận/huyện trung gian."
 VIE_era_of_rising_idea:0 "Kỷ nguyên Vươn mình của Dân tộc"
 VIE_era_of_rising_idea_desc:0 "Ban lãnh đạo đặt ra tầm nhìn lịch sử mới: đưa đất nước trở thành quốc gia phát triển có thu nhập cao vào năm 2045."
 VIE_state_conglomerates_idea:0 "Tập đoàn Kinh tế Nhà nước"
 VIE_state_conglomerates_idea_desc:0 "Những 'quả đấm thép' khổng lồ như Vinashin và PetroVietnam là trụ cột nền kinh tế, song họ cũng gánh trên vai những khoản nợ vay rất lớn."
 VIE_state_debt_overhang:0 "Gánh nặng Nợ Tập đoàn Nhà nước"
 VIE_state_debt_overhang_desc:0 "Các khoản nợ xấu từ các tổng công ty nhà nước tạo gánh nặng lớn lên các ngân hàng thương mại và nền tài chính công."
 VIE_petrovietnam_idea:0 "Mở rộng Tập đoàn Dầu khí Quốc gia"
 VIE_petrovietnam_idea_desc:0 "Các lô dầu khí ngoài khơi và các tổ hợp lọc hóa dầu đóng góp nguồn thu ngân sách khổng lồ cho nhà nước."
 VIE_private_champions_idea:0 "Tập đoàn Tư nhân Tiên phong"
 VIE_private_champions_idea_desc:0 "Các tập đoàn tư nhân quy mô lớn đầu tư mạnh mẽ vào bất động sản, công nghiệp ô tô, bán lẻ và công nghệ cao."
 VIE_expressway_idea:0 "Trục Cao tốc Bắc - Nam"
 VIE_expressway_idea_desc:0 "Tuyến đại lộ cao tốc Bắc - Nam xuyên suốt giúp rút ngắn đáng kể thời gian vận chuyển hàng hóa dọc chiều dài đất nước."
 VIE_cptpp_idea:0 "Thành viên Hiệp định CPTPP"
 VIE_cptpp_idea_desc:0 "Quyền tiếp cận ưu đãi tới 11 nền kinh tế bờ Thái Bình Dương, đi kèm các tiêu chuẩn khắt khe hơn về lao động và doanh nghiệp nhà nước."
 VIE_evfta_idea:0 "Hiệp định Thương mại Tự do EU (EVFTA)"
 VIE_evfta_idea_desc:0 "Hàng rào thuế quan đối với hầu hết các mặt hàng giao thương với Liên minh Châu Âu dần được xóa bỏ hoàn toàn trong vòng 10 năm."
 VIE_semiconductor_idea:0 "Khát vọng Vi mạch Bán dẫn và AI"
 VIE_semiconductor_idea_desc:0 "Các nhà máy đóng gói, trung tâm thiết kế chip và trung tâm dữ liệu hình thành nền móng cho ngành công nghiệp bán dẫn nội địa."
 VIE_nq57_68_idea:0 "Nghị quyết Đột phá 57 và 68"
 VIE_nq57_68_idea_desc:0 "Khoa học công nghệ, đổi mới sáng tạo và khu vực kinh tế tư nhân được xác định là các động lực tăng trưởng quan trọng nhất của đất nước."
 VIE_nuclear_program_idea:0 "Chương trình Điện Hạt nhân"
 VIE_nuclear_program_idea_desc:0 "Hai tổ máy điện hạt nhân tại Ninh Thuận hứa hẹn nguồn cung ứng điện nền ổn định và tạo dựng đội ngũ chuyên gia công nghệ cao."
 VIE_net_zero_idea:0 "Cam kết Đạt Net Zero vào Năm 2050"
 VIE_net_zero_idea_desc:0 "Điện gió, điện mặt trời và việc nâng cấp lưới truyền tải điện từ nay sẽ được tính toán ưu tiên trong mọi quyết sách năng lượng."
 VIE_vpa_modernization_idea:0 "Hiện đại hóa Quân đội Nhân dân"
 VIE_vpa_modernization_idea_desc:0 "Hiện đại hóa có trọng tâm trọng điểm kết hợp huấn luyện nâng cao giúp tăng cường khả năng sẵn sàng chiến đấu của toàn quân."
 VIE_bastion_idea:0 "Trận địa Tên lửa Bờ Đối hải"
 VIE_bastion_idea_desc:0 "Các tổ hợp tên lửa bờ đối hải cơ động biến mọi cuộc tập kích đổ bộ đường biển thành thảm họa tốn kém cho đối phương."
 VIE_provincial_defence_idea:0 "Khu vực Phòng thủ Cấp tỉnh"
 VIE_provincial_defence_idea_desc:0 "Mỗi tỉnh thành tổ chức một khu vực phòng thủ vững chắc, được hỗ trợ bởi lực lượng dân quân tự vệ và quân nhân dự bị động viên."
 VIE_maritime_militia_idea:0 "Hải đội Dân quân Tự vệ Biển"
 VIE_maritime_militia_idea_desc:0 "Các đội tàu cá của ngư dân được tổ chức, huấn luyện kỹ lưỡng để kịp thời phát hiện, cung cấp thông tin và kiên quyết bám biển khẳng định chủ quyền."
 VIE_spratly_garrison_idea:0 "Củng cố Các Điểm Đảo Trường Sa"
 VIE_spratly_garrison_idea_desc:0 "Bồi đắp đảo và xây dựng các công trình kiên cố mới củng cố vững chắc sự hiện diện lâu dài của Việt Nam tại Quần đảo Trường Sa."
 VIE_four_nos_doctrine_idea:0 "Học thuyết Quốc phòng 'Bốn Không'"
 VIE_four_nos_doctrine_idea_desc:0 "Chính sách quốc phòng được xây dựng dựa trên nguyên tắc độc lập, tự chủ, tự lực tự cường và không tham gia liên minh quân sự."
 VIE_bamboo_diplomacy_idea:0 "Trường phái Ngoại giao Cây tre"
 VIE_bamboo_diplomacy_idea_desc:0 "Gốc vững, thân chắc, cành uyển chuyển: Hà Nội duy trì quan hệ tốt đẹp, cân bằng và tin cậy với mọi cường quốc lớn trên thế giới."
 VIE_education_idea:0 "Đổi mới Giáo dục và Đào tạo"
 VIE_education_idea_desc:0 "Các trường đại học và trường đào tạo nghề được cấp thêm ngân sách và trao quyền tự chủ rộng rãi hơn trong quản lý, học thuật."
 VIE_universal_health_idea:0 "Bảo hiểm Y tế Toàn dân"
 VIE_universal_health_idea_desc:0 "Hầu hết mọi người dân trên cả nước hiện đều được chăm sóc y tế thông qua hệ thống bảo hiểm y tế công lập."
 VIE_digital_idea:0 "Chương trình Chuyển đổi Số Quốc gia"
 VIE_digital_idea_desc:0 "Định danh điện tử, chính phủ điện tử và thanh toán không dùng tiền mặt phủ rộng khắp mọi nẻo đường đất nước."
 VIE_disaster_prep_idea:0 "Năng lực Ứng phó Thiên tai"
 VIE_disaster_prep_idea_desc:0 "Hệ thống cảnh báo sớm, phương án sơ tán bài bản và đê điều kiên cố giúp giảm thiểu tối đa thiệt hại do bão lũ gây ra."
 VIE_high_inflation:0 "Lạm phát Tăng cao"
 VIE_high_inflation_desc:0 "Giá cả hàng hóa và chi phí sinh hoạt đang leo thang nhanh hơn tốc độ tăng lương."
 VIE_bond_overhang:0 "Áp lực Đáo hạn Trái phiếu Doanh nghiệp"
 VIE_bond_overhang_desc:0 "Các tập đoàn bất động sản chật vật tìm kiếm nguồn vốn để đảo nợ trái phiếu khi đến hạn."
 VIE_us_tariff_shock:0 "Cú sốc Thuế quan từ Hoa Kỳ"
 VIE_us_tariff_shock_desc:0 "Các mức thuế quan trừng phạt bất ngờ đánh vào hàng hóa xuất khẩu sang Mỹ làm xáo trộn các nhà máy và công nhân."
 VIE_us_tariff_mild:0 "Thỏa thuận Thuế quan với Hoa Kỳ"
 VIE_us_tariff_mild_desc:0 "Một mức thuế thấp hơn nhưng vẫn đáng kể được áp dụng đối với các mặt hàng xuất khẩu sang thị trường Hoa Kỳ."
 VIE_sars_outbreak:0 "Nỗi Lo Sợ Dịch Bệnh"
 VIE_sars_outbreak_desc:0 "Một đợt bùng phát dịch bệnh lây nhiễm chưa được kiểm soát khiến người dân vô cùng lo lắng."
 VIE_bird_flu_losses:0 "Thiệt hại Do Dịch Cúm Gia cầm"
 VIE_bird_flu_losses_desc:0 "Nhiều hộ chăn nuôi mất trắng đàn gia cầm vì đại dịch cúm gia cầm bùng phát."
 VIE_flood_damage:0 "Thiệt hại Bão Lũ Thiên tai"
 VIE_flood_damage_desc:0 "Đường sá, ruộng đồng và nhà cửa của nhân dân tại các tỉnh miền Trung bị ngập chìm trong biển nước."
 VIE_developmental_state_idea:0 "Nhà nước Kiến tạo Phát triển"
 VIE_developmental_state_idea_desc:0 "Nhà nước giữ vai trò nhà chiến lược và nhà đầu tư dẫn dắt, với đội ngũ kỹ trị vạch ra đường hướng phát triển."
 VIE_technocrat_cabinet_idea:0 "Nội các Kỹ trị"
 VIE_technocrat_cabinet_idea_desc:0 "Các kỹ sư, chuyên gia kinh tế tài năng đảm nhiệm các bộ ngành từng do các lão thành điều hành."
 VIE_intra_party_elections_idea:0 "Bầu cử Cạnh tranh trong Đảng"
 VIE_intra_party_elections_idea_desc:0 "Các cuộc bầu cử có cạnh tranh thực chất trong nội bộ Đảng trao cho đảng viên tiếng nói thực quyền."
 VIE_press_relaxation_idea:0 "Báo chí Cởi mở"
 VIE_press_relaxation_idea_desc:0 "Báo chí được phép điều tra những tiêu cực của cán bộ địa phương và tranh luận phản biện chính sách."
 VIE_environmental_idea:0 "Trách nhiệm Giải trình Môi trường"
 VIE_environmental_idea_desc:0 "Các đối tượng gây ô nhiễm phải đối mặt với án phạt nghiêm khắc và cộng đồng dân cư có tiếng nói trong các dự án lớn."
 VIE_managed_pluralism_idea:0 "Đa nguyên Có Kiểm soát"
 VIE_managed_pluralism_idea_desc:0 "Hai đảng phái lịch sử được khôi phục và cho phép tham gia tranh cử một số ghế nhất định."
 VIE_democratic_consolidation:0 "Củng cố Nền Dân chủ"
 VIE_democratic_consolidation_desc:0 "Bầu cử tự do, tòa án độc lập và báo chí tự do đã trở thành nếp sinh hoạt chính trị thường nhật."
 VIE_democratic_transition_idea:0 "Nỗi Đau Thời kỳ Chuyển đổi"
 VIE_democratic_transition_idea_desc:0 "Các quyền tự do mới kéo theo những mâu thuẫn xã hội mới, trong khi trật tự cũ vẫn còn những người kiên quyết bảo vệ."
 VIE_hardline_idea:0 "Bảo vệ Nền tảng Tư tưởng"
 VIE_hardline_idea_desc:0 "Ý thức hệ chính thống được tái lập làm nguyên tắc chỉ đạo tuyệt đối cho mọi chính sách quốc gia."
 VIE_state_sector_idea:0 "Khu vực Nhà nước Nắm Vai trò Chủ đạo"
 VIE_state_sector_idea_desc:0 "Doanh nghiệp nhà nước được ưu tiên hàng đầu trong việc tiếp cận tín dụng ngân hàng, quỹ đất và các hợp đồng kinh tế."
 VIE_self_reliance_idea:0 "Tự lực Cánh sinh"
 VIE_self_reliance_idea_desc:0 "Thay thế hàng nhập khẩu và xây dựng chuỗi cung ứng tự chủ trong nước được đặt lên trước việc mở cửa kinh tế."
 VIE_china_orbit_idea:0 "Quỹ đạo Ảnh hưởng của Trung Quốc"
 VIE_china_orbit_idea_desc:0 "Thắt chặt quan hệ kinh tế và chính trị với Bắc Kinh mang lại nguồn vốn lớn nhưng phải trả giá bằng một phần tính tự chủ."
 VIE_bri_idea:0 "Các Dự án Vành đai và Con đường"
 VIE_bri_idea_desc:0 "Các tuyến đường sắt và cảng biển do Trung Quốc tài trợ giúp đẩy nhanh tiến độ xây dựng nhưng làm tăng gánh nặng nợ công."
 VIE_socialist_bloc_idea:0 "Tình Đoàn kết Xã hội Chủ nghĩa"
 VIE_socialist_bloc_idea_desc:0 "Phối hợp chặt chẽ toàn diện về đường lối chính sách với Trung Quốc và các quốc gia xã hội chủ nghĩa anh em."
 VIE_west_alignment_idea:0 "Liên kết với Phương Tây"
 VIE_west_alignment_idea_desc:0 "Quan hệ sâu sắc hơn với Washington và các đối tác đồng minh mở ra các thị trường mới và công nghệ hiện đại."
 VIE_us_defence_idea:0 "Hợp tác Quốc phòng với Hoa Kỳ"
 VIE_us_defence_idea_desc:0 "Các chương trình huấn luyện và trang thiết bị quân sự hiện đại của Mỹ giúp nâng cao tiêu chuẩn tác chiến của lực lượng vũ trang."
 VIE_china_pressure_idea:0 "Sức ép Kinh tế Từ Trung Quốc"
 VIE_china_pressure_idea_desc:0 "Tình trạng ách tắc thông quan biên giới, hạn chế khách du lịch và gián đoạn nguồn cung linh kiện từ phía Bắc Kinh."
 VIE_indochina_idea:0 "Đoàn kết Ba Nước Đông Dương"
 VIE_indochina_idea_desc:0 "Việt Nam, Lào và Campuchia phối hợp chặt chẽ, gắn kết hài hòa hơn trong các chính sách đối ngoại và an ninh."
 VIE_tc_autonomy_idea:0 "Tự chủ Chiến lược Tuyệt đối"
 VIE_tc_autonomy_idea_desc:0 "Hà Nội tự mình định đoạt mọi quyết sách quốc gia, không phụ thuộc vào bất kỳ người bảo trợ hay khối liên minh nào."
 VIE_tc_decoupling_idea:0 "Tách rời Chuỗi Cung ứng"
 VIE_tc_decoupling_idea_desc:0 "Các nguồn nguyên liệu nhập khẩu từ Trung Quốc được thay thế bằng nguồn hàng nội địa hoặc nhập từ nước thứ ba."
 VIE_import_shock_idea:0 "Cú sốc Nhập khẩu"
 VIE_import_shock_idea_desc:0 "Tình trạng khan hiếm linh kiện sản xuất và hàng hóa tiêu dùng tác động tiêu cực đến các nhà máy và đời sống nhân dân."
 VIE_tc_self_management_idea:0 "Công nhân Tự quản"
 VIE_tc_self_management_idea_desc:0 "Các doanh nghiệp được điều hành bởi hội đồng công nhân do tập thể bầu ra, giúp tăng năng suất nhưng làm giảm sự kiểm soát tập trung."
 VIE_tc_global_south_idea:0 "Tiếng nói của Phương Nam Toàn cầu"
 VIE_tc_global_south_idea_desc:0 "Việt Nam trở thành quốc gia cất tiếng nói đại diện cho quyền lợi của các nước đang phát triển trên các diễn đàn quốc tế."
 VIE_tc_armed_neutrality_idea:0 "Trung lập Vũ trang"
 VIE_tc_armed_neutrality_idea_desc:0 "Năng lực quốc phòng hùng hậu, không liên minh quân sự với ai: mọi đối thủ đều phải cân nhắc kỹ trước khi có ý định xâm phạm."
 VIE_yugoslav_model_idea:0 "Mô hình XHCN Độc lập Sáng tạo"
 VIE_yugoslav_model_idea_desc:0 "Cuộc thử nghiệm đã đứng vững qua thời gian: một nhà nước xã hội chủ nghĩa độc lập, không liên kết và giàu bản sắc."
 VIE_civil_unrest_idea:0 "Bất ổn Xã hội"
 VIE_civil_unrest_idea_desc:0 "Những cuộc đình công và biểu tình làm đình trệ hoạt động sản xuất tại các vùng bị ảnh hưởng."
 VIE_security_state_idea:0 "Nhà nước An ninh"
 VIE_security_state_idea_desc:0 "Bộ máy an ninh được đặt vào vị trí trung tâm chỉ đạo toàn diện của bộ máy chính quyền."
 VIE_surveillance_idea:0 "Mạng lưới Giám sát Toàn diện"
 VIE_surveillance_idea_desc:0 "Hệ thống camera giám sát, mạng lưới cộng tác viên và các trung tâm dữ liệu theo dõi sát sao mọi diễn biến đời sống."
 VIE_security_economy_idea:0 "Kinh tế Phục vụ An ninh"
 VIE_security_economy_idea_desc:0 "Mọi ngành công nghiệp chiến lược trước hết đều được đánh giá và đo lường dựa trên giá trị bảo vệ an ninh trật tự."
 VIE_sez_idea:0 "Các Đặc khu Kinh tế"
 VIE_sez_idea_desc:0 "Ba khu kinh tế ven biển (Vân Đồn, Bắc Vân Phong, Phú Quốc) vận hành theo các cơ chế thể chế vượt trội, ưu đãi tối đa cho nhà đầu tư."
 VIE_leases_idea:0 "Thời hạn Thuê đất 99 Năm"
 VIE_leases_idea_desc:0 "Các nhà đầu tư được quyền thuê đất dài hạn tới gần một thế kỷ, trong đó có những tập đoàn tài chính rất lớn."
 VIE_courts_idea:0 "Tòa án Thương mại Riêng tại Đặc khu"
 VIE_courts_idea_desc:0 "Các tòa án chuyên trách với sự tham gia của các thẩm phán quốc tế được thành lập để phân xử các tranh chấp kinh doanh."
 VIE_flat_tax_idea:0 "Mức Thuế suất Đồng đều"
 VIE_flat_tax_idea_desc:0 "Một mức thuế suất ưu đãi thấp áp dụng chung cho mọi đối tượng, vô tình làm nới rộng khoảng cách giàu nghèo."
 VIE_expanded_zones_idea:0 "Mở rộng Mô hình Đặc khu"
 VIE_expanded_zones_idea_desc:0 "Mô hình đặc khu kinh tế được nhân rộng sang nhiều tỉnh thành khác, kéo theo những tranh cãi pháp lý phức tạp."
 VIE_charter_state_idea:0 "Nhà nước Thể chế Đặc khu"
 VIE_charter_state_idea_desc:0 "Toàn bộ đất nước nay được vận hành theo các luật lệ và cơ chế của các đặc khu thương mại tự do."
 VIE_sez_unrest_idea:0 "Làn sóng Biểu tình Phản đối Thuê đất"
 VIE_sez_unrest_idea_desc:0 "Đám đông nhân dân xuống đường phản đối việc cho các tập đoàn nước ngoài thuê đất dài hạn tại các vị trí nhạy cảm."
 VIE_bailout_idea:0 "Giải cứu Hệ thống Ngân hàng"
 VIE_bailout_idea_desc:0 "Nhà nước đứng ra tiếp quản và bảo lãnh các khoản nợ xấu khổng lồ của các ngân hàng thương mại cổ phần lớn nhất."
 VIE_conglomerate_council_idea:0 "Hội đồng Các Đại tập đoàn"
 VIE_conglomerate_council_idea_desc:0 "Những người đứng đầu các tập đoàn tư nhân khổng lồ có chân chính thức trong các cơ quan hoạch định chính sách quốc gia."
 VIE_media_ownership_idea:0 "Truyền thông Thuộc Sở hữu Tập đoàn"
 VIE_media_ownership_idea_desc:0 "Các tập đoàn lớn thâu tóm các cơ quan báo chí và kênh truyền hình trọng yếu, khiến những thông tin trái chiều ngày càng hiếm hoi."
 VIE_real_estate_boom_idea:0 "Cơn Sốt Đất Toàn diện"
 VIE_real_estate_boom_idea_desc:0 "Giá đất và nhà ở tăng phi mã đi kèm với làn sóng vay nợ khổng lồ. §RBong bóng tài sản chắc chắn sẽ đổ vỡ nếu không được hạ nhiệt kịp thời.§!"
 VIE_bubble_burst_idea:0 "Thị trường Bất động sản Sụp đổ"
 VIE_bubble_burst_idea_desc:0 "Bong bóng bất động sản đổ vỡ khiến các ngân hàng và hàng trăm ngàn người mua nhà rơi vào tình cảnh khốn đốn."
 VIE_bubble_burst_mild_idea:0 "Bất động sản Hạ nhiệt An toàn"
 VIE_bubble_burst_mild_idea_desc:0 "Các chính sách siết tín dụng kịp thời đã giúp thị trường bất động sản hạ nhiệt an toàn mà không làm đổ vỡ hệ thống."
 VIE_oligarch_reform_idea:0 "Cải cách Từ Bên trong"
 VIE_oligarch_reform_idea_desc:0 "Sức ảnh hưởng quá lớn của các tập đoàn tư nhân đối với nhà nước đã bị kiềm chế, song phải trả một cái giá không nhỏ."
 VIE_wa_council_idea:0 "Hội đồng Phát triển Quốc gia"
 VIE_wa_council_idea_desc:0 "Hội đồng gồm các tướng lĩnh và nhà kỹ trị điều hành toàn bộ nền kinh tế hướng về mục tiêu xuất khẩu thần tốc."
 VIE_wa_champions_idea:0 "Các Chaebol Kiểu Việt"
 VIE_wa_champions_idea_desc:0 "Một nhóm nhỏ các tập đoàn tư nhân ưu tú được rót tín dụng, nhận hợp đồng lớn và gánh vác các chỉ tiêu xuất khẩu quốc gia."
 VIE_wa_export_idea:0 "Xuất khẩu Hay Là Chết"
 VIE_wa_export_idea_desc:0 "Mọi nhà máy, xí nghiệp đều phải tìm kiếm và chinh phục các đơn hàng từ khách hàng quốc tế."
 VIE_wa_heavy_idea:0 "Công nghiệp Nặng và Hóa chất"
 VIE_wa_heavy_idea_desc:0 "Luyện thép, đóng tàu và tổ hợp hóa dầu được xây dựng với quy mô khổng lồ bằng nguồn vốn tín dụng nhà nước."
 VIE_wa_labor_idea:0 "Kiểm soát Chặt chẽ Lao động"
 VIE_wa_labor_idea_desc:0 "Các nghiệp đoàn độc lập bị nghiêm cấm và tiền lương được giữ ở mức thấp để tối đa hóa sức cạnh tranh."
 VIE_post_collapse_idea:0 "Tái thiết Hậu Chiến tranh"
 VIE_post_collapse_idea_desc:0 "Đô thị đổ nát, mạng lưới đường sá giao thông và niềm tin xã hội đều cần phải được gây dựng lại từ đầu."
 VIE_public_admin_idea:0 "Cải cách Nền Hành chính"
 VIE_public_admin_idea_desc:0 "Cơ chế một cửa liên thông và quy trình thủ tục rõ ràng giúp giảm đáng kể gánh nặng giấy tờ cho người dân và doanh nghiệp."
 VIE_clean_cadres_idea:0 "Đội ngũ Cán bộ Liêm chính"
 VIE_clean_cadres_idea_desc:0 "Kê khai tài sản minh bạch, công tác thanh tra kiểm tra biến sự liêm khiết thành tiêu chuẩn bắt buộc cho sự nghiệp của cán bộ."
 VIE_two_tier_gov_idea:0 "Chính quyền Địa phương Hai Cấp"
 VIE_two_tier_gov_idea_desc:0 "Với việc bãi bỏ cấp quận/huyện trung gian, các quyết sách được truyền đạt và xử lý thần tốc giữa cấp tỉnh và cấp xã phường."
 VIE_bank_health_idea:0 "Làm sạch Bảng Cân đối Ngân hàng"
 VIE_bank_health_idea_desc:0 "Các khoản nợ xấu được chuyển giao cho công ty quản lý tài sản xử lý, giúp hệ thống tổ chức tín dụng ngày càng vững mạnh hơn."
 VIE_investment_grade_idea:0 "Xếp hạng Tín nhiệm Mức Đầu tư"
 VIE_investment_grade_idea_desc:0 "Các tổ chức xếp hạng tín nhiệm quốc tế đánh giá Việt Nam là một điểm đến an toàn, hấp dẫn cho dòng vốn dài hạn."
 VIE_rice_power_idea:0 "Cường quốc Xuất khẩu Nông sản"
 VIE_rice_power_idea_desc:0 "Người nông dân không chỉ bảo đảm vững chắc an ninh lương thực quốc gia mà còn tự hào nuôi sống hàng chục triệu người trên thế giới."
 VIE_shared_future_idea:0 "Cộng đồng Chia sẻ Tương lai"
 VIE_shared_future_idea_desc:0 "Hà Nội và Bắc Kinh định hình mối quan hệ trong một khuôn khổ giúp duy trì hòa bình ổn định, dù phải trả một mức giá nhất định."
 VIE_tourism_idea:0 "Điểm đến Hàng đầu Châu Á"
 VIE_tourism_idea_desc:0 "Bãi biển tuyệt đẹp, danh lam thắng cảnh và di sản văn hóa nghìn năm thu hút hàng chục triệu lượt du khách quốc tế mỗi năm."
 VIE_diaspora_idea:0 "Gắn kết Nguồn lực Kiều bào"
 VIE_diaspora_idea_desc:0 "Kiều hối dồi dào và những người tài trở về cống hiến gắn kết đất nước chặt chẽ với hàng triệu đồng bào xa xứ."
 VIE_developed_nation_idea:0 "Quốc gia Phát triển Có Thu nhập Cao"
 VIE_developed_nation_idea_desc:0 "Mục tiêu lịch sử đặt ra năm 2021 đã thành hiện thực: Việt Nam trở thành một quốc gia thịnh vượng, hiện đại và văn minh."
 VIE_export_power_idea:0 "Cường quốc Xuất khẩu Toàn cầu"
 VIE_export_power_idea_desc:0 "Hàng hóa 'Made in Vietnam' hiện diện trên khắp các châu lục và kim ngạch xuất nhập khẩu vượt xa quy mô tổng sản phẩm quốc nội."
 VIE_manufacturing_hub_idea:0 "Công xưởng Sản xuất Đông Nam Á"
 VIE_manufacturing_hub_idea_desc:0 "Thiết bị điện tử, hàng dệt may và máy móc tinh xảo cho các thương hiệu hàng đầu thế giới đều được lắp ráp sản xuất tại đây."
 VIE_private_engine_idea:0 "Kinh tế Tư nhân là Động lực Quan trọng"
 VIE_private_engine_idea_desc:0 "Khu vực kinh tế tư nhân được chính thức tôn vinh là một trong những động lực tăng trưởng then chốt của nền kinh tế."
 VIE_hydro_idea:0 "Trụ cột Nguồn Thủy điện"
 VIE_hydro_idea_desc:0 "Các công trình đại thủy điện Sơn La và Hòa Bình cung cấp nguồn điện năng dồi dào, giá rẻ và ổn định cho sự phát triển của miền Bắc."
 VIE_power_plan_idea:0 "Quy hoạch Phát triển Điện VIII"
 VIE_power_plan_idea_desc:0 "Quy hoạch dài hạn bảo đảm cân đối tối ưu giữa nhiệt điện khí, năng lượng tái tạo, nhập khẩu điện và hệ thống truyền tải."
 VIE_ports_idea:0 "Hệ thống Cảng Biển Nước sâu"
 VIE_ports_idea_desc:0 "Cảng Lạch Huyện ở miền Bắc và Cái Mép - Thị Vải ở miền Nam đón được những siêu tàu container tải trọng lớn nhất thế giới."
 VIE_peoples_defence_idea:0 "Nền Quốc phòng Toàn dân"
 VIE_peoples_defence_idea_desc:0 "Mỗi người dân và mỗi cấp chính quyền đều có trách nhiệm thiêng liêng và đóng góp cụ thể vào công cuộc bảo vệ tổ quốc."
 VIE_law_of_sea_idea:0 "Luật Biển Việt Nam"
 VIE_law_of_sea_idea_desc:0 "Chủ quyền và quyền tài phán biển đảo của Việt Nam được luật hóa rõ ràng và làm căn cứ pháp lý vững chắc trong mọi tranh chấp."
 VIE_coast_guard_idea:0 "Lực lượng Cảnh sát Biển Hiện đại"
 VIE_coast_guard_idea_desc:0 "Hành lang pháp lý rõ ràng cùng phi đội tàu tuần tra hiện đại giúp Cảnh sát biển tự tin bảo vệ chủ quyền và hỗ trợ ngư dân."
 VIE_partner_network_idea:0 "Mạng lưới Đối tác Đa phương Hùng hậu"
 VIE_partner_network_idea_desc:0 "Mối quan hệ sâu rộng với các nước Châu Á, Châu Âu, Vùng Vịnh và Phương Nam giúp Việt Nam không bị lệ thuộc vào bất kỳ đối tác đơn lẻ nào."
 VIE_reserve_force_idea:0 "Lực lượng Dự bị Động viên Hùng hậu"
 VIE_reserve_force_idea_desc:0 "Hàng triệu công dân đã qua huấn luyện quân sự có thể nhanh chóng được tổng động viên để bổ sung sức mạnh cho quân đội chính quy."
 VIE_cam_ranh_idea:0 "Cảng Quốc tế Cam Ranh"
 VIE_cam_ranh_idea_desc:0 "Tàu chiến và tàu thương mại từ nhiều quốc gia ra vào tiếp tế và bảo dưỡng tại Cam Ranh. Không một quốc gia nào được lập căn cứ riêng."
 VIE_air_dominance_idea:0 "Làm chủ Vùng trời Duyên hải"
 VIE_air_dominance_idea_desc:0 "Tiêm kích phòng không, radar cảnh giới tầm xa và các trận địa tên lửa tạo nên chiếc ô bảo vệ vững chắc cho bờ biển và hải đảo."
 VIE_dual_use_idea:0 "Công nghiệp Quốc phòng Lưỡng dụng"
 VIE_dual_use_idea_desc:0 "Các doanh nghiệp quốc phòng sản xuất hàng tiêu dùng và các doanh nghiệp dân sự tham gia nghiên cứu chế tạo khí tài cho quân đội."
 VIE_english_idea:0 "Phổ cập Tiếng Anh như Ngôn ngữ Thứ hai"
 VIE_english_idea_desc:0 "Trường học giảng dạy song ngữ giúp thế hệ trẻ tự tin làm việc và hội nhập sâu rộng trong môi trường các tập đoàn đa quốc gia."
 VIE_preventive_health_idea:0 "Hệ thống Y tế Dự phòng"
 VIE_preventive_health_idea_desc:0 "Khám sàng lọc, tiêm chủng đầy đủ và trạm y tế cơ sở vững mạnh giúp ngăn chặn mầm bệnh trước khi bùng phát thành đại dịch."
 VIE_digital_nation_idea:0 "Quốc gia Số Toàn diện"
 VIE_digital_nation_idea_desc:0 "Chính phủ, ngân hàng và hoạt động thương mại đều vận hành trên nền tảng số đồng bộ, đưa hầu hết mọi người dân lên môi trường mạng."
 VIE_science_breakthrough_idea:0 "Đột phá Khoa học và Công nghệ"
 VIE_science_breakthrough_idea_desc:0 "Nghị quyết 57 xác định đầu tư cho nghiên cứu khoa học, kỹ năng số và đổi mới sáng tạo là ưu tiên số một của ngân sách quốc gia."
 VIE_chip_sector_idea:0 "Ngành Công nghiệp Vi mạch Bán dẫn"
 VIE_chip_sector_idea_desc:0 "Các trung tâm thiết kế, nhà máy đóng gói thử nghiệm và dây chuyền chế tạo wafer đầu tiên hình thành ngành bán dẫn quốc gia."
 VIE_singapore_model_idea:0 "Mô hình Singapore"
 VIE_singapore_model_idea_desc:0 "Đội ngũ công chức mẫn cán tài năng, thượng tôn pháp luật nghiêm minh và thị trường mở: một nhà nước kỹ trị lấy hiệu quả làm thước đo."
 VIE_ideological_fortress_idea:0 "Pháo đài Tư tưởng Kiên định"
 VIE_ideological_fortress_idea_desc:0 "Trường học, báo chí truyền thông và chi bộ cơ sở bảo vệ vững chắc nền tảng tư tưởng, kiên quyết chống lại sự can thiệp từ bên ngoài."
 VIE_eastern_yugoslavia_idea:0 "Liên bang Nam Tư của Phương Đông"
 VIE_eastern_yugoslavia_idea_desc:0 "Việt Nam trở thành trái tim của phong trào không liên kết, kiên trì đi trên con đường riêng và có bạn bè khắp bốn phương."
 VIE_economic_miracle_idea:0 "Kỳ tích Kinh tế Thần kỳ"
 VIE_economic_miracle_idea_desc:0 "Tốc độ tăng trưởng kinh tế gần 10% mỗi năm liên tục trong nhiều thập kỷ đã biến một quốc gia nghèo nàn thành một đất nước giàu mạnh."
 VIE_energy_security_idea:0 "An ninh Năng lượng Quốc gia"
 VIE_energy_security_idea_desc:0 "Hệ thống điện hòa lưới thủy điện, nhiệt điện khí, điện gió, mặt trời và nhập khẩu điện giúp thắp sáng đất nước qua những năm hạn hán."

 ### Phase 2 focuses (generated)
 VIE_mass_mobilization:0 "Tổ chức Quần chúng ở Cơ sở"
 VIE_mass_mobilization_desc:0 "Mặt trận Tổ quốc, Công đoàn, Hội Phụ nữ và Hội Nông dân truyền tải các chủ trương, đường lối của Đảng đến từng khu phố, thôn bản."
 VIE_rule_of_law_state:0 "Nhà nước Pháp quyền XHCN"
 VIE_rule_of_law_state_desc:0 "Bản Hiến pháp mới cùng hàng loạt bộ luật được ban hành giúp cho sự điều hành của nhà nước minh bạch hơn và mở rộng quyền hạn cho hệ thống tòa án."
 VIE_party_discipline:0 "Kỷ luật Đảng: Chiến dịch Đốt lò"
 VIE_party_discipline_desc:0 "Không có bất kỳ ai, dù giữ cương vị cao đến đâu, đứng trên kỷ luật của Đảng. Những kẻ từng nhắm mắt làm ngơ nay phải giật mình nhìn lại."
 VIE_streamline_apparatus:0 "Tinh gọn Tổ chức Bộ máy"
 VIE_streamline_apparatus_desc:0 "Sáp nhập các bộ ngành, xóa bỏ các cơ quan chồng chéo chức năng và tinh giản biên chế hành chính."
 VIE_provincial_merger:0 "Sáp nhập Các Tỉnh thành"
 VIE_provincial_merger_desc:0 "63 tỉnh thành được sắp xếp lại thành 34 tỉnh thành và bãi bỏ cấp quận/huyện trung gian. Bộ máy chính quyền địa phương trở nên tinh gọn và quy mô hơn."
 VIE_era_of_rising:0 "Kỷ nguyên Vươn mình của Dân tộc"
 VIE_era_of_rising_desc:0 "Sau Đại hội Đảng lần thứ XIV, ban lãnh đạo xác định tầm nhìn chiến lược tới năm 2045: trở thành một quốc gia phát triển có thu nhập cao."
 VIE_state_conglomerates:0 "Tập đoàn Kinh tế Nhà nước"
 VIE_state_conglomerates_desc:0 "Các tập đoàn nhà nước quy mô lớn gánh vác sứ mệnh dẫn dắt công nghiệp hóa đất nước, thông qua việc huy động vốn vay trong và ngoài nước. §RDoanh nghiệp càng phình to, rủi ro sụp đổ càng lớn.§!"
 VIE_petrovietnam_expansion:0 "Mở rộng Tập đoàn Dầu khí Quốc gia"
 VIE_petrovietnam_expansion_desc:0 "Khai thác các lô dầu khí ngoài khơi, xây dựng nhà máy lọc dầu và các tuyến đường ống dẫn khí. Một số lô dầu khí tiềm năng nhất lại nằm trong vùng biển tranh chấp phức tạp."
 VIE_formosa_steel_complex:0 "Tổ hợp Gang thép Hà Tĩnh"
 VIE_formosa_steel_complex_desc:0 "Đại tổ hợp luyện gang thép liên hợp quy mô lớn tại bờ biển miền Trung do nhà đầu tư Đài Loan xây dựng. Dự án tạo việc làm cho hàng ngàn lao động nhưng đòi hỏi sự giám sát môi trường nghiêm ngặt."
 VIE_bauxite_tay_nguyen:0 "Khai thác Bauxite Tây Nguyên"
 VIE_bauxite_tay_nguyen_desc:0 "Các tổ hợp dự án khai thác bauxite và luyện alumina tại vùng đất đỏ Tây Nguyên. Nhiều nhà khoa học và dư luận lo ngại về vấn đề bùn đỏ và nhà thầu thi công."
 VIE_private_champions:0 "Tập đoàn Kinh tế Tư nhân Tiên phong"
 VIE_private_champions_desc:0 "Khuyến khích các tập đoàn tư nhân lớn trong lĩnh vực bất động sản, bán lẻ, công nghiệp ô tô và công nghệ vươn tầm đủ lớn để cạnh tranh sòng phẳng trên trường quốc tế."
 VIE_north_south_expressway:0 "Đại lộ Cao tốc Bắc - Nam"
 VIE_north_south_expressway_desc:0 "Tuyến đường bộ cao tốc huyết mạch thông suốt từ Lạng Sơn đến mũi Cà Mau. Công trình đòi hỏi nguồn vốn đầu tư khổng lồ và đem lại giá trị lan tỏa qua nhiều thập kỷ."
 VIE_cptpp_member:0 "Gia nhập Hiệp định CPTPP"
 VIE_cptpp_member_desc:0 "Hiệp định chính thức có hiệu lực với Việt Nam vào ngày 14 tháng 1 năm 2019, mở ra các thị trường bờ Thái Bình Dương và đòi hỏi các tiêu chuẩn lao động khắt khe hơn."
 VIE_evfta:0 "Hiệp định Thương mại Tự do Việt Nam - EU"
 VIE_evfta_desc:0 "Có hiệu lực từ ngày 1 tháng 8 năm 2020, EVFTA từng bước xóa bỏ gần như toàn bộ thuế quan trong giao thương hàng hóa giữa Việt Nam và Liên minh Châu Âu."
 VIE_semiconductor_ambition:0 "Chiến lược Bán dẫn và AI"
 VIE_semiconductor_ambition_desc:0 "Đóng gói vi mạch, trung tâm thiết kế bán dẫn và các trung tâm dữ liệu được xác định là ngành kinh tế mũi nhọn. Nguồn nhân lực chất lượng cao là nút thắt cần tháo gỡ."
 VIE_resolution_57_68:0 "Nghị quyết Đột phá 57 và 68"
 VIE_resolution_57_68_desc:0 "Khoa học công nghệ, chuyển đổi số và khu vực kinh tế tư nhân được xác định là những cỗ xe kéo chính cho tăng trưởng kinh tế đất nước."
 VIE_north_south_hsr:0 "Đường sắt Tốc độ cao Bắc - Nam"
 VIE_north_south_hsr_desc:0 "Tuyến đường sắt đôi tốc độ thiết kế 350 km/h nối liền Hà Nội và TP. Hồ Chí Minh. Đây là siêu dự án hạ tầng giao thông quy mô lớn nhất trong lịch sử đất nước."
 VIE_long_thanh_airport:0 "Cảng Hàng không Quốc tế Long Thành"
 VIE_long_thanh_airport_desc:0 "Trung tâm trung chuyển hàng không quốc tế của miền Nam đặt tại phía đông TP. Hồ Chí Minh, được quy hoạch để vươn lên tầm cỡ các sân bay lớn nhất khu vực."
 VIE_ninh_thuan_nuclear:0 "Chủ trương Điện hạt nhân Ninh Thuận"
 VIE_ninh_thuan_nuclear_desc:0 "Việt Nam xem xét phát triển những nhà máy điện hạt nhân đầu tiên cùng các đối tác quốc tế. Quyết định này sẽ còn được bàn thảo kỹ lưỡng qua nhiều thời kỳ."
 VIE_build_nuclear_plant:0 "Xây dựng Nhà máy Điện hạt nhân Ninh Thuận"
 VIE_build_nuclear_plant_desc:0 "§YTiến trình lịch sử giả định.§! Quyết định xúc tiến thi công các tổ máy điện hạt nhân với sự hợp tác của Nga và Nhật Bản bất chấp kinh phí lớn."
 VIE_shelve_nuclear:0 "Tạm dừng Chương trình Điện hạt nhân"
 VIE_shelve_nuclear_desc:0 "Chi phí đầu tư quá lớn và những lo ngại về an toàn chưa thể giải quyết trọn vẹn. Dự án được tạm dừng để điều chuyển nguồn vốn sang các lĩnh vực cấp bách khác."
 VIE_revive_nuclear:0 "Tái khởi động Chương trình Điện hạt nhân"
 VIE_revive_nuclear_desc:0 "Nguy cơ thiếu hụt điện năng và mục tiêu chống biến đổi khí hậu đưa điện hạt nhân trở lại bàn nghị sự, với quy hoạch các lò phản ứng module thế hệ mới."
 VIE_net_zero_2050:0 "Cam kết Đạt Net Zero vào Năm 2050"
 VIE_net_zero_2050_desc:0 "Tại COP26, Việt Nam đưa ra cam kết lịch sử đạt mức phát thải ròng bằng '0' vào giữa thế kỷ. Nguồn lực lưới điện, điện gió, mặt trời và tài chính xanh phải đồng loạt vào cuộc."
 VIE_modernize_vpa:0 "Hiện đại hóa Quân đội Nhân dân"
 VIE_modernize_vpa_desc:0 "Xây dựng lực lượng quân đội tinh gọn, thiện chiến, trang bị khí tài hiện đại theo phương châm hiện đại hóa có trọng tâm trọng điểm thay vì phát triển quân số ồ ạt."
 VIE_russian_arms_deals:0 "Các Hợp đồng Mua sắm Vũ khí với Nga"
 VIE_russian_arms_deals_desc:0 "Tiêm kích Su-30, tàu ngầm Kilo và các tổ hợp tên lửa Bastion được mua từ Liên bang Nga với mức giá ưu đãi và các điều kiện tín dụng dài hạn."
 VIE_su30mk2_fleet:0 "Phi đội Tiêm kích Đa năng Su-30MK2"
 VIE_su30mk2_fleet_desc:0 "Hơn 30 chiếc 'Hổ mang chúa' Flanker lần đầu tiên mang lại cho Không quân Nhân dân Việt Nam tầm tác chiến vươn xa kiểm soát bầu trời Biển Đông."
 VIE_kilo_submarines:0 "Lữ đoàn 6 Tàu ngầm Kilo"
 VIE_kilo_submarines_desc:0 "Hợp đồng trang bị 6 tàu ngầm diesel-điện tối tân cùng căn cứ huấn luyện hiện đại tại Cam Ranh. Một thông điệp răn đe chiến lược mạnh mẽ mà không cần nổ một phát súng."
 VIE_bastion_p_coastal_defence:0 "Khẩu đội Tên lửa Bờ Bastion-P"
 VIE_bastion_p_coastal_defence_desc:0 "Các tổ hợp tên lửa bờ cơ động Bastion-P trang bị tên lửa Yakhont có khả năng tiêu diệt chiến hạm đối phương ở khoảng cách hàng trăm cây số ngoài khơi."
 VIE_viettel_military_tech:0 "Tổ hợp Công nghiệp Quốc phòng Viettel"
 VIE_viettel_military_tech_desc:0 "Hệ thống radar cảnh giới, máy bay không người lái, khí tài tác chiến điện tử và mạng thông tin liên lạc bảo mật do Viettel chế tạo giúp giảm dần sự phụ thuộc vào nhập khẩu."
 VIE_force_47:0 "Lực lượng 47 và Tác chiến Không gian mạng"
 VIE_force_47_desc:0 "Lực lượng tác chiến không gian mạng chuyên trách được thành lập vào tháng 12 năm 2017 nhằm bảo vệ hạ tầng mạng và đấu tranh phản bác các quan điểm sai trái, thù địch."
 VIE_provincial_defence_zones:0 "Xây dựng Khu vực Phòng thủ Cấp tỉnh"
 VIE_provincial_defence_zones_desc:0 "Mỗi tỉnh, thành phố trực thuộc trung ương xây dựng khu vực phòng thủ vững chắc, khiến kẻ thù không thể tìm thấy bất kỳ mắt xích yếu nào trên toàn tuyến."
 VIE_maritime_militia:0 "Hải đội Dân quân Tự vệ Biển"
 VIE_maritime_militia_desc:0 "Các đội tàu đánh cá của ngư dân được tổ chức huấn luyện bài bản để sẵn sàng bám biển, theo dõi và kiên cường bảo vệ chủ quyền quốc gia."
 VIE_spratly_fortification:0 "Củng cố Công trình Điểm đảo Trường Sa"
 VIE_spratly_fortification_desc:0 "Bồi đắp đảo và xây dựng thêm các công trình kiên cố bảo vệ vững chắc các điểm đảo mà Việt Nam đang đóng giữ tại Quần đảo Trường Sa."
 VIE_four_nos_doctrine:0 "Học thuyết Quốc phòng 'Bốn Không'"
 VIE_four_nos_doctrine_desc:0 "Không liên minh quân sự; không liên kết với nước này chống nước kia; không cho đặt căn cứ quân sự; không dùng vũ lực. Sách trắng Quốc phòng 2019 nâng tầm nguyên tắc này thành học thuyết cốt lõi."
 VIE_asean_chair:0 "Đảm nhiệm Chủ tịch ASEAN"
 VIE_asean_chair_desc:0 "Việt Nam giữ cương vị Chủ tịch luân phiên của ASEAN (năm 2010 và 2020), chủ trì các hội nghị cấp cao và định hình chương trình nghị sự khu vực."
 VIE_un_security_council:0 "Ủy viên Hội đồng Bảo an LHQ"
 VIE_un_security_council_desc:0 "Việt Nam đảm nhiệm cương vị Ủy viên không thường trực Hội đồng Bảo an Liên Hợp Quốc trong các nhiệm kỳ 2008-2009 và 2020-2021 với số phiếu tín nhiệm kỷ lục."
 VIE_us_comprehensive_partnership:0 "Đối tác Toàn diện với Hoa Kỳ"
 VIE_us_comprehensive_partnership_desc:0 "Năm 2013, Hà Nội và Washington chính thức xác lập quan hệ Đối tác Toàn diện, đặt nền móng hợp tác sâu rộng trên nhiều lĩnh vực."
 VIE_us_embargo_lifted:0 "Dỡ bỏ Hoàn toàn Cấm vận Vũ khí"
 VIE_us_embargo_lifted_desc:0 "Tuyên bố lịch sử năm 2016 mở toang cánh cửa tiếp cận vũ khí phương Tây mà không làm suy chuyển nguyên tắc Bốn Không của quốc phòng Việt Nam."
 VIE_csp_network:0 "Mạng lưới Đối tác Chiến lược Toàn diện"
 VIE_csp_network_desc:0 "Đến năm 2023, Việt Nam đã nâng cấp quan hệ với Hoa Kỳ và nhiều cường quốc lớn lên mức quan hệ ngoại giao cao nhất: Đối tác Chiến lược Toàn diện."
 VIE_bamboo_diplomacy:0 "Trường phái Ngoại giao Cây tre"
 VIE_bamboo_diplomacy_desc:0 "Gốc vững, thân chắc, cành uyển chuyển. Việt Nam giữ mối bang giao hữu nghị với mọi cường quốc và kiên quyết không chọn bên."
 VIE_special_relations_laos:0 "Quan hệ Đặc biệt Thủy chung với Lào"
 VIE_special_relations_laos_desc:0 "Tình đồng chí kề vai sát cánh và láng giềng gần gũi: hợp tác quốc phòng an ninh, thương mại biên mậu và khai thác thủy điện gắn kết keo sơn hai dân tộc."
 VIE_cambodia_relations:0 "Hợp tác Toàn diện với Campuchia"
 VIE_cambodia_relations_desc:0 "Phân giới cắm mốc biên giới, đẩy mạnh thương mại song phương và hợp tác bảo vệ nguồn nước sông Mekong với Phnom Penh."
 VIE_education_reform:0 "Đổi mới Căn bản Toàn diện Giáo dục"
 VIE_education_reform_desc:0 "Trao quyền tự chủ đại học, đầu tư cho các trường nghề, đưa tiếng Anh và kỹ năng số trở thành trọng tâm trong chương trình đào tạo."
 VIE_universal_health_insurance:0 "Bảo hiểm Y tế Toàn dân"
 VIE_universal_health_insurance_desc:0 "Mở rộng độ bao phủ của bảo hiểm y tế công lập tới hầu hết mọi tầng lớp nhân dân trong xã hội."
 VIE_vinasat:0 "Chương trình Vệ tinh Viễn thông VINASAT"
 VIE_vinasat_desc:0 "Phóng thành công các vệ tinh viễn thông VINASAT-1 (2008) và VINASAT-2 (2012), khẳng định chủ quyền của Việt Nam trên không gian vũ trụ."
 VIE_national_digital_transformation:0 "Chuyển đổi Số Quốc gia"
 VIE_national_digital_transformation_desc:0 "Định danh điện tử, dịch vụ công trực tuyến, thanh toán không dùng tiền mặt và cáp quang băng thông rộng vươn tới mọi xã phường."
 VIE_viettel_global:0 "Viettel Vươn ra Thị trường Quốc tế"
 VIE_viettel_global_desc:0 "Các mạng viễn thông của Viettel tại Campuchia, Lào, Peru, Mozambique và nhiều quốc gia khác mang lại nguồn doanh thu ngoại tệ và nâng tầm vị thế quốc gia."
 VIE_mekong_climate_adaptation:0 "Thích ứng Biến đổi Khí hậu Miền Tây"
 VIE_mekong_climate_adaptation_desc:0 "Phát triển các giống lúa chịu mặn, xây dựng hệ thống cống âu kiểm soát triều cường và chuyển đổi cơ cấu sản xuất nông nghiệp sang nuôi tôm, trồng cây ăn trái."
 VIE_disaster_preparedness:0 "Chủ động Phòng chống Thiên tai"
 VIE_disaster_preparedness_desc:0 "Cảnh báo sớm, quy trình sơ tán đồng bộ, nâng cấp hệ thống đê điều và trao quyền chủ động cho chính quyền cơ sở theo phương châm 4 tại chỗ."
 VIE_developmental_state:0 "Nhà nước Kiến tạo Phát triển"
 VIE_developmental_state_desc:0 "Một nhà nước đồng hành cùng doanh nghiệp, đầu tư cho giáo dục đào tạo và hạ tầng, lấy kết quả tăng trưởng thực chất làm thước đo hiệu quả."
 VIE_technocrat_cabinet:0 "Nội các Kỹ trị Tài năng"
 VIE_technocrat_cabinet_desc:0 "Các vị trí tư lệnh ngành được lựa chọn dựa trên năng lực chuyên môn và tầm nhìn khoa học thay vì chỉ xét thâm niên công tác."
 VIE_intra_party_elections:0 "Bầu cử Cạnh tranh trong Đảng"
 VIE_intra_party_elections_desc:0 "Đảng viên được quyền lựa chọn giữa nhiều ứng viên cho các vị trí lãnh đạo. Cơ chế Đảng trở nên cởi mở và dân chủ hơn."
 VIE_press_relaxation:0 "Nới lỏng Quản lý Báo chí"
 VIE_press_relaxation_desc:0 "Cho phép báo chí chủ động điều tra các sai phạm ở cấp địa phương, mở ra diễn đàn phản biện xã hội rộng rãi."
 VIE_environmental_accountability:0 "Trách nhiệm Giải trình Môi trường"
 VIE_environmental_accountability_desc:0 "Sau sự cố môi trường Formosa Hà Tĩnh, nguyên tắc doanh nghiệp gây ô nhiễm phải đền bù và tham vấn cộng đồng được thực thi nghiêm ngặt."
 VIE_managed_pluralism:0 "Đa nguyên Có Kiểm soát"
 VIE_managed_pluralism_desc:0 "Đảng Dân chủ và Đảng Xã hội, những tổ chức từng dừng hoạt động năm 1988, được phục hồi và tham gia một số ghế dân biểu có giới hạn."
 VIE_round_table_talks:0 "Hội đàm Bàn tròn Đa phương"
 VIE_round_table_talks_desc:0 "Chính phủ, các nhóm phản biện và đại diện xã hội dân sự ngồi lại cùng nhau đối thoại, dưới sự theo dõi cẩn trọng của phe bảo thủ."
 VIE_legalize_parties:0 "Hợp pháp hóa Các Đảng phái"
 VIE_legalize_parties_desc:0 "Các tổ chức chính trị được quyền đăng ký hoạt động và tham gia vận động bầu cử tự do."
 VIE_new_constitution:0 "Soạn thảo Bản Hiến pháp Mới"
 VIE_new_constitution_desc:0 "Một quốc hội lập hiến được bầu ra để xây dựng bản hiến chương bảo đảm quyền bầu cử tự do, tư pháp độc lập và quyền con người."
 VIE_first_free_election:0 "Cuộc Tổng Tuyển cử Tự do Đầu tiên"
 VIE_first_free_election_desc:0 "Lần đầu tiên trong ký ức của các thế hệ, cử tri được tự do bỏ phiếu lựa chọn giữa các đảng phái đối lập."
 VIE_consolidate_democracy:0 "Củng cố Thể chế Dân chủ"
 VIE_consolidate_democracy_desc:0 "Tòa án độc lập, báo chí tự do và chuyển giao quyền lực hòa bình. Thử thách khó khăn nhất bắt đầu sau cuộc bầu cử đầu tiên."
 VIE_defend_the_foundation:0 "Kiên định Bảo vệ Nền tảng"
 VIE_defend_the_foundation_desc:0 "Ý thức hệ của Đảng, nguyên tắc tập trung dân chủ và vai trò lãnh đạo tuyệt đối của Đảng được khẳng định là bất khả xâm phạm."
 VIE_state_sector_leading:0 "Khu vực Nhà nước Giữ Vai trò Chủ đạo"
 VIE_state_sector_leading_desc:0 "Các doanh nghiệp nhà nước được ưu tiên tiếp cận các nguồn tín dụng ưu đãi, quỹ đất đai và các gói thầu dự án trọng điểm."
 VIE_self_reliance:0 "Tự lực Cánh sinh Toàn diện"
 VIE_self_reliance_desc:0 "Đẩy mạnh sản xuất trong nước, nhập khẩu từ các quốc gia thân thiện và hạn chế tối đa sự lệ thuộc vào các thị trường thù địch."
 VIE_nationalize_foreign_assets:0 "Quốc hữu hóa Doanh nghiệp Nước ngoài"
 VIE_nationalize_foreign_assets_desc:0 "Tiếp quản các cơ sở sản xuất chiến lược do doanh nghiệp nước ngoài sở hữu. §RĐiều này sẽ châm ngòi cho sự phản đối dữ dội từ các nhà đầu tư quốc tế.§!"
 VIE_accept_chinese_influence:0 "Chấp nhận Sự Ảnh hưởng từ Bắc Kinh"
 VIE_accept_chinese_influence_desc:0 "Hà Nội lựa chọn phương án hòa hoãn và thuận theo tầm ảnh hưởng của người láng giềng khổng lồ phương Bắc. §RChính sách Bốn Không bị bãi bỏ.§!"
 VIE_join_bri:0 "Tham gia Sáng kiến Vành đai và Con đường"
 VIE_join_bri_desc:0 "Tiếp nhận các khoản vay vốn từ Trung Quốc để xây dựng đường sắt và cảng biển, chấp nhận các điều khoản ràng buộc về sau."
 VIE_socialist_bloc:0 "Khối Đoàn kết Xã hội Chủ nghĩa"
 VIE_socialist_bloc_desc:0 "Chính thức liên kết chặt chẽ về mọi mặt chính trị và quân sự với Trung Quốc và các nước đồng minh xã hội chủ nghĩa."
 VIE_pivot_to_the_west:0 "Chiến lược Ngả sang Phương Tây"
 VIE_pivot_to_the_west_desc:0 "Hà Nội quyết định ngả hẳn về phía Hoa Kỳ và các đồng minh phương Tây. §RChính sách Bốn Không bị từ bỏ và Bắc Kinh sẽ phản ứng quyết liệt.§!"
 VIE_military_cooperation_usa:0 "Hợp tác Quân sự Chặt chẽ với Hoa Kỳ"
 VIE_military_cooperation_usa_desc:0 "Tổ chức các cuộc diễn tập chung, đào tạo sĩ quan và mở cửa tiếp cận các dòng khí tài quân sự tiên tiến của Mỹ."
 VIE_indo_pacific_partner:0 "Đối tác An ninh Ấn Độ Dương - Thái Bình Dương"
 VIE_indo_pacific_partner_desc:0 "Việt Nam tham gia vào mạng lưới các đối tác khu vực nhằm thiết lập thế cân bằng chiến lược trước sự bành trướng của Trung Quốc."
 VIE_indochina_solidarity:0 "Đoàn kết Ba Nước Đông Dương"
 VIE_indochina_solidarity_desc:0 "Việt Nam, Lào và Campuchia phối hợp toàn diện về quốc phòng và đối ngoại. Ý tưởng lịch sử về một khối liên kết Đông Dương hồi sinh."
 VIE_indochina_federation:0 "Liên bang Đông Dương"
 VIE_indochina_federation_desc:0 "Hợp nhất ba quốc gia Đông Dương thành một liên bang thống nhất. Mở khóa quyết định thành lập quốc gia một khi kiểm soát đủ các vùng lãnh thổ yêu cầu."
 VIE_tc_strategic_autonomy:0 "Tuyên bố Tự chủ Chiến lược"
 VIE_tc_strategic_autonomy_desc:0 "Hà Nội kiên quyết không phục tùng bất kỳ cường quốc nào và không tham gia bất kỳ khối liên minh nào dưới sự lãnh đạo của Đảng. §RBắc Kinh sẽ phản ứng gay gắt.§!"
 VIE_tc_decouple_supply:0 "Tách rời Các Chuỗi Cung ứng"
 VIE_tc_decouple_supply_desc:0 "Chủ động thay thế nguồn nguyên phụ liệu từ Trung Quốc bằng nguồn nội địa và các nước thứ ba. §RMột đợt khan hiếm hàng hóa sắp diễn ra.§!"
 VIE_tc_self_management:0 "Mô hình Công nhân Tự quản"
 VIE_tc_self_management_desc:0 "Các xí nghiệp được điều hành bởi hội đồng đại biểu công nhân do tập thể bầu ra. Năng suất lao động tăng, quyền kiểm soát của bộ máy hành chính giảm."
 VIE_tc_russia_india_axis:0 "Trục Khí tài Quân sự Nga - Ấn"
 VIE_tc_russia_india_axis_desc:0 "Nhập khẩu vũ khí và tiếp nhận chuyển giao công nghệ từ hai người bạn truyền thống, bảo đảm không bị phụ thuộc vào một nguồn cung duy nhất."
 VIE_tc_global_south:0 "Tiếng nói của Thế giới Thứ ba"
 VIE_tc_global_south_desc:0 "Việt Nam vươn lên thành một trong những ngọn cờ đầu đại diện cho các quốc gia thuộc phong trào không liên kết."
 VIE_tc_armed_neutrality:0 "Đường lối Trung lập Vũ trang"
 VIE_tc_armed_neutrality_desc:0 "Một đất nước không chịu khuất phục trước bất kỳ ai và không đi bắt nạt ai. Nền quốc phòng hùng mạnh tự thân, không cần đồng minh."
 VIE_sec_cyber_control:0 "Kiểm soát Toàn diện Không gian mạng"
 VIE_sec_cyber_control_desc:0 "Lực lượng an ninh nắm quyền kiểm soát tuyệt đối mạng internet, truyền thông và hệ thống cơ sở dữ liệu ngân hàng."
 VIE_sec_surveillance_network:0 "Mạng lưới Giám sát Toàn dân"
 VIE_sec_surveillance_network_desc:0 "Hệ thống camera nhận diện, cộng tác viên và các trung tâm phân tích dữ liệu theo dõi mọi biến động trong đời sống xã hội."
 VIE_sec_security_economy:0 "Kinh tế Phục vụ Mục tiêu An ninh"
 VIE_sec_security_economy_desc:0 "Các ngành kinh tế chiến lược trước hết phải phục vụ tuyệt đối cho các yêu cầu bảo vệ an ninh trật tự của nhà nước."
 VIE_lb_sez_law:0 "Luật Các Đơn vị Hành chính - Kinh tế Đặc biệt"
 VIE_lb_sez_law_desc:0 "Thành lập ba đặc khu kinh tế (Vân Đồn, Bắc Vân Phong, Phú Quốc) với cơ chế thể chế mở vượt trội và chính sách ưu đãi thuê đất dài hạn."
 VIE_lb_99_year_leases:0 "Chính sách Cho thuê Đất 99 Năm"
 VIE_lb_99_year_leases_desc:0 "Nhà đầu tư được quyền thuê đất dài hạn tới gần một thế kỷ. Dòng vốn khổng lồ đổ về kéo theo làn sóng lo ngại sâu sắc trong nhân dân."
 VIE_lb_common_law_courts:0 "Tòa án Thương mại Áp dụng Thông luật"
 VIE_lb_common_law_courts_desc:0 "Thành lập các tòa án tài phán với sự tham gia của các thẩm phán quốc tế giúp bảo đảm tối đa niềm tin của giới đầu tư toàn cầu."
 VIE_lb_flat_tax:0 "Cơ chế Thuế suất Đồng đều"
 VIE_lb_flat_tax_desc:0 "Áp dụng một mức thuế suất thu nhập và doanh nghiệp duy nhất, cực kỳ thấp để kích thích tối đa dòng tiền đầu tư."
 VIE_lb_expand_zones:0 "Nhân rộng Mô hình Đặc khu"
 VIE_lb_expand_zones_desc:0 "Mô hình đặc khu kinh tế mở rộng ra nhiều địa phương khác, làm bùng phát thêm nhiều tranh chấp khiếu kiện đất đai."
 VIE_lb_charter_state:0 "Nhà nước Thể chế Doanh nghiệp"
 VIE_lb_charter_state_desc:0 "Cơ chế của các đặc khu thương mại tự do được áp dụng trên phạm vi toàn quốc. Bộ máy nhà nước trở thành một đơn vị cung cấp dịch vụ hành chính."
 VIE_ol_bailout:0 "Giải cứu Hệ thống Ngân hàng Cổ phần"
 VIE_ol_bailout_desc:0 "Nhà nước sử dụng các công cụ tài chính tiếp quản các khoản nợ xấu của các ngân hàng thương mại thuộc các đại tập đoàn."
 VIE_ol_conglomerate_council:0 "Hội đồng Đại diện Các Tập đoàn Tư nhân"
 VIE_ol_conglomerate_council_desc:0 "Những ông chủ đứng đầu các đại tập đoàn kinh tế nhóm họp hàng tháng cùng thường trực chính phủ để định hình các quyết sách lớn."
 VIE_ol_media_ownership:0 "Tư nhân hóa Các Kênh Truyền thông"
 VIE_ol_media_ownership_desc:0 "Các tập đoàn kinh tế tư nhân mua lại các tòa soạn báo và đài truyền hình, khiến những bài viết bất lợi cho doanh nghiệp biến mất."
 VIE_ol_real_estate_boom:0 "Cơn Sốt Bất động sản Lịch sử"
 VIE_ol_real_estate_boom_desc:0 "Dòng tín dụng giá rẻ đổ ồ ạt vào thị trường đất đai và nhà ở. Tăng trưởng bề nổi tăng vọt. §RBong bóng sẽ nổ tung sau hai năm nếu không kịp hạ nhiệt.§!"
 VIE_ol_reform_from_within:0 "Cải tổ Từ Nội bộ"
 VIE_ol_reform_from_within_desc:0 "Một nỗ lực đầy gian nan và tốn kém nhằm siết lại vòng kiềm tỏa, hạn chế sự thao túng chính sách của các nhóm lợi ích tài phiệt."
 VIE_wa_development_council:0 "Hội đồng Phát triển Quốc gia"
 VIE_wa_development_council_desc:0 "Phát triển thần tốc dựa vào xuất khẩu dưới sự điều hành của một chính quyền kỹ trị liên minh với Mỹ, theo mô hình kỳ tích sông Hàn của Park Chung-hee."
 VIE_wa_us_alliance:0 "Ký Hiệp ước An ninh với Hoa Kỳ"
 VIE_wa_us_alliance_desc:0 "Ký hiệp ước liên minh quân sự chính thức với Hoa Kỳ để đổi lấy chiếc ô bảo trợ an ninh hạt nhân và vũ khí hiện đại."
 VIE_wa_national_champions:0 "Xây dựng Các Tập đoàn Chaebol Việt Nam"
 VIE_wa_national_champions_desc:0 "Một nhóm nhỏ các tập đoàn kinh tế tư nhân được trao đặc quyền tiếp cận dòng vốn tín dụng rẻ và nhận nhiệm vụ xuất khẩu quốc gia."
 VIE_wa_export_drive:0 "Mệnh lệnh: Xuất khẩu Hay Là Chết"
 VIE_wa_export_drive_desc:0 "Mọi nhà máy, xí nghiệp đều bị áp chỉ tiêu xuất khẩu hàng hóa ra thị trường quốc tế khắt khe."
 VIE_wa_heavy_industry:0 "Phát triển Công nghiệp Nặng và Hóa chất"
 VIE_wa_heavy_industry_desc:0 "Tập trung vốn tín dụng nhà nước xây dựng các tổ hợp đại luyện kim, đóng tàu biển và hóa dầu quy mô thế giới."
 VIE_wa_suppress_labor:0 "Kiểm soát Chặt chẽ Lực lượng Lao động"
 VIE_wa_suppress_labor_desc:0 "Nghiêm cấm thành lập các công đoàn độc lập và giữ mặt bằng lương công nhân ở mức thấp để phục vụ mục tiêu cạnh tranh giá rẻ."
 VIE_national_assembly_role:0 "Nâng cao Thực quyền của Quốc hội"
 VIE_national_assembly_role_desc:0 "Các đại biểu chất vấn trực tiếp các bộ trưởng trên sóng truyền hình trực tiếp và các ủy ban thẩm tra kỹ lưỡng từng dòng ngân sách."
 VIE_ethnic_policy:0 "Chính sách Phát triển Vùng Đồng bào Dân tộc"
 VIE_ethnic_policy_desc:0 "Đầu tư đường sá, trường trạm cho các tỉnh miền núi, biên giới và tôn trọng bản sắc văn hóa các dân tộc anh em nhằm giữ vững an ninh trật tự."
 VIE_cybersecurity_law:0 "Thông qua Luật An ninh Mạng"
 VIE_cybersecurity_law_desc:0 "Ban hành khung pháp lý về lưu trữ dữ liệu tại Việt Nam và quản lý thông tin trên mạng, cân bằng giữa an ninh quốc gia và sự phát triển công nghệ."
 VIE_anti_corruption_law:0 "Luật Phòng chống Tham nhũng"
 VIE_anti_corruption_law_desc:0 "Quy định rõ ràng các nghĩa vụ minh bạch tài sản, cơ chế phát hiện và xử lý nghiêm các hành vi tiêu cực, nhũng nhiễu."
 VIE_asset_declaration:0 "Kê khai Minh bạch Tài sản Cán bộ"
 VIE_asset_declaration_desc:0 "Cán bộ lãnh đạo và người thân phải thực hiện kê khai trung thực các tài sản, bất động sản và tài khoản ngân hàng của mình."
 VIE_state_audit:0 "Nâng cao Vai trò Kiểm toán Nhà nước"
 VIE_state_audit_desc:0 "Kiểm toán độc lập ngân sách tại các bộ ngành và tập đoàn kinh tế nhà nước giúp phát hiện, thu hồi hàng ngàn tỷ đồng chi tiêu sai quy định."
 VIE_party_inspection:0 "Tăng cường Quyền hạn Ủy ban Kiểm tra"
 VIE_party_inspection_desc:0 "Cơ quan kiểm tra Đảng được trao quyền kiểm tra dấu hiệu vi phạm và kiến nghị thi hành kỷ luật đối với cả cán bộ cấp cao nhất."
 VIE_asset_recovery:0 "Kiên quyết Thu hồi Tài sản Thất thoát"
 VIE_asset_recovery_desc:0 "Cơ quan thi hành án kê biên và thu hồi triệt để các tài sản, bất động sản tham nhũng nộp lại về cho ngân sách nhà nước."
 VIE_clean_cadres:0 "Xây dựng Đội ngũ Cán bộ Liêm chính"
 VIE_clean_cadres_desc:0 "Sự trong sạch và uy tín trở thành tiêu chuẩn hàng đầu trong quy hoạch, bổ nhiệm; kiên quyết không bố trí những cán bộ có tài sản bất minh."
 VIE_public_admin_reform:0 "Cải cách Nền Hành chính Công"
 VIE_public_admin_reform_desc:0 "Áp dụng cơ chế một cửa hiện đại, đơn giản hóa tối đa các thủ tục hành chính nhằm phục vụ người dân và doanh nghiệp tốt nhất."
 VIE_decentralization:0 "Đẩy mạnh Phân cấp Phân quyền"
 VIE_decentralization_desc:0 "Trao thêm thẩm quyền quyết định đầu tư và ngân sách cho các địa phương, khơi dậy tinh thần năng động sáng tạo của cơ sở."
 VIE_e_government:0 "Phát triển Chính phủ Điện tử"
 VIE_e_government_desc:0 "Cung cấp các dịch vụ công trực tuyến mức độ cao, giúp xóa bỏ cảnh xếp hàng nộp hồ sơ giấy và ngăn chặn tiêu cực 'tham nhũng vặt'."
 VIE_merge_ministries:0 "Sáp nhập Các Bộ Ngành Trung ương"
 VIE_merge_ministries_desc:0 "Thực hiện sáp nhập các bộ ngành có chức năng tương đồng, giảm mạnh số lượng đầu mối và các tổng cục trung gian."
 VIE_two_tier_local_gov:0 "Chính quyền Địa phương Hai Cấp"
 VIE_two_tier_local_gov_desc:0 "Bãi bỏ cấp huyện trung gian, thiết lập mối liên kết chỉ đạo trực tiếp và thông suốt giữa cấp tỉnh và chính quyền cơ sở xã phường."
 VIE_institutional_bottlenecks:0 "Tháo gỡ Các Điểm nghẽn Thể chế"
 VIE_institutional_bottlenecks_desc:0 "Sửa đổi một luật sửa nhiều luật nhằm tháo gỡ khó khăn cho các dự án tồn đọng, khơi thông dòng vốn cho toàn nền kinh tế."
 VIE_party_centennial_2030:0 "Hướng tới Kỷ niệm 100 Năm Thành lập Đảng"
 VIE_party_centennial_2030_desc:0 "Đến năm 2030, Đảng tròn một thế kỷ lãnh đạo cách mạng Việt Nam, báo cáo trước quốc dân những thành tựu lịch sử vẻ vang đã đạt được."
 VIE_state_bank_modernization:0 "Hiện đại hóa Ngân hàng Nhà nước"
 VIE_state_bank_modernization_desc:0 "Tăng cường năng lực giám sát, hoàn thiện hệ thống thanh toán quốc gia và thực thi chính sách tiền tệ chủ động, linh hoạt kiểm soát lạm phát."
 VIE_fight_inflation:0 "Quyết liệt Kiềm chế Lạm phát"
 VIE_fight_inflation_desc:0 "Điều hành chính sách tiền tệ thận trọng, kiểm soát chặt chẽ tăng trưởng tín dụng để hạ nhiệt mặt bằng giá cả sinh hoạt."
 VIE_restructure_banking:0 "Tái cơ cấu Hệ thống Ngân hàng"
 VIE_restructure_banking_desc:0 "Xử lý căn bản các ngân hàng yếu kém thông qua sáp nhập bắt buộc, tăng vốn điều lệ và minh bạch hóa dòng tiền."
 VIE_vamc:0 "Công ty Quản lý Tài sản Quốc gia (VAMC)"
 VIE_vamc_desc:0 "Thành lập công ty VAMC để mua lại và xử lý các khoản nợ xấu từ các ngân hàng thương mại, khơi thông lại dòng vốn tín dụng."
 VIE_deposit_insurance:0 "Bảo hiểm Tiền gửi Nhân dân"
 VIE_deposit_insurance_desc:0 "Nâng hạn mức chi trả bảo hiểm tiền gửi nhằm bảo vệ người gửi tiền cá nhân và củng cố vững chắc niềm tin vào các nhà băng."
 VIE_cross_ownership_crackdown:0 "Xóa bỏ Tình trạng Sở hữu Chéo"
 VIE_cross_ownership_crackdown_desc:0 "Nghiêm cấm các đại gia dùng ngân hàng làm 'sân sau' cấp vốn cho hệ sinh thái của mình, chặn đứng việc lũng đoạn tín dụng."
 VIE_corporate_bond_reform:0 "Chấn chỉnh Thị trường Trái phiếu Doanh nghiệp"
 VIE_corporate_bond_reform_desc:0 "Nâng cao điều kiện phát hành trái phiếu riêng lẻ, bảo đảm nhà đầu tư cá nhân có đầy đủ thông tin và hiểu rõ rủi ro."
 VIE_market_upgrade_criteria:0 "Đáp ứng Tiêu chí Nâng hạng Thị trường Mới nổi"
 VIE_market_upgrade_criteria_desc:0 "Hoàn thiện cơ chế giao dịch không cần ký quỹ trước (non-prefunding) và nới trần sở hữu nước ngoài để thị trường chứng khoán được nâng hạng."
 VIE_international_financial_centre:0 "Xây dựng Trung tâm Tài chính Quốc tế"
 VIE_international_financial_centre_desc:0 "Quy hoạch TP. Hồ Chí Minh và Đà Nẵng trở thành các trung tâm tài chính quốc tế với các chính sách thể chế ưu đãi vượt trội."
 VIE_investment_grade:0 "Đạt Xếp hạng Tín nhiệm Mức Đầu tư"
 VIE_investment_grade_desc:0 "Quản trị nợ công bền vững giúp các tổ chức xếp hạng tín nhiệm quốc tế nâng bậc tín nhiệm của Việt Nam lên mức an toàn đầu tư."
 VIE_rice_export_power:0 "Cường quốc Xuất khẩu Nông sản"
 VIE_rice_export_power_desc:0 "Việt Nam vươn lên nằm trong top đầu thế giới về xuất khẩu gạo và cà phê, bảo đảm vững chắc an ninh lương thực quốc gia."
 VIE_high_tech_agriculture:0 "Phát triển Nông nghiệp Công nghệ cao"
 VIE_high_tech_agriculture_desc:0 "Ứng dụng tưới nhỏ giọt, giống cây trồng kháng mặn và hệ thống kho lạnh chuỗi cung ứng giúp nâng cao giá trị hạt nông sản."
 VIE_land_law_reform:0 "Sửa đổi Luật Đất đai Toàn diện"
 VIE_land_law_reform_desc:0 "Xác định giá đất theo nguyên tắc thị trường, minh bạch hóa công tác thu hồi và bồi thường tái định cư cho người dân."
 VIE_16_words:0 "Phương châm 16 Chữ Vàng"
 VIE_16_words_desc:0 "'Láng giềng hữu nghị, hợp tác toàn diện, ổn định lâu dài, hướng tới tương lai.' Khuôn khổ gìn giữ hòa bình trong quan hệ với Bắc Kinh."
 VIE_border_trade_gates:0 "Mở rộng Cửa khẩu Giao thương Biên giới"
 VIE_border_trade_gates_desc:0 "Nâng cấp các cửa khẩu biên giới phía Bắc, tạo điều kiện thuận lợi tối đa cho thông quan hàng hóa và cư dân biên giới giao thương."
 VIE_defence_hotline:0 "Đường dây Nóng Bộ Quốc phòng"
 VIE_defence_hotline_desc:0 "Thiết lập đường dây liên lạc trực tiếp giữa quân đội hai nước để kịp thời xử lý các tình huống bất ngờ trên biển, tránh tính toán sai lầm."
 VIE_code_of_conduct:0 "Thúc đẩy Bộ Quy tắc Ứng xử Biển Đông (COC)"
 VIE_code_of_conduct_desc:0 "Việt Nam phối hợp chặt chẽ cùng các nước ASEAN kiên trì đàm phán một Bộ Quy tắc COC thực chất, hiệu lực và ràng buộc pháp lý."
 VIE_shared_future:0 "Định vị Quan hệ Láng giềng"
 VIE_shared_future_desc:0 "Bắc Kinh đề xuất công thức gắn kết hai quốc gia. Hà Nội khéo léo chấp thuận cách diễn đạt ngoại giao nhưng luôn giữ vững độc lập tự chủ."
 VIE_heritage_preservation:0 "Bảo tồn Tôn tạo Di sản Văn hóa"
 VIE_heritage_preservation_desc:0 "Bảo vệ và phát huy giá trị Vịnh Hạ Long, Phố cổ Hội An và Quần thể Di tích Cố đô Huế, bố trí nguồn kinh phí tương xứng."
 VIE_sea_games_bid:0 "Đăng cai Đại hội Thể thao Đông Nam Á"
 VIE_sea_games_bid_desc:0 "Việt Nam đăng cai tổ chức SEA Games, khánh thành những công trình thể thao hiện đại và lan tỏa tinh thần thượng võ dân tộc."
 VIE_visa_reform:0 "Đột phá Chính sách Thị thực"
 VIE_visa_reform_desc:0 "Kéo dài thời hạn thị thực điện tử e-visa và mở rộng diện miễn thị thực đơn phương để đón làn sóng du khách quốc tế."
 VIE_cultural_industry:0 "Phát triển Các Ngành Công nghiệp Văn hóa"
 VIE_cultural_industry_desc:0 "Điện ảnh, âm nhạc, công nghiệp game và thời trang được đầu tư bài bản để vươn tầm xuất khẩu văn hóa ra thế giới."
 VIE_tourism_powerhouse:0 "Điểm đến Du lịch Hàng đầu Châu Á"
 VIE_tourism_powerhouse_desc:0 "Đón hàng chục triệu lượt du khách mỗi năm, biến du lịch thực sự trở thành ngành kinh tế mũi nhọn của đất nước."
 VIE_urbanization:0 "Quy hoạch Đô thị hóa Thông minh"
 VIE_urbanization_desc:0 "Hàng triệu người dân dịch chuyển về các đô thị. Quy hoạch hạ tầng giao thông và nhà ở xã hội phải đi trước một bước."
 VIE_labor_code_2019:0 "Bộ luật Lao động Năm 2019"
 VIE_labor_code_2019_desc:0 "Cho phép người lao động thành lập tổ chức đại diện tại doanh nghiệp ngoài hệ thống công đoàn truyền thống theo chuẩn mực quốc tế."
 VIE_social_insurance_reform:0 "Cải cách Chính sách Bảo hiểm Xã hội"
 VIE_social_insurance_reform_desc:0 "Điều chỉnh quy định về hưởng bảo hiểm một lần và lộ trình tuổi nghỉ hưu, lắng nghe phản hồi của người lao động."
 VIE_population_policy:0 "Chính sách Dân số trong Giai đoạn Mới"
 VIE_population_policy_desc:0 "Bãi bỏ giới hạn sinh hai con và ban hành các gói hỗ trợ tài chính cho các cặp vợ chồng trẻ trong bối cảnh mức sinh sụt giảm."
 VIE_overseas_vietnamese:0 "Phát huy Nguồn lực Người Việt Nam ở Nước ngoài"
 VIE_overseas_vietnamese_desc:0 "Tạo điều kiện thuận lợi nhất để kiều bào về nước đầu tư kinh doanh, chuyển giao công nghệ và gắn kết cội nguồn dân tộc."
 VIE_upper_middle_income:0 "Đạt Mức Thu nhập Trung bình Cao năm 2030"
 VIE_upper_middle_income_desc:0 "Hiện thực hóa mục tiêu đến năm 2030 đưa Việt Nam trở thành quốc gia đang phát triển có thu nhập trung bình cao."
 VIE_green_growth:0 "Chiến lược Quốc gia về Tăng trưởng Xanh"
 VIE_green_growth_desc:0 "Mọi dự án đầu tư mới đều phải vượt qua các tiêu chuẩn khắt khe về giảm phát thải khí nhà kính và bảo vệ môi trường."
 VIE_innovation_nation:0 "Quốc gia Khởi nghiệp Đổi mới Sáng tạo"
 VIE_innovation_nation_desc:0 "Các khu công nghệ cao, trung tâm ươm tạo doanh nghiệp khởi nghiệp và vườn ươm chip biến tri thức thành nguồn hàng xuất khẩu."
 VIE_high_income_2045:0 "Tầm nhìn Nước Phát triển năm 2045"
 VIE_high_income_2045_desc:0 "Mục tiêu dài hạn: đưa Việt Nam trở thành quốc gia phát triển có thu nhập cao, người dân có mức sống thịnh vượng ngang tầm các nước tiên tiến."
 VIE_developed_nation_2045:0 "Hiện thực hóa Khát vọng Năm 2045"
 VIE_developed_nation_2045_desc:0 "Đúng 100 năm sau ngày Chủ tịch Hồ Chí Minh đọc Tuyên ngôn Độc lập, Việt Nam đã trở thành một nước phát triển hùng cường."
 VIE_hose_exchange:0 "Thành lập Thị trường Chứng khoán (HOSE)"
 VIE_hose_exchange_desc:0 "Trung tâm Giao dịch Chứng khoán TP. Hồ Chí Minh khai trương vào tháng 7 năm 2000 với chỉ vài mã cổ phiếu, mở màn cho kênh dẫn vốn mới."
 VIE_investment_law_2005:0 "Luật Đầu tư Chung Năm 2005"
 VIE_investment_law_2005_desc:0 "Thống nhất khuôn khổ pháp lý áp dụng bình đẳng cho cả nhà đầu tư trong nước và nước ngoài, xóa bỏ rào cản hành chính."
 VIE_wto_reforms:0 "Cải cách Thể chế Thực thi Cam kết WTO"
 VIE_wto_reforms_desc:0 "Biểu thuế quan, chính sách trợ cấp và quy định cấp phép được sửa đổi đồng bộ theo đúng các cam kết gia nhập tại Geneva."
 VIE_export_powerhouse:0 "Cường quốc Xuất khẩu Khu vực"
 VIE_export_powerhouse_desc:0 "Tận dụng tối đa các hiệp định CPTPP và EVFTA, xuất khẩu trở thành động lực tăng trưởng quan trọng bậc nhất của nền kinh tế."
 VIE_gulf_of_tonkin:0 "Phân định Vịnh Bắc Bộ"
 VIE_gulf_of_tonkin_desc:0 "Hiệp định năm 2000 với Trung Quốc xác lập ranh giới biển và quy chế phân chia vùng đánh cá chung trong Vịnh Bắc Bộ."
 VIE_apec_host:0 "Đăng cai Hội nghị Thượng đỉnh APEC"
 VIE_apec_host_desc:0 "Các nguyên thủ quốc gia và lãnh đạo nền kinh tế APEC tề tựu tại Hà Nội, cơ hội vàng để quảng bá hình ảnh đất nước."
 VIE_us_carrier_visit:0 "Tàu Sân bay Hoa Kỳ Thăm Đà Nẵng"
 VIE_us_carrier_visit_desc:0 "Chiến hạm sân bay Hoa Kỳ ghé thăm cảng Đà Nẵng lần đầu tiên kể từ sau chiến tranh dưới sự chú ý theo dõi của Bắc Kinh."
 VIE_us_tariff_deal:0 "Khuôn khổ Thỏa thuận Thuế quan với Hoa Kỳ"
 VIE_us_tariff_deal_desc:0 "Đạt được thỏa thuận ngăn chặn nguy cơ áp thuế trừng phạt lên hàng hóa xuất khẩu của Việt Nam, đổi lại việc tăng cường nhập khẩu hàng Mỹ."
 VIE_cambodia_border:0 "Phân giới Cắm mốc với Campuchia"
 VIE_cambodia_border_desc:0 "Các đội liên hợp hai nước cắm cột mốc chủ quyền trên thực địa, xây dựng đường biên giới hòa bình hữu nghị với Campuchia."
 VIE_mekong_commission:0 "Ủy ban Sông Mekong Quốc tế"
 VIE_mekong_commission_desc:0 "Việt Nam chủ động thúc đẩy cơ chế hợp tác Ủy hội sông Mekong để bảo đảm quyền tiếp cận nguồn nước công bằng từ thượng nguồn."
 VIE_mekong_dams_response:0 "Ứng phó với Thủy điện Thượng nguồn Mekong"
 VIE_mekong_dams_response_desc:0 "Các đập thượng nguồn tích nước làm kiệt dòng chảy mùa khô. Hà Nội đẩy mạnh vận động ngoại giao và triển khai các giải pháp cứu đồng bằng."
 VIE_funan_techo_response:0 "Đánh giá Tác động Kênh đào Phù Nam Techo"
 VIE_funan_techo_response_desc:0 "Dự án kênh đào của Campuchia có thể chuyển dòng nước Mekong. Việt Nam chủ động đối thoại và chia sẻ dữ liệu thủy văn."
 VIE_india_partnership:0 "Đối tác Chiến lược Toàn diện với Ấn Độ"
 VIE_india_partnership_desc:0 "Hợp tác chặt chẽ với New Delhi trên các lĩnh vực quốc phòng an ninh, thăm dò dầu khí và củng cố tiếng nói của các cường quốc tầm trung."
 VIE_japan_partnership:0 "Đối tác Chiến lược Toàn diện với Nhật Bản"
 VIE_japan_partnership_desc:0 "Nhật Bản là đối tác cung cấp ODA lớn nhất, nhà đầu tư hàng đầu và đối tác tin cậy trong việc nâng cao năng lực an ninh hàng hải."
 VIE_korea_partnership:0 "Đối tác Chiến lược Toàn diện với Hàn Quốc"
 VIE_korea_partnership_desc:0 "Các tổ hợp nhà máy của Hàn Quốc tạo việc làm cho hàng trăm ngàn lao động và các tập đoàn Hàn Quốc nằm trong nhóm nhà đầu tư lớn nhất."
 VIE_australia_partnership:0 "Đối tác Chiến lược Toàn diện với Australia"
 VIE_australia_partnership_desc:0 "Hợp tác giáo dục đào tạo, năng lượng khoáng sản và trao đổi quốc phòng gắn kết chặt chẽ Canberra và Hà Nội."
 VIE_france_eu:0 "Quan hệ với Pháp và Liên minh Châu Âu"
 VIE_france_eu_desc:0 "Paris và Brussels đem lại các dự án đầu tư công nghệ cao, máy bay chở khách và sự ủng hộ ngoại giao không kèm điều kiện an ninh."
 VIE_gulf_investment:0 "Thu hút Dòng vốn Đầu tư Vùng Vịnh"
 VIE_gulf_investment_desc:0 "Các quỹ đầu tư quốc gia vùng Vịnh rót hàng tỷ USD vào phát triển hạ tầng cảng biển, hóa dầu và các khu đô thị sinh thái."
 VIE_global_south_ties:0 "Mở rộng Quan hệ với Châu Phi và Mỹ Latinh"
 VIE_global_south_ties_desc:0 "Hạt gạo, mạng lưới viễn thông và các phái bộ gìn giữ hòa bình đưa hình ảnh đất nước Việt Nam thân thiện đến những miền đất xa xôi."
 VIE_supporting_industries:0 "Phát triển Công nghiệp Hỗ trợ"
 VIE_supporting_industries_desc:0 "Xây dựng năng lực cho các doanh nghiệp cung ứng linh kiện và khuôn mẫu nội địa để nâng cao tỷ lệ nội địa hóa giá trị gia tăng."
 VIE_intel_hcmc:0 "Nhà máy Đóng gói Chip Bán dẫn"
 VIE_intel_hcmc_desc:0 "Tổ hợp nhà máy đóng gói và thử nghiệm vi mạch quy mô tỷ USD tại TP. Hồ Chí Minh đưa Việt Nam chính thức lên bản đồ bán dẫn toàn cầu."
 VIE_domestic_automotive:0 "Phát triển Thương hiệu Ô tô Quốc gia"
 VIE_domestic_automotive_desc:0 "Khởi công tổ hợp sản xuất ô tô mang thương hiệu Việt Nam với nguồn vốn đầu tư khổng lồ, đối mặt với sự cạnh tranh khốc liệt của các hãng xe ngoại."
 VIE_china_plus_one:0 "Đón Làn sóng Trung Quốc + 1"
 VIE_china_plus_one_desc:0 "Các tập đoàn sản xuất toàn cầu tìm cách phân tán rủi ro ngoài Trung Quốc đã hướng về Việt Nam. Bắc Kinh chú ý theo dõi ai đang nhận các đơn hàng này."
 VIE_nghi_son_refinery:0 "Nhà máy Lọc hóa dầu Nghi Sơn"
 VIE_nghi_son_refinery_desc:0 "Tổ hợp đại lọc hóa dầu quy mô lớn tại bờ biển Thanh Hóa hợp tác cùng các đối tác quốc tế Nhật Bản và Kuwait."
 VIE_manufacturing_hub:0 "Công xưởng Sản xuất Đông Nam Á"
 VIE_manufacturing_hub_desc:0 "Hàng điện tử, dệt may và máy móc thiết bị tinh xảo của các thương hiệu hàng đầu thế giới được lắp ráp tại Việt Nam."
 VIE_scic:0 "Tổng công ty Đầu tư và Kinh doanh Vốn Nhà nước"
 VIE_scic_desc:0 "Thành lập SCIC để quản lý tập trung phần vốn nhà nước tại các doanh nghiệp và tiến hành thoái vốn có hiệu quả."
 VIE_soe_governance:0 "Đổi mới Quản trị Vốn Nhà nước"
 VIE_soe_governance_desc:0 "Thành lập Ủy ban Quản lý vốn Nhà nước để thực hiện quyền sở hữu vốn và giám sát chặt chẽ đội ngũ cán bộ điều hành."
 VIE_household_business:0 "Chính thức hóa Hộ Kinh doanh Cá thể"
 VIE_household_business_desc:0 "Hàng triệu hộ kinh doanh gia đình và xưởng thủ công được hỗ trợ đăng ký thuế và tạo điều kiện tiếp cận vốn vay ngân hàng."
 VIE_private_sector_engine:0 "Kinh tế Tư nhân là Động lực Quan trọng"
 VIE_private_sector_engine_desc:0 "Nghị quyết 68 khẳng định kinh tế tư nhân thực sự là một động lực tăng trưởng quan trọng hàng đầu của nền kinh tế thị trường định hướng XHCN."
 VIE_son_la_dam:0 "Đại Thủy điện Sơn La"
 VIE_son_la_dam_desc:0 "Công trình thủy điện lớn nhất Đông Nam Á mọc lên trên dòng sông Đà vùng Tây Bắc, hoàn thành di dân tái định cư cho hàng vạn hộ đồng bào."
 VIE_coal_power:0 "Phát triển Nhiệt điện Than"
 VIE_coal_power_desc:0 "Chi phí đầu tư rẻ và thời gian xây dựng nhanh: các nhà máy nhiệt điện than giữ vững nguồn điện nền cho công nghiệp hóa, dù phải trả giá về môi trường."
 VIE_solar_boom:0 "Bùng nổ Năng lượng Mặt trời"
 VIE_solar_boom_desc:0 "Cơ chế giá FIT ưu đãi tạo nên làn sóng lắp đặt hàng chục ngàn dự án điện mặt trời mái nhà và trang trại điện, đặt ra bài toán quá tải lưới truyền tải."
 VIE_power_plan_8:0 "Quy hoạch Phát triển Điện VIII"
 VIE_power_plan_8_desc:0 "Quy hoạch năng lượng quốc gia cân đối tối ưu giữa nhiệt điện khí LNG, điện gió ngoài khơi, năng lượng mặt trời và nâng cấp hệ thống lưới điện."
 VIE_offshore_wind:0 "Phát triển Điện Gió Ngoài khơi"
 VIE_offshore_wind_desc:0 "Các trang trại điện gió tại vùng biển nông ngoài khơi miền Trung và miền Nam hứa hẹn cung cấp nguồn năng lượng sạch khổng lồ cho tương lai."
 VIE_jetp:0 "Đối tác Chuyển dịch Năng lượng Công bằng"
 VIE_jetp_desc:0 "Các quốc gia phát triển cam kết hỗ trợ tài chính và công nghệ nếu Việt Nam thực hiện lộ trình đóng cửa dần các nhà máy nhiệt điện than."
 VIE_rare_earths:0 "Khai thác Khoáng sản Đất hiếm"
 VIE_rare_earths_desc:0 "Một trong những mỏ quặng đất hiếm có trữ lượng lớn nhất thế giới nằm tại vùng Tây Bắc. Mọi cường quốc công nghệ đều khao khát tiếp cận nguồn tài nguyên này."
 VIE_hanoi_metro:0 "Đường sắt Đô thị Hà Nội"
 VIE_hanoi_metro_desc:0 "Tuyến đường sắt đô thị trên cao đầu tiên chính thức vận hành thương mại sau nhiều năm chậm tiến độ, mở đầu cho kỷ nguyên giao thông công cộng xanh."
 VIE_hcmc_metro:0 "Đường sắt Đô thị TP. Hồ Chí Minh"
 VIE_hcmc_metro_desc:0 "Tuyến Metro số 1 Bến Thành - Suối Tiên kết nối trung tâm đô thị lớn nhất nước với các đô thị vệ tinh phía đông."
 VIE_lach_huyen_port:0 "Cảng Nước sâu Quốc tế Lạch Huyện"
 VIE_lach_huyen_port_desc:0 "Cụm cảng nước sâu hiện đại tại Hải Phòng có khả năng đón những siêu tàu container lớn nhất thế giới cập cảng miền Bắc."
 VIE_cai_mep_port:0 "Cụm Cảng Cái Mép - Thị Vải"
 VIE_cai_mep_port_desc:0 "Cụm cảng nước sâu nhất ở phía Nam kết nối trực tiếp các nhà máy công nghiệp với các thị trường lớn tại Châu Âu và Châu Mỹ mà không cần trung chuyển."
 VIE_500kv_grid:0 "Đường dây Truyền tải 500 kV Mạch 3"
 VIE_500kv_grid_desc:0 "Đường dây 500 kV mạch 3 kéo dài từ Quảng Trạch ra Phố Nối được thi công thần tốc, giúp giải tỏa công suất và truyền tải điện cấp bách cho miền Bắc."
 VIE_lao_cai_haiphong_rail:0 "Đường sắt Lào Cai - Hà Nội - Hải Phòng"
 VIE_lao_cai_haiphong_rail_desc:0 "Tuyến đường sắt khổ tiêu chuẩn 1.435mm kết nối cửa khẩu biên giới phía Bắc thẳng tới cảng biển Lạch Huyện."
 VIE_law_of_the_sea:0 "Luật Biển Việt Nam"
 VIE_law_of_the_sea_desc:0 "Chủ quyền biển đảo, vùng đặc quyền kinh tế và thềm lục địa của Việt Nam được quy định thống nhất trong một đạo luật quốc gia duy nhất năm 2012."
 VIE_fisheries_surveillance:0 "Lực lượng Kiểm ngư Việt Nam"
 VIE_fisheries_surveillance_desc:0 "Lực lượng chuyên trách dân sự tuần tra bảo vệ ngư trường, đồng hành hỗ trợ ngư dân bám biển và ghi nhận hành vi xâm phạm của tàu thuyền nước ngoài."
 VIE_coast_guard_law:0 "Thông qua Luật Cảnh sát Biển"
 VIE_coast_guard_law_desc:0 "Luật năm 2018 trao cho lực lượng Cảnh sát biển Việt Nam hành lang pháp lý vững chắc và thẩm quyền rõ ràng để thực thi pháp luật trên các vùng biển."
 VIE_dk1_platforms:0 "Củng cố Hệ thống Nhà giàn DK1"
 VIE_dk1_platforms_desc:0 "Những pháo đài thép kiên cường trên thềm lục địa phía Nam là các cột mốc chủ quyền khẳng định quyền kiểm soát biển đảo thiêng liêng của tổ quốc."
 VIE_legal_warfare:0 "Đấu tranh Pháp lý Quốc tế"
 VIE_legal_warfare_desc:0 "§YTiến trình lịch sử giả định.§! Việt Nam chủ động nộp hồ sơ khởi kiện theo Công ước Luật Biển UNCLOS, tiếp bước phán quyết trọng tài năm 2016."
 VIE_limited_war_doctrine:0 "Học thuyết Chiến tranh Bảo vệ Tổ quốc Cục bộ"
 VIE_limited_war_doctrine_desc:0 "Xây dựng các phương án sẵn sàng đánh bại các cuộc tập kích quy mô hạn chế trên biển đảo và giải pháp giải tỏa khủng hoảng giữ vững hòa bình."
 VIE_peoples_defence:0 "Thế trận Quốc phòng Toàn dân"
 VIE_peoples_defence_desc:0 "Sự nghiệp củng cố quốc phòng an ninh là trách nhiệm của toàn dân, lấy Quân đội Nhân dân làm lực lượng nòng cốt."
 VIE_militia_law:0 "Luật Dân quân Tự vệ"
 VIE_militia_law_desc:0 "Đạo luật năm 2019 kiện toàn tổ chức, trang bị và nâng cao hiệu quả hoạt động của lực lượng dân quân tự vệ tại các xã phường và doanh nghiệp."
 VIE_cyber_command:0 "Bộ Tư lệnh Tác chiến Không gian mạng"
 VIE_cyber_command_desc:0 "Thành lập Bộ Tư lệnh 86 chuyên trách bảo vệ chủ quyền quốc gia trên không gian mạng và đối phó với chiến tranh thông tin."
 VIE_un_peacekeeping:0 "Gìn giữ Hòa bình Liên Hợp Quốc"
 VIE_un_peacekeeping_desc:0 "Triển khai các thê đội công binh và bệnh viện dã chiến tham gia phái bộ gìn giữ hòa bình tại Châu Phi, nâng cao hình ảnh 'Bộ đội Cụ Hồ' yêu chuộng hòa bình."
 VIE_tank_modernization:0 "Nâng cấp Hiện đại hóa Xe tăng T-54/55"
 VIE_tank_modernization_desc:0 "Hiện đại hóa pháo chính, hệ thống ngắm bắn quang điện tử và trang bị giáp phản ứng nổ giúp các chiến xa T-54/55 tiếp tục phát huy sức mạnh chiến đấu."
 VIE_t90_tanks:0 "Trang bị Xe tăng Chủ lực T-90S"
 VIE_t90_tanks_desc:0 "Lô xe tăng chủ lực hiện đại T-90S/SK nhập khẩu từ Nga được biên chế cho các lữ đoàn tăng thiết giáp tinh nhuệ."
 VIE_rocket_artillery:0 "Hiện đại hóa Pháo binh và Pháo phản lực"
 VIE_rocket_artillery_desc:0 "Trang bị các tổ hợp pháo phản lực tầm xa và đạn dẫn đường chính xác cao giúp vươn dài tầm hỏa lực yểm trợ cho bộ binh."
 VIE_special_forces:0 "Xây dựng Lực lượng Binh chủng Đặc công"
 VIE_special_forces_desc:0 "Huấn luyện lực lượng đặc công tinh nhuệ, luồn sâu đánh hiểm, sẵn sàng thực hiện những nhiệm vụ hiểm hóc nhất."
 VIE_mechanization:0 "Cơ giới hóa Các Sư đoàn Bộ binh"
 VIE_mechanization_desc:0 "Trang bị thêm xe thiết giáp chở quân và xe chiến đấu bộ binh, nâng cao tốc độ cơ động và sức mạnh hỏa lực cho các sư đoàn chủ lực."
 VIE_corps_restructure:0 "Tổ chức Lại Các Quân đoàn Chủ lực"
 VIE_corps_restructure_desc:0 "Sáp nhập và tổ chức lại các quân đoàn thành những quân đoàn chủ lực tinh gọn, cơ động, có hỏa lực mạnh mẽ (như Quân đoàn 12)."
 VIE_reserve_mobilization:0 "Lực lượng Dự bị Động viên Tinh nhuệ"
 VIE_reserve_mobilization_desc:0 "Các quân nhân hoàn thành nghĩa vụ quân sự được sắp xếp vào các đơn vị dự bị động viên sẵn sàng tái nhập ngũ khi có lệnh."
 VIE_navy_modernization:0 "Hiện đại hóa Quân chủng Hải quân"
 VIE_navy_modernization_desc:0 "Tập trung xây dựng lực lượng hải quân hiện đại xoay quanh tàu ngầm, chiến hạm tên lửa và các tổ hợp tên lửa bờ biển răn đe tầm xa."
 VIE_naval_aviation:0 "Phát triển Lực lượng Không quân Hải quân"
 VIE_naval_aviation_desc:0 "Trang bị phi đội trực thăng săn ngầm và máy bay tuần thám biển giúp mở rộng tầm mắt giám sát của hải quân."
 VIE_gepard_frigates:0 "Biên chế Tàu Hộ vệ Tên lửa Gepard 3.9"
 VIE_gepard_frigates_desc:0 "Bốn chiến hạm Gepard do Nga đóng mang lại cho Hải quân Việt Nam năng lực tác chiến mặt nước, săn ngầm và phòng không hiện đại."
 VIE_domestic_corvettes:0 "Đóng Mới Tàu Pháo và Tàu Tên lửa Trong nước"
 VIE_domestic_corvettes_desc:0 "Các nhà máy đóng tàu quân sự trong nước tự chủ đóng mới thành công các tàu tên lửa tấn công nhanh lớp Molniya theo chuyển giao công nghệ."
 VIE_domestic_antiship:0 "Tự chủ Chế tạo Tên lửa Diệt hạm"
 VIE_domestic_antiship_desc:0 "Các kỹ sư Viettel và Viện Khoa học Công nghệ Quân sự nghiên cứu phát triển thành công dòng tên lửa diệt hạm 'Made in Vietnam' (VCM-01)."
 VIE_naval_infantry:0 "Nâng cao Sức mạnh Hải quân Đánh bộ"
 VIE_naval_infantry_desc:0 "Huấn luyện các chiến sĩ hải quân đánh bộ tinh nhuệ, sẵn sàng đổ bộ tái chiếm và kiên cường chốt giữ bảo vệ vững chắc các đảo chìm, đảo nổi."
 VIE_cam_ranh_base:0 "Căn cứ Quân sự Cam Ranh"
 VIE_cam_ranh_base_desc:0 "Vịnh nước sâu Cam Ranh trở thành căn cứ hải quân chiến lược vững chắc cho các lữ đoàn tàu ngầm và tàu mặt nước chủ lực."
 VIE_cam_ranh_port_diplomacy:0 "Ngoại giao Cảng Quốc tế Cam Ranh"
 VIE_cam_ranh_port_diplomacy_desc:0 "Chiến hạm các nước ghé thăm Cam Ranh để tiếp liệu và giao lưu hữu nghị. Không nước nào có căn cứ quân sự riêng và mọi đối tác đều được chào đón bình đẳng."
 VIE_air_force_modernization:0 "Hiện đại hóa Phòng không - Không quân"
 VIE_air_force_modernization_desc:0 "Xây dựng lực lượng không quân tiêm kích tinh nhuệ, trang bị các tổ hợp radar cảnh giới và tên lửa phòng không đa tầng hiện đại."
 VIE_integrated_air_defense:0 "Lưới Lửa Phòng không Tích hợp Đa tầng"
 VIE_integrated_air_defense_desc:0 "Kết nối dữ liệu radar, trận địa tên lửa S-300PMU1/Spyder và sở chỉ huy tự động hóa tạo nên chiếc ô bảo vệ vững chắc bầu trời tổ quốc."
 VIE_yak130_trainers:0 "Máy bay Huấn luyện Chiến đấu Yak-130"
 VIE_yak130_trainers_desc:0 "Trang bị phi đội máy bay phản lực huấn luyện đa năng Yak-130 giúp phi công trẻ nhanh chóng làm chủ các dòng tiêm kích thế hệ 4+ và 5."
 VIE_l39ng:0 "Máy bay Huấn luyện L-39NG"
 VIE_l39ng_desc:0 "Bổ sung dòng máy bay huấn luyện hiện đại thế hệ mới của Séc cho các trường đào tạo phi công quân sự."
 VIE_helicopter_fleet:0 "Hiện đại hóa Phi đội Trực thăng Đa nhiệm"
 VIE_helicopter_fleet_desc:0 "Trang bị các dòng trực thăng vận tải và cứu hộ hiện đại phục vụ bay tiếp tế đảo xa, cứu hộ cứu nạn và cơ động tác chiến."
 VIE_uav_program:0 "Chương trình Máy bay Không người lái (UAV)"
 VIE_uav_program_desc:0 "Nghiên cứu chế tạo trong nước các dòng UAV trinh sát chiến thuật và tiến tới chế tạo UAV mang vũ khí tấn công."
 VIE_fighter_replacement:0 "Dự án Tiêm kích Thế hệ Mới"
 VIE_fighter_replacement_desc:0 "Lựa chọn dòng máy bay chiến đấu kế cận thay thế cho các phi đội đã cũ kỹ. Đây là quyết định chiến lược gắn chặt với đường lối đối ngoại của đất nước."
 VIE_air_dominance_coast:0 "Làm chủ Vùng trời Duyên hải"
 VIE_air_dominance_coast_desc:0 "Sự hiệp đồng tác chiến giữa tiêm kích Su-30, radar bờ biển và tên lửa phòng không bảo đảm bẻ gãy mọi cuộc tập kích đường không của đối phương."
 VIE_z_factories:0 "Hiện đại hóa Các Nhà máy Z"
 VIE_z_factories_desc:0 "Trang bị máy móc công nghệ cao cho các nhà máy thuộc Tổng cục Công nghiệp Quốc phòng để tự chủ sản xuất vũ khí bộ binh và đạn dược."
 VIE_licensed_rifles:0 "Sản xuất Súng Bộ binh Thế hệ Mới"
 VIE_licensed_rifles_desc:0 "Nhà máy Z111 tự chủ sản xuất đại trà các dòng súng trường tấn công hiện đại (STV-215, STV-380) trang bị cho toàn quân."
 VIE_shipyards:0 "Mở rộng Các Đóng tàu Quân đội"
 VIE_shipyards_desc:0 "Các nhà máy đóng tàu quân sự như Ba Son, Hồng Hà, 189 được nâng cấp hạ tầng để đóng mới các loại tàu tuần tra, tàu chở quân và tàu tên lửa."
 VIE_missile_program:0 "Chương trình Phát triển Tên lửa Quốc gia"
 VIE_missile_program_desc:0 "Chương trình trọng điểm quốc gia nghiên cứu chế tạo các tổ hợp tên lửa phòng không tầm thấp và tên lửa bờ đối hải tự chủ."
 VIE_defence_expo:0 "Triển lãm Quốc phòng Quốc tế Việt Nam"
 VIE_defence_expo_desc:0 "Tổ chức triển lãm Vietnam Defence Expo thu hút hàng trăm tập đoàn công nghiệp quốc phòng hàng đầu thế giới tới Hà Nội giới thiệu vũ khí."
 VIE_arms_export:0 "Đẩy mạnh Xuất khẩu Sản phẩm Quốc phòng"
 VIE_arms_export_desc:0 "Xuất khẩu vũ khí bộ binh, tàu tuần tra cỡ nhỏ và khí tài bảo hộ cho các đối tác truyền thống yêu chuộng thiết bị quân sự bền bỉ."
 VIE_dual_use_industry:0 "Phát triển Công nghiệp Lưỡng dụng"
 VIE_dual_use_industry_desc:0 "Các nhà máy quốc phòng tham gia sản xuất thiết bị dân sự và các tập đoàn công nghệ dân sự tham gia nghiên cứu khí tài cho quân đội."
 VIE_university_autonomy:0 "Tự chủ Đại học Toàn diện"
 VIE_university_autonomy_desc:0 "Trao quyền tự chủ cho các trường đại học về học thuật, nhân sự và tài chính, lấy chất lượng đào tạo và nghiên cứu làm thước đo."
 VIE_vocational_training:0 "Đột phá Đào tạo Nghề Chất lượng Cao"
 VIE_vocational_training_desc:0 "Đầu tư các trường cao đẳng nghề trọng điểm để đào tạo đội ngũ công nhân kỹ thuật lành nghề, thợ cơ khí, điện tử cho các tập đoàn FDI."
 VIE_free_tuition:0 "Miễn Học phí Phổ thông Công lập"
 VIE_free_tuition_desc:0 "Nhà nước chi trả toàn bộ học phí bậc phổ thông công lập, bảo đảm cơ hội tiếp cận giáo dục bình đẳng cho mọi trẻ em."
 VIE_english_second_language:0 "Đưa Tiếng Anh Thành Ngôn ngữ Thứ hai"
 VIE_english_second_language_desc:0 "Triển khai dạy học song ngữ trong các trường học, giúp thế hệ trẻ tự tin làm việc trong môi trường toàn cầu hóa."
 VIE_grassroots_clinics:0 "Kiện toàn Mạng lưới Y tế Cơ sở"
 VIE_grassroots_clinics_desc:0 "Mỗi trạm y tế xã phường đều được bảo đảm đủ thuốc thiết yếu và có bác sĩ phụ trách, chăm sóc sức khỏe ban đầu cho nhân dân."
 VIE_vaccine_production:0 "Tự chủ Sản xuất Vắc-xin trong Nước"
 VIE_vaccine_production_desc:0 "Xây dựng các viện nghiên cứu và nhà máy sản xuất vắc-xin đạt chuẩn WHO, bảo đảm an ninh y tế quốc gia."
 VIE_hospital_decongestion:0 "Giảm tải Bệnh viện Tuyến Trung ương"
 VIE_hospital_decongestion_desc:0 "Xây dựng các bệnh viện vệ tinh cơ sở 2 hiện đại và hoàn thiện quy chế chuyển tuyến bảo hiểm y tế thuận tiện."
 VIE_preventive_health:0 "Nâng cao Năng lực Y tế Dự phòng"
 VIE_preventive_health_desc:0 "Chủ động kiểm soát dịch bệnh, khám sàng lọc định kỳ và xây dựng lối sống lành mạnh trong toàn dân."
 VIE_forest_protection:0 "Đóng cửa Rừng Tự nhiên và Trồng rừng"
 VIE_forest_protection_desc:0 "Thực hiện lệnh đóng cửa rừng tự nhiên nghiêm ngặt, giao khoán bảo vệ rừng và đẩy mạnh trồng rừng phòng hộ đầu nguồn."
 VIE_hanoi_air_quality:0 "Cải thiện Chất lượng Không khí Thủ đô"
 VIE_hanoi_air_quality_desc:0 "Kiểm soát khí thải xe máy cũ, cấm bếp than tổ ong và lắp đặt hệ thống quan trắc không khí tự động theo thời gian thực."
 VIE_plastic_waste:0 "Hành động Chống Rác thải Nhựa"
 VIE_plastic_waste_desc:0 "Loại bỏ dần các sản phẩm nhựa dùng một lần, đánh thuế môi trường và áp dụng trách nhiệm mở rộng của nhà sản xuất (EPR)."
 VIE_internet_expansion:0 "Phổ cập Internet Băng rộng Tới Mọi Bản làng"
 VIE_internet_expansion_desc:0 "Kéo cáp quang và phát sóng trạm 4G/5G tới những thôn bản xa xôi nhất, đưa người dân miền núi lên không gian số."
 VIE_mobile_networks:0 "Thương mại hóa Mạng Di động 5G"
 VIE_mobile_networks_desc:0 "Cấp phép và phủ sóng mạng 5G tốc độ cao tại các đô thị lớn và khu công nghệ cao, thúc đẩy cách mạng công nghiệp 4.0."
 VIE_cashless_payments:0 "Thúc đẩy Thanh toán Không dùng Tiền mặt"
 VIE_cashless_payments_desc:0 "Mã VietQR và ví điện tử phổ cập tới từng sạp chợ truyền thống, biến điện thoại thông minh thành chiếc ví thanh toán quốc dân."
 VIE_digital_id:0 "Định danh Điện tử Quốc gia VNeID"
 VIE_digital_id_desc:0 "Ứng dụng VNeID và thẻ căn cước công dân gắn chip trở thành chiếc chìa khóa vạn năng cho mọi thủ tục hành chính."
 VIE_national_data_center:0 "Xây dựng Trung tâm Dữ liệu Quốc gia"
 VIE_national_data_center_desc:0 "Thiết lập trung tâm dữ liệu dùng chung bảo mật tối cao của chính phủ, cung cấp hạ tầng điện toán đám mây cho toàn bộ máy nhà nước."
 VIE_ai_strategy:0 "Chiến lược Quốc gia về Trí tuệ Nhân tạo"
 VIE_ai_strategy_desc:0 "Đầu tư cho các viện nghiên cứu AI, xây dựng trung tâm tính toán siêu mạnh và đào tạo nhân tài công nghệ cao."
 VIE_digital_nation:0 "Xây dựng Quốc gia Số Toàn diện"
 VIE_digital_nation_desc:0 "Chính phủ số, kinh tế số và xã hội số cùng phát triển đồng bộ, đưa Việt Nam bứt phá trong kỷ nguyên công nghệ."
 VIE_nafosted:0 "Quỹ Khoa học và Công nghệ NAFOSTED"
 VIE_nafosted_desc:0 "Tài trợ các đề tài nghiên cứu khoa học cơ bản thông qua cơ chế bình duyệt quốc tế liêm chính, không theo quan hệ thâm niên."
 VIE_research_universities:0 "Phát triển Các Đại học Nghiên cứu Tinh hoa"
 VIE_research_universities_desc:0 "Đầu tư có trọng điểm cho hai Đại học Quốc gia và các trường đại học kỹ thuật hàng đầu vươn lên nhóm đại học hàng đầu Châu Á."
 VIE_earth_observation:0 "Chùm Vệ tinh Viễn thám Quan sát Trái đất"
 VIE_earth_observation_desc:0 "Phóng vệ tinh viễn thám riêng (VNREDSat) phục vụ công tác giám sát tài nguyên rừng, ứng phó bão lũ và bảo vệ chủ quyền biển đảo."
 VIE_nuclear_research:0 "Nghiên cứu Hạt nhân và Lò Phản ứng Đà Lạt"
 VIE_nuclear_research_desc:0 "Nâng cấp lò phản ứng hạt nhân nghiên cứu Đà Lạt, ứng dụng đồng vị phóng xạ trong y tế và đào tạo đội ngũ chuyên gia vật lý hạt nhân."
 VIE_science_breakthrough:0 "Đột phá Khoa học Công nghệ theo Nghị quyết 57"
 VIE_science_breakthrough_desc:0 "Đưa ngân sách nghiên cứu phát triển (R&D) và đổi mới sáng tạo lên thành tiêu chuẩn đánh giá sự phát triển của mọi ngành, mọi địa phương."
 VIE_chip_design:0 "Vườn ươm Thiết kế Chip Bán dẫn"
 VIE_chip_design_desc:0 "Thành lập các trung tâm ươm tạo thiết kế vi mạch, thu hút các kỹ sư vi mạch Việt Nam từ Thung lũng Silicon trở về cống hiến."
 VIE_chip_engineers:0 "Đào tạo 50.000 Kỹ sư Ngành Bán dẫn"
 VIE_chip_engineers_desc:0 "Liên kết giữa chính phủ, các đại học kỹ thuật và các tập đoàn công nghệ lớn để đào tạo lực lượng lao động tinh hoa cho ngành bán dẫn."
 VIE_semiconductor_fab:0 "Xây dựng Nhà máy Chế tạo Wafer Bán dẫn"
 VIE_semiconductor_fab_desc:0 "Dự án tham vọng nhất trong ngành công nghệ: tự xây dựng nhà máy chế tạo tấm bán dẫn wafer đầu tiên của đất nước."
 VIE_meritocratic_service:0 "Công vụ Thực tài và Thi tuyển Minh bạch"
 VIE_meritocratic_service_desc:0 "Thi tuyển công chức công khai, cạnh tranh bình đẳng và bổ nhiệm chức danh lãnh đạo theo năng lực thực tế."
 VIE_judicial_reform:0 "Cải cách Tư pháp Chuyên nghiệp"
 VIE_judicial_reform_desc:0 "Thẩm phán được đãi ngộ xứng đáng, độc lập xét xử theo pháp luật và không bị can thiệp bởi mệnh lệnh hành chính."
 VIE_performance_legitimacy:0 "Tính Chính danh Từ Thành quả Tăng trưởng"
 VIE_performance_legitimacy_desc:0 "Sự lãnh đạo của chính quyền được khẳng định bằng những con số tăng trưởng thực chất và đời sống ấm no của nhân dân."
 VIE_singapore_model:0 "Vận hành Theo Mô hình Singapore"
 VIE_singapore_model_desc:0 "Xây dựng nền công vụ liêm chính, kỷ cương phép nước nghiêm minh và thị trường cởi mở hiệu quả."
 VIE_anti_peaceful_evolution:0 "Đấu tranh Chống 'Diễn biến Hòa bình'"
 VIE_anti_peaceful_evolution_desc:0 "Tăng cường công tác giáo dục chính trị tư tưởng, kiên quyết đập tan các âm mưu phá hoại nền tảng chế độ từ bên trong."
 VIE_ideological_fortress:0 "Pháo đài Tư tưởng Vững chắc"
 VIE_ideological_fortress_desc:0 "Mỗi tổ chức cơ sở đảng, trường học và cơ quan báo chí là một pháo đài kiên cố bảo vệ sự trong sáng của chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh."
 VIE_front_coalition:0 "Mở rộng Khối Đại Đoàn kết Toàn dân"
 VIE_front_coalition_desc:0 "Mời các nhân sĩ, trí thức và các tổ chức xã hội độc lập cùng tham gia sinh hoạt trong Mặt trận Tổ quốc."
 VIE_vetted_elections:0 "Bầu cử Hiệp thương Dân chủ"
 VIE_vetted_elections_desc:0 "Mở rộng danh sách ứng viên có năng lực qua hiệp thương, đưa thêm nhiều tiếng nói phản biện độc lập vào nghị trường Quốc hội."
 VIE_loyal_opposition:0 "Tiếng nói Phản biện Xã hội Trung kiên"
 VIE_loyal_opposition_desc:0 "Khuyến khích các ý kiến đóng góp phản biện chính sách thẳng thắn trên tinh thần xây dựng và vì lợi ích quốc gia dân tộc."
 VIE_revive_democratic_party:0 "Phục hồi Đảng Dân chủ Việt Nam"
 VIE_revive_democratic_party_desc:0 "Cho phép Đảng Dân chủ tái lập hoạt động và tham gia tranh cử một tỷ lệ ghế nhất định trong quốc hội."
 VIE_revive_socialist_party:0 "Phục hồi Đảng Xã hội Việt Nam"
 VIE_revive_socialist_party_desc:0 "Cho phép Đảng Xã hội khôi phục tổ chức và tham gia đóng góp cho sự nghiệp xây dựng đất nước."
 VIE_tc_import_substitution:0 "Chiến lược Thay thế Hàng Nhập khẩu"
 VIE_tc_import_substitution_desc:0 "Các doanh nghiệp trong nước tự chủ nghiên cứu, sản xuất các linh kiện trước đây phải nhập khẩu từ Trung Quốc."
 VIE_tc_nonaligned_summit:0 "Đăng cai Hội nghị Cấp cao Phong trào Không liên kết"
 VIE_tc_nonaligned_summit_desc:0 "Lãnh đạo các quốc gia thuộc thế giới thứ ba tề tựu tại Hà Nội, nâng cao vị thế ngoại giao của Việt Nam trên trường quốc tế."
 VIE_tc_workers_councils:0 "Thiết lập Các Hội đồng Công nhân"
 VIE_tc_workers_councils_desc:0 "Công nhân trong các nhà máy trực tiếp tham gia thảo luận và quyết định về mức lương, giờ làm và phân phối lợi nhuận."
 VIE_tc_arms_diversification:0 "Đa dạng hóa Nguồn Cung Vũ khí"
 VIE_tc_arms_diversification_desc:0 "Mua sắm trang bị từ Nga, Ấn Độ, Israel và nhiều quốc gia để không bao giờ bị khống chế bởi một nhà cung cấp đơn lẻ."
 VIE_tc_asean_bloc:0 "Xây dựng Khối Trung lập Trong ASEAN"
 VIE_tc_asean_bloc_desc:0 "Vận động các quốc gia Đông Nam Á duy trì sự độc lập, kiên quyết không trở thành quân cờ trong cuộc cạnh tranh nước lớn."
 VIE_tc_market_socialism:0 "Mô hình Kinh tế Thị trường Xã hội Chủ nghĩa Mới"
 VIE_tc_market_socialism_desc:0 "Doanh nghiệp hợp tác xã và tập thể cạnh tranh sòng phẳng với các doanh nghiệp tư nhân, người lao động được chia sẻ lợi ích công bằng."
 VIE_tc_rare_earth_leverage:0 "Biến Đất hiếm Thành Đòn bẩy Chiến lược"
 VIE_tc_rare_earth_leverage_desc:0 "Quyền kiểm soát nguồn khoáng sản đất hiếm mang lại cho Hà Nội vị thế ngoại giao đáng kể trước các nền kinh tế công nghệ cao."
 VIE_tc_mekong_leadership:0 "Dẫn dắt Tiểu vùng Sông Mekong"
 VIE_tc_mekong_leadership_desc:0 "Việt Nam trở thành đối tác tin cậy, đồng hành cùng Lào và Campuchia bảo vệ nguồn nước và phát triển kinh tế lưu vực."
 VIE_tc_eastern_yugoslavia:0 "Nam Tư của Phương Đông"
 VIE_tc_eastern_yugoslavia_desc:0 "Một con đường thứ ba ổn định, độc lập, xã hội chủ nghĩa và thịnh vượng, được cộng đồng quốc tế vị nể."
 VIE_lb_van_don:0 "Đặc khu Vân Đồn"
 VIE_lb_van_don_desc:0 "Xây dựng đặc khu kinh tế thương mại tự do tại bờ biển đông bắc, với sân bay quốc tế và cảng biển du lịch hiện đại."
 VIE_lb_bac_van_phong:0 "Đặc khu Bắc Vân Phong"
 VIE_lb_bac_van_phong_desc:0 "Cảng trung chuyển container quốc tế nước sâu tại bờ biển Nam Trung Bộ, hướng tới các ngành công nghiệp nặng và logistics biển."
 VIE_lb_phu_quoc:0 "Đặc khu Đảo Ngọc Phú Quốc"
 VIE_lb_phu_quoc_desc:0 "Hòn đảo du lịch nghỉ dưỡng sinh thái và mua sắm miễn thuế với những cơ chế ưu đãi đặc thù riêng biệt."
 VIE_lb_free_port:0 "Cảng Biển Tự do Phi Thuế quan"
 VIE_lb_free_port_desc:0 "Hàng hóa ra vào cảng được miễn toàn bộ thuế quan, biến đặc khu thành trung tâm trung chuyển hàng hải của khu vực."
 VIE_lb_casino_resorts:0 "Tổ hợp Nghỉ dưỡng Casino Đẳng cấp"
 VIE_lb_casino_resorts_desc:0 "Cấp phép kinh doanh sòng bạc casino thu hút dòng ngoại tệ từ du khách quốc tế và các tay chơi thượng lưu."
 VIE_lb_digital_assets:0 "Trung tâm Tài sản Số và Tiền Mã hóa"
 VIE_lb_digital_assets_desc:0 "Thí điểm cấp phép cho các sàn giao dịch tài sản số và công nghệ blockchain hoạt động tại đặc khu."
 VIE_lb_sovereignty_safeguards:0 "Hàng rào Pháp lý Bảo vệ Chủ quyền"
 VIE_lb_sovereignty_safeguards_desc:0 "Thiết lập lại các giới hạn thời hạn thuê đất và quy định sở hữu để bảo đảm an ninh quốc phòng tại các vị trí hiểm yếu."
 VIE_ol_bank_capture:0 "Thâu tóm Hệ thống Ngân hàng"
 VIE_ol_bank_capture_desc:0 "Các tập đoàn tư nhân thâu tóm cổ phần chi phối tại các nhà băng, biến chúng thành công cụ huy động vốn phục vụ hệ sinh thái của mình."
 VIE_ol_land_bank:0 "Thâu tóm Quỹ Đất Vàng Dự án"
 VIE_ol_land_bank_desc:0 "Hàng ngàn héc-ta đất nông nghiệp và ven đô được chuyển đổi thành các đại đô thị và khu nghỉ dưỡng sinh lời cho các tập đoàn."
 VIE_ol_political_donations:0 "Vận động Hành lang Chính sách"
 VIE_ol_political_donations_desc:0 "Những khoản tài trợ hào phóng rót vào các chiến dịch, và các nhà hoạch định chính sách ghi nhớ sâu sắc ai là người hậu thuẫn."
 VIE_ol_private_security:0 "Lực lượng Vệ sĩ Tư nhân"
 VIE_ol_private_security_desc:0 "Các đại tập đoàn duy trì đội ngũ bảo vệ và an ninh riêng đông đảo để bảo đảm trật tự cho các đại dự án của mình."
 VIE_ol_offshore_wealth:0 "Chuyển Dịch Tài sản Ra Nước ngoài"
 VIE_ol_offshore_wealth_desc:0 "Nhiều gia tài khổng lồ được bí mật chuyển ra các thiên đường thuế ở hải ngoại, làm thất thoát nguồn lực quốc gia."
 VIE_ol_golden_visa:0 "Chương trình Thị thực Vàng"
 VIE_ol_golden_visa_desc:0 "Cấp quyền cư trú dài hạn cho giới siêu giàu nước ngoài mang dòng vốn lớn tới đầu tư bất động sản."
 VIE_ol_tycoon_diplomacy:0 "Ngoại giao Của Các Ông Trùm Tài phiệt"
 VIE_ol_tycoon_diplomacy_desc:0 "Các nhà tài phiệt kinh doanh mở ra những cánh cửa tiếp cận kinh tế ở nước ngoài mà các con đường ngoại giao chính thống khó lòng chạm tới."
 VIE_wa_five_year_plans:0 "Kế hoạch 5 Năm Kiểu Đông Á"
 VIE_wa_five_year_plans_desc:0 "Xác lập chỉ tiêu tăng trưởng khắt khe, ưu đãi tín dụng cho xuất khẩu dưới sự chỉ đạo của cơ quan quy hoạch trung ương kiến tạo."
 VIE_wa_japan_capital:0 "Thu hút Dòng vốn Đầu tư Nhật Bản"
 VIE_wa_japan_capital_desc:0 "Các ngân hàng và tập đoàn đại công nghiệp Nhật Bản được chào mời bằng các cam kết bảo lãnh chính phủ và ưu đãi mặt bằng."
 VIE_wa_cam_ranh_access:0 "Cho Phép Hải quân Mỹ Tiếp cận Cam Ranh"
 VIE_wa_cam_ranh_access_desc:0 "Tàu chiến hải quân Hoa Kỳ được quyền cập cảng Cam Ranh để bảo dưỡng và tiếp vận kỹ thuật thường xuyên."
 VIE_wa_technical_education:0 "Đào tạo Nhân lực Kỹ thuật Chuyên sâu"
 VIE_wa_technical_education_desc:0 "Các trường đại học bách khoa và viện nghiên cứu kỹ thuật tập trung đào tạo đội ngũ kỹ sư lành nghề theo đơn đặt hàng của kế hoạch kinh tế."
 VIE_wa_korea_partnership:0 "Học tập Kinh nghiệm Phát triển Hàn Quốc"
 VIE_wa_korea_partnership_desc:0 "Mời các chuyên gia cố vấn Hàn Quốc tới tham gia cố vấn xây dựng hệ thống chính sách ngân hàng, giáo dục và công nghiệp nặng."
 VIE_wa_new_countryside:0 "Phong trào Xây dựng Nông thôn Mới"
 VIE_wa_new_countryside_desc:0 "Điện, đường, trường, trạm và các hợp tác xã kiểu mới giúp đời sống nông dân bắt kịp nhịp độ công nghiệp hóa đô thị."
 VIE_wa_anti_corruption_purge:0 "Thanh trừng Những Phần tử Tham nhũng"
 VIE_wa_anti_corruption_purge_desc:0 "Hội đồng thanh tra quyết liệt loại bỏ những kẻ chỉ biết trục lợi từ các dự án quốc gia mà không đem lại kết quả thực chất."
 VIE_wa_prepare_transition:0 "Chuẩn bị Lộ trình Chuyển đổi"
 VIE_wa_prepare_transition_desc:0 "Hội đồng dần từng bước nới lỏng sự kiểm soát sắt đá để nền kinh tế và xã hội sẵn sàng đón nhận sự tự do hóa thể chế."
 VIE_wa_economic_miracle:0 "Kỳ tích Kinh tế Thần kỳ"
 VIE_wa_economic_miracle_desc:0 "Một thế hệ nỗ lực tăng trưởng thần tốc đã biến một dân tộc nghèo khó sau chiến tranh thành một con rồng kinh tế thịnh vượng."
 VIE_sec_public_order:0 "Chiến dịch Lập lại Trật tự Trị an"
 VIE_sec_public_order_desc:0 "Tội phạm đường phố, tụ tập khiếu kiện và tin đồn thất thiệt đều bị xử lý nghiêm minh bằng sức mạnh của lực lượng công an."
 VIE_sec_cyber_sovereignty:0 "Bảo đảm Chủ quyền Không gian Mạng"
 VIE_sec_cyber_sovereignty_desc:0 "Xây dựng bức tường lửa bảo vệ không gian mạng quốc gia, buộc các nền tảng xuyên biên giới phải tuân thủ nghiêm pháp luật Việt Nam."
 VIE_sec_loyalty_vetting:0 "Thẩm tra Tiêu chuẩn Chính trị"
 VIE_sec_loyalty_vetting_desc:0 "Mọi cán bộ, sĩ quan và lãnh đạo doanh nghiệp đều phải trải qua quy trình rà soát tiêu chuẩn chính trị khắt khe."
 VIE_sec_border_control:0 "Siết chặt Quản lý Toàn tuyến Biên giới"
 VIE_sec_border_control_desc:0 "Kiểm soát chặt chẽ các đường mòn lối mở, triệt phá tận gốc các đường dây buôn lậu và vượt biên trái phép."
 VIE_sec_managed_opening:0 "Mở cửa Có Kiểm soát"
 VIE_sec_managed_opening_desc:0 "Cơ quan chức năng quyết định thời điểm thích hợp để nới lỏng các biện pháp kiểm soát theo những điều kiện bảo đảm an ninh nghiêm ngặt."
 VIE_dm_truth_reconciliation:0 "Ủy ban Sự thật và Hòa giải"
 VIE_dm_truth_reconciliation_desc:0 "Ủy ban lắng nghe tiếng nói của các nạn nhân và công bố toàn bộ những sai phạm trong quá khứ để đất nước cùng hàn gắn vết thương."
 VIE_dm_lib_market_opening:0 "Tự do hóa Mở cửa Thị trường"
 VIE_dm_lib_market_opening_desc:0 "Quyết sách đầu tiên của Đảng Dân chủ là bãi bỏ các loại giấy phép con, xóa bỏ độc quyền nhà nước và hạ thấp thuế quan."
 VIE_dm_lib_independent_anticorruption:0 "Cơ quan Chống Tham nhũng Độc lập"
 VIE_dm_lib_independent_anticorruption_desc:0 "Thành lập cơ quan chống tham nhũng độc lập nằm ngoài chính phủ, có ngân sách và tòa án chuyên trách riêng để trừng trị tham nhũng."
 VIE_dm_lib_free_trade:0 "Ký kết Các Hiệp định Tự do Thương mại"
 VIE_dm_lib_free_trade_desc:0 "Mở rộng đàm phán và ký kết các hiệp định thương mại tự do thế hệ mới với mọi đối tác kinh tế trên toàn cầu."
 VIE_dm_lib_eu_alignment:0 "Tiếp cận Các Tiêu chuẩn Châu Âu"
 VIE_dm_lib_eu_alignment_desc:0 "Hài hòa hóa toàn bộ hệ thống luật pháp và quy chuẩn kỹ thuật quốc gia tương thích với các tiêu chuẩn khắt khe của Liên minh Châu Âu."
 VIE_dm_soc_welfare_state:0 "Xây dựng Nhà nước Phúc lợi Xã hội"
 VIE_dm_soc_welfare_state_desc:0 "Mở rộng hệ thống lương hưu, trợ cấp thất nghiệp và miễn phí toàn bộ giáo dục y tế, được chi trả từ nguồn thuế của tầng lớp thu nhập cao."
 VIE_dm_soc_labor_rights:0 "Bảo vệ Quyền Lợi Người Lao động"
 VIE_dm_soc_labor_rights_desc:0 "Bảo đảm quyền tự do thành lập nghiệp đoàn, quyền thương lượng tập thể và quyền đình công hợp pháp của công nhân."
 VIE_dm_soc_public_healthcare:0 "Hệ thống Chăm sóc Y tế Công lập"
 VIE_dm_soc_public_healthcare_desc:0 "Xây dựng hệ thống y tế công lập chất lượng cao phục vụ miễn phí cho toàn thể nhân dân."
 VIE_dm_soc_progressive_tax:0 "Chính sách Thuế Lũy tiến Toàn diện"
 VIE_dm_soc_progressive_tax_desc:0 "Người có thu nhập cao và các khối tài sản khổng lồ phải đóng góp tỷ lệ thuế tương xứng hơn cho phúc lợi xã hội."
 VIE_dm_con_fiscal_discipline:0 "Kỷ luật Tài khóa Thận trọng"
 VIE_dm_con_fiscal_discipline_desc:0 "Cân bằng ngân sách nhà nước, từng bước chi trả nợ công và kiểm soát chặt chẽ từng đồng chi tiêu từ tiền thuế của dân."
 VIE_dm_con_us_alignment:0 "Thắt chặt Liên kết Chiến lược với Hoa Kỳ"
 VIE_dm_con_us_alignment_desc:0 "Hợp tác an ninh quốc phòng, kinh tế thương mại và ngoại giao với Washington được đặt vào vị trí trung tâm của chính sách đối ngoại."
 VIE_dm_con_community_institutions:0 "Phát huy Các Thiết chế Cộng đồng"
 VIE_dm_con_community_institutions_desc:0 "Chùa chiền, nhà thờ, các phường hội truyền thống được tạo điều kiện tham gia sâu rộng hơn vào đời sống xã hội ở cơ sở."
 VIE_dm_con_strong_defense:0 "Xây dựng Nền Quốc phòng Hùng mạnh"
 VIE_dm_con_strong_defense_desc:0 "Tăng cường chi tiêu cho lực lượng vũ trang, nâng cao chế độ đãi ngộ cho sĩ quan binh sĩ để bảo vệ vững chắc tổ quốc."
 VIE_dm_tra_cultural_heritage:0 "Bảo tồn Văn hóa Truyền thống Dân tộc"
 VIE_dm_tra_cultural_heritage_desc:0 "Phục dựng các lễ hội truyền thống, đền miếu di tích và đưa các bộ môn nghệ thuật dân gian vào giảng dạy trong học đường."
 VIE_dm_tra_religious_freedom:0 "Bảo đảm Quyền Tự do Tín ngưỡng Tôn giáo"
 VIE_dm_tra_religious_freedom_desc:0 "Mọi tôn giáo được bình đẳng sinh hoạt, truyền đạo và sở hữu tài sản hợp pháp theo hiến pháp và pháp luật."
 VIE_dm_tra_rural_first:0 "Ưu tiên Phát triển Nông nghiệp Nông thôn"
 VIE_dm_tra_rural_first_desc:0 "Đầu tư đường sá, nguồn vốn tín dụng ưu đãi cho nông thôn trước khi tiếp tục rót tiền xây dựng những tòa cao ốc xa hoa nơi thành thị."
 VIE_dm_tra_balanced_neutrality:0 "Duy trì Đường lối Trung lập Cân bằng"
 VIE_dm_tra_balanced_neutrality_desc:0 "Khôi phục đường lối truyền thống không tham gia bất kỳ liên minh quân sự nào và duy trì mối bang giao hòa hảo với mọi nước."
 VIE_new_rural_development:0 "Chương trình Mục tiêu Quốc gia Xây dựng Nông thôn Mới"
 VIE_new_rural_development_desc:0 "Chương trình toàn diện mang điện đường trường trạm và nước sạch về tận các thôn bản, với bộ tiêu chí quốc gia xây dựng nông thôn mới."
 VIE_energy_security_2045:0 "Chiến lược An ninh Năng lượng Quốc gia Đến 2045"
 VIE_energy_security_2045_desc:0 "Nghị quyết của Bộ Chính trị về định hướng Chiến lược phát triển năng lượng quốc gia của Việt Nam đến năm 2030, tầm nhìn đến năm 2045."
 VIE_us_engagement:0 "Bình thường hóa Quan hệ với Hoa Kỳ"
 VIE_us_engagement_desc:0 "Hai nước bình thường hóa quan hệ ngoại giao vào năm 1995. Tổng thống Hoa Kỳ thăm chính thức Hà Nội, chuyến thăm đầu tiên của một nguyên thủ Mỹ kể từ khi chiến tranh kết thúc."

l_english:

 ### vie_pol.10
 vie_pol.10.t:0 "Luật An ninh Mạng"
 vie_pol.10.d:0 "Quốc hội được đề nghị thông qua luật yêu cầu dữ liệu người dùng Việt Nam phải được lưu trữ trong nước và trao cho cơ quan chức năng quyền yêu cầu gỡ bỏ các nội dung vi phạm. Các nền tảng nước ngoài cảnh báo về chi phí và các ý kiến chỉ trích lo ngại về việc kiểm duyệt, trong khi ban soạn thảo khẳng định luật này nhằm bảo vệ ổn định quốc gia."
 vie_pol.10.a:0 "Thông qua luật theo đúng dự thảo ban đầu"
 vie_pol.10.b:0 "Thông qua phiên bản điều chỉnh sau khi đối thoại với các tập đoàn công nghệ"

 ### vie_pol.18
 vie_pol.18.t:0 "Bất ổn tại Tây Nguyên"
 vie_pol.18.d:0 "Đám đông đã tụ tập tại nhiều tỉnh Tây Nguyên vì các mâu thuẫn về đất đai và tôn giáo, một số nơi đã xảy ra xô xát với lực lượng công an. Chính quyền các địa phương xin ý kiến chỉ đạo từ Hà Nội về mức độ xử lý."
 vie_pol.18.a:0 "Lập lại trật tự trước tiên"
 vie_pol.18.b:0 "Mở cuộc đối thoại và cam kết tăng cường đầu tư"

 ### vie_pol.21
 vie_pol.21.t:0 "Tâm lý Sợ sai, Đùn đẩy Trách nhiệm"
 vie_pol.21.d:0 "Các chiến dịch điều tra khiến cán bộ trở nên thận trọng quá mức. Hàng loạt dự án phải nằm chờ những chữ ký mà không ai dám đặt bút, các bộ ngành phàn nàn rằng ngân sách không thể giải ngân trong khi thủ tục giấy tờ bị đùn đẩy qua lại."
 vie_pol.21.a:0 "Có cơ chế bảo vệ cán bộ dám nghĩ, dám làm"
 vie_pol.21.b:0 "Tiếp tục duy trì sức ép thanh tra, kiểm tra"

 ### vie_cor.6
 vie_cor.6.t:0 "Làn sóng Từ chức của Cán bộ Cấp cao"
 vie_cor.6.d:0 "Các bộ trưởng, lãnh đạo tỉnh và nhiều nhân vật cấp cao lần lượt rời ghế trong thời gian ngắn, một số do thiếu trách nhiệm trong giám sát và một số vì những vi phạm nghiêm trọng hơn. Chiến dịch phòng chống tham nhũng đang chạm tới các cấp cao hơn bao giờ hết, khiến giới chính trị không khỏi bất an."
 vie_cor.6.a:0 "Kiên quyết tiếp tục đẩy mạnh chiến dịch"
 vie_cor.6.b:0 "Tạm dừng để bảo vệ sự ổn định bộ máy"

 ### vie_eco.13
 vie_eco.13.t:0 "Triển vọng Nâng hạng Thị trường"
 vie_eco.13.d:0 "Sau khi đáp ứng các tiêu chuẩn cốt lõi, thị trường chứng khoán Việt Nam dự kiến sẽ được tổ chức xếp hạng quốc tế nâng hạng lên thị trường mới nổi. Dòng vốn ngoại sẽ đổ vào, nhưng các tập đoàn lớn trong nước lại lo ngại về các điều kiện đi kèm."
 vie_eco.13.a:0 "Mở rộng hơn nữa tỷ lệ sở hữu cho nhà đầu tư nước ngoài"
 vie_eco.13.b:0 "Giữ giới hạn trần sở hữu nước ngoài ở các doanh nghiệp trọng yếu"

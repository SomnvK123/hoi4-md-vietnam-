l_english:
 VIE_msl_national_program:0 "Chương trình tên lửa trọng điểm quốc gia"
 VIE_msl_national_program_desc:0 "Phân bổ nguồn lực cho hai nhiệm vụ: duy trì khí tài tên lửa đang có và xây dựng nền tảng công nghệ trong nước. Chương trình mở các hướng bảo đảm kỹ thuật và nghiên cứu, chưa giao trang bị mới."
 VIE_tt_msl_m00_reward:0 "Nghiên cứu tên lửa: §G+10%§! cho §Y1 lượt§!. Mở danh mục chương trình tên lửa. Ngân sách: §R-1 tỷ USD§!. Không giao trang bị."
 VIE_msl_scud_b_maintenance:0 "Duy trì lực lượng Scud-B"
 VIE_msl_scud_b_maintenance_desc:0 "Bảo quản, sửa chữa và huấn luyện lực lượng tên lửa đất đối đất gắn với kinh nghiệm của Lữ đoàn 490. Trọng tâm là khai thác khí tài đang có, không chế tạo một thế hệ Scud mới."
 VIE_tt_msl_m01_reward:0 "Nhận §G5§! kinh nghiệm Lục quân, hoặc mastery học thuyết Lục quân nếu đã chọn học thuyết. Mở bảo dưỡng Scud-B định kỳ. Ngân sách: §R-0,4 tỷ USD§!."
 VIE_msl_redut_maintenance:0 "Duy trì tổ hợp Redut-M"
 VIE_msl_redut_maintenance_desc:0 "Củng cố nhân lực vận hành và quy trình sửa chữa tổ hợp tên lửa bờ Redut-M. Duy trì khả năng khai thác hệ thống cũ thông qua các chu kỳ bảo đảm kỹ thuật."
 VIE_tt_msl_m02_reward:0 "Nhận §G5§! kinh nghiệm Hải quân, hoặc mastery học thuyết Hải quân nếu đã chọn học thuyết. Mở bảo dưỡng Redut-M định kỳ. Ngân sách: §R-0,4 tỷ USD§!."
 VIE_msl_rubezh_maintenance:0 "Duy trì tổ hợp Rubezh"
 VIE_msl_rubezh_maintenance_desc:0 "Quản lý vòng đời khí tài và duy trì đội ngũ kỹ thuật của tổ hợp Rubezh. Đây là một chương trình bảo dưỡng độc lập, không phải bước nâng cấp lên Bastion."
 VIE_tt_msl_m03_reward:0 "Nhận §G5§! kinh nghiệm Hải quân, hoặc mastery học thuyết Hải quân nếu đã chọn học thuyết. Mở bảo dưỡng Rubezh định kỳ. Ngân sách: §R-0,4 tỷ USD§!."
 VIE_msl_vcm01_program:0 "Chương trình VCM-01"
 VIE_msl_vcm01_program_desc:0 "Xây dựng nền tảng nghiên cứu, thiết kế và đánh giá họ tên lửa hành trình trong nước. Kết quả nghiên cứu phải được hoàn tất qua chương trình có kinh phí và thời gian."
 VIE_tt_msl_m05_reward:0 "Nghiên cứu tên lửa: §G+25%§! cho §Y1 lượt§!. Mở chương trình phát triển VCM-01 có thời gian. Ngân sách: §R-1 tỷ USD§!."
 VIE_msl_vsm01a_song_hong:0 "VSM-01A Sông Hồng"
 VIE_msl_vsm01a_song_hong_desc:0 "Chuẩn bị chương trình hoàn thiện sản phẩm tên lửa đối hạm VSM-01A Sông Hồng. Nghiệm thu sản phẩm chỉ bắt đầu sau khi nền tảng VCM-01 được xác nhận."
 VIE_tt_msl_m06_reward:0 "Nghiên cứu tên lửa: §G+15%§! cho §Y1 lượt§!. Mở nghiệm thu VSM-01A sau khi hoàn tất VCM-01. Ngân sách: §R-1,5 tỷ USD§!."
 VIE_msl_vcs01_truong_son:0 "VCS-01 Trường Sơn"
 VIE_msl_vcs01_truong_son_desc:0 "Tích hợp đạn tên lửa, xe phóng, radar, chỉ huy và phương tiện hỗ trợ thành tổ hợp phòng thủ bờ cơ động. Chương trình tích hợp cần sản phẩm VSM-01A đã được nghiệm thu."
 VIE_tt_msl_m07_reward:0 "Nghiên cứu điện tử quân sự: §G+20%§! cho §Y1 lượt§!. Mở tích hợp VCS-01 sau nghiệm thu VSM-01A. Ngân sách: §R-2 tỷ USD§!."
 VIE_msl_technical_autonomy:0 "Làm chủ bảo đảm kỹ thuật tên lửa"
 VIE_msl_technical_autonomy_desc:0 "Hội tụ kinh nghiệm bảo quản, sửa chữa và huấn luyện nhiều hệ thống thành năng lực bảo đảm kỹ thuật tên lửa. Thành tựu này không đồng nghĩa với nội địa hóa toàn bộ cấu phần."
 VIE_tt_msl_m04_reward:0 "Nhận tinh thần §YLàm chủ bảo đảm kỹ thuật tên lửa§!: tốc độ nhận XP Lục quân và Hải quân §G+2%§! mỗi loại. Ngân sách: §R-0,8 tỷ USD§!."
 VIE_msl_cruise_missile_industry:0 "Làm chủ thiết kế và sản xuất tên lửa hành trình"
 VIE_msl_cruise_missile_industry_desc:0 "Công nhận năng lực thiết kế và tổ chức công nghiệp sau khi hoàn tất ba chương trình và nghiệm thu VCS-01. Bản tích hợp hiện hành chưa cung cấp cơ chế giao trang bị của tổ hợp; focus này không giao tên lửa."
 VIE_tt_msl_m08_reward:0 "Nhận tinh thần công nghiệp: tốc độ tăng hiệu suất sản xuất §G+2%§!, tốc độ nghiên cứu §G+1%§! trên toàn quốc. Ngân sách: §R-2 tỷ USD§!. Cơ chế giao trang bị VCS-01 chưa được tích hợp."
 VIE_msl_national_capability:0 "Phát triển năng lực tên lửa quốc gia"
 VIE_msl_national_capability_desc:0 "Kết hợp bảo đảm khí tài cũ với nền tảng nghiên cứu và công nghiệp trong nước. Năng lực thống nhất thay thế hai tinh thần chuyên ngành, phản ánh thành tựu trong những lĩnh vực đã được nghiệm thu."
 VIE_tt_msl_m09_reward:0 "Nhận §G20 PP§!. Thay hai tinh thần chuyên ngành bằng năng lực tích hợp: tốc độ nhận XP Lục quân/Hải quân §G+2%§! mỗi loại, tốc độ tăng hiệu suất sản xuất §G+2,5%§!, nghiên cứu §G+1%§!. Không cộng chồng các tinh thần cũ."
 VIE_msl_dec_scud_sustainment:0 "Bảo dưỡng Scud-B"
 VIE_msl_dec_scud_sustainment_desc:0 "Chi 20 PP và 0,1 tỷ USD để tổ chức một chu kỳ bảo đảm kỹ thuật kéo dài 365 ngày. Không cấp tên lửa mới; chỉ có thể lặp lại sau khi chu kỳ kết thúc và hết thời gian chờ."
 VIE_tt_msl_scud_sustainment_ready:0 "Đã hoàn thành focus duy trì Scud-B, chưa có chu kỳ bảo dưỡng đang có hiệu lực và có ít nhất §Y0,1 tỷ USD§! trong ngân sách."
 VIE_tt_msl_scud_sustainment_start:0 "Ngân sách: §R-0,1 tỷ USD§!. Nhận chu kỳ bảo dưỡng Scud-B trong §Y365 ngày§!, tốc độ nhận XP Lục quân §G+0,5%§!. Tác dụng trên toàn quân chủng; không giao trang bị."

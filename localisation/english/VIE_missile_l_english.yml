 VIE_tt_msl_vcs_certified:0 "Đã hoàn tất và nghiệm thu tích hợp §YVCS-01 Trường Sơn§! qua quyết định chương trình."
 VIE_tt_msl_equipment_mapping_ready:0 "[Debug] Cần mapping VCS-01 có equipment, công nghệ và consumer được xác minh. Chưa tích hợp; không được dùng generic guided missile để thay thế."
 VIE_msl_sustainment_idea:0 "Làm chủ bảo đảm kỹ thuật tên lửa"
 VIE_msl_sustainment_idea_desc:0 "Năng lực tổ chức bảo đảm, huấn luyện và công nghiệp được củng cố qua chương trình tên lửa. Các chỉ số của tinh thần áp dụng trên toàn quốc hoặc toàn quân chủng tương ứng; không chỉ riêng tên lửa."
 VIE_msl_industry_idea:0 "Công nghiệp tên lửa hành trình"
 VIE_msl_industry_idea_desc:0 "Năng lực tổ chức bảo đảm, huấn luyện và công nghiệp được củng cố qua chương trình tên lửa. Các chỉ số của tinh thần áp dụng trên toàn quốc hoặc toàn quân chủng tương ứng; không chỉ riêng tên lửa."
 VIE_msl_integrated_idea:0 "Năng lực tên lửa tích hợp"
 VIE_msl_integrated_idea_desc:0 "Năng lực tổ chức bảo đảm, huấn luyện và công nghiệp được củng cố qua chương trình tên lửa. Các chỉ số của tinh thần áp dụng trên toàn quốc hoặc toàn quân chủng tương ứng; không chỉ riêng tên lửa."
 VIE_msl_scud_sustainment_active_idea:0 "Chu kỳ bảo dưỡng Scud-B"
 VIE_msl_scud_sustainment_active_idea_desc:0 "Chu kỳ bảo đảm kỹ thuật và huấn luyện có thời hạn 365 ngày. Tác dụng nhỏ lên tốc độ nhận kinh nghiệm của toàn quân chủng; không tăng hỏa lực hay giao thêm đạn tên lửa."
 VIE_msl_redut_sustainment_active_idea:0 "Chu kỳ bảo dưỡng Redut-M"
 VIE_msl_redut_sustainment_active_idea_desc:0 "Chu kỳ bảo đảm kỹ thuật và huấn luyện có thời hạn 365 ngày. Tác dụng nhỏ lên tốc độ nhận kinh nghiệm của toàn quân chủng; không tăng hỏa lực hay giao thêm đạn tên lửa."
 VIE_msl_rubezh_sustainment_active_idea:0 "Chu kỳ bảo dưỡng Rubezh"
 VIE_msl_rubezh_sustainment_active_idea_desc:0 "Chu kỳ bảo đảm kỹ thuật và huấn luyện có thời hạn 365 ngày. Tác dụng nhỏ lên tốc độ nhận kinh nghiệm của toàn quân chủng; không tăng hỏa lực hay giao thêm đạn tên lửa."
 VIE_msl_program_category:0 "Chương trình tên lửa quốc gia"
 VIE_msl_program_category_desc:0 "Duy trì khí tài cũ và phát triển nền tảng tên lửa hành trình trong nước. Ba chương trình VCM-01, VSM-01A và VCS-01 phải nghiệm thu tuần tự dù các focus chuẩn bị có thể thực hiện song song."

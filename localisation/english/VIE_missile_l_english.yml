 VIE_msl_dec_batch_production:0 "[Debug] Sản xuất theo lô"
 VIE_msl_dec_batch_production_desc:0 "Điểm tích hợp dành cho developer. Mapping equipment, consumer chiến đấu và công nghệ VCS-01 chưa được xác minh; quyết định này bị khóa và không thu PP, ngân sách hoặc giao trang bị."

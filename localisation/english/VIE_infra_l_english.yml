l_english:
 VIE_expressway_km_tt:0 "Chiều dài cao tốc đã thông xe (km): $RIGHT|+=0$"
 VIE_expressway_idea_2:0 "Mạng lưới cao tốc 3.000 km"
 VIE_expressway_idea_2_desc:0 "Cao tốc đã nối liền phần lớn các vùng kinh tế. Thời gian vận chuyển giảm rõ rệt, các tỉnh xa trung tâm bắt đầu thu hút được khu công nghiệp."
 VIE_expressway_idea_3:0 "Mạng lưới cao tốc 5.000 km"
 VIE_expressway_idea_3_desc:0 "Mạng cao tốc hoàn chỉnh xuyên suốt từ biên giới phía Bắc đến mũi Cà Mau, cùng các vành đai quanh hai đô thị lớn nhất cả nước."
 VIE_transport_strategy_2004:0 "Chiến lược phát triển Giao thông Vận tải"
 VIE_transport_strategy_2004_desc:0 "Quyết định 206/2004/QĐ-TTg (10/12/2004) phê duyệt Chiến lược phát triển giao thông vận tải Việt Nam đến năm 2020, đặt khung quy hoạch cho đường bộ, đường sắt, đường thủy, hàng hải và hàng không."
 VIE_hai_van_tunnel:0 "Hầm đường bộ Hải Vân"
 VIE_hai_van_tunnel_desc:0 "Hầm dài gần 6,3 km xuyên đèo Hải Vân, khánh thành ngày 5/6/2005 sau 5 năm thi công, vốn vay ODA Nhật Bản. Đây là hầm đường bộ dài nhất Đông Nam Á lúc khánh thành, giúp quốc lộ 1 qua miền Trung thông suốt quanh năm."
 VIE_hcmc_trung_luong_expressway:0 "Cao tốc TP. Hồ Chí Minh – Trung Lương"
 VIE_hcmc_trung_luong_expressway_desc:0 "Tuyến cao tốc đầu tiên của Việt Nam, dài gần 62 km, 6 làn xe, khởi công tháng 12/2004 và thông xe ngày 3/2/2010 với tổng vốn hơn 9.500 tỷ đồng."
 VIE_can_tho_bridge:0 "Cầu Cần Thơ"
 VIE_can_tho_bridge_desc:0 "Cầu dây văng có nhịp chính dài nhất Đông Nam Á lúc khánh thành (24/4/2010), bắc qua sông Hậu nối Vĩnh Long với Cần Thơ. Sự cố sập nhịp dẫn ngày 26/9/2007 làm 55 người chết là bài học đắt giá về an toàn và chất lượng công trình."
 VIE_northern_expressways:0 "Cao tốc Nội Bài – Lào Cai và Hà Nội – Hải Phòng"
 VIE_northern_expressways_desc:0 "Cao tốc Nội Bài – Lào Cai (thông xe toàn tuyến 21/9/2014) và Hà Nội – Hải Phòng (105 km, thông xe 5/12/2015, vốn hơn 2 tỷ USD) nối thủ đô với cửa khẩu Lào Cai và cảng Hải Phòng."
 VIE_expressway_regional_links:0 "Cao tốc nối các vùng kinh tế"
 VIE_expressway_regional_links_desc:0 "Hạ Long – Vân Đồn, Đà Nẵng – Quảng Ngãi, Trung Lương – Mỹ Thuận, TP. Hồ Chí Minh – Long Thành – Dầu Giây và nhiều tuyến khác nối các vùng kinh tế động lực, đưa tổng chiều dài cao tốc vượt 2.000 km."
 VIE_expressway_bot:0 "Huy động vốn BOT và PPP"
 VIE_expressway_bot_desc:0 "Giao nhà đầu tư tư nhân xây dựng và thu phí hoàn vốn. Ngân sách nhẹ gánh, nhưng mức phí, vị trí trạm và thời hạn thu phí dễ trở thành điểm nóng của dư luận.\n\n§YPhương án giả định.§! Trên thực tế, Nghị quyết 117/2020/QH14 (19/6/2020) chuyển 3 dự án thành phần Mai Sơn – QL45, Vĩnh Hảo – Phan Thiết, Phan Thiết – Dầu Giây từ PPP sang đầu tư công vì không thu hút được nhà đầu tư."
 VIE_expressway_public_investment:0 "Đầu tư công cho cao tốc"
 VIE_expressway_public_investment_desc:0 "Nhà nước trực tiếp bỏ vốn xây dựng, chịu chi phí lớn nhưng giữ được tiến độ và kiểm soát mức phí sử dụng.\n\n§GĐây là con đường lịch sử:§! Nghị quyết 117/2020/QH14 (19/6/2020) chuyển 3 dự án thành phần cao tốc Bắc – Nam sang đầu tư công, bổ sung không quá 23.461 tỷ đồng từ ngân sách."
 VIE_north_south_expressway_phase2:0 "Cao tốc Bắc – Nam giai đoạn 2"
 VIE_north_south_expressway_phase2_desc:0 "Nghị quyết 44/2022/QH15 (11/1/2022) triển khai 12 dự án thành phần dài khoảng 729 km: Bãi Vọt – Cam Lộ, Quảng Ngãi – Nha Trang và Cần Thơ – Cà Mau, mục tiêu cơ bản hoàn thành năm 2025."
 VIE_ring_roads_hanoi_hcmc:0 "Vành đai 4 Hà Nội và Vành đai 3 TP. Hồ Chí Minh"
 VIE_ring_roads_hanoi_hcmc_desc:0 "Ngày 16/6/2022, Quốc hội thông qua Nghị quyết 56/2022/QH15 về Vành đai 4 – Vùng Thủ đô Hà Nội (tổng vốn khoảng 85.800 tỷ đồng) và Nghị quyết 57/2022/QH15 về Vành đai 3 TP. Hồ Chí Minh."
 VIE_expressway_3000km:0 "Đạt 3.000 km cao tốc"
 VIE_expressway_3000km_desc:0 "Mục tiêu 3.000 km cao tốc đến năm 2025. Thực tế cuối năm 2025 cả nước đã có hơn 3.300 km cao tốc đưa vào khai thác. Cột mốc này đòi hỏi mạng lưới đã đạt khoảng 2.600 km trở lên."
 VIE_expressway_5000km_2030:0 "Hướng tới 5.000 km cao tốc năm 2030"
 VIE_expressway_5000km_2030_desc:0 "Mục tiêu hoàn thành 5.000 km đường bộ cao tốc vào năm 2030, xóa các vùng còn trắng cao tốc. Chi phí rất lớn, hoàn vốn qua nhiều thập kỷ."
 vie_infra.1.t:0 "Bài học từ cầu Cần Thơ"
 vie_infra.1.d:0 "Ngày 26/9/2007, hai nhịp dẫn cầu Cần Thơ đổ sập khi đang thi công, làm 55 người chết và hàng chục người bị thương. Cầu đã hoàn thành, nhưng sự cố vẫn là nỗi ám ảnh về chất lượng công trình giao thông."
 vie_infra.1.a:0 "Siết chặt giám sát chất lượng mọi dự án."
 vie_infra.1.b:0 "Tổ chức khánh thành và giữ nguyên tiến độ."
 vie_infra.2.t:0 "Phản ứng về trạm thu phí BOT"
 vie_infra.2.d:0 "Trạm thu phí đặt trên quốc lộ cũ thay vì tuyến tránh mới khiến tài xế phản đối bằng cách trả tiền lẻ, dừng xe hàng giờ, như vụ trạm BOT Cai Lậy năm 2017 phải xả trạm nhiều lần rồi tạm dừng thu phí. Nhà đầu tư yêu cầu giữ nguyên thỏa thuận hoàn vốn."
 vie_infra.2.a:0 "Giảm phí và kéo dài thời gian thu."
 vie_infra.2.b:0 "Giữ nguyên mức phí đã thỏa thuận."
 VIE_reunification_line_upgrade:0 "Nâng cấp đường sắt Thống Nhất"
 VIE_reunification_line_upgrade_desc:0 "Tuyến đường sắt khổ 1 m dài hơn 1.700 km từ Hà Nội đến Sài Gòn vẫn là xương sống vận tải ray. Cải tạo cầu hầm yếu, tăng tốc độ chạy tàu và nâng cấp ga là bước đệm trước khi nghĩ đến đường sắt tốc độ cao."
 VIE_hsr_partner_japan:0 "Đối tác Nhật Bản cho đường sắt tốc độ cao"
 VIE_hsr_partner_japan_desc:0 "Công nghệ Shinkansen nổi tiếng về an toàn và đúng giờ, vốn ODA lãi thấp, nhưng điều kiện chuyển giao và tiến độ giải ngân chậm hơn."
 VIE_hsr_partner_eu:0 "Đối tác châu Âu cho đường sắt tốc độ cao"
 VIE_hsr_partner_eu_desc:0 "Các nhà sản xuất châu Âu mời gọi hợp tác công nghệ, nhưng tiêu chuẩn kỹ thuật và nguồn vốn phải được xử lý riêng từng gói thầu."
 VIE_hsr_partner_china:0 "Đối tác Trung Quốc cho đường sắt tốc độ cao"
 VIE_hsr_partner_china_desc:0 "Trung Quốc chào vốn vay lớn, thi công nhanh và giá thành thấp. Đổi lại là phụ thuộc về công nghệ và gánh nặng nợ trong nhiều năm."
 VIE_hsr_groundbreaking:0 "Khởi công đường sắt tốc độ cao Bắc – Nam"
 VIE_hsr_groundbreaking_desc:0 "Chính phủ đặt mục tiêu khởi công tuyến đường sắt tốc độ cao Bắc – Nam trong tháng 12/2026, sau khi hoàn thành giải phóng mặt bằng qua 20 tỉnh, thành phố. Đây là dự án hạ tầng lớn nhất trong lịch sử Việt Nam."
 VIE_urban_rail_hanoi:0 "Đường sắt đô thị Hà Nội"
 VIE_urban_rail_hanoi_desc:0 "Tuyến Cát Linh – Hà Đông (13,1 km, 12 ga) chính thức vận hành ngày 6/11/2021 sau nhiều năm chậm tiến độ và đội vốn. Đây là tuyến đường sắt đô thị trên cao đầu tiên của Việt Nam."
 VIE_urban_rail_special_mechanism_nq188:0 "Cơ chế đặc thù cho đường sắt đô thị"
 VIE_urban_rail_special_mechanism_nq188_desc:0 "Nghị quyết 188/2025/QH15 thí điểm các cơ chế, chính sách đặc thù để phát triển mạng lưới đường sắt đô thị tại Hà Nội và TP. Hồ Chí Minh, cho phép hai thành phố chủ động huy động vốn và phát triển đô thị theo mô hình TOD quanh nhà ga."
 VIE_metro_network_2035:0 "Mạng lưới metro hai đô thị lớn"
 VIE_metro_network_2035_desc:0 "Mục tiêu hoàn thành các tuyến metro chính tại Hà Nội và TP. Hồ Chí Minh vào khoảng năm 2035, giảm mạnh áp lực giao thông nội đô."
 VIE_domestic_rail_industry:0 "Công nghiệp đường sắt nội địa"
 VIE_domestic_rail_industry_desc:0 "Nội địa hóa toa xe, đầu máy và thiết bị tín hiệu để không còn phụ thuộc hoàn toàn vào nhập khẩu khi mạng đường sắt mở rộng."
 VIE_airport_network_idea:0 "Mạng lưới cảng hàng không quốc gia"
 VIE_airport_network_idea_desc:0 "Quy hoạch 30 cảng hàng không đến năm 2030 đưa sân bay đến gần mọi vùng, thúc đẩy du lịch và vận chuyển hàng hóa giá trị cao."
 VIE_airport_master_plan:0 "Quy hoạch phát triển hàng không"
 VIE_airport_master_plan_desc:0 "Quy hoạch tổng thể các cảng hàng không toàn quốc làm căn cứ cho mọi dự án sân bay lớn, từ mở rộng nhà ga đến xây mới."
 VIE_aviation_market_opening:0 "Mở cửa thị trường hàng không"
 VIE_aviation_market_opening_desc:0 "Ngày 25/12/2011, Vietjet thực hiện chuyến bay thương mại đầu tiên từ TP. Hồ Chí Minh đi Hà Nội, sau 4 lần lỡ hẹn vì thiếu vốn. Hãng tư nhân phá thế độc quyền và mở ra kỷ nguyên bay giá rẻ."
 VIE_noi_bai_t2:0 "Nhà ga T2 sân bay Nội Bài"
 VIE_noi_bai_t2_desc:0 "Nhà ga hành khách T2 Nội Bài khánh thành ngày 4/1/2015, tổng vốn gần 18.000 tỷ đồng, trong đó khoảng 13.000 tỷ đồng vay ODA Nhật Bản, công suất 10 triệu khách mỗi năm."
 VIE_long_thanh_approval:0 "Chủ trương đầu tư sân bay Long Thành"
 VIE_long_thanh_approval_desc:0 "Ngày 25/6/2015, Quốc hội thông qua Nghị quyết 94/2015/QH13 về chủ trương đầu tư Cảng hàng không quốc tế Long Thành, với 428/461 đại biểu tán thành, sau nhiều năm tranh luận về vị trí, quy mô và nguồn vốn."
 VIE_tan_son_nhat_t3:0 "Nhà ga T3 sân bay Tân Sơn Nhất"
 VIE_tan_son_nhat_t3_desc:0 "Nhà ga T3 Tân Sơn Nhất khánh thành ngày 19/4/2025 sau 28 tháng thi công, vốn gần 11.000 tỷ đồng do ACV đầu tư. Đây là nhà ga nội địa lớn nhất cả nước, công suất 20 triệu khách mỗi năm."
 VIE_socialized_airports:0 "Xã hội hóa đầu tư sân bay"
 VIE_socialized_airports_desc:0 "Cho phép doanh nghiệp tư nhân đầu tư và khai thác cảng hàng không, giảm gánh nặng ngân sách và nhân rộng mô hình sân bay tư nhân đầu tiên."
 VIE_acv_monopoly:0 "Giữ vai trò chủ đạo của ACV"
 VIE_acv_monopoly_desc:0 "Tổng công ty Cảng hàng không tiếp tục quản lý và đầu tư hệ thống sân bay quốc gia. Nhà nước kiểm soát chặt, nhưng mọi gánh nặng vốn nằm trên một đầu mối."
 VIE_dual_use_airports:0 "Sân bay lưỡng dụng"
 VIE_dual_use_airports_desc:0 "Các sân bay dân sự được quy hoạch đồng thời cho nhu cầu quân sự, phục vụ cả vận tải thương mại lẫn cơ động của lực lượng phòng không – không quân."
 VIE_van_don_airport:0 "Sân bay Vân Đồn"
 VIE_van_don_airport_desc:0 "Cảng hàng không quốc tế Vân Đồn do Sun Group đầu tư theo hình thức BOT, khánh thành ngày 30/12/2018. Đây là sân bay đầu tiên ở Việt Nam do tư nhân đầu tư, mở cửa ngõ hàng không cho Quảng Ninh."
 VIE_airport_network_2030:0 "Quy hoạch mạng lưới cảng hàng không đến 2030"
 VIE_airport_network_2030_desc:0 "Quyết định 648/QĐ-TTg (7/6/2023) phê duyệt Quy hoạch tổng thể hệ thống cảng hàng không, sân bay toàn quốc thời kỳ 2021–2030: 30 cảng hàng không theo mô hình trục – nan với hai đầu mối Hà Nội và TP. Hồ Chí Minh, cần khoảng 420.000 tỷ đồng vốn đầu tư."
 vie_infra.3.t:0 "Vietnam Airlines giữa đại dịch"
 vie_infra.3.d:0 "Đường bay quốc tế gần như ngừng hoàn toàn, hãng hàng không quốc gia thua lỗ nặng và cạn tiền mặt. Trên thực tế, Nghị quyết 135/2020/QH14 cho Vietnam Airlines gói giải pháp thanh khoản 12.000 tỷ đồng để tránh phá sản."
 vie_infra.3.a:0 "Hỗ trợ hãng hàng không quốc gia."
 vie_infra.3.b:0 "Để thị trường tự điều tiết."
 VIE_logistics_idea:0 "Hệ thống logistics hiện đại"
 VIE_logistics_idea_desc:0 "Chi phí logistics giảm nhờ liên kết đường bộ, đường sắt, cảng biển và kho bãi, giúp hàng xuất khẩu Việt Nam cạnh tranh hơn."
 VIE_synchronized_infra_idea:0 "Hạ tầng đồng bộ"
 VIE_synchronized_infra_idea_desc:0 "Cao tốc, đường sắt tốc độ cao và sân bay lớn hoạt động như một hệ thống thống nhất, nối liền các vùng kinh tế với cảng biển và cửa khẩu."
 VIE_infrastructure_breakthrough_nq13:0 "Đột phá chiến lược về hạ tầng"
 VIE_infrastructure_breakthrough_nq13_desc:0 "Nghị quyết 13-NQ/TW (1/2012) xác định xây dựng hệ thống kết cấu hạ tầng đồng bộ là một trong ba khâu đột phá chiến lược, đặt nền cho hàng loạt dự án giao thông lớn trong thập kỷ sau."
 VIE_logistics_strategy:0 "Chiến lược phát triển logistics"
 VIE_logistics_strategy_desc:0 "Kế hoạch hành động nâng cao năng lực cạnh tranh và phát triển dịch vụ logistics gắn cảng biển với đường bộ, đường sắt, nhằm giảm chi phí logistics trong GDP."
 VIE_synchronized_infrastructure_2030:0 "Hạ tầng đồng bộ năm 2030"
 VIE_synchronized_infrastructure_2030_desc:0 "Mạng cao tốc 5.000 km, đường sắt tốc độ cao Bắc – Nam đã khởi công và sân bay Long Thành đi vào khai thác. Kết cấu hạ tầng giao thông đồng bộ trở thành nền tảng cho giai đoạn phát triển tiếp theo."

 VIE_infra_d_road_3000_1:0 "Giải ngân mốc 3.000 km"
 VIE_infra_d_road_3000_1_desc:0 " Ngân sách 10,5 tỷ USD (tư nhân: 7,875 tỷ USD), thời gian 365 ngày. Tiến độ cao tốc +1200 km. Hạ tầng +1 tại 521, 519, 522. Tiền được trừ một lần lúc bắt đầu. Nếu mất quyền sở hữu hoặc kiểm soát state mục tiêu trước bàn giao, hoàn lại tiền và chưa tăng tiến độ. Công trình đạt trần không được xây bù ở nơi khác."

 VIE_vinashin_risk_reset_tt:0 "Xóa bỏ nguy cơ một tập đoàn kinh tế nhà nước lớn sụp đổ vì nợ nần (sự kiện §YVinashin§! sẽ không xảy ra)"

 ### Events: Party Congresses (Phase 2)
 vie_pol.6.t:0 "Đại hội Đảng lần thứ XIII"
 vie_pol.6.d:0 "Đại hội khai mạc trong bối cảnh đất nước vừa kiểm soát thành công đại dịch và ban lãnh đạo Đảng đã trải qua 5 năm siết chặt kỷ luật nội bộ. Câu hỏi lớn đặt ra là liệu có nên giữ Tổng Bí thư ở lại tiếp tục nhiệm kỳ thứ ba vượt quy định thông thường hay không."
 vie_pol.6.a:0 "Đồng chí Nguyễn Phú Trọng được tín nhiệm bầu nhiệm kỳ thứ ba"
 vie_pol.6.b:0 "Ban lãnh đạo chủ trương cải cách được chuẩn y"
 vie_pol.6.c:0 "Chuẩn y ban lãnh đạo đương nhiệm"
 vie_pol.7.t:0 "Hội nghị Trung ương Bất thường"
 vie_pol.7.d:0 "Đồng chí Tổng Bí thư từ trần khi đang tại chức. Ban Chấp hành Trung ương triệu tập hội nghị bất thường và thống nhất bầu nguyên Bộ trưởng Bộ Công an, người đang giữ chức Chủ tịch nước và trực tiếp chỉ đạo mặt trận nội chính của chiến dịch chống tham nhũng."
 vie_pol.7.a:0 "Đồng chí Tô Lâm được bầu làm Tổng Bí thư"
 vie_pol.8.t:0 "Đại hội Đảng lần thứ XIV"
 vie_pol.8.d:0 "Đại hội vạch ra phương hướng phát triển cho giai đoạn 2026-2031, với các mục tiêu tăng trưởng đầy tham vọng, tinh gọn bộ máy nhà nước và đặt trọng tâm mới vào khoa học công nghệ cùng kinh tế tư nhân."
 vie_pol.8.a:0 "Đồng chí Tô Lâm tái đắc cử Tổng Bí thư"
 vie_pol.8.b:0 "Đảng chuẩn y ban lãnh đạo kế cận"
 vie_pol.9.t:0 "Nhất thể hóa Chức danh Lãnh đạo"
 vie_pol.9.d:0 "Quốc hội bầu Tổng Bí thư đồng thời giữ chức Chủ tịch nước, thống nhất vị trí lãnh đạo cao nhất của Đảng và Nhà nước vào một người lần đầu tiên sau nhiều thập kỷ."
 vie_pol.9.a:0 "Thống nhất sự lãnh đạo tối cao"

 ### Events: economy (Phase 2)
 vie_eco.3.t:0 "Đại án PMU18"
 vie_eco.3.d:0 "Các quan chức tại Ban Quản lý Dự án 18 thuộc Bộ Giao thông Vận tải bị cáo buộc đánh bạc bằng tiền ngân sách dành cho các dự án xây dựng đường bộ. Vụ bê bối lan rộng tới tận một bộ trưởng đương nhiệm, thu hút sự chú ý theo dõi gắt gao của dư luận."
 vie_eco.3.a:0 "Điều tra quyết liệt đến cùng và chấp nhận đơn từ chức của lãnh đạo"
 vie_eco.3.b:0 "Khoanh vùng và giảm thiểu ảnh hưởng tiêu cực"
 vie_eco.4.t:0 "Lạm phát Bùng phát"
 vie_eco.4.d:0 "Chỉ số giá tiêu dùng tăng vọt hơn 20% mỗi năm, thâm hụt thương mại phình to, trong khi thị trường chứng khoán và bất động sản rơi vào tình trạng tăng trưởng quá nóng. Chính phủ đứng trước lựa chọn sinh tử giữa tăng trưởng và ổn định kinh tế vĩ mô."
 vie_eco.4.a:0 "Siết chặt tín dụng và cắt giảm đầu tư công"
 vie_eco.4.b:0 "Ưu tiên duy trì tăng trưởng và chấp nhận lạm phát cao"
 vie_eco.5.t:0 "Vinashin Vỡ nợ"
 vie_eco.5.d:0 "Tập đoàn Công nghiệp Tàu thủy Việt Nam (Vinashin) mất khả năng thanh toán các khoản vay quốc tế khổng lồ. Khoản nợ hàng tỷ USD phơi bày thực trạng vay nợ tràn lan và sự buông lỏng quản lý, giám sát tại các tập đoàn kinh tế nhà nước."
 vie_eco.5.a:0 "Tái cơ cấu và dùng ngân sách giải cứu"
 vie_eco.5.b:0 "Khởi tố ban điều hành và tiến hành tái cơ cấu toàn diện"
 vie_eco.6.t:0 "Hiện tượng Cá Chết Hàng Loạt tại Hà Tĩnh"
 vie_eco.6.d:0 "Hàng tấn cá chết dạt vào bờ biển bốn tỉnh miền Trung. Các cơ quan điều tra kết luận nguyên nhân xuất phát từ việc xả thải trái phép của nhà máy luyện thép mới xây dựng. Ngư dân và người dân ven biển vô cùng bức xúc đòi hỏi câu trả lời thỏa đáng."
 vie_eco.6.a:0 "Công khai xử lý nghiêm trách nhiệm của doanh nghiệp"
 vie_eco.6.b:0 "Dàn xếp đền bù trong êm thấm và kiểm soát truyền thông"
 vie_eco.7.t:0 "Nợ Xấu Chất chồng"
 vie_eco.7.d:0 "Sự đóng băng của thị trường bất động sản đã để lại cho các ngân hàng một núi nợ xấu khổng lồ. Dòng vốn tín dụng bị tắc nghẽn đối với các doanh nghiệp thuộc mọi quy mô."
 vie_eco.7.a:0 "Thành lập công ty quản lý tài sản quốc gia (VAMC)"
 vie_eco.7.b:0 "Để hệ thống ngân hàng tự xử lý nợ xấu"
 vie_eco.8.t:0 "Đại án Kít xét nghiệm Việt Á"
 vie_eco.8.d:0 "Cơ quan điều tra phát hiện một công ty công nghệ đã nâng khống giá kít xét nghiệm COVID-19 bán cho các bệnh viện, trong khi nhiều quan chức nhận hối lộ để cấp phép lưu hành. Vụ án nhanh chóng lan rộng tới lãnh đạo Bộ Y tế và các cơ quan hữu quan."
 vie_eco.8.a:0 "Nhanh chóng khởi tố và xử lý nghiêm minh"
 vie_eco.8.b:0 "Khoanh vùng trách nhiệm trong nội bộ công ty"
 vie_eco.9.t:0 "Khủng hoảng Trái phiếu Doanh nghiệp"
 vie_eco.9.d:0 "Hàng loạt nhà phát triển bất động sản không thể đảo nợ trái phiếu khi đến hạn. Nhà đầu tư hoang mang bán tháo, còn các ngân hàng nắm giữ trái phiếu lo sợ nguy cơ lây lan rủi ro hệ thống."
 vie_eco.9.a:0 "Nới lỏng các quy định pháp lý để tạo thời gian tháo gỡ"
 vie_eco.9.b:0 "Thực thi nghiêm quy định và chấp nhận để doanh nghiệp yếu kém phá sản"
 vie_eco.10.t:0 "Bản án Đại án Vạn Thịnh Phát"
 vie_eco.10.d:0 "Tòa án tuyên những bản án nghiêm khắc nhất trong vụ án lừa đảo chiếm đoạt tài sản làm chao đảo một trong những tập đoàn bất động sản lớn nhất nước và một ngân hàng thương mại lớn. Người gửi tiền và các cơ quan điều hành tài chính đang dõi theo từng diễn biến tiếp theo."
 vie_eco.10.a:0 "Xử lý nghiêm minh theo đúng pháp luật"
 vie_eco.10.b:0 "Ưu tiên hàng đầu cho sự an toàn của hệ thống ngân hàng"
 vie_eco.11.t:0 "Washington Đe dọa Áp Thuế trừng phạt Cao"
 vie_eco.11.d:0 "Hoa Kỳ công bố áp mức thuế quan mới rất cao đối với hàng hóa Việt Nam. Các doanh nghiệp xuất khẩu điện tử, dệt may và đồ gỗ bàng hoàng; Hoa Kỳ hiện là thị trường xuất khẩu lớn nhất của Việt Nam."
 vie_eco.11.a:0 "Cử ngay phái đoàn cấp cao sang đàm phán"
 vie_eco.11.b:0 "Giữ vững lập trường và chủ động tìm kiếm các thị trường thay thế"
 vie_eco.12.t:0 "Khuôn khổ Thương mại với Hoa Kỳ"
 vie_eco.12.d:0 "Sau nhiều tuần đàm phán căng thẳng, hai chính phủ đã đạt được thỏa thuận khung: duy trì mức thuế thấp đối với hàng hóa xuất xứ Việt Nam và áp thuế cao đối với hàng tạm nhập tái xuất mượn đường qua Việt Nam, đổi lại việc mở cửa thị trường cho các sản phẩm của Mỹ."
 vie_eco.12.a:0 "Chấp thuận thỏa thuận khung"
 vie_eco.12.b:0 "Tiếp tục thương lượng để đòi thêm điều khoản có lợi"

 ### Events: South China Sea (Phase 2)
 vie_scs.4.t:0 "Tàu Khảo sát Bình Minh 02 Bị Cắt Cáp"
 vie_scs.4.d:0 "Tàu hải giám Trung Quốc cố tình cắt cáp thăm dò địa chấn của tàu Bình Minh 02 thuộc Tập đoàn Dầu khí Việt Nam ngay trong vùng đặc quyền kinh tế của Việt Nam. Sự việc được các cơ quan truyền thông trong nước đưa tin rầm rộ."
 vie_scs.4.a:0 "Trao công hàm phản đối hòa bình"
 vie_scs.4.b:0 "Tổ chức diễn tập bắn đạn thật ngoài khơi bờ biển"
 vie_scs.5.t:0 "Thông qua Luật Biển Việt Nam"
 vie_scs.5.d:0 "Quốc hội xem xét thông qua Luật Biển khẳng định chủ quyền và quyền tài phán của Việt Nam đối với Quần đảo Hoàng Sa và Quần đảo Trường Sa. Bắc Kinh đưa ra những lời đe dọa rằng việc thông qua luật sẽ là một sai lầm nghiêm trọng."
 vie_scs.5.a:0 "Chính thức biểu quyết thông qua luật"
 vie_scs.5.b:0 "Tạm hoãn việc thông qua"
 vie_scs.6.t:0 "Phán quyết của Tòa Trọng tài Quốc tế"
 vie_scs.6.d:0 "Tòa Trọng tài Quốc tế ra phán quyết về vụ Philippines kiện các yêu sách phi pháp của Trung Quốc ở Biển Đông. Dù không phải là một bên tham gia vụ kiện, lập luận của phán quyết ảnh hưởng trực tiếp đến lợi ích của Việt Nam, trong khi Bắc Kinh tuyên bố bác bỏ hoàn toàn phán quyết."
 vie_scs.6.a:0 "Hoan nghênh phán quyết và kêu gọi các bên tuân thủ luật pháp quốc tế"
 vie_scs.6.b:0 "Phát ngôn chừng mực nhằm tránh kích động Bắc Kinh"
 vie_scs.6.c:0 "Tận dụng phán quyết làm đòn bẩy ngoại giao đa phương"
 vie_scs.7.t:0 "Sức ép lên các Lô Thăm dò Dầu khí"
 vie_scs.7.d:0 "Các nhà ngoại giao Trung Quốc đưa ra những cảnh báo thẳng thừng bất thường rằng mọi hoạt động khoan thăm dò tại các lô dầu khí nằm trong đường chín đoạn phải dừng lại ngay lập tức. Đối tác quốc tế đang chịu sức ép lớn và tập đoàn dầu khí quốc gia đang xin ý kiến chỉ đạo."
 vie_scs.7.a:0 "Tạm dừng hoạt động khoan thăm dò"
 vie_scs.7.b:0 "Kiên quyết tiếp tục khoan và tăng cường bảo vệ các điểm đảo"
 vie_scs.8.t:0 "Căng thẳng Đối đầu tại Bãi Tư Chính"
 vie_scs.8.d:0 "Tàu khảo sát địa chấn Trung Quốc cùng dàn tàu hải cảnh hộ tống đã xâm phạm và hoạt động suốt nhiều tuần trong vùng đặc quyền kinh tế của Việt Nam gần khu vực Bãi Tư Chính, gần sát giàn khoan đang khai thác hợp pháp của Việt Nam."
 vie_scs.8.a:0 "Điều động tàu chấp pháp bám sát và gửi công hàm ngoại giao phản đối"
 vie_scs.8.b:0 "Xử lý kiềm chế và hạ nhiệt căng thẳng"

 ### Events: diplomacy (Phase 2)
 vie_dip.1.t:0 "Dỡ bỏ Hoàn toàn Lệnh Cấm vận Vũ khí"
 vie_dip.1.d:0 "Trong chuyến thăm chính thức Hà Nội, Tổng thống Hoa Kỳ đã tuyên bố dỡ bỏ hoàn toàn lệnh cấm vận vũ khí sát thương đối với Việt Nam, chấm dứt tàn dư cấm vận kéo dài từ thời chiến tranh. Hà Nội khẳng định chính sách quốc phòng không liên minh quân sự vẫn nhất quán không thay đổi."
 vie_dip.1.a:0 "Hoan nghênh quyết định lịch sử"
 vie_dip.2.t:0 "Hội nghị Thượng đỉnh Mỹ - Triều tại Hà Nội"
 vie_dip.2.d:0 "Lãnh đạo cấp cao Hoa Kỳ và Triều Tiên lựa chọn thủ đô Hà Nội làm địa điểm tổ chức hội nghị thượng đỉnh lần thứ hai. Giới truyền thông toàn cầu đổ dồn về thủ đô để đưa tin về sự kiện ngoại giao lịch sử này."
 vie_dip.2.a:0 "Đón tiếp với nghi thức ngoại giao trọng thể nhất"
 vie_dip.2.b:0 "Tổ chức chừng mực, kín đáo"
 vie_dip.3.t:0 "Nâng cấp Quan hệ Đối tác Chiến lược Toàn diện với Hoa Kỳ"
 vie_dip.3.d:0 "Tổng thống Hoa Kỳ thăm Hà Nội và đề xuất nâng cấp quan hệ song phương lên mức cao nhất: Đối tác Chiến lược Toàn diện. Bắc Kinh đang theo dõi sát sao từng bước đi này."
 vie_dip.3.a:0 "Chính thức nâng cấp quan hệ đối tác"
 vie_dip.3.b:0 "Duy trì quan hệ ở mức độ hiện tại"
 vie_dip.4.t:0 "Dự án Kênh đào Phù Nam Techo"
 vie_dip.4.d:0 "Campuchia khởi công dự án kênh đào quy mô lớn nối sông Mekong ra Vịnh Thái Lan. Các chuyên gia thủy văn Việt Nam cảnh báo công trình có thể làm sụt giảm nghiêm trọng lưu lượng dòng chảy mùa khô đổ về đồng bằng sông Cửu Long."
 vie_dip.4.a:0 "Yêu cầu đánh giá tác động môi trường toàn diện"
 vie_dip.4.b:0 "Đề xuất hợp tác và chia sẻ dữ liệu thủy văn"

 ### Events: society and disasters (Phase 2)
 vie_soc.1.t:0 "Dịch SARS Xuất hiện tại Hà Nội"
 vie_soc.1.d:0 "Một doanh nhân nước ngoài nhập viện tại Hà Nội với các triệu chứng lạ và căn bệnh nhanh chóng lây lan sang các nhân viên y tế. Các bác sĩ đã nhanh chóng nhận diện chủng virus mới nguy hiểm và đề nghị phong tỏa bệnh viện ngay lập tức."
 vie_soc.1.a:0 "Cách ly nghiêm ngặt bệnh viện và kiểm soát chặt chẽ biên giới"
 vie_soc.1.b:0 "Xử lý kín đáo để tránh ảnh hưởng đến hoạt động kinh doanh"
 vie_soc.2.t:0 "Dịch Cúm Gia cầm Bùng phát"
 vie_soc.2.d:0 "Đàn gia cầm trên khắp cả nước chết hàng loạt và đã xuất hiện những ca lây nhiễm đầu tiên sang người. Việc tiêu hủy trên diện rộng có thể phá hủy kế sinh nhai của hàng triệu hộ nông dân nhỏ lẻ."
 vie_soc.2.a:0 "Tiêu hủy gia cầm nhiễm bệnh và tiêm phòng vắc-xin trên diện rộng"
 vie_soc.2.b:0 "Giới hạn khoanh vùng xử lý ở các khu vực tâm dịch nặng nhất"
 vie_soc.3.t:0 "Lũ lụt Lịch sử tại Các Tỉnh Miền Trung"
 vie_soc.3.d:0 "Nhiều ngày mưa lớn xối xả làm nước các con sông dâng cao đột ngột. Hàng trăm ngôi làng bị cô lập trong biển nước, đường sá bị chia cắt hoàn toàn và các hồ chứa buộc phải xả lũ khẩn cấp."
 vie_soc.3.a:0 "Cấp tốc chuyển hàng cứu trợ khẩn cấp tới đồng bào"
 vie_soc.3.b:0 "Để chính quyền địa phương tự lực ứng phó"
 vie_soc.4.t:0 "Hạn Mặn Lịch sử tại Đồng Bằng Sông Cửu Long"
 vie_soc.4.d:0 "Đợt hạn hán nghiêm trọng nhất trong một thế kỷ khiến mực nước sông Mekong xuống mức thấp kỷ lục và nước biển mặn xâm nhập sâu vào nội đồng. Hàng trăm ngàn héc-ta lúa và vườn cây ăn trái ở miền Tây khô héo."
 vie_soc.4.a:0 "Cung cấp nước ngọt sinh hoạt và hỗ trợ tài chính cho nông dân"
 vie_soc.4.b:0 "Để nông dân chủ động thích ứng với biến đổi khí hậu"
 vie_soc.5.t:0 "Xâm nhập Mặn Tái diễn"
 vie_soc.5.d:0 "Lần thứ hai trong vòng năm năm, nước biển mặn lại lấn sâu vào các con sông vùng đồng bằng sông Cửu Long trong mùa khô hạn."
 vie_soc.5.a:0 "Tập trung mọi nguồn lực ứng phó"
 vie_soc.6.t:0 "Chống Dịch COVID-19"
 vie_soc.6.d:0 "Chủng virus corona mới lây lan nhanh chóng trên quy mô toàn cầu. Dù nguồn lực giường bệnh còn hạn chế, Việt Nam sở hữu một hệ thống chính trị cơ sở vận hành cực kỳ chặt chẽ trong việc truy vết tiếp xúc và tổ chức cách ly tập trung."
 vie_soc.6.a:0 "Truy vết quyết liệt và áp dụng cách ly nghiêm ngặt"
 vie_soc.6.b:0 "Ưu tiên mở cửa duy trì hoạt động kinh tế"
 vie_soc.7.t:0 "Siêu bão Yagi Đổ bộ"
 vie_soc.7.d:0 "Một trong những cơn bão mạnh nhất lịch sử từng đổ bộ vào miền Bắc Việt Nam quét qua đất liền, quật ngã cây cối, tàn phá nhà cửa và làm ngập lụt nghiêm trọng các dòng sông. Lũ quét và sạt lở đất vùi lấp nhiều ngôi làng miền núi."
 vie_soc.7.a:0 "Huy động quân đội cùng các nguồn quỹ cứu trợ khẩn cấp"
 vie_soc.7.b:0 "Giao toàn quyền chủ động cho chính quyền các địa phương"

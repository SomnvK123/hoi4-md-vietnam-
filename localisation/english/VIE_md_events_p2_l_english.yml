 VIE_fourteenth_congress_held:0 "Đại hội Đảng lần thứ XIV đã được tổ chức"
 VIE_us_arms_open_tt:0 "Lệnh cấm vận vũ khí của Hoa Kỳ đã được dỡ bỏ hoàn toàn"

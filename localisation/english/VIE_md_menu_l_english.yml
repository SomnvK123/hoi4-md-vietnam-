 ### Custom Game Rules: AI behaviour
 VIE_AI_BEHAVIOR:0 "@VIE Việt Nam"
 VIE_RULE_OPTION_DEFAULT_AI_DESC:0 "AI của Việt Nam đi theo đường lối Đổi Mới và 'ngoại giao cây tre': cải cách ổn định, không liên minh quân sự, duy trì quan hệ tốt đẹp với mọi quốc gia. Các ngã rẽ thay thế chỉ mở ra nếu luật chơi 'Việt Nam: Lịch sử Giả định' cho phép."
 VIE_HISTORICAL:0 "Kế thừa Lịch sử"
 VIE_HISTORICAL_DESC:0 "Đảng tiếp tục nắm quyền và đi theo tiến trình lịch sử: Đổi Mới, WTO, CPTPP, chính sách Bốn Không. AI sẽ không bao giờ lựa chọn bất kỳ phương án rẽ nhánh nào tại các bước ngoặt."
 VIE_REFORM:0 "Đổi mới Sâu rộng"
 VIE_REFORM_DESC:0 "Phe cải cách trong Đảng giành ưu thế. AI xây dựng một nhà nước kiến tạo phát triển, nới lỏng báo chí, mở đối thoại xã hội dân sự và tiến tới đa nguyên có kiểm soát, cuối cùng là bầu cử tự do."
 VIE_HARDLINE:0 "Đường lối Cứng rắn Thân Trung Quốc"
 VIE_HARDLINE_DESC:0 "Phe bảo thủ giành thắng lợi sớm. AI kiên định bảo vệ các nền tảng, mở rộng khu vực kinh tế nhà nước, thắt chặt quan hệ với Bắc Kinh và Moskva, từ bỏ chính sách Bốn Không. Bộ máy an ninh ngày càng giữ vai trò lớn hơn."
 VIE_WESTERN:0 "Ngả sang Phương Tây"
 VIE_WESTERN_DESC:0 "Hà Nội đối phó với sức ép từ Trung Quốc bằng cách liên kết chặt chẽ với Washington và các đối tác. Hàng loạt hiệp định thương mại và hợp tác quân sự được triển khai; Bắc Kinh phản ứng bằng các đòn trừng phạt kinh tế."

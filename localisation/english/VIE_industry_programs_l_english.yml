 VIE_industrialization_strategy:0 "Chiến lược công nghiệp hóa quốc gia"
 VIE_industrialization_strategy_desc:0 "Phát triển năng lực quốc gia qua chính sách và đầu tư có thời gian. Focus mở chương trình; quyết sách giải ngân và bàn giao mới cấp công trình, điểm và phần thưởng. Yêu cầu game mới."
 VIE_supporting_industries:0 "Phát triển công nghiệp hỗ trợ"
 VIE_supporting_industries_desc:0 "Hợp nhất cơ khí chính xác, khuôn mẫu, nhà cung ứng Tier-1 và cụm hỗ trợ. Phát triển năng lực quốc gia qua chính sách và đầu tư có thời gian. Focus mở chương trình; quyết sách giải ngân và bàn giao mới cấp công trình, điểm và phần thưởng. Yêu cầu game mới."
 VIE_vinashin_restructuring_sbic:0 "Tái cơ cấu ngành đóng tàu"
 VIE_vinashin_restructuring_sbic_desc:0 "Có thể quản trị và cải cách trước khủng hoảng 2010. Rủi ro di sản được ghi nhận trước năm 2010; đầu tư quản trị giảm risk về 0 nhưng không tự coi khủng hoảng đã được xử lý. Phát triển năng lực quốc gia qua chính sách và đầu tư có thời gian. Focus mở chương trình; quyết sách giải ngân và bàn giao mới cấp công trình, điểm và phần thưởng. Yêu cầu game mới."

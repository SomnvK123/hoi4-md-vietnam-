 VIE_scs_maritime_cooperation:0 "Hợp tác An ninh Biển"
 VIE_scs_maritime_cooperation_desc:0 "Đặt luật pháp biển làm nền để Việt Nam cùng ASEAN và các đối tác quản lý Biển Đông bằng hợp tác thay vì đối đầu. Mở nhóm quyết định hợp tác an ninh biển."
 VIE_scs_multilateral_exercise:0 "Tập trận Hải quân Đa phương"
 VIE_scs_multilateral_exercise_desc:0 "Tham gia và đăng cai các cuộc diễn tập hàng hải quy mô khu vực để nâng cao khả năng phối hợp, tìm kiếm cứu nạn và đối phó sự cố trên biển. Mở quyết định tập trận."
 VIE_scs_cam_ranh_port:0 "Cảng Cam Ranh Mở cửa cho Tàu Quốc tế"
 VIE_scs_cam_ranh_port_desc:0 "Cảng quốc tế Cam Ranh cung cấp dịch vụ hậu cần, sửa chữa cho tàu hải quân và tàu dân sự của mọi nước, không phải căn cứ nước ngoài. Chính sách chỉ còn ý nghĩa khi Việt Nam giữ đường lối không liên minh. Mở quyết định tiếp đón tàu nước ngoài."
 VIE_scs_joint_training:0 "Huấn luyện chung với Đối tác"
 VIE_scs_joint_training_desc:0 "Hợp tác đào tạo kíp tàu, cứu hộ tàu ngầm và tuần tra với những đối tác đã ký kết quan hệ quốc phòng. Mở các quyết định huấn luyện chung với Ấn Độ, Nga và Nhật Bản."
 VIE_scs_cooperation_category:0 "Hợp tác An ninh Biển"
 VIE_scs_cooperation_category_desc:0 "Tập trận, tiếp đón tàu nước ngoài ghé cảng Cam Ranh và huấn luyện chung với các đối tác. Không phải liên minh quân sự và không có căn cứ nước ngoài."
 VIE_scs_d1_exercise:0 "Tổ chức Diễn tập Hàng hải"
 VIE_scs_d1_exercise_desc:0 "Tổ chức một cuộc diễn tập hàng hải. Có thể chỉ mời các nước ASEAN hoặc mời thêm Mỹ, Nhật, Úc."
 VIE_scs_d2_port_call:0 "Đón Tàu Hải quân Nước ngoài Thăm Cảng"
 VIE_scs_d2_port_call_desc:0 "Mời hải quân một nước ghé thăm Cam Ranh. Mỗi nước chỉ được mời lại sau ba năm."
 VIE_scs_d3_train_raj:0 "Huấn luyện chung với Ấn Độ"
 VIE_scs_d3_train_raj_desc:0 "Hải quân Ấn Độ cùng đào tạo kíp tàu ngầm và tàu mặt nước của Việt Nam."
 VIE_scs_d4_train_sov:0 "Huấn luyện chung với Nga"
 VIE_scs_d4_train_sov_desc:0 "Chuyên gia Nga huấn luyện kíp tàu ngầm lớp Kilo tại Cam Ranh."
 VIE_scs_d5_train_jap:0 "Huấn luyện chung với Nhật Bản"
 VIE_scs_d5_train_jap_desc:0 "Lực lượng tuần duyên và hải quân Nhật Bản huấn luyện chung và hỗ trợ kỹ thuật tàu tuần tra."
 VIE_scs_non_aligned_tt:0 "Việt Nam còn giữ đường lối không liên minh (Bốn Không)."
 VIE_scs_pc_any_tt:0 "Có ít nhất một nước có thể gửi tàu thăm cảng: tồn tại, không có chiến tranh với Việt Nam và chưa thăm trong ba năm qua."
 vie_scs_coop.1.t:0 "Diễn tập Hàng hải trên Biển Đông"
 vie_scs_coop.1.d:0 "Bộ Quốc phòng đề xuất một cuộc diễn tập tìm kiếm cứu nạn và an ninh hàng hải. Quy mô và thành phần tham gia sẽ gửi đi một thông điệp ngoại giao rõ rệt."
 vie_scs_coop.1.a:0 "Chỉ mời các nước ASEAN"
 vie_scs_coop.1.b:0 "Mời thêm Mỹ, Nhật Bản và Úc"
 vie_scs_coop.10.t:0 "Tàu Hải quân Nước ngoài Xin Ghé Cảng"
 vie_scs_coop.10.d:0 "Một số hải quân đề nghị đưa tàu ghé Cam Ranh để tiếp liệu và giao lưu. Việt Nam chỉ cung cấp dịch vụ hậu cần, không cho đặt căn cứ và cần giữ cân bằng giữa các nước."
 vie_scs_coop.10.a:0 "Đón tàu Nhật Bản"
 vie_scs_coop.10.b:0 "Đón tàu Ấn Độ"
 vie_scs_coop.10.c:0 "Đón tàu Hoa Kỳ"
 vie_scs_coop.10.h:0 "Đón tàu Pháp"
 vie_scs_coop.10.e:0 "Đón tàu Úc"
 vie_scs_coop.10.f:0 "Đón tàu Nga"
 vie_scs_coop.10.g:0 "Đón tàu Trung Quốc"


l_english:

# ====================================================================
# SECTION: VIE_md_land_force_l_english.yml
# ====================================================================

 VIE_lf_root_modern_army:0 "Đề án hiện đại hóa lục quân có chọn lọc"
 VIE_lf_root_modern_army_desc:0 "Lập chương trình rà soát chất lượng biên chế, trang bị và bảo đảm kỹ thuật. Chọn cách phân bổ nguồn lực giữa thế trận lãnh thổ, quân chủ lực và cơ sở chế tạo khí tài."
 VIE_lf_l0_reward_tt:0 "Tổ chức lục quân: §G+1%§!. Mở đồng thời ba chương trình quốc phòng toàn dân, lục quân hợp thành và công nghiệp trang bị."
 VIE_lf_territorial_defense_foundation:0 "Rà soát thế trận phòng thủ quân khu"
 VIE_lf_territorial_defense_foundation_desc:0 "Chuẩn hóa trách nhiệm tổ chức phòng thủ và phối hợp với quân chủ lực; tránh nhầm quân khu thành quân đoàn cơ động."
 VIE_lf_d1_reward_tt:0 "Thiết lập nền phòng thủ: phòng thủ lục quân trên lãnh thổ cốt lõi §G+1%§!."
 VIE_lf_local_forces_militia:0 "Chuẩn hóa huấn luyện bộ đội địa phương, dân quân"
 VIE_lf_local_forces_militia_desc:0 "Xây dựng huấn luyện nền tảng, kỹ năng cứu hộ và khả năng phối hợp của lực lượng tại chỗ, không biến dân quân thành quân chính quy tự động."
 VIE_lf_d2_reward_tt:0 "Thời gian huấn luyện: §G−1%§!; nhận §G10§! kinh nghiệm lục quân hoặc độ thông thạo học thuyết đã chọn."
 VIE_lf_reserve_mobilization:0 "Kiện toàn đăng ký và huấn luyện dự bị động viên"
 VIE_lf_reserve_mobilization_desc:0 "Rà soát hệ thống đăng ký, huấn luyện và nguồn trang bị phục vụ huy động. Một lực lượng dự bị được quản lý đầy đủ sẽ giúp bổ sung quân số có tổ chức khi đất nước cần."
 VIE_lf_d3_reward_tt:0 "Tốc độ động viên: §G+5%§!; tỷ lệ tiếp viện: §G+0,5 điểm phần trăm§!. Không tăng trực tiếp manpower."
 VIE_lf_strategic_defense_zones:0 "Củng cố khu vực phòng thủ địa phương"
 VIE_lf_strategic_defense_zones_desc:0 "Hoàn thiện chỉ huy và kế hoạch diễn tập khu vực phòng thủ, đồng bộ với cơ cấu địa phương ở từng thời kỳ."
 VIE_lf_d4_reward_tt:0 "Thay bậc phòng thủ lãnh thổ trước: phòng thủ lục quân trên lãnh thổ cốt lõi đạt §G+2%§!, không cộng hai bậc."
 VIE_lf_fortifications_defense_sites:0 "Công trình và cơ sở bảo đảm phòng thủ"
 VIE_lf_fortifications_defense_sites_desc:0 "Chuẩn hóa việc sử dụng trận địa, kho bãi và cơ sở bảo đảm phòng thủ. Chuẩn bị công sự và bảo dưỡng cơ sở hiện có giúp lực lượng tại chỗ duy trì khả năng bảo vệ địa bàn."
 VIE_lf_d5_reward_tt:0 "Hệ số đào hào tối đa: §G+3%§!. Không xây thêm công trình miễn phí."
 VIE_lf_local_logistics_stockpiles:0 "Mạng dự trữ và cung ứng hậu cần địa phương"
 VIE_lf_local_logistics_stockpiles_desc:0 "Tăng khả năng phối hợp quân sự–dân sự về vận tải, y tế, quân nhu và vật tư tiêu hao khi xảy ra khủng hoảng."
 VIE_lf_d6_reward_tt:0 "Tiêu thụ tiếp tế: §G−1%§!. Nếu đã hoàn tất $VIE_lf_ind_precision_z131$, thêm hỗ trợ vật tư giảm hao hụt §G1%§! một lần."
 VIE_lf_coordination_regular_local:0 "Diễn tập phối hợp quân khu và quân chủ lực"
 VIE_lf_coordination_regular_local_desc:0 "Đưa hệ thống lực lượng tại chỗ và các đơn vị quân chủ lực vào cơ chế huấn luyện phối hợp định kỳ, đánh giá kết quả thay cho đếm số lần diễn tập."
 VIE_lf_d7_reward_tt:0 "Tốc độ lập kế hoạch: §G+1%§!; nhận §G15§! kinh nghiệm hoặc độ thông thạo học thuyết lục quân."
 VIE_lf_active_defense_in_depth:0 "Hoàn thiện thế trận quốc phòng toàn dân thống nhất"
 VIE_lf_active_defense_in_depth_desc:0 "Liên kết khu vực phòng thủ, lực lượng địa phương, dự bị động viên và bảo đảm địa bàn thành một thế trận thống nhất. Quốc phòng toàn dân là nền tảng cho mọi định hướng phát triển quân chủ lực."
 VIE_lf_d8_reward_tt:0 "Thay bậc phòng thủ lãnh thổ trước: phòng thủ lục quân trên lãnh thổ cốt lõi đạt §G+4%§!. Cùng $VIE_lf_modernize_army_command_system$ đáp ứng điều kiện $VIE_lf_modern_elite_combined_army_capstone$."
 VIE_lf_standardize_infantry_structure:0 "Tổ chức lại các quân đoàn chủ lực"
 VIE_lf_standardize_infantry_structure_desc:0 "Rà soát đầu mối tổ chức, chất lượng chỉ huy và hiệu quả biên chế của các quân đoàn chủ lực. Đây là chương trình cải tổ từng bước; các mốc thành lập Quân đoàn 12 năm 2023 và Quân đoàn 34 năm 2024 thuộc quá trình phát triển về sau."
 VIE_lf_b1_reward_tt:0 "Tổ chức lục quân: §G+1%§!. Không tự thành lập Quân đoàn 12 hoặc Quân đoàn 34."
 VIE_lf_combined_arms_readiness:0 "Quản lý chất lượng huấn luyện Quân đoàn"
 VIE_lf_combined_arms_readiness_desc:0 "Xây dựng tiêu chí đánh giá huấn luyện theo năng lực đầu ra, bồi dưỡng cán bộ và tăng ứng dụng giáo án số, mô phỏng. Chương trình là cải cách chất lượng, không phải huấn luyện thêm đơn thuần."
 VIE_lf_b2_reward_tt:0 "Thời gian huấn luyện: §G−3%§!; mức tăng kinh nghiệm lục quân: §G+3%§!."
 VIE_lf_infantry_modern_equipment:0 "Tiêu chuẩn hóa trang bị người lính"
 VIE_lf_infantry_modern_equipment_desc:0 "Tập trung tiêu chuẩn cấp phát, bảo đảm, huấn luyện sử dụng trang bị cá nhân, quang học và thông tin cơ bản cho đơn vị."
 VIE_lf_b3_reward_tt:0 "Một ưu đãi nghiên cứu §G20%§! cho vũ khí bộ binh."
 VIE_lf_b3_research_bonus:0 "Tiêu chuẩn hóa trang bị người lính"
 VIE_lf_combat_engineers:0 "Nâng cao trình độ công binh chiến đấu"
 VIE_lf_combat_engineers_desc:0 "Chuẩn hóa kỹ thuật viên, phương tiện công binh, huấn luyện bảo đảm cơ động và xử lý chướng ngại cho đơn vị mặt đất."
 VIE_lf_b4_reward_tt:0 "Tốc độ đào hào: §G+3%§!; giảm hình phạt địa hình: §G+1%§!."
 VIE_lf_ground_artillery_modernization:0 "Cải tổ huấn luyện Pháo binh – Tên lửa"
 VIE_lf_ground_artillery_modernization_desc:0 "Nâng chất lượng huấn luyện đơn vị pháo binh phục vụ tác chiến mặt đất, chỉ huy hỏa lực và phối hợp với quân chủ lực. Giữ thành lập BTL như cột mốc sự kiện cấp toàn quân."
 VIE_lf_b5_reward_tt:0 "Một ưu đãi nghiên cứu §G20%§! cho pháo binh; nhận §G10§! kinh nghiệm hoặc độ thông thạo học thuyết lục quân."
 VIE_lf_b5_research_bonus:0 "Cải tổ huấn luyện Pháo binh – Tên lửa"
 VIE_lf_tactical_air_defense:0 "Chuẩn hóa phòng không lục quân"
 VIE_lf_tactical_air_defense_desc:0 "Nâng khả năng bảo đảm và huấn luyện của các đơn vị phòng không hỗ trợ đội hình mặt đất. Không trùng nhánh Phòng không–Không quân."
 VIE_lf_b6_reward_tt:0 "Một ưu đãi nghiên cứu §G20%§! cho phòng không. Không cấp trang bị vào kho."
 VIE_lf_b6_research_bonus:0 "Chuẩn hóa phòng không lục quân"
 VIE_lf_recon_tactical_command:0 "Hình thành đơn vị UAV và năng lực trinh sát số"
 VIE_lf_recon_tactical_command_desc:0 "Tập trung đào tạo nhân lực, tổ chức sử dụng dữ liệu trinh sát và phối hợp thông tin tại cấp đơn vị; không mô tả hệ thống C4ISR hoàn chỉnh khi nguồn chưa xác nhận."
 VIE_lf_b7_reward_tt:0 "Trinh sát: §G+2%§!; một ưu đãi nghiên cứu §G15%§! cho UAV mặt đất."
 VIE_lf_b7_research_bonus:0 "Hình thành đơn vị UAV và năng lực trinh sát số"
 VIE_lf_operational_logistics_maintenance:0 "Bảo đảm hậu cần – kỹ thuật theo mô hình hợp nhất"
 VIE_lf_operational_logistics_maintenance_desc:0 "Ứng dụng mô hình phối hợp quân nhu, vận tải, bảo dưỡng và sửa chữa cho lực lượng lục quân; phân biệt đây là chương trình bảo đảm cấp đơn vị, không chiếm nhiệm vụ công nghiệp I."
 VIE_lf_b8_reward_tt:0 "Tiêu thụ tiếp tế: §G−2%§!; hao hụt: §G−2%§!."
 VIE_lf_ind_production_governance:0 "Chuyển đổi công nghệ và quản trị sản xuất quốc phòng"
 VIE_lf_ind_production_governance_desc:0 "Cải tiến quy trình sản xuất, kiểm định ngay trong công đoạn, đào tạo kỹ sư và người vận hành; đánh giá hiệu quả công nghiệp bằng năng suất và chất lượng, không đếm số nhà máy."
 VIE_lf_i1_reward_tt:0 "Tốc độ tăng hiệu suất sản xuất của nhà máy quân sự: §G+3%§! trên toàn quốc."
 VIE_lf_ind_precision_z131:0 "Cơ khí chính xác và công nghiệp đạn dược Z131"
 VIE_lf_ind_precision_z131_desc:0 "Củng cố năng lực gia công, đo kiểm, bảo đảm ổn định chất lượng sản phẩm và cơ chế quản trị vật tư tiêu hao; không khẳng định tự chủ toàn bộ nguyên liệu."
 VIE_lf_i2_reward_tt:0 "Một ưu đãi nghiên cứu §G20%§! cho đạn pháo. Khi $VIE_lf_local_logistics_stockpiles$ hoặc $VIE_lf_p5_protracted_combat_sustainment$ đã hoàn tất, hỗ trợ vật tư giảm hao hụt §G1%§!; hai điều kiện không cộng dồn."
 VIE_lf_i2_research_bonus:0 "Cơ khí chính xác và công nghiệp đạn dược Z131"
 VIE_lf_ind_armor_structures:0 "Làm chủ công nghệ chế tạo kết cấu thiết giáp"
 VIE_lf_ind_armor_structures_desc:0 "Phát triển thiết kế số, gia công kết cấu, công nghệ vật liệu và kiểm định chất lượng thiết giáp. Làm chủ thân vỏ và kết cấu là nền tảng để tích hợp một phương tiện chiến đấu bộ binh trong nước."
 VIE_lf_i3_reward_tt:0 "Một ưu đãi nghiên cứu §G15%§! cho xe chiến đấu bộ binh. Khi $VIE_lf_ind_xcb01_design$ và $VIE_lf_m3_mechanized_infantry_formations$ cùng hoàn tất, giảm thời gian huấn luyện thêm §G1%§!."
 VIE_lf_i3_research_bonus:0 "Làm chủ công nghệ chế tạo kết cấu thiết giáp"
 VIE_lf_ind_xcb01_design:0 "Dự án XCB-01: Thiết kế và tích hợp xe chiến đấu bộ binh"
 VIE_lf_ind_xcb01_design_desc:0 "Gắn nhà máy Z189 với nghiên cứu sản phẩm phức hợp và phối hợp các đơn vị cơ khí, điện tử, quang học, điều khiển; cho phép quyết định nghiên cứu, thử nghiệm và hoàn thiện."
 VIE_lf_i4_reward_tt:0 "Một ưu đãi nghiên cứu §G20%§! cho xe chiến đấu bộ binh. Mở nghiên cứu thiết kế XCB-01, tiếp theo là đánh giá chế thử có chi phí. Không cấp xe hoặc hoàn tất sản xuất loạt."
 VIE_lf_i4_research_bonus:0 "Dự án XCB-01: Thiết kế và tích hợp xe chiến đấu bộ binh"
 VIE_lf_ind_serial_ground_equipment:0 "Công nghiệp hóa sản xuất loạt trang bị mặt đất"
 VIE_lf_ind_serial_ground_equipment_desc:0 "Hình thành năng lực kiểm định, quản lý chất lượng, bảo đảm vật tư, đào tạo thợ và chuẩn bị dây chuyền sản xuất loạt. Thành quả là năng lực công nghiệp có điều kiện, không phải sản xuất vô hạn."
 VIE_lf_i5_reward_tt:0 "Mở chuẩn bị sản xuất loạt XCB-01 khi đã đánh giá chế thử đạt yêu cầu. Hoàn thành đầu tư §Y0,6 tỷ§! trong §Y365 ngày§! mới giảm IC sản xuất IFV §G5%§!. $VIE_lf_ind_serial_ground_equipment$ không bắt buộc cho $VIE_lf_modern_elite_combined_army_capstone$."
 VIE_lf_p1_strategic_defense:0 "Lựa chọn ưu tiên phòng thủ chiến dịch"
 VIE_lf_p1_strategic_defense_desc:0 "Đây là lựa chọn đầu tư của người chơi: tăng ưu tiên xây dựng quân chủ lực có khả năng phòng ngự bền, phối hợp lực lượng địa phương và duy trì đơn vị."
 VIE_lf_p1_reward_tt:0 "Chọn ưu tiên phòng thủ, khóa hai hướng còn lại. Phòng thủ lục quân: §G+1%§!; tốc độ lục quân: §R−1%§!. Không đổi grand doctrine."
 VIE_lf_p2_multi_layered_defense:0 "Huấn luyện phòng ngự nhiều lớp"
 VIE_lf_p2_multi_layered_defense_desc:0 "Chuẩn hóa huấn luyện phối hợp phòng thủ trong nhiều môi trường địa hình ở cấp đơn vị và chiến dịch; ưu tiên khả năng giữ tổ chức và thực hành."
 VIE_lf_p2_reward_tt:0 "Hệ số đào hào tối đa: §G+5%§!."
 VIE_lf_p3_operational_reserves:0 "Lực lượng dự bị chiến dịch của quân chủ lực"
 VIE_lf_p3_operational_reserves_desc:0 "Xây dựng cơ chế luân phiên đơn vị cơ động và tăng viện cho quân đoàn, duy trì sẵn sàng hoạt động qua nhiều đợt huấn luyện."
 VIE_lf_p3_reward_tt:0 "Tốc độ hồi phục tổ chức lục quân: §G+3%§!. Không cấp manpower trực tiếp."
 VIE_lf_p4_defensive_anti_breakthrough_firepower:0 "Nâng cao chất lượng phối hợp hỏa lực phòng ngự"
 VIE_lf_p4_defensive_anti_breakthrough_firepower_desc:0 "Tập trung huấn luyện hiệp đồng hỏa lực và quy trình bảo đảm trong phòng ngự. Khai thác hiệu quả pháo binh giúp quân chủ lực bảo vệ đội hình và giữ địa bàn."
 VIE_lf_p4_reward_tt:0 "Phòng thủ lục quân: §G+1%§!. Bonus áp dụng toàn lục quân."
 VIE_lf_p5_protracted_combat_sustainment:0 "Cải thiện năng lực duy trì quân chủ lực dài ngày"
 VIE_lf_p5_protracted_combat_sustainment_desc:0 "Chuẩn hóa vận hành bảo dưỡng, luân phiên nhân lực và bổ sung trang bị ở cấp quân đoàn khi hoạt động kéo dài."
 VIE_lf_p5_reward_tt:0 "Tiêu thụ tiếp tế: §G−2%§!. Hỗ trợ vật tư $VIE_lf_ind_precision_z131$ chỉ nhận một lần dù đã hoàn tất cả $VIE_lf_local_logistics_stockpiles$ và $VIE_lf_p5_protracted_combat_sustainment$."
 VIE_lf_p6_active_defense_counterattack:0 "Tổng kết chương trình phòng thủ chủ động"
 VIE_lf_p6_active_defense_counterattack_desc:0 "Kết hợp huấn luyện phòng ngự, dự bị chiến dịch, hỏa lực và bảo đảm để hoàn thiện chương trình phòng thủ chủ động. Duy trì khả năng phối hợp lực lượng địa phương với quân chủ lực trong hoạt động dài ngày."
 VIE_lf_p6_reward_tt:0 "Thay ưu tiên phòng thủ bậc đầu: phòng thủ §G+2%§!, tốc độ §R−1%§!, tốc độ đào hào §G+6%§!, tỷ lệ tiếp viện §G+0,5 điểm phần trăm§!. Mở $VIE_lf_modernize_army_command_system$."
 VIE_lf_m1_combined_arms_mechanized:0 "Chương trình ưu tiên cơ giới hóa hợp thành"
 VIE_lf_m1_combined_arms_mechanized_desc:0 "Chọn hiện đại hóa đơn vị cơ giới có yêu cầu bảo dưỡng và nhiên liệu lớn hơn, tập trung cải thiện chất lượng đơn vị hơn mở rộng ồ ạt."
 VIE_lf_m1_reward_tt:0 "Chọn ưu tiên cơ giới hóa, khóa hai hướng còn lại. Tấn công thiết giáp: §G+2%§!; tiêu thụ nhiên liệu: §R+3%§!; tiếp tế: §R+1%§!. Không cấp xe hoặc đổi grand doctrine."
 VIE_lf_m2_armor_combat_readiness:0 "Làm chủ vận hành T-90S/SK ở đơn vị"
 VIE_lf_m2_armor_combat_readiness_desc:0 "Chuẩn hóa giáo trình, mô phỏng và quy trình bảo dưỡng phục vụ chuẩn bị khai thác T-90S/SK. Chương trình huấn luyện không cấp phương tiện hoặc xác nhận một hợp đồng mua sắm đã hoàn tất."
 VIE_lf_m2_reward_tt:0 "Nhận §G15§! kinh nghiệm hoặc độ thông thạo học thuyết lục quân cho chuẩn bị đào tạo. Không cấp xe, không xác nhận T-90S/SK đã được giao."
 VIE_lf_m3_mechanized_infantry_formations:0 "Tổ chức bộ binh cơ giới thế hệ mới"
 VIE_lf_m3_mechanized_infantry_formations_desc:0 "Chuẩn hóa tổ chức bộ binh cơ giới, huấn luyện khai thác xe chiến đấu bộ binh và bảo đảm kỹ thuật đơn vị. Kết hợp năng lực chế tạo kết cấu thiết giáp với chương trình tích hợp phương tiện trong nước sẽ giúp đào tạo hiệu quả hơn."
 VIE_lf_m3_reward_tt:0 "Tổ chức lục quân: §G+1%§!. Nếu hoàn tất cả $VIE_lf_ind_armor_structures$ và $VIE_lf_ind_xcb01_design$, giảm thời gian huấn luyện thêm §G1%§! một lần."
 VIE_lf_m4_mobile_fire_support:0 "Nâng cấp khả năng hiệp đồng pháo binh cơ động"
 VIE_lf_m4_mobile_fire_support_desc:0 "Phát triển chất lượng phối hợp pháo binh cơ động với đội hình cơ giới, chú ý yêu cầu bảo đảm phương tiện."
 VIE_lf_m4_reward_tt:0 "Tấn công pháo binh lục quân: §G+2%§!, áp dụng cho toàn bộ pháo binh lục quân."
 VIE_lf_m5_operational_combined_arms_units:0 "Chuẩn hóa đơn vị hợp thành cơ động"
 VIE_lf_m5_operational_combined_arms_units_desc:0 "Tập trung chất lượng tổ chức huấn luyện và phối hợp bộ binh, thiết giáp, pháo binh, công binh trong đơn vị cơ động."
 VIE_lf_m5_reward_tt:0 "Tốc độ lập kế hoạch: §G+3%§!. Không tự đổi biên chế sư đoàn."
 VIE_lf_m6_operational_mechanized_counteroffensive:0 "Hoàn thiện năng lực phản kích cơ giới"
 VIE_lf_m6_operational_mechanized_counteroffensive_desc:0 "Tích hợp huấn luyện thiết giáp, bộ binh cơ giới, pháo binh cơ động và tổ chức hợp thành. Năng lực phản kích được nâng lên cùng với yêu cầu bảo đảm nhiên liệu, kỹ thuật và tiếp tế lớn hơn."
 VIE_lf_m6_reward_tt:0 "Thay ưu tiên cơ giới bậc đầu: tấn công thiết giáp §G+4%§!, phòng thủ thiết giáp §G+1%§!, tiêu thụ nhiên liệu §R+5%§!, tiếp tế §R+2%§!. Mở $VIE_lf_modernize_army_command_system$."
 VIE_lf_r1_flexible_mobile_warfare:0 "Ưu tiên lực lượng lục quân cơ động linh hoạt"
 VIE_lf_r1_flexible_mobile_warfare_desc:0 "Phát triển tổ chức lực lượng chính quy có năng lực cơ động mà không phụ thuộc toàn bộ vào đội xe thiết giáp nặng."
 VIE_lf_r1_reward_tt:0 "Chọn ưu tiên cơ động linh hoạt, khóa hai hướng còn lại. Tốc độ lục quân: §G+2%§!. Không đổi grand doctrine."
 VIE_lf_r2_modernize_mobile_infantry:0 "Nâng cấp huấn luyện và trang bị bộ binh nhẹ"
 VIE_lf_r2_modernize_mobile_infantry_desc:0 "Cải thiện trang bị cá nhân và khả năng mang theo, quản lý kỹ thuật của bộ binh nhẹ trong điều kiện địa hình Việt Nam."
 VIE_lf_r2_reward_tt:0 "Tổ chức lục quân: §G+1%§!."
 VIE_lf_r3_terrain_adaptive_warfare:0 "Huấn luyện đa địa hình và thích ứng môi trường"
 VIE_lf_r3_terrain_adaptive_warfare_desc:0 "Tập trung kỹ năng hoạt động tại rừng núi, đô thị, địa hình chia cắt và bảo đảm an toàn, huấn luyện khoa học."
 VIE_lf_r3_reward_tt:0 "Giảm hình phạt địa hình: §G+4%§!."
 VIE_lf_r4_tactical_motorized_mobility:0 "Cơ giới hóa nhẹ và vận tải đơn vị"
 VIE_lf_r4_tactical_motorized_mobility_desc:0 "Nâng chất lượng phương tiện vận tải, bảo dưỡng và khả năng duy trì của đơn vị nhẹ, tách khỏi thiết giáp chiến đấu của M."
 VIE_lf_r4_reward_tt:0 "Một ưu đãi nghiên cứu §G20%§! cho phương tiện vận tải đa dụng. Không cấp xe vào kho."
 VIE_lf_r4_research_bonus:0 "Cơ giới hóa nhẹ và vận tải đơn vị"
 VIE_lf_r5_rapid_reaction_corps:0 "Lực lượng phản ứng nhanh của quân chủ lực"
 VIE_lf_r5_rapid_reaction_corps_desc:0 "Chuẩn hóa tổ chức, luân phiên trực và chất lượng kiểm tra cho thành phần cơ động; không mô tả chi tiết phương án triển khai thực tế."
 VIE_lf_r5_reward_tt:0 "Mất tổ chức khi hành quân: §G−3%§!."
 VIE_lf_r6_terrain_maneuver_mastery:0 "Trinh sát số hỗ trợ lực lượng cơ động"
 VIE_lf_r6_terrain_maneuver_mastery_desc:0 "Đưa dữ liệu UAV và trinh sát số vào quy trình chỉ huy đơn vị cơ động. Chất lượng tiếp nhận thông tin và huấn luyện khai thác quyết định khả năng phản ứng trên địa hình phức tạp."
 VIE_lf_r6_reward_tt:0 "Thay ưu tiên cơ động bậc đầu: tốc độ lục quân §G+4%§!, trinh sát §G+2%§!. Khai thác nền $VIE_lf_recon_tactical_command$ và mở $VIE_lf_modernize_army_command_system$."
 VIE_lf_modernize_army_command_system:0 "Tích hợp chỉ huy chiến dịch lục quân"
 VIE_lf_modernize_army_command_system_desc:0 "Tích hợp năng lực binh chủng, hậu cần và định hướng phát triển đã chọn vào quy trình chỉ huy cấp quân đoàn. Sự thống nhất trong thông tin và lập kế hoạch giúp các đơn vị lục quân phối hợp hiệu quả hơn."
 VIE_lf_f1_reward_tt:0 "Tốc độ lập kế hoạch: §G+2%§!; năng lực chỉ huy: §G+10§!. Chỉ cần hoàn thiện một hướng P, M hoặc R."
 VIE_lf_modern_elite_combined_army_capstone:0 "Lục quân tinh gọn, hiệu quả và hiện đại hóa có chọn lọc"
 VIE_lf_modern_elite_combined_army_capstone_desc:0 "Tổng kết quá trình phát triển quân chủ lực với quốc phòng toàn dân làm nền; không mặc định mọi trang bị đã nội địa hóa hay mọi đơn vị đều tinh nhuệ."
 VIE_lf_f2_reward_tt:0 "Tổ chức lục quân: §G+1%§!. Hoàn tất đề án sau $VIE_lf_modernize_army_command_system$ và $VIE_lf_active_defense_in_depth$; không yêu cầu nhánh công nghiệp hoặc toàn bộ trang bị đã nội địa hóa."
 VIE_lf_territorial_1_idea:0 "Nền phòng thủ lãnh thổ"
 VIE_lf_territorial_1_idea_desc:0 "Năng lực được duy trì nhờ chương trình nền phòng thủ lãnh thổ. Các bậc trong cùng một chương trình thay thế nhau, không cộng dồn."
 VIE_lf_territorial_2_idea:0 "Khu vực phòng thủ liên kết"
 VIE_lf_territorial_2_idea_desc:0 "Năng lực được duy trì nhờ chương trình khu vực phòng thủ liên kết. Các bậc trong cùng một chương trình thay thế nhau, không cộng dồn."
 VIE_lf_territorial_3_idea:0 "Thế trận phòng thủ thống nhất"
 VIE_lf_territorial_3_idea_desc:0 "Năng lực được duy trì nhờ chương trình thế trận phòng thủ thống nhất. Các bậc trong cùng một chương trình thay thế nhau, không cộng dồn."
 VIE_lf_reserve_system_idea:0 "Hệ thống dự bị động viên"
 VIE_lf_reserve_system_idea_desc:0 "Đăng ký nhân lực, huấn luyện định kỳ và chuẩn bị nguồn trang bị giúp lực lượng dự bị được huy động có tổ chức."
 VIE_lf_production_governance_idea:0 "Quản trị sản xuất quốc phòng"
 VIE_lf_production_governance_idea_desc:0 "Quản lý quy trình và kiểm soát chất lượng giúp các nhà máy quân sự nâng hiệu suất sản xuất từng bước."
 VIE_lf_operational_reserve_idea:0 "Dự bị chiến dịch có tổ chức"
 VIE_lf_operational_reserve_idea_desc:0 "Luân phiên lực lượng dự bị chiến dịch và chuẩn bị tăng viện giúp quân chủ lực duy trì khả năng phục hồi sau các đợt hoạt động."
 VIE_lf_p_priority_1_idea:0 "Ưu tiên phòng thủ chiến dịch"
 VIE_lf_p_priority_1_idea_desc:0 "Năng lực được duy trì nhờ chương trình ưu tiên phòng thủ chiến dịch. Các bậc trong cùng một chương trình thay thế nhau, không cộng dồn."
 VIE_lf_p_priority_2_idea:0 "Phòng thủ chủ động hợp thành"
 VIE_lf_p_priority_2_idea_desc:0 "Năng lực được duy trì nhờ chương trình phòng thủ chủ động hợp thành. Các bậc trong cùng một chương trình thay thế nhau, không cộng dồn."
 VIE_lf_m_priority_1_idea:0 "Ưu tiên cơ giới hóa hợp thành"
 VIE_lf_m_priority_1_idea_desc:0 "Năng lực được duy trì nhờ chương trình ưu tiên cơ giới hóa hợp thành. Các bậc trong cùng một chương trình thay thế nhau, không cộng dồn."
 VIE_lf_m_priority_2_idea:0 "Phản kích cơ giới hợp thành"
 VIE_lf_m_priority_2_idea_desc:0 "Năng lực được duy trì nhờ chương trình phản kích cơ giới hợp thành. Các bậc trong cùng một chương trình thay thế nhau, không cộng dồn."
 VIE_lf_r_priority_1_idea:0 "Ưu tiên cơ động linh hoạt"
 VIE_lf_r_priority_1_idea_desc:0 "Năng lực được duy trì nhờ chương trình ưu tiên cơ động linh hoạt. Các bậc trong cùng một chương trình thay thế nhau, không cộng dồn."
 VIE_lf_r_priority_2_idea:0 "Cơ động kết hợp trinh sát số"
 VIE_lf_r_priority_2_idea_desc:0 "Năng lực được duy trì nhờ chương trình cơ động kết hợp trinh sát số. Các bậc trong cùng một chương trình thay thế nhau, không cộng dồn."
 VIE_lf_material_support_idea:0 "Vật tư bảo đảm liên kết"
 VIE_lf_material_support_idea_desc:0 "Cơ khí chính xác, đạn dược và mạng bảo đảm phối hợp giúp giảm hao hụt vật tư trong hoạt động dài ngày."
 VIE_lf_ifv_integration_idea:0 "Chuẩn hóa khai thác IFV"
 VIE_lf_ifv_integration_idea_desc:0 "Năng lực chế tạo và tích hợp phương tiện hỗ trợ xây dựng giáo trình, bảo dưỡng và huấn luyện bộ binh cơ giới thống nhất."
 VIE_lf_ifv_serial_ready_idea:0 "Năng lực tổ chức sản xuất IFV"
 VIE_lf_ifv_serial_ready_idea_desc:0 "Chuẩn hóa quy trình, công cụ và kiểm soát chất lượng sau đánh giá chế thử. Trang bị vẫn phải được thiết kế và sản xuất trong hệ thống IFV hiện có; không tự cấp phương tiện."
 VIE_lf_xcb01_design_program:0 "Nghiên cứu thiết kế XCB-01"
 VIE_lf_xcb01_design_program_desc:0 "Đầu tư 0,6 tỷ ngân sách trong 365 ngày để xây dựng thiết kế và phương án tích hợp XCB-01. Hoàn tất thiết kế mở đường cho đánh giá chế thử; phương tiện chưa được cấp vào kho."
 VIE_lf_xcb01_design_requirements_tt:0 "Hoàn tất $VIE_lf_ind_xcb01_design$, ngân quỹ ít nhất §Y0,6 tỷ§!, không có khủng hoảng phá sản và giai đoạn chưa chạy hoặc hoàn tất."
 VIE_lf_xcb01_design_requirements_tt_NOT:0 "Chưa đáp ứng đủ điều kiện bắt đầu: Hoàn tất $VIE_lf_ind_xcb01_design$, ngân quỹ ít nhất §Y0,6 tỷ§!, không có khủng hoảng phá sản và giai đoạn chưa chạy hoặc hoàn tất."
 VIE_lf_xcb01_design_start_tt:0 "Thanh toán §Y0,6 tỷ§! một lần, triển khai chương trình trong §Y365 ngày§!."
 VIE_lf_xcb01_design_finish_tt:0 "Hoàn tất thiết kế; nhận §G10§! kinh nghiệm hoặc độ thông thạo học thuyết lục quân. Mở đánh giá chế thử khi đủ nền tảng kỹ thuật."
 VIE_lf_xcb01_prototype_evaluation:0 "Đánh giá chế thử XCB-01"
 VIE_lf_xcb01_prototype_evaluation_desc:0 "Đầu tư 0,3 tỷ ngân sách trong 180 ngày để đánh giá phương án chế thử XCB-01 trên nền tảng kỹ thuật đã có. Kết quả đánh giá đạt yêu cầu là cơ sở chuẩn bị sản xuất loạt."
 VIE_lf_xcb01_evaluation_requirements_tt:0 "Hoàn tất $VIE_lf_ind_xcb01_design$, ngân quỹ ít nhất §Y0,3 tỷ§!, không có khủng hoảng phá sản và giai đoạn chưa chạy hoặc hoàn tất. Hoàn tất giai đoạn nghiên cứu thiết kế XCB-01. Có công nghệ §Y$mbt_tech_2$§! với No Step Back, hoặc §Y$IFV_4$§! trong trường hợp còn lại."
 VIE_lf_xcb01_evaluation_requirements_tt_NOT:0 "Chưa đáp ứng đủ điều kiện bắt đầu: Hoàn tất $VIE_lf_ind_xcb01_design$, ngân quỹ ít nhất §Y0,3 tỷ§!, không có khủng hoảng phá sản và giai đoạn chưa chạy hoặc hoàn tất. Hoàn tất giai đoạn nghiên cứu thiết kế XCB-01. Có công nghệ §Y$mbt_tech_2$§! với No Step Back, hoặc §Y$IFV_4$§! trong trường hợp còn lại."
 VIE_lf_xcb01_evaluation_start_tt:0 "Thanh toán §Y0,3 tỷ§! một lần, triển khai chương trình trong §Y180 ngày§!."
 VIE_lf_xcb01_evaluation_finish_tt:0 "Đánh giá chế thử đạt yêu cầu. Có thể chuẩn bị sản xuất loạt sau $VIE_lf_ind_serial_ground_equipment$; chưa cấp phương tiện."
 VIE_lf_xcb01_serial_preparation:0 "Chuẩn bị sản xuất loạt XCB-01"
 VIE_lf_xcb01_serial_preparation_desc:0 "Đầu tư 0,6 tỷ ngân sách trong 365 ngày để chuẩn bị công cụ, quy trình và kiểm soát chất lượng sản xuất IFV. Phương tiện vẫn phải được sản xuất trong các dây chuyền quân sự."
 VIE_lf_xcb01_serial_requirements_tt:0 "Hoàn tất $VIE_lf_ind_serial_ground_equipment$, ngân quỹ ít nhất §Y0,6 tỷ§!, không có khủng hoảng phá sản và giai đoạn chưa chạy hoặc hoàn tất. Hoàn tất giai đoạn đánh giá chế thử XCB-01."
 VIE_lf_xcb01_serial_requirements_tt_NOT:0 "Chưa đáp ứng đủ điều kiện bắt đầu: Hoàn tất $VIE_lf_ind_serial_ground_equipment$, ngân quỹ ít nhất §Y0,6 tỷ§!, không có khủng hoảng phá sản và giai đoạn chưa chạy hoặc hoàn tất. Hoàn tất giai đoạn đánh giá chế thử XCB-01."
 VIE_lf_xcb01_serial_start_tt:0 "Thanh toán §Y0,6 tỷ§! một lần, triển khai chương trình trong §Y365 ngày§!."
 VIE_lf_xcb01_serial_finish_tt:0 "Chuẩn bị sản xuất loạt hoàn tất: giảm IC sản xuất xe chiến đấu bộ binh §G5%§!. Trang bị vẫn phải được sản xuất; không cấp xe miễn phí."



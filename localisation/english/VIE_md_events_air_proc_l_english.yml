l_english:

 ### Truc 1 khong quan: mua sam lich su (vie_air_proc)
 ### Lat cat Su-30MK2 (buoc 3)

 vie_air_proc.3.t:0 "Hợp đồng Su-30MK2 đầu tiên"
 vie_air_proc.3.d:0 "Cuối năm 2003, Moskva chào bán cho Quân chủng Phòng không – Không quân bốn tiêm kích đa nhiệm Su-30MK2, trị giá khoảng 120 triệu USD, giao hàng vào cuối năm 2004. Đây là bước đầu thay thế đội MiG-21 và Su-22 đã cũ."
 vie_air_proc.3.a:0 "Ký hợp đồng mua bốn chiếc."
 vie_air_proc.3.b:0 "Mua sáu chiếc kèm gói chuyển loại phi công, giao chậm hơn sáu tháng."
 vie_air_proc.3.c:0 "Hoãn một năm."

 vie_air_proc.5.t:0 "Su-30MK2: đợt thứ hai"
 vie_air_proc.5.d:0 "Nga chào tám chiếc Su-30MK2 trị giá khoảng 400 triệu USD, giao trong hai năm 2010–2011. Gói này không kèm tên lửa và đạn, vũ khí phải đặt riêng; trong thời gian chờ, các chiếc mới về sẽ chưa phát huy hết khả năng."
 vie_air_proc.5.a:0 "Ký hợp đồng tám chiếc, chưa kèm vũ khí."
 vie_air_proc.5.b:0 "Mua tám chiếc kèm vũ khí, trả giá cao hơn."
 vie_air_proc.5.c:0 "Chỉ mua sáu chiếc."

 vie_air_proc.6.t:0 "Su-30MK2V: đợt thứ ba"
 vie_air_proc.6.d:0 "Đầu năm 2010, Hà Nội và Moskva ký gói mười hai chiếc Su-30MK2V kèm vũ khí và phụ tùng cho các máy bay đã nhận, trị giá khoảng một tỷ USD, giao xong vào cuối năm 2012. Gói này hoàn tất nhu cầu vũ khí của hai đợt trước."
 vie_air_proc.6.a:0 "Ký gói đầy đủ mười hai chiếc."
 vie_air_proc.6.b:0 "Chỉ mua thân máy bay, lo vũ khí sau."
 vie_air_proc.6.c:0 "Chỉ mua tám chiếc."

 vie_air_proc.9.t:0 "Su-30MK2: đợt cuối"
 vie_air_proc.9.d:0 "Tháng 8 năm 2013, Nga chào mười hai chiếc Su-30MK2 cuối cùng, trị giá khoảng 600 triệu USD, giao từ năm 2014 đến đầu năm 2016. Khi đó đủ ba trung đoàn tiêm kích đa nhiệm."
 vie_air_proc.9.a:0 "Ký hợp đồng mười hai chiếc."
 vie_air_proc.9.b:0 "Mua sáu chiếc và mở đàm phán về Su-35S."
 vie_air_proc.9.c:0 "Hoãn một năm."

 VIE_ap_su30_no_munitions_idea:0 "Su-30MK2 chưa đủ vũ khí"
 VIE_ap_su30_no_munitions_idea_desc:0 "Các tiêm kích đã về nhưng tên lửa và đạn đặt riêng chưa tới, nên chưa thể phát huy hết năng lực."
 VIE_ap_su30_airframe_only_idea:0 "Su-30MK2 chỉ có thân máy bay"
 VIE_ap_su30_airframe_only_idea_desc:0 "Đợt Su-30MK2V được mua không kèm vũ khí; phải tự lo vũ khí và đào tạo sử dụng sau."

 ### Ten lua phong khong (buoc 4)

 vie_air_proc.2.t:0 "Tên lửa phòng không S-300PMU1"
 vie_air_proc.2.d:0 "Tháng 8 năm 2003, Moskva đồng ý cấp cho Việt Nam hai tiểu đoàn tên lửa phòng không tầm xa S-300PMU1. Tiểu đoàn đầu gồm 12 bệ phóng và khoảng 62 tên lửa sẽ về vào mùa hè năm 2005. Đây là lớp lá chắn phòng không đầu tiên đủ sức bao quát các mục tiêu tầm cao, thay cho S-75 và S-125 đã cũ."
 vie_air_proc.2.a:0 "Ký hợp đồng hai tiểu đoàn."
 vie_air_proc.2.b:0 "Chỉ mua một tiểu đoàn."
 vie_air_proc.2.c:0 "Hoãn một năm."

 vie_air_proc.7.t:0 "Nâng cấp S-125 lên Pechora-2TM"
 vie_air_proc.7.d:0 "Hãng Tetraedr của Belarus đề nghị hiện đại hóa các tổ hợp S-125 Việt Nam đang có thành chuẩn Pechora-2TM, với hệ thống điều khiển và radar số. Nhà máy A31 sẽ tham gia thử nghiệm đợt đầu vào tháng 3 năm 2011."
 vie_air_proc.7.a:0 "Nâng cấp hơn ba mươi bệ phóng."
 vie_air_proc.7.b:0 "Chỉ nâng cấp mười lăm bệ phóng."

 vie_air_proc.10.t:0 "Tên lửa phòng không SPYDER"
 vie_air_proc.10.d:0 "Israel chào bán năm tổ hợp SPYDER kèm tên lửa Python-5 và Derby, nhận hàng từ năm 2016 đến 2018. Hệ thống tầm trung này bổ sung cho S-300 và Pechora ở tầm thấp và trung bình."
 vie_air_proc.10.a:0 "Mua năm tổ hợp."
 vie_air_proc.10.b:0 "Mua ba tổ hợp và bắt đầu nghiên cứu Barak-8."

 ### Huấn luyện, vận tải, radar (bước 5)

 vie_air_proc.1.t:0 "Hợp tác quốc phòng với Ấn Độ"
 vie_air_proc.1.d:0 "Tháng 3 năm 2000, Hà Nội và New Delhi ký thỏa thuận hợp tác quốc phòng. Ấn Độ đề nghị đại tu đội MiG-21 còn lại và đào tạo phi công, kỹ thuật viên Việt Nam."
 vie_air_proc.1.a:0 "Nhận cả đại tu và đào tạo."
 vie_air_proc.1.b:0 "Chỉ nhận đào tạo kỹ thuật viên."
 vie_air_proc.1.c:0 "Từ chối."

 vie_air_proc.8.t:0 "Vận tải cơ C-295M"
 vie_air_proc.8.d:0 "Tây Ban Nha chào ba vận tải cơ C-295M kèm phụ tùng và đào tạo, trị giá khoảng 100 triệu USD. Máy bay sẽ vào biên chế từ năm 2015, thay dần các An-26 đã già."
 vie_air_proc.8.a:0 "Mua ba chiếc."
 vie_air_proc.8.b:0 "Mua hai chiếc."
 vie_air_proc.8.c:0 "Mua bốn chiếc."

 vie_air_proc.11.t:0 "Mạng radar cảnh giới thụ động"
 vie_air_proc.11.d:0 "Cộng hòa Séc chào bán hệ thống radar thụ động VERA-NG, phát hiện mục tiêu qua tín hiệu phát xạ mà không tự phát sóng. Việt Nam cân nhắc mua bốn hệ thống, hoặc thêm radar của Israel, hoặc dồn lực cho radar do Viettel nghiên cứu."
 vie_air_proc.11.a:0 "Mua bốn hệ thống VERA-NG."
 vie_air_proc.11.b:0 "Mua thêm radar ELM-2288 của Israel."
 vie_air_proc.11.c:0 "Đẩy nhanh radar của Viettel, tạm chịu phát hiện thấp hơn."

 vie_air_proc.13.t:0 "Đào tạo phi công Su-30"
 vie_air_proc.13.d:0 "Tháng 12 năm 2016, Việt Nam và Ấn Độ ký thỏa thuận đào tạo phi công Su-30. Ấn Độ đã khai thác loại máy bay này nhiều năm; Nga cũng đề nghị nhận phi công sang huấn luyện."
 vie_air_proc.13.a:0 "Gửi phi công sang Ấn Độ."
 vie_air_proc.13.b:0 "Tiếp tục gửi sang Nga."
 vie_air_proc.13.c:0 "Tự đào tạo trong nước."

 vie_air_proc.14.t:0 "Yak-130 cho trung tâm huấn luyện"
 vie_air_proc.14.d:0 "Quân chủng thành lập sư đoàn huấn luyện tiêm kích siêu âm và cân nhắc máy bay huấn luyện tiến bộ. Yak-130 của Nga có buồng lái giống Su-30; gói mười hai chiếc trị giá khoảng 350 triệu USD."
 vie_air_proc.14.a:0 "Mua mười hai chiếc Yak-130."
 vie_air_proc.14.b:0 "Từ chối, chọn phương án khác."
 vie_air_proc.14.c:0 "Hoãn một năm."

 vie_air_proc.15.t:0 "Huấn luyện cơ T-6C Texan II"
 vie_air_proc.15.d:0 "Tháng 6 năm 2021, Mỹ chấp thuận bán cho Việt Nam mười hai máy bay huấn luyện T-6C Texan II, giao trong giai đoạn 2024–2027. Đây là bước đầu của quan hệ quốc phòng với Washington sau khi lệnh cấm vận vũ khí được dỡ."
 vie_air_proc.15.a:0 "Đặt mười hai chiếc."
 vie_air_proc.15.b:0 "Đặt sáu chiếc."

 VIE_ap_mig21_extension_idea:0 "MiG-21 kéo dài niên hạn"
 VIE_ap_mig21_extension_idea_desc:0 "Đội MiG-21 được đại tu với sự hỗ trợ của Ấn Độ, giảm tai nạn cho tới khi chính thức nghỉ hưu."
 VIE_ap_basic_training_idea:0 "Đào tạo bay cơ bản"
 VIE_ap_basic_training_idea_desc:0 "Lô huấn luyện cơ Yak-52 mở rộng nguồn học viên bay cơ bản."
 VIE_ap_mig21_retired_idea:0 "MiG-21 đã nghỉ hưu"
 VIE_ap_mig21_retired_idea_desc:0 "Một trung đoàn huấn luyện bị giải thể cùng việc loại biên MiG-21, tạm làm giảm nguồn kinh nghiệm bay."
 VIE_ap_pilot_training_idea:0 "Đào tạo phi công Su-30"
 VIE_ap_pilot_training_idea_desc:0 "Chương trình đào tạo phi công Su-30 ở nước ngoài và trong nước tăng tốc độ thu kinh nghiệm bay."

l_english:

 ### vie_alt.28
 vie_alt.28.t:0 "Phóng Sự Điều Tra"
 vie_alt.28.d:0 "Một tờ báo đã đăng tải loạt bài điều tra dài kỳ về cách thức các đại tập đoàn thâu tóm các khu đất vàng và những khoản vay ngân hàng khổng lồ. Các tập đoàn này đang gây sức ép lên chính phủ để buộc tờ báo phải dừng lại."
 vie_alt.28.a:0 "Đình bản tờ báo"
 vie_alt.28.b:0 "Để bài báo tiếp tục được xuất bản"

 ### vie_alt.30
 vie_alt.30.t:0 "Sinh Viên Xuống Đường"
 vie_alt.30.d:0 "Hàng ngàn sinh viên đã tập trung tại quảng trường trung tâm để đòi hỏi tiếng nói đối với tương lai của đất nước. Họ bày tỏ quan điểm một cách lịch sự nhưng kiên định, dưới sự theo dõi sát sao của mọi ống kính máy quay trong thành phố."
 vie_alt.30.a:0 "Đáp ứng một phần các yêu sách"
 vie_alt.30.b:0 "Giải tán đám đông"

 ### vie_alt.31
 vie_alt.31.t:0 "Rò Rỉ Hồ Sơ Giám Sát"
 vie_alt.31.d:0 "Hàng loạt tài liệu mật từ trung tâm dữ liệu của lực lượng an ninh đã bị rò rỉ tới một tòa soạn báo nước ngoài. Chúng cho thấy những người dân bình thường bị theo dõi suốt nhiều năm mà không có lý do chính đáng. Ngay cả những cán bộ trung thành cũng cảm thấy bất an."
 vie_alt.31.a:0 "Che đậy vụ bê bối"
 vie_alt.31.b:0 "Tiến hành cải tổ cơ quan an ninh"

 ### vie_alt.36
 vie_alt.36.t:0 "Liên Minh Cầm Quyền Tan Rã"
 vie_alt.36.d:0 "Các đảng phái nắm đa số trong quốc hội nảy sinh mâu thuẫn gay gắt về ngân sách và không thể tìm được tiếng nói chung. Tổng thống đứng trước câu hỏi liệu đất nước có nên tổ chức bầu cử lại hay không."
 vie_alt.36.a:0 "Kêu gọi bầu cử sớm"
 vie_alt.36.b:0 "Chắp vá một liên minh cầm quyền mới"

 ### vie_alt.37
 vie_alt.37.t:0 "Báo Cáo của Ủy Ban Điều Tra"
 vie_alt.37.d:0 "Ủy ban điều tra đã hoàn tất công việc của mình. Báo cáo vạch trần những sai phạm kéo dài qua nhiều năm và chỉ rõ danh tính những người đã thực hiện chúng. Một số người muốn công bố toàn văn báo cáo, trong khi những người khác lo sợ hậu quả mà nó gây ra."
 vie_alt.37.a:0 "Công bố toàn văn báo cáo"
 vie_alt.37.b:0 "Chỉ công bố bản tóm tắt"


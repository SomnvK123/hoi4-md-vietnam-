l_english:

 ### Truc 3 khong quan (xay dung luc luong, vie_air_force): focus, category, idea

 VIE_airf_training_standardization:0 "Chuẩn hóa Đào tạo Phi công và Kỹ thuật viên"
 VIE_airf_training_standardization_desc:0 "Quân chủng Phòng không - Không quân đưa đào tạo về một chương trình thống nhất: Yak-52 và T-6C ở bậc đầu, L-39 và Yak-130 ở bậc giữa, rồi Su-30MK2."
 VIE_airf_fighter_force:0 "Phát triển Lực lượng Tiêm kích"
 VIE_airf_fighter_force_desc:0 "Củng cố các trung đoàn tiêm kích, từ Su-22 và Su-27 đến Su-30MK2, bằng huấn luyện chiến thuật và chuẩn hóa quy trình bay."
 VIE_airf_sam_force:0 "Phát triển Lực lượng Tên lửa Phòng không và Radar"
 VIE_airf_sam_force_desc:0 "Quân chủng vừa là không quân vừa là phòng không quốc gia: tên lửa S-125, S-75, S-300PMU1 và mạng radar cần một khung huấn luyện và chỉ huy chung."
 VIE_airf_command_reform_1:0 "Cải cách Chỉ huy Phòng không - Không quân I"
 VIE_airf_command_reform_1_desc:0 "Hợp nhất chỉ huy tiêm kích và phòng không mặt đất, bắt đầu phối hợp giữa đội bay, tên lửa và radar."
 VIE_airf_first_force:0 "Cơ cấu Lực lượng Ban đầu"
 VIE_airf_first_force_desc:0 "Sáu trung đoàn tiêm kích đã nhận đủ Su-30MK2 đợt đầu, Nhà máy đại tu bắt đầu hỗ trợ đội bay. Quân chủng chốt cơ cấu lực lượng cho giai đoạn tiếp theo."
 VIE_airf_command_reform_2:0 "Cải cách Chỉ huy Phòng không - Không quân II"
 VIE_airf_command_reform_2_desc:0 "Trung tâm chỉ huy tích hợp và liên kết với lục quân, hải quân: một bức tranh trên không chung cho toàn lực lượng."
 VIE_airf_medium_force:0 "Lực lượng Không quân Trung bình"
 VIE_airf_medium_force_desc:0 "Ba trung đoàn Su-30MK2 hoàn tất biên chế, thay dần Su-22; Quân chủng chuyển từ giữ vững sang răn đe có chiều sâu."
 VIE_airf_operating_range:0 "Mở rộng Bán kính Hoạt động và Căn cứ Tiền phương"
 VIE_airf_operating_range_desc:0 "Mở rộng sân bay tiền phương và năng lực tiếp cận từ các căn cứ ven biển và quần đảo, tăng tầm hoạt động của đội bay."

 VIE_airf_iads:0 "Phòng không Tích hợp"
 VIE_airf_iads_desc:0 "Nhánh lịch sử: nối tên lửa, radar và tiêm kích thành một mạng phòng không quốc gia dưới chỉ huy thống nhất."
 VIE_airf_layered_defence:0 "Mạng Radar - Tên lửa Nhiều tầng"
 VIE_airf_layered_defence_desc:0 "Xếp lớp radar cảnh giới, S-300, SPYDER và tên lửa tầm gần thành các tầng bảo vệ chồng lên nhau quanh các mục tiêu trọng yếu."
 VIE_airf_ew_antistealth:0 "Tác chiến Điện tử và Chống tàng hình"
 VIE_airf_ew_antistealth_desc:0 "Radar băng tần thấp và thụ động của Viettel, cùng đối kháng điện tử, để phát hiện mục tiêu khó thấy."
 VIE_airf_iads_command:0 "Bộ Chỉ huy Phòng không Khu vực"
 VIE_airf_iads_command_desc:0 "Các bộ chỉ huy phòng không khu vực nhận một bức tranh trên không chung, phối hợp tiêm kích và tên lửa theo thời gian thực."
 VIE_airf_multirole:0 "Không quân Đa nhiệm"
 VIE_airf_multirole_desc:0 "Nhánh cải cách: chuyển trọng tâm từ phòng thủ sang một lực lượng tiêm kích đa nhiệm, nhiều nguồn cung, có khả năng vươn xa."
 VIE_airf_multirole_fleet:0 "Chương trình Tiêm kích Đa nhiệm 4.5"
 VIE_airf_multirole_fleet_desc:0 "Chuẩn bị tiếp nhận tiêm kích thế hệ 4.5 từ nguồn phương Tây hoặc Nga để thay dần Su-22."
 VIE_airf_sustainment:0 "Bảo đảm Kỹ thuật Đa nguồn"
 VIE_airf_sustainment_desc:0 "Tổ chức bảo dưỡng, kho phụ tùng và đào tạo kỹ thuật viên cho đội bay có nhiều nguồn gốc khác nhau."
 VIE_airf_airlift_tanker:0 "Vận tải và Tiếp dầu trên Không"
 VIE_airf_airlift_tanker_desc:0 "Bổ sung vận tải chiến thuật và năng lực tiếp dầu để đội bay hoạt động xa căn cứ."
 VIE_airf_multirole_wing:0 "Cánh Không quân Đa nhiệm"
 VIE_airf_multirole_wing_desc:0 "Hợp nhất tiêm kích đa nhiệm, vận tải và tiếp dầu thành một cánh không quân có thể triển khai độc lập."
 VIE_airf_unmanned:0 "Không người lái và Mạng hóa"
 VIE_airf_unmanned_desc:0 "Nhánh công nghệ: lấy máy bay không người lái và liên kết dữ liệu làm lõi để bù cho đội bay có người lái hạn chế."
 VIE_airf_isr_uav:0 "UAV Trinh sát và Mục tiêu"
 VIE_airf_isr_uav_desc:0 "Đưa UAV trinh sát và máy bay mục tiêu vào huấn luyện và phát hiện thường xuyên."
 VIE_airf_datalink:0 "Mạng Liên kết Dữ liệu (C4ISR)"
 VIE_airf_datalink_desc:0 "Một mạng liên kết dữ liệu nối radar, UAV, tên lửa và tiêm kích để chia sẻ mục tiêu."
 VIE_airf_strike_uav:0 "UAV Tấn công"
 VIE_airf_strike_uav_desc:0 "Triển khai UAV tấn công và đạn lảng vảng của Viettel, Z131 và Z199 cho các nhiệm vụ chính xác."
 VIE_airf_teaming:0 "Phối hợp Có người - Không người"
 VIE_airf_teaming_desc:0 "Tiêm kích có người điều phối các đàn UAV: hoàn tất đường công nghệ của Quân chủng."

 VIE_airf_category:0 "Xây dựng Lực lượng Phòng không - Không quân"
 VIE_airf_category_desc:0 "Các chương trình huấn luyện và xây dựng lực lượng của Quân chủng. Tối đa hai chương trình chạy cùng lúc; mỗi chương trình chỉ làm một lần."

 VIE_airf_prog_fighters:0 "Đang huấn luyện lực lượng tiêm kích"
 VIE_airf_prog_fighters_desc:0 "Quân chủng đang chạy chương trình huấn luyện và chuyên môn hóa lực lượng tiêm kích."
 VIE_airf_prog_sam:0 "Đang huấn luyện lực lượng tên lửa phòng không và radar"
 VIE_airf_prog_sam_desc:0 "Quân chủng đang chạy chương trình huấn luyện và chuẩn hóa lực lượng tên lửa phòng không và radar."
 VIE_airf_prog_coord:0 "Đang xây dựng phối hợp tiêm kích - tên lửa"
 VIE_airf_prog_coord_desc:0 "Quân chủng đang xây dựng cơ chế phối hợp giữa tiêm kích, tên lửa và radar theo ba giai đoạn."
 VIE_airf_prog_first:0 "Đang chốt cơ cấu lực lượng ban đầu"
 VIE_airf_prog_first_desc:0 "Quân chủng đang tổ chức lại đội bay theo cơ cấu lực lượng đã chọn."
 VIE_airf_prog_capstone:0 "Đang thực hiện chương trình đỉnh của nhánh"
 VIE_airf_prog_capstone_desc:0 "Quân chủng đang hoàn tất chương trình đỉnh của nhánh học thuyết đã chọn."

 VIE_airf_branch_mismatch_idea:0 "Lệch hướng với cơ cấu lực lượng đã chọn"
 VIE_airf_branch_mismatch_idea_desc:0 "Nhánh học thuyết vừa mở không khớp với cơ cấu lực lượng ban đầu, nên đội bay mất một năm để điều chỉnh."

 ### Decision va event Truc 3 (vie_air_force)
 VIE_airf_slot_tt:0 "Đang chạy ít hơn §Y2§! chương trình xây dựng lực lượng không quân"
 VIE_airf_d1_done_tt:0 "Đã hoàn tất huấn luyện lực lượng tiêm kích"
 VIE_airf_d2_done_tt:0 "Đã hoàn tất huấn luyện lực lượng tên lửa phòng không và radar"
 VIE_airf_capstone_tt:0 "Đủ năng lực cho chương trình đỉnh của nhánh đã chọn (A: S-300 hoặc A31 bậc 2, và radar bậc 2; B: ít nhất 24 Su-30 đã giao và A32 bậc 2; C: UAV bậc 2)"
 VIE_airf_d1_fighters:0 "Huấn luyện Lực lượng Tiêm kích"
 VIE_airf_d1_fighters_desc:0 "Chuẩn hóa chiến thuật và chuyên môn hóa các trung đoàn tiêm kích, chọn hướng không chiến hoặc tấn công mặt đất và mặt biển.\n\n§gChi phí 0,40 tỷ (cơ bản) hoặc 0,60 tỷ (chuyên sâu).§!"
 VIE_airf_d2_sam:0 "Huấn luyện Lực lượng Tên lửa Phòng không và Radar"
 VIE_airf_d2_sam_desc:0 "Chuẩn hóa kíp trực chiến cho S-125, S-75, S-300PMU1 và mạng radar cảnh giới; chọn nâng cấp theo lịch sử hoặc đưa hệ thống mới vào sớm.\n\n§gChi phí 0,30 đến 0,75 tỷ.§!"
 VIE_airf_d3_coordination:0 "Phối hợp Tiêm kích - Tên lửa - Radar"
 VIE_airf_d3_coordination_desc:0 "Ba giai đoạn diễn tập chung giữa đội bay, tên lửa và radar, dẫn tới một bức tranh trên không thống nhất. Đòi hoàn tất cả hai chương trình huấn luyện trước.\n\n§gChi phí 0,50 tỷ.§!"
 VIE_airf_d4_first_force:0 "Cơ cấu Lực lượng Ban đầu"
 VIE_airf_d4_first_force_desc:0 "Chốt cơ cấu đội bay: phòng thủ lãnh thổ, cân bằng hoặc tầm xa. Lựa chọn này quyết định nhánh học thuyết nào hợp với Quân chủng.\n\n§gChi phí 0,60 tỷ.§!"
 VIE_airf_d5_capstone:0 "Chương trình Đỉnh của Nhánh"
 VIE_airf_d5_capstone_desc:0 "Hoàn tất chương trình cuối của nhánh học thuyết đã chọn, cộng thêm vào thưởng của focus đỉnh nhánh.\n\n§gChi phí 1,0 tỷ.§!"
 vie_air_force.1.t:0 "Huấn luyện lực lượng tiêm kích: mức đầu tư"
 vie_air_force.1.d:0 "Bộ Tư lệnh Quân chủng đề xuất chuẩn hóa chương trình huấn luyện cho các trung đoàn tiêm kích. Có hai mức: cơ bản, hoặc chuyên sâu với thời gian dài hơn và hiệu quả cao hơn."
 vie_air_force.1.a:0 "Cơ bản: 0,40 tỷ, 12 tháng."
 vie_air_force.1.b:0 "Chuyên sâu: 0,60 tỷ, 18 tháng, thưởng cao hơn 50%."
 vie_air_force.2.t:0 "Huấn luyện lực lượng tiêm kích: chuyên môn"
 vie_air_force.2.d:0 "Các trung đoàn có thể tập trung vào giành ưu thế trên không, hoặc vào tấn công mặt đất và mặt biển. Hướng còn lại chỉ được bù một phần ở chương trình phối hợp sau này."
 vie_air_force.2.a:0 "Không chiến: ưu thế trên không."
 vie_air_force.2.b:0 "Tấn công mặt đất và mặt biển: hỗ trợ mặt đất và sức tấn công."
 vie_air_force.10.t:0 "Huấn luyện tên lửa phòng không và radar: định hướng"
 vie_air_force.10.d:0 "Quân chủng có thể nâng cấp các hệ thống đang có theo kế hoạch lịch sử, hoặc đưa kíp trực chiến của hệ thống mới vào huấn luyện ngay từ bây giờ với chi phí cao hơn."
 vie_air_force.10.a:0 "Lịch sử: nâng cấp S-125, S-75 và S-300PMU1 hiện có."
 vie_air_force.10.b:0 "Sớm: huấn luyện trước cho hệ thống mới, đắt hơn, phòng không cao hơn."
 vie_air_force.11.t:0 "Huấn luyện tên lửa phòng không và radar: mức đầu tư"
 vie_air_force.11.d:0 "Chọn mức đầu tư cho chương trình huấn luyện kíp trực chiến và vận hành radar."
 vie_air_force.11.a:0 "Cơ bản: 12 tháng."
 vie_air_force.11.b:0 "Chuyên sâu: 18 tháng, thưởng cao hơn 50%, chi phí ×1,5."
 vie_air_force.30.t:0 "Cơ cấu lực lượng ban đầu"
 vie_air_force.30.d:0 "Sau khi các trung đoàn Su-30MK2 đầu tiên vào biên chế, Quân chủng phải quyết định cơ cấu lực lượng cho giai đoạn tới. Lựa chọn này sẽ ảnh hưởng đến nhánh học thuyết mở sau năm 2017."
 vie_air_force.30.a:0 "Phòng thủ lãnh thổ: phòng thủ và phòng không cao hơn, tầm bay giảm 3%."
 vie_air_force.30.b:0 "Cân bằng: các chỉ số cùng tăng nhẹ."
 vie_air_force.30.c:0 "Tầm xa: tầm bay +5%, nhiệm vụ +2%, chi phí duy trì không quân +3%."
 vie_air_force.61.t:0 "Huấn luyện lực lượng tiêm kích hoàn tất"
 vie_air_force.61.d:0 "Chương trình huấn luyện và chuyên môn hóa lực lượng tiêm kích đã kết thúc."
 vie_air_force.62.t:0 "Huấn luyện tên lửa phòng không và radar hoàn tất"
 vie_air_force.62.d:0 "Chương trình chuẩn hóa kíp trực chiến tên lửa phòng không và radar đã kết thúc."
 vie_air_force.63.t:0 "Phối hợp tiêm kích - tên lửa - radar hoàn tất"
 vie_air_force.63.d:0 "Ba giai đoạn diễn tập chung đã hoàn tất; Quân chủng có một bức tranh trên không thống nhất."
 vie_air_force.64.t:0 "Cơ cấu lực lượng ban đầu đã chốt"
 vie_air_force.64.d:0 "Việc tổ chức lại đội bay theo cơ cấu đã chọn đã hoàn tất."
 vie_air_force.65.t:0 "Chương trình đỉnh của nhánh hoàn tất"
 vie_air_force.65.d:0 "Chương trình cuối của nhánh học thuyết đã hoàn tất, cộng thêm vào thưởng của focus đỉnh nhánh."
 vie_air_force.61.a:0 "Ghi nhận."
 vie_air_force.62.a:0 "Ghi nhận."
 vie_air_force.63.a:0 "Ghi nhận."
 vie_air_force.64.a:0 "Ghi nhận."
 vie_air_force.65.a:0 "Ghi nhận."
 VIE_dec_airf_train_aa:0 "Huấn luyện không chiến"
 VIE_dec_airf_train_aa_desc:0 "Tổ chức đợt huấn luyện không chiến cơ động cho các trung đoàn tiêm kích. Sau 90 ngày: kinh nghiệm không quân và tăng hiệu quả giành ưu thế trên không trong 180 ngày."
 VIE_dec_airf_train_night:0 "Huấn luyện bay đêm, mọi thời tiết"
 VIE_dec_airf_train_night_desc:0 "Huấn luyện phi công Su-30MK2 bay đêm và trong thời tiết xấu. Sau 120 ngày: kinh nghiệm không quân và giảm phạt ban đêm, phạt thời tiết trong 180 ngày."
 VIE_dec_airf_train_sam:0 "Diễn tập phòng không tích hợp"
 VIE_dec_airf_train_sam_desc:0 "Diễn tập phối hợp tiêm kích, tên lửa phòng không và radar trong mạng phòng không tích hợp. Sau 90 ngày: kinh nghiệm không quân và tăng phòng thủ lãnh thổ trong 180 ngày."
 VIE_dec_airf_train_strike:0 "Diễn tập đánh mặt đất, mặt biển"
 VIE_dec_airf_train_strike_desc:0 "Diễn tập đa nhiệm bắn đạn thật vào mục tiêu mặt đất và mặt biển. Sau 120 ngày: kinh nghiệm không quân, tăng yểm trợ mặt đất và tấn công trong 180 ngày."
 VIE_dec_airf_train_uav:0 "Diễn tập UAV và liên kết dữ liệu"
 VIE_dec_airf_train_uav_desc:0 "Diễn tập phối hợp UAV trinh sát, UAV tấn công và mạng liên kết dữ liệu. Sau 90 ngày: kinh nghiệm không quân và tăng hiệu quả nhiệm vụ trong 180 ngày."
 VIE_airf_idea_aa_drill:0 "Đã huấn luyện không chiến"
 VIE_airf_idea_aa_drill_desc:0 "Các phi công vừa qua đợt huấn luyện không chiến."
 VIE_airf_idea_night_drill:0 "Đã huấn luyện bay đêm, mọi thời tiết"
 VIE_airf_idea_night_drill_desc:0 "Các phi công vừa qua đợt huấn luyện bay đêm và thời tiết xấu."
 VIE_airf_idea_sam_drill:0 "Đã diễn tập phòng không tích hợp"
 VIE_airf_idea_sam_drill_desc:0 "Các đơn vị vừa qua đợt diễn tập phòng không tích hợp."
 VIE_airf_idea_strike_drill:0 "Đã diễn tập đánh mặt đất, mặt biển"
 VIE_airf_idea_strike_drill_desc:0 "Các đơn vị đa nhiệm vừa qua đợt diễn tập bắn đạn thật."
 VIE_airf_idea_uav_drill:0 "Đã diễn tập UAV"
 VIE_airf_idea_uav_drill_desc:0 "Các đơn vị UAV vừa qua đợt diễn tập liên kết dữ liệu."
 VIE_airf_tb_a2a:0 "Kinh nghiệm vũ khí không đối không"
 VIE_airf_tb_sam:0 "Kinh nghiệm tên lửa phòng không"
 VIE_airf_tb_ew:0 "Kinh nghiệm tác chiến điện tử"
 VIE_airf_tb_multirole:0 "Kinh nghiệm máy bay đa nhiệm"
 VIE_airf_tb_uav:0 "Kinh nghiệm UAV"
 VIE_apm_tb_radar:0 "Kinh nghiệm radar cảnh giới"
 VIE_apm_tb_avionics:0 "Kinh nghiệm tích hợp điện tử hàng không"
 VIE_apm_tb_drones:0 "Kinh nghiệm UAV nội địa"
 vie_air_force.70.t:0 "Trung đoàn 923 chuyển sang Su-30MK2V"
 vie_air_force.70.d:0 "Từ năm 2011, Trung đoàn 923 bắt đầu thay Su-22 bằng Su-30MK2V, còn toàn bộ Su-27 chuyển sang Trung đoàn huấn luyện 940. Lần đầu một trung đoàn chuyển hẳn sang máy bay đa nhiệm thế hệ mới, kéo theo thay đổi lớn về huấn luyện và bảo đảm kỹ thuật.\n\nVăn hóa huấn luyện phi công được củng cố."
 vie_air_force.70.a:0 "Ghi nhận"
 vie_air_force.71.t:0 "Đủ 36 Su-30MK2"
 vie_air_force.71.d:0 "Đầu tháng 2 năm 2016, hai chiếc Su-30MK2 cuối cùng được chuyển tới Việt Nam, nâng tổng số lên 36 chiếc và hoàn tất ba trung đoàn Su-30MK2. Lực lượng không quân đa nhiệm đã thành hình."
 vie_air_force.71.a:0 "Ghi nhận"
 vie_air_force.72.t:0 "Triển lãm Quốc phòng quốc tế đầu tiên"
 vie_air_force.72.d:0 "Từ ngày 8 đến 10 tháng 12 năm 2022, Triển lãm Quốc phòng quốc tế Việt Nam lần đầu tổ chức tại sân bay Gia Lâm. Quân chủng Phòng không - Không quân và Viettel trưng bày khí tài và radar nội địa, thu hút đối tác và nguồn lực."
 vie_air_force.72.a:0 "Ghi nhận"

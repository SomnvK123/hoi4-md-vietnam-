l_english:

 ### Truc 3: xay dung luc luong Luc quan (VIE_truc3_review_and_plan.md). Buoc 2: 12 focus dau.
 VIE_lf_army_reform:0 "Cải cách quân đội, tinh gọn biên chế"
 VIE_lf_army_reform_desc:0 "[VIE_lf_alt_n1]Nghị quyết 05-NQ/TW của Bộ Chính trị (17/1/2022) và Nghị quyết 230-NQ/QUTW của Quân ủy Trung ương (2/4/2022) đặt ra việc điều chỉnh tổ chức Quân đội nhân dân giai đoạn 2021–2030 theo hướng \"tinh, gọn, mạnh\": ưu tiên quân số cho đơn vị sẵn sàng chiến đấu, tuyến biên giới và biển đảo.\n\nĐây là điểm khởi đầu của chuỗi xây dựng lực lượng. (THẬT) nền tảng; mốc thời gian cụ thể là của mod."
 VIE_lf_logistics_merge:0 "Hiện đại hóa hệ thống bảo đảm hậu cần – kỹ thuật"
 VIE_lf_logistics_merge_desc:0 "[VIE_lf_alt_n2]Quyết định 366/QĐ-BQP (24/1/2025) sáp nhập Tổng cục Hậu cần và Tổng cục Kỹ thuật thành Tổng cục Hậu cần – Kỹ thuật, công bố ngày 5/2/2025. Một đầu mối bảo đảm cho toàn quân thay cho hai hệ thống song song. (THẬT)"
 VIE_lf_basic_training:0 "Đào tạo lục quân cơ bản"
 VIE_lf_basic_training_desc:0 "[VIE_lf_alt_n3]Nghị quyết 109-NQ/QUTW (11/2/2019) về đội ngũ cán bộ và Nghị quyết 1657-NQ/QUTW (20/12/2022) đổi mới giáo dục, đào tạo trong quân đội là nền chung cho đào tạo sĩ quan và huấn luyện binh sĩ của mọi binh chủng. (THẬT)"
 VIE_lf_arm_infantry_org:0 "Bộ binh: tổ chức, cơ giới hóa từng bước"
 VIE_lf_arm_infantry_org_desc:0 "Tổ chức lại bộ binh theo hướng cơ giới hóa từng bước. Chỉ là cải tiến tổ chức: mẫu sư đoàn cơ giới đã có sẵn trong lực lượng. Chọn tối đa ba trong bốn binh chủng. (ĐỀ XUẤT)"
 VIE_lf_arm_infantry_train:0 "Bộ binh: đào tạo sĩ quan, huấn luyện binh sĩ"
 VIE_lf_arm_infantry_train_desc:0 "Nâng chuẩn đào tạo sĩ quan và huấn luyện binh sĩ bộ binh tại học viện và đơn vị. (ĐỀ XUẤT)"
 VIE_lf_arm_armor_org:0 "Tăng thiết giáp: tổ chức"
 VIE_lf_arm_armor_org_desc:0 "Tổ chức lực lượng tăng thiết giáp thành các đơn vị cơ động hơn, phối hợp chặt với bộ binh cơ giới. Chọn tối đa ba trong bốn binh chủng. (ĐỀ XUẤT)"
 VIE_lf_arm_armor_train:0 "Tăng thiết giáp: đào tạo sĩ quan, kíp xe"
 VIE_lf_arm_armor_train_desc:0 "Đào tạo chỉ huy xe và kíp xe cho các loại xe đang biên chế, từ T-54/55 đến T-90. (ĐỀ XUẤT)"
 VIE_lf_arm_arty_org:0 "Pháo binh: tổ chức, hỏa lực chi viện"
 VIE_lf_arm_arty_org_desc:0 "Tổ chức hỏa lực chi viện của pháo binh, từ pháo kéo đến pháo tự hành, gắn với các cấp chiến thuật. Chọn tối đa ba trong bốn binh chủng. (ĐỀ XUẤT)"
 VIE_lf_arm_arty_train:0 "Pháo binh: đào tạo sĩ quan, pháo thủ"
 VIE_lf_arm_arty_train_desc:0 "Đào tạo sĩ quan chỉ huy hỏa lực và pháo thủ, chuẩn bị cho các khí tài mới như K9 và PTH. (ĐỀ XUẤT)"
 VIE_lf_arm_engineers:0 "Công binh: đào tạo, công binh chiến đấu"
 VIE_lf_arm_engineers_desc:0 "Binh chủng phụ: đào tạo công binh chiến đấu, gộp cả phần tổ chức. Chọn Công binh thay cho một binh chủng chính vẫn đủ ba binh chủng để mở Hiệp đồng binh chủng. (ĐỀ XUẤT)"
 VIE_lf_combined_arms:0 "Hiệp đồng binh chủng"
 VIE_lf_combined_arms_desc:0 "Bộ binh, thiết giáp, pháo binh và công binh hiệp đồng dưới một chỉ huy. Cần hoàn tất ba binh chủng. (ĐỀ XUẤT)"
 VIE_lf_command_reform_1:0 "Cải cách bộ chỉ huy I: chuẩn hóa tham mưu"
 VIE_lf_command_reform_1_desc:0 "Chuẩn hóa quy trình tham mưu và chỉ huy tác chiến của Bộ Tổng Tham mưu, theo tinh thần Nghị quyết 109-NQ/QUTW về cán bộ cấp chiến dịch. Mở các chương trình huấn luyện và diễn tập của Lục quân. (THẬT) nền, (ĐỀ XUẤT) cơ chế"

 ### Buoc 3: First Force Structure, huong phat trien, CR2.
 VIE_lf_fs_mobile_force:0 "Lực lượng cơ động"
 VIE_lf_fs_mobile_force_desc:0 "Hướng giả định: tổ chức lực lượng nhỏ, cơ động cao, phản ứng nhanh. Đổi lại giảm nhân lực, đắt hơn khi sản xuất trang bị và đào công sự kém hơn. Loại trừ Quân đoàn chủ lực chính quy và Phòng thủ chiều sâu. Lĩnh vực sở trường: Mạng và Điện tử. (ALT-HISTORY)"
 VIE_lf_fs_mobile_corps:0 "Cụm cơ động"
 VIE_lf_fs_mobile_corps_desc:0 "Lập các cụm cơ động tổ chức theo hướng tinh gọn, tăng tốc độ và sức tấn công. Mở mẫu sư đoàn Cụm Cơ động. (ALT-HISTORY)"
 VIE_lf_fs_main_corps:0 "Quân đoàn chủ lực chính quy"
 VIE_lf_fs_main_corps_desc:0 "Quân đoàn 12 (công bố 2/12/2023) và Quân đoàn 34 (15/12/2024) là các quân đoàn chủ lực cơ động chiến lược, tổ chức lại theo hướng tinh, gọn, mạnh. Hướng này ổn định, đổi lại chi phí duy trì cao hơn và kinh nghiệm tăng chậm hơn. Lĩnh vực sở trường: Phòng không lục quân. (THẬT)"
 VIE_lf_fs_lean_corps:0 "Tổ chức quân đoàn tinh, gọn, mạnh"
 VIE_lf_fs_lean_corps_desc:0 "Hoàn thiện cơ cấu quân đoàn theo hướng tinh, gọn, mạnh: bớt tầng nấc trung gian, tăng hiệu quả bảo đảm hậu cần cho đơn vị chủ lực. (THẬT)"
 VIE_lf_fs_depth_defence:0 "Phòng thủ chiều sâu"
 VIE_lf_fs_depth_defence_desc:0 "Phòng thủ nhiều tuyến dựa vào địa bàn và thế trận quốc phòng toàn dân. Công sự và phòng thủ vững hơn, đổi lại giảm sức tấn công và tốc độ. Lĩnh vực sở trường: Biên giới và Đô thị. (THẬT) nền"
 VIE_lf_fs_militia_units:0 "Tổ chức dân quân và đơn vị khu vực phòng thủ"
 VIE_lf_fs_militia_units_desc:0 "Tổ chức dân quân tự vệ thành các đơn vị có biên chế và chỉ huy rõ ràng, gắn với khu vực phòng thủ tỉnh, thành phố. Mở mẫu sư đoàn Dân quân Khu vực. Phần công trình phòng thủ và luật dân quân đã thuộc nhánh Phòng thủ toàn dân. (THẬT) nền"
 VIE_lf_dev_strategic:0 "Cơ động chiến lược"
 VIE_lf_dev_strategic_desc:0 "Đẩy mạnh khả năng cơ động chiến lược của lực lượng chủ lực. Mở chương trình Phản ứng nhanh. Loại trừ Phòng thủ khu vực và dự bị. (THẬT) một phần"
 VIE_lf_dev_territorial:0 "Phòng thủ khu vực và dự bị"
 VIE_lf_dev_territorial_desc:0 "Củng cố khu vực phòng thủ và lực lượng dự bị động viên theo Luật Lực lượng dự bị động viên 53/2019/QH14. Mở chương trình Động viên toàn dân. Loại trừ Cơ động chiến lược. (THẬT)"
 VIE_lf_command_reform_2:0 "Cải cách bộ chỉ huy II: bộ tư lệnh cấp chiến dịch"
 VIE_lf_command_reform_2_desc:0 "[VIE_lf_alt_cr2]Dựng bộ tư lệnh cấp chiến dịch trên nền các quân đoàn mới. Hiệu ứng khác nhau theo hướng lực lượng đã chọn. (THẬT) nền Quân đoàn 12 và 34"

 ### Buoc 4: nang luc, MOD, CR3, CAP.
 VIE_lf_cap_border_urban:0 "Tác chiến biên giới và đô thị"
 VIE_lf_cap_border_urban_desc:0 "Kết hợp phòng thủ tuyến biên giới với chiến đấu trong đô thị lớn. Chọn tối đa hai trong ba lĩnh vực năng lực. Sở trường của hướng Phòng thủ chiều sâu. (ĐỀ XUẤT)"
 VIE_lf_cap_area_control:0 "Khống chế địa bàn"
 VIE_lf_cap_area_control_desc:0 "Kiểm soát các địa bàn then chốt, từ cửa khẩu đến các đô thị lớn. Hoàn tất lĩnh vực Biên giới và Đô thị. (ĐỀ XUẤT)"
 VIE_lf_cap_army_ad:0 "Phòng không lục quân và bảo vệ lực lượng"
 VIE_lf_cap_army_ad_desc:0 "Bảo vệ lực lượng mặt đất trước đòn tập kích đường không. Chỉ ở mức tổ chức và phối hợp; khí tài và công trình phòng không không thuộc nhánh này. Sở trường của hướng Quân đoàn chủ lực chính quy. (ĐỀ XUẤT)"
 VIE_lf_cap_ad_coord:0 "Hiệp đồng phòng không với Phòng không – Không quân"
 VIE_lf_cap_ad_coord_desc:0 "Quân chủng Phòng không – Không quân thành lập ngày 22/10/1963 (Quyết định 50/QĐ), hợp nhất lại theo Sắc lệnh 03/L-CTN ngày 3/3/1999. Lĩnh vực này hiệp đồng phòng không lục quân với quân chủng ở cấp chiến dịch. (THẬT) nền, (ĐỀ XUẤT) cơ chế"
 VIE_lf_cap_cyber_ew:0 "Tác chiến mạng và điện tử"
 VIE_lf_cap_cyber_ew_desc:0 "Đại hội XIII ưu tiên đưa tác chiến điện tử, không gian mạng và thông tin liên lạc tiến thẳng lên hiện đại. Lĩnh vực này xây nền tảng tổ chức cho Lục quân; công nghệ và nhánh an ninh mạng thuộc nhánh khác. Sở trường của hướng Lực lượng cơ động. (THẬT) nền"
 VIE_lf_cap_info_ops:0 "Tác chiến thông tin hiệp đồng"
 VIE_lf_cap_info_ops_desc:0 "Chỉ huy và tác chiến thông tin hiệp đồng giữa các cấp. Hoàn tất lĩnh vực Mạng và Điện tử. (ĐỀ XUẤT)"
 VIE_lf_selective_modernization:0 "Hiện đại hóa chọn lọc"
 VIE_lf_selective_modernization_desc:0 "Đại hội XIII đặt mục tiêu một số quân chủng, binh chủng và lực lượng tiến thẳng lên hiện đại. Hoàn tất hai lĩnh vực năng lực để mở; phần thưởng theo hai lĩnh vực đã chọn. (THẬT) nền"
 VIE_lf_command_reform_3:0 "Cải cách bộ chỉ huy III: chỉ huy số hiệp đồng"
 VIE_lf_command_reform_3_desc:0 "Chỉ huy trên nền số, hiệp đồng nhiều cấp theo thời gian thực. Chỉ tăng tổ chức và hậu cần; không cộng tầm nhìn hay kế hoạch. (ĐỀ XUẤT)"
 VIE_lf_force_complete:0 "Hoàn thiện lực lượng vũ trang"
 VIE_lf_force_complete_desc:0 "Mục tiêu đến 2030 là Quân đội nhân dân cách mạng, chính quy, tinh nhuệ, hiện đại. Phần thưởng theo hướng lực lượng đã chọn; chương trình huấn luyện của hướng đã được mở từ trước. (THẬT) nền"

 ### Buoc 5: 6 decision va 6 y tuong tam.
 VIE_dec_lf_train_terrain:0 "Huấn luyện tác chiến rừng núi"
 VIE_dec_lf_train_terrain_desc:0 "Tổ chức đợt huấn luyện tác chiến trên địa hình rừng núi cho các đơn vị chủ lực. Sau 90 ngày: kinh nghiệm lục quân và giảm phạt địa hình trong 180 ngày."
 VIE_dec_lf_train_urban:0 "Huấn luyện tác chiến đô thị"
 VIE_dec_lf_train_urban_desc:0 "Huấn luyện chiến đấu trong thành phố cho các đơn vị chủ lực. Sau 90 ngày: kinh nghiệm lục quân và tăng sức tấn công trong đô thị trong 180 ngày."
 VIE_dec_lf_joint_arms:0 "Diễn tập hiệp đồng binh chủng"
 VIE_dec_lf_joint_arms_desc:0 "Diễn tập bộ binh, thiết giáp, pháo binh và công binh dưới một chỉ huy. Sau 90 ngày: kinh nghiệm lục quân (nhiều hơn nếu hướng Chính quy đã hoàn thiện) và tăng tổ chức trong 90 ngày."
 VIE_dec_lf_rapid_response:0 "Phản ứng nhanh"
 VIE_dec_lf_rapid_response_desc:0 "Diễn tập triển khai lực lượng cơ động chiến lược trong thời gian ngắn. Sau 60 ngày: nhiều kinh nghiệm lục quân và tăng tốc độ trong 90 ngày."
 VIE_dec_lf_mobilize_people:0 "Động viên toàn dân"
 VIE_dec_lf_mobilize_people_desc:0 "Huy động lực lượng dự bị và dân quân theo kế hoạch của khu vực phòng thủ. Sau 120 ngày: thêm nhân lực và tăng khả năng đào công sự trong 180 ngày."
 VIE_dec_lf_total_mobilization:0 "Tổng động viên"
 VIE_dec_lf_total_mobilization_desc:0 "Chuyển cả đất nước sang trạng thái chiến tranh: một lượng nhân lực rất lớn, đổi lại giảm ổn định. Chỉ dùng khi theo hướng Chiều sâu hoặc Phòng thủ khu vực và dự bị, khi có chiến tranh hoặc căng thẳng cao."
 VIE_dec_lf_mobilize_gate_tt:0 "Hướng Chiều sâu hoặc Phòng thủ khu vực và dự bị, hoặc đang có chiến tranh, hoặc căng thẳng ở Biển Đông ở mức cao"
 VIE_lf_idea_terrain_drill:0 "Đã huấn luyện rừng núi"
 VIE_lf_idea_terrain_drill_desc:0 "Đơn vị vừa qua đợt huấn luyện tác chiến rừng núi."
 VIE_lf_idea_urban_drill:0 "Đã huấn luyện đô thị"
 VIE_lf_idea_urban_drill_desc:0 "Đơn vị vừa qua đợt huấn luyện chiến đấu trong đô thị."
 VIE_lf_idea_joint_arms:0 "Vừa diễn tập hiệp đồng"
 VIE_lf_idea_joint_arms_desc:0 "Các binh chủng vừa phối hợp diễn tập, tổ chức chiến đấu tốt hơn."
 VIE_lf_idea_rapid_response:0 "Sẵn sàng phản ứng nhanh"
 VIE_lf_idea_rapid_response_desc:0 "Lực lượng cơ động vừa được kiểm tra khả năng triển khai."
 VIE_lf_idea_mobilized_people:0 "Dân quân đã được huy động"
 VIE_lf_idea_mobilized_people_desc:0 "Lực lượng tại chỗ đã triển khai công sự theo kế hoạch khu vực phòng thủ."
 VIE_lf_idea_total_mobilization:0 "Trạng thái tổng động viên"
 VIE_lf_idea_total_mobilization_desc:0 "Cả nước chuyển sang chế độ chiến tranh, công sự được dựng khắp nơi."

 ### Buoc 6: nhan ALT-HISTORY theo ngay (scripted localisation) va 3 event co pop-up.
 VIE_lf_alt_early:0 "§R(ALT-HISTORY: cải cách sớm)§!\n\n"
 VIE_lf_alt_none:0 ""
 vie_lf.1.t:0 "Nghị quyết 05-NQ/TW về tổ chức Quân đội"
 vie_lf.1.d:0 "Bộ Chính trị ban hành Nghị quyết 05-NQ/TW ngày 17 tháng 1 năm 2022 về tổ chức Quân đội nhân dân giai đoạn 2021–2030 và những năm tiếp theo, đặt mục tiêu quân đội tinh, gọn, mạnh. Ngày 2 tháng 4, Quân ủy Trung ương ban hành Nghị quyết 230-NQ/QUTW triển khai.\n\nĐiều chỉnh tổ chức được thực hiện theo lộ trình: ưu tiên quân số cho đơn vị sẵn sàng chiến đấu, tuyến biên giới và biển đảo, thu gọn đầu mối trung gian. Đơn vị nào đủ điều kiện thì làm trước."
 vie_lf.1.a:0 "Triển khai theo lộ trình"
 vie_lf.3.t:0 "Quân đoàn 12 ra mắt"
 vie_lf.3.d:0 "Ngày 2 tháng 12 năm 2023, tại Ninh Bình, Bộ Quốc phòng công bố quyết định thành lập Quân đoàn 12 trên cơ sở sáp nhập Quân đoàn 1 và Quân đoàn 2. Đây là quân đoàn đầu tiên được tổ chức lại theo hướng tinh, gọn, mạnh và là quân đoàn chủ lực cơ động chiến lược.\n\nViệc sáp nhập giảm tầng nấc chỉ huy, dồn quân số về đơn vị chiến đấu và bảo đảm cho nhau theo một đầu mối. Các quân đoàn khác sẽ lần lượt theo sau."
 vie_lf.3.a:0 "Quân đoàn đầu tiên của lộ trình mới"
 vie_lf.5.t:0 "Hợp nhất Tổng cục Hậu cần và Tổng cục Kỹ thuật"
 vie_lf.5.d:0 "Ngày 5 tháng 2 năm 2025, Bộ Quốc phòng công bố Quyết định 366/QĐ-BQP (ký ngày 24 tháng 1) sáp nhập Tổng cục Hậu cần và Tổng cục Kỹ thuật thành Tổng cục Hậu cần – Kỹ thuật.\n\nMột đầu mối bảo đảm cho toàn quân thay cho hai hệ thống song song: bớt chồng chéo ở các khâu vận tải, kho tàng, sửa chữa và cung cấp khí tài."
 vie_lf.5.a:0 "Một đầu mối bảo đảm cho toàn quân"

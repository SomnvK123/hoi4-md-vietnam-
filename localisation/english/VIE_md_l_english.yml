 ### Ideas
 VIE_non_alignment_policy:0 "Độc lập và Tự chủ"
 VIE_non_alignment_policy_desc:0 "Kể từ thập niên 1990, Hà Nội kiên trì theo đuổi đường lối đối ngoại độc lập, tự chủ, đa phương hóa, đa dạng hóa quan hệ quốc tế và không tham gia bất kỳ liên minh quân sự nào."
 VIE_four_nos:0 "Chính sách Quốc phòng Bốn Không"
 VIE_four_nos_desc:0 "Không tham gia liên minh quân sự; không liên kết với nước này để chống nước kia; không cho nước ngoài đặt căn cứ quân sự hoặc sử dụng lãnh thổ Việt Nam để chống lại nước khác; không sử dụng vũ lực hoặc đe dọa sử dụng vũ lực trong quan hệ quốc tế. Sách trắng Quốc phòng 2019 đã chính thức thể chế hóa học thuyết này."
 VIE_us_bta_idea:0 "Hiệp định Thương mại Song phương Việt - Mỹ (BTA)"
 VIE_us_bta_idea_desc:0 "Cánh cửa tiếp cận thị trường Mỹ đã mở ra cơ hội vàng cho hàng dệt may, thủy hải sản và da giày Việt Nam vươn tới phân khúc khách hàng tiềm năng mới."
 VIE_fdi_zones_idea:0 "Khu Công nghiệp và Thu hút FDI"
 VIE_fdi_zones_idea_desc:0 "Hàng loạt khu công nghiệp xung quanh Hà Nội và TP. Hồ Chí Minh thu hút mạnh mẽ các nhà sản xuất Nhật Bản, Hàn Quốc và Đài Loan."
 VIE_wto_member:0 "Thành viên WTO"
 VIE_wto_member_desc:0 "Tư cách thành viên Tổ chức Thương mại Thế giới đảm bảo sự tiếp cận thị trường toàn cầu và đặt các doanh nghiệp nhà nước vào khuôn khổ cạnh tranh khắt khe."
 VIE_public_anger:0 "Làn sóng Phẫn nộ Dư luận"
 VIE_public_anger_desc:0 "Tinh thần dân tộc dâng cao sau các vụ đối đầu căng thẳng quanh giàn khoan."
 VIE_fdi_confidence_shock:0 "Cú Sốc Niềm tin Nhà đầu tư"
 VIE_fdi_confidence_shock_desc:0 "Các nhà đầu tư nước ngoài đang đánh giá lại mức độ rủi ro sau các vụ gây rối đập phá."

 ### Balance of power: Conservative <-> Reform
 VIE_party_balance:0 "§YĐịnh hướng của Đảng§!"
 VIE_party_balance_desc:0 "Trong nội bộ Đảng, một luồng ý kiến chủ trương thận trọng, giữ vững kỷ luật và đề cao khu vực kinh tế nhà nước; luồng ý kiến còn lại thúc đẩy cải cách thị trường sâu rộng và hội nhập quốc tế. Mọi quyết sách lớn đều tác động đến cán cân này."
 VIE_conservative_side:0 "§CKiên định Nền tảng§!"
 VIE_conservative_side_desc:0 "Ổn định chính trị, kỷ luật Đảng và vai trò chủ đạo của doanh nghiệp nhà nước phải được đặt lên hàng đầu."
 VIE_reform_side:0 "§GĐổi mới Sâu rộng§!"
 VIE_reform_side_desc:0 "Kinh tế thị trường, doanh nghiệp tư nhân và hội nhập quốc tế toàn diện là con đường dẫn tới sự thịnh vượng."
 VIE_mid_range:0 "Đường lối Trung dung Cân bằng"
 VIE_mid_range_desc:0 "§gBan lãnh đạo chèo lái khéo léo giữa hai khuynh hướng, giữ vững sự đoàn kết thống nhất trong Đảng.§!"
 VIE_conservative_range:0 "Đường lối Thận trọng"
 VIE_conservative_range_desc:0 "§gKỷ luật và ổn định chính trị được coi trọng hơn tốc độ tăng trưởng.§!"
 VIE_hardline_range:0 "Đường lối Cứng rắn"
 VIE_hardline_range_desc:0 "§gÝ thức hệ giáo điều chiếm ưu thế. Tăng trưởng kinh tế, thương mại và nghiên cứu khoa học chịu ảnh hưởng tiêu cực, song sự lãnh đạo của Đảng được bảo đảm an toàn tuyệt đối.§!"
 VIE_reform_range:0 "Đường lối Canh tân Cải cách"
 VIE_reform_range_desc:0 "§gPhe cải cách giành ưu thế: tăng trưởng nhanh hơn và thương mại khởi sắc, mức độ kiểm soát giảm nhẹ.§!"
 VIE_radical_reform_range:0 "Cải cách Triệt để"
 VIE_radical_reform_range_desc:0 "§gCải cách sâu rộng thúc đẩy tăng trưởng vượt bậc nhưng gây sức ép rất lớn lên khả năng kiểm soát của Đảng.§!"

 ### Tooltips
 VIE_e2_unlocked_tt:0 "Các tiêu điểm thuộc nhánh §YKhẳng định Chủ quyền Biển đảo§! hiện đã có thể lựa chọn."

 ### Focuses
 VIE_doi_moi_continues:0 "Tiếp tục Công cuộc Đổi Mới"
 VIE_doi_moi_continues_desc:0 "Đường lối Đổi Mới khởi xướng từ năm 1986 tiếp tục là nền tảng vững chắc cho sự phát triển của Việt Nam. Ổn định trong nước và hội nhập quốc tế luôn đồng hành cùng nhau."
 VIE_grassroots_democracy:0 "Quy chế Dân chủ Cơ sở"
 VIE_grassroots_democracy_desc:0 "Tham vấn ý kiến nhân dân ở cấp thôn xóm, xã phường trao cho người dân tiếng nói trong các công việc địa phương và giải tỏa những bức xúc trước khi lan rộng."
 VIE_anti_corruption_steering:0 "Ban Chỉ đạo Phòng chống Tham nhũng"
 VIE_anti_corruption_steering_desc:0 "Một cơ quan trung ương nhằm điều phối toàn diện cuộc đấu tranh phòng chống tham nhũng. Điều này chắc chắn sẽ vấp phải sự kháng cự từ những kẻ từng trục lợi theo lề lối cũ."
 VIE_enterprise_law:0 "Luật Doanh nghiệp"
 VIE_enterprise_law_desc:0 "Từ tháng 1 năm 2000, công dân được tự do thành lập và kinh doanh trong mọi ngành nghề mà pháp luật không cấm. Hàng chục ngàn doanh nghiệp mới nhanh chóng ra đời."
 VIE_bilateral_trade_agreement_usa:0 "Hiệp định Thương mại với Hoa Kỳ"
 VIE_bilateral_trade_agreement_usa_desc:0 "Chỉ ít năm sau khi bình thường hóa quan hệ, Hà Nội và Washington đã ký kết hiệp định thương mại song phương mang tính lịch sử."
 VIE_equitization_soes:0 "Cổ phần hóa Doanh nghiệp Nhà nước"
 VIE_equitization_soes_desc:0 "Bán bớt cổ phần trong các doanh nghiệp nhà nước vừa tạo nguồn thu cho ngân sách vừa hiện đại hóa công tác quản trị, dù các cán bộ điều hành cũ không mấy hài lòng."
 VIE_fdi_attraction:0 "Khu Công nghiệp và Thu hút FDI"
 VIE_fdi_attraction_desc:0 "Các khu công nghiệp với giá thuê đất ưu đãi, miễn giảm thuế và nguồn điện ổn định đã thu hút mạnh mẽ các tập đoàn sản xuất nước ngoài về vùng đồng bằng sông Hồng và đồng bằng sông Cửu Long."
 VIE_wto_negotiations:0 "Đàm phán Gia nhập WTO"
 VIE_wto_negotiations_desc:0 "Hàng năm trời đàm phán song phương mở đường cho việc gia nhập tổ chức thương mại toàn cầu. Một thỏa thuận thương mại với Washington và mối quan hệ ấm dần lên với Hoa Kỳ sẽ rút ngắn chặng đường này."
 VIE_samsung_partnership:0 "Cứ điểm Sản xuất Điện tử Miền Bắc"
 VIE_samsung_partnership_desc:0 "Các đại tập đoàn điện tử Hàn Quốc xây dựng các tổ hợp nhà máy khổng lồ quanh Bắc Ninh và Thái Nguyên, biến miền Bắc thành trung tâm sản xuất thiết bị điện tử của thế giới."
 VIE_border_settlement:0 "Hoàn tất Phân giới Cắm mốc Biên giới"
 VIE_border_settlement_desc:0 "Hiệp ước biên giới trên đất liền và Hiệp định phân định Vịnh Bắc Bộ được phê chuẩn, các cột mốc chủ quyền được dựng lên dọc đường biên. Việc loại bỏ các tranh chấp tồn đọng trong lịch sử giúp hai bên giao thương hòa bình."
 VIE_asean_integration:0 "Hội nhập Khu vực ASEAN"
 VIE_asean_integration_desc:0 "Tham gia đầy đủ và tích cực vào các diễn đàn kinh tế và an ninh của ASEAN là mỏ neo gắn kết Việt Nam với khu vực láng giềng."
 VIE_assert_maritime_rights:0 "Khẳng định Chủ quyền Biển đảo"
 VIE_assert_maritime_rights_desc:0 "Sau các cuộc chạm trán liên tiếp trên biển, Hà Nội công khai bảo vệ các tuyên bố chủ quyền của mình. §RĐiều này sẽ làm xấu đi mối quan hệ với Trung Quốc.§!"
 VIE_paracel_ultimatum:0 "Tối hậu thư về Quần đảo Hoàng Sa"
 VIE_paracel_ultimatum_desc:0 "Yêu cầu trao trả lại Quần đảo Hoàng Sa. §RCảnh báo: Điều này sẽ tạo mục tiêu chiến tranh chống lại Trung Quốc, một đối thủ quân sự vượt trội. Không nên thực hiện nếu chưa có sự chuẩn bị chu đáo.§!"

 ### Events: Party Congresses
 vie_pol.2.t:0 "Đại hội Đảng lần thứ IX"
 vie_pol.2.d:0 "Các đại biểu quy tụ về Hà Nội để bầu ra ban lãnh đạo Đảng cho nhiệm kỳ 5 năm tới. Tổng Bí thư Lê Khả Phiêu, xuất thân là một tướng lĩnh chính trị quân đội, nhận phải những ý kiến phê bình về tốc độ cải cách chậm và đường lối cứng rắn; trong khi đó, Chủ tịch Quốc hội Nông Đức Mạnh được coi là nhân vật dung hòa và tạo được sự đồng thuận cao."
 vie_pol.2.a:0 "Đồng chí Nông Đức Mạnh trở thành Tổng Bí thư"
 vie_pol.2.b:0 "Đảng quyết định giữ lại đồng chí Lê Khả Phiêu"
 vie_pol.3.t:0 "Đại hội Đảng lần thứ X"
 vie_pol.3.d:0 "Năm năm tăng trưởng ổn định đã củng cố vững chắc uy tín của ban lãnh đạo. Đại hội diễn ra trong bầu không khí tự tin khi Việt Nam đang hoàn tất những bước chuẩn bị cuối cùng để gia nhập Tổ chức Thương mại Thế giới (WTO)."
 vie_pol.3.a:0 "Tái bầu đồng chí Nông Đức Mạnh nhiệm kỳ thứ hai"
 vie_pol.3.b:0 "Thông qua danh sách nhân sự mang khuynh hướng cải cách"
 vie_pol.4.t:0 "Đại hội Đảng lần thứ XI"
 vie_pol.4.d:0 "Lạm phát tăng cao, đại án nợ xấu Vinashin và những câu hỏi lớn xung quanh hiệu quả hoạt động của các tập đoàn kinh tế nhà nước đã khiến nội bộ Đảng trăn trở. Các đại biểu đã lựa chọn đồng chí Nguyễn Phú Trọng, một nhà lý luận nổi tiếng về tính kỷ luật và kiên định nền tảng, giữ cương vị Tổng Bí thư."
 vie_pol.4.a:0 "Đồng chí Nguyễn Phú Trọng chèo lái con thuyền đất nước"
 vie_pol.5.t:0 "Đại hội Đảng lần thứ XII"
 vie_pol.5.d:0 "Kỳ Đại hội chứng kiến sự cạnh tranh quyết liệt nhất trong suốt một thế hệ. Nhóm ủng hộ Tổng Bí thư nhấn mạnh vào kỷ luật Đảng và cuộc chiến chống tham nhũng. Trong khi đó, nhóm Chính phủ do Thủ tướng Nguyễn Tấn Dũng đứng đầu đề xuất con đường tăng trưởng nhanh hơn, mang tính thực dụng cao hơn."
 vie_pol.5.a:0 "Đồng chí Nguyễn Phú Trọng tái đắc cử Tổng Bí thư"
 vie_pol.5.b:0 "Nhóm chủ trương của Chính phủ chiếm ưu thế"

 ### Events: economy
 vie_eco.1.t:0 "Việt Nam Chính thức Gia nhập WTO"
 vie_eco.1.d:0 "Sau hơn một thập kỷ kiên trì đàm phán, Tổ chức Thương mại Thế giới chính thức phê chuẩn tư cách thành viên của Việt Nam. Thuế quan cắt giảm, các doanh nghiệp xuất khẩu tiếp cận được những thị trường mới rộng lớn, và khối doanh nghiệp nhà nước buộc phải đương đầu với sự cạnh tranh khốc liệt."
 vie_eco.1.a:0 "Một chương mới mở ra cho nền kinh tế"
 vie_eco.2.t:0 "Chuyên án Năm Cam"
 vie_eco.2.d:0 "Công an đã bắt giữ ông trùm thế giới ngầm khét tiếng tại TP. Hồ Chí Minh, kẻ sở hữu mạng lưới bảo kê vươn sâu vào các cơ quan cảnh sát và viện kiểm sát. Các điều tra viên khẳng định các đầu mối còn dẫn tới những nhân vật quyền lực cao hơn nữa."
 vie_eco.2.a:0 "Xử lý nghiêm minh mọi đối tượng, bất kể cấp bậc"
 vie_eco.2.b:0 "Khoanh vùng và xử lý vụ án trong êm thấm"

 ### Events: South China Sea (HD-981)
 vie_scs.1.t:0 "Giàn khoan Hải Dương 981"
 vie_scs.1.d:0 "Tổng công ty dầu khí nhà nước Trung Quốc đã kéo giàn khoan thăm dò nước sâu vào vùng biển gần Quần đảo Hoàng Sa mà Việt Nam khẳng định thuộc vùng đặc quyền kinh tế của mình. Hàng chục tàu thuyền Trung Quốc, trong đó có cả tàu quân sự, bao vây bảo vệ giàn khoan và hung hãn đâm va vào tàu Cảnh sát biển Việt Nam tới làm nhiệm vụ thực thi pháp luật."
 vie_scs.1.a:0 "Kiên trì các biện pháp ngoại giao hòa bình"
 vie_scs.1.b:0 "Điều động tàu Cảnh sát biển và Hải quân bám sát giàn khoan"
 vie_scs.1.c:0 "Đưa vụ việc lên diễn đàn công luận quốc tế"
 vie_scs.2.t:0 "Bạo loạn Chống Trung Quốc"
 vie_scs.2.d:0 "Các cuộc tuần hành phản đối giàn khoan đã biến tướng thành bạo lực. Đám đông tại một số khu công nghiệp đã tấn công các nhà máy mà họ cho là của người Trung Quốc, trong khi nhiều cơ sở thực tế thuộc sở hữu của nhà đầu tư Đài Loan, Hàn Quốc và Singapore. Giới quản lý nước ngoài đang khẩn thiết yêu cầu sự bảo vệ."
 vie_scs.2.a:0 "Lập tức vãn hồi trật tự an ninh"
 vie_scs.2.b:0 "Để sự phẫn nộ lắng xuống một cách tự nhiên"
 vie_scs.3.t:0 "Giàn khoan Rút lui"
 vie_scs.3.d:0 "Sớm hơn dự kiến, phía Trung Quốc tuyên bố giàn khoan đã hoàn thành nhiệm vụ tác nghiệp và bắt đầu di chuyển đi nơi khác. Cơn sốt khủng hoảng dần hạ nhiệt khỏi các trang nhất mặt báo, song những bài học sâu sắc từ sự kiện này đã khắc sâu trong tâm trí ban lãnh đạo đất nước."
 vie_scs.3.a:0 "Đánh giá lại tình hình và rút ra bài học"

 ### Tổng Bí thư (khóa tên cho create_country_leader)
 VIE_leader_le_kha_phieu:0 "Lê Khả Phiêu"
 VIE_leader_nong_duc_manh:0 "Nông Đức Mạnh"
 VIE_leader_nguyen_phu_trong:0 "Nguyễn Phú Trọng"
 VIE_leader_nguyen_tan_dung:0 "Nguyễn Tấn Dũng"
 VIE_leader_to_lam:0 "Tô Lâm"
 VIE_leader_restored_party:0 "Hoàng Văn Tuấn"

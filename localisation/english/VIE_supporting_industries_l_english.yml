 ### Focuses - Supporting Industries & Metallurgy
 VIE_hoa_phat_hrc_steel:0 "Sản xuất HRC tại Dung Quất"
 VIE_hoa_phat_hrc_steel_desc:0 "Khu liên hợp Hòa Phát Dung Quất sản xuất mẻ thép cuộn cán nóng đầu tiên tháng 5/2020. Nguồn HRC trong nước hỗ trợ cơ khí, ô tô và kết cấu công nghiệp, đồng thời giảm một phần nhu cầu nhập khẩu."

 VIE_precision_mechanics_molds:0 "Cơ khí Chính xác & Khuôn mẫu CNC"
 VIE_precision_mechanics_molds_desc:0 "Đầu tư đồng bộ vào trung tâm cơ khí chế tạo THACO Chu Lai và các khu công nghiệp phụ trợ phía Bắc. Phát triển chuỗi xưởng gia công CNC 5 trục, dập định hình áp lực cao và công nghệ chế tạo khuôn đúc kim loại - linh kiện nhựa kỹ thuật dung sai cấp micron. Chấm dứt hoàn toàn định kiến 'không làm nổi chiếc ốc vít', tạo nền móng vững chắc cho các ngành chế tạo phức hợp."

 VIE_tier1_vendor_localization:0 "Nâng tầm Nhà cung ứng Cấp 1"
 VIE_tier1_vendor_localization_desc:0 "Hỗ trợ doanh nghiệp trong nước đạt yêu cầu chất lượng, giao hàng và truy xuất nguồn gốc của các tập đoàn sản xuất. Mạng lưới nhà cung ứng cấp 1 giúp tăng giá trị được tạo ra trong nước."

 ### Focuses - Automotive & EV Ecosystem
 VIE_integrated_auto_supplier_park:0 "Tổ hợp Phụ trợ Ô tô Tích hợp"
 VIE_integrated_auto_supplier_park_desc:0 "Phát triển cụm sản xuất linh kiện bên cạnh nhà máy lắp ráp ô tô. Hợp tác với các nhà cung ứng khung gầm, ghế và thân vỏ để giảm chi phí logistics, nâng chất lượng và mở rộng sản xuất trong nước."

 VIE_ev_revolution_batteries:0 "Cách mạng Xe điện & Tổ hợp Pin VinES"
 VIE_ev_revolution_batteries_desc:0 "Bước ngoặt chiến lược táo bạo: tuyên bố ngừng sản xuất toàn bộ xe xăng động cơ đốt trong để chuyển dịch 100% sang Xe điện thông minh (Smart EV). Khởi công đại tổ hợp nhà máy sản xuất pin lithium-ion và LFP VinES tại Khu kinh tế Vũng Áng (Hà Tĩnh) hợp tác cùng Gotion High-Tech và CATL, đưa Việt Nam bước vào kỷ nguyên giao thông không phát thải."

 VIE_global_auto_export:0 "Vươn ra Biển lớn & Niêm yết Nasdaq"
 VIE_global_auto_export_desc:0 "Những chuyến tàu viễn dương Silver Queen đưa hàng ngàn chiếc xe điện thương hiệu Việt Nam cập cảng California, chính thức xâm nhập thị trường Mỹ, Canada và châu Âu. Sự kiện rung chuông mở màn giao dịch trên sàn chứng khoán công nghệ Nasdaq (New York) với mã cổ phiếu VFS đánh dấu cột mốc lịch sử đưa nền công nghiệp Việt Nam vươn tầm toàn cầu."

 ### Ideas
 VIE_hrc_steel_self_reliance:0 "Nguồn thép HRC trong nước"
 VIE_hrc_steel_self_reliance_desc:0 "Sản lượng thép cuộn cán nóng trong nước bổ sung nguồn vật liệu cho cơ khí, đóng tàu và hạ tầng. Doanh nghiệp vẫn cần nhập khẩu các chủng loại và sản lượng chưa được đáp ứng."

 VIE_precision_molds_idea:0 "Công nghệ Khuôn mẫu & Cơ khí Chính xác"
 VIE_precision_molds_idea_desc:0 "Làm chủ công nghệ khuôn đúc và gia công CNC chính xác giúp nâng cao năng suất các nhà máy và giải quyết bài toán linh kiện nội địa."

 VIE_tier1_suppliers_idea:0 "Mạng lưới Nhà cung ứng Cấp 1"
 VIE_tier1_suppliers_idea_desc:0 "Các doanh nghiệp hỗ trợ nội địa cung ứng linh kiện trực tiếp cho các tập đoàn đa quốc gia giúp tăng doanh thu thuế và nâng cao chuỗi giá trị."

 VIE_auto_supplier_cluster_idea:0 "Cụm Công nghiệp Phụ trợ Ô tô Tích hợp"
 VIE_auto_supplier_cluster_idea_desc:0 "Chuỗi cung ứng linh kiện khung gầm, ghế và thân vỏ sản xuất tại chỗ giúp giảm thiểu chi phí logistics và tối đa hóa năng lực sản xuất ô tô."

 VIE_ev_mobility_idea:0 "Hệ sinh thái Xe điện Thông minh"
 VIE_ev_mobility_idea_desc:0 "Chuyển dịch sang phương tiện giao thông xanh và tự chủ pack pin giảm thiểu nhu cầu tiêu thụ nhiên liệu hóa thạch và thúc đẩy kinh tế bền vững."

 VIE_global_brand_recognition:0 "Thương hiệu Công nghiệp Quốc tế"
 VIE_global_brand_recognition_desc:0 "Việc niêm yết trên thị trường vốn quốc tế và xuất khẩu xe điện sang Bắc Mỹ nâng tầm uy tín và ảnh hưởng kinh tế của Việt Nam trên toàn cầu."

 ### Events
 vie_auto.1.t:0 "Rung Chuông Niêm Yết Sàn Giao Dịch Quốc Tế"
 vie_auto.1.d:0 "Hôm nay, tại sàn giao dịch chứng khoán công nghệ Nasdaq ở Quảng trường Thời đại (New York), tiếng chuông khai mạc phiên giao dịch đã vang lên trang trọng dưới sự chứng kiến của giới đầu tư toàn cầu. Lần đầu tiên trong lịch sử, một thương hiệu công nghiệp ô tô và công nghệ cao của Việt Nam chính thức niêm yết trên thị trường vốn lớn nhất hành tinh. Đây là minh chứng hùng hồn cho sự vươn mình ngoạn mục của ngành sản xuất quốc gia từ những ngày đầu gia công thô sơ."
 vie_auto.1.a:0 "Khẳng định bản lĩnh và tầm vóc công nghiệp Việt Nam!"

 vie_auto.2.t:0 "Liên Minh Giao Thông Xanh: VinFast & Petrolimex"
 vie_auto.2.d:0 "Tập đoàn Xăng dầu Việt Nam (Petrolimex) và VinFast đã chính thức ký kết thỏa thuận hợp tác chiến lược nhằm tận dụng mạng lưới hơn 2.700 trạm xăng trên toàn quốc để triển khai hệ thống trạm sạc xe điện siêu nhanh. Sự kết hợp giữa hạ tầng năng lượng truyền thống số 1 và hãng xe điện tiên phong đã giải quyết triệt để rào cản lo sợ hết pin của người tiêu dùng, mở đường cho cuộc cách mạng giao thông xanh toàn diện."
 vie_auto.2.a:0 "Một liên minh năng lượng và giao thông xanh mẫu mực!"

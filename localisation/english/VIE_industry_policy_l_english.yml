l_english:
 VIE_fdi_fast_track:0 "Thu hút đầu tư nhanh"
 VIE_fdi_fast_track_desc:0 "Rút ngắn thủ tục và mở rộng tiếp nhận dự án trong làn sóng dịch chuyển chuỗi cung ứng. Tăng trưởng nhanh đi cùng nhu cầu kiểm soát xuất xứ và mức độ liên kết với doanh nghiệp trong nước."
 VIE_fdi_technology_screening:0 "Chọn lọc chuyển giao công nghệ"
 VIE_fdi_technology_screening_desc:0 "Ưu tiên dự án có đào tạo, chuyển giao quy trình và hợp tác với nhà cung ứng trong nước. Việc sàng lọc cần nguồn lực hành chính, đổi lại giúp phát triển năng lực nội địa hóa."
 VIE_chip_design_packaging_priority:0 "Ưu tiên thiết kế và đóng gói"
 VIE_chip_design_packaging_priority_desc:0 "Phân bổ hỗ trợ ban đầu cho thiết kế vi mạch và đóng gói, kiểm thử. Khi đủ nhân lực và năng lực kỹ thuật, vẫn có thể bổ sung vốn để xây dây chuyền chế tạo thử nghiệm."
 VIE_chip_pilot_fab_priority:0 "Ưu tiên chế tạo thử nghiệm"
 VIE_chip_pilot_fab_priority_desc:0 "Cam kết hỗ trợ ban đầu lớn hơn để chuẩn bị dây chuyền thử nghiệm ở phân khúc công nghệ trưởng thành. Thiết kế, đóng gói và đào tạo vẫn phải hoàn thành trước khi đưa dự án vào triển khai."

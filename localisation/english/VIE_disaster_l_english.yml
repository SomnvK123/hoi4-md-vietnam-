l_english:

 ### Focuses - Disaster, Climate & Ecological Security
 VIE_military_rescue_corps:0 "Binh chủng Cứu hộ - Cứu nạn"
 VIE_military_rescue_corps_desc:0 "Quân đội Nhân dân là lực lượng nòng cốt, xung kích trong thời bình. Trang bị trực thăng chuyên dụng, xe lội nước và thiết bị dò tìm hiện đại giúp bộ đội sẵn sàng ứng cứu nhân dân trong hiểm họa sạt lở đồi núi và ngập lụt chia cắt."

 VIE_emergency_operations_center:0 "Sở Chỉ huy Ứng phó Khẩn cấp"
 VIE_emergency_operations_center_desc:0 "Tích hợp bản đồ số hóa rủi ro thiên tai, mạng liên lạc quân - dân y vệ tinh thời gian thực. Mọi mệnh lệnh sơ tán dân cư và điều phối lực lượng cứu trợ được chỉ huy tập trung, giảm thiểu tối đa tổn thất sinh mạng."

 VIE_dutch_water_model:0 "Hà Lan hóa Đồng bằng"
 VIE_dutch_water_model_desc:0 "Áp dụng công nghệ thủy lợi đỉnh cao của Hà Lan: xây dựng đại công trình cống ngăn triều Cái Lớn - Cái Bé và hệ thống đê bao kiên cố khép kín. Mục tiêu là kiểm soát mặn tuyệt đối, bảo vệ vựa lúa gạo an ninh lương thực quốc gia."

 VIE_nature_adaptation_120:0 "Chiến lược Thuận thiên NQ120"
 VIE_nature_adaptation_120_desc:0 "Nghị quyết 120/NQ-CP năm 2017 tạo bước ngoặt lịch sử: chấm dứt tư duy 'chống lại thiên nhiên' để chuyển sang 'sống chung với lũ, mặn'. Đồng bằng chuyển hướng sang kinh tế tuần hoàn, xen canh lúa - tôm sinh thái xuất khẩu giá trị cao."

 VIE_sustainable_mekong_delta:0 "Quy hoạch Đồng bằng Bền vững"
 VIE_sustainable_mekong_delta_desc:0 "Tích hợp giải pháp công trình và phi công trình vào Quy hoạch tổng thể ĐBSCL tầm nhìn 2050. Đồng bằng sông Cửu Long không chỉ thoát khỏi hiểm họa xâm nhập mặn mà còn vươn lên thành trung tâm nông nghiệp sinh thái toàn cầu."

 VIE_satellite_early_warning:0 "Mạng lưới Viễn thám & Radar 72h"
 VIE_satellite_early_warning_desc:0 "Kết hợp dữ liệu ảnh vệ tinh viễn thám VNREDSat với chuỗi trạm radar Doppler ven biển. Hệ thống cho phép dự báo hướng đi của bão trước 72 giờ, truyền tín hiệu trực tiếp về từng thiết bị định vị của hàng vạn tàu cá ngoài khơi."

 VIE_storm_resilient_islands:0 "Công sự Biển đảo Chịu bão"
 VIE_storm_resilient_islands_desc:0 "Kiên cố hóa các âu tàu, âu thuyền tránh bão tại quần đảo Trường Sa. Các đảo nổi, đảo chìm trở thành pháo đài sinh tồn vững chắc giữa biển khơi, che chở cho ngư dân và bảo vệ chủ quyền tổ quốc trước siêu bão cấp 17."

 VIE_jetp_partnership:0 "Đối tác Năng lượng Công bằng JETP"
 VIE_jetp_partnership_desc:0 "Ký kết thỏa thuận chính trị lịch sử với khối G7 và Liên minh Châu Âu, huy động 15,5 tỷ USD tài chính xanh. Nguồn lực quốc tế giúp Việt Nam đóng cửa dần các lò than cũ, dọn đường cho kỷ nguyên điện gió ngoài khơi."

 ### Ideas
 VIE_military_rescue_idea:0 "Binh chủng Cứu nạn Quân sự"
 VIE_military_rescue_idea_desc:0 "Các trung đoàn công binh và không quân trực thăng được huấn luyện thường trực ứng phó thiên tai, tăng cường khả năng tổ chức và phòng thủ lãnh thổ."
 VIE_dutch_engineering_idea:0 "Công trình Thủy lợi Hà Lan hóa"
 VIE_dutch_engineering_idea_desc:0 "Hệ thống cống đập và đê bao bê tông kiên cố bảo đảm sản xuất công nghiệp và kiểm soát mặn triệt để."
 VIE_nature_adaptation_idea:0 "Mô hình Nông nghiệp Thuận thiên"
 VIE_nature_adaptation_idea_desc:0 "Sống chung với lũ và mặn, giảm thiểu áp lực hàng tiêu dùng và gia tăng phúc lợi kinh tế sinh thái."
 VIE_mekong_granary_idea:0 "Vựa lúa Mê Kông Kiên cường"
 VIE_mekong_granary_idea_desc:0 "Quy hoạch đồng bằng bền vững bảo đảm nguồn cung lương thực vững chắc trước mọi biến động thời tiết cực đoan."
 VIE_salinity_emergency:0 "Hạn mặn Khẩn cấp"
 VIE_salinity_emergency_desc:0 "Đợt hạn mặn nghiêm trọng đang đe dọa sinh kế và nguồn nước ngọt của hàng triệu người dân ĐBSCL."
 VIE_nature_transition:0 "Thời kỳ Chuyển dịch Sinh thái"
 VIE_nature_transition_desc:0 "Nông dân và chính quyền địa phương đang tích cực tái cơ cấu cây trồng, vật nuôi theo hướng thích ứng biến đổi khí hậu."

 ### Events
 vie_disaster.1.t:0 "Siêu bão Biển Đông Đổ bộ Miền Trung & Vịnh Bắc Bộ"
 vie_disaster.1.d:0 "Một siêu bão cuồng phong với sức gió giật trên cấp 16 đang càn quét dọc bờ biển miền Trung và vịnh Bắc Bộ. Mưa lớn xối xả đe dọa gây ngập lụt diện rộng, vỡ đê và sạt lở đất kinh hoàng tại các sườn đồi núi dốc. Toàn bộ chính quyền các cấp đã được đặt vào tình trạng báo động đỏ."
 vie_disaster.1.a:0 "Toàn hệ thống và quân đội vào cuộc – Bảo vệ tính mạng nhân dân là trên hết!"
 vie_disaster.1.b:0 "Tập trung tối đa lực lượng khắc phục sự cố tại các điểm nóng."
 vie_disaster.1.c:0 "Hạ tầng tan hoang, thiệt hại hàng ngàn tỷ đồng..."

 vie_disaster.2.t:0 "Đại Hạn Mặn & Cạn kiệt Dòng Mê Kông"
 vie_disaster.2.d:0 "Nắng nóng kéo dài kỷ lục kết hợp với việc các hồ chứa thủy điện thượng nguồn tích nước đã khiến dòng chảy sông Mê Kông xuống mức thấp nhất trong 100 năm qua. Nước mặn lấn sâu hơn 70km vào các nhánh sông Tiền, sông Hậu, đe dọa trực tiếp vựa lúa gạo quốc gia."
 vie_disaster.2.a:0 "Đẩy nhanh Siêu dự án Cống Ngăn mặn & Đê biển kiên cố!"
 vie_disaster.2.b:0 "Ban hành Nghị quyết Thuận thiên – Thích ứng sinh thái bền vững!"

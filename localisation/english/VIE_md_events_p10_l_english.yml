l_english:

 ### vie_pol.11
 vie_pol.11.t:0 "Hội Nghị Trung Ương 6: Tự Phê Bình và Phê Bình"
 vie_pol.11.d:0 "Ban Chấp hành Trung ương nhóm họp để kiểm điểm trách nhiệm của tập thể và cá nhân ban lãnh đạo. Một số ủy viên yêu cầu phải thi hành kỷ luật đích danh cán bộ lãnh đạo cấp cao. Những người khác chỉ muốn dừng lại ở mức phát động tự phê bình chung."
 vie_pol.11.a:0 "Kêu gọi toàn Đảng nghiêm túc tự phê bình"
 vie_pol.11.b:0 "Thi hành kỷ luật đích danh cán bộ cấp cao"

 ### vie_pol.12
 vie_pol.12.t:0 "Đại Hội Đảng Lần Thứ XV"
 vie_pol.12.d:0 "Các đại biểu hội tụ để bầu chọn thế hệ lãnh đạo kế cận và vạch ra định hướng phát triển đất nước tới năm 2036. Lễ kỷ niệm 100 năm ngày thành lập Đảng đã qua và mục tiêu trở thành nước phát triển có thu nhập cao đang ở ngay trước mắt."
 vie_pol.12.a:0 "Kế thừa: Giữ vững ban lãnh đạo đã qua thử thách"
 vie_pol.12.b:0 "Bầu chọn đội ngũ nhân sự trẻ mang tư duy cải cách"

 ### vie_pol.13
 vie_pol.13.t:0 "Đại Hội Đảng Lần Thứ XVI"
 vie_pol.13.d:0 "Đại hội Đảng toàn quốc tiếp tục triệu tập. Một thế hệ cán bộ lãnh đạo mới, sinh ra và lớn lên sau chiến tranh, đã sẵn sàng tiếp quản trọng trách. Các cuộc thảo luận sôi nổi xoay quanh mức độ đổi mới thể chế."
 vie_pol.13.a:0 "Kế thừa: Tiếp tục đường lối lãnh đạo kiên định"
 vie_pol.13.b:0 "Bầu chọn đội ngũ lãnh đạo trẻ trung, đổi mới"

 ### vie_pol.14
 vie_pol.14.t:0 "Bầu Cử Đại Biểu Quốc Hội"
 vie_pol.14.d:0 "Cử tri cả nước đi bỏ phiếu bầu ra Quốc hội khóa mới. Mặt trận Tổ quốc tiến hành hiệp thương kỹ lưỡng danh sách ứng cử viên, trong khi một số ứng viên tự ứng cử đề đạt nguyện vọng tham gia."
 vie_pol.14.a:0 "Siết chặt hiệp thương theo đúng quy trình truyền thống"
 vie_pol.14.b:0 "Tạo điều kiện cho thêm các ứng viên tự do tranh cử"

 ### vie_pol.15
 vie_pol.15.t:0 "Bản Kiến Nghị Sửa Đổi Hiến Pháp"
 vie_pol.15.d:0 "Một nhóm các học giả, nhân sĩ trí thức và cựu cán bộ công bố bản kiến nghị đề nghị tổ chức lấy ý kiến nhân dân công khai và sâu rộng về việc sửa đổi Hiến pháp. Ban lãnh đạo đứng trước quyết định xử lý bản kiến nghị này."
 vie_pol.15.a:0 "Âm thầm tiếp thu một số điểm hợp lý"
 vie_pol.15.b:0 "Mở cuộc thảo luận rộng rãi trong toàn dân"
 vie_pol.15.c:0 "Bác bỏ bản kiến nghị"

 ### vie_pol.16
 vie_pol.16.t:0 "Tinh Gọn Bộ Máy Nhà Nước"
 vie_pol.16.d:0 "Đề án sáp nhập các bộ ngành và cắt giảm biên chế đã được đưa lên bàn nghị sự. Nhiều cán bộ sẽ phải dôi dư, và các bộ ngành đều tìm cách vận động hành lang để tránh bị sáp nhập."
 vie_pol.16.a:0 "Cắt giảm quyết liệt, thần tốc"
 vie_pol.16.b:0 "Triển khai thận trọng theo từng giai đoạn"

 ### vie_pol.17
 vie_pol.17.t:0 "Sáp Nhập Đơn Vị Hành Chính Cấp Tỉnh"
 vie_pol.17.d:0 "Chính phủ đề xuất phương án sáp nhập để giảm số lượng tỉnh thành và tinh giản bỏ cấp quận/huyện trung gian. Nhiều vị trí lãnh đạo địa phương sẽ bị cắt giảm, trong khi người dân phải làm quen với việc giải quyết thủ tục tại các trung tâm hành chính mới."
 vie_pol.17.a:0 "Rút gọn còn 34 tỉnh thành và bỏ cấp huyện"
 vie_pol.17.b:0 "Chỉ sáp nhập thí điểm ở quy mô hạn chế"

 ### vie_pol.19
 vie_pol.19.t:0 "Vụ Tấn Công Trụ Sở Xã tại Tây Nguyên"
 vie_pol.19.d:0 "Nhóm đối tượng có vũ trang đã bất ngờ tấn công trụ sở xã tại vùng cao nguyên khiến nhiều cán bộ, chiến sĩ hy sinh và người dân thiệt mạng. Chính quyền địa phương khẩn thiết đề nghị trung ương chi viện."
 vie_pol.19.a:0 "Truy quét tận gốc và lập lại trật tự kỷ cương"
 vie_pol.19.b:0 "Tăng cường thêm chương trình phát triển kinh tế vùng"

 ### vie_pol.20
 vie_pol.20.t:0 "Tranh Chấp Đất Đai Căng Thẳng"
 vie_pol.20.d:0 "Bà con nông dân tại một huyện ven đô đã dựng rào chặn đường để phản đối phương án thu hồi đất và giá bồi thường dự án. Lực lượng chức năng đã có mặt tại hiện trường dưới sự theo dõi sát sao của ống kính máy quay."
 vie_pol.20.a:0 "Cưỡng chế giải tỏa đám đông quá khích"
 vie_pol.20.b:0 "Điều chỉnh mức đền bù thỏa đáng theo giá thị trường"
 vie_pol.20.c:0 "Mở cuộc đối thoại trực tiếp với người dân"

 ### vie_pol.22
 vie_pol.22.t:0 "Bầu Kiện Toàn Chức Danh Tổng Bí Thư"
 vie_pol.22.d:0 "Ban Chấp hành Trung ương triệu tập hội nghị khẩn cấp để bầu nhà lãnh đạo mới sau khi vị trí đứng đầu Đảng bất ngờ bị khuyết. Hai khuynh hướng chính trị đều đưa ra nhân sự đại diện."
 vie_pol.22.a:0 "Ủng hộ ứng viên có xuất thân từ khối nội chính, an ninh"
 vie_pol.22.b:0 "Ủng hộ ứng viên có kinh nghiệm điều hành kinh tế"

 ### vie_cor.1
 vie_cor.1.t:0 "Đại Án Vinalines"
 vie_cor.1.d:0 "Tổng công ty Hàng hải Việt Nam làm thất thoát hàng ngàn tỷ đồng qua các thương vụ mua sắm ụ nổi và đầu tư dàn trải. Cơ quan điều tra đã khởi tố hàng loạt lãnh đạo chủ chốt, trong đó có nhiều cán bộ đảng viên cấp cao."
 vie_cor.1.a:0 "Kiên quyết khởi tố và xử lý nghiêm mọi đối tượng"
 vie_cor.1.b:0 "Xử lý kỷ luật nội bộ trong Đảng"

 ### vie_cor.2
 vie_cor.2.t:0 "Căng Thẳng Ngoại Giao Liên Quan Đến Dẫn Độ"
 vie_cor.2.d:0 "Chính phủ Đức cáo buộc Việt Nam tiến hành chiến dịch bắt cóc một cựu quan chức doanh nghiệp đang xin tị nạn ngay tại Berlin. Quan hệ song phương rơi vào khủng hoảng và các doanh nghiệp hai nước hết sức lo lắng."
 vie_cor.2.a:0 "Giữ vững lập trường và cách giải thích của Hà Nội"
 vie_cor.2.b:0 "Chủ động hòa giải để xoa dịu Berlin"

 ### vie_cor.3
 vie_cor.3.t:0 "Bê Bối Thương Vụ Mua Doanh Nghiệp Truyền Hình"
 vie_cor.3.d:0 "Tổng công ty viễn thông nhà nước đã chi khoản tiền khổng lồ để thâu tóm một doanh nghiệp truyền hình tư nhân đang thua lỗ với mức giá trên trời. Cơ quan điều tra phát hiện dấu hiệu lại quả và hàng loạt quan chức liên quan."
 vie_cor.3.a:0 "Truy tố nghiêm minh và thu hồi triệt để tài sản"
 vie_cor.3.b:0 "Khoanh vùng xử lý nhằm giữ ổn định doanh nghiệp"

 ### vie_cor.4
 vie_cor.4.t:0 "Đại Án 'Chuyến Bay Giải Cứu'"
 vie_cor.4.d:0 "Các cán bộ thoái hóa và doanh nghiệp câu kết trục lợi hàng trăm tỷ đồng từ các chuyến bay đưa kiều bào về nước tránh dịch. Dư luận nhân dân cả nước vô cùng căm phẫn trước hành vi trục lợi trên nỗi đau đồng bào."
 vie_cor.4.a:0 "Mở rộng điều tra và xét xử nghiêm khắc nhất"
 vie_cor.4.b:0 "Khoanh vùng vụ án để tránh tổn hại ngành ngoại giao"

 ### vie_cor.5
 vie_cor.5.t:0 "Đại Án Đăng Kiểm Phương Tiện Giao Thông"
 vie_cor.5.d:0 "Hàng trăm đăng kiểm viên và lãnh đạo trung tâm đăng kiểm bị bắt vì nhận hối lộ để bỏ qua vi phạm kỹ thuật của phương tiện. Hàng loạt trung tâm đóng cửa khiến các tài xế phải xếp hàng rồng rắn thâu đêm."
 vie_cor.5.a:0 "Kiên quyết xử lý dứt điểm sai phạm dù xảy ra ùn tắc"
 vie_cor.5.b:0 "Xử lý từng bước để đảm bảo hoạt động lưu thông phương tiện"

 ### vie_cor.7
 vie_cor.7.t:0 "Thông Thầu Đấu Thầu tại Các Tỉnh Thành"
 vie_cor.7.d:0 "Thanh tra phát hiện cùng một nhóm doanh nghiệp 'sân sau' liên tục trúng hàng loạt gói thầu thiết bị y tế và giáo dục tại nhiều địa phương, với sự tiếp tay của không ít quan chức sở ngành."
 vie_cor.7.a:0 "Khởi tố hình sự và xử lý nghiêm minh"
 vie_cor.7.b:0 "Chấn chỉnh nhắc nhở nội bộ"

 ### vie_cor.8
 vie_cor.8.t:0 "Thu Hồi Tài Sản Tham Nhũng Nộp Ngân Sách"
 vie_cor.8.d:0 "Cơ quan thi hành án dân sự đã thu hồi thành công lượng lớn tiền mặt và bất động sản có giá trị từ các bị án tham nhũng để nộp về kho bạc nhà nước."
 vie_cor.8.a:0 "Bổ sung toàn bộ vào ngân sách trung ương"
 vie_cor.8.b:0 "Dành riêng nguồn vốn để đầu tư trường học và bệnh viện"

 ### vie_eco.15
 vie_eco.15.t:0 "Hiệp Định Thương Mại Song Phương Việt - Mỹ Có Hiệu Lực"
 vie_eco.15.d:0 "Hiệp định BTA chính thức có hiệu lực. Hàng rào thuế quan đối với hàng hóa Việt Nam xuất sang Mỹ giảm mạnh, mở toang cánh cửa xuất khẩu, song các nhà sản xuất trong nước cũng lo ngại sức ép cạnh tranh từ hàng Mỹ."
 vie_eco.15.a:0 "Triển khai thực thi toàn diện và nhanh chóng"
 vie_eco.15.b:0 "Lộ trình thực hiện từng bước có biện pháp bảo hộ đi kèm"

 ### vie_eco.16
 vie_eco.16.t:0 "Cơn Sốt Bong Bóng Thị Trường Chứng Khoán"
 vie_eco.16.d:0 "Chỉ số chứng khoán tăng gấp đôi chỉ sau một năm, thu hút đông đảo nhà đầu tư cá nhân rút tiết kiệm đổ xô vào sàn giao dịch. Cơ quan quản lý đứng trước câu hỏi liệu có nên can thiệp hạ nhiệt thị trường."
 vie_eco.16.a:0 "Ban hành biện pháp hạ nhiệt kiểm soát đầu cơ"
 vie_eco.16.b:0 "Để thị trường tự do vận hành theo cung cầu"

 ### vie_eco.17
 vie_eco.17.t:0 "Cơn Bão Khủng Hoảng Tài Chính Toàn Cầu"
 vie_eco.17.d:0 "Đơn hàng xuất khẩu sụt giảm nghiêm trọng, hàng loạt nhà máy buộc phải cắt giảm lao động. Giới chuyên gia chia rẽ sâu sắc giữa việc tung gói kích cầu kinh tế hay duy trì thắt lưng buộc bụng."
 vie_eco.17.a:0 "Tung gói kích cầu kinh tế và hỗ trợ lãi suất"
 vie_eco.17.b:0 "Giữ vững kỷ luật tài khóa thận trọng"

 ### vie_eco.18
 vie_eco.18.t:0 "Thị Trường Bất Động Sản Đóng Băng"
 vie_eco.18.d:0 "Thanh khoản căn hộ và đất nền gần như tê liệt hoàn toàn, các doanh nghiệp xây dựng không thể trả nợ đến hạn. Các ngân hàng lo ngại một làn sóng nợ xấu lan rộng."
 vie_eco.18.a:0 "Tung gói tín dụng ưu đãi hỗ trợ nhà ở xã hội"
 vie_eco.18.b:0 "Để thị trường tự điều chỉnh thanh lọc"

 ### vie_eco.20
 vie_eco.20.t:0 "Dịch Tả Lợn Châu Phi Bùng Phát"
 vie_eco.20.d:0 "Dịch bệnh nguy hiểm lan rộng khắp các tỉnh miền Bắc và hàng triệu con lợn buộc phải tiêu hủy. Giá thịt lợn trên thị trường tăng vọt gấp đôi, ảnh hưởng trực tiếp đến bữa ăn của người dân."
 vie_eco.20.a:0 "Tiêu hủy nghiêm ngặt và hỗ trợ tài chính cho người chăn nuôi"
 vie_eco.20.b:0 "Tiêu hủy hạn chế và giảm mức hỗ trợ ngân sách"

 ### vie_eco.22
 vie_eco.22.t:0 "Hoa Kỳ Gắn Nhãn Thao Túng Tiền Tệ"
 vie_eco.22.d:0 "Bộ Tài chính Hoa Kỳ đưa Việt Nam vào danh sách các quốc gia thao túng tiền tệ. Các doanh nghiệp xuất khẩu trong nước lo sốt vó trước nguy cơ bị áp thuế trừng phạt."
 vie_eco.22.a:0 "Tích cực đàm phán giải trình với phía Hoa Kỳ"
 vie_eco.22.b:0 "Bác bỏ cáo buộc vô căn cứ"

 ### vie_eco.23
 vie_eco.23.t:0 "Đứt Gãy Chuỗi Cung Ứng Bởi Biến Chủng Delta"
 vie_eco.23.d:0 "Các nhà máy tại khu vực kinh tế trọng điểm phía Nam buộc phải tạm dừng hoạt động do công nhân nhiễm bệnh hoặc bị phong tỏa. Các tập đoàn mua hàng toàn cầu bắt đầu dịch chuyển đơn hàng sang nước khác."
 vie_eco.23.a:0 "Áp dụng mô hình sản xuất '3 tại chỗ'"
 vie_eco.23.b:0 "Tạm đóng cửa toàn bộ nhà máy để chống dịch"

 ### vie_eco.24
 vie_eco.24.t:0 "Cú Sốc Giá Dầu Toàn Cầu"
 vie_eco.24.d:0 "Chiến sự tại châu Âu đẩy giá dầu thô thế giới leo lên đỉnh lịch sử. Chi phí xăng dầu tăng phi mã đánh thẳng vào ngành vận tải, nông nghiệp và hoạt động đánh bắt của ngư dân."
 vie_eco.24.a:0 "Xả Quỹ Bình ổn Giá Xăng dầu và giảm thuế phí"
 vie_eco.24.b:0 "Để giá xăng dầu vận động theo thị trường thế giới"

 ### vie_eco.26
 vie_eco.26.t:0 "Cuộc Tranh Luận Về Dự Án Bauxite Tây Nguyên"
 vie_eco.26.d:0 "Các nhà khoa học và tướng lĩnh lão thành gửi tâm thư tới ban lãnh đạo cảnh báo dự án khai thác bauxite tại Tây Nguyên tiềm ẩn nguy cơ môi trường bùn đỏ và an ninh quốc phòng lớn hơn lợi ích kinh tế."
 vie_eco.26.a:0 "Tiếp tục triển khai theo kế hoạch"
 vie_eco.26.b:0 "Tạm dừng dự án để đánh giá lại toàn diện"

 ### vie_eco.27
 vie_eco.27.t:0 "Bong Bóng Bất Động Sản Đổ Vỡ"
 vie_eco.27.d:0 "Nhiều doanh nghiệp địa ốc mất khả năng thanh toán trái phiếu và người mua nhà không nhận được nhà. Các ngân hàng thương mại ôm khối tài sản bảo đảm bằng bất động sản khó thanh khoản."
 vie_eco.27.a:0 "Giải cứu thị trường bằng cơ chế gia hạn nợ"
 vie_eco.27.b:0 "Chấp nhận để thị trường tự điều chỉnh giảm sâu"

 ### vie_eco.28
 vie_eco.28.t:0 "Biến Động Giá Nông Sản Thế Giới"
 vie_eco.28.d:0 "Giá gạo và cà phê thế giới tăng phi mã do thiếu hụt nguồn cung toàn cầu, mang lại doanh thu xuất khẩu vượt xa mọi kỳ vọng."
 vie_eco.28.a:0 "Tập trung bổ sung nguồn thu cho ngân sách nhà nước"
 vie_eco.28.b:0 "Có cơ chế hỗ trợ tối đa lợi nhuận cho người nông dân"

 ### vie_scs.9
 vie_scs.9.t:0 "Ký Kết Hiệp Định Phân Định Vịnh Bắc Bộ"
 vie_scs.9.d:0 "Hà Nội và Bắc Kinh ký kết hiệp định phân định ranh giới lãnh hải, vùng đặc quyền kinh tế và thềm lục địa trong Vịnh Bắc Bộ, đồng thời ký hiệp định hợp tác nghề cá. Thỏa thuận chấm dứt tranh chấp kéo dài ở vùng biển phía Bắc."
 vie_scs.9.a:0 "Hoan nghênh hiệp định lịch sử"

 ### vie_scs.10
 vie_scs.10.t:0 "Ngư Dân Bị Tàu Nước Ngoài Bắt Giữ"
 vie_scs.10.d:0 "Tàu chấp pháp nước ngoài bắt giữ tàu cá cùng các ngư dân Việt Nam tại vùng biển truyền thống gần các quần đảo. Thân nhân ngư dân khẩn thiết mong chính quyền can thiệp bảo hộ."
 vie_scs.10.a:0 "Trao công hàm phản đối kịch liệt qua kênh ngoại giao"
 vie_scs.10.b:0 "Cử lực lượng kiểm ngư và cảnh sát biển bảo vệ ngư dân"

 ### vie_scs.11
 vie_scs.11.t:0 "Đảo Nhân Tạo Mọc Lên Trên Biển Đông"
 vie_scs.11.d:0 "Ảnh vệ tinh cho thấy hoạt động bồi đắp đảo quy mô lớn chưa từng có trên các rạn san hô ở Quần đảo Trường Sa. Các bên tranh chấp đều đang ráo riết củng cố công trình."
 vie_scs.11.a:0 "Lên tiếng phản đối và viện dẫn luật pháp quốc tế"
 vie_scs.11.b:0 "Đẩy nhanh tiến độ bồi đắp củng cố các đảo của Việt Nam"

 ### vie_scs.12
 vie_scs.12.t:0 "Tàu Cá Việt Nam Bị Đâm Chìm"
 vie_scs.12.d:0 "Một tàu cá của ngư dân Việt Nam bị đâm chìm sau cú va chạm với tàu tuần tra cỡ lớn của nước ngoài. Rất may toàn bộ ngư dân đã được tàu bạn kịp thời ứng cứu an toàn."
 vie_scs.12.a:0 "Gửi công hàm phản đối và kiên quyết yêu cầu bồi thường"
 vie_scs.12.b:0 "Đưa vụ việc lên công luận và các diễn đàn quốc tế"

 ### vie_scs.14
 vie_scs.14.t:0 "Củng Cố Các Điểm Đảo Trường Sa"
 vie_scs.14.d:0 "Việc Việt Nam nâng cấp các công trình phòng thủ và âu tàu trên Quần đảo Trường Sa thu hút sự chú ý của các nước láng giềng. Một số nhìn nhận đây là bước đi tự vệ chính đáng, số khác lo ngại chạy đua quân sự."
 vie_scs.14.a:0 "Khẳng định đây là công trình phòng thủ tự vệ chính đáng"
 vie_scs.14.b:0 "Không bình luận thêm"

 ### vie_scs.15
 vie_scs.15.t:0 "Đối Đầu Trực Diện Trên Biển"
 vie_scs.15.d:0 "Tàu công vụ hai bên bám sát nhau gắt gao tại ngư trường truyền thống. Bất kỳ một sơ suất hay tính toán sai lầm nào cũng có thể châm ngòi cho một cuộc đụng độ nguy hiểm."
 vie_scs.15.a:0 "Chủ động cơ động hạ nhiệt căng thẳng"
 vie_scs.15.b:0 "Kiên quyết bám trụ giữ vững vị trí"

 ### vie_scs.18
 vie_scs.18.t:0 "Tiến Triển Về Bộ Quy Tắc Ứng Xử Biển Đông (COC)"
 vie_scs.18.d:0 "Các cuộc đàm phán giữa ASEAN và Trung Quốc đạt được một số bước tiến cụ thể về văn bản dự thảo Bộ Quy tắc Ứng xử ở Biển Đông. Dù chưa phải là văn bản mang tính ràng buộc pháp lý, đây vẫn là một cơ sở đối thoại quan trọng."
 vie_scs.18.a:0 "Hoan nghênh các tiến triển thực chất"

 ### vie_dip.6
 vie_dip.6.t:0 "Việt Nam Đảm Nhận Chức Chủ Tịch ASEAN"
 vie_dip.6.d:0 "Việt Nam chính thức đảm nhiệm cương vị Chủ tịch luân phiên của ASEAN. Đất nước sẽ chủ trì chương trình nghị sự và tổ chức các hội nghị cấp cao, với kỳ vọng dẫn dắt khối vượt qua một năm đầy thách thức."
 vie_dip.6.a:0 "Thúc đẩy sự đoàn kết nội khối ASEAN"
 vie_dip.6.b:0 "Đẩy mạnh tiến trình đàm phán COC về Biển Đông"

 ### vie_dip.7
 vie_dip.7.t:0 "Bỏ Phiếu Ủy Viên Hội Đồng Bảo An LHQ"
 vie_dip.7.d:0 "Việt Nam ứng cử vào vị trí Ủy viên không thường trực Hội đồng Bảo an Liên Hợp Quốc. Phiên bỏ phiếu đang đến gần và phái đoàn ngoại giao đang tích cực vận động các nước thành viên."
 vie_dip.7.a:0 "Vận động ngoại giao quyết liệt"
 vie_dip.7.b:0 "Tự tin vào uy tín và vị thế quốc tế của đất nước"

 ### vie_dip.8
 vie_dip.8.t:0 "Tổng Thống Hoa Kỳ Đến Thăm Hà Nội"
 vie_dip.8.d:0 "Lần đầu tiên kể từ sau chiến tranh, một Tổng thống Hoa Kỳ tới thăm chính thức Hà Nội. Người dân đổ ra chật kín các tuyến phố đón chào, trong khi chính phủ hai bên lựa chọn ngôn từ ngoại giao hết sức cẩn trọng."
 vie_dip.8.a:0 "Nhiệt liệt chào mừng chuyến thăm lịch sử"
 vie_dip.8.b:0 "Tiếp đón theo đúng nghi thức ngoại giao chuẩn mực"

 ### vie_dip.9
 vie_dip.9.t:0 "Xác Lập Quan Hệ Đối Tác Toàn Diện Với Hoa Kỳ"
 vie_dip.9.d:0 "Hà Nội và Washington tuyên bố xác lập khuôn khổ quan hệ Đối tác Toàn diện. Đây không phải là liên minh quân sự mà là một bước tiến vượt bậc trong hợp tác kinh tế, giáo dục và an ninh."
 vie_dip.9.a:0 "Chính thức ký kết tuyên bố chung"

 ### vie_dip.10
 vie_dip.10.t:0 "Tàu Sân Bay Hoa Kỳ Thăm Cảng Đà Nẵng"
 vie_dip.10.d:0 "Tàu sân bay hải quân Hoa Kỳ thả neo ngoài khơi Đà Nẵng và các thủy thủ lên bờ giao lưu văn hóa tại thành phố. Bắc Kinh đang theo dõi sát sao sự kiện biểu tượng này."
 vie_dip.10.a:0 "Nồng nhiệt chào đón chuyến thăm"
 vie_dip.10.b:0 "Tổ chức chuyến thăm với quy mô chừng mực, kín đáo"

 ### vie_dip.11
 vie_dip.11.t:0 "Chiến Sự Bùng Phát Tại Châu Âu"
 vie_dip.11.d:0 "Quân đội Nga tiến vào lãnh thổ Ukraine. Đại hội đồng Liên Hợp Quốc triệu tập phiên bỏ phiếu và mọi quốc gia thành viên đều phải thể hiện rõ quan điểm của mình."
 vie_dip.11.a:0 "Bỏ phiếu trắng: Giữ vững nguyên tắc trung lập, không chọn bên"
 vie_dip.11.b:0 "Lên tiếng phản đối hành động quân sự"
 vie_dip.11.c:0 "Thể hiện sự cảm thông với Moskva"

 ### vie_dip.12
 vie_dip.12.t:0 "Lãnh Đạo Trung Quốc Thăm Chính Thức Hà Nội"
 vie_dip.12.d:0 "Nhà lãnh đạo Trung Quốc tới Hà Nội để hội đàm cấp cao. Phía Bắc Kinh đề xuất đưa cụm từ 'Cộng đồng chia sẻ tương lai' vào tuyên bố chung giữa hai nước."
 vie_dip.12.a:0 "Đồng thuận với câu chữ trong tuyên bố chung"
 vie_dip.12.b:0 "Tiếp đón trọng thị nhưng giữ khoảng cách ngoại giao chừng mực"

 ### vie_dip.13
 vie_dip.13.t:0 "Tổng Thống Nga Thăm Việt Nam"
 vie_dip.13.d:0 "Tổng thống Nga tới thăm chính thức Hà Nội. Moskva đề xuất mở rộng hợp tác kỹ thuật quân sự và thăm dò dầu khí, trong khi Washington theo dõi với thái độ dò xét."
 vie_dip.13.a:0 "Đón tiếp với nghi lễ trọng thể cao nhất"
 vie_dip.13.b:0 "Tổ chức đón tiếp chừng mực, thực chất"

 ### vie_dip.14
 vie_dip.14.t:0 "Mùa Khô Và Hệ Thống Thủy Điện Thượng Nguồn"
 vie_dip.14.d:0 "Dòng sông Mekong lại cạn trơ đáy trong mùa khô hạn, đồng bằng sông Cửu Long phải gánh chịu hậu quả từ các đập thủy điện tích nước ở thượng nguồn. Bà con nông dân khẩn thiết mong chính phủ lên tiếng."
 vie_dip.14.a:0 "Gia tăng sức ép ngoại giao lên các quốc gia thượng nguồn"
 vie_dip.14.b:0 "Chấp nhận thiệt hại và chủ động chuyển đổi mùa vụ"

 ### vie_dip.15
 vie_dip.15.t:0 "Đề Xuất Mua Sắm Vũ Khí Ưu Đãi"
 vie_dip.15.d:0 "Một đối tác nước ngoài đưa ra đề xuất cung cấp các tổ hợp vũ khí hiện đại với điều kiện tài chính rất ưu đãi. Việc mua sắm này sẽ gắn chặt lực lượng vũ trang của Việt Nam với đối tác đó trong nhiều năm tới."
 vie_dip.15.a:0 "Chấp thuận đề xuất mua sắm"
 vie_dip.15.b:0 "Lịch thiệp từ chối để đa dạng hóa nguồn cung"

 ### vie_dip.18

 ### vie_dip.19
 vie_dip.19.t:0 "Kiều Hối Và Dòng Vốn Kiều Bào"
 vie_dip.19.d:0 "Cộng đồng người Việt Nam ở nước ngoài gửi lượng lớn kiều hối và trực tiếp về nước đầu tư kinh doanh. Nhiều người bày tỏ nguyện vọng được tạo điều kiện thuận lợi hơn về quyền sở hữu nhà đất."
 vie_dip.19.a:0 "Nhiệt liệt chào đón dòng vốn đầu tư của kiều bào"

 ### vie_int.9
 vie_int.9.t:0 "Cường Quốc Đề Nghị Đặt Căn Cứ Quân Sự"
 vie_int.9.d:0 "Một cường quốc lớn đề xuất được đồn trú lực lượng quân sự trên lãnh thổ Việt Nam, đi kèm các cam kết viện trợ tài chính và bảo đảm an ninh quốc phòng."
 vie_int.9.a:0 "Kiên quyết từ chối: Nhất quán nguyên tắc không cho đặt căn cứ nước ngoài"
 vie_int.9.b:0 "Chấp thuận đề xuất đồn trú"

 ### vie_soc.8
 vie_soc.8.t:0 "Đăng Cai Đại Hội Thể Thao Khu Vực"
 vie_soc.8.d:0 "Việt Nam vinh dự đăng cai đại hội thể thao khu vực Đông Nam Á. Các khán đài chật kín khán giả, các vận động viên thi đấu hết mình vì màu cờ sắc áo và cả nước hân hoan dõi theo."
 vie_soc.8.a:0 "Tưng bừng ăn mừng chiến thắng"

 ### vie_soc.9
 vie_soc.9.t:0 "Siêu Bão Đổ Bộ"
 vie_soc.9.d:0 "Một trong những cơn bão khủng khiếp nhất trong lịch sử đang đổ bộ thẳng vào dải ven biển. Các địa phương đang hối hả sơ tán khẩn cấp hàng chục vạn người dân."
 vie_soc.9.a:0 "Huy động toàn bộ quân đội và lực lượng dự bị cứu hộ"
 vie_soc.9.b:0 "Để chính quyền các tỉnh chủ động phương châm '4 tại chỗ'"

 ### vie_soc.10
 vie_soc.10.t:0 "Chùm Ca Bệnh Tái Phát Tại Đà Nẵng"
 vie_soc.10.d:0 "Sau chuỗi ngày dài không ghi nhận ca nhiễm cộng đồng, virus corona bất ngờ tái xuất hiện tại một bệnh viện lớn ở thành phố miền Trung. Khách du lịch đang hối hả tìm cách rời thành phố."
 vie_soc.10.a:0 "Lập tức áp đặt giãn cách phong tỏa thành phố"
 vie_soc.10.b:0 "Chỉ tiến hành truy vết và khoanh vùng hẹp"

 ### vie_soc.11
 vie_soc.11.t:0 "Làn Sóng Dịch Biến Chủng Delta"
 vie_soc.11.d:0 "Số ca lây nhiễm tăng chóng mặt tại các khu công nghiệp và đô thị trọng điểm phía Nam. Hệ thống y tế đứng trước nguy cơ quá tải và làn sóng người lao động bắt đầu đổ về quê tránh dịch."
 vie_soc.11.a:0 "Áp dụng giãn cách xã hội nghiêm ngặt nhất"
 vie_soc.11.b:0 "Sớm chuyển sang trạng thái thích ứng an toàn với dịch bệnh"

 ### vie_soc.12
 vie_soc.12.t:0 "Chiến Lược Ngoại Giao Vắc-Xin"
 vie_soc.12.d:0 "Nguồn cung vắc-xin trên toàn cầu đang vô cùng khan hiếm. Việt Nam có thể dốc toàn lực cho chiến dịch ngoại giao vắc-xin ở nước ngoài hoặc đẩy mạnh tự nghiên cứu vắc-xin trong nước."
 vie_soc.12.a:0 "Triển khai chiến dịch ngoại giao vắc-xin toàn diện"
 vie_soc.12.b:0 "Tập trung tối đa nguồn lực phát triển vắc-xin nội địa"

 ### vie_soc.13
 vie_soc.13.t:0 "Mở Cửa Phục Hồi Kinh Tế"
 vie_soc.13.d:0 "Với tỷ lệ bao phủ vắc-xin cho người trưởng thành đạt mức rất cao, chính phủ chuẩn bị dỡ bỏ các hạn chế chống dịch. Doanh nghiệp nóng lòng mở lại sản xuất trong khi ngành y tế vẫn rất thận trọng."
 vie_soc.13.a:0 "Mở cửa phục hồi hoàn toàn"
 vie_soc.13.b:0 "Mở cửa thận trọng theo từng giai đoạn"

 ### vie_soc.15
 vie_soc.15.t:0 "Công Nhân Lãng Công Phản Đối Luật Bảo Hiểm"
 vie_soc.15.d:0 "Hàng vạn công nhân tại các khu chế xuất đã ngừng việc tập thể để phản đối quy định mới về điều kiện nhận bảo hiểm xã hội một lần. Lực lượng chức năng được đặt trong tình trạng ứng trực cao độ."
 vie_soc.15.a:0 "Lắng nghe nguyện vọng và sửa đổi điều khoản gây tranh cãi"
 vie_soc.15.b:0 "Giữ nguyên quy định của luật"

 ### vie_soc.16
 vie_soc.16.t:0 "Cuộc Tranh Cãi Về Cây Xanh Thủ Đô"
 vie_soc.16.d:0 "Người dân thủ đô phát hiện kế hoạch chặt hạ hàng ngàn cây xanh cổ thụ trên các tuyến phố nội đô. Những cuộc tụ tập bày tỏ ý kiến phản đối bắt đầu xuất hiện."
 vie_soc.16.a:0 "Dừng ngay việc chặt hạ và xử lý nghiêm cán bộ liên quan"
 vie_soc.16.b:0 "Tiếp tục thực hiện đề án theo kế hoạch"

 ### vie_soc.17
 vie_soc.17.t:0 "Vinh Quang Sân Cỏ Đưa Hàng Triệu Người Xuống Đường"
 vie_soc.17.d:0 "Đội tuyển bóng đá quốc gia giành chiến thắng nghẹt thở trong trận chung kết khu vực. Hàng triệu người dân hò reo 'đi bão' ăn mừng trên khắp các ngả đường, rợp bóng cờ đỏ sao vàng."
 vie_soc.17.a:0 "Chào đón những người hùng sân cỏ như các vị anh hùng"
 vie_soc.17.b:0 "Ăn mừng chừng mực và bảo đảm trật tự an toàn giao thông"

 ### vie_soc.19
 vie_soc.19.t:0 "Vấn Nạn Chảy Máu Chất Xám"
 vie_soc.19.d:0 "Khảo sát cho thấy phần lớn sinh viên tốt nghiệp xuất sắc lựa chọn ở lại nước ngoài làm việc và rất ít người trở về. Các trường đại học kiến nghị cần có thêm kinh phí đãi ngộ và tự chủ học thuật."
 vie_soc.19.a:0 "Tăng nguồn vốn đầu tư và cơ chế tự chủ cho các trường đại học"
 vie_soc.19.b:0 "Chấp nhận quy luật dịch chuyển nhân lực tự nhiên"

 ### vie_alt.40
 vie_alt.40.t:0 "Bài Học Từ Liên Bang Nam Tư"
 vie_alt.40.d:0 "Các nhà phân tích nhắc nhở rằng đường lối không liên kết từng có tiền lệ tại một liên bang ở châu Âu bị tan rã trong máu lửa. Họ cảnh báo rằng phân quyền quá trớn có thể xé nát tính thống nhất của nhà nước."
 vie_alt.40.a:0 "Củng cố vững chắc quyền lực tập trung của trung ương"
 vie_alt.40.b:0 "Tin tưởng vào quyền tự quản của các hội đồng địa phương"

 ### vie_news.1
 vie_news.1.t:0 "Việt Nam Chính Thức Gia Nhập WTO"
 vie_news.1.d:0 "Sau hơn một thập kỷ đàm phán kiên trì, Việt Nam đã chính thức trở thành thành viên thứ 150 của Tổ chức Thương mại Thế giới. Giới chức tại Hà Nội khẳng định việc gia nhập WTO sẽ mở ra các thị trường mới và thu hút mạnh mẽ các dòng vốn đầu tư quốc tế."
 vie_news.1.a:0 "Ghi nhận"

 ### vie_news.2
 vie_news.2.t:0 "Tổng Bí Thư Mới của Đảng Cộng Sản Việt Nam"
 vie_news.2.d:0 "Đảng Cộng sản Việt Nam đã bầu ra Tổng Bí thư mới tại phiên bế mạc Đại hội đại biểu toàn quốc. Các nhà quan sát quốc tế nhận định chính sách kinh tế và đường lối đối ngoại sẽ tiếp tục duy trì tính nhất quán, ổn định."
 vie_news.2.a:0 "Ghi nhận"

 ### vie_news.3
 vie_news.3.t:0 "Khủng Hoảng Giàn Khoan Bùng Nổ Trên Biển Đông"
 vie_news.3.d:0 "Một giàn khoan dầu khí của Trung Quốc đã được kéo vào vùng biển thuộc chủ quyền và quyền tài phán của Việt Nam. Tàu thuyền hai nước đang đối đầu căng thẳng trên biển và các cuộc tuần hành đã bùng phát tại nhiều thành phố của Việt Nam."
 vie_news.3.a:0 "Ghi nhận"

 ### vie_news.4
 vie_news.4.t:0 "Hà Nội Tuyên Bố Con Đường Tự Chủ Chiến Lược"
 vie_news.4.d:0 "Ban lãnh đạo Việt Nam tuyên bố chính sách tự chủ chiến lược toàn diện, khẳng định đất nước sẽ không tham gia bất kỳ phe phái nào và không phụ thuộc vào bất kỳ một cường quốc duy nhất nào."
 vie_news.4.a:0 "Ghi nhận"

 ### vie_news.5
 vie_news.5.t:0 "Việt Nam Thành Lập Các Đặc Khu Kinh Tế"
 vie_news.5.d:0 "Luật thành lập các đặc khu kinh tế với thời hạn cho thuê đất kéo dài và tòa án riêng biệt đã được thông qua. Giới đầu tư quốc tế hoan nghênh nồng nhiệt, trong khi các ý kiến phản biện cảnh báo nguy cơ suy giảm chủ quyền lãnh thổ."
 vie_news.5.a:0 "Ghi nhận"


 ### vie_news.11
 vie_news.11.t:0 "Giao Tranh Ác Liệt Tại Quần Đảo Hoàng Sa"
 vie_news.11.d:0 "Lực lượng vũ trang Việt Nam và Trung Quốc đang giao chiến dữ dội tại khu vực Quần đảo Hoàng Sa. Tổng Thư ký Liên Hợp Quốc kêu gọi các bên lập tức ngừng bắn và thể hiện sự kiềm chế tối đa."
 vie_news.11.a:0 "Ghi nhận"

 ### vie_news.12
 vie_news.12.t:0 "Việt Nam Vươn Lên Thành Quốc Gia Phát Triển"
 vie_news.12.d:0 "Tròn một trăm năm sau ngày độc lập, Việt Nam đã chính thức gia nhập hàng ngũ các quốc gia phát triển có thu nhập cao. Nền kinh tế Việt Nam hiện nằm trong số những nền kinh tế năng động và thịnh vượng nhất châu Á."
 vie_news.12.a:0 "Ghi nhận"

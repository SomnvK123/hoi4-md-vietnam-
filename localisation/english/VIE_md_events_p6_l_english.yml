l_english:

 ### vie_eco.19
 vie_eco.19.t:0 "Chiến tranh Thương mại Giữa các Cường quốc"
 vie_eco.19.d:0 "Thuế quan trả đũa giữa Hoa Kỳ và Trung Quốc đang thúc đẩy các nhà sản xuất dịch chuyển một phần chuỗi sản xuất. Việt Nam nằm trong số những điểm đến hàng đầu mà họ nhắm tới. Washington đưa ra lời cảnh báo rằng hàng hóa không được chỉ mượn đường trung chuyển, trong khi Bắc Kinh cũng chăm chú theo dõi xem ai đang hưởng lợi từ các đơn hàng này."
 vie_eco.19.a:0 "Chào đón làn sóng dịch chuyển nhà máy"
 vie_eco.19.b:0 "Siết chặt kiểm tra nguồn gốc xuất xứ hàng tạm nhập tái xuất"

 ### vie_eco.21
 vie_eco.21.t:0 "Bùng nổ Điện mặt trời Vượt tải Lưới điện"
 vie_eco.21.d:0 "Hàng ngàn dự án điện mặt trời mới hòa vào hệ thống lưới điện vốn chưa được thiết kế để chịu tải lượng công suất lớn đến vậy. Tại các tỉnh miền Trung, đơn vị vận hành lưới điện đã bắt đầu phải cắt giảm công suất phát vào giữa trưa, khiến các nhà đầu tư vô cùng bức xúc."
 vie_eco.21.a:0 "Cắt giảm công suất phát điện mặt trời"
 vie_eco.21.b:0 "Cấp kinh phí nâng cấp khẩn cấp hệ thống lưới truyền tải"

 ### vie_eco.25
 vie_eco.25.t:0 "Cắt điện Luân phiên tại Miền Bắc"
 vie_eco.25.d:0 "Mùa hè nắng nóng gay gắt và khô hạn đã làm sụt giảm nghiêm trọng sản lượng của các hồ thủy điện trong khi nhu cầu tiêu thụ điện tăng vọt. Các nhà máy ở miền Bắc liên tục mất điện hàng giờ liền, khiến các nhà đầu tư nước ngoài lo lắng về độ tin cậy của hệ thống năng lượng."
 vie_eco.25.a:0 "Cắt điện luân phiên giữa các khu vực"
 vie_eco.25.b:0 "Nhập khẩu điện khẩn cấp với giá cao"
 vie_eco.25.c:0 "Huy động tối đa công suất các nhà máy nhiệt điện than"

 ### vie_scs.13
 vie_scs.13.t:0 "Luật Hải cảnh của Trung Quốc"
 vie_scs.13.d:0 "Đạo luật mới của Bắc Kinh cho phép lực lượng hải cảnh sử dụng vũ lực đối với tàu thuyền nước ngoài trong các vùng biển mà họ tự tuyên bố chủ quyền, bao gồm cả những vùng biển thuộc chủ quyền và quyền tài phán của Việt Nam. Ngư dân và các nhà phân tích lo ngại sâu sắc về nguy cơ bùng phát xung đột trong các vụ chạm trán sắp tới."
 vie_scs.13.a:0 "Trao công hàm phản đối chính thức và tiếp tục bám biển"
 vie_scs.13.b:0 "Tăng cường năng lực lực lượng Cảnh sát biển để đáp trả"

 ### vie_dip.5
 vie_dip.5.t:0 "Hội nghị Thượng đỉnh APEC tại Hà Nội"
 vie_dip.5.d:0 "Lãnh đạo các nền kinh tế khu vực châu Á - Thái Bình Dương sẽ hội tụ tại thủ đô Hà Nội. Đây là hội nghị ngoại giao đa phương lớn nhất mà đất nước từng đăng cai tổ chức, và chính phủ mong muốn tận dụng cơ hội này để quảng bá hình ảnh đẹp nhất của đất nước ra thế giới."
 vie_dip.5.a:0 "Tổ chức trang trọng, hoành tráng"
 vie_dip.5.b:0 "Tổ chức tinh gọn, tiết kiệm"

 ### vie_dip.17
 vie_dip.17.t:0 "Ai Sẽ Mua Đất Hiếm?"
 vie_dip.17.d:0 "Những lô quặng đất hiếm đầu tiên đã sẵn sàng xuất xưởng. Washington và các đối tác mong muốn tìm kiếm một nguồn cung ứng không phụ thuộc vào Trung Quốc. Bắc Kinh, quốc gia dẫn đầu thế giới về công nghệ tinh chế, đề nghị bao tiêu toàn bộ sản lượng. Con đường thứ ba là kiên nhẫn tự xây dựng các tổ hợp tinh chế trong nước."
 vie_dip.17.a:0 "Bán cho Hoa Kỳ và các đối tác chiến lược"
 vie_dip.17.b:0 "Bán cho Trung Quốc"
 vie_dip.17.c:0 "Từng bước phát triển công nghệ tinh chế trong nước"

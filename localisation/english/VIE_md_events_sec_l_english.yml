l_english:

 ### vie_sec.0
 vie_sec.0.t:0 "Tấm khiên nhận quyền"
 vie_sec.0.d:0 "Cuộc chuyển giao đã hoàn tất. Bộ máy an ninh công bố nắm quyền chỉ đạo trực tiếp, và các cơ quan công quyền nhận lệnh từ trung tâm mới. Trật tự được vãn hồi, nhưng không ai còn nghi ngờ ai đang cầm hồ sơ."
 vie_sec.0.a:0 "Trật tự là trên hết"

 ### vie_sec.2
 vie_sec.2.t:0 "Thế hệ Z \"Đỏ\""
 vie_sec.2.d:0 "Câu lạc bộ an ninh mạng học đường ra mắt ở hàng trăm trường đại học. Sinh viên tự nguyện báo cáo những luận điệu thù địch trên mạng xã hội và coi đó là niềm tự hào."
 vie_sec.2.a:0 "Thế hệ mới đã trưởng thành"

 ### vie_sec.10
 vie_sec.10.t:0 "Cây tre có gai"
 vie_sec.10.d:0 "Hà Nội công bố học thuyết đối ngoại mới: răn đe thay cho cân bằng. Các thủ đô lớn đọc kỹ từng câu và bắt đầu tính lại về một nước láng giềng từng nổi tiếng mềm dẻo."
 vie_sec.10.a:0 "Không ai chết thay cho ta"

 ### vie_sec.11
 vie_sec.11.t:0 "Tổng động viên sườn Tây"
 vie_sec.11.d:0 "Các sư đoàn được điều về biên giới Lào và Campuchia. Vientiane và Phnom Penh gửi công hàm hỏi về ý định, nhưng câu trả lời chỉ là tiếng quân hành."
 vie_sec.11.a:0 "Vùng đệm phải được bảo đảm"

 ### vie_sec.12
 vie_sec.12.t:0 "Pháo đài hoàn thành"
 vie_sec.12.d:0 "Radar, đường băng và các ụ pháo trên Trường Sa đã vào vị trí. Các nước trong khu vực lên tiếng quan ngại, còn tàu tuần tra nước ngoài giữ khoảng cách xa hơn."
 vie_sec.12.a:0 "Tuyến phòng thủ chiều sâu"

l_english:
 RULE_VIE_ALT_HISTORY:0 "Việt Nam: Lịch sử Giả định"
 RULE_VIE_ALT_HISTORY_PLAUSIBLE:0 "Hợp lý"
 RULE_VIE_ALT_HISTORY_PLAUSIBLE_DESC:0 "Các sự kiện lịch sử của Việt Nam diễn ra đúng thời điểm. Các con đường thay thế (chế độ mới, tự chủ, đặc khu, sụp đổ) vẫn tồn tại nhưng chỉ mở ra thông qua các bước ngoặt lịch sử và dưới những điều kiện khắt khe. AI phần lớn đi theo tiến trình lịch sử."
 RULE_VIE_ALT_HISTORY_HISTORICAL:0 "Lịch sử"
 RULE_VIE_ALT_HISTORY_HISTORICAL_DESC:0 "AI không bao giờ chọn các phương án thay thế tại bất kỳ bước ngoặt lịch sử nào của Việt Nam. Người chơi vẫn có thể tự chọn các nhánh này."
 RULE_VIE_ALT_HISTORY_FREE:0 "Tự do"
 RULE_VIE_ALT_HISTORY_FREE_DESC:0 "Các điều kiện để mở ra các con đường thay thế được nới lỏng (ngưỡng ổn định và cán cân chính trị), tình trạng sụp đổ diễn ra sớm hơn và AI sẽ lựa chọn các phương án rẽ nhánh thường xuyên hơn rất nhiều."
 RULE_VIE_ALT_PROCUREMENT:0 "Việt Nam: Mua sắm quốc phòng giả định"
 VIE_ALT_OFF_TEXT:0 "Chỉ lịch sử"
 VIE_ALT_OFF_DESC:0 "Chỉ các hợp đồng mua sắm lục quân có hồ sơ công khai mới diễn ra: T-54/55 Phần Lan, T-72 Ba Lan (đàm phán rồi hủy), mẫu thử T-54M3 của Israel, Igla kèm quyền sản xuất, license Galil ACE, T-90S/SK và K9A1 Thunder."
 VIE_ALT_ON_TEXT:0 "Kèm lịch sử giả định"
 VIE_ALT_ON_DESC:0 "Bật thêm ba chuỗi mua sắm chưa từng xảy ra: thử nghiệm BMP-3 của Nga (2010), biên chế TOS-1A (2016) và đàm phán CAESAR của Pháp (2015). Chuỗi CAESAR thất bại sẽ mở nghiên cứu chuẩn 155mm, giúp chuỗi K9A1 bắt đầu sớm hơn hai năm."

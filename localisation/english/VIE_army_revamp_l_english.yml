l_english:
 VIE_military_streamlining:0 "Tinh gọn biên chế quân đội"
 VIE_military_streamlining_desc:0 "Quân đội Nhân dân Việt Nam tiến hành tinh giản biên chế, tổ chức lại lực lượng theo hướng tinh, gọn, mạnh, giảm thiểu các khâu trung gian và nâng cao khả năng sẵn sàng chiến đấu."
 VIE_mobile_doctrine_spirit:0 "Học thuyết Cụm Cơ động Cao tốc"
 VIE_mobile_doctrine_spirit_desc:0 "Tập trung xây dựng các mũi đột kích thọc sâu cơ giới hóa, tăng cường khả năng cơ động phản ứng nhanh trên mọi địa hình chiến trường."
 VIE_regular_corps_spirit:0 "Quân đoàn Chủ lực Tinh nhuệ (Quân đoàn 12, 34)"
 VIE_regular_corps_spirit_desc:0 "Thành lập và hiện đại hóa các quân đoàn chủ lực cơ động chiến lược, đóng vai trò 'quả đấm thép' quyết định cục diện trên chiến trường bảo vệ Tổ quốc."
 VIE_depth_defence_spirit:0 "Thế trận Phòng thủ Chiều sâu Toàn dân"
 VIE_depth_defence_spirit_desc:0 "Kết hợp chặt chẽ giữa tác chiến của bộ đội chủ lực, bộ đội địa phương và dân quân tự vệ, biến mỗi làng xã, khu phố thành một pháo đài kiên cố."
 VIE_cyber_command_86:0 "Bộ Tư lệnh 86 - Tác chiến Không gian mạng"
 VIE_cyber_command_86_desc:0 "Lực lượng tác chiến không gian mạng và điện tử tinh nhuệ, bảo vệ vững chắc chủ quyền không gian mạng quốc gia và hỗ trợ hệ thống chỉ huy số toàn quân."
 VIE_vpa_modern_army_power:0 "Lục quân Nhân dân Hiện đại 2030"
 VIE_vpa_modern_army_power_desc:0 "Lục quân Nhân dân Việt Nam hoàn thành mục tiêu hiện đại hóa toàn diện, tinh nhuệ, chính quy, sẵn sàng bảo vệ vững chắc độc lập, chủ quyền và toàn vẹn lãnh thổ."

 VIE_lf_n2_tech:0 "Hiện đại hóa phương tiện hậu cần quân sự"
 VIE_lf_n3_tech:0 "Đào tạo sĩ quan và học thuyết bộ binh"
 VIE_lf_bb1_tech:0 "Phát triển súng trường bộ binh thế hệ mới"
 VIE_lf_tg1_tech:0 "Nâng cấp xe tăng thiết giáp chủ lực"
 VIE_lf_pb1_tech:0 "Hiện đại hóa hỏa lực pháo binh"
 VIE_lf_hd_tech:0 "Học thuyết tác chiến hiệp đồng binh chủng"
 VIE_lf_l1_tech:0 "Tác chiến đô thị và vũ khí bộ binh đặc nhiệm"
 VIE_lf_a1_tech:0 "Hệ thống phòng không lục quân tầm thấp"
 VIE_lf_y1_tech:0 "Hệ thống máy bay không người lái trinh sát"
 VIE_lf_mod_tech_1:0 "Nghiên cứu vũ khí bộ binh chuyên sâu"
 VIE_lf_mod_tech_2:0 "Hiện đại hóa phương tiện cơ giới lục quân"
 VIE_lf_cr3_tech:0 "Chỉ huy số hiệp đồng và học thuyết Lục quân 2030"


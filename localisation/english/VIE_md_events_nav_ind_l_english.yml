l_english:

 ### Truc 2 hai quan (CNQP): focus
 VIE_naval_defence_law:0 "Thể chế Quốc phòng Hải quân"
 VIE_naval_defence_law_desc:0 "Hải quân Nhân dân cần một khung thể chế riêng cho đóng tàu và bảo đảm kỹ thuật, tách khỏi các quyết định hành chính nội bộ của quân đội.\n\nĐây là bước đầu của chuỗi công nghiệp quốc phòng hải quân: có thể chế thì mới có xưởng, có xưởng thì mới có năng lực."
 VIE_ba_son_shipyards:0 "Xưởng đóng tàu Ba Son"
 VIE_ba_son_shipyards_desc:0 "Ba Son ở Thành phố Hồ Chí Minh là xưởng đóng tàu quân sự lớn nhất của Hải quân. Hiện đại hóa bến, ụ và nhân lực để xưởng có thể nhận hồ sơ kỹ thuật nước ngoài và đóng tàu chiến theo giấy phép.\n\nChọn hướng phát triển xưởng: đóng mới trước, bảo dưỡng trước, hay cân bằng cả hai."
 VIE_naval_mro:0 "Bảo dưỡng Hải quân trong nước"
 VIE_naval_mro_desc:0 "Khi hạm đội đã có đủ tàu, bảo dưỡng và sửa chữa phải làm được trong nước. Tàu ngầm được hỗ trợ từ cơ sở ở Cam Ranh cùng chuyên gia Nga, tàu mặt nước từ các xưởng ven biển."
 VIE_small_combatant_construction:0 "Đóng tàu chiến cỡ nhỏ"
 VIE_small_combatant_construction_desc:0 "Từ kinh nghiệm lắp ráp tàu tên lửa nhanh theo giấy phép, các xưởng trong nước tiến tới tự đóng tàu tuần tra, tàu tên lửa và hộ vệ nhỏ.\n\nChương trình này cấp năng lực, kinh nghiệm và giảm chi phí; bản thân tàu vẫn đến từ các hợp đồng riêng."
 VIE_naval_systems_integration:0 "Tích hợp hệ thống hải quân"
 VIE_naval_systems_integration_desc:0 "Thân tàu chỉ là một phần. Cảm biến, liên lạc, vũ khí và hệ thống điều khiển hỏa lực phải được tích hợp thành một khối thống nhất, dựa trên điện tử, C4ISR hoặc tên lửa do ngành khác cung cấp."
 VIE_naval_defence_2030:0 "Công nghiệp Quốc phòng Hải quân 2030"
 VIE_naval_defence_2030_desc:0 "Mục tiêu dài hạn: một nền công nghiệp tàu chiến có thể tự đóng, tự bảo dưỡng và từng bước tự tích hợp hệ thống. Không có tàu miễn phí ở cuối con đường này; phần thưởng là năng lực."

 ### Tooltip điều kiện
 VIE_nav_hulls_4_tt:0 "Đã nhận ít nhất §Y4§! thân tàu chủ lực từ các chương trình mua sắm"
 VIE_nav_ext_source_tt:0 "Có ít nhất một nguồn năng lực: §Yđiện tử§!, §YC4ISR§! hoặc §Ytên lửa hải quân§!"
 ### Decision 1 (Ba Son), chuỗi event, thông báo
 VIE_naval_industry_category:0 "Công nghiệp Quốc phòng Hải quân"
 VIE_naval_industry_category_desc:0 "Các chương trình xây dựng năng lực cho ngành đóng tàu và bảo đảm kỹ thuật hải quân: xưởng Ba Son, bảo dưỡng trong nước, đóng tàu cỡ nhỏ, tích hợp hệ thống và nền công nghiệp trưởng thành.\n\n§YChương trình đang chạy:§! [?VIE_var_naval_program_active|0] / 2\n§gTối đa hai chương trình cùng lúc. Không chương trình nào cấp tàu; phần thưởng là năng lực, kinh nghiệm và chi phí thấp hơn.§!\n\n§YKinh nghiệm:§! đóng tàu [?VIE_var_shipbuilding_exp|0] · bảo dưỡng [?VIE_var_mro_exp|0] · tích hợp [?VIE_var_integration_exp|0] (tối đa 100)\n§gChương trình 2030 cần đóng tàu từ 30 và bảo dưỡng từ 15.§!"
 VIE_nav_d1_ba_son:0 "Phát triển năng lực xưởng Ba Son"
 VIE_nav_d1_ba_son_desc:0 "Đầu tư vào ụ, bến và nhân lực của Ba Son để xưởng nhận được hồ sơ kỹ thuật nước ngoài và đóng tàu chiến theo giấy phép.\n\nXưởng dùng được từ khoảng 40% tiến độ, nên các chương trình đóng tàu trong nước không phải chờ đến khi hoàn tất."
 VIE_nav_slot_tt:0 "Đang chạy ít hơn §Y2§! chương trình công nghiệp quốc phòng hải quân"
 VIE_nav_orient_tt:0 "Đã chọn định hướng phát triển Ba Son (sau khi hoàn thành §YXưởng đóng tàu Ba Son§!)"
 VIE_nav_prog_ba_son:0 "Chương trình Ba Son đang thực hiện"
 VIE_nav_prog_ba_son_desc:0 "Xưởng Ba Son đang được mở rộng. Hoàn tất khi thời hạn kết thúc."
 vie_nav_ind.1.t:0 "Định hướng của Ba Son"
 vie_nav_ind.1.d:0 "Ba Son có thể tập trung trước vào đóng mới hoặc vào bảo dưỡng. Phát triển cân bằng cả hai mảng cùng lúc làm chi phí chương trình Ba Son cao hơn 15%; thời gian thi công không đổi."
 vie_nav_ind.1.a:0 "Đóng tàu trước."
 vie_nav_ind.1.b:0 "Bảo dưỡng trước."
 vie_nav_ind.1.c:0 "Phát triển cân bằng cả hai."
 vie_nav_ind.2.t:0 "Mức đầu tư cho Ba Son"
 vie_nav_ind.2.d:0 "Mức đầu tư quyết định số ụ đóng tàu mới, thời gian thi công và phần việc ngân sách phải gánh. Ba Son dùng được từ khoảng 40% tiến độ ở mọi mức."
 vie_nav_ind.2.a:0 "Cơ bản: 12 tháng, một ụ đóng tàu."
 vie_nav_ind.2.b:0 "Mở rộng: 18 tháng, một ụ cùng đầu tư thêm."
 vie_nav_ind.2.c:0 "Trọng điểm: 24 tháng, hai ụ đóng tàu."
 vie_nav_ind.60.t:0 "Ba Son đã dùng được"
 vie_nav_ind.60.d:0 "Các hạng mục đầu tiên đã xong. Xưởng đủ năng lực tiếp nhận hồ sơ kỹ thuật và giấy phép đóng tàu, dù chương trình mở rộng vẫn tiếp tục."
 vie_nav_ind.60.a:0 "Tốt lắm."
 vie_nav_ind.61.t:0 "Hoàn tất mở rộng Ba Son"
 vie_nav_ind.61.d:0 "Chương trình mở rộng đã xong: ụ đóng tàu mới đi vào hoạt động, đội ngũ kỹ sư và công nhân được bổ sung."
 vie_nav_ind.61.a:0 "Ghi nhận."
 ### Decision 2 (MRO) và Decision 3 (tàu chiến đấu cỡ nhỏ)
 VIE_nav_d2_mro:0 "Nội địa hóa bảo dưỡng hải quân"
 VIE_nav_d2_mro_desc:0 "Xây năng lực bảo dưỡng và sửa chữa tàu trong nước. Tàu ngầm Kilo được hỗ trợ từ cơ sở ở Cam Ranh cùng chuyên gia Nga; tàu mặt nước từ các xưởng ven biển.\n\nChọn trọng tâm, nguồn hỗ trợ và mức nội địa hóa. Mức cao hơn cần xưởng đã trưởng thành."
 VIE_nav_d3_small:0 "Chương trình đóng tàu chiến đấu cỡ nhỏ"
 VIE_nav_d3_small_desc:0 "Từ kinh nghiệm lắp ráp tàu tên lửa theo giấy phép, các xưởng trong nước tiến tới tự đóng tàu tuần tra, tàu tên lửa và hộ vệ nhỏ.\n\nChương trình không cấp tàu. Nó cấp năng lực, kinh nghiệm và hệ số chi phí thấp hơn cho các hợp đồng đóng tàu nhỏ về sau."
 VIE_nav_yard_tt:0 "Xưởng Ba Son đã dùng được (đạt khoảng 40% tiến độ của chương trình Ba Son)"
 VIE_nav_hull_source_tt:0 "Đã nhận ít nhất một §Ytàu ngầm§! hoặc một §Ytàu mặt nước§! từ các chương trình mua sắm"
 VIE_nav_prog_mro:0 "Chương trình bảo dưỡng hải quân đang thực hiện"
 VIE_nav_prog_mro_desc:0 "Năng lực bảo dưỡng trong nước đang được xây dựng. Hoàn tất khi thời hạn kết thúc."
 VIE_nav_prog_small:0 "Chương trình tàu chiến đấu cỡ nhỏ đang thực hiện"
 VIE_nav_prog_small_desc:0 "Năng lực đóng tàu chiến đấu cỡ nhỏ trong nước đang được xây dựng. Hoàn tất khi thời hạn kết thúc."
 vie_nav_ind.10.t:0 "Bảo dưỡng: trọng tâm"
 vie_nav_ind.10.d:0 "Tàu ngầm và tàu mặt nước cần những cơ sở và đội ngũ khác nhau. Có thể đầu tư cho một loại hoặc cho cả hạm đội với chi phí cao hơn 30%."
 vie_nav_ind.10.a:0 "Tàu ngầm."
 vie_nav_ind.10.b:0 "Tàu mặt nước."
 vie_nav_ind.10.c:0 "Toàn hạm đội."
 vie_nav_ind.11.t:0 "Bảo dưỡng: nguồn hỗ trợ"
 vie_nav_ind.11.d:0 "Hợp tác với Nga rẻ hơn và nhanh hơn, nhưng gắn năng lực bảo dưỡng với một nhà cung cấp. Tự chủ tốn kém và chậm hơn, nhưng không phụ thuộc ai."
 vie_nav_ind.11.a:0 "Hợp tác với Nga."
 vie_nav_ind.11.b:0 "Tự chủ."
 vie_nav_ind.12.t:0 "Bảo dưỡng: mức nội địa hóa"
 vie_nav_ind.12.d:0 "Mức nội địa hóa quyết định thời gian, chi phí và kinh nghiệm thu được. Mức Chuyên sâu đòi hỏi xưởng Ba Son đã hoàn tất chương trình mở rộng. Mức Tự chủ cao đòi thêm: chương trình Ba Son ở mức Mở rộng trở lên, hoặc chương trình tàu chiến đấu cỡ nhỏ đã xong."
 vie_nav_ind.12.a:0 "Cơ bản: 12 tháng."
 vie_nav_ind.12.b:0 "Chuyên sâu: 18 tháng."
 vie_nav_ind.12.c:0 "Tự chủ cao: 24 tháng."
 vie_nav_ind.62.t:0 "Hoàn tất nội địa hóa bảo dưỡng"
 vie_nav_ind.62.d:0 "Năng lực bảo dưỡng tàu trong nước đã đi vào hoạt động, kinh nghiệm của đội ngũ kỹ thuật tăng lên."
 vie_nav_ind.62.a:0 "Ghi nhận."
 vie_nav_ind.20.t:0 "Tàu cỡ nhỏ: chuyên hóa"
 vie_nav_ind.20.d:0 "Chương trình tập trung vào một loại tàu: tuần tra ven bờ, tàu tên lửa tốc độ cao, hoặc đa dụng. Mỗi loại giảm chi phí đóng tàu nhỏ về sau ở mức khác nhau."
 vie_nav_ind.20.a:0 "Tàu tuần tra."
 vie_nav_ind.20.b:0 "Tàu tốc độ cao."
 vie_nav_ind.20.c:0 "Tàu đa dụng."
 vie_nav_ind.21.t:0 "Tàu cỡ nhỏ: mức sản xuất"
 vie_nav_ind.21.d:0 "Từ lô thử nghiệm đến chuyển giao công nghệ hoàn chỉnh. Mức cao nhất chỉ mở khi chương trình đóng tàu Molniya trong nước đã khởi đóng."
 vie_nav_ind.21.a:0 "Lô thử nghiệm: 12 tháng."
 vie_nav_ind.21.b:0 "Sản xuất hàng loạt: 18 tháng."
 vie_nav_ind.21.c:0 "Chuyển giao công nghệ: 24 tháng."
 vie_nav_ind.63.t:0 "Hoàn tất chương trình tàu cỡ nhỏ"
 vie_nav_ind.63.d:0 "Năng lực đóng tàu chiến đấu cỡ nhỏ trong nước đã sẵn sàng. Chi phí cho các hợp đồng đóng tàu nhỏ về sau thấp hơn."
 vie_nav_ind.63.a:0 "Ghi nhận."
 ### Decision 4 (tích hợp hệ thống) và Decision 5 (công nghiệp hải quân 2030)
 VIE_nav_d4_integration:0 "Tích hợp hệ thống hải quân"
 VIE_nav_d4_integration_desc:0 "Tích hợp cảm biến, liên lạc, vũ khí và hệ thống điều khiển hỏa lực thành một khối thống nhất. Mỗi lĩnh vực cần đúng nguồn năng lực từ ngành khác: điện tử, C4ISR hoặc tên lửa hải quân."
 VIE_nav_d5_2030:0 "Công nghiệp Quốc phòng Hải quân 2030"
 VIE_nav_d5_2030_desc:0 "Đưa nền công nghiệp tàu chiến lên mức trưởng thành: tự đóng, tự bảo dưỡng và từng bước tự tích hợp hệ thống. Không có tàu miễn phí; phần thưởng là năng lực công nghiệp."
 VIE_nav_d1_done_tt:0 "Chương trình mở rộng xưởng Ba Son đã §Yhoàn tất§!"
 VIE_nav_exp_ship_tt:0 "Kinh nghiệm đóng tàu từ §Y30§! trở lên (hiện tại §Y[?VIE_var_shipbuilding_exp|0]§!)"
 VIE_nav_exp_mro_tt:0 "Kinh nghiệm bảo dưỡng từ §Y15§! trở lên (hiện tại §Y[?VIE_var_mro_exp|0]§!)"
 VIE_nav_prog_integration:0 "Chương trình tích hợp hệ thống đang thực hiện"
 VIE_nav_prog_integration_desc:0 "Năng lực tích hợp hệ thống đang được xây dựng. Hoàn tất khi thời hạn kết thúc."
 VIE_nav_prog_2030:0 "Chương trình công nghiệp hải quân 2030 đang thực hiện"
 VIE_nav_prog_2030_desc:0 "Nền công nghiệp tàu chiến đang được nâng lên mức trưởng thành. Hoàn tất khi thời hạn kết thúc."
 VIE_nav_mature_industry_idea:0 "Công nghiệp tàu chiến trưởng thành"
 VIE_nav_mature_industry_idea_desc:0 "Việt Nam đã có nền công nghiệp tự đóng, tự bảo dưỡng và từng bước tự tích hợp hệ thống cho tàu chiến."
 vie_nav_ind.30.t:0 "Tích hợp hệ thống: lĩnh vực"
 vie_nav_ind.30.d:0 "Điện tử, vũ khí hay cả hệ thống. Mỗi lĩnh vực chỉ mở khi ta có nguồn năng lực tương ứng từ các ngành khác; toàn hệ thống đòi cả hai nguồn và tốn thêm một nửa chi phí."
 vie_nav_ind.30.a:0 "Điện tử: cảm biến, liên lạc, hỏa lực."
 vie_nav_ind.30.b:0 "Vũ khí và điều khiển hỏa lực."
 vie_nav_ind.30.c:0 "Toàn bộ hệ thống chiến đấu."
 vie_nav_ind.31.t:0 "Tích hợp hệ thống: mức nội địa hóa"
 vie_nav_ind.31.d:0 "Mức cao hơn tốn nhiều thời gian và chi phí hơn nhưng để lại nhiều kinh nghiệm hơn cho đội ngũ kỹ thuật trong nước."
 vie_nav_ind.31.a:0 "Cơ bản: 12 tháng."
 vie_nav_ind.31.b:0 "Cân bằng: 18 tháng."
 vie_nav_ind.31.c:0 "Tự chủ cao: 24 tháng."
 vie_nav_ind.64.t:0 "Hoàn tất tích hợp hệ thống"
 vie_nav_ind.64.d:0 "Năng lực tích hợp hệ thống trong nước đã đi vào hoạt động; kinh nghiệm của đội ngũ kỹ sư tăng lên."
 vie_nav_ind.64.a:0 "Ghi nhận."
 vie_nav_ind.40.t:0 "Công nghiệp hải quân 2030: ưu tiên"
 vie_nav_ind.40.d:0 "Chọn mảng được dồn lực để đưa lên mức trưởng thành. Mỗi ưu tiên chỉ mở khi chương trình tương ứng đã hoàn tất; ưu tiên toàn diện cần cả ba."
 vie_nav_ind.40.a:0 "Đóng tàu."
 vie_nav_ind.40.b:0 "Bảo dưỡng."
 vie_nav_ind.40.c:0 "Tích hợp hệ thống."
 vie_nav_ind.40.g:0 "Toàn diện."
 vie_nav_ind.41.t:0 "Công nghiệp hải quân 2030: mức tự chủ"
 vie_nav_ind.41.d:0 "Mức tự chủ càng cao thì chi phí và thời gian càng lớn, và đòi xưởng Ba Son cùng năng lực tích hợp ở trình độ tương ứng."
 vie_nav_ind.41.a:0 "Tự chủ hạn chế: 24 tháng."
 vie_nav_ind.41.b:0 "Công nghiệp tích hợp: 30 tháng."
 vie_nav_ind.41.c:0 "Tự chủ cao: 36 tháng."
 vie_nav_ind.65.t:0 "Nền công nghiệp tàu chiến trưởng thành"
 vie_nav_ind.65.d:0 "Chương trình đã hoàn tất. Việt Nam có nền công nghiệp đóng tàu chiến có thể tự đóng, tự bảo dưỡng và tích hợp hệ thống ở mức đã chọn."
 vie_nav_ind.65.a:0 "Ghi nhận."

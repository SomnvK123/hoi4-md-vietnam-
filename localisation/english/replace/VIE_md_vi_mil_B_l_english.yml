l_english:
 VIE_navy_naval_regions:0 "Năm Vùng Hải quân"
 VIE_navy_naval_regions_desc:0 "Bờ biển dài hơn ba nghìn cây số được chia thành năm vùng hải quân, mỗi vùng có bộ tư lệnh, căn cứ và lực lượng tàu riêng. Rà soát lại ranh giới, thống nhất chỉ huy giữa tàu, bờ và đảo để hải quân phản ứng nhanh mà không cần chờ lệnh từ Hà Nội."
 VIE_navy_naval_academy:0 "Học viện Hải quân Nha Trang"
 VIE_navy_naval_academy_desc:0 "Học viện Hải quân đào tạo sĩ quan chỉ huy tàu, sĩ quan kỹ thuật và thủy thủ chuyên nghiệp. Bổ sung bể mô phỏng, thao trường sonar và các chương trình trao đổi với hải quân Nga, Ấn Độ và Nhật Bản."
 VIE_navy_marines:0 "Lữ đoàn hải quân đánh bộ"
 VIE_navy_marines_desc:0 "Lữ đoàn hải quân đánh bộ 147 là lực lượng đổ bộ duy nhất của Việt Nam. Bổ sung xe bọc thép lội nước, pháo và đơn vị công binh, huấn luyện chiếm và giữ các đảo ở Trường Sa khi cần, không nhằm tấn công đất liền của nước khác."
 VIE_navy_hydrography:0 "Đo đạc hải văn và thủy lôi"
 VIE_navy_hydrography_desc:0 "Biết rõ đáy biển là lợi thế của bên phòng thủ: bản đồ độ sâu, dòng chảy và đáy vịnh cho phép rải thủy lôi đúng chỗ và quét thủy lôi nhanh khi cần mở luồng. Đóng thêm tàu đo đạc và tàu rải, quét thủy lôi."
 VIE_navy_coast_guard:0 "Cảnh sát biển và kiểm ngư"
 VIE_navy_coast_guard_desc:0 "Cảnh sát biển đứng ở tuyến đầu bảo vệ ngư dân và giữ chủ quyền, thường làm việc trước cả hải quân. Trang bị tàu tuần tra lớn hơn, trực thăng và hệ thống liên lạc chung với hải quân để mọi vụ việc trên biển được xử lý theo một đầu mối."
 VIE_navy_missile_boats:0 "Tàu tên lửa Molniya"
 VIE_navy_missile_boats_desc:0 "Tàu tên lửa dự án 1241.8 Molniya được đóng theo giấy phép tại Ba Son, mang tên lửa chống hạm Uran và pháo tự động, đủ nhanh để đánh và rút. Đây là xương sống của chiến thuật ”đánh nhanh, rút nhanh” gần bờ."
 VIE_navy_sub_base:0 "Căn cứ tàu ngầm Cam Ranh"
 VIE_navy_sub_base_desc:0 "Sáu tàu ngầm Kilo cần nơi đậu, sửa chữa, bảo quản ngư lôi và huấn luyện thủy thủ đoàn. Mở rộng cầu cảng, ụ nổi và hầm chứa ở Cam Ranh; đây cũng là nơi tàu ngầm có thể ra biển Đông chỉ trong vài giờ."
 VIE_navy_asw_helicopters:0 "Trực thăng săn ngầm và sonar"
 VIE_navy_asw_helicopters_desc:0 "Trực thăng Ka-28 mang sonar nhúng và ngư lôi nhẹ là công cụ săn ngầm nhanh nhất từ tàu hộ tống. Bổ sung sonar kéo và sonobuoy, huấn luyện phi hành đoàn phối hợp cùng tàu mặt nước."
 VIE_navy_ba_son:0 "Nâng cấp xưởng Ba Son"
 VIE_navy_ba_son_desc:0 "Xưởng đóng tàu Ba Son, ngay trên sông Sài Gòn, là nơi đóng tàu tên lửa và tàu tuần tra của hải quân. Mở rộng ụ, cần cẩu và khu lắp ráp vũ khí để đóng được tàu lớn hơn, nhanh hơn và ít phụ thuộc bên ngoài."
 VIE_navy_coastal_sensors:0 "Radar cảnh giới bờ và mạng cảm biến"
 VIE_navy_coastal_sensors_desc:0 "Dải radar bờ, trạm quan sát trên đảo, máy bay không người lái tuần thám và cảm biến dưới biển được nối chung một bức tranh tác chiến. Tàu địch không thể áp sát mà không bị phát hiện từ xa."
 VIE_navy_island_network:0 "Mạng lưới đảo tiền tiêu Trường Sa"
 VIE_navy_island_network_desc:0 "Đường băng, cảng nhỏ, radar và trạm tiếp tế trên các đảo Trường Sa nối liền thành một mạng lưới. Mỗi đảo là một chốt quan sát và kho tiếp tế cho tàu tuần tra, đồng thời củng cố dấu hiệu hiện diện của Việt Nam."
 VIE_navy_submarine_expansion:0 "Mở rộng đội tàu ngầm"
 VIE_navy_submarine_expansion_desc:0 "Sáu chiếc Kilo là đủ để răn đe nhưng không đủ để phong tỏa. Đặt thêm tàu ngầm điện-diesel thế hệ mới, đào tạo thêm thủy thủ đoàn và xây thêm nhà xưởng bảo dưỡng để giữ nhiều tàu ngầm hoạt động cùng lúc."
 VIE_navy_blue_destroyers:0 "Khu trục hạm đa nhiệm (giả định)"
 VIE_navy_blue_destroyers_desc:0 "Việt Nam chưa có khu trục hạm, chỉ có khinh hạm Gepard và Sigma. Nếu chọn con đường hải quân viễn dương, cần tàu lớn hơn với hệ thống phóng thẳng đứng và radar mảng pha để hộ tống nhóm tàu xa bờ. Đây là tình huống giả định."
 VIE_navy_replenishment:0 "Tàu tiếp tế trên biển"
 VIE_navy_replenishment_desc:0 "Hạm đội xa bờ cần tàu chở dầu và hàng hóa đi cùng để tiếp tế nhiên liệu, đạn dược và lương thực ngay giữa biển. Không có chúng, mọi chuyến đi xa đều phải quay về sau vài ngày."
 VIE_navy_light_carrier:0 "Tàu sân bay hạng nhẹ (giả định)"
 VIE_navy_light_carrier_desc:0 "Tàu sân bay hạng nhẹ hoặc tàu đổ bộ trực thăng cho phép mang không quân đi theo hạm đội, bảo vệ đội hình khỏi máy bay tấn công. Đây là bước nhảy rất lớn về chi phí và kỹ thuật, và chỉ là kịch bản giả định — Việt Nam hiện không có kế hoạch nào như vậy."
 VIE_navy_spratly_fleet:0 "Hạm đội Biển Đông"
 VIE_navy_spratly_fleet_desc:0 "Một hạm đội thường trực đóng tại quần đảo Trường Sa, gồm khu trục, tàu ngầm và tàu tiếp tế, tuần tra liên tục quanh các đảo. Điều này tăng đáng kể khả năng kiểm soát biển nhưng cũng khiến Trung Quốc và các bên yêu sách khác phản ứng mạnh."
 VIE_navy_spratly_fleet_threat:0 "Hạm đội Biển Đông của Việt Nam"
 VIE_navy_usv_uuv:0 "Phương tiện không người lái trên và dưới biển"
 VIE_navy_usv_uuv_desc:0 "Thay vì đóng tàu lớn, dùng số đông phương tiện không người lái nhỏ: tàu mặt nước tự hành mang tên lửa, phương tiện ngầm rải mìn và thăm dò. Rẻ, khó phát hiện và có thể mất mát mà không đau, rất hợp với chiến lược từ chối biển."
 VIE_navy_vn_navy_2030:0 "Hải quân tiến thẳng lên hiện đại"
 VIE_navy_vn_navy_2030_desc:0 "Đến năm 2030, hải quân được xác định là một trong những quân chủng tiến thẳng lên hiện đại: tàu tên lửa, tàu ngầm, hệ thống cảm biến bờ và không quân hải quân phối hợp cùng nhau. Hội tụ mọi cải cách của nhánh hải quân."
 VIE_light_carrier_idea:0 "Tàu sân bay hạng nhẹ"
 VIE_light_carrier_idea_desc:0 "Nhóm tàu sân bay hạng nhẹ hoặc tàu đổ bộ trực thăng giúp hạm đội có không quân đi cùng."
 VIE_spratly_fleet_idea:0 "Hạm đội Biển Đông"
 VIE_spratly_fleet_idea_desc:0 "Hạm đội thường trực tại Trường Sa, đổi lại sự cảnh giác của các bên yêu sách khác."
 VIE_modern_navy_2030_idea:0 "Hải quân hiện đại 2030"
 VIE_modern_navy_2030_idea_desc:0 "Hải quân tiến thẳng lên hiện đại với tàu, cảm biến và không quân hải quân phối hợp chặt chẽ."

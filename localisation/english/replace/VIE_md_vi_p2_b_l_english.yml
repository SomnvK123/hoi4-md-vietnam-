l_english:

 VIE_singapore_model_idea:0 "Mô hình Singapore"
 VIE_singapore_model_idea_desc:0 "Cán bộ giỏi, quy tắc nghiêm, thị trường mở: một nhà nước kỹ trị chịu trách nhiệm về kết quả."
 VIE_ideological_fortress_idea:0 "Pháo đài tư tưởng"
 VIE_ideological_fortress_idea_desc:0 "Trường học, truyền thông và chi bộ bảo vệ đường lối chính thức và chống ảnh hưởng từ bên ngoài."
 VIE_eastern_yugoslavia_idea:0 "Nam Tư của phương Đông"
 VIE_eastern_yugoslavia_idea_desc:0 "Việt Nam là trái tim của một thế giới không liên kết, với con đường riêng và bạn bè riêng."
 VIE_economic_miracle_idea:0 "Phép màu kinh tế"
 VIE_economic_miracle_idea_desc:0 "Tăng trưởng gần mười phần trăm mỗi năm trong nhiều thập kỷ đã làm một nước thu nhập trung bình trở nên giàu có."
 VIE_energy_security_idea:0 "An ninh năng lượng quốc gia"
 VIE_energy_security_idea_desc:0 "Một lưới điện gồm thủy điện, khí, gió, mặt trời và nhập khẩu, được hậu thuẫn bởi dự trữ, giữ cho đèn sáng qua những năm hạn hán."

 ### Phase 2 focuses (generated)
 VIE_mass_mobilization:0 "Các tổ chức quần chúng ở cơ sở"
 VIE_mass_mobilization_desc:0 "Mặt trận Tổ quốc, các công đoàn, hội phụ nữ và hội nông dân đưa thông điệp của Đảng đến từng khu phố."
 VIE_rule_of_law_state:0 "Nhà nước pháp quyền xã hội chủ nghĩa"
 VIE_rule_of_law_state_desc:0 "Một Hiến pháp mới và một loạt bộ luật làm cho hành vi của nhà nước dễ đoán hơn và cho tòa án thêm chút không gian."
 VIE_party_discipline:0 "Chiến dịch Đốt lò không vùng cấm"
 VIE_party_discipline_desc:0 "Không ai cao đến mức không thể bị điều tra. Những quan chức từng nhắm mắt làm ngơ nay phải ngoái lại sau lưng."
 VIE_streamline_apparatus:0 "Tinh gọn tổ chức bộ máy"
 VIE_streamline_apparatus_desc:0 "Sáp nhập các bộ, bãi bỏ các cơ quan chồng chéo và cắt giảm biên chế. Một số cán bộ sẽ không thích điều này."
 VIE_provincial_merger:0 "Sáp nhập các tỉnh"
 VIE_provincial_merger_desc:0 "Sáu mươi ba tỉnh thành ba mươi bốn và cấp huyện biến mất. Chính quyền địa phương ít hơn và lớn hơn."
 VIE_era_of_rising:0 "Kỷ nguyên vươn mình của dân tộc"
 VIE_era_of_rising_desc:0 "Sau Đại hội XIV, giới lãnh đạo đặt chân trời ở năm 2045: một nước phát triển, thu nhập cao."
 VIE_state_conglomerates:0 "Các tập đoàn kinh tế nhà nước"
 VIE_state_conglomerates_desc:0 "Các tập đoàn nhà nước lớn sẽ dẫn dắt công nghiệp hóa, vay trong và ngoài nước. §RCàng lớn thì càng ngã đau.§!"
 VIE_petrovietnam_expansion:0 "Mở rộng PetroVietnam"
 VIE_petrovietnam_expansion_desc:0 "Các lô ngoài khơi, nhà máy lọc dầu và đường ống dẫn khí. Một số lô tốt nhất nằm đúng nơi Trung Quốc cũng vạch đường của họ."
 VIE_formosa_steel_complex:0 "Khu liên hợp gang thép Hà Tĩnh"
 VIE_formosa_steel_complex_desc:0 "Một nhà máy thép liên hợp khổng lồ trên bờ biển miền Trung, do một nhà đầu tư Đài Loan xây dựng. Nó sẽ tạo việc làm cho hàng nghìn người, và cần được giám sát."
 VIE_bauxite_tay_nguyen:0 "Bôxít Tây Nguyên"
 VIE_bauxite_tay_nguyen_desc:0 "Các dự án bôxít và alumin ở Tây Nguyên. Các nhà khoa học và người dân bày tỏ lo ngại về bùn đỏ và về việc ai đang thực hiện."
 VIE_private_champions:0 "Các tập đoàn tư nhân quốc gia"
 VIE_private_champions_desc:0 "Các tập đoàn tư nhân trong bất động sản, bán lẻ, ô tô và công nghệ được khuyến khích lớn đủ để cạnh tranh ở nước ngoài."
 VIE_north_south_expressway:0 "Đường cao tốc Bắc - Nam"
 VIE_north_south_expressway_desc:0 "Một tuyến cao tốc liên tục từ Lạng Sơn đến Cà Mau. Nó sẽ tốn rất nhiều và hoàn vốn qua nhiều thập kỷ."
 VIE_cptpp_member:0 "Gia nhập CPTPP"
 VIE_cptpp_member_desc:0 "Việc có hiệu lực với Việt Nam ngày 14 tháng 1 năm 2019 mở ra các thị trường Thái Bình Dương và đòi hỏi quy tắc lao động chặt hơn."
 VIE_evfta:0 "Hiệp định Thương mại Tự do với EU"
 VIE_evfta_desc:0 "Có hiệu lực từ ngày 1 tháng 8 năm 2020, EVFTA xóa dần thuế đối với gần như toàn bộ thương mại với Liên minh châu Âu."
 VIE_semiconductor_ambition:0 "Bán dẫn và AI"
 VIE_semiconductor_ambition_desc:0 "Đóng gói chip, công ty thiết kế và trung tâm dữ liệu được xác định là lĩnh vực chiến lược. Nhân tài là điểm nghẽn."
 VIE_resolution_57_68:0 "Nghị quyết đột phá 57 và 68"
 VIE_resolution_57_68_desc:0 "Khoa học, công nghệ và chuyển đổi số, cùng khu vực tư nhân, được xác định là động lực tăng trưởng."
 VIE_north_south_hsr:0 "Đường sắt tốc độ cao Bắc - Nam"
 VIE_north_south_hsr_desc:0 "Tuyến 350 km/h từ Hà Nội đến Thành phố Hồ Chí Minh. Đây là dự án đắt nhất trong lịch sử đất nước."
 VIE_long_thanh_airport:0 "Sân bay quốc tế Long Thành"
 VIE_long_thanh_airport_desc:0 "Một cảng trung chuyển cho miền Nam, phía đông Thành phố Hồ Chí Minh, có quy mô cuối cùng sẽ sánh với những sân bay lớn nhất khu vực."
 VIE_ninh_thuan_nuclear:0 "Quyết định điện hạt nhân Ninh Thuận"
 VIE_ninh_thuan_nuclear_desc:0 "Việt Nam cân nhắc những nhà máy điện hạt nhân đầu tiên, cùng các đối tác nước ngoài. Lựa chọn này sẽ được xem lại hơn một lần."
 VIE_build_nuclear_plant:0 "Xây các lò phản ứng Ninh Thuận"
 VIE_build_nuclear_plant_desc:0 "§YLịch sử thay thế.§! Tiến hành xây dựng cùng các đối tác Nga và Nhật Bản dù chi phí cao."
 VIE_shelve_nuclear:0 "Gác chương trình hạt nhân"
 VIE_shelve_nuclear_desc:0 "Chi phí quá cao và các câu hỏi an toàn chưa được giải quyết. Chương trình bị gác lại và tiền dồn cho việc khác."
 VIE_revive_nuclear:0 "Khôi phục chương trình hạt nhân"
 VIE_revive_nuclear_desc:0 "Thiếu điện và các mục tiêu khí hậu đưa hạt nhân trở lại chương trình nghị sự. Các lò mới được lên kế hoạch cùng một đối tác mới."
 VIE_net_zero_2050:0 "Phát thải ròng bằng 0 vào năm 2050"
 VIE_net_zero_2050_desc:0 "Tại COP26, Việt Nam cam kết phát thải ròng bằng 0 vào giữa thế kỷ. Lưới điện, điện mặt trời, điện gió và tài chính phải theo sau."
 VIE_modernize_vpa:0 "Hiện đại hóa Quân đội Nhân dân"
 VIE_modernize_vpa_desc:0 "Một lực lượng nhỏ hơn, huấn luyện tốt hơn, trang bị tốt hơn, xây dựng quanh hiện đại hóa có chọn lọc thay vì số đông."
 VIE_russian_arms_deals:0 "Các hợp đồng vũ khí với Nga"
 VIE_russian_arms_deals_desc:0 "Tiêm kích Su-30, tàu ngầm Kilo và tên lửa Bastion đến từ Nga, với giá ưu đãi và tín dụng dài hạn."
 VIE_su30mk2_fleet:0 "Phi đội Su-30MK2"
 VIE_su30mk2_fleet_desc:0 "Hơn hai mươi chiếc Flanker lần đầu tiên cho không quân một loại tiêm kích có tầm với thực sự trên Biển Đông."
 VIE_kilo_submarines:0 "Sáu tàu ngầm Kilo"
 VIE_kilo_submarines_desc:0 "Một hợp đồng sáu tàu ngầm diesel-điện tiên tiến và một căn cứ huấn luyện ở Cam Ranh. Thông điệp rõ ràng mà không cần một phát súng."
 VIE_bastion_p_coastal_defence:0 "Tổ hợp tên lửa bờ Bastion-P"
 VIE_bastion_p_coastal_defence_desc:0 "Các tổ hợp tên lửa Bastion-P cơ động có thể đánh tàu ở xa ngoài khơi."
 VIE_viettel_military_tech:0 "Công nghiệp quốc phòng Viettel"
 VIE_viettel_military_tech_desc:0 "Radar, máy bay không người lái, tác chiến điện tử và thông tin liên lạc bảo mật từ Viettel và các nhà máy quốc phòng giảm phụ thuộc vào nhập khẩu."
 VIE_force_47:0 "Lực lượng 47 và Bộ Tư lệnh Mạng"
 VIE_force_47_desc:0 "Một lực lượng chiến tranh mạng chuyên trách được công bố tháng 12 năm 2017 để bảo vệ mạng lưới và đối phó các chiến dịch thông tin thù địch."
 VIE_provincial_defence_zones:0 "Khu vực phòng thủ tỉnh"
 VIE_provincial_defence_zones_desc:0 "Mỗi tỉnh và thành phố xây dựng một khu vực phòng thủ với lực lượng, kho bãi và kế hoạch tại chỗ, để kẻ thù không thấy mục tiêu yếu nào ở bất kỳ đâu."
 VIE_maritime_militia:0 "Dân quân biển"
 VIE_maritime_militia_desc:0 "Ngư dân được huấn luyện để báo cáo, bám sát và giữ vững vị trí trên biển."
 VIE_spratly_fortification:0 "Củng cố các tiền đồn Trường Sa"
 VIE_spratly_fortification_desc:0 "Đất cải tạo và các công trình mới củng cố sự hiện diện của Việt Nam ở quần đảo Trường Sa. Các bên khác đã xây nhiều hơn."
 VIE_four_nos_doctrine:0 "Học thuyết quốc phòng Bốn Không"
 VIE_four_nos_doctrine_desc:0 "Không liên minh, không theo phe, không căn cứ nước ngoài, không dùng vũ lực hay đe dọa dùng vũ lực. Sách trắng Quốc phòng 2019 biến nó thành học thuyết."
 VIE_asean_chair:0 "Năm Chủ tịch ASEAN và thúc đẩy COC"
 VIE_asean_chair_desc:0 "Việt Nam giữ chức chủ tịch ASEAN năm 2010 (và lần nữa năm 2020), đăng cai các hội nghị thượng đỉnh và định ra chương trình nghị sự."
 VIE_un_security_council:0 "Ủy viên không thường trực Hội đồng Bảo an"
 VIE_un_security_council_desc:0 "Việt Nam làm ủy viên không thường trực nhiệm kỳ 2008-09 và 2020-21."
 VIE_us_comprehensive_partnership:0 "Đối tác toàn diện với Hoa Kỳ"
 VIE_us_comprehensive_partnership_desc:0 "Năm 2013, Hà Nội và Washington thiết lập quan hệ đối tác toàn diện."
 VIE_us_embargo_lifted:0 "Dỡ bỏ cấm vận vũ khí của Mỹ"
 VIE_us_embargo_lifted_desc:0 "Thông báo năm 2016 mở cửa cho vũ khí phương Tây mà không đụng đến Bốn Không."
 VIE_csp_network:0 "Các đối tác chiến lược toàn diện"
 VIE_csp_network_desc:0 "Đến năm 2023, Việt Nam đã nâng quan hệ với Hoa Kỳ và các cường quốc lớn khác lên mức đối tác cao nhất."
 VIE_bamboo_diplomacy:0 "Bản lĩnh ngoại giao cây tre Việt Nam"
 VIE_bamboo_diplomacy_desc:0 "Gốc vững, thân chắc, cành uyển chuyển. Việt Nam giữ mọi cường quốc lớn ở gần, và không ai phải bị chọn."
 VIE_special_relations_laos:0 "Quan hệ đặc biệt với Lào"
 VIE_special_relations_laos_desc:0 "Những đồng chí cũ và láng giềng gần: quan hệ an ninh, thương mại và thủy điện gắn kết hai nước."
 VIE_cambodia_relations:0 "Quan hệ với Campuchia"
 VIE_cambodia_relations_desc:0 "Phân định biên giới, thương mại và hợp tác Mê Kông với Phnom Penh."
 VIE_education_reform:0 "Cải cách giáo dục và đại học"
 VIE_education_reform_desc:0 "Các trường đại học được tự chủ, trường nghề được cấp kinh phí, và tiếng Anh cùng kỹ năng số chuyển vào trung tâm chương trình học."
 VIE_universal_health_insurance:0 "Bảo hiểm y tế toàn dân"
 VIE_universal_health_insurance_desc:0 "Bảo hiểm y tế công được mở rộng cho gần như mọi công dân."
 VIE_vinasat:0 "Các vệ tinh VINASAT"
 VIE_vinasat_desc:0 "VINASAT-1 (2008) và VINASAT-2 (2012) cho Việt Nam vệ tinh viễn thông của riêng mình."
 VIE_national_digital_transformation:0 "Chuyển đổi số quốc gia"
 VIE_national_digital_transformation_desc:0 "Định danh điện tử, chính phủ điện tử, thanh toán di động và băng thông rộng phủ đến mọi xã."
 VIE_viettel_global:0 "Viettel vươn ra toàn cầu"
 VIE_viettel_global_desc:0 "Hoạt động của Viettel ở Campuchia, Lào, Peru, Mozambique và xa hơn mang lại doanh thu và ảnh hưởng."
 VIE_mekong_climate_adaptation:0 "Thích ứng ở Đồng bằng sông Cửu Long"
 VIE_mekong_climate_adaptation_desc:0 "Lúa chịu mặn, cống ngăn mặn, hồ chứa và chuyển từ lúa sang tôm và trái cây."
 VIE_disaster_preparedness:0 "Phòng chống thiên tai"
 VIE_disaster_preparedness_desc:0 "Cảnh báo sớm, kế hoạch sơ tán và đê điều vững chắc hơn, cùng thẩm quyền để chính quyền địa phương hành động trước khi bão đến."
 VIE_developmental_state:0 "Nhà nước kiến tạo phát triển"
 VIE_developmental_state_desc:0 "Một nhà nước kiến tạo chọn người thắng cuộc, đầu tư vào kỹ năng và hạ tầng, và chịu trách nhiệm về kết quả."
 VIE_technocrat_cabinet:0 "Nội các kỹ trị"
 VIE_technocrat_cabinet_desc:0 "Các bộ trưởng được chọn theo năng lực, không theo thâm niên."
 VIE_intra_party_elections:0 "Bầu cử cạnh tranh trong Đảng"
 VIE_intra_party_elections_desc:0 "Đảng viên chọn giữa các ứng viên cho các chức vụ lãnh đạo. Đảng cởi mở hơn một chút và khó đoán hơn một chút."
 VIE_press_relaxation:0 "Nới lỏng kiểm soát báo chí"
 VIE_press_relaxation_desc:0 "Báo chí được phép điều tra quan chức địa phương. Một số sẽ đi quá đà."
 VIE_environmental_accountability:0 "Trách nhiệm giải trình về môi trường"
 VIE_environmental_accountability_desc:0 "Sau vụ cá chết ở Hà Tĩnh, kẻ gây ô nhiễm phải trả giá và cộng đồng được tham vấn. Yêu cầu công ty đã bị xử lý công khai."
 VIE_managed_pluralism:0 "Đa nguyên có quản lý"
 VIE_managed_pluralism_desc:0 "Đảng Dân chủ và Đảng Xã hội, bị đóng cửa năm 1988, được phép trở lại với số ghế hạn chế. Yêu cầu cánh cửa xã hội dân sự đã mở."
 VIE_round_table_talks:0 "Đàm phán bàn tròn"
 VIE_round_table_talks_desc:0 "Chính phủ, phe đối lập và xã hội dân sự ngồi lại cùng nhau. Phe cứng rắn đang theo dõi."
 VIE_legalize_parties:0 "Hợp pháp hóa các đảng chính trị"
 VIE_legalize_parties_desc:0 "Mọi đảng có thể đăng ký và vận động tranh cử. Đảng không còn độc chiếm sân chơi."
 VIE_new_constitution:0 "Một Hiến pháp mới"
 VIE_new_constitution_desc:0 "Một cơ quan lập hiến soạn hiến chương bảo đảm bầu cử, tòa án và các quyền."
 VIE_first_free_election:0 "Cuộc bầu cử tự do đầu tiên"
 VIE_first_free_election_desc:0 "Lần đầu tiên trong ký ức, cử tri được tự do chọn giữa các đảng."
 VIE_consolidate_democracy:0 "Củng cố dân chủ"
 VIE_consolidate_democracy_desc:0 "Tòa án, báo chí tự do và việc thay đổi chính phủ trong trật tự. Phần khó nhất đến sau cuộc bầu cử đầu tiên."
 VIE_defend_the_foundation:0 "Bảo vệ nền tảng"
 VIE_defend_the_foundation_desc:0 "Hệ tư tưởng của Đảng, kỷ luật và vai trò lãnh đạo của nhà nước được tuyên bố là không thể thương lượng."
 VIE_state_sector_leading:0 "Khu vực nhà nước dẫn dắt"
 VIE_state_sector_leading_desc:0 "Doanh nghiệp nhà nước được ưu tiên đầu tiên về tín dụng, đất đai và hợp đồng."
 VIE_self_reliance:0 "Tự lực"
 VIE_self_reliance_desc:0 "Sản xuất trong nước, đầu vào từ các nước thân thiện, và không phụ thuộc vào thị trường thù địch."
 VIE_nationalize_foreign_assets:0 "Quốc hữu hóa tài sản nước ngoài"
 VIE_nationalize_foreign_assets_desc:0 "Các tài sản chiến lược thuộc sở hữu nước ngoài bị thu hồi. §RĐiều này sẽ khiêu khích mọi nhà đầu tư lớn.§! Sẽ có một bước xác nhận."
 VIE_accept_chinese_influence:0 "Chấp nhận vị thế vượt trội của Trung Quốc"
 VIE_accept_chinese_influence_desc:0 "Hà Nội quyết định cách tốt nhất để sống cạnh Trung Quốc là thuận theo họ. §RBốn Không bị bỏ.§!"
 VIE_join_bri:0 "Gia nhập Vành đai và Con đường"
 VIE_join_bri_desc:0 "Các khoản vay của Trung Quốc xây cảng và đường sắt. Hóa đơn đến sau."
 VIE_socialist_bloc:0 "Khối xã hội chủ nghĩa"
 VIE_socialist_bloc_desc:0 "Liên kết chính thức với Trung Quốc và các đối tác của họ."
 VIE_pivot_to_the_west:0 "Xoay trục sang phương Tây"
 VIE_pivot_to_the_west_desc:0 "Hà Nội nghiêng về Hoa Kỳ và các đối tác. §RBốn Không bị bỏ và Bắc Kinh sẽ phản ứng.§!"
 VIE_military_cooperation_usa:0 "Hợp tác quân sự với Mỹ"
 VIE_military_cooperation_usa_desc:0 "Diễn tập chung, huấn luyện và tiếp cận trang bị tiên tiến."
 VIE_indo_pacific_partner:0 "Đối tác an ninh Ấn Độ - Thái Bình Dương"
 VIE_indo_pacific_partner_desc:0 "Việt Nam gia nhập liên minh không chính thức của các đối tác nhằm cân bằng Trung Quốc."
 VIE_indochina_solidarity:0 "Đoàn kết Đông Dương"
 VIE_indochina_solidarity_desc:0 "Việt Nam, Lào và Campuchia phối hợp quốc phòng và ngoại giao. Ý tưởng cũ về một liên bang Đông Dương trở lại."
 VIE_indochina_federation:0 "Liên bang Đông Dương"
 VIE_indochina_federation_desc:0 "Đưa Lào và Campuchia vào một liên bang duy nhất. Mở khóa quyết định thành lập có sẵn khi các tiểu bang cần thiết được nắm giữ hoặc thành chư hầu."
 VIE_tc_strategic_autonomy:0 "Tuyên bố tự chủ chiến lược"
 VIE_tc_strategic_autonomy_desc:0 "Hà Nội sẽ không cúi đầu trước người bảo trợ nào và không theo khối nào, và Đảng sẽ dẫn dắt con đường này. §RBắc Kinh sẽ phản ứng.§!"
 VIE_tc_decouple_supply:0 "Tách khỏi chuỗi cung ứng"
 VIE_tc_decouple_supply_desc:0 "Thay đầu vào của Trung Quốc bằng đầu vào trong nước và nước thứ ba. §RSự thiếu hụt sắp đến.§!"
 VIE_tc_self_management:0 "Công nhân tự quản"
 VIE_tc_self_management_desc:0 "Doanh nghiệp do các hội đồng được bầu điều hành. Sản lượng tăng; sự nắm giữ của cán bộ lỏng ra."
 VIE_tc_russia_india_axis:0 "Trục vũ khí Nga - Ấn"
 VIE_tc_russia_india_axis_desc:0 "Vũ khí và bí quyết từ hai người bạn cũ, và không cần phụ thuộc vào bất kỳ nhà cung cấp nào."
 VIE_tc_global_south:0 "Tiếng nói của Nam Bán cầu"
 VIE_tc_global_south_desc:0 "Việt Nam trở thành tiếng nói hàng đầu của các quốc gia không liên kết."
 VIE_tc_armed_neutrality:0 "Trung lập vũ trang"
 VIE_tc_armed_neutrality_desc:0 "Một đất nước không thể bị bắt nạt và sẽ không bắt nạt ai. Quốc phòng mạnh, không đồng minh."
 VIE_sec_cyber_control:0 "Kiểm soát toàn diện không gian mạng"
 VIE_sec_cyber_control_desc:0 "Các cơ quan an ninh nắm internet, truyền thông và dữ liệu ngân hàng. Mọi người đều bị theo dõi."
 VIE_sec_surveillance_network:0 "Mạng lưới giám sát"
 VIE_sec_surveillance_network_desc:0 "Camera, mật báo viên và hệ thống dữ liệu theo dõi mọi điều quan trọng."
 VIE_sec_security_economy:0 "Kinh tế an ninh"
 VIE_sec_security_economy_desc:0 "Các ngành chiến lược trước hết chịu trách nhiệm trước các cơ quan an ninh."
 VIE_lb_sez_law:0 "Luật Đặc khu Kinh tế"
 VIE_lb_sez_law_desc:0 "Ba đặc khu ven biển (Vân Đồn, Bắc Vân Phong, Phú Quốc) có quy tắc riêng và thời hạn thuê dài cho nhà đầu tư."
 VIE_lb_99_year_leases:0 "Thuê đất chín mươi chín năm"
 VIE_lb_99_year_leases_desc:0 "Nhà đầu tư được thuê đất một thế kỷ. Rất nhiều tiền theo sau, và rất nhiều lo âu."
 VIE_lb_common_law_courts:0 "Tòa thương mại có thẩm phán nước ngoài"
 VIE_lb_common_law_courts_desc:0 "Nhà đầu tư có một tòa án mà họ tin."
 VIE_lb_flat_tax:0 "Thuế phẳng"
 VIE_lb_flat_tax_desc:0 "Một mức thuế thấp cho mọi người."
 VIE_lb_expand_zones:0 "Thêm đặc khu"
 VIE_lb_expand_zones_desc:0 "Mô hình lan sang các tỉnh khác, và các tranh chấp cũng vậy."
 VIE_lb_charter_state:0 "Nhà nước đặc khu"
 VIE_lb_charter_state_desc:0 "Mô hình đặc khu được mở rộng ra cả nước. Nhà nước trở thành một nhà cung cấp dịch vụ."
 VIE_ol_bailout:0 "Giải cứu các ngân hàng"
 VIE_ol_bailout_desc:0 "Nhà nước tiếp quản nợ xấu của các ngân hàng tư nhân lớn. Ai cũng thở phào; một số biết ơn."
 VIE_ol_conglomerate_council:0 "Hội đồng các tập đoàn"
 VIE_ol_conglomerate_council_desc:0 "Người đứng đầu các tập đoàn lớn nhất gặp chính phủ mỗi tháng, và lời khuyên của họ trở thành chính sách."
 VIE_ol_media_ownership:0 "Mua lại truyền thông"
 VIE_ol_media_ownership_desc:0 "Các tập đoàn mua báo và kênh truyền hình. Những câu chuyện khó chịu trở nên hiếm hơn."
 VIE_ol_real_estate_boom:0 "Cơn sốt bất động sản lớn"
 VIE_ol_real_estate_boom_desc:0 "Tín dụng rẻ đổ vào đất đai và nhà ở. Tăng trưởng vọt lên. §RBong bóng vỡ sau khoảng hai năm trừ khi được làm nguội.§!"
 VIE_ol_reform_from_within:0 "Cải cách từ bên trong"
 VIE_ol_reform_from_within_desc:0 "Một nỗ lực đau đớn, tốn kém nhằm kiềm chế quyền lực của các tập đoàn đối với nhà nước."
 VIE_wa_development_council:0 "Hội đồng Phát triển Quốc gia"
 VIE_wa_development_council_desc:0 "Tăng trưởng nhờ xuất khẩu dưới một chính phủ độc tài liên minh với Mỹ: con đường Park Chung-hee. Yêu cầu Xoay trục sang phương Tây."
 VIE_wa_us_alliance:0 "Hiệp ước An ninh với Hoa Kỳ"
 VIE_wa_us_alliance_desc:0 "Liên minh chính thức với Hoa Kỳ, đổi lấy một chỗ dưới chiếc ô của họ."
 VIE_wa_national_champions:0 "Chaebol Việt"
 VIE_wa_national_champions_desc:0 "Một vài tập đoàn được ưu ái cấp tín dụng rẻ và chỉ tiêu xuất khẩu."
 VIE_wa_export_drive:0 "Xuất khẩu hoặc chết"
 VIE_wa_export_drive_desc:0 "Mọi nhà máy đều có hạn ngạch xuất khẩu."
 VIE_wa_heavy_industry:0 "Công nghiệp nặng và hóa chất"
 VIE_wa_heavy_industry_desc:0 "Thép, nhà máy đóng tàu và hóa dầu xây bằng tín dụng nhà nước."
 VIE_wa_suppress_labor:0 "Kiểm soát lao động"
 VIE_wa_suppress_labor_desc:0 "Công đoàn độc lập bị cấm. Tiền lương bị kìm giữ. Tăng trưởng không chờ đợi."
 VIE_national_assembly_role:0 "Quốc hội mạnh hơn"
 VIE_national_assembly_role_desc:0 "Đại biểu chất vấn bộ trưởng trên truyền hình trực tiếp và các ủy ban xem xét ngân sách từng khoản."
 VIE_ethnic_policy:0 "Chính sách cho Tây Nguyên và vùng biên giới"
 VIE_ethnic_policy_desc:0 "Đường sá, trường học và trạm y tế cho các tỉnh miền núi, và tôn trọng phong tục địa phương, để bất ổn không bén rễ."
 VIE_cybersecurity_law:0 "Luật An ninh mạng"
 VIE_cybersecurity_law_desc:0 "Một đạo luật về nội địa hóa dữ liệu và nội dung trực tuyến được soạn thảo. Các nền tảng nước ngoài và giới phê bình trong nước đều phản đối."
 VIE_anti_corruption_law:0 "Luật Phòng, chống tham nhũng"
 VIE_anti_corruption_law_desc:0 "Một đạo luật đặt ra nghĩa vụ công khai, báo cáo và chịu trách nhiệm. Việc thực thi sẽ quyết định nó có ý nghĩa hay không."
 VIE_asset_declaration:0 "Quan chức kê khai tài sản"
 VIE_asset_declaration_desc:0 "Quan chức cấp cao và gia đình họ phải kê khai những gì mình sở hữu. Một số không thích việc này."
 VIE_state_audit:0 "Kiểm toán Nhà nước"

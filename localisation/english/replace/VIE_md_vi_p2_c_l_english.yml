l_english:

 VIE_state_audit_desc:0 "Các cuộc kiểm toán bộ và tập đoàn nhà nước phát hiện hàng nghìn tỷ chi tiêu bất thường."
 VIE_party_inspection:0 "Ủy ban Kiểm tra Trung ương"
 VIE_party_inspection_desc:0 "Các thanh tra của chính Đảng có quyền mở vụ việc đối với đảng viên cấp cao."
 VIE_asset_recovery:0 "Thu hồi tài sản bị chiếm đoạt"
 VIE_asset_recovery_desc:0 "Tòa án ra lệnh trả về cho nhà nước tài sản và tiền mặt thu từ các quan chức bị kết án."
 VIE_clean_cadres:0 "Đội ngũ cán bộ trong sạch"
 VIE_clean_cadres_desc:0 "Liêm chính trở thành điều kiện để thăng tiến, và những quan chức không giải thích nổi tài sản của mình sẽ không được đề bạt."
 VIE_public_admin_reform:0 "Cải cách hành chính công"
 VIE_public_admin_reform_desc:0 "Cơ chế một cửa, thủ tục đơn giản hơn và trách nhiệm rõ ràng hơn, thử nghiệm trước ở vài tỉnh."
 VIE_decentralization:0 "Phân cấp quyền hạn cho các tỉnh"
 VIE_decentralization_desc:0 "Các tỉnh có nhiều tiếng nói hơn về đầu tư và ngân sách. Tăng trưởng theo sau, và các thương vụ địa phương cũng vậy."
 VIE_e_government:0 "Chính phủ điện tử"
 VIE_e_government_desc:0 "Hồ sơ, giấy phép và thuế chuyển lên mạng, và hàng chờ giấy tờ biến mất."
 VIE_merge_ministries:0 "Sáp nhập các bộ và cơ quan"
 VIE_merge_ministries_desc:0 "Các bộ được gộp lại và số cơ quan giảm mạnh."
 VIE_two_tier_local_gov:0 "Chính quyền địa phương hai cấp"
 VIE_two_tier_local_gov_desc:0 "Cấp huyện bị bãi bỏ. Tỉnh và xã nay cùng điều hành chính quyền địa phương."
 VIE_institutional_bottlenecks:0 "Tháo gỡ điểm nghẽn thể chế"
 VIE_institutional_bottlenecks_desc:0 "Các luật cản trở dự án được sửa từng cái một. Một số cán bộ mất quyền nói không."
 VIE_party_centennial_2030:0 "Một trăm năm thành lập Đảng"
 VIE_party_centennial_2030_desc:0 "Năm 2030, Đảng kỷ niệm một trăm năm và báo cáo về các mục tiêu đã tự đặt ra."
 VIE_state_bank_modernization:0 "Hiện đại hóa Ngân hàng Nhà nước"
 VIE_state_bank_modernization_desc:0 "Ngân hàng trung ương có giám sát, hệ thống thanh toán và nhiệm vụ về giá cả rõ ràng hơn."
 VIE_fight_inflation:0 "Chống lạm phát"
 VIE_fight_inflation_desc:0 "Tín dụng chặt hơn và chính sách tỷ giá vững hơn làm giá cả hạ nhiệt."
 VIE_restructure_banking:0 "Tái cơ cấu hệ thống ngân hàng"
 VIE_restructure_banking_desc:0 "Các ngân hàng yếu được sáp nhập và tái cấp vốn, và các chủ sở hữu được yêu cầu bỏ tiền của mình vào."
 VIE_vamc:0 "Công ty Quản lý Tài sản"
 VIE_vamc_desc:0 "Một công ty nhà nước mua nợ xấu từ ngân hàng và xử lý dần theo thời gian."
 VIE_deposit_insurance:0 "Bảo hiểm tiền gửi"
 VIE_deposit_insurance_desc:0 "Người gửi tiền được bảo vệ đến một hạn mức, làm giảm nguy cơ rút tiền ồ ạt ở ngân hàng."
 VIE_cross_ownership_crackdown:0 "Chấm dứt sở hữu chéo"
 VIE_cross_ownership_crackdown_desc:0 "Ngân hàng không còn được thuộc sở hữu của các công ty mà họ cho vay. Các tập đoàn lớn nhất mất một nguồn vốn riêng."
 VIE_corporate_bond_reform:0 "Cải cách thị trường trái phiếu doanh nghiệp"
 VIE_corporate_bond_reform_desc:0 "Bên phát hành phải công bố nhiều hơn, và nhà đầu tư phải đủ điều kiện hơn để mua."
 VIE_market_upgrade_criteria:0 "Đáp ứng tiêu chí thị trường mới nổi"
 VIE_market_upgrade_criteria_desc:0 "Hạn mức sở hữu nước ngoài, quy tắc thanh toán bù trừ và khả năng tiếp cận thị trường được làm lại để đáp ứng yêu cầu của các nhà cung cấp chỉ số."
 VIE_international_financial_centre:0 "Trung tâm tài chính quốc tế"
 VIE_international_financial_centre_desc:0 "Thành phố Hồ Chí Minh và Đà Nẵng được lập thành các trung tâm tài chính độc lập với quy tắc riêng."
 VIE_investment_grade:0 "Xếp hạng tín nhiệm đầu tư"
 VIE_investment_grade_desc:0 "Sau nhiều năm quản lý nợ ổn định, các hãng xếp hạng nâng xếp hạng của Việt Nam lên mức đầu tư."
 VIE_rice_export_power:0 "Nước xuất khẩu gạo và cà phê"
 VIE_rice_export_power_desc:0 "Việt Nam nằm trong nhóm xuất khẩu gạo và cà phê hàng đầu thế giới, và an ninh lương thực không còn là câu hỏi."
 VIE_high_tech_agriculture:0 "Nông nghiệp công nghệ cao"
 VIE_high_tech_agriculture_desc:0 "Tưới nhỏ giọt, giống chịu mặn và chuỗi lạnh nâng năng suất và giá mà nông dân nhận được."
 VIE_land_law_reform:0 "Cải cách Luật Đất đai"
 VIE_land_law_reform_desc:0 "Quyền sử dụng đất được làm rõ và quy tắc bồi thường được siết lại, nhằm giảm số tranh chấp."
 VIE_16_words:0 "Phương châm 16 chữ và tinh thần 4 tốt"
 VIE_16_words_desc:0 "'Láng giềng hữu nghị, hợp tác toàn diện, ổn định lâu dài, hướng tới tương lai.' Một công thức để giữ hòa bình với Bắc Kinh."
 VIE_border_trade_gates:0 "Cửa khẩu thương mại biên giới"
 VIE_border_trade_gates_desc:0 "Các cửa khẩu ở phía Bắc được mở cho hàng hóa và tiểu thương."
 VIE_defence_hotline:0 "Đường dây nóng quốc phòng và tránh va chạm"
 VIE_defence_hotline_desc:0 "Các bộ trưởng quốc phòng thỏa thuận một đường dây trực tiếp và quy tắc xử lý sự cố trên biển."
 VIE_code_of_conduct:0 "Bộ Quy tắc Ứng xử ở Biển Đông"
 VIE_code_of_conduct_desc:0 "Việt Nam cùng ASEAN thúc đẩy một bộ quy tắc có tính ràng buộc và ngăn nó bị pha loãng."
 VIE_shared_future:0 "Cộng đồng chia sẻ tương lai"
 VIE_shared_future_desc:0 "Bắc Kinh đề xuất một công thức gắn hai nước chặt hơn. Hà Nội chấp nhận cách diễn đạt nhưng giữ các lựa chọn của mình."
 VIE_heritage_preservation:0 "Bảo tồn di sản"
 VIE_heritage_preservation_desc:0 "Vịnh Hạ Long, Hội An và các thành cổ được bảo vệ, và tiền cho việc đó được tìm ra."
 VIE_sea_games_bid:0 "Đăng cai Đại hội Thể thao Đông Nam Á"
 VIE_sea_games_bid_desc:0 "Hà Nội xin đăng cai đại hội thể thao khu vực, với các sân vận động mới và nỗ lực toàn quốc giành huy chương."
 VIE_visa_reform:0 "Cải cách thị thực"
 VIE_visa_reform_desc:0 "Thị thực điện tử dài hạn hơn và nhiều nước được miễn thị thực hơn mở cửa đất nước cho du khách."
 VIE_cultural_industry:0 "Công nghiệp văn hóa"
 VIE_cultural_industry_desc:0 "Phim, nhạc, trò chơi và thời trang được xác định là lĩnh vực có chỗ để phát triển ở nước ngoài."
 VIE_tourism_powerhouse:0 "Điểm đến hàng đầu châu Á"
 VIE_tourism_powerhouse_desc:0 "Hàng chục triệu lượt khách mỗi năm biến du lịch thành trụ cột của nền kinh tế."
 VIE_urbanization:0 "Đô thị hóa có quản lý"
 VIE_urbanization_desc:0 "Hàng triệu người đổ về thành phố. Các nhà quy hoạch cố theo kịp với nhà ở, giao thông và dịch vụ."
 VIE_labor_code_2019:0 "Bộ luật Lao động 2019"
 VIE_labor_code_2019_desc:0 "Người lao động có quyền lập tổ chức đại diện của riêng mình. Giới chủ dè dặt."
 VIE_social_insurance_reform:0 "Cải cách bảo hiểm xã hội"
 VIE_social_insurance_reform_desc:0 "Quy tắc rút một lần và tuổi nghỉ hưu được viết lại. Phản ứng của người lao động sẽ định hình kết quả."
 VIE_population_policy:0 "Chính sách dân số mới"
 VIE_population_policy_desc:0 "Giới hạn hai con được dỡ bỏ và hỗ trợ gia đình được tăng lên, khi tỷ lệ sinh giảm."
 VIE_overseas_vietnamese:0 "Người Việt ở nước ngoài"
 VIE_overseas_vietnamese_desc:0 "Kiều hối, đầu tư và kỹ năng trở về nối đất nước với hàng triệu người Việt ở nước ngoài."
 VIE_upper_middle_income:0 "Thu nhập trung bình cao vào năm 2030"
 VIE_upper_middle_income_desc:0 "Mục tiêu đặt ra năm 2021: thu nhập đưa Việt Nam vào nhóm các nền kinh tế thu nhập trung bình cao."
 VIE_green_growth:0 "Tăng trưởng xanh"
 VIE_green_growth_desc:0 "Đầu tư mới được đo theo các mục tiêu carbon và ô nhiễm cũng như lợi nhuận."
 VIE_innovation_nation:0 "Quốc gia đổi mới sáng tạo"
 VIE_innovation_nation_desc:0 "Khu nghiên cứu, nhà máy chip và các công ty khởi nghiệp biến khoa học thành nguồn xuất khẩu, không chỉ nhập khẩu."
 VIE_high_income_2045:0 "Thu nhập cao vào năm 2045"
 VIE_high_income_2045_desc:0 "Mục tiêu dài hạn: một quốc gia mà người dân khấm khá như ở những nền kinh tế giàu nhất châu Á."
 VIE_developed_nation_2045:0 "Một nước phát triển"
 VIE_developed_nation_2045_desc:0 "Một trăm năm sau độc lập, Việt Nam là một nước phát triển với thu nhập cao và một nhà nước hiện đại."
 VIE_hose_exchange:0 "Sở Giao dịch Chứng khoán TP. Hồ Chí Minh"
 VIE_hose_exchange_desc:0 "Sở giao dịch đầu tiên mở cửa tháng 7 năm 2000 với vài mã niêm yết. Một ngày nào đó nó sẽ quan trọng."
 VIE_investment_law_2005:0 "Luật Đầu tư chung"
 VIE_investment_law_2005_desc:0 "Nhà đầu tư trong và ngoài nước được đặt dưới một luật, với ít ngành bị đóng hơn và ít thủ tục rườm rà hơn."
 VIE_wto_reforms:0 "Cải cách để thực hiện cam kết WTO"
 VIE_wto_reforms_desc:0 "Thuế quan, trợ cấp và quy tắc cấp phép được viết lại cho khớp với những lời hứa ở Geneva."
 VIE_export_powerhouse:0 "Cường quốc xuất khẩu"
 VIE_export_powerhouse_desc:0 "Khi CPTPP và hiệp định với EU có hiệu lực, xuất khẩu là động cơ của nền kinh tế."
 VIE_gulf_of_tonkin:0 "Phân định Vịnh Bắc Bộ"
 VIE_gulf_of_tonkin_desc:0 "Hiệp định năm 2000 với Trung Quốc ấn định ranh giới biển và quy tắc đánh bắt trong vịnh."
 VIE_apec_host:0 "Đăng cai APEC"
 VIE_apec_host_desc:0 "Lãnh đạo các nền kinh tế Thái Bình Dương tụ họp tại thành phố chủ nhà. Đó là cơ hội để giới thiệu đất nước."
 VIE_us_carrier_visit:0 "Tàu sân bay Mỹ ở Đà Nẵng"
 VIE_us_carrier_visit_desc:0 "Một tàu sân bay Hoa Kỳ ghé Đà Nẵng lần đầu tiên kể từ chiến tranh. Bắc Kinh đang theo dõi."
 VIE_us_tariff_deal:0 "Khung thuế quan với Mỹ"
 VIE_us_tariff_deal_desc:0 "Một thỏa thuận khung giới hạn mức thuế đánh vào hàng xuất khẩu sang Hoa Kỳ để đổi lấy tiếp cận thị trường."
 VIE_cambodia_border:0 "Phân giới cắm mốc biên giới với Campuchia"
 VIE_cambodia_border_desc:0 "Các đoàn công tác chung cắm mốc dọc biên giới với Campuchia."
 VIE_mekong_commission:0 "Ủy hội sông Mê Kông"
 VIE_mekong_commission_desc:0 "Việt Nam làm việc qua ủy hội sông để thúc đẩy quy tắc chia sẻ nước ở thượng nguồn."
 VIE_mekong_dams_response:0 "Đáp lại các đập thượng nguồn"
 VIE_mekong_dams_response_desc:0 "Các đập ở thượng nguồn giữ nước vào mùa khô. Hà Nội vận động, giám sát và chuẩn bị cho đồng bằng."
 VIE_funan_techo_response:0 "Ứng phó kênh đào Phù Nam Techo"
 VIE_funan_techo_response_desc:0 "Kênh đào Campuchia dự định sẽ chuyển hướng nước sông Mê Kông. Việt Nam chọn giữa gây sức ép mạnh và làm việc từng chi tiết."
 VIE_india_partnership:0 "Quan hệ đối tác với Ấn Độ"
 VIE_india_partnership_desc:0 "Quan hệ đối tác chiến lược toàn diện với New Delhi mang lại vũ khí, hợp tác dầu mỏ và một người bạn có mâu thuẫn riêng với Bắc Kinh."
 VIE_japan_partnership:0 "Quan hệ đối tác với Nhật Bản"
 VIE_japan_partnership_desc:0 "Nhật Bản là nguồn viện trợ lớn nhất và một nhà đầu tư hàng đầu, đồng thời là đối tác về an ninh hàng hải."
 VIE_korea_partnership:0 "Quan hệ đối tác với Hàn Quốc"
 VIE_korea_partnership_desc:0 "Các nhà máy Hàn Quốc tuyển dụng hàng trăm nghìn người và các công ty Hàn Quốc nằm trong số nhà đầu tư lớn nhất."
 VIE_australia_partnership:0 "Quan hệ đối tác với Úc"
 VIE_australia_partnership_desc:0 "Giáo dục, tài nguyên và các mối liên hệ quốc phòng gắn Canberra với Hà Nội."
 VIE_france_eu:0 "Pháp và Liên minh châu Âu"
 VIE_france_eu_desc:0 "Paris và Brussels đề nghị đầu tư, máy bay và hỗ trợ ngoại giao mà không kèm cái giá về an ninh."
 VIE_gulf_investment:0 "Vốn từ vùng Vịnh"
 VIE_gulf_investment_desc:0 "Các quỹ đầu tư quốc gia vùng Vịnh rót tiền vào cảng, nhà máy lọc dầu và bất động sản."
 VIE_global_south_ties:0 "Châu Phi và châu Mỹ Latinh"
 VIE_global_south_ties_desc:0 "Gạo, viễn thông và ngoại giao mang tên Việt Nam đến những nơi trước đây hầu như chưa từng ghé."
 VIE_supporting_industries:0 "Công nghiệp hỗ trợ"
 VIE_supporting_industries_desc:0 "Các nhà cung cấp linh kiện và vật liệu trong nước được xây dựng để nhiều giá trị hơn ở lại trong nước."
 VIE_intel_hcmc:0 "Nhà máy lắp ráp chip"
 VIE_intel_hcmc_desc:0 "Một nhà máy lắp ráp và kiểm thử lớn gần Thành phố Hồ Chí Minh đưa Việt Nam lên bản đồ bán dẫn."
 VIE_domestic_automotive:0 "Hãng xe trong nước"
 VIE_domestic_automotive_desc:0 "Một thương hiệu xe quốc gia được ra mắt với đầu tư lớn. Thị trường cạnh tranh và rủi ro rất lớn."
 VIE_china_plus_one:0 "Làn sóng Trung Quốc cộng một"
 VIE_china_plus_one_desc:0 "Các nhà sản xuất muốn phân tán rủi ro khỏi Trung Quốc tìm đến Việt Nam. Bắc Kinh lưu ý ai đang thắng đơn hàng."
 VIE_nghi_son_refinery:0 "Nhà máy lọc dầu Nghi Sơn"
 VIE_nghi_son_refinery_desc:0 "Một tổ hợp lọc dầu và hóa dầu lớn trên bờ biển Thanh Hóa, cùng các đối tác nước ngoài."
 VIE_manufacturing_hub:0 "Công xưởng Đông Nam Á"
 VIE_manufacturing_hub_desc:0 "Điện tử, may mặc và máy móc cho các thương hiệu toàn cầu được lắp ráp tại đây."
 VIE_scic:0 "Tổng công ty Đầu tư và Kinh doanh Vốn Nhà nước"
 VIE_scic_desc:0 "Một công ty mẹ được lập để quản lý phần vốn của nhà nước trong các doanh nghiệp và bán bớt một số."
 VIE_soe_governance:0 "Quản trị vốn nhà nước"
 VIE_soe_governance_desc:0 "Một cơ quan duy nhất thực hiện quyền sở hữu của nhà nước và buộc các nhà quản lý chịu trách nhiệm."
 VIE_household_business:0 "Chính thức hóa hộ kinh doanh"
 VIE_household_business_desc:0 "Hàng triệu cửa hàng và xưởng gia đình được đưa vào danh sách nộp thuế và áp dụng quy tắc đơn giản."
 VIE_private_sector_engine:0 "Kinh tế tư nhân là động lực tăng trưởng"
 VIE_private_sector_engine_desc:0 "Nghị quyết 68 xác định kinh tế tư nhân là động lực quan trọng nhất của tăng trưởng."
 VIE_son_la_dam:0 "Đập Sơn La"
 VIE_son_la_dam_desc:0 "Nhà máy thủy điện lớn nhất Đông Nam Á mọc lên ở Tây Bắc, và hàng nghìn người được tái định cư."
 VIE_coal_power:0 "Mở rộng nhiệt điện than"
 VIE_coal_power_desc:0 "Rẻ và xây nhanh: nhà máy điện than giữ cho đèn sáng khi nhu cầu tăng vọt. Hóa đơn được trả bằng không khí và dư luận quốc tế."
 VIE_solar_boom:0 "Bùng nổ điện mặt trời"
 VIE_solar_boom_desc:0 "Giá mua điện ưu đãi mang đến hàng nghìn hệ thống trên mái nhà và trang trại. Lưới điện không được xây cho chúng."
 VIE_power_plan_8:0 "Quy hoạch Điện VIII"
 VIE_power_plan_8_desc:0 "Một kế hoạch quốc gia cân bằng khí, gió, mặt trời và nhập khẩu, và tính cả chi phí của lưới điện."
 VIE_offshore_wind:0 "Điện gió ngoài khơi"
 VIE_offshore_wind_desc:0 "Các trang trại gió ở vùng nước nông ngoài khơi miền Nam và miền Trung hứa hẹn một nguồn điện mới lớn."
 VIE_jetp:0 "Đối tác Chuyển dịch Năng lượng Công bằng"
 VIE_jetp_desc:0 "Các nước giàu đề nghị tiền và chuyên môn nếu Việt Nam cho điện than nghỉ hưu theo lộ trình."
 VIE_rare_earths:0 "Khai thác đất hiếm"
 VIE_rare_earths_desc:0 "Một trong những trữ lượng lớn nhất thế giới nằm ở Tây Bắc. Cường quốc nào cũng muốn mua những gì khai thác được."
 VIE_hanoi_metro:0 "Metro Hà Nội"
 VIE_hanoi_metro_desc:0 "Tuyến trên cao đầu tiên khai trương sau nhiều năm chậm trễ và vượt chi phí."
 VIE_hcmc_metro:0 "Metro Thành phố Hồ Chí Minh"
 VIE_hcmc_metro_desc:0 "Tuyến số 1 nối trung tâm thành phố lớn nhất với các vùng ngoại ô phía Đông."
 VIE_lach_huyen_port:0 "Cảng Lạch Huyện"
 VIE_lach_huyen_port_desc:0 "Một cảng nước sâu gần Hải Phòng đón được những tàu container lớn nhất ở phía Bắc."
 VIE_cai_mep_port:0 "Cảng Cái Mép - Thị Vải"
 VIE_cai_mep_port_desc:0 "Những cảng sâu nhất ở phía Nam nối trực tiếp các nhà máy của Thành phố Hồ Chí Minh với châu Âu và châu Mỹ."
 VIE_500kv_grid:0 "Đường dây 500 kV"
 VIE_500kv_grid_desc:0 "Đường dây truyền tải Bắc - Nam thứ ba chuyển điện từ nơi sản xuất đến nơi sử dụng."
 VIE_lao_cai_haiphong_rail:0 "Đường sắt Lào Cai - Hà Nội - Hải Phòng"
 VIE_lao_cai_haiphong_rail_desc:0 "Một tuyến khổ tiêu chuẩn nối biên giới Trung Quốc với cảng phía Bắc, và Trung Quốc sẵn sàng cho vay để xây."
 VIE_law_of_the_sea:0 "Luật Biển"
 VIE_law_of_the_sea_desc:0 "Yêu sách của Việt Nam về đảo, vùng nước và thềm lục địa được ghi vào một đạo luật quốc gia năm 2012."
 VIE_fisheries_surveillance:0 "Lực lượng Kiểm ngư"
 VIE_fisheries_surveillance_desc:0 "Một lực lượng dân sự tuần tra ngư trường, hộ tống tàu cá và ghi lại những gì các tàu khác làm."
 VIE_coast_guard_law:0 "Luật Cảnh sát biển"
 VIE_coast_guard_law_desc:0 "Một đạo luật năm 2018 trao cho cảnh sát biển quyền hạn rõ ràng và cơ sở pháp lý để hành động trong vùng biển tranh chấp."
 VIE_dk1_platforms:0 "Các nhà giàn DK1"
 VIE_dk1_platforms_desc:0 "Những nhà giàn cố định nhỏ trên thềm Bãi Tư Chính đánh dấu nơi yêu sách của Việt Nam vươn tới."
 VIE_legal_warfare:0 "Đưa ra tòa"
 VIE_legal_warfare_desc:0 "§YLịch sử thay thế.§! Việt Nam nộp đơn kiện riêng theo Công ước về Luật Biển, tiếp nối phán quyết trọng tài năm 2016."
 VIE_limited_war_doctrine:0 "Học thuyết cho một cuộc chiến hạn chế"
 VIE_limited_war_doctrine_desc:0 "Kế hoạch cho một cuộc xung đột ngắn, quyết liệt trên một khu vực nhỏ, và lối thoát đi kèm."
 VIE_peoples_defence:0 "Quốc phòng toàn dân"
 VIE_peoples_defence_desc:0 "Quốc phòng là việc của mọi công dân và mọi cấp chính quyền, với quân đội là hạt nhân."
 VIE_militia_law:0 "Luật Dân quân tự vệ"
 VIE_militia_law_desc:0 "Một đạo luật năm 2019 nêu nhiệm vụ của lực lượng dân quân và tự vệ địa phương."
 VIE_cyber_command:0 "Bộ Tư lệnh Tác chiến Không gian mạng"
 VIE_cyber_command_desc:0 "Một bộ tư lệnh chuyên trách bảo vệ mạng lưới và tiến hành tác chiến trên không gian mạng."
 VIE_un_peacekeeping:0 "Lực lượng gìn giữ hòa bình Liên Hợp Quốc"
 VIE_un_peacekeeping_desc:0 "Công binh và quân y tham gia các phái bộ Liên Hợp Quốc ở châu Phi, và lá cờ Việt Nam xuất hiện xa quê nhà."
 VIE_tank_modernization:0 "Nâng cấp xe tăng cũ"
 VIE_tank_modernization_desc:0 "Thân xe T-54 và T-55 được lắp pháo mới, hệ thống điều khiển hỏa lực và giáp, và phục vụ thêm một thời gian."
 VIE_t90_tanks:0 "Xe tăng T-90"
 VIE_t90_tanks_desc:0 "Lô xe tăng chiến đấu chủ lực hiện đại đầu tiên của Nga gia nhập các lữ đoàn thiết giáp."
 VIE_rocket_artillery:0 "Pháo phản lực hiện đại"
 VIE_rocket_artillery_desc:0 "Bệ phóng rocket tầm xa và đạn dẫn đường mở rộng tầm với của lực lượng mặt đất."
 VIE_special_forces:0 "Đặc nhiệm và trinh sát"
 VIE_special_forces_desc:0 "Công binh và đơn vị trinh sát được huấn luyện cho những vai trò mà phòng thủ cố định không đảm đương được."
 VIE_mechanization:0 "Cơ giới hóa các sư đoàn"
 VIE_mechanization_desc:0 "Các sư đoàn bộ binh có xe bọc thép chở quân và xe chiến đấu, và học cách di chuyển nhanh như xe của họ."
 VIE_corps_restructure:0 "Tái cơ cấu các quân đoàn"
 VIE_corps_restructure_desc:0 "Các bộ chỉ huy quân đoàn mới được lập để điều khiển lực lượng trên cả một chiến trường, không chỉ một tỉnh."
 VIE_reserve_mobilization:0 "Lực lượng dự bị được huấn luyện"
 VIE_reserve_mobilization_desc:0 "Công dân đã phục vụ được ghi danh vào lực lượng dự bị có thể huy động trong thời gian ngắn."
 VIE_navy_modernization:0 "Hiện đại hóa Hải quân"
 VIE_navy_modernization_desc:0 "Một hải quân nhỏ được xây lại quanh tàu ngầm, tàu tên lửa và phòng thủ bờ biển thay vì tàu pháo lớn."
 VIE_naval_aviation:0 "Không quân hải quân"
 VIE_naval_aviation_desc:0 "Máy bay tuần tiễu trên biển và trực thăng kéo dài tầm mắt của hải quân trên biển."
 VIE_gepard_frigates:0 "Khinh hạm Gepard"
 VIE_gepard_frigates_desc:0 "Bốn khinh hạm do Nga đóng cho hải quân những tàu mặt nước có năng lực với radar và tên lửa hiện đại."
 VIE_domestic_corvettes:0 "Tàu hộ vệ tên lửa đóng trong nước"
 VIE_domestic_corvettes_desc:0 "Các nhà máy đóng tàu ở phía Bắc đóng tàu hộ vệ tên lửa theo giấy phép, rồi theo thiết kế của chính mình."
 VIE_domestic_antiship:0 "Tên lửa chống hạm sản xuất trong nước"
 VIE_domestic_antiship_desc:0 "Các kỹ sư Viettel phát triển một loại tên lửa chống hạm bờ của riêng mình."
 VIE_naval_infantry:0 "Hải quân đánh bộ"
 VIE_naval_infantry_desc:0 "Lính thủy đánh bộ được huấn luyện để giữ các đảo và tái chiếm chúng."
 VIE_cam_ranh_base:0 "Căn cứ hải quân Cam Ranh"
 VIE_cam_ranh_base_desc:0 "Vịnh sâu Cam Ranh trở thành căn cứ cho tàu ngầm và tàu hỗ trợ."
 VIE_cam_ranh_port_diplomacy:0 "Cảng quốc tế Cam Ranh"
 VIE_cam_ranh_port_diplomacy_desc:0 "Hải quân nước ngoài ghé Cam Ranh để tiếp liệu và sửa chữa. Không ai có căn cứ và ai cũng được chào đón."
 VIE_air_force_modernization:0 "Hiện đại hóa Không quân"
 VIE_air_force_modernization_desc:0 "Một lực lượng không quân gọn nhẹ với tiêm kích, radar và tên lửa hiện đại, và phi công huấn luyện khắt khe."
 VIE_integrated_air_defense:0 "Mạng lưới phòng không tích hợp"
 VIE_integrated_air_defense_desc:0 "Radar, trận địa tên lửa và sở chỉ huy được liên kết để một cuộc tập kích gặp phản ứng phối hợp."
 VIE_yak130_trainers:0 "Máy bay huấn luyện Yak-130"
 VIE_yak130_trainers_desc:0 "Máy bay phản lực huấn luyện tiên tiến chuẩn bị cho phi công những chiếc tiêm kích họ sẽ lái."
 VIE_l39ng:0 "Máy bay huấn luyện L-39NG"
 VIE_l39ng_desc:0 "Một loại máy bay huấn luyện thứ hai mở rộng lựa chọn máy bay cho các trường bay."
 VIE_helicopter_fleet:0 "Trực thăng vận tải"
 VIE_helicopter_fleet_desc:0 "Trực thăng vận tải mới chở quân ra đảo và các chốt trên núi."
 VIE_uav_program:0 "Chương trình máy bay không người lái"
 VIE_uav_program_desc:0 "Máy bay không người lái trinh sát và tấn công được chế tạo trong nước cho lục quân và hải quân."
 VIE_fighter_replacement:0 "Thay thế tiêm kích"
 VIE_fighter_replacement_desc:0 "Các tiêm kích cũ hao mòn. Chọn người kế nhiệm là chọn nhà cung cấp, và lựa chọn nào cũng có giá."
 VIE_air_dominance_coast:0 "Làm chủ bầu trời ven biển"
 VIE_air_dominance_coast_desc:0 "Tiêm kích, radar và tên lửa bao phủ bờ biển và các đảo ngoài khơi, và kẻ tấn công sẽ phải giành được bầu trời trước."
 VIE_z_factories:0 "Hiện đại hóa các nhà máy Z"
 VIE_z_factories_desc:0 "Các nhà máy của quân đội được trang bị máy mới để làm được nhiều hơn những gì quân đội cần."
 VIE_licensed_rifles:0 "Súng trường sản xuất theo giấy phép"
 VIE_licensed_rifles_desc:0 "Súng trường bộ binh hiện đại được chế tạo trong nước theo giấy phép."
 VIE_shipyards:0 "Nhà máy đóng tàu hải quân"
 VIE_shipyards_desc:0 "Các nhà máy đóng tàu quân sự được mở rộng để đóng tàu tuần tra, tàu hộ vệ và tàu hỗ trợ."
 VIE_missile_program:0 "Chương trình tên lửa"
 VIE_missile_program_desc:0 "Một chương trình quốc gia về tên lửa tầm ngắn và tên lửa bờ, do các viện quốc phòng điều hành."
 VIE_defence_expo:0 "Triển lãm Quốc phòng Quốc tế"
 VIE_defence_expo_desc:0 "Hà Nội tổ chức một triển lãm quốc phòng và hàng chục nước gửi gian hàng và phái đoàn."
 VIE_arms_export:0 "Xuất khẩu vũ khí"
 VIE_arms_export_desc:0 "Vũ khí nhẹ và tàu tuần tra được bán cho các nước thân thiện muốn trang bị đơn giản, đáng tin cậy."
 VIE_dual_use_industry:0 "Công nghiệp lưỡng dụng"
 VIE_dual_use_industry_desc:0 "Các công ty làm súng cũng làm điện thoại, và các công ty làm điện thoại cũng làm súng."
 VIE_university_autonomy:0 "Tự chủ đại học"
 VIE_university_autonomy_desc:0 "Các trường đại học tự đặt chương trình, ngân sách và tuyển dụng, và chịu trách nhiệm về kết quả."
 VIE_vocational_training:0 "Đào tạo nghề"
 VIE_vocational_training_desc:0 "Các trường kỹ thuật đào tạo thợ máy, thợ điện và kỹ thuật viên mà nhà máy không tìm ra."
 VIE_free_tuition:0 "Miễn học phí trường công"
 VIE_free_tuition_desc:0 "Học phí ở các trường công được bãi bỏ, và nhà nước trả hóa đơn."
 VIE_english_second_language:0 "Tiếng Anh là ngoại ngữ thứ hai"
 VIE_english_second_language_desc:0 "Trường học dạy bằng hai ngôn ngữ và sinh viên tốt nghiệp làm việc dễ dàng với các công ty nước ngoài."
 VIE_grassroots_clinics:0 "Trạm y tế cơ sở"

l_english:
 VIE_arms_russia_framework:0 "Hợp đồng khung Vũ khí Nga"
 VIE_arms_russia_framework_desc:0 "Duy trì quan hệ mua sắm truyền thống với Nga: giá rẻ hơn, được chuyển giao giấy phép sản xuất, nhưng lệ thuộc một nguồn cung và rủi ro theo Đạo luật CAATSA của Mỹ."
 VIE_arms_diversification:0 "Đa phương hóa Nguồn cung Vũ khí"
 VIE_arms_diversification_desc:0 "Mở rộng sang Israel, Ấn Độ, Hàn Quốc và phương Tây để giảm rủi ro CAATSA và đứt gãy chuỗi cung ứng sau xung đột Ukraine (2022). Chi phí ban đầu cao hơn nhưng đa dạng nguồn."
 VIE_military_enterprises_core:0 "Doanh nghiệp Quân đội: Giữ Trụ cột Chiến lược"
 VIE_military_enterprises_core_desc:0 "Theo chủ trương thực tế từ 2016: quân đội thoái vốn phần lớn hoạt động kinh doanh nhưng giữ lại các trụ cột chiến lược (Viettel, Tân Cảng Sài Gòn, các xưởng đóng tàu) để vừa có nguồn thu vừa làm mũi nhọn công nghệ."
 VIE_military_enterprises_divest:0 "Doanh nghiệp Quân đội: Chuyên nghiệp hóa Thuần túy"
 VIE_military_enterprises_divest_desc:0 "Tách hẳn quân đội khỏi hoạt động kinh tế, chuyển toàn bộ doanh nghiệp về Bộ Tài chính quản lý, tập trung 100% nguồn lực vào huấn luyện sẵn sàng chiến đấu."
 VIE_navy_sigma_9814:0 "Đàm phán Hộ vệ hạm SIGMA 9814"
 VIE_navy_sigma_9814_desc:0 "Mô hình thương vụ SIGMA 9814 với Damen (Hà Lan) từng được bàn năm 2012-2013: tàu 98m trang bị Exocet và radar chuẩn NATO, kèm chuyển giao công nghệ đóng tàu."
 VIE_navy_domestic_frigate:0 "Tự đóng Hộ vệ hạm Chống ngầm trong nước"
 VIE_navy_domestic_frigate_desc:0 "Đóng tại các xưởng trong nước (Ba Son, Sông Thu) một lớp hộ vệ hạm chống ngầm đa năng, không phụ thuộc nguồn cung nước ngoài."
 VIE_a2ad_combo_tt:0 "Đã hoàn tất chuỗi Chống tiếp cận / Chống xâm nhập (A2/AD): tên lửa bờ, tàu ngầm, dân quân biển và trận địa đảo phối hợp thành một lưới lửa liên hoàn."

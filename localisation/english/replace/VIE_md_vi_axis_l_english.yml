 # Category:
 VIE_statebuilding_category:0 "Xây dựng Nhà nước & Năng lực Thể chế"
 VIE_statebuilding_category_desc:0 "Các chính sách điều chỉnh cơ cấu bộ máy, chất lượng công vụ, phân cấp địa phương, ràng buộc quyền lực và hội nhập quốc tế của Việt Nam.\n\n§Y=== NĂNG LỰC THỂ CHẾ: 9 TRỤC NHÀ NƯỚC ===§!\n§gThang -10 đến +10. Thanh xanh: nghiêng về cực phải, thanh đỏ: nghiêng về cực trái.§!\n§YT1 Quy mô Bộ máy§!  §gTinh gọn§! [VIE_AxBar_size] §gMở rộng§!  §Y[?VIE_ax_size_norm|0]§!\n§YT2 Kỹ trị / Công vụ§!  §gBảo trợ§! [VIE_AxBar_merit] §gNăng lực§!  §Y[?VIE_ax_merit_norm|0]§!\n§YT3 Phân cấp Lãnh thổ§!  §gTập trung§! [VIE_AxBar_decent] §gPhân cấp§!  §Y[?VIE_ax_decent_norm|0]§!\n§YT4 Ràng buộc Quyền lực§!  §gTập quyền§! [VIE_AxBar_checks] §gPháp quyền§!  §Y[?VIE_ax_checks_norm|0]§!\n§YT5 Kinh tế Thị trường§!  §gNhà nước§! [VIE_AxBar_market] §gThị trường§!  §Y[?VIE_ax_market_norm|0]§!\n§YT6 Quyền Dân sự§!  §gCưỡng chế§! [VIE_AxBar_civil] §gDân sự§!  §Y[?VIE_ax_civil_norm|0]§!\n§YT7 Hội nhập Quốc tế§!  §gTự chủ§! [VIE_AxBar_integ] §gHội nhập§!  §Y[?VIE_ax_integ_norm|0]§!\n§YT8 Huy động Quần chúng§!  §gỔn định§! [VIE_AxBar_mob] §gHuy động§!  §Y[?VIE_ax_mob_norm|0]§!\n§YT9 Gắn kết Phương Tây§!  §gĐộc lập§! [VIE_AxBar_west] §gThân Tây§!  §Y[?VIE_ax_west_norm|0]§!\n§g(Cập nhật hàng tháng và ngay sau khi hoàn thành Focus / Quyết sách. Quyết sách mờ: cần hoàn thành Focus tương ứng.)§!"

 # Decisions:
 VIE_civil_service_examination:0 "Thi tuyển Công chức Cạnh tranh"
 VIE_civil_service_examination_desc:0 "Tổ chức các kỳ thi tuyển dụng công chức minh bạch dựa trên thực tài và chuyên môn thay vì bổ nhiệm theo thâm niên, tăng cường tính kỹ trị của bộ máy."
 VIE_provincial_pilot_program:0 "Giao quyền Thí điểm Thể chế cho Địa phương"
 VIE_provincial_pilot_program_desc:0 "Cho phép các tỉnh/thành năng động thí điểm cơ chế đặc thù và tự chủ thu hút đầu tư, tăng cường tính chủ động và năng lực thích ứng ở cơ sở."
 VIE_streamline_administrative_org:0 "Tinh gọn Đầu mối Bộ máy Hành chính"
 VIE_streamline_administrative_org_desc:0 "Sáp nhập các cơ quan trùng lặp chức năng, tinh giản biên chế và giảm cấp trung gian để nâng cao hiệu lực, hiệu quả quản lý nhà nước."
 VIE_relax_media_scrutiny:0 "Cởi mở Không gian Báo chí & Phản biện Xã hội"
 VIE_relax_media_scrutiny_desc:0 "Tạo điều kiện cho báo chí và các tổ chức xã hội tham gia giám sát, phản biện chính sách, tăng cường trách nhiệm giải trình ngang."
 VIE_strengthen_internal_discipline:0 "Siết chặt Kỷ cương & Trật tự Xã hội"
 VIE_strengthen_internal_discipline_desc:0 "Tăng cường kiểm soát trật tự an ninh nội bộ và kỷ luật hành chính, ưu tiên ổn định chính trị tuyệt đối."
 VIE_negotiate_economic_pact:0 "Đàm phán Thỏa thuận Thương mại & Đầu tư Mới"
 VIE_negotiate_economic_pact_desc:0 "Chủ động xúc tiến các hiệp định kinh tế song phương và đa phương nhằm gắn kết sâu hơn vào chuỗi giá trị toàn cầu."

 # Events:



 vie_axis.4.t:0 "Cảnh báo: Khủng hoảng Thể chế Đa tầng"
 vie_axis.4.d:0 "Sự kết hợp giữa bất ổn chính trị trầm trọng và sự suy giảm nghiêm trọng của các năng lực nhà nước đang đẩy hệ thống vào tình thế nguy hiểm. Nếu không có những biện pháp khẩn cấp để khôi phục lòng tin và trật tự, nguy cơ sụp đổ thể chế và nội chiến sẽ trở thành hiện thực."
 vie_axis.4.a:0 "Tình hình hết sức khẩn cấp!"

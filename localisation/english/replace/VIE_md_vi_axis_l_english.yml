l_english:
 VIE_state_modifier:0 "Mô hình Nhà nước & Năng lực Thể chế"
 VIE_state_modifier_desc:0 "Phản ánh mô hình nhà nước và năng lực thể chế tổng hợp của Việt Nam theo 9 trục phát triển.\n\n§YChỉ số thể chế hiện tại (Chuẩn hóa -10 đến +10):§!\n• Quy mô: §Y[?VIE_ax_size_norm|0]§! | Kỹ trị: §Y[?VIE_ax_merit_norm|0]§! | Phân cấp: §Y[?VIE_ax_decent_norm|0]§!\n• Ràng buộc: §Y[?VIE_ax_checks_norm|0]§! | Thị trường: §Y[?VIE_ax_market_norm|0]§! | Dân sự: §Y[?VIE_ax_civil_norm|0]§!\n• Hội nhập: §Y[?VIE_ax_integ_norm|0]§! | Huy động: §Y[?VIE_ax_mob_norm|0]§! | Thân Tây: §Y[?VIE_ax_west_norm|0]§!"
 VIE_ax_size:0 "Quy mô Bộ máy"
 VIE_ax_size_tt:0 "Quy mô Bộ máy: $RIGHT|+=0$"

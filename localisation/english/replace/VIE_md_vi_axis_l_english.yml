l_english:
 VIE_state_modifier:0 "Mô hình Nhà nước & Năng lực Thể chế"
 VIE_state_modifier_desc:0 "Phản ánh mô hình nhà nước và năng lực thể chế của Việt Nam theo 4 trục: Bộ máy, Chính trị, Kinh tế, Đối ngoại.\n\n§YChỉ số hiện tại (-10 đến +10):§!\n• Năng lực Bộ máy: §Y[?VIE_sb_A|0]§! ([VIE_AxZone_A])\n• Không gian Chính trị: §Y[?VIE_sb_B|0]§! ([VIE_AxZone_B])\n• Mô hình Kinh tế: §Y[?VIE_sb_C|0]§! ([VIE_AxZone_C])\n• Định hướng Đối ngoại: §Y[?VIE_sb_D|0]§! ([VIE_AxZone_D])\n\n§gVùng giữa (-1 đến +1) không có hiệu ứng. Vùng 2 đến 5 nhận một nửa, từ 6 trở đi nhận đủ hiệu ứng của cực.§!"

 # Decisions (each opens event vie_sb.N)
 VIE_sb_apparatus:0 "Cải cách Bộ máy"
 VIE_sb_apparatus_desc:0 "Điều chỉnh cách vận hành bộ máy nhà nước: củng cố đội ngũ hiện có, hoặc thi tuyển cạnh tranh và tinh gọn đầu mối. Mở thêm lựa chọn khi đã có các focus chống tham nhũng và luân chuyển cán bộ."
 VIE_sb_politics:0 "Điều chỉnh Không gian Chính trị"
 VIE_sb_politics_desc:0 "Quyết định mức siết hay nới đối với báo chí, phản biện xã hội và trật tự nội bộ. Siết thì ổn định hơn nhưng kém cởi mở, nới thì ngược lại."
 VIE_sb_economy:0 "Định hướng Kinh tế"
 VIE_sb_economy_desc:0 "Quyết định vai trò của khu vực nhà nước so với thị trường và các địa phương năng động: giữ vai trò chủ đạo của doanh nghiệp nhà nước, hoặc thí điểm cơ chế đặc thù và cởi trói."
 VIE_sb_foreign:0 "Chính sách Đối ngoại"
 VIE_sb_foreign_desc:0 "Quyết định mức độ gắn kết với thế giới: giữ tự chủ chiến lược, hoặc chủ động đàm phán hiệp định thương mại và đầu tư mới."

 # Events vie_sb.1-4
 vie_sb.1.t:0 "Cải cách Bộ máy"
 vie_sb.1.d:0 "Bộ Nội vụ trình phương án điều chỉnh bộ máy. Một bên muốn giữ ổn định đội ngũ cán bộ hiện có, bên kia muốn thi tuyển cạnh tranh và cắt giảm đầu mối. Cả hai đều có cái giá của mình."
 vie_sb.1.a:0 "Củng cố đội ngũ, giữ ổn định cán bộ"
 vie_sb.1.b:0 "Thi tuyển cạnh tranh và tinh gọn đầu mối"
 vie_sb.1.c:0 "Mở chiến dịch chống tham nhũng"
 vie_sb.1.d:0 "Luân chuyển cán bộ chủ chốt"
 vie_sb.2.t:0 "Không gian Chính trị"
 vie_sb.2.d:0 "Dư luận và các cơ quan chức năng đang đưa ra những ý kiến trái chiều về mức độ kiểm soát thông tin và phản biện xã hội."
 vie_sb.2.a:0 "Siết chặt kỷ cương và trật tự xã hội"
 vie_sb.2.b:0 "Cởi mở không gian báo chí và phản biện"
 vie_sb.2.c:0 "Mở tham vấn công chúng về chính sách"
 vie_sb.3.t:0 "Định hướng Kinh tế"
 vie_sb.3.d:0 "Cần quyết định hướng đi cho giai đoạn tới: tăng cường vai trò chủ đạo của kinh tế nhà nước, hay trao thêm quyền thí điểm cho địa phương và khu vực tư nhân."
 vie_sb.3.a:0 "Tăng vai trò chủ đạo của doanh nghiệp nhà nước"
 vie_sb.3.b:0 "Thí điểm cơ chế đặc thù cho địa phương và cởi trói"
 vie_sb.4.t:0 "Chính sách Đối ngoại"
 vie_sb.4.d:0 "Các đối tác đang chờ tín hiệu: Việt Nam nên ưu tiên giữ tự chủ chiến lược hay đẩy nhanh hội nhập qua các hiệp định mới?"
 vie_sb.4.a:0 "Giữ tự chủ chiến lược"
 vie_sb.4.b:0 "Đàm phán hiệp định thương mại và đầu tư mới"

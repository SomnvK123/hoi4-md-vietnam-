 # Category:
 VIE_statebuilding_category:0 "Xây dựng Nhà nước & Năng lực Thể chế"
 VIE_statebuilding_category_desc:0 "Các chính sách điều chỉnh bộ máy, mô hình kinh tế, không gian chính trị và đối ngoại của Việt Nam.\n\n§Y=== NĂNG LỰC THỂ CHẾ: 4 TRỤC NHÀ NƯỚC ===§!\n§gThang -10 đến +10. Thanh xanh: nghiêng về cực phải, thanh đỏ: nghiêng về cực trái. Mỗi quyết sách mở một lựa chọn đẩy trục sang trái hoặc phải.§!\n§YA. Năng lực Bộ máy§!\n   §gBảo trợ§! [VIE_AxBar_A] §gKiến tạo§!\n   §Y[VIE_AxZone_A]§! (§Y[?VIE_sb_A|0]§!)\n§YB. Không gian Chính trị§!\n   §gKiểm soát§! [VIE_AxBar_B] §gPhản biện§!\n   §Y[VIE_AxZone_B]§! (§Y[?VIE_sb_B|0]§!)\n§YC. Mô hình Kinh tế§!\n   §gNhà nước§! [VIE_AxBar_C] §gThị trường§!\n   §Y[VIE_AxZone_C]§! (§Y[?VIE_sb_C|0]§!)\n§YD. Định hướng Đối ngoại§!\n   §gTự chủ§! [VIE_AxBar_D] §gHội nhập§!\n   §Y[VIE_AxZone_D]§! (§Y[?VIE_sb_D|0]§!)\n§g(Cập nhật hàng tháng và ngay sau khi hoàn thành Focus / Quyết sách. Quyết sách mờ: cần hoàn thành Focus tương ứng.)§!"


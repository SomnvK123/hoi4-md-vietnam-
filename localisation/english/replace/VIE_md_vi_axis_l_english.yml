 VIE_negotiated_transition_idea:0 "Chuyển đổi có thương lượng"
 VIE_negotiated_transition_idea_desc:0 "Đảng cầm quyền nhượng bộ từ thế mạnh (Slater & Wong): các bên còn tin nhau, thể chế cũ đóng vai người bảo đảm cho thể chế mới."
 VIE_fragile_transition_idea:0 "Chuyển đổi mong manh"
 VIE_fragile_transition_idea_desc:0 "Dân chủ đến sau sụp đổ hoặc đảo chính, không qua thương lượng: bộ máy đứt gãy, niềm tin thấp. Giảm dần khi Củng cố dân chủ hoàn tất."
 VIE_transition_route_negotiated_tt:0 "Con đường nhượng bộ từ thế mạnh: nhận §GChuyển đổi có thương lượng§! (+5% ổn định, +5% điểm chính trị)."
 VIE_transition_route_fragile_tt:0 "Con đường thay thế sau sụp đổ hoặc đảo chính: nhận §RChuyển đổi mong manh§! (-5% ổn định, -10% điểm chính trị, -5% ủng hộ chiến tranh) và mất 2 điểm chất lượng bộ máy. Bị gỡ khi Củng cố dân chủ hoàn tất."
 VIE_gate_note_tc:0 "Nhánh Tự chủ chiến lược chỉ mở khi cấu hình nhà nước đủ điều kiện: Mức hội nhập <= +4 và Liên kết phương Tây <= +4 (hiện tại: [?VIE_ax_integ_norm|0] / [?VIE_ax_west_norm|0])."
 VIE_gate_note_sec:0 "Nhánh Nhà nước An ninh chỉ mở khi Quyền dân sự <= -8 và Ràng buộc quyền lực <= -2 (hiện tại: [?VIE_ax_civil_norm|0] / [?VIE_ax_checks_norm|0])."
 VIE_gate_note_sez:0 "Nhánh Đặc khu chỉ mở khi Mức thị trường hóa >= +5 và Mức phân cấp >= +3 (hiện tại: [?VIE_ax_market_norm|0] / [?VIE_ax_decent_norm|0])."
 VIE_gate_note_oli:0 "Nhánh Tài phiệt chỉ mở khi Chất lượng bộ máy <= +2 và Mức thị trường hóa >= +3 (hiện tại: [?VIE_ax_merit_norm|0] / [?VIE_ax_market_norm|0])."
 VIE_gate_note_wa:0 "Nhánh Hội đồng Phát triển chỉ mở khi Liên kết phương Tây >= +6, Chất lượng bộ máy >= +5 và Ràng buộc quyền lực <= -4 (hiện tại: [?VIE_ax_west_norm|0] / [?VIE_ax_merit_norm|0] / [?VIE_ax_checks_norm|0])."
 VIE_gate_note_con:0 "Nhánh Bảo vệ nền tảng chỉ mở khi Mức thị trường hóa <= -2 và Mức hội nhập <= +3 (hiện tại: [?VIE_ax_market_norm|0] / [?VIE_ax_integ_norm|0])."
 VIE_gate_note_dev:0 "Nhánh Kiến tạo chỉ mở khi Chất lượng bộ máy >= +4 (hiện tại: [?VIE_ax_merit_norm|0])."

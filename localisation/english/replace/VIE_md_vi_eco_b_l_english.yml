 VIE_dung_quat_refinery:0 "Nhà máy Lọc dầu Dung Quất"
 VIE_dung_quat_refinery_desc:0 "Nhà máy lọc dầu đầu tiên của Việt Nam tại Quảng Ngãi, vận hành từ đầu năm 2009, giảm bớt sự phụ thuộc vào xăng dầu nhập khẩu."
 VIE_shipbuilding_vinashin:0 "Công nghiệp Đóng tàu Vinashin"
 VIE_shipbuilding_vinashin_desc:0 "Tập đoàn Công nghiệp Tàu thủy Việt Nam được đầu tư mạnh để trở thành ngành mũi nhọn. Tăng trưởng nhanh dựa nhiều vào vốn vay, và một khoản nợ lớn đang âm thầm tích tụ."

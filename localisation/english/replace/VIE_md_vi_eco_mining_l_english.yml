l_english:
 # --- VIE_industrialization_strategy / VIE_vinacomin_founding va cum khai khoang moi ---
 VIE_industrialization_strategy:0 "Công nghiệp hóa - Hiện đại hóa"
 VIE_industrialization_strategy_desc:0 "Đại hội Đảng lần thứ IX (4/2001) xác định đường lối đẩy mạnh công nghiệp hóa, hiện đại hóa, phấn đấu đến năm 2020 cơ bản trở thành một nước công nghiệp. Đây là gốc chung cho các chương trình công nghiệp nặng, công nghiệp chế tạo và công nghiệp hỗ trợ."
 VIE_vinacomin_founding:0 "Thành lập Tập đoàn Than - Khoáng sản Việt Nam"
 VIE_vinacomin_founding_desc:0 "Theo Quyết định 345/2005/QĐ-TTg ngày 26/12/2005, Tập đoàn Than Việt Nam và Tổng Công ty Khoáng sản Việt Nam được tổ chức lại thành Tập đoàn Công nghiệp Than - Khoáng sản Việt Nam (TKV / Vinacomin), thống nhất quản lý khai thác than, bô-xít, kim loại màu và đất hiếm."
 VIE_than_quang_ninh:0 "Mở rộng khai thác than Quảng Ninh"
 VIE_than_quang_ninh_desc:0 "Sản lượng than từ bể than Quảng Ninh được đẩy mạnh để đáp ứng nhu cầu của các nhà máy nhiệt điện đang được xây dựng trên cả nước."
 VIE_nui_phao_tungsten:0 "Mỏ Vonfram Núi Pháo"
 VIE_nui_phao_tungsten_desc:0 "Mỏ đa kim Núi Pháo tại huyện Đại Từ, Thái Nguyên đi vào sản xuất thương mại từ quý I/2014, đưa Việt Nam trở thành một trong những nước xuất khẩu vonfram tinh chế lớn trên thế giới ngoài Trung Quốc."
 VIE_thach_khe_mine_start:0 "Khai thác Mỏ sắt Thạch Khê"
 VIE_thach_khe_mine_start_desc:0 "§YGiả định:§! Chính phủ quyết định tiếp tục khai thác mỏ sắt Thạch Khê (Hà Tĩnh), mỏ sắt lớn nhất Đông Nam Á, bất chấp lo ngại về nguy cơ sa mạc hóa và xâm nhập mặn mà dự án từng vấp phải trên thực tế."

l_english:
 VIE_constitution_2013:0 "Hiến pháp 2013"
 VIE_constitution_2013_desc:0 "Hiến pháp sửa đổi năm 2013 khẳng định quyền con người, quyền công dân và vai trò của kinh tế nhiều thành phần với kinh tế nhà nước giữ vai trò chủ đạo. Đây là mốc thể chế quan trọng, đặt khuôn khổ cho các luật về an ninh mạng, đất đai và đầu tư sau này."
 VIE_multilateral_champion:0 "Quốc gia đa phương uy tín"
 VIE_multilateral_champion_desc:0 "Từ gia nhập ASEAN, WTO đến ghế Hội đồng Bảo an và các hiệp định thương mại thế hệ mới, Việt Nam đã trở thành một tiếng nói đáng tin cậy trong các diễn đàn đa phương. Vai trò trung gian và hòa giải mở thêm nhiều cửa ngoại giao."
 VIE_multilateral_champion_idea:0 "Quốc gia đa phương uy tín"
 VIE_multilateral_champion_idea_desc:0 "Tiếng nói đáng tin cậy trong các diễn đàn đa phương mở thêm nhiều cửa ngoại giao."

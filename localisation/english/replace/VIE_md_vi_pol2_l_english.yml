l_english:
 VIE_concentration_of_power:0 "Lãnh đạo hạt nhân: tập trung quyền lực"
 VIE_concentration_of_power_desc:0 "Sau khi Tổng Bí thư kiêm Chủ tịch nước, quyền quyết định tập trung vào một đầu mối. Chính sách đi nhanh hơn, ít phải thương lượng giữa ”Tứ trụ”, nhưng hệ thống yếu kiểm soát ngang sẽ khó tiếp thu phản hồi, khó xử lý đánh đổi và kém thích ứng khi có cú sốc bên ngoài.\n\n§RĐây là con đường lịch sử. Nhánh đối lập chỉ mở nếu bạn chọn giữ lãnh đạo tập thể ở sự kiện tháng 4/2026.§!"
 VIE_institutional_opening:0 "Mở rộng giám sát thể chế"
 VIE_institutional_opening_desc:0 "Giữ mô hình lãnh đạo tập thể và trao thêm quyền cho Quốc hội, Kiểm toán Nhà nước và cơ quan tư pháp. Cái giá là chính sách chậm hơn: mỗi quyết định phải qua nhiều tầng thương lượng và chất vấn hơn, đổi lại ít sai lầm không sửa được. Đây là con đường giả định, không có trong lịch sử.\n\n§YChỉ mở nếu bạn chọn giữ lãnh đạo tập thể ở sự kiện tháng 4/2026.§!"
 VIE_cadre_accountability:0 "Trách nhiệm giải trình của cán bộ"
 VIE_cadre_accountability_desc:0 "Công khai kết luận kỷ luật, buộc người đứng đầu chịu trách nhiệm khi cấp dưới vi phạm. Tăng sức răn đe nhưng cũng làm cán bộ e ngại quyết định, và xáo trộn nhân sự trong ngắn hạn."
 VIE_peoples_oversight:0 "Nhân dân giám sát cán bộ"
 VIE_peoples_oversight_desc:0 "Mở kênh để người dân đánh giá cán bộ và phản ánh sai phạm qua đường dây nóng, cuộc họp cơ sở và nền tảng số. Tốn công quản lý và xử lý phản ánh, nhưng tạo thêm một tầng kiểm soát từ dưới lên."
 VIE_digital_anticorruption:0 "Chống tham nhũng bằng dữ liệu"
 VIE_digital_anticorruption_desc:0 "Đối chiếu kê khai tài sản, thu nhập và giao dịch bằng dữ liệu lớn và định danh điện tử. Phát hiện dấu hiệu bất thường nhanh hơn, nhưng cũng mở rộng phạm vi giám sát công dân."
 VIE_unified_leadership_idea:0 "Lãnh đạo hạt nhân"
 VIE_unified_leadership_idea_desc:0 "Quyền quyết định tập trung: chính sách nhanh hơn nhưng kém tiếp thu phản hồi."
 VIE_institutional_oversight_idea:0 "Giám sát thể chế"
 VIE_institutional_oversight_idea_desc:0 "Nhiều tầng kiểm soát ngang: ổn định hơn, nhưng chính sách chậm hơn."
 VIE_era_of_rising_idea_2:0 "Kỷ nguyên vươn mình (thành tựu)"
 VIE_era_of_rising_idea_2_desc:0 "Một trăm năm sau ngày thành lập Đảng, các cải cách thể chế đã đi tới nơi."
 VIE_tt_concentration_avail:0 "Đã chọn kiêm nhiệm hai chức vụ (sự kiện tháng 4/2026), hoặc sau 30/6/2026 nếu không chọn giữ lãnh đạo tập thể, hoặc đang không theo mô hình Đảng cầm quyền"
 VIE_tt_collective_avail:0 "Đã chọn giữ mô hình lãnh đạo tập thể ở sự kiện tháng 4/2026"
 vie_pol.9.b:0 "Giữ mô hình lãnh đạo tập thể"
 vie_pol.23.t:0 "Lãnh đạo thống nhất quyền lực"
 vie_pol.23.d:0 "Việc kiêm nhiệm hai chức vụ đặt ra câu hỏi về tốc độ: tiến hành ngay để chính sách thông suốt, hay đi từng bước để các cơ quan kịp thích nghi."
 vie_pol.23.a:0 "Tiến hành nhanh"
 vie_pol.23.b:0 "Đi thận trọng"
 vie_pol.24.t:0 "Quốc hội mở rộng giám sát"
 vie_pol.24.d:0 "Với quyền hạn mới, các đại biểu muốn chất vấn trực tiếp các bộ trưởng. Nên để Quốc hội đi thẳng, hay hướng vào kênh báo cáo?"
 vie_pol.24.a:0 "Chất vấn trực tiếp"
 vie_pol.24.b:0 "Giám sát qua báo cáo"
 vie_pol.25.t:0 "Khủng hoảng nhân sự"
 vie_pol.25.d:0 "Một cán bộ cấp cao bị phát hiện sai phạm. Tập trung quyền lực khiến mọi ánh mắt đổ dồn về trung tâm: xử lý công khai hay giải quyết nội bộ?"
 vie_pol.25.a:0 "Kỷ luật công khai"
 vie_pol.25.b:0 "Xử lý nội bộ"
 vie_pol.26.t:0 "Dư luận phản đối trên mạng xã hội"
 vie_pol.26.d:0 "Một chính sách gây tranh cãi lan nhanh trên mạng. Các cơ quan giám sát yêu cầu giải trình."
 vie_pol.26.a:0 "Lắng nghe và điều chỉnh"
 vie_pol.26.b:0 "Kiểm soát luồng thông tin"
 VIE_anticorruption_campaign:0 "Chiến dịch chống tham nhũng"
 VIE_anticorruption_campaign_desc:0 "Một đợt xử lý tập trung sau chiến dịch kỷ luật Đảng. Tốn kém, chậm và làm cán bộ bất an, nhưng giảm một bậc tham nhũng."
 VIE_public_consultation:0 "Tham vấn công chúng"
 VIE_public_consultation_desc:0 "Lấy ý kiến người dân về chính sách trước khi ban hành. Tăng ràng buộc và phân cấp, tốn ít."
 VIE_cadre_rotation:0 "Luân chuyển cán bộ"
 VIE_cadre_rotation_desc:0 "Điều động cán bộ chủ chốt giữa các địa phương để giảm nhóm lợi ích cục bộ. Xáo trộn bộ máy 180 ngày."
 vie_pol.27.t:0 "Bộ luật Lao động 2019 và phê chuẩn Công ước ILO"
 vie_pol.27.d:0 "CPTPP đòi hỏi cho phép người lao động lập tổ chức đại diện của riêng mình, ngoài khuôn khổ Tổng Liên đoàn Lao động. Phê chuẩn đầy đủ Công ước ILO số 98 sẽ mở đường cho EVFTA, nhưng cũng nới lỏng độc quyền đại diện đã có từ lâu."
 vie_pol.27.a:0 "Phê chuẩn đầy đủ"
 vie_pol.27.b:0 "Trì hoãn, giữ độc quyền đại diện"
 VIE_higher_education_law:0 "Luật Giáo dục đại học sửa đổi"
 VIE_higher_education_law_desc:0 "Luật sửa đổi, bổ sung Luật Giáo dục đại học (hiệu lực 7/2019) trao quyền tự chủ cho các trường đại học về học thuật, nhân sự và tài chính, đồng thời đặt ra trách nhiệm giải trình về chất lượng đào tạo và nghiên cứu."
 VIE_education_law_2019:0 "Luật Giáo dục 2019"
 VIE_education_law_2019_desc:0 "Luật Giáo dục 2019 (hiệu lực 7/2020) thống nhất khung hệ thống giáo dục quốc dân, mở đường cho chương trình giáo dục phổ thông mới và tăng đầu tư công cho giáo dục."
 VIE_disaster_law_2013:0 "Luật Phòng, chống thiên tai"
 VIE_disaster_law_2013_desc:0 "Luật Phòng, chống thiên tai 2013 (hiệu lực 5/2014) đặt nền móng pháp lý cho cảnh báo sớm, sơ tán và phương châm \"bốn tại chỗ\", trao thẩm quyền chủ động cho chính quyền cơ sở trước khi bão lũ đổ bộ."
 VIE_civil_defense_law_2023:0 "Luật Phòng thủ dân sự"
 VIE_civil_defense_law_2023_desc:0 "Luật Phòng thủ dân sự 2023 (hiệu lực 7/2024) thiết lập hệ thống chỉ huy thống nhất và lực lượng ứng phó thảm họa, với vai trò nòng cốt của quân đội trong cứu hộ, cứu nạn."
 VIE_infrastructure_development:0 "Phát triển Kết cấu Hạ tầng"
 VIE_infrastructure_development_desc:0 "Hạ tầng giao thông là một trong ba khâu đột phá chiến lược. Đường bộ, đường sắt, hàng không và cảng biển cùng được quy hoạch để nối liền các vùng kinh tế, giảm chi phí logistics và tạo nền tảng cho tăng trưởng dài hạn."

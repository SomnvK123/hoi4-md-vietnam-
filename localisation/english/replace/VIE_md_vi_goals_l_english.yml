l_english:
 # --- Dich phat trien 2030-2045: 3 focus moi ---
 VIE_carbon_circular_economy:0 "Thị trường carbon và kinh tế tuần hoàn"
 VIE_carbon_circular_economy_desc:0 "Theo lộ trình của Nghị định 06/2022/NĐ-CP, đến hết năm 2027 Việt Nam xây dựng khung pháp lý và thí điểm; từ năm 2028 sàn giao dịch tín chỉ carbon trong nước vận hành chính thức. Doanh nghiệp phải kê khai và cắt giảm phát thải, chất thải công nghiệp được tái chế thành nguyên liệu đầu vào, mở ra nguồn vốn xanh từ quốc tế."
 VIE_productivity_leap:0 "Bước nhảy năng suất"
 VIE_productivity_leap_desc:0 "Để vượt bẫy thu nhập trung bình, tăng trưởng phải chuyển từ dựa vào vốn và lao động giá rẻ sang dựa vào năng suất. Khoa học, công nghệ và đổi mới sáng tạo trở thành động lực chính, đúng tinh thần Nghị quyết 57-NQ/TW."
 VIE_ageing_society:0 "Thích ứng với già hóa dân số"
 VIE_ageing_society_desc:0 "Theo dự báo của Tổng cục Thống kê và UNFPA, Việt Nam chỉ mất khoảng 25 năm để tỷ lệ người từ 65 tuổi trở lên tăng từ 7% lên 14% và bước vào giai đoạn dân số già khoảng năm 2036. Hệ thống hưu trí, bảo hiểm xã hội và chăm sóc người cao tuổi phải mở rộng trước khi cơ cấu dân số vàng khép lại."

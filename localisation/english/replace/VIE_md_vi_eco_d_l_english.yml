l_english:
 # --- Đặc khu 2018 ---
 VIE_sez_three_zones:0 "Đề án Ba Đặc khu Kinh tế"
 VIE_sez_three_zones_desc:0 "Chính phủ soạn thảo dự án ba đơn vị hành chính - kinh tế đặc biệt Vân Đồn, Bắc Vân Phong, Phú Quốc, chuẩn bị trình Quốc hội."
 VIE_sez_postpone:0 "Hoãn Luật Đặc khu"
 VIE_sez_postpone_desc:0 "Trước phản ứng của dư luận, Quốc hội lùi việc thông qua dự luật đặc khu sang kỳ họp sau. Dự luật không bao giờ được đưa trở lại."
 VIE_sez_pass_99:0 "Thông qua Luật Đặc khu (thuê đất tới 99 năm)"
 VIE_sez_pass_99_desc:0 "§YGiả định:§! Quốc hội thông qua luật đặc khu với điều khoản cho thuê đất tới 99 năm. FDI và xây dựng tăng mạnh ở ba khu vực, nhưng dư luận vẫn còn âm ỉ."
 VIE_island_special_zones:0 "Đặc khu trong Chính quyền Hai cấp"
 VIE_island_special_zones_desc:0 "Từ 1/7/2025, các huyện đảo Vân Đồn, Phú Quốc, Côn Đảo trở thành đơn vị hành chính cấp xã đặc biệt trong mô hình chính quyền hai cấp, thay cho đạo luật đặc khu riêng đã không bao giờ được thông qua."
 VIE_sez_strategic_investors:0 "Nhà đầu tư Chiến lược vào Đặc khu"
 VIE_sez_strategic_investors_desc:0 "§YGiả định:§! Các tập đoàn lớn đổ vốn vào casino, bất động sản nghỉ dưỡng và cảng biển tại ba đặc khu."

 # --- Mở rộng Hà Nội 2008 ---

 # --- Bauxite Tây Nguyên 2009 ---
 VIE_bauxite_suspend:0 "Dừng Khai thác Bauxite Tây Nguyên"
 VIE_bauxite_suspend_desc:0 "§YGiả định:§! Trước lo ngại về môi trường và an ninh Tây Nguyên, dự án khai thác bauxite Tân Rai và Nhân Cơ bị dừng lại."

 # --- Đường sắt tốc độ cao 2010 ---
 VIE_hsr_2010_reject:0 "Quốc hội Bác Dự án Đường sắt Cao tốc"
 VIE_hsr_2010_reject_desc:0 "Ngày 19/6/2010, Quốc hội bác dự án đường sắt tốc độ cao Bắc - Nam trị giá khoảng 56 tỷ USD, cho rằng chưa đủ điều kiện."
 VIE_hsr_2010_approve:0 "Thông qua Dự án Đường sắt Cao tốc (2010)"
 VIE_hsr_2010_approve_desc:0 "§YGiả định:§! Quốc hội thông qua dự án ngay năm 2010. Công trình khởi công sớm hơn 14 năm so với lịch sử, nhưng khoản vay khổng lồ đè nặng lên ngân sách suốt một thập niên."

 # --- Vàng miếng 2012 ---
 VIE_gold_monopoly_2012:0 "Nhà nước Độc quyền Vàng miếng"
 VIE_gold_monopoly_2012_desc:0 "Nghị định 24/2012/NĐ-CP đặt sản xuất vàng miếng dưới độc quyền Nhà nước, nhằm chống tình trạng 'vàng hóa' nền kinh tế."
 VIE_gold_free_market:0 "Thả nổi Thị trường Vàng"
 VIE_gold_free_market_desc:0 "§YGiả định:§! Thị trường vàng miếng được tự do hóa. Vốn lưu thông dễ hơn, nhưng áp lực lên tỷ giá tăng lên."
 VIE_gold_monopoly_lifted:0 "Bỏ Độc quyền Vàng miếng"
 VIE_gold_monopoly_lifted_desc:0 "Sau 13 năm, Nhà nước nới lỏng độc quyền sản xuất vàng miếng, cho phép thêm doanh nghiệp tham gia thị trường."

 # --- Ngân hàng yếu kém 2015 ---
 VIE_zero_dong_acquisition:0 "Mua lại Ngân hàng Yếu kém Giá 0 Đồng"
 VIE_zero_dong_acquisition_desc:0 "Ngân hàng Nhà nước mua lại bắt buộc VNCB, OceanBank và GPBank với giá 0 đồng, ngăn đổ vỡ dây chuyền."
 VIE_bank_bankruptcy:0 "Cho phép Ngân hàng Yếu kém Phá sản"
 VIE_bank_bankruptcy_desc:0 "§YGiả định:§! Các ngân hàng yếu kém được xử lý theo thủ tục phá sản có kiểm soát thay vì Nhà nước gánh nợ. Thị trường kỷ luật hơn, nhưng người gửi tiền hoảng loạn."
 VIE_compulsory_transfer_2024:0 "Chuyển giao Bắt buộc cho Ngân hàng Lớn"
 VIE_compulsory_transfer_2024_desc:0 "Các ngân hàng 0 đồng được chuyển giao bắt buộc cho các ngân hàng thương mại lớn, khép lại gần một thập niên xử lý hậu quả."

 # --- Tái cơ cấu DNNN 2017 ---
 VIE_soe_gradual_restructuring:0 "Cơ cấu lại DNNN theo Lộ trình"
 VIE_soe_gradual_restructuring_desc:0 "Nghị quyết 12-NQ/TW giữ mô hình tập đoàn, cổ phần hóa từng bước và lập Ủy ban Quản lý vốn nhà nước tại doanh nghiệp."
 VIE_soe_rapid_divestment:0 "Thoái vốn Nhanh khỏi DNNN"
 VIE_soe_rapid_divestment_desc:0 "§YGiả định:§! Nhà nước bán nhanh cổ phần tại các tập đoàn lớn, thu về ngân sách một khoản lớn nhưng gây tranh cãi về giá bán."

 # --- Giá FIT điện mặt trời 2017 ---
 VIE_solar_auction:0 "Đấu thầu Cạnh tranh Điện Mặt trời"
 VIE_solar_auction_desc:0 "§YGiả định:§! Thay vì giá mua điện cố định, các dự án điện mặt trời phải đấu thầu cạnh tranh, tránh bùng nổ công suất mất kiểm soát."

 # --- COVID-19 2021 ---

 # --- Event: bỏ phiếu vie_alt.6 (đã đổi vai trò), vie_eco.30 mới ---
 vie_eco.30.t:0 "Bán rẻ Tài sản Nhà nước?"
 vie_eco.30.d:0 "Một năm sau đợt thoái vốn nhanh, báo chí đặt câu hỏi về việc một số tài sản nhà nước được bán cho các nhóm lợi ích với giá thấp hơn thị trường."
 vie_eco.30.a:0 "Công khai điều khoản mua bán"
 vie_eco.30.b:0 "Giữ kín người mua và giá bán"

 # --- Idea ---
 VIE_bauxite_environmental_idea:0 "Giám sát Môi trường Tây Nguyên"
 VIE_bauxite_environmental_idea_desc:0 "Quy trình đánh giá tác động môi trường chặt chẽ hơn làm chậm các dự án công nghiệp mới trong khu vực."
 VIE_grid_curtailment_idea:0 "Quá tải Lưới truyền tải"
 VIE_grid_curtailment_idea_desc:0 "Công suất điện mặt trời tăng nhanh hơn khả năng giải tỏa của lưới điện, buộc phải cắt giảm sản lượng."
 VIE_gold_pressure_idea:0 "Áp lực Tỷ giá từ Thị trường Vàng"
 VIE_gold_pressure_idea_desc:0 "Vàng lưu thông tự do kéo theo dòng ngoại tệ ra vào khó kiểm soát hơn, gây áp lực lên tỷ giá."
 VIE_deposit_confidence_idea:0 "Mất Niềm tin vào Tiền gửi Ngân hàng"
 VIE_deposit_confidence_idea_desc:0 "Sau khi chứng kiến một ngân hàng phá sản, người gửi tiền rút vốn khỏi các ngân hàng nhỏ và vừa."

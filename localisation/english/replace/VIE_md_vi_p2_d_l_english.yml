l_english:

 VIE_hanoi_air_quality:0 "Làm sạch không khí Hà Nội"
 VIE_hanoi_air_quality_desc:0 "Xe cũ bị hạn chế, bếp than được loại bỏ dần và không khí được giám sát theo thời gian thực."
 VIE_sci_digital_root:0 "Khoa học, Công nghệ và Chuyển đổi số"
 VIE_sci_digital_root_desc:0 "Khoa học công nghệ, đổi mới sáng tạo và chuyển đổi số được coi là một đột phá chung, thay vì các chương trình riêng lẻ."
 VIE_internet_expansion:0 "Đưa internet đến mọi xã"
 VIE_internet_expansion_desc:0 "Cáp quang và cột phát sóng di động đến từng làng, và cả nước lên mạng."
 VIE_mobile_networks:0 "Từ 4G đến 5G"
 VIE_mobile_networks_desc:0 "5G thương mại vận hành ở các thành phố lớn và lan ra phần còn lại của đất nước."
 VIE_cashless_payments:0 "Thanh toán không tiền mặt"
 VIE_cashless_payments_desc:0 "Điện thoại trở thành ví, và các cửa hàng nhỏ nhận thanh toán bằng quét mã."
 VIE_digital_id:0 "Định danh điện tử"
 VIE_digital_id_desc:0 "Một mã định danh điện tử nối công dân với các dịch vụ họ cần, và với nhà nước."
 VIE_national_data_center:0 "Trung tâm Dữ liệu Quốc gia"
 VIE_national_data_center_desc:0 "Một trung tâm dữ liệu quốc gia bảo mật lưu hồ sơ của nhà nước và cung cấp dịch vụ đám mây cho doanh nghiệp."
 VIE_ai_strategy:0 "Chiến lược AI quốc gia"
 VIE_ai_strategy_desc:0 "Một chiến lược về nghiên cứu, dữ liệu và kỹ năng, với mục tiêu có chỗ đứng trong nhóm các nước dẫn đầu khu vực."
 VIE_digital_nation:0 "Quốc gia số"
 VIE_digital_nation_desc:0 "Chính phủ, ngân hàng và cửa hàng cùng chạy trên một nền tảng số, và gần như ai cũng trực tuyến."
 VIE_nafosted:0 "Quỹ Khoa học và Công nghệ"
 VIE_nafosted_desc:0 "Một quỹ quốc gia cấp kinh phí dựa trên phản biện đồng nghiệp thay vì thâm niên."
 VIE_research_universities:0 "Đại học nghiên cứu"
 VIE_research_universities_desc:0 "Hai đại học quốc gia và một vài trường khác được cấp kinh phí để cạnh tranh nhân tài ở nước ngoài."
 VIE_earth_observation:0 "Vệ tinh quan sát Trái đất"
 VIE_earth_observation_desc:0 "Việt Nam phóng vệ tinh chụp ảnh của riêng mình để theo dõi bờ biển, sông ngòi và mùa màng."
 VIE_nuclear_research:0 "Nghiên cứu hạt nhân"
 VIE_nuclear_research_desc:0 "Lò phản ứng nghiên cứu ở Đà Lạt được tu bổ, và một thế hệ kỹ sư hạt nhân mới được đào tạo."
 VIE_science_breakthrough:0 "Đột phá khoa học và công nghệ"
 VIE_science_breakthrough_desc:0 "Nghị quyết 57 đặt nghiên cứu, kỹ năng số và đổi mới sáng tạo lên trên mọi thứ khác trong ngân sách."
 VIE_chip_design:0 "Các công ty thiết kế chip"
 VIE_chip_design_desc:0 "Các công ty thiết kế mọc lên quanh các nhà máy chế tạo nước ngoài, và một số nhận làm sản phẩm riêng."
 VIE_chip_engineers:0 "Năm mươi nghìn kỹ sư chip"
 VIE_chip_engineers_desc:0 "Các trường đại học và doanh nghiệp lập chương trình đào tạo lực lượng lao động mà ngành cần."
 VIE_semiconductor_fab:0 "Nhà máy chế tạo chip đầu tiên"
 VIE_semiconductor_fab_desc:0 "Một nhà máy trong nước tự làm chip của mình là dự án khó nhất trong ngành."
 VIE_sec_public_order:0 "Chiến dịch giữ gìn trật tự công cộng"
 VIE_sec_public_order_desc:0 "Tội phạm đường phố, biểu tình và tin đồn đều bị coi là mối đe dọa đối với trật tự và bị đáp lại bằng cảnh sát."
 VIE_sec_cyber_sovereignty:0 "Chủ quyền không gian mạng"
 VIE_sec_cyber_sovereignty_desc:0 "Internet bị bịt sau một bức tường lửa quốc gia, và các nền tảng nước ngoài phải tuân thủ hoặc rời đi."
 VIE_sec_loyalty_vetting:0 "Thẩm tra lòng trung thành"
 VIE_sec_loyalty_vetting_desc:0 "Mọi sĩ quan, quan chức và nhà quản lý đều bị kiểm tra lòng trung thành, và kẻ không trung thành bị loại bỏ."
 VIE_sec_border_control:0 "Kiểm soát biên giới"
 VIE_sec_border_control_desc:0 "Các cửa khẩu bị phong tỏa và các đường dây buôn lậu bị triệt phá."
 VIE_sec_managed_opening:0 "Một cuộc mở cửa có quản lý"
 VIE_sec_managed_opening_desc:0 "Các cơ quan quyết định đã đến lúc nới tay, theo điều kiện của họ. Điều này có thể dẫn đến một hội đồng phát triển, hoặc trở lại trật tự cũ."
 VIE_new_rural_development:0 "Chương trình Xây dựng Nông thôn mới"
 VIE_new_rural_development_desc:0 "Một chương trình quốc gia đưa đường sá, trạm y tế, trường học và nước sạch đến các làng quê, và yêu cầu mỗi xã đạt một danh sách tiêu chuẩn."
 VIE_energy_security_2045:0 "An ninh năng lượng quốc gia"
 VIE_energy_security_2045_desc:0 "Nghị quyết của Bộ Chính trị về năng lượng đặt mục tiêu đến 2030 và tầm nhìn đến 2045: dự trữ, điện sạch, kết nối xuyên biên giới và một lưới điện có khả năng chống chịu."
 VIE_us_engagement:0 "Bình thường hóa quan hệ với Hoa Kỳ"
 VIE_us_engagement_desc:0 "Quan hệ ngoại giao được khôi phục năm 1995. Một tổng thống Mỹ thăm Hà Nội trước khi năm kết thúc, lần đầu tiên kể từ khi chiến tranh chấm dứt."

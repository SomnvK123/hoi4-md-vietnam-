l_english:

 VIE_grassroots_clinics_desc:0 "Xã nào cũng có một trạm y tế, và trạm nào cũng có bác sĩ ít nhất một phần trong tuần."
 VIE_vaccine_production:0 "Sản xuất vắc-xin trong nước"
 VIE_vaccine_production_desc:0 "Các nhà máy trong nước sản xuất vắc-xin theo giấy phép, rồi theo thiết kế của chính mình."
 VIE_hospital_decongestion:0 "Giảm quá tải bệnh viện"
 VIE_hospital_decongestion_desc:0 "Bệnh viện vệ tinh và quy tắc chuyển tuyến tốt hơn giảm áp lực cho các bệnh viện trung ương."
 VIE_preventive_health:0 "Y tế dự phòng"
 VIE_preventive_health_desc:0 "Sàng lọc, tiêm chủng và các trạm y tế bắt bệnh trước khi lây lan."
 VIE_forest_protection:0 "Bảo vệ rừng"
 VIE_forest_protection_desc:0 "Lệnh cấm khai thác gỗ và hợp đồng trồng lại rừng làm chậm việc mất độ che phủ rừng."
 VIE_hanoi_air_quality:0 "Làm sạch không khí Hà Nội"
 VIE_hanoi_air_quality_desc:0 "Xe cũ bị hạn chế, bếp than được loại bỏ dần và không khí được giám sát theo thời gian thực."
 VIE_plastic_waste:0 "Cắt giảm rác thải nhựa"
 VIE_plastic_waste_desc:0 "Nhựa dùng một lần bị loại bỏ dần và các nhà sản xuất lớn nhất phải tái chế."
 VIE_internet_expansion:0 "Đưa internet đến mọi xã"
 VIE_internet_expansion_desc:0 "Cáp quang và cột phát sóng di động đến từng làng, và cả nước lên mạng."
 VIE_mobile_networks:0 "Từ 4G đến 5G"
 VIE_mobile_networks_desc:0 "5G thương mại vận hành ở các thành phố lớn và lan ra phần còn lại của đất nước."
 VIE_cashless_payments:0 "Thanh toán không tiền mặt"
 VIE_cashless_payments_desc:0 "Điện thoại trở thành ví, và các cửa hàng nhỏ nhận thanh toán bằng quét mã."
 VIE_digital_id:0 "Định danh điện tử"
 VIE_digital_id_desc:0 "Một mã định danh điện tử nối công dân với các dịch vụ họ cần, và với nhà nước."
 VIE_national_data_center:0 "Trung tâm Dữ liệu Quốc gia"
 VIE_national_data_center_desc:0 "Một trung tâm dữ liệu quốc gia bảo mật lưu hồ sơ của nhà nước và cung cấp dịch vụ đám mây cho doanh nghiệp."
 VIE_ai_strategy:0 "Chiến lược AI quốc gia"
 VIE_ai_strategy_desc:0 "Một chiến lược về nghiên cứu, dữ liệu và kỹ năng, với mục tiêu có chỗ đứng trong nhóm các nước dẫn đầu khu vực."
 VIE_digital_nation:0 "Quốc gia số"
 VIE_digital_nation_desc:0 "Chính phủ, ngân hàng và cửa hàng cùng chạy trên một nền tảng số, và gần như ai cũng trực tuyến."
 VIE_nafosted:0 "Quỹ Khoa học và Công nghệ"
 VIE_nafosted_desc:0 "Một quỹ quốc gia cấp kinh phí dựa trên phản biện đồng nghiệp thay vì thâm niên."
 VIE_research_universities:0 "Đại học nghiên cứu"
 VIE_research_universities_desc:0 "Hai đại học quốc gia và một vài trường khác được cấp kinh phí để cạnh tranh nhân tài ở nước ngoài."
 VIE_earth_observation:0 "Vệ tinh quan sát Trái đất"
 VIE_earth_observation_desc:0 "Việt Nam phóng vệ tinh chụp ảnh của riêng mình để theo dõi bờ biển, sông ngòi và mùa màng."
 VIE_nuclear_research:0 "Nghiên cứu hạt nhân"
 VIE_nuclear_research_desc:0 "Lò phản ứng nghiên cứu ở Đà Lạt được tu bổ, và một thế hệ kỹ sư hạt nhân mới được đào tạo."
 VIE_science_breakthrough:0 "Đột phá khoa học và công nghệ"
 VIE_science_breakthrough_desc:0 "Nghị quyết 57 đặt nghiên cứu, kỹ năng số và đổi mới sáng tạo lên trên mọi thứ khác trong ngân sách."
 VIE_chip_design:0 "Các công ty thiết kế chip"
 VIE_chip_design_desc:0 "Các công ty thiết kế mọc lên quanh các nhà máy chế tạo nước ngoài, và một số nhận làm sản phẩm riêng."
 VIE_chip_engineers:0 "Năm mươi nghìn kỹ sư chip"
 VIE_chip_engineers_desc:0 "Các trường đại học và doanh nghiệp lập chương trình đào tạo lực lượng lao động mà ngành cần."
 VIE_semiconductor_fab:0 "Nhà máy chế tạo chip đầu tiên"
 VIE_semiconductor_fab_desc:0 "Một nhà máy trong nước tự làm chip của mình là dự án khó nhất trong ngành."
 VIE_meritocratic_service:0 "Nền công vụ dựa trên năng lực"
 VIE_meritocratic_service_desc:0 "Thi tuyển cạnh tranh, nhiệm kỳ cố định và niêm yết công khai các vị trí thay cho quan hệ bảo trợ."
 VIE_judicial_reform:0 "Một nền tư pháp chuyên nghiệp"
 VIE_judicial_reform_desc:0 "Thẩm phán được bổ nhiệm theo năng lực, trả lương xứng đáng và được che chắn khỏi những cú điện thoại."
 VIE_performance_legitimacy:0 "Tính chính danh nhờ kết quả"
 VIE_performance_legitimacy_desc:0 "Quyền cầm quyền của Đảng dựa vào những gì Đảng mang lại, và Đảng công bố các con số."
 VIE_singapore_model:0 "Mô hình Singapore"
 VIE_singapore_model_desc:0 "Cán bộ giỏi, quy tắc nghiêm, thị trường mở: một nhà nước kỹ trị chịu trách nhiệm về kết quả."
 VIE_anti_peaceful_evolution:0 "Chống 'diễn biến hòa bình'"
 VIE_anti_peaceful_evolution_desc:0 "Công tác tư tưởng được đẩy mạnh chống lại cái mà Đảng gọi là chiến dịch chậm rãi nhằm làm xói mòn sự cầm quyền từ bên trong."
 VIE_ideological_fortress:0 "Pháo đài tư tưởng"
 VIE_ideological_fortress_desc:0 "Trường học, truyền thông và chi bộ bảo vệ đường lối chính thức và chống ảnh hưởng từ bên ngoài."
 VIE_front_coalition:0 "Liên minh trong Mặt trận"
 VIE_front_coalition_desc:0 "Các đảng và tổ chức khác được mời ngồi trong Mặt trận Tổ quốc bên cạnh Đảng."
 VIE_vetted_elections:0 "Bầu cử có hiệp thương"
 VIE_vetted_elections_desc:0 "Nhiều ứng viên hơn được ra tranh cử, và Mặt trận hiệp thương giới thiệu họ. Quốc hội có thêm vài tiếng nói độc lập."
 VIE_loyal_opposition:0 "Phe đối lập trung thành"
 VIE_loyal_opposition_desc:0 "Một vài tiếng nói được phép bất đồng công khai, miễn là chấp nhận vai trò lãnh đạo của Đảng."
 VIE_revive_democratic_party:0 "Khôi phục Đảng Dân chủ"
 VIE_revive_democratic_party_desc:0 "Đảng bị giải thể năm 1988 được phép mở lại, với một phần nhỏ số ghế."
 VIE_revive_socialist_party:0 "Khôi phục Đảng Xã hội"
 VIE_revive_socialist_party_desc:0 "Đảng kia bị đóng cửa năm 1988 cũng được phép trở lại, với một phần nhỏ số ghế."
 VIE_tc_import_substitution:0 "Thay thế nhập khẩu"
 VIE_tc_import_substitution_desc:0 "Các nhà máy từng mua linh kiện từ Trung Quốc học cách tự làm, hoặc mua từ nơi khác. Việc này mất nhiều năm."
 VIE_tc_nonaligned_summit:0 "Đăng cai Hội nghị thượng đỉnh Không liên kết"
 VIE_tc_nonaligned_summit_desc:0 "Lãnh đạo các nước không liên kết họp tại Hà Nội. Tiếng nói của đất nước vang xa hơn khu vực."
 VIE_tc_workers_councils:0 "Hội đồng công nhân"
 VIE_tc_workers_councils_desc:0 "Các hội đồng được bầu trong nhà máy cùng tham gia quyết định về lương, giờ làm và đầu tư."
 VIE_tc_arms_diversification:0 "Đa dạng hóa nhà cung cấp vũ khí"
 VIE_tc_arms_diversification_desc:0 "Việt Nam mua từ Nga, Ấn Độ, Israel và những nước khác, để không nhà cung cấp nào có thể khóa vòi."
 VIE_tc_asean_bloc:0 "Một khối không liên kết trong ASEAN"
 VIE_tc_asean_bloc_desc:0 "Việt Nam đề xuất một khối các nước trong khu vực không chọn phe giữa các cường quốc."
 VIE_tc_market_socialism:0 "Một dạng chủ nghĩa xã hội thị trường mới"
 VIE_tc_market_socialism_desc:0 "Các doanh nghiệp hợp tác xã và tập thể cạnh tranh bình đẳng với doanh nghiệp tư nhân, và công nhân chia sẻ lợi nhuận."
 VIE_tc_rare_earth_leverage:0 "Đất hiếm như đòn bẩy"
 VIE_tc_rare_earth_leverage_desc:0 "Kiểm soát quặng cho Hà Nội một đòn bẩy đối với mọi người mua cần nó."
 VIE_tc_mekong_leadership:0 "Dẫn dắt Tiểu vùng Mê Kông"
 VIE_tc_mekong_leadership_desc:0 "Lào và Campuchia tìm thấy ở Hà Nội một người dẫn đường thân thiện, và có lợi ích rõ ràng."
 VIE_tc_eastern_yugoslavia:0 "Nam Tư của phương Đông"
 VIE_tc_eastern_yugoslavia_desc:0 "Một con đường giữa xã hội chủ nghĩa ổn định, độc lập, được nhiều người ngưỡng mộ và ít người bắt chước."
 VIE_lb_van_don:0 "Đặc khu Vân Đồn"
 VIE_lb_van_don_desc:0 "Một khu tự do trên bờ biển Đông Bắc, với sân bay và cảng mới."
 VIE_lb_bac_van_phong:0 "Đặc khu Bắc Vân Phong"
 VIE_lb_bac_van_phong_desc:0 "Một khu nước sâu trên bờ biển Nam Trung Bộ, nhắm vào vận tải container và công nghiệp nặng."
 VIE_lb_phu_quoc:0 "Đặc khu Phú Quốc"
 VIE_lb_phu_quoc_desc:0 "Một hòn đảo của các khu nghỉ dưỡng và cửa hàng miễn thuế với quy tắc riêng."
 VIE_lb_free_port:0 "Cảng tự do"
 VIE_lb_free_port_desc:0 "Hàng hóa ra vào không thuế, và đặc khu trở thành trung tâm của khu vực."
 VIE_lb_casino_resorts:0 "Khu nghỉ dưỡng sòng bạc"
 VIE_lb_casino_resorts_desc:0 "Các sòng bạc được cấp phép hứa hẹn ngoại tệ và kéo theo những vấn đề riêng."
 VIE_lb_digital_assets:0 "Trung tâm tài sản số"
 VIE_lb_digital_assets_desc:0 "Các sàn giao dịch và công ty thanh toán được mời đăng ký trong đặc khu, và một vài công ty không như vẻ ngoài."
 VIE_lb_sovereignty_safeguards:0 "Các biện pháp bảo vệ chủ quyền"
 VIE_lb_sovereignty_safeguards_desc:0 "Giới hạn về thời hạn thuê, sở hữu đất của người nước ngoài và phạm vi của luật đặc khu được viết lại vào."
 VIE_ol_bank_capture:0 "Thâu tóm các ngân hàng"
 VIE_ol_bank_capture_desc:0 "Các tập đoàn nắm quyền kiểm soát các ngân hàng vốn từng kiềm chế họ."
 VIE_ol_land_bank:0 "Quỹ đất của các tập đoàn"
 VIE_ol_land_bank_desc:0 "Những mảnh đất rộng lớn được giữ để phát triển, và những người từng canh tác chúng bị di dời."
 VIE_ol_political_donations:0 "Đóng góp chính trị"
 VIE_ol_political_donations_desc:0 "Tiền chảy đến mọi phe, và phe nào cũng nhớ ai đã trả."
 VIE_ol_private_security:0 "An ninh tư nhân"
 VIE_ol_private_security_desc:0 "Các tập đoàn lớn nhất có đội bảo vệ riêng, và đội bảo vệ giữ trật tự, với một cái giá."
 VIE_ol_offshore_wealth:0 "Tiền chuyển ra nước ngoài"
 VIE_ol_offshore_wealth_desc:0 "Các gia sản được cất ở nước ngoài, và đất nước nghèo đi vì thế."
 VIE_ol_golden_visa:0 "Thị thực vàng"
 VIE_ol_golden_visa_desc:0 "Quyền cư trú được bán cho nhà đầu tư muốn có hộ chiếu thứ hai, và nhà nước nhận tiền."
 VIE_ol_tycoon_diplomacy:0 "Ngoại giao của các đại gia"
 VIE_ol_tycoon_diplomacy_desc:0 "Các lãnh đạo doanh nghiệp mở những cánh cửa ở nước ngoài mà bộ ngoại giao không mở được."
 VIE_wa_five_year_plans:0 "Kế hoạch năm năm kiểu Đông Á"
 VIE_wa_five_year_plans_desc:0 "Chỉ tiêu tăng trưởng, tín dụng cho nhà xuất khẩu và một cơ quan kế hoạch chọn người thắng cuộc."
 VIE_wa_japan_capital:0 "Vốn Nhật Bản"
 VIE_wa_japan_capital_desc:0 "Ngân hàng và công ty Nhật Bản được thu hút bằng bảo lãnh và đất đai."
 VIE_wa_cam_ranh_access:0 "Cam Ranh cho người Mỹ"
 VIE_wa_cam_ranh_access_desc:0 "Tàu của Hải quân Hoa Kỳ có thể dùng Cam Ranh để tiếp liệu và sửa chữa. Bắc Kinh nhìn thấy lựa chọn này đúng như bản chất của nó."
 VIE_wa_technical_education:0 "Giáo dục kỹ thuật"
 VIE_wa_technical_education_desc:0 "Các trường bách khoa và học nghề đào tạo kỹ sư và kỹ thuật viên mà kế hoạch cần."
 VIE_wa_korea_partnership:0 "Học hỏi Hàn Quốc"
 VIE_wa_korea_partnership_desc:0 "Cố vấn Hàn Quốc giúp thiết kế kế hoạch, ngân hàng và trường học."
 VIE_wa_new_countryside:0 "Phong trào Nông thôn mới"
 VIE_wa_new_countryside_desc:0 "Đường sá, trường học và hợp tác xã đưa làng quê đi cùng với thành phố."
 VIE_wa_anti_corruption_purge:0 "Thanh trừng kẻ tham nhũng"
 VIE_wa_anti_corruption_purge_desc:0 "Hội đồng điều tra, từ trên xuống, tất cả những ai hưởng lợi từ kế hoạch mà không phục vụ nó."
 VIE_wa_prepare_transition:0 "Chuẩn bị chuyển đổi"
 VIE_wa_prepare_transition_desc:0 "Hội đồng bắt đầu nới tay, để cú sốc khi mở cửa hệ thống nhẹ hơn."
 VIE_wa_economic_miracle:0 "Phép màu kinh tế"
 VIE_wa_economic_miracle_desc:0 "Một thế hệ tăng trưởng rất nhanh biến một nước nghèo thành một nước giàu."
 VIE_sec_public_order:0 "Chiến dịch giữ gìn trật tự công cộng"
 VIE_sec_public_order_desc:0 "Tội phạm đường phố, biểu tình và tin đồn đều bị coi là mối đe dọa đối với trật tự và bị đáp lại bằng cảnh sát."
 VIE_sec_cyber_sovereignty:0 "Chủ quyền không gian mạng"
 VIE_sec_cyber_sovereignty_desc:0 "Internet bị bịt sau một bức tường lửa quốc gia, và các nền tảng nước ngoài phải tuân thủ hoặc rời đi."
 VIE_sec_loyalty_vetting:0 "Thẩm tra lòng trung thành"
 VIE_sec_loyalty_vetting_desc:0 "Mọi sĩ quan, quan chức và nhà quản lý đều bị kiểm tra lòng trung thành, và kẻ không trung thành bị loại bỏ."
 VIE_sec_border_control:0 "Kiểm soát biên giới"
 VIE_sec_border_control_desc:0 "Các cửa khẩu bị phong tỏa và các đường dây buôn lậu bị triệt phá."
 VIE_sec_managed_opening:0 "Một cuộc mở cửa có quản lý"
 VIE_sec_managed_opening_desc:0 "Các cơ quan quyết định đã đến lúc nới tay, theo điều kiện của họ. Điều này có thể dẫn đến một hội đồng phát triển, hoặc trở lại trật tự cũ."
 VIE_dm_truth_reconciliation:0 "Ủy ban Sự thật và Hòa giải"
 VIE_dm_truth_reconciliation_desc:0 "Một ủy ban lắng nghe nạn nhân và bị cáo và công bố những gì đã xảy ra. Dân tộc đọc nó, trong đau đớn."
 VIE_dm_lib_market_opening:0 "Mở cửa các thị trường"
 VIE_dm_lib_market_opening_desc:0 "Hành động đầu tiên của Đảng Dân chủ là cắt giấy phép, thuế quan và độc quyền nhà nước."
 VIE_dm_lib_independent_anticorruption:0 "Cơ quan chống tham nhũng độc lập"
 VIE_dm_lib_independent_anticorruption_desc:0 "Một cơ quan nằm ngoài chính phủ, có ngân sách và tòa án riêng, truy đuổi kẻ tham nhũng."
 VIE_dm_lib_free_trade:0 "Thương mại tự do"
 VIE_dm_lib_free_trade_desc:0 "Các hiệp định thương mại mới được ký với mọi thị trường chịu ký."
 VIE_dm_lib_eu_alignment:0 "Hài hòa với tiêu chuẩn châu Âu"
 VIE_dm_lib_eu_alignment_desc:0 "Luật và tiêu chuẩn được đưa về cùng mức với của Liên minh châu Âu."
 VIE_dm_soc_welfare_state:0 "Nhà nước phúc lợi"
 VIE_dm_soc_welfare_state_desc:0 "Lương hưu, trợ cấp thất nghiệp và giáo dục miễn phí được mở rộng, và được chi trả từ trên."
 VIE_dm_soc_labor_rights:0 "Quyền của người lao động"
 VIE_dm_soc_labor_rights_desc:0 "Công đoàn được tổ chức và thương lượng, và đình công được luật bảo vệ."
 VIE_dm_soc_public_healthcare:0 "Y tế công"
 VIE_dm_soc_public_healthcare_desc:0 "Một hệ thống công bao phủ mọi người và tự hoàn vốn bằng sức khỏe."
 VIE_dm_soc_progressive_tax:0 "Thuế lũy tiến"
 VIE_dm_soc_progressive_tax_desc:0 "Thu nhập cao hơn và gia sản lớn hơn đóng phần lớn hơn."
 VIE_dm_con_fiscal_discipline:0 "Kỷ luật tài khóa"
 VIE_dm_con_fiscal_discipline_desc:0 "Ngân sách được cân bằng, nợ được trả bớt, và chi tiêu phải tự biện minh."
 VIE_dm_con_us_alignment:0 "Liên kết với Hoa Kỳ"
 VIE_dm_con_us_alignment_desc:0 "Quan hệ an ninh, thương mại và ngoại giao với Washington được đặt làm trung tâm của chính sách."
 VIE_dm_con_community_institutions:0 "Thiết chế cộng đồng"
 VIE_dm_con_community_institutions_desc:0 "Nhà thờ, chùa chiền, phường hội và các hiệp hội đảm nhận phần lớn hơn trong việc điều hành đời sống địa phương."
 VIE_dm_con_strong_defense:0 "Quốc phòng mạnh"
 VIE_dm_con_strong_defense_desc:0 "Chi tiêu cho các lực lượng vũ trang tăng, và lương của quân đội cũng vậy."
 VIE_dm_tra_cultural_heritage:0 "Di sản văn hóa"
 VIE_dm_tra_cultural_heritage_desc:0 "Lễ hội, đền chùa và nghệ thuật dân gian được hỗ trợ, và được dạy ở trường."
 VIE_dm_tra_religious_freedom:0 "Luật Tự do Tôn giáo"
 VIE_dm_tra_religious_freedom_desc:0 "Mọi tôn giáo có thể tổ chức, giảng dạy và sở hữu tài sản."
 VIE_dm_tra_rural_first:0 "Nông thôn trước hết"
 VIE_dm_tra_rural_first_desc:0 "Đường sá, tín dụng và thị trường cho các làng quê, trước khi có thêm tòa tháp ở thành phố."
 VIE_dm_tra_balanced_neutrality:0 "Trung lập cân bằng"
 VIE_dm_tra_balanced_neutrality_desc:0 "Chính sách không liên minh cũ được khôi phục, và mọi đối tác được đối xử như nhau."
 VIE_new_rural_development:0 "Chương trình Xây dựng Nông thôn mới"
 VIE_new_rural_development_desc:0 "Một chương trình quốc gia đưa đường sá, trạm y tế, trường học và nước sạch đến các làng quê, và yêu cầu mỗi xã đạt một danh sách tiêu chuẩn."
 VIE_energy_security_2045:0 "An ninh năng lượng quốc gia"
 VIE_energy_security_2045_desc:0 "Nghị quyết của Bộ Chính trị về năng lượng đặt mục tiêu đến 2030 và tầm nhìn đến 2045: dự trữ, điện sạch, kết nối xuyên biên giới và một lưới điện có khả năng chống chịu."
 VIE_us_engagement:0 "Bình thường hóa quan hệ với Hoa Kỳ"
 VIE_us_engagement_desc:0 "Quan hệ ngoại giao được khôi phục năm 1995. Một tổng thống Mỹ thăm Hà Nội trước khi năm kết thúc, lần đầu tiên kể từ khi chiến tranh chấm dứt."

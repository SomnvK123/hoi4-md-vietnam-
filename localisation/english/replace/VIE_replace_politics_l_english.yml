 # --- Xương sống Đại hội: tinh thần nhiệm kỳ (Pha 1) ---
 VIE_resolution_9_idea:0 "Tinh thần Nghị quyết Đại hội IX"
 VIE_resolution_9_idea_desc:0 "Công nghiệp hóa, hiện đại hóa đất nước theo định hướng xã hội chủ nghĩa."
 VIE_resolution_9_cons_idea:0 "Tinh thần Nghị quyết Đại hội IX (Ổn định trước)"
 VIE_resolution_9_cons_idea_desc:0 "Giữ ổn định chính trị làm nền tảng, thận trọng với cải cách."
 VIE_resolution_10_idea:0 "Tinh thần Nghị quyết Đại hội X"
 VIE_resolution_10_idea_desc:0 "Đẩy mạnh toàn diện công cuộc Đổi Mới, chủ động hội nhập kinh tế quốc tế."
 VIE_resolution_11_idea:0 "Tinh thần Nghị quyết Đại hội XI"
 VIE_resolution_11_idea_desc:0 "Đổi mới phương thức lãnh đạo của Đảng; ba đột phá chiến lược theo Cương lĩnh 2011."
 VIE_resolution_12_idea:0 "Tinh thần Nghị quyết Đại hội XII"
 VIE_resolution_12_idea_desc:0 "Xây dựng, chỉnh đốn Đảng là nhiệm vụ then chốt."
 VIE_resolution_12_dev_idea:0 "Tinh thần Nghị quyết Đại hội XII (Chính phủ Kiến tạo)"
 VIE_resolution_12_dev_idea_desc:0 "Chính phủ kiến tạo phát triển, phục vụ người dân và doanh nghiệp."
 VIE_resolution_13_idea:0 "Tinh thần Nghị quyết Đại hội XIII"
 VIE_resolution_13_idea_desc:0 "Tinh gọn bộ máy, đẩy mạnh chuyển đổi số quốc gia."
 VIE_resolution_14_idea:0 "Tinh thần Nghị quyết Đại hội XIV"
 VIE_resolution_14_idea_desc:0 "Hoàn thiện thể chế, bước vào kỷ nguyên phát triển mới."
 VIE_no_district_council_idea:0 "Thí điểm Không tổ chức HĐND Huyện, Quận, Phường"
 VIE_no_district_council_idea_desc:0 "Nghị quyết 26/2008/QH12: một số địa phương thí điểm không tổ chức Hội đồng nhân dân ở cấp huyện, quận, phường."
 VIE_pctn_directing_committee_idea:0 "Ban Chỉ đạo Trung ương về Phòng, chống Tham nhũng (2006)"
 VIE_pctn_directing_committee_idea_desc:0 "Ban Chỉ đạo Trung ương về phòng, chống tham nhũng do Thủ tướng đứng đầu, thành lập sau vụ PMU18."

 # --- Pha 2: Event mới ---
 vie_pol.28.t:0 "Hiến pháp năm 2013"
 vie_pol.28.d:0 "Ngày 28/11/2013, Quốc hội khóa XIII thông qua Hiến pháp sửa đổi, thay thế Hiến pháp năm 1992."
 vie_pol.28.a:0 "Giữ nguyên Điều 4 về vai trò lãnh đạo của Đảng"
 vie_pol.28.b:0 "Thêm một chương mới về quyền con người"
 vie_pol.29.t:0 "Chủ tịch nước Trần Đại Quang từ trần"
 vie_pol.29.d:0 "Ngày 21/9/2018, Chủ tịch nước qua đời khi đang tại nhiệm. Phó Chủ tịch nước giữ quyền Chủ tịch nước trong lúc chờ Quốc hội quyết định."
 vie_pol.29.a:0 "Quốc hội bầu Tổng Bí thư kiêm giữ chức Chủ tịch nước"
 vie_pol.29.b:0 "Bầu một Chủ tịch nước riêng"
 vie_pol.30.t:0 "Chính quyền địa phương hai cấp đi vào hoạt động"
 vie_pol.30.d:0 "Từ ngày 1/7/2025, mô hình chính quyền địa phương hai cấp (bỏ cấp huyện) chính thức vận hành trên cả nước."
 vie_pol.30.a:0 "Ghi nhận"
 vie_pol.11.c:0 "Kỷ luật thành công một phần"

 # --- Pha 3: Xương sống Đại hội và focus chủ đề mới ---
 VIE_prepare_congress_9:0 "Chuẩn bị Đại hội IX"
 VIE_prepare_congress_9_desc:0 "Các cấp ủy đảng chuẩn bị văn kiện và nhân sự cho Đại hội đại biểu toàn quốc lần thứ IX."
 VIE_resolution_congress_9:0 "Nghị quyết Đại hội IX"
 VIE_resolution_congress_9_desc:0 "Đại hội IX (4/2001) đề ra chiến lược đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước."
 VIE_resolution_congress_10:0 "Nghị quyết Đại hội X"
 VIE_resolution_congress_10_desc:0 "Đại hội X (4/2006) chủ trương đẩy mạnh toàn diện công cuộc Đổi Mới, chủ động hội nhập kinh tế quốc tế."
 VIE_resolution_congress_11:0 "Nghị quyết Đại hội XI"
 VIE_resolution_congress_11_desc:0 "Đại hội XI (1/2011) thông qua Cương lĩnh xây dựng đất nước bổ sung, phát triển và Chiến lược phát triển kinh tế - xã hội 2011-2020."
 VIE_resolution_congress_12:0 "Nghị quyết Đại hội XII"
 VIE_resolution_congress_12_desc:0 "Đại hội XII (1/2016) đặt xây dựng, chỉnh đốn Đảng là nhiệm vụ then chốt."
 VIE_resolution_congress_13:0 "Nghị quyết Đại hội XIII"
 VIE_resolution_congress_13_desc:0 "Đại hội XIII (1/2021) chủ trương tinh gọn bộ máy và đẩy mạnh chuyển đổi số quốc gia."
 VIE_resolution_congress_14:0 "Nghị quyết Đại hội XIV"
 VIE_resolution_congress_14_desc:0 "Đại hội XIV (2026) đặt mục tiêu hoàn thiện thể chế, đưa đất nước bước vào kỷ nguyên phát triển mới."
 VIE_party_members_private_business:0 "Đảng viên làm Kinh tế Tư nhân"
 VIE_party_members_private_business_desc:0 "Quy định 15-QĐ/TW (8/2006) cho phép đảng viên làm kinh tế tư nhân, kể cả thuê mướn lao động."
 VIE_platform_2011:0 "Cương lĩnh 2011 và Chiến lược 2011-2020"
 VIE_platform_2011_desc:0 "Cương lĩnh xây dựng đất nước trong thời kỳ quá độ (bổ sung, phát triển) cùng ba đột phá chiến lược: thể chế, nhân lực và kết cấu hạ tầng."
 VIE_tw4_party_building:0 "Nghị quyết Trung ương 4 khóa XI"
 VIE_tw4_party_building_desc:0 "Nghị quyết 12-NQ/TW (1/2012) về một số vấn đề cấp bách trong công tác xây dựng Đảng."

 # --- Pha 4: Danh mục và decision "Thực hiện Nghị quyết" ---
 VIE_resolution_category:0 "Thực hiện Nghị quyết"
 VIE_resolution_category_desc:0 "Các biện pháp triển khai nghị quyết của kỳ Đại hội Đảng đang trong nhiệm kỳ. Mỗi nhiệm kỳ có nhóm quyết sách riêng, chỉ hiện khi Đảng còn cầm quyền và kỳ Đại hội tương ứng đã diễn ra.\n\n§gĐây là lớp thực thi: Đại hội quyết định định hướng bằng sự kiện, focus chuyển định hướng thành đường lối, còn các quyết sách ở đây biến đường lối thành kết quả cụ thể trong bộ máy.§!"
 VIE_rn_ix_decentral:0 "Phân cấp Trung ương - Địa phương"
 VIE_rn_ix_decentral_desc:0 "Nghị quyết 08/2004/NQ-CP về tiếp tục đẩy mạnh phân cấp quản lý nhà nước giữa Chính phủ và chính quyền tỉnh, thành phố."
 VIE_rn_ix_program134:0 "Chương trình 134"
 VIE_rn_ix_program134_desc:0 "Chương trình hỗ trợ đất sản xuất, đất ở, nhà ở và nước sinh hoạt cho đồng bào dân tộc thiểu số nghèo (2004)."
 VIE_rn_x_civil_servant_law:0 "Luật Cán bộ, Công chức 2008"
 VIE_rn_x_civil_servant_law_desc:0 "Luật Cán bộ, công chức quy định lại tuyển dụng, sử dụng và quản lý đội ngũ cán bộ, công chức."
 VIE_rn_x_district_council_pilot:0 "Thí điểm Không tổ chức HĐND Huyện, Quận, Phường"
 VIE_rn_x_district_council_pilot_desc:0 "Nghị quyết 26/2008/QH12 cho thí điểm không tổ chức Hội đồng nhân dân ở một số địa phương."
 VIE_rn_xi_confidence_vote:0 "Lấy Phiếu Tín nhiệm tại Quốc hội"
 VIE_rn_xi_confidence_vote_desc:0 "Quốc hội lần đầu lấy phiếu tín nhiệm đối với các chức danh do Quốc hội bầu hoặc phê chuẩn (6/2013)."
 VIE_rn_xi_local_gov_law:0 "Luật Tổ chức Chính quyền Địa phương 2015"
 VIE_rn_xi_local_gov_law_desc:0 "Luật mới thay thế mô hình thí điểm không tổ chức HĐND cấp huyện, quận, phường bằng một khuôn khổ thống nhất."
 VIE_rn_xii_power_control:0 "Kiểm soát Quyền lực trong Công tác Cán bộ"
 VIE_rn_xii_power_control_desc:0 "Quy định 205-QĐ/TW (9/2019) về kiểm soát quyền lực trong công tác cán bộ và chống chạy chức, chạy quyền."
 VIE_rn_xii_merge_communes:0 "Sắp xếp Đơn vị Hành chính Huyện, Xã"
 VIE_rn_xii_merge_communes_desc:0 "Nghị quyết 37/2018 về sắp xếp các đơn vị hành chính cấp huyện, cấp xã."
 VIE_rn_xiv_operate_apparatus:0 "Vận hành Bộ máy Mới"
 VIE_rn_xiv_operate_apparatus_desc:0 "Chính phủ tập trung ổn định vận hành bộ máy sau đợt tinh gọn, rút ngắn thời gian xáo trộn."
 VIE_rn_par_1:0 "Cải cách Hành chính 2001-2010"
 VIE_rn_par_1_desc:0 "Quyết định 136/2001/QĐ-TTg phê duyệt Chương trình tổng thể cải cách hành chính nhà nước giai đoạn 2001-2010."
 VIE_rn_par_2:0 "Cải cách Hành chính 2011-2020"
 VIE_rn_par_2_desc:0 "Nghị quyết 30c/NQ-CP ban hành Chương trình tổng thể cải cách hành chính nhà nước giai đoạn 2011-2020."
 VIE_rn_par_3:0 "Cải cách Hành chính 2021-2030"
 VIE_rn_par_3_desc:0 "Nghị quyết 76/NQ-CP ban hành Chương trình tổng thể cải cách hành chính nhà nước giai đoạn 2021-2030."
 VIE_rn_pctn_2006:0 "Ban Chỉ đạo Trung ương về Phòng, chống Tham nhũng"
 VIE_rn_pctn_2006_desc:0 "Ban Chỉ đạo Trung ương về phòng, chống tham nhũng do Thủ tướng đứng đầu, thành lập sau vụ PMU18."
 VIE_rn_pctn_2013:0 "Ban Chỉ đạo Chuyển về Bộ Chính trị"
 VIE_rn_pctn_2013_desc:0 "Ban Chỉ đạo Trung ương về phòng, chống tham nhũng chuyển từ Chính phủ về trực thuộc Bộ Chính trị, do Tổng Bí thư đứng đầu (2013)."
 VIE_rn_pctn_2016:0 "Không có Vùng cấm"
 VIE_rn_pctn_2016_desc:0 "Chiến dịch phòng, chống tham nhũng mở rộng với phương châm 'không có vùng cấm, không có ngoại lệ'."
 VIE_rn_pctn_2022:0 "Bảo vệ Cán bộ Dám nghĩ, Dám làm"
 VIE_rn_pctn_2022_desc:0 "Kết luận 14-KL/TW về chủ trương khuyến khích và bảo vệ cán bộ năng động, sáng tạo vì lợi ích chung."
 VIE_rn_pctn_2024:0 "Chống Lãng phí"
 VIE_rn_pctn_2024_desc:0 "Công tác phòng, chống lãng phí được đặt ngang hàng với phòng, chống tham nhũng, tiêu cực."
 VIE_rn_xiii_restructure_center:0 "Sắp xếp Bộ máy Trung ương"
 VIE_rn_xiii_restructure_center_desc:0 "Đề án tinh gọn tổ chức bộ máy các cơ quan Trung ương được triển khai (2024-2025)."
 VIE_rn_xiii_merge_provinces:0 "Sắp xếp Đơn vị Hành chính Cấp tỉnh"
 VIE_rn_xiii_merge_provinces_desc:0 "Nghị quyết 60-NQ/TW (4/2025) về sáp nhập các đơn vị hành chính cấp tỉnh."
 VIE_rn_xiii_two_tier:0 "Vận hành Chính quyền Địa phương Hai cấp"
 VIE_rn_xiii_two_tier_desc:0 "Từ 1/7/2025, mô hình chính quyền địa phương hai cấp (bỏ cấp huyện) chính thức đi vào hoạt động."



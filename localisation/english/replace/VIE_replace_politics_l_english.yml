 ### Tên đảng cho Việt Nam (plan v6, H8). Thay các khóa của MD đặt tên tổ chức lưu vong/đối lập có thật.
 VIE.liberalism:0 "£generic_liberalism_small Đảng Dân chủ Việt Nam"
 VIE.liberalism_desc:0 "(Dân chủ tự do) - Một đảng tự do theo truyền thống của Đảng Dân chủ tồn tại từ năm 1944 đến khi hợp nhất vào Mặt trận Tổ quốc năm 1988. Trong một nước Việt Nam cải cách, đảng này sẽ ủng hộ thị trường mở, tư pháp độc lập và báo chí tự do."
 VIE.socialism:0 "£generic_socialism_small Đảng Xã hội Việt Nam"
 VIE.socialism_desc:0 "(Dân chủ xã hội) - Một đảng theo truyền thống của Đảng Xã hội tồn tại từ năm 1946 đến năm 1988. Đảng này sẽ ủng hộ nhà nước phúc lợi, quyền của người lao động và nền kinh tế thị trường có khu vực công mạnh."
 VIE.Western_Autocracy:0 "£generic_Western_Autocracy_small Hội đồng Phát triển Quốc gia"
 VIE.Western_Autocracy_desc:0 "(Chuyên chế phát triển) - Một hội đồng gồm các nhà kỹ trị và sĩ quan sẽ cai trị bằng sắc lệnh nhân danh tăng trưởng, theo kiểu các con hổ Đông Á, và trông cậy vào Washington và Tokyo để được hỗ trợ."
 VIE.anarchist_communism:0 "£generic_anarchist_communism_small Liên đoàn Công nhân Cấp tiến"
 VIE.anarchist_communism_desc:0 "(Công nhân tự quản) - Một liên đoàn gồm các hội đồng nhà máy và ủy ban công đoàn, sẽ thay nhà nước bằng một liên bang các công xã. Nó chỉ xuất hiện ở một đất nước mà thể chế đã sụp đổ."



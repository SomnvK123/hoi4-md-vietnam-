 VIE_streamlined_state_idea:0 "Bộ máy nhà nước tinh gọn"
 VIE_streamlined_state_idea_desc:0 "Các bộ và cơ quan được sáp nhập và hàng nghìn vị trí bị cắt giảm."
 VIE_reorg_disruption:0 "Xáo trộn do tái cơ cấu"
 VIE_reorg_disruption_desc:0 "Cơ quan sáp nhập, nhân sự chuyển đổi và sự nghiệp bất định làm nhà nước chậm lại một thời gian."
 VIE_provincial_merger_idea:0 "Ít tỉnh hơn, tỉnh lớn hơn"
 VIE_provincial_merger_idea_desc:0 "Sáu mươi ba tỉnh thành ba mươi bốn và cấp huyện bị bãi bỏ."
 VIE_era_of_rising_idea:0 "Kỷ nguyên vươn mình của dân tộc"
 VIE_era_of_rising_idea_desc:0 "Giới lãnh đạo đề ra một tầm nhìn mới: một nước thu nhập cao vào năm 2045."
 VIE_state_conglomerates_idea:0 "Các tập đoàn kinh tế nhà nước"
 VIE_state_conglomerates_idea_desc:0 "Các tập đoàn nhà nước khổng lồ như Vinashin và PetroVietnam là trụ cột của nền kinh tế, và họ vay rất nhiều."
 VIE_state_debt_overhang:0 "Gánh nặng nợ nhà nước"
 VIE_state_debt_overhang_desc:0 "Các khoản vay xấu cho các tập đoàn nhà nước đè nặng lên ngân hàng và tài chính công."
 VIE_petrovietnam_idea:0 "Mở rộng PetroVietnam"
 VIE_petrovietnam_idea_desc:0 "Các lô ngoài khơi và nhà máy lọc dầu làm tăng nguồn thu của nhà nước."
 VIE_private_champions_idea:0 "Các tập đoàn tư nhân quốc gia"
 VIE_private_champions_idea_desc:0 "Các tập đoàn tư nhân lớn đầu tư vào bất động sản, ô tô, bán lẻ và công nghệ."
 VIE_cptpp_idea:0 "Thành viên CPTPP"
 VIE_cptpp_idea_desc:0 "Tiếp cận ưu đãi với mười một nền kinh tế Thái Bình Dương, kèm quy tắc chặt hơn về lao động và doanh nghiệp nhà nước."
 VIE_evfta_idea:0 "Hiệp định Thương mại Tự do với EU"
 VIE_evfta_idea_desc:0 "Thuế đối với phần lớn hàng hóa buôn bán với Liên minh châu Âu được xóa dần trong mười năm."
 VIE_nq57_68_idea:0 "Nghị quyết đột phá 57 và 68"
 VIE_nq57_68_idea_desc:0 "Khoa học công nghệ và khu vực tư nhân được xác định là động lực chính của tăng trưởng."
 VIE_nuclear_program_idea:0 "Chương trình điện hạt nhân"
 VIE_nuclear_program_idea_desc:0 "Hai lò phản ứng ở Ninh Thuận hứa hẹn nguồn điện nền ổn định và một lực lượng kỹ thuật mới."
 VIE_net_zero_idea:0 "Cam kết phát thải ròng bằng 0 vào năm 2050"
 VIE_net_zero_idea_desc:0 "Điện gió, điện mặt trời và nâng cấp lưới điện sẽ được tính vào giá kể từ nay."
 VIE_vpa_modernization_idea:0 "Hiện đại hóa Quân đội Nhân dân"
 VIE_vpa_modernization_idea_desc:0 "Hiện đại hóa có chọn lọc và huấn luyện tốt hơn nâng cao khả năng sẵn sàng của quân đội."
 VIE_bastion_idea:0 "Tổ hợp tên lửa bờ"
 VIE_bastion_idea_desc:0 "Các tổ hợp tên lửa chống hạm cơ động khiến việc đổ bộ vào bờ biển trở nên đắt giá."
 VIE_provincial_defence_idea:0 "Khu vực phòng thủ tỉnh"
 VIE_provincial_defence_idea_desc:0 "Mỗi tỉnh và thành phố tổ chức khu vực phòng thủ riêng, được dân quân và lực lượng dự bị hậu thuẫn."
 VIE_maritime_militia_idea:0 "Dân quân biển"
 VIE_maritime_militia_idea_desc:0 "Ngư dân được huấn luyện và tổ chức để báo cáo và bám biển."
 VIE_spratly_garrison_idea:0 "Các tiền đồn Trường Sa kiên cố"
 VIE_spratly_garrison_idea_desc:0 "Đất được cải tạo và các công trình mới củng cố sự hiện diện của Việt Nam ở quần đảo Trường Sa."
 VIE_four_nos_doctrine_idea:0 "Học thuyết quốc phòng Bốn Không"
 VIE_four_nos_doctrine_idea_desc:0 "Chính sách quốc phòng được xây quanh độc lập, tự chủ và không liên minh."
 VIE_bamboo_diplomacy_idea:0 "Ngoại giao cây tre"
 VIE_bamboo_diplomacy_idea_desc:0 "Vững vàng về nguyên tắc, linh hoạt trong thực tiễn: Hà Nội giữ quan hệ tốt với mọi cường quốc lớn."
 VIE_education_idea:0 "Cải cách giáo dục"
 VIE_education_idea_desc:0 "Các trường đại học và trường nghề nhận nguồn lực mới và quyền tự chủ lớn hơn."
 VIE_digital_idea:0 "Chuyển đổi số quốc gia"
 VIE_digital_idea_desc:0 "Định danh điện tử, chính phủ điện tử và thanh toán di động lan rộng khắp cả nước."
 VIE_disaster_prep_idea:0 "Phòng chống thiên tai"
 VIE_disaster_prep_idea_desc:0 "Cảnh báo sớm, kế hoạch sơ tán và đê điều vững chắc hơn giảm thiệt hại do bão lũ."
 VIE_high_inflation:0 "Lạm phát cao"
 VIE_high_inflation_desc:0 "Giá cả tăng nhanh hơn tiền lương."
 VIE_bond_overhang:0 "Gánh nặng trái phiếu doanh nghiệp"
 VIE_bond_overhang_desc:0 "Các chủ đầu tư bất động sản chật vật đảo nợ trái phiếu."
 VIE_us_tariff_shock:0 "Cú sốc thuế quan Mỹ"
 VIE_us_tariff_shock_desc:0 "Mức thuế đột ngột đánh vào hàng xuất khẩu sang Hoa Kỳ làm nhà máy và công nhân xáo động."
 VIE_us_tariff_mild:0 "Thỏa thuận thuế quan với Mỹ"
 VIE_us_tariff_mild_desc:0 "Một mức thuế thấp hơn nhưng vẫn đáng kể còn áp lên hàng xuất khẩu sang Hoa Kỳ."
 VIE_sars_outbreak:0 "Nỗi sợ dịch bệnh"
 VIE_sars_outbreak_desc:0 "Một đợt dịch không kiểm soát được đã làm dân chúng hoảng sợ."
 VIE_bird_flu_losses:0 "Thiệt hại gia cầm"
 VIE_bird_flu_losses_desc:0 "Nông dân mất đàn gia cầm vì cúm gia cầm."
 VIE_flood_damage:0 "Thiệt hại do lũ"
 VIE_flood_damage_desc:0 "Đường sá, ruộng đồng và nhà cửa ở các tỉnh miền Trung chìm trong nước."
 VIE_democratic_consolidation:0 "Dân chủ được củng cố"
 VIE_democratic_consolidation_desc:0 "Bầu cử tự do, tòa án và báo chí tự do nay là một phần của sinh hoạt chính trị thường ngày."
 VIE_democratic_transition_idea:0 "Nỗi đau chuyển đổi"
 VIE_democratic_transition_idea_desc:0 "Những quyền tự do mới kéo theo xung đột mới, và trật tự cũ vẫn còn người bảo vệ."
 VIE_china_pressure_idea:0 "Sức ép kinh tế của Trung Quốc"
 VIE_china_pressure_idea_desc:0 "Bắc Kinh làm chậm hải quan, cấm du khách và cắt nguồn cung."
 VIE_indochina_idea:0 "Đoàn kết Đông Dương"
 VIE_indochina_idea_desc:0 "Việt Nam, Lào và Campuchia phối hợp chính sách chặt chẽ hơn."
 VIE_import_shock_idea:0 "Cú sốc nhập khẩu"
 VIE_import_shock_idea_desc:0 "Thiếu linh kiện và hàng tiêu dùng gây thiệt hại cho nhà máy và hộ gia đình."
 VIE_yugoslav_model_idea:0 "Mô hình xã hội chủ nghĩa độc lập"
 VIE_yugoslav_model_idea_desc:0 "Thử nghiệm đã trụ vững: một nhà nước xã hội chủ nghĩa độc lập, không liên kết."
 VIE_civil_unrest_idea:0 "Bất ổn dân sự"
 VIE_civil_unrest_idea_desc:0 "Đình công và biểu tình làm gián đoạn công việc ở các vùng bị ảnh hưởng."
 VIE_sez_idea:0 "Đặc khu kinh tế"
 VIE_sez_idea_desc:0 "Ba đặc khu ven biển vận hành theo quy tắc riêng thân thiện với nhà đầu tư."
 VIE_security_state_idea:0 "Nhà nước an ninh"
 VIE_security_state_idea_desc:0 "Bộ máy an ninh nằm ở trung tâm chính quyền."
 VIE_cyber_control_idea:0 "Lãnh thổ Số Thiêng liêng"
 VIE_cyber_control_idea_desc:0 "Dữ liệu công dân và doanh nghiệp nước ngoài bắt buộc lưu trữ trong nước; Cục An ninh mạng và Lực lượng 47 nắm quyền kiểm soát tuyệt đối. Các phong trào đối lập trên mạng bị dập tắt, nhưng nghiên cứu công nghệ chịu thiệt."
 VIE_public_order_idea:0 "Logic An ninh Xuống Đường phố"
 VIE_public_order_idea_desc:0 "Mọi biểu hiện bất đồng đều được xếp vào nhóm nguy cơ an ninh quốc gia. Cảnh sát cơ động và an ninh điều tra lấn át các cơ quan dân sự, kìm hãm xây dựng nhà máy dân sự."
 VIE_security_economy_idea:0 "Kinh tế Phục vụ An ninh"
 VIE_security_economy_idea_desc:0 "Các tập đoàn quốc phòng - an ninh trở thành xương sống; mọi dòng vốn ngoại đều phải qua vòng thẩm tra an ninh."
 VIE_surveillance_idea:0 "Mạng lưới Giám sát Đại chúng"
 VIE_surveillance_idea_desc:0 "Camera nhận diện khuôn mặt phủ ngã tư, sân bay, chợ và khu dân cư; dữ liệu phường xã đổ thẳng về trung tâm dữ liệu ngành công an. Phản gián được củng cố, nhưng quan hệ thương mại với bên ngoài chịu thiệt."
 VIE_firewall_idea:0 "Vạn Lý Tường Lửa"
 VIE_firewall_idea_desc:0 "Các nền tảng nước ngoài không tuân thủ bị ngắt kết nối; lưu lượng trong nước định tuyến qua trạm trung chuyển quốc gia. Tình báo nước ngoài khó thâm nhập, nhưng thương mại số xuyên biên giới teo lại."
 VIE_ideological_education_idea:0 "Giáo dục Bảo vệ Nền tảng Tư tưởng"
 VIE_ideological_education_idea_desc:0 "Học phần nhận diện luận điệu thù địch là môn bắt buộc từ trung học. Thế hệ mới tuân thủ tự nguyện, sẵn sàng nhập ngũ, nhưng môi trường học thuật bị đóng khung."
 VIE_state_data_center_idea:0 "Trung tâm Dữ liệu Quốc gia"
 VIE_state_data_center_idea_desc:0 "Căn cước, ngân hàng, viễn thông, đất đai và y tế gom về một mối. Dòng tiền ẩn danh chấm dứt, dữ liệu ít rò rỉ ra ngoài, nhưng các máy chủ ngốn điện."
 VIE_sez_unrest_idea:0 "Biểu tình phản đối cho thuê đất"
 VIE_sez_unrest_idea_desc:0 "Đám đông biểu tình phản đối việc cho nhà đầu tư nước ngoài thuê đất."
 VIE_bubble_burst_idea:0 "Sụp đổ bất động sản"
 VIE_bubble_burst_idea_desc:0 "Bong bóng đã vỡ và ngân hàng cùng chủ nhà đang chật vật."
 VIE_bubble_burst_mild_idea:0 "Thị trường bất động sản hạ nhiệt"
 VIE_bubble_burst_mild_idea_desc:0 "Một đợt giảm tốc có quản lý giữ thiệt hại ở mức hạn chế."
 VIE_public_admin_idea:0 "Cải cách hành chính"
 VIE_public_admin_idea_desc:0 "Cơ chế một cửa và thủ tục rõ ràng hơn giảm giấy tờ mà người dân và doanh nghiệp phải làm."
 VIE_clean_cadres_idea:0 "Đội ngũ cán bộ trong sạch"
 VIE_clean_cadres_idea_desc:0 "Kê khai tài sản, kiểm toán và thanh tra đã biến sự liêm chính thành một phần sự nghiệp của cán bộ."
 VIE_two_tier_gov_idea:0 "Chính quyền địa phương hai cấp"
 VIE_two_tier_gov_idea_desc:0 "Khi cấp huyện không còn, quyết định đi nhanh hơn giữa tỉnh và xã."
 VIE_bank_health_idea:0 "Bảng cân đối ngân hàng lành mạnh hơn"
 VIE_bank_health_idea_desc:0 "Nợ xấu đã được chuyển sang công ty quản lý tài sản và các ngân hàng vững vàng hơn."
 VIE_investment_grade_idea:0 "Xếp hạng tín nhiệm đầu tư"
 VIE_investment_grade_idea_desc:0 "Các hãng xếp hạng đánh giá đất nước là nơi an toàn cho vốn dài hạn."
 VIE_rice_power_idea:0 "Nước xuất khẩu gạo và cà phê"
 VIE_rice_power_idea_desc:0 "Nông dân nuôi cả nước và bán ra thế giới, và an ninh lương thực là điều hiển nhiên."
 VIE_shared_future_idea:0 "Cộng đồng chia sẻ tương lai"
 VIE_shared_future_idea_desc:0 "Hà Nội và Bắc Kinh định khung quan hệ bằng một công thức giữ hòa bình với một cái giá."
 VIE_developed_nation_idea:0 "Nước phát triển thu nhập cao"
 VIE_developed_nation_idea_desc:0 "Mục tiêu đặt ra năm 2021 đã đạt: Việt Nam là một quốc gia hiện đại, thịnh vượng."
 VIE_export_power_idea:0 "Cường quốc xuất khẩu"
 VIE_export_power_idea_desc:0 "Hàng Việt Nam bán ở hầu hết mọi thị trường, và xuất khẩu có giá trị hơn cả nền kinh tế."
 VIE_private_engine_idea:0 "Kinh tế tư nhân là động lực tăng trưởng"
 VIE_private_engine_idea_desc:0 "Doanh nghiệp tư nhân được xác định là động lực quan trọng nhất của nền kinh tế."
 VIE_hydro_idea:0 "Xương sống thủy điện"
 VIE_hydro_idea_desc:0 "Các đập Sơn La và Hòa Bình cung cấp điện rẻ, ổn định cho miền Bắc."
 VIE_power_plan_idea:0 "Quy hoạch Điện VIII"
 VIE_power_plan_idea_desc:0 "Một kế hoạch dài hạn cân bằng khí, năng lượng tái tạo, nhập khẩu và lưới điện truyền tải chúng."
 VIE_peoples_defence_idea:0 "Quốc phòng toàn dân"
 VIE_peoples_defence_idea_desc:0 "Mọi công dân và mọi cấp chính quyền đều có phần trong quốc phòng."
 VIE_law_of_sea_idea:0 "Luật Biển"
 VIE_law_of_sea_idea_desc:0 "Yêu sách biển của Việt Nam được ghi vào luật quốc gia và được viện dẫn trong mọi tranh chấp."
 VIE_coast_guard_idea:0 "Cảnh sát biển hiện đại"
 VIE_coast_guard_idea_desc:0 "Luật trao cho cảnh sát biển quyền hạn rõ ràng và một đội tàu tuần tra mới."
 VIE_partner_network_idea:0 "Mạng lưới đối tác"
 VIE_partner_network_idea_desc:0 "Quan hệ với châu Á, châu Âu, vùng Vịnh và Nam Bán cầu khiến không đối tác nào là không thể thiếu."
 VIE_reserve_force_idea:0 "Lực lượng dự bị được huấn luyện"
 VIE_reserve_force_idea_desc:0 "Một lực lượng dự bị gồm công dân được huấn luyện có thể được gọi nhanh để tăng cường quân chính quy."
 VIE_cam_ranh_idea:0 "Cảng quốc tế Cam Ranh"
 VIE_cam_ranh_idea_desc:0 "Tàu chiến và tàu buôn của nhiều nước ghé Cam Ranh. Không lá cờ nào có căn cứ."
 VIE_air_dominance_idea:0 "Làm chủ bầu trời ven biển"
 VIE_air_dominance_idea_desc:0 "Chiến đấu cơ, radar và tên lửa cùng bao phủ bờ biển và các đảo ngoài khơi."
 VIE_digital_nation_idea:0 "Quốc gia số"
 VIE_digital_nation_idea_desc:0 "Chính phủ, ngân hàng và cửa hàng cùng chạy trên một nền tảng số, và gần như ai cũng trực tuyến."
 VIE_science_breakthrough_idea:0 "Đột phá khoa học và công nghệ"
 VIE_science_breakthrough_idea_desc:0 "Nghị quyết 57 đặt nghiên cứu, kỹ năng số và đổi mới sáng tạo lên hàng đầu trong ngân sách."


# ====================================================================
# SECTION: VIE_md_vi_p2_b_l_english.yml
# ====================================================================


 VIE_energy_security_idea:0 "An ninh năng lượng quốc gia"
 VIE_energy_security_idea_desc:0 "Một lưới điện gồm thủy điện, khí, gió, mặt trời và nhập khẩu, được hậu thuẫn bởi dự trữ, giữ cho đèn sáng qua những năm hạn hán."

 ### Phase 2 focuses (generated)
 VIE_mass_mobilization:0 "Các tổ chức quần chúng ở cơ sở"
 VIE_mass_mobilization_desc:0 "Mặt trận Tổ quốc, các công đoàn, hội phụ nữ và hội nông dân đưa thông điệp của Đảng đến từng khu phố."
 VIE_rule_of_law_state:0 "Nhà nước pháp quyền xã hội chủ nghĩa"
 VIE_rule_of_law_state_desc:0 "Một Hiến pháp mới và một loạt bộ luật làm cho hành vi của nhà nước dễ đoán hơn và cho tòa án thêm chút không gian."
 VIE_party_discipline:0 "Chiến dịch Đốt lò không vùng cấm"
 VIE_party_discipline_desc:0 "Không ai cao đến mức không thể bị điều tra. Những quan chức từng nhắm mắt làm ngơ nay phải ngoái lại sau lưng."
 VIE_streamline_apparatus:0 "Tinh gọn tổ chức bộ máy"
 VIE_streamline_apparatus_desc:0 "Sáp nhập các bộ, bãi bỏ các cơ quan chồng chéo và cắt giảm biên chế. Một số cán bộ sẽ không thích điều này."
 VIE_provincial_merger:0 "Sáp nhập các tỉnh"
 VIE_provincial_merger_desc:0 "Sáu mươi ba tỉnh thành ba mươi bốn và cấp huyện biến mất. Chính quyền địa phương ít hơn và lớn hơn."
 VIE_era_of_rising:0 "Kỷ nguyên vươn mình của dân tộc"
 VIE_era_of_rising_desc:0 "Sau Đại hội XIV, giới lãnh đạo đặt chân trời ở năm 2045: một nước phát triển, thu nhập cao."
 VIE_state_conglomerates:0 "Các tập đoàn kinh tế nhà nước"
 VIE_state_conglomerates_desc:0 "Các tập đoàn nhà nước lớn sẽ dẫn dắt công nghiệp hóa, vay trong và ngoài nước. §RCàng lớn thì càng ngã đau.§!"
 VIE_petrovietnam_expansion:0 "Mở rộng PetroVietnam"
 VIE_petrovietnam_expansion_desc:0 "Các lô ngoài khơi, nhà máy lọc dầu và đường ống dẫn khí. Một số lô tốt nhất nằm đúng nơi Trung Quốc cũng vạch đường của họ."
 VIE_private_champions:0 "Các tập đoàn tư nhân quốc gia"
 VIE_private_champions_desc:0 "Các tập đoàn tư nhân trong bất động sản, bán lẻ, ô tô và công nghệ được khuyến khích lớn đủ để cạnh tranh ở nước ngoài."
 VIE_cptpp_member:0 "Gia nhập CPTPP"
 VIE_cptpp_member_desc:0 "Việc có hiệu lực với Việt Nam ngày 14 tháng 1 năm 2019 mở ra các thị trường Thái Bình Dương và đòi hỏi quy tắc lao động chặt hơn."
 VIE_evfta:0 "Hiệp định Thương mại Tự do với EU"
 VIE_evfta_desc:0 "Có hiệu lực từ ngày 1 tháng 8 năm 2020, EVFTA xóa dần thuế đối với gần như toàn bộ thương mại với Liên minh châu Âu."
 VIE_resolution_57_68:0 "Nghị quyết 66 về xây dựng pháp luật"
 VIE_resolution_57_68_desc:0 "Đổi mới công tác xây dựng và thi hành pháp luật, hoàn thiện khuôn khổ thể chế cho khoa học công nghệ và kinh tế tư nhân."
 VIE_ninh_thuan_nuclear:0 "Quyết định điện hạt nhân Ninh Thuận"
 VIE_ninh_thuan_nuclear_desc:0 "Việt Nam cân nhắc những nhà máy điện hạt nhân đầu tiên, cùng các đối tác nước ngoài. Lựa chọn này sẽ được xem lại hơn một lần."
 VIE_build_nuclear_plant:0 "Xây các lò phản ứng Ninh Thuận"
 VIE_build_nuclear_plant_desc:0 "§YLịch sử thay thế.§! Tiến hành xây dựng cùng các đối tác Nga và Nhật Bản dù chi phí cao."
 VIE_shelve_nuclear:0 "Gác chương trình hạt nhân"
 VIE_shelve_nuclear_desc:0 "Chi phí quá cao và các câu hỏi an toàn chưa được giải quyết. Chương trình bị gác lại và tiền dồn cho việc khác."
 VIE_revive_nuclear:0 "Khôi phục chương trình hạt nhân"
 VIE_revive_nuclear_desc:0 "Thiếu điện và các mục tiêu khí hậu đưa hạt nhân trở lại chương trình nghị sự. Các lò mới được lên kế hoạch cùng một đối tác mới."
 VIE_net_zero_2050:0 "Phát thải ròng bằng 0 vào năm 2050"
 VIE_net_zero_2050_desc:0 "Tại COP26, Việt Nam cam kết phát thải ròng bằng 0 vào giữa thế kỷ. Lưới điện, điện mặt trời, điện gió và tài chính phải theo sau."
 VIE_modernize_vpa:0 "Hiện đại hóa Quân đội Nhân dân"
 VIE_modernize_vpa_desc:0 "Một lực lượng nhỏ hơn, huấn luyện tốt hơn, trang bị tốt hơn, xây dựng quanh hiện đại hóa có chọn lọc thay vì số đông."
 VIE_russian_arms_deals:0 "Các hợp đồng vũ khí với Nga"
 VIE_russian_arms_deals_desc:0 "Tiêm kích Su-30, tàu ngầm Kilo và tên lửa Bastion đến từ Nga, với giá ưu đãi và tín dụng dài hạn."
 VIE_force_47:0 "Lực lượng 47 và Bộ Tư lệnh Mạng"
 VIE_force_47_desc:0 "Một lực lượng chiến tranh mạng chuyên trách được công bố tháng 12 năm 2017 để bảo vệ mạng lưới và đối phó các chiến dịch thông tin thù địch."
 VIE_provincial_defence_zones:0 "Khu vực phòng thủ tỉnh"
 VIE_provincial_defence_zones_desc:0 "Mỗi tỉnh và thành phố xây dựng một khu vực phòng thủ với lực lượng, kho bãi và kế hoạch tại chỗ, để kẻ thù không thấy mục tiêu yếu nào ở bất kỳ đâu."
 VIE_maritime_militia:0 "Dân quân biển"
 VIE_maritime_militia_desc:0 "Ngư dân được huấn luyện để báo cáo, bám sát và giữ vững vị trí trên biển."
 VIE_spratly_fortification:0 "Củng cố các tiền đồn Trường Sa"
 VIE_spratly_fortification_desc:0 "Đất cải tạo và các công trình mới củng cố sự hiện diện của Việt Nam ở quần đảo Trường Sa. Các bên khác đã xây nhiều hơn."
 VIE_four_nos_doctrine:0 "Học thuyết quốc phòng Bốn Không"
 VIE_four_nos_doctrine_desc:0 "Không liên minh, không theo phe, không căn cứ nước ngoài, không dùng vũ lực hay đe dọa dùng vũ lực. Sách trắng Quốc phòng 2019 biến nó thành học thuyết."
 VIE_asean_chair:0 "Năm Chủ tịch ASEAN và thúc đẩy COC"
 VIE_asean_chair_desc:0 "Việt Nam giữ chức chủ tịch ASEAN năm 2010 (và lần nữa năm 2020), đăng cai các hội nghị thượng đỉnh và định ra chương trình nghị sự."
 VIE_un_security_council:0 "Ủy viên không thường trực Hội đồng Bảo an"
 VIE_un_security_council_desc:0 "Việt Nam làm ủy viên không thường trực nhiệm kỳ 2008-09 và 2020-21."
 VIE_us_comprehensive_partnership:0 "Đối tác toàn diện với Hoa Kỳ"
 VIE_us_comprehensive_partnership_desc:0 "Năm 2013, Hà Nội và Washington thiết lập quan hệ đối tác toàn diện."
 VIE_us_embargo_lifted:0 "Dỡ bỏ cấm vận vũ khí của Mỹ"
 VIE_us_embargo_lifted_desc:0 "Thông báo năm 2016 mở cửa cho vũ khí phương Tây mà không đụng đến Bốn Không."
 VIE_csp_network:0 "Các đối tác chiến lược toàn diện"
 VIE_csp_network_desc:0 "Đến năm 2023, Việt Nam đã nâng quan hệ với Hoa Kỳ và các cường quốc lớn khác lên mức đối tác cao nhất."
 VIE_bamboo_diplomacy:0 "Bản lĩnh ngoại giao cây tre Việt Nam"
 VIE_bamboo_diplomacy_desc:0 "Gốc vững, thân chắc, cành uyển chuyển. Việt Nam giữ mọi cường quốc lớn ở gần, và không ai phải bị chọn."
 VIE_special_relations_laos:0 "Quan hệ đặc biệt với Lào"
 VIE_special_relations_laos_desc:0 "Những đồng chí cũ và láng giềng gần: quan hệ an ninh, thương mại và thủy điện gắn kết hai nước."
 VIE_cambodia_relations:0 "Quan hệ với Campuchia"
 VIE_cambodia_relations_desc:0 "Phân định biên giới, thương mại và hợp tác Mê Kông với Phnom Penh."
 VIE_vinasat:0 "Các vệ tinh VINASAT"
 VIE_vinasat_desc:0 "VINASAT-1 (2008) và VINASAT-2 (2012) cho Việt Nam vệ tinh viễn thông của riêng mình."
 VIE_national_digital_transformation:0 "Chuyển đổi số quốc gia"
 VIE_national_digital_transformation_desc:0 "Định danh điện tử, chính phủ điện tử, thanh toán di động và băng thông rộng phủ đến mọi xã."
 VIE_viettel_global:0 "Viettel vươn ra toàn cầu"
 VIE_viettel_global_desc:0 "Hoạt động của Viettel ở Campuchia, Lào, Peru, Mozambique và xa hơn mang lại doanh thu và ảnh hưởng."
 VIE_mekong_climate_adaptation:0 "Thích ứng ở Đồng bằng sông Cửu Long"
 VIE_mekong_climate_adaptation_desc:0 "Lúa chịu mặn, cống ngăn mặn, hồ chứa và chuyển từ lúa sang tôm và trái cây."
 VIE_indochina_solidarity:0 "Đoàn kết Đông Dương"
 VIE_indochina_solidarity_desc:0 "Việt Nam, Lào và Campuchia phối hợp quốc phòng và ngoại giao. Ý tưởng cũ về một liên bang Đông Dương trở lại."
 VIE_indochina_federation:0 "Liên bang Đông Dương"
 VIE_indochina_federation_desc:0 "Đưa Lào và Campuchia vào một liên bang duy nhất. Mở khóa quyết định thành lập có sẵn khi các tiểu bang cần thiết được nắm giữ hoặc thành chư hầu."
 VIE_national_assembly_role:0 "Quốc hội mạnh hơn"
 VIE_national_assembly_role_desc:0 "Đại biểu chất vấn bộ trưởng trên truyền hình trực tiếp và các ủy ban xem xét ngân sách từng khoản."
 VIE_ethnic_policy:0 "Chính sách cho Tây Nguyên và vùng biên giới"
 VIE_ethnic_policy_desc:0 "Đường sá, trường học và trạm y tế cho các tỉnh miền núi, và tôn trọng phong tục địa phương, để bất ổn không bén rễ."
 VIE_cybersecurity_law:0 "Luật An ninh mạng"
 VIE_cybersecurity_law_desc:0 "Một đạo luật về nội địa hóa dữ liệu và nội dung trực tuyến được soạn thảo. Các nền tảng nước ngoài và giới phê bình trong nước đều phản đối."
 VIE_sec_security_state:0 "Nhà Nước An Ninh"
 VIE_sec_security_state_desc:0 "Đảng vẫn lãnh đạo tuyệt đối - nhưng từ hôm nay, Đảng lãnh đạo bằng đôi mắt không bao giờ chớp của ngành Công an."
 VIE_sec_cyber_control:0 "Kiểm soát Không gian mạng"
 VIE_sec_cyber_control_desc:0 "Không gian mạng được tuyên bố là lãnh thổ số thiêng liêng. Cục An ninh mạng và Lực lượng 47 được trao quyền tuyệt đối, dữ liệu phải lưu trữ tại máy chủ nội địa."
 VIE_sec_public_order:0 "Trật tự Công cộng"
 VIE_sec_public_order_desc:0 "Đẩy logic an ninh xuống tận đường phố. Từ khiếu kiện đất đai đến phản biện chính sách đều là nguy cơ an ninh quốc gia; ngân sách cho cảnh sát tăng vọt."
 VIE_sec_security_economy:0 "Kinh tế An ninh"
 VIE_sec_security_economy_desc:0 "Kinh tế thị trường chỉ tồn tại trong chừng mực nó nuôi sống bộ máy an ninh. Viettel và các tổng công ty của Bộ Công an trở thành xương sống."
 VIE_sec_surveillance_network:0 "Mạng lưới Giám sát Đại chúng"
 VIE_sec_surveillance_network_desc:0 "Quyền hạn pháp lý trên giấy trở thành hạ tầng vật chất: mỗi phường là một cảm biến, mỗi công dân là một điểm dữ liệu. Cán bộ cũ khó chịu vì chính họ cũng nằm trong tầm soi."
 VIE_sec_loyalty_vetting:0 "Thanh lọc & Thẩm tra Lòng trung thành"
 VIE_sec_loyalty_vetting_desc:0 "Rà soát nhân sự từ xã lên bộ bằng hồ sơ chính trị số hóa: trung thành trước, giỏi sau. Kỹ trị gia không cùng phe bị loại, bộ máy sạch hơn nhưng chậm hơn."
 VIE_sec_border_control:0 "Siết Biên giới & Kiểm soát Di chuyển"
 VIE_sec_border_control_desc:0 "Biên giới là màng lọc của chế độ: hộ chiếu và xuất cảnh bị kiểm duyệt, đồn biên phòng và chốt chặn được kiên cố hóa, ngân sách quốc phòng nhích lên một bậc."
 VIE_sec_cyber_sovereignty:0 "Chủ quyền Mạng"
 VIE_sec_cyber_sovereignty_desc:0 "Đóng kín không gian số: ngắt nền tảng nước ngoài không tuân thủ, ép lưu lượng qua trạm trung chuyển quốc gia do công an vận hành. Internet Việt Nam trở thành lãnh thổ có biên giới thật."
 VIE_sec_ideological_education:0 "Giáo dục Tư tưởng & An ninh Học đường"
 VIE_sec_ideological_education_desc:0 "Đưa học phần bảo vệ nền tảng tư tưởng vào trường học, lập câu lạc bộ Lực lượng 47 trong đại học, giáo viên đứng lớp phải qua thẩm tra. Tuân thủ tự nguyện thay vì tuân thủ vì sợ."
 VIE_sec_state_data_center:0 "Trung tâm Dữ liệu Quốc gia"
 VIE_sec_state_data_center_desc:0 "Dựng trung tâm dữ liệu quốc gia gom một mối căn cước, ngân hàng, viễn thông, đất đai và y tế. AI phát hiện giao dịch bất thường; xương sống kỹ thuật của cả ba trụ cột."
 VIE_sec_managed_opening:0 "Mở cửa có Kiểm soát"
 VIE_sec_managed_opening_desc:0 "Bộ máy giám sát và các tập đoàn an ninh nuốt tiền khổng lồ trong khi nguồn thu bị chính mình bóp nghẹt. Chế độ hé cửa như một chiếc van có đồng hồ: vốn ngoại được mời vào nhưng mọi dòng đều qua thẩm tra, dữ liệu ở lại trong nước, người giữ chìa khóa két vẫn là Bộ Công an."
 VIE_sec_pillars_tt:0 "Mở khóa ba trụ cột: §YKhông gian mạng§!, §YTrật tự nội bộ§! và §YKinh tế an ninh§!."
 VIE_anti_corruption_law:0 "Luật Phòng, chống tham nhũng"
 VIE_anti_corruption_law_desc:0 "Một đạo luật đặt ra nghĩa vụ công khai, báo cáo và chịu trách nhiệm. Việc thực thi sẽ quyết định nó có ý nghĩa hay không."
 VIE_asset_declaration:0 "Quan chức kê khai tài sản"
 VIE_asset_declaration_desc:0 "Quan chức cấp cao và gia đình họ phải kê khai những gì mình sở hữu. Một số không thích việc này."
 VIE_state_audit:0 "Kiểm toán Nhà nước"


# ====================================================================
# SECTION: VIE_md_vi_p2_c_l_english.yml
# ====================================================================


 VIE_state_audit_desc:0 "Các cuộc kiểm toán bộ và tập đoàn nhà nước phát hiện hàng nghìn tỷ chi tiêu bất thường."
 VIE_party_inspection:0 "Ủy ban Kiểm tra Trung ương"
 VIE_party_inspection_desc:0 "Các thanh tra của chính Đảng có quyền mở vụ việc đối với đảng viên cấp cao."
 VIE_asset_recovery:0 "Thu hồi tài sản bị chiếm đoạt"
 VIE_asset_recovery_desc:0 "Tòa án ra lệnh trả về cho nhà nước tài sản và tiền mặt thu từ các quan chức bị kết án."
 VIE_clean_cadres:0 "Đội ngũ cán bộ trong sạch"
 VIE_clean_cadres_desc:0 "Liêm chính trở thành điều kiện để thăng tiến, và những quan chức không giải thích nổi tài sản của mình sẽ không được đề bạt."
 VIE_public_admin_reform:0 "Cải cách hành chính công"
 VIE_public_admin_reform_desc:0 "Cơ chế một cửa, thủ tục đơn giản hơn và trách nhiệm rõ ràng hơn, thử nghiệm trước ở vài tỉnh."
 VIE_decentralization:0 "Phân cấp quyền hạn cho các tỉnh"
 VIE_decentralization_desc:0 "Các tỉnh có nhiều tiếng nói hơn về đầu tư và ngân sách. Tăng trưởng theo sau, và các thương vụ địa phương cũng vậy."
 VIE_e_government:0 "Chính phủ điện tử"
 VIE_e_government_desc:0 "Hồ sơ, giấy phép và thuế chuyển lên mạng, và hàng chờ giấy tờ biến mất."
 VIE_two_tier_local_gov:0 "Chính quyền địa phương hai cấp"
 VIE_two_tier_local_gov_desc:0 "Cấp huyện bị bãi bỏ. Tỉnh và xã nay cùng điều hành chính quyền địa phương."
 VIE_institutional_bottlenecks:0 "Tháo gỡ điểm nghẽn thể chế"
 VIE_institutional_bottlenecks_desc:0 "Các luật cản trở dự án được sửa từng cái một. Một số cán bộ mất quyền nói không."
 VIE_party_centennial_2030:0 "Một trăm năm thành lập Đảng"
 VIE_party_centennial_2030_desc:0 "Năm 2030, Đảng kỷ niệm một trăm năm và báo cáo về các mục tiêu đã tự đặt ra."
 VIE_state_bank_modernization:0 "Hiện đại hóa Ngân hàng Nhà nước"
 VIE_state_bank_modernization_desc:0 "Ngân hàng trung ương có giám sát, hệ thống thanh toán và nhiệm vụ về giá cả rõ ràng hơn."
 VIE_fight_inflation:0 "Chống lạm phát"
 VIE_fight_inflation_desc:0 "Tín dụng chặt hơn và chính sách tỷ giá vững hơn làm giá cả hạ nhiệt."
 VIE_restructure_banking:0 "Tái cơ cấu hệ thống ngân hàng"
 VIE_restructure_banking_desc:0 "Các ngân hàng yếu được sáp nhập và tái cấp vốn, và các chủ sở hữu được yêu cầu bỏ tiền của mình vào."
 VIE_vamc:0 "Công ty Quản lý Tài sản"
 VIE_vamc_desc:0 "Một công ty nhà nước mua nợ xấu từ ngân hàng và xử lý dần theo thời gian."
 VIE_deposit_insurance:0 "Bảo hiểm tiền gửi"
 VIE_deposit_insurance_desc:0 "Người gửi tiền được bảo vệ đến một hạn mức, làm giảm nguy cơ rút tiền ồ ạt ở ngân hàng."
 VIE_cross_ownership_crackdown:0 "Chấm dứt sở hữu chéo"
 VIE_cross_ownership_crackdown_desc:0 "Ngân hàng không còn được thuộc sở hữu của các công ty mà họ cho vay. Các tập đoàn lớn nhất mất một nguồn vốn riêng."
 VIE_corporate_bond_reform:0 "Cải cách thị trường trái phiếu doanh nghiệp"
 VIE_corporate_bond_reform_desc:0 "Bên phát hành phải công bố nhiều hơn, và nhà đầu tư phải đủ điều kiện hơn để mua."
 VIE_market_upgrade_criteria:0 "Đáp ứng tiêu chí thị trường mới nổi"
 VIE_market_upgrade_criteria_desc:0 "Hạn mức sở hữu nước ngoài, quy tắc thanh toán bù trừ và khả năng tiếp cận thị trường được làm lại để đáp ứng yêu cầu của các nhà cung cấp chỉ số."
 VIE_international_financial_centre:0 "Trung tâm tài chính quốc tế"
 VIE_international_financial_centre_desc:0 "Thành phố Hồ Chí Minh và Đà Nẵng được lập thành các trung tâm tài chính độc lập với quy tắc riêng."
 VIE_investment_grade:0 "Xếp hạng tín nhiệm đầu tư"
 VIE_investment_grade_desc:0 "Sau nhiều năm quản lý nợ ổn định, các hãng xếp hạng nâng xếp hạng của Việt Nam lên mức đầu tư."
 VIE_rice_export_power:0 "Nước xuất khẩu gạo và cà phê"
 VIE_rice_export_power_desc:0 "Việt Nam nằm trong nhóm xuất khẩu gạo và cà phê hàng đầu thế giới, và an ninh lương thực không còn là câu hỏi."
 VIE_high_tech_agriculture:0 "Nông nghiệp công nghệ cao"
 VIE_high_tech_agriculture_desc:0 "Tưới nhỏ giọt, giống chịu mặn và chuỗi lạnh nâng năng suất và giá mà nông dân nhận được."
 VIE_land_law_reform:0 "Cải cách Luật Đất đai"
 VIE_land_law_reform_desc:0 "Quyền sử dụng đất được làm rõ và quy tắc bồi thường được siết lại, nhằm giảm số tranh chấp."
 VIE_16_words:0 "Phương châm 16 chữ và tinh thần 4 tốt"
 VIE_16_words_desc:0 "'Láng giềng hữu nghị, hợp tác toàn diện, ổn định lâu dài, hướng tới tương lai.' Một công thức để giữ hòa bình với Bắc Kinh."
 VIE_border_trade_gates:0 "Cửa khẩu thương mại biên giới"
 VIE_border_trade_gates_desc:0 "Các cửa khẩu ở phía Bắc được mở cho hàng hóa và tiểu thương."
 VIE_defence_hotline:0 "Đường dây nóng quốc phòng và tránh va chạm"
 VIE_defence_hotline_desc:0 "Các bộ trưởng quốc phòng thỏa thuận một đường dây trực tiếp và quy tắc xử lý sự cố trên biển."
 VIE_code_of_conduct:0 "Bộ Quy tắc Ứng xử ở Biển Đông"
 VIE_code_of_conduct_desc:0 "Việt Nam cùng ASEAN thúc đẩy một bộ quy tắc có tính ràng buộc và ngăn nó bị pha loãng."
 VIE_shared_future:0 "Cộng đồng chia sẻ tương lai"
 VIE_shared_future_desc:0 "Bắc Kinh đề xuất một công thức gắn hai nước chặt hơn. Hà Nội chấp nhận cách diễn đạt nhưng giữ các lựa chọn của mình."
 VIE_upper_middle_income:0 "Thu nhập trung bình cao vào năm 2030"
 VIE_upper_middle_income_desc:0 "Mục tiêu đặt ra năm 2021: thu nhập đưa Việt Nam vào nhóm các nền kinh tế thu nhập trung bình cao."
 VIE_green_growth:0 "Tăng trưởng xanh"
 VIE_green_growth_desc:0 "Đầu tư mới được đo theo các mục tiêu carbon và ô nhiễm cũng như lợi nhuận."
 VIE_innovation_nation:0 "Quốc gia đổi mới sáng tạo"
 VIE_innovation_nation_desc:0 "Khu nghiên cứu, nhà máy chip và các công ty khởi nghiệp biến khoa học thành nguồn xuất khẩu, không chỉ nhập khẩu."
 VIE_high_income_2045:0 "Thu nhập cao vào năm 2045"
 VIE_high_income_2045_desc:0 "Mục tiêu dài hạn: một quốc gia mà người dân khấm khá như ở những nền kinh tế giàu nhất châu Á."
 VIE_developed_nation_2045:0 "Một nước phát triển"
 VIE_developed_nation_2045_desc:0 "Một trăm năm sau độc lập, Việt Nam là một nước phát triển với thu nhập cao và một nhà nước hiện đại."
 VIE_hose_exchange:0 "Sở Giao dịch Chứng khoán TP. Hồ Chí Minh"
 VIE_hose_exchange_desc:0 "Sở giao dịch đầu tiên mở cửa tháng 7 năm 2000 với vài mã niêm yết. Một ngày nào đó nó sẽ quan trọng."
 VIE_investment_law_2005:0 "Luật Đầu tư chung"
 VIE_investment_law_2005_desc:0 "Nhà đầu tư trong và ngoài nước được đặt dưới một luật, với ít ngành bị đóng hơn và ít thủ tục rườm rà hơn."
 VIE_wto_reforms:0 "Cải cách để thực hiện cam kết WTO"
 VIE_wto_reforms_desc:0 "Thuế quan, trợ cấp và quy tắc cấp phép được viết lại cho khớp với những lời hứa ở Geneva."
 VIE_export_powerhouse:0 "Cường quốc xuất khẩu"
 VIE_export_powerhouse_desc:0 "Khi CPTPP và hiệp định với EU có hiệu lực, xuất khẩu là động cơ của nền kinh tế."
 VIE_gulf_of_tonkin:0 "Phân định Vịnh Bắc Bộ"
 VIE_gulf_of_tonkin_desc:0 "Hiệp định năm 2000 với Trung Quốc ấn định ranh giới biển và quy tắc đánh bắt trong vịnh."
 VIE_apec_host:0 "Đăng cai APEC"
 VIE_apec_host_desc:0 "Lãnh đạo các nền kinh tế Thái Bình Dương tụ họp tại thành phố chủ nhà. Đó là cơ hội để giới thiệu đất nước."
 VIE_us_carrier_visit:0 "Tàu sân bay Mỹ ở Đà Nẵng"
 VIE_us_carrier_visit_desc:0 "Một tàu sân bay Hoa Kỳ ghé Đà Nẵng lần đầu tiên kể từ chiến tranh. Bắc Kinh đang theo dõi."
 VIE_us_tariff_deal:0 "Khung thuế quan với Mỹ"
 VIE_us_tariff_deal_desc:0 "Một thỏa thuận khung giới hạn mức thuế đánh vào hàng xuất khẩu sang Hoa Kỳ để đổi lấy tiếp cận thị trường."
 VIE_cambodia_border:0 "Phân giới cắm mốc biên giới với Campuchia"
 VIE_cambodia_border_desc:0 "Các đoàn công tác chung cắm mốc dọc biên giới với Campuchia."
 VIE_mekong_commission:0 "Ủy hội sông Mê Kông"
 VIE_mekong_commission_desc:0 "Việt Nam làm việc qua ủy hội sông để thúc đẩy quy tắc chia sẻ nước ở thượng nguồn."
 VIE_mekong_dams_response:0 "Đáp lại các đập thượng nguồn"
 VIE_mekong_dams_response_desc:0 "Các đập ở thượng nguồn giữ nước vào mùa khô. Hà Nội vận động, giám sát và chuẩn bị cho đồng bằng."
 VIE_funan_techo_response:0 "Ứng phó kênh đào Phù Nam Techo"
 VIE_funan_techo_response_desc:0 "Kênh đào Campuchia dự định sẽ chuyển hướng nước sông Mê Kông. Việt Nam chọn giữa gây sức ép mạnh và làm việc từng chi tiết."
 VIE_india_partnership:0 "Quan hệ đối tác với Ấn Độ"
 VIE_india_partnership_desc:0 "Quan hệ đối tác chiến lược toàn diện với New Delhi mang lại vũ khí, hợp tác dầu mỏ và một người bạn có mâu thuẫn riêng với Bắc Kinh."
 VIE_japan_partnership:0 "Quan hệ đối tác với Nhật Bản"
 VIE_japan_partnership_desc:0 "Nhật Bản là nguồn viện trợ lớn nhất và một nhà đầu tư hàng đầu, đồng thời là đối tác về an ninh hàng hải."
 VIE_korea_partnership:0 "Quan hệ đối tác với Hàn Quốc"
 VIE_korea_partnership_desc:0 "Các nhà máy Hàn Quốc tuyển dụng hàng trăm nghìn người và các công ty Hàn Quốc nằm trong số nhà đầu tư lớn nhất."
 VIE_australia_partnership:0 "Quan hệ đối tác với Úc"
 VIE_australia_partnership_desc:0 "Giáo dục, tài nguyên và các mối liên hệ quốc phòng gắn Canberra với Hà Nội."
 VIE_france_eu:0 "Pháp và Liên minh châu Âu"
 VIE_france_eu_desc:0 "Paris và Brussels đề nghị đầu tư, máy bay và hỗ trợ ngoại giao mà không kèm cái giá về an ninh."
 VIE_gulf_investment:0 "Vốn từ vùng Vịnh"
 VIE_gulf_investment_desc:0 "Các quỹ đầu tư quốc gia vùng Vịnh rót tiền vào cảng, nhà máy lọc dầu và bất động sản."
 VIE_global_south_ties:0 "Châu Phi và châu Mỹ Latinh"
 VIE_global_south_ties_desc:0 "Gạo, viễn thông và ngoại giao mang tên Việt Nam đến những nơi trước đây hầu như chưa từng ghé."
 VIE_nghi_son_refinery:0 "Nhà máy lọc dầu Nghi Sơn"
 VIE_nghi_son_refinery_desc:0 "Một tổ hợp lọc dầu và hóa dầu lớn trên bờ biển Thanh Hóa, cùng các đối tác nước ngoài."
 VIE_scic:0 "Tổng công ty Đầu tư và Kinh doanh Vốn Nhà nước"
 VIE_scic_desc:0 "Một công ty mẹ được lập để quản lý phần vốn của nhà nước trong các doanh nghiệp và bán bớt một số."
 VIE_soe_governance:0 "Quản trị vốn nhà nước"
 VIE_soe_governance_desc:0 "Một cơ quan duy nhất thực hiện quyền sở hữu của nhà nước và buộc các nhà quản lý chịu trách nhiệm."
 VIE_household_business:0 "Chính thức hóa hộ kinh doanh"
 VIE_household_business_desc:0 "Hàng triệu cửa hàng và xưởng gia đình được đưa vào danh sách nộp thuế và áp dụng quy tắc đơn giản."
 VIE_private_sector_engine:0 "Kinh tế tư nhân là động lực tăng trưởng"
 VIE_private_sector_engine_desc:0 "Nghị quyết 68 xác định kinh tế tư nhân là động lực quan trọng nhất của tăng trưởng."
 VIE_son_la_dam:0 "Đập Sơn La"
 VIE_son_la_dam_desc:0 "Nhà máy thủy điện lớn nhất Đông Nam Á mọc lên ở Tây Bắc, và hàng nghìn người được tái định cư."
 VIE_coal_power:0 "Mở rộng nhiệt điện than"
 VIE_coal_power_desc:0 "Rẻ và xây nhanh: nhà máy điện than giữ cho đèn sáng khi nhu cầu tăng vọt. Hóa đơn được trả bằng không khí và dư luận quốc tế."
 VIE_solar_boom:0 "Bùng nổ điện mặt trời"
 VIE_solar_boom_desc:0 "Giá mua điện ưu đãi mang đến hàng nghìn hệ thống trên mái nhà và trang trại. Lưới điện không được xây cho chúng."
 VIE_power_plan_8:0 "Quy hoạch Điện VIII"
 VIE_power_plan_8_desc:0 "Một kế hoạch quốc gia cân bằng khí, gió, mặt trời và nhập khẩu, và tính cả chi phí của lưới điện."
 VIE_offshore_wind:0 "Điện gió ngoài khơi"
 VIE_offshore_wind_desc:0 "Các trang trại gió ở vùng nước nông ngoài khơi miền Nam và miền Trung hứa hẹn một nguồn điện mới lớn."
 VIE_jetp:0 "Đối tác Chuyển dịch Năng lượng Công bằng"
 VIE_jetp_desc:0 "Các nước giàu đề nghị tiền và chuyên môn nếu Việt Nam cho điện than nghỉ hưu theo lộ trình."
 VIE_500kv_grid:0 "Đường dây 500 kV"
 VIE_500kv_grid_desc:0 "Đường dây truyền tải Bắc - Nam thứ ba chuyển điện từ nơi sản xuất đến nơi sử dụng."
 VIE_law_of_the_sea:0 "Luật Biển"
 VIE_law_of_the_sea_desc:0 "Yêu sách của Việt Nam về đảo, vùng nước và thềm lục địa được ghi vào một đạo luật quốc gia năm 2012."
 VIE_fisheries_surveillance:0 "Lực lượng Kiểm ngư"
 VIE_fisheries_surveillance_desc:0 "Một lực lượng dân sự tuần tra ngư trường, hộ tống tàu cá và ghi lại những gì các tàu khác làm."
 VIE_coast_guard_law:0 "Luật Cảnh sát biển"
 VIE_coast_guard_law_desc:0 "Một đạo luật năm 2018 trao cho cảnh sát biển quyền hạn rõ ràng và cơ sở pháp lý để hành động trong vùng biển tranh chấp."
 VIE_dk1_platforms:0 "Các nhà giàn DK1"
 VIE_dk1_platforms_desc:0 "Những nhà giàn cố định nhỏ trên thềm Bãi Tư Chính đánh dấu nơi yêu sách của Việt Nam vươn tới."
 VIE_legal_warfare:0 "Đưa ra tòa"
 VIE_legal_warfare_desc:0 "§YLịch sử thay thế.§! Việt Nam nộp đơn kiện riêng theo Công ước về Luật Biển, tiếp nối phán quyết trọng tài năm 2016."
 VIE_limited_war_doctrine:0 "Học thuyết cho một cuộc chiến hạn chế"
 VIE_limited_war_doctrine_desc:0 "Kế hoạch cho một cuộc xung đột ngắn, quyết liệt trên một khu vực nhỏ, và lối thoát đi kèm."
 VIE_peoples_defence:0 "Quốc phòng toàn dân"
 VIE_peoples_defence_desc:0 "Quốc phòng là việc của mọi công dân và mọi cấp chính quyền, với quân đội là hạt nhân."
 VIE_militia_law:0 "Luật Dân quân tự vệ"
 VIE_militia_law_desc:0 "Một đạo luật năm 2019 nêu nhiệm vụ của lực lượng dân quân và tự vệ địa phương."
 VIE_cyber_command:0 "Bộ Tư lệnh Tác chiến Không gian mạng"
 VIE_cyber_command_desc:0 "Một bộ tư lệnh chuyên trách bảo vệ mạng lưới và tiến hành tác chiến trên không gian mạng."
 VIE_un_peacekeeping:0 "Lực lượng gìn giữ hòa bình Liên Hợp Quốc"
 VIE_un_peacekeeping_desc:0 "Công binh và quân y tham gia các phái bộ Liên Hợp Quốc ở châu Phi, và lá cờ Việt Nam xuất hiện xa quê nhà."
 VIE_tank_modernization:0 "Nâng cấp xe tăng cũ"
 VIE_tank_modernization_desc:0 "Thân xe T-54 và T-55 được lắp pháo mới, hệ thống điều khiển hỏa lực và giáp, và phục vụ thêm một thời gian."
 VIE_corps_restructure:0 "Tái cơ cấu các quân đoàn"
 VIE_corps_restructure_desc:0 "Các bộ chỉ huy quân đoàn mới được lập để điều khiển lực lượng trên cả một chiến trường, không chỉ một tỉnh."
 VIE_fighter_replacement:0 "Thay thế tiêm kích"
 VIE_fighter_replacement_desc:0 "Các tiêm kích cũ hao mòn. Chọn người kế nhiệm là chọn nhà cung cấp, và lựa chọn nào cũng có giá."



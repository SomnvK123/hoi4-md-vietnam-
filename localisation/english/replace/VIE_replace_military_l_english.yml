 ### ============================================================
### QUAN CHUNG PHONG KHONG - KHONG QUAN (PK-KQ) - V8 LOCALISATION
### ============================================================

 ### Category
 VIE_air_category:0 "Chương trình Phòng không - Không quân"
 VIE_air_category_desc:0 "Quản lý và thực hiện các chương trình mua sắm vũ khí, hiện đại hóa lưới lửa phòng không và phát triển lực lượng không quân tiêm kích của Quân chủng Phòng không - Không quân Việt Nam."

 ### Ideas / National Spirits (V8)
 VIE_air8_spirit_defense_in_depth:0 "Học thuyết Phòng không Chiều sâu"
 VIE_air8_spirit_defense_in_depth_desc:0 "Tổ chức thế trận phòng không nhiều tầng nhiều lớp, ưu tiên phòng thủ bảo vệ các mục tiêu trọng điểm quốc gia và đánh chặn các cuộc tập kích đường không."
 VIE_air8_spirit_sky_shield:0 "Lưới lửa Bầu trời Thép"
 VIE_air8_spirit_sky_shield_desc:0 "Thế trận phòng không chiều sâu toàn diện đạt đỉnh cao với khả năng hiệp đồng chặt chẽ giữa radar cảnh giới, tên lửa phòng không tầm xa và tiêm kích đánh chặn."
 VIE_air8_spirit_mobile_air:0 "Học thuyết Phòng thủ Cơ động Không quân"
 VIE_air8_spirit_mobile_air_desc:0 "Phát huy tối đa tính cơ động của tiêm kích đa năng, phản ứng nhanh trên mọi hướng chiến lược và vươn tầm hoạt động bảo vệ chủ quyền biển đảo."
 VIE_air8_spirit_multirole_air_supremacy:0 "Không quân Đa nhiệm Cơ động Vươn xa"
 VIE_air8_spirit_multirole_air_supremacy_desc:0 "Không quân làm chủ tác chiến cơ động biển - không, làm chủ tiêm kích đa nhiệm thế hệ mới và năng lực tập kích đối hải chính xác cả ngày lẫn đêm."
 VIE_air8_spirit_integrated_c4isr:0 "Học thuyết Tác chiến PK-KQ Tích hợp"
 VIE_air8_spirit_integrated_c4isr_desc:0 "Liên kết số hóa sở chỉ huy, mạng trinh sát radar và các biên đội tiêm kích theo chuẩn C4ISR nhằm rút ngắn thời gian phát hiện và chỉ thị hỏa lực."
 VIE_air8_spirit_digital_air_network:0 "Hệ sinh thái PK-KQ Số hóa Toàn diện"
 VIE_air8_spirit_digital_air_network_desc:0 "Hệ thống tác chiến mạng trung tâm hoàn chỉnh kết nối dữ liệu thời gian thực giữa radar mặt đất, UAV trinh sát và phi đội chiến đấu trên không."
 VIE_air8_spirit_aviation_industry:0 "Tự chủ Kỹ thuật & Công nghiệp Hàng không"
 VIE_air8_spirit_aviation_industry_desc:0 "Từng bước làm chủ bảo dưỡng, sửa chữa lớn, đại tu tăng hạn và chế tạo phụ tùng cho các dòng khí tài phòng không và máy bay tiêm kích."

 ### Decisions (V8)
 VIE_air8_dec_s300pmu1:0 "Tiếp nhận Tổ hợp Phòng không S-300PMU1"
 VIE_air8_dec_s300pmu1_desc:0 "Giải ngân ngân sách mua sắm và tổ chức huấn luyện chuyển loại cho các kíp chiến đấu tiếp nhận tổ hợp tên lửa phòng không tầm cao S-300PMU1 từ Nga."
 VIE_air8_dec_s125vt_upgrade:0 "Nâng cấp Hiện đại hóa S-125-VT"
 VIE_air8_dec_s125vt_upgrade_desc:0 "Hiện đại hóa các tiểu đoàn tên lửa phòng không S-125 Pechora hiện có lên chuẩn S-125-VT số hóa với khả năng kháng nhiễu và độ chính xác vượt trội."
 VIE_air8_dec_su30mk2_batch1:0 "Tiếp nhận Lô Tiêm kích Su-30MK2 Đầu tiên"
 VIE_air8_dec_su30mk2_batch1_desc:0 "Ký kết hợp đồng và tiếp nhận lô tiêm kích đa năng Su-30MK2 đầu tiên, mở ra kỷ nguyên tiêm kích thế hệ 4+ cho Không quân Nhân dân Việt Nam."
 VIE_air8_dec_su30mk2_batch2:0 "Mở rộng Phi đội Tiêm kích Su-30MK2"
 VIE_air8_dec_su30mk2_batch2_desc:0 "Bổ sung các đợt tiếp nhận Su-30MK2 tiếp theo, thành lập các trung đoàn tiêm kích hiện đại bảo vệ vững chắc vùng trời và vùng biển tổ quốc."
 VIE_air8_dec_nextgen_fighter:0 "Mua sắm Tiêm kích Đa năng Thế hệ Mới"
 VIE_air8_dec_nextgen_fighter_desc:0 "Đầu tư giải ngân tiếp nhận dòng tiêm kích hiện đại thế hệ 4.5/5 nhằm duy trì ưu thế trên không và khả năng tác chiến viễn tầm."
 VIE_air8_dec_t6c_trainer:0 "Tiếp nhận Máy bay Huấn luyện Cơ bản T-6C"
 VIE_air8_dec_t6c_trainer_desc:0 "Tiếp nhận dòng máy bay cánh quạt hiện đại T-6C Texan II phục vụ giai đoạn đào tạo sơ cấp và cơ bản tại Trường Sĩ quan Không quân."
 VIE_air8_dec_l39ng_trainer:0 "Tiếp nhận Máy bay Huấn luyện Phản lực L-39NG"
 VIE_air8_dec_l39ng_trainer_desc:0 "Biên chế dòng máy bay phản lực huấn luyện L-39NG hiện đại từ Cộng hòa Séc, thay thế dòng L-39C cũ cho giai đoạn đào tạo phản lực."
 VIE_air8_dec_yak130_trainer:0 "Tiếp nhận Máy bay Huấn luyện Nâng cao Yak-130"
 VIE_air8_dec_yak130_trainer_desc:0 "Đưa vào biên chế máy bay phản lực huấn luyện và chiến đấu hạng nhẹ Yak-130, chuyển loại phi công trực tiếp lên Su-30MK2."
 VIE_air8_dec_tactical_uav:0 "Sản xuất Loạt UAV Chiến thuật Viettel"
 VIE_air8_dec_tactical_uav_desc:0 "Đưa các dòng máy bay không người lái chiến thuật do Tập đoàn Viettel nghiên cứu và chế tạo vào sản xuất loạt phục vụ trinh sát chỉ thị mục tiêu."

 ### Tech Bonuses (V8)
 VIE_air8_radar_tech:0 "Nghiên cứu Radar Cảnh giới Phòng không"
 VIE_air8_s300_sam_tech:0 "Nghiên cứu Tên lửa Phòng không Tầm cao"
 VIE_air8_multirole_tech:0 "Nghiên cứu Tiêm kích Đa nhiệm Hiện đại"

 VIE_vaeco_manufacturer:0 "Công ty Kỹ thuật Hàng không Quân sự"
 VIE_vaeco_manufacturer_desc:0 "Đơn vị nòng cốt trong công tác bảo dưỡng, sửa chữa kỹ thuật và hiện đại hóa hệ thống điện tử hàng không cho các phi đội máy bay tiêm kích, trinh sát và trực thăng quân sự."
 VIE_vaeco_mio_trait_initial:0 "Xưởng bảo dưỡng A41"
 VIE_vaeco_mio_header_maintenance:0 "Bảo dưỡng và nâng cấp"
 VIE_vaeco_mio_header_rotary:0 "Trực thăng"
 VIE_vaeco_mio_trait_overhaul_line:0 "Dây chuyền đại tu"

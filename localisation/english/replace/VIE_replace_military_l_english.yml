 vie_nav35.1.t:0 "Kiện toàn cơ cấu Vùng Hải quân"
 vie_nav35.1.d:0 "Từ năm 2009, cơ cấu chỉ huy vùng tiếp tục được hoàn thiện. Năng lực phối hợp liên vùng của Hải quân đã được nâng cao."
 vie_nav35.1.a:0 "Tiếp tục củng cố Hải quân"
 vie_nav35.2.t:0 "Tiến bộ trong tích hợp khí tài"
 vie_nav35.2.d:0 "Chương trình tích hợp hạm tàu bước sang giai đoạn nghiên cứu radar và cảm biến. Kết quả đã được ghi nhận một lần trong chương trình nghiên cứu."
 vie_nav35.2.a:0 "Tiếp tục củng cố Hải quân"
 vie_nav35.3.t:0 "Củng cố năng lực kỹ thuật hạm tàu"
 vie_nav35.3.d:0 "Năng lực kết nối và tích hợp khí tài phục vụ bức tranh tình huống biển đã được nâng cao."
 vie_nav35.3.a:0 "Tiếp tục củng cố Hải quân"
 vie_nav35.4.t:0 "Hoàn thành bảo đảm vận tải đa năng"
 vie_nav35.4.d:0 "Kíp tàu và hệ thống kỹ thuật đã hoàn thành chương trình tiếp nhận năng lực VTĐN-01. Kết quả nâng cao tầm hoạt động và hộ tống; thông báo này không cấp thêm tàu 530 hoặc 531."
 vie_nav35.4.a:0 "Tiếp tục củng cố Hải quân"
 vie_nav35.5.t:0 "Phê duyệt đóng hộ vệ chống ngầm Sông Thu"
 vie_nav35.5.d:0 "Chương trình hộ vệ chống ngầm đa năng đã được phê duyệt. Có thể giải ngân đóng chiếc đầu tiên bằng quyết định riêng, với thời gian 1.095 ngày. Cấu hình trong trò chơi sử dụng thân hộ vệ và module chống ngầm đã làm chủ; đây là mô hình hóa gameplay từ thông số và vai trò của dự án năm 2026."
 vie_nav35.5.a:0 "Mở chương trình đóng chiếc đầu tiên"
 vie_nav35.6.t:0 "Bàn giao hộ vệ chống ngầm Sông Thu"
 vie_nav35.6.d:0 "Chiếc hộ vệ Song Thu ASW 2026 đã hoàn tất và được bàn giao vào hạm đội dự bị. Chương trình chiếc đầu tiên kết thúc, không thu thêm tiền hoặc cấp thêm tàu khi xem lại thông báo."
 vie_nav35.6.a:0 "Đưa tàu vào đội hình Hải quân"
 VIE_nav35_investment_tt:0 "Khởi động Đề án Công nghiệp Đóng tàu Quân sự tự chủ chiến lược:\n • Xây dựng §G1 Xưởng đóng tàu quân sự (Dockyard)§! và mở thêm §G1 ô đất xây dựng công nghiệp§! tại TP.HCM / Ba Son (§Y522§!).\n • Tốc độ cơ động hạm tàu: §G+2.0%§!; cấp tinh thần §YCông nghiệp Đóng tàu Quân sự (Bậc 1)§!.\n • Mở khóa các quyết định đầu tư công nghệ đóng tàu và nhận §G+15 Điểm Chỉ huy§!."
 VIE_nav35_molniya_tt:0 "Chuyển giao công nghệ và tổ chức đóng loạt tàu tên lửa Molniya tại Tổng công ty Ba Son:\n • Xây dựng thêm §G1 Xưởng đóng tàu quân sự (Dockyard)§! và §G1 ô đất xây dựng§! tại Ba Son (§Y522§!).\n • Bàn giao §G32 quả tên lửa chống hạm Kh-35 Uran-E§! vào kho đạn của nhà máy đóng tàu.\n • Nâng cấp tinh thần §YCông nghiệp Đóng tàu Quân sự§! và ưu đãi nghiên cứu Tàu tên lửa §G+50%§!.\n • Mở quyết định chuẩn bị đóng mới loạt tàu Molniya trong nước."
 VIE_nav35_asw_program_tt:0 "Phê duyệt chương trình đóng tàu hộ vệ chống ngầm đa năng Sông Thu (Mốc 2026):\n • Mở rộng §G1 Căn cứ Hải quân (Naval Base)§! tại Đà Nẵng (§Y520§!) phục vụ neo đậu và thử nghiệm.\n • Sức tấn công chống ngầm: §G+3.0%§!.\n • Mở thông báo phê duyệt chương trình và quyết định đóng chiếc hộ vệ đầu tiên (0,6 tỷ USD, 1.095 ngày).\n • Nhận §G+25 Điểm Chỉ huy§!."
 VIE_nav35_base_support_tt:0 "Phát triển Cam Ranh thành Trung tâm Hậu cần — Kỹ thuật Hải quân Chiến lược:\n • Xây dựng mở rộng §G2 Cấp Căn cứ Hải quân (Naval Base)§! kiên cố tại Cam Ranh (§Y521§!).\n • Cải thiện tốc độ cơ động hậu cần hạm đội: §G+2.0%§!.\n • Cung cấp §G40 xe hậu cần cơ động kỹ thuật quân sự hạng nặng§! cho căn cứ.\n • Cấp tinh thần: §YBảo đảm Kỹ thuật Hải quân (Bậc 1)§! và mở quyết định bảo đảm căn cứ (2 tỷ USD).\n • Nhận §G+20 Điểm Chỉ huy§!."
 VIE_nav35_vt_program_tt:0 "Tiếp nhận hai tàu vận tải đa năng Ro-Ro 5612 VTĐN-01 số hiệu 530 và 531:\n • Nâng cao năng lực vận tải đổ bộ đường biển (Naval Invasion Capacity): §G+10 sư đoàn / lữ đoàn§!.\n • Tiếp nhận §G20 tàu vận tải đa năng (Convoys)§! và §G20 xe bọc thép lội nước chuyên dụng (APC)§!.\n • Mở quyết định tiếp nhận năng lực vận tải đa năng (2 tỷ USD, 180 ngày).\n • Nhận §G+20 Điểm Chỉ huy§!."
 VIE_nav35_blue_support_tt:0 "Xây dựng hạm đội tiếp tế và bảo đảm kỹ thuật hậu cần viễn hành:\n • Xây dựng mở rộng §G1 Căn cứ Hải quân (Naval Base)§! tại Cam Ranh (§Y521§!).\n • Tầm hoạt động tối đa của hạm đội: tăng thêm §G+4.0%§!.\n • Tiếp nhận §G25 tàu vận tải tiếp dầu và hậu cần viễn dương (Convoys)§! vào biên chế.\n • Cấp tinh thần: §YBảo đảm Triển khai Biển xa§! và mở quyết định bảo đảm biển xa (8 tỷ USD).\n • Nhận §G+20 Điểm Chỉ huy§!."

 VIE_naval_procurement_category:0 "Đầu tư và bảo đảm Hải quân"
 VIE_naval_procurement_category_desc:0 "Các chương trình đầu tư có thời gian và quyết định huấn luyện, bảo dưỡng của Hải quân. Chi phí giải ngân qua quỹ quốc gia Millennium Dawn; không tự cấp tàu chiến."


### ============================================================

 VIE_nav_surface_fleet_readiness:0 "Sẵn sàng Chiến đấu Tàu mặt nước"
 VIE_nav_surface_fleet_readiness_desc:0 "Chuẩn hóa quy trình sẵn sàng chiến đấu tàu mặt nước, nâng cao khả năng che chắn và tốc độ đội hình."
 VIE_nav_asw_mastery:0 "Năng lực Chống ngầm Toàn diện"
 VIE_nav_asw_mastery_desc:0 "Hiệp đồng tàu mặt nước và tàu ngầm nâng cao khả năng phát hiện dưới nước và che chắn đội hình."
 VIE_nav_marine_brigades:0 "Lữ đoàn Hải quân Đánh bộ Tinh nhuệ"
 VIE_nav_marine_brigades_desc:0 "Lực lượng Hải quân đánh bộ 101 và 147 được huấn luyện cơ động cao, thiện chiến trong tác chiến đảo và đổ bộ."
 VPA_Integrated_Defense_Doctrine_1:0 "Phòng thủ Biển Tích hợp (Giai đoạn I)"
 VPA_Integrated_Defense_Doctrine_1_desc:0 "Tổ chức phòng thủ bờ và đảo theo chiến lược tự vệ. Tăng hiệu quả công sự duyên hải và phòng thủ chống đổ bộ."
 VPA_Integrated_Defense_Doctrine_Capstone:0 "Lưới lửa Phòng thủ Bờ - Đảo (Capstone P)"
 VPA_Integrated_Defense_Doctrine_Capstone_desc:0 "Củng cố phòng thủ bờ và đảo, nâng cao hiệu quả công sự, chống đổ bộ và cảnh giới biển. Thay thế giai đoạn học thuyết trước."
 VPA_Fleet_Development_Priority:0 "Định hướng Phát triển Hạm đội"
 VPA_Multirole_Task_Groups:0 "Biên đội Tác chiến Đa nhiệm Hạm đội"
 VPA_Greenwater_Doctrine_1:0 "Hải quân Biển gần Hiện đại (Green-water I)"
 VPA_Greenwater_Doctrine_Capstone:0 "Hải quân Biển gần Tự chủ (Capstone G)"
 VPA_Bluewater_Doctrine_1:0 "Chương trình Hải quân Biển xa (Blue-water I)"
 VPA_Bluewater_Doctrine_Capstone:0 "Hải quân Biển xa Bền vững (Capstone B)"
 VIE_nav_capstone_iron_shield:0 "Hải quân Chính quy: Lá chắn Thép Biển Đông"
 VIE_nav_capstone_master_of_seas:0 "Hải quân Chính quy: Làm chủ Vùng biển Chủ quyền"
 VIE_nav_capstone_ocean_surge:0 "Hải quân Chính quy: Hùng cường Vươn khơi Đại dương"
 VIE_nav_shipbuilding_mastery:0 "Tự chủ Công nghiệp Đóng tàu Chiến lược"
 VIE_decision_molniya_surge_spirit:0 "Cao trào Sản xuất Tàu tên lửa Molniya"
 VIE_decision_molniya_surge_spirit_desc:0 "Tổ chức sản xuất tại Ba Son nâng cao sản lượng xưởng đóng tàu trong 180 ngày; không cấp thêm tàu Molniya."
 VIE_decision_gepard_fleet_spirit:0 "Nâng cấp Khinh hạm Gepard 3.9"
 VIE_decision_gepard_fleet_spirit_desc:0 "Tối ưu hóa khả năng tác chiến và tự vệ của các biên đội khinh hạm tàng hình Đinh Tiên Hoàng, Quang Trung."
 VIE_decision_kilo_sustainment_spirit:0 "Duy tu Kỹ thuật Hạm đội Tàu ngầm Kilo"
 VIE_decision_kilo_sustainment_spirit_desc:0 "Chương trình bảo dưỡng và huấn luyện cải thiện khả năng phòng thủ của tàu ngầm hiện có trong 365 ngày; không yêu cầu hoặc cấp một số lượng Kilo cố định."
 VIE_decision_island_bastion_spirit:0 "Sẵn sàng trận địa phòng thủ biển đảo"
 VIE_decision_island_bastion_spirit_desc:0 "Diễn tập phối hợp trận địa duyên hải nâng cao hiệu quả công sự bờ biển trong 365 ngày; không xây công sự mới."
 VIE_decision_asw_combat_drill_spirit:0 "Diễn tập Tác chiến Chống ngầm Hạm đội"
 VIE_decision_asw_combat_drill_spirit_desc:0 "Đợt tập trận săn ngầm liên vùng nâng cao khả năng phát hiện và tiêu diệt tàu ngầm đối phương."
 VIE_decision_coastal_alert_surge_spirit:0 "Báo động Tác chiến Toàn tuyến Duyên hải"
 VIE_decision_coastal_alert_surge_spirit_desc:0 "Toàn bộ các trận địa pháo, tên lửa bờ biển và công sự đảo chuyển sang trạng thái sẵn sàng chiến đấu cao nhất."


 VIE_lf_l0_reward_tt:0 "Khởi động §YĐề án Hiện đại hóa Lục quân Nhân dân Việt Nam§!:\n • Mở khóa 3 trụ cột phát triển: §YThế trận Quốc phòng Toàn dân§!, §YQuân đoàn Chủ lực Tinh nhuệ§!, §YCông nghiệp Quốc phòng Mặt đất§!.\n • Nâng cao sẵn sàng tổ chức lục quân: §G+1.0%§!.\n • Mở đường tiếp nhận các thế hệ trang bị và học thuyết tác chiến mặt đất mới.\n • Nhận §G+25 Điểm Chỉ huy§!, §G+15 Kinh nghiệm Lục quân§!, và ưu đãi nghiên cứu Bộ binh §G+50%§!."

 VIE_lf_d1_reward_tt:0 "Kiện toàn thế trận 7 Quân khu và Bộ Tư lệnh Thủ đô Hà Nội:\n • Cấp tinh thần: §YThế trận Phòng thủ Lãnh thổ (Bậc 1)§!\n   - Phòng thủ lục quân trên lãnh thổ cốt lõi: §G+1.0%§!\n • Phân định rõ trách nhiệm phòng thủ khu vực và phối hợp tác chiến với quân đoàn cơ động."

 VIE_lf_d2_reward_tt:0 "Chuẩn hóa huấn luyện Bộ đội Địa phương và Dân quân Tự vệ:\n • Giảm thời gian huấn luyện đơn vị tại chỗ: §G-1.0%§!\n • Nâng cao kỹ năng phòng thủ địa bàn, cứu hộ cứu nạn và hiệp đồng tác chiến.\n • Nhận §G+15 Kinh nghiệm Lục quân / Độ thông thạo học thuyết§!."

 VIE_lf_d3_reward_tt:0 "Kiện toàn hệ thống Đăng ký và Quản lý Dự bị Động viên:\n • Cấp tinh thần: §YChế độ Dự bị Động viên Thống nhất§!\n   - Tốc độ động viên nhân lực chiến lược: §G+5.0%§!\n   - Tỷ lệ tiếp viện chiến trường: §G+0.5%§!\n • Sẵn sàng bổ sung quân số có tổ chức khi chuyển trạng thái thời chiến."

 VIE_lf_d4_reward_tt:0 "Củng cố Khu vực Phòng thủ (KVPT) Tỉnh và Thành phố Trực thuộc Trung ương:\n • Nâng cấp tinh thần: §YThế trận Phòng thủ Lãnh thổ (Bậc 2)§!\n   - Phòng thủ lục quân trên lãnh thổ cốt lõi: đạt §G+2.0%§!\n • Xây dựng thế trận 'Làng giữ làng, xã giữ xã, huyện giữ huyện' kiên vững."

 VIE_lf_d5_reward_tt:0 "Xây dựng mạng lưới Công sự Trận địa và Căn cứ Chiến dịch:\n • Hệ số đào hào tối đa (Max Entrenchment): §G+3.0%§!\n • Chuẩn bị hệ thống công sự bí mật, hầm hào kiên cố và trận địa phân tán.\n • Nhận ưu đãi nghiên cứu Công sự và Công binh: §G+50%§!."

 VIE_lf_d6_reward_tt:0 "Xây dựng mạng lưới Dự trữ và Cung ứng Hậu cần Địa phương:\n • Giảm tiêu thụ tiếp tế toàn quân: §G-1.0%§!\n • Kết hợp mạng lưới hậu cần quân sự và dân sự (vận tải, y tế, quân nhu).\n • Giảm hao hụt vật tư tiêu hao khi xảy ra khủng hoảng: §G-1.0%§!."

 VIE_lf_d7_reward_tt:0 "Diễn tập Hiệp đồng Tác chiến Quân khu và Quân đoàn Chủ lực:\n • Tốc độ lập kế hoạch tác chiến chiến trường: §G+1.0%§!\n • Nâng cao khả năng điều hành phối hợp đa lực lượng trên các hướng chiến lược.\n • Nhận §G+15 Kinh nghiệm Lục quân / Độ thông thạo học thuyết§!."

 VIE_lf_d8_reward_tt:0 "Hoàn thiện Thế trận Quốc phòng Toàn dân Thống nhất:\n • Nâng cấp tinh thần tối cao: §YThế trận Quốc phòng Toàn dân (Bậc 3)§!\n   - Phòng thủ lục quân trên lãnh thổ cốt lõi: đạt §G+4.0%§!\n   - Tốc độ hồi phục tổ chức trên sân nhà: §G+5.0%§!\n • Cùng với $VIE_lf_modernize_army_command_system$ mở đường cho $VIE_lf_modern_elite_combined_army_capstone$."

 VIE_lf_b1_reward_tt:0 "Tổ chức lại các Quân đoàn Chủ lực Tác chiến Cơ động:\n • Sẵn sàng tổ chức lục quân: §G+1.0%§!\n • Tinh gọn biên chế, kiện toàn chỉ huy các Quân đoàn cơ động chiến lược.\n • Nhận §G+20 Điểm Chỉ huy§! và §G+15 Kinh nghiệm Lục quân§!."

 VIE_lf_b2_reward_tt:0 "Đổi mới Quy trình Huấn luyện Tác chiến Quân đoàn Hợp thành:\n • Giảm thời gian huấn luyện đơn vị: §G-3.0%§!\n • Tốc độ tích lũy kinh nghiệm chiến đấu lục quân: §G+3.0%§!\n • Ứng dụng mô phỏng số và thao trường sát thực tế chiến đấu."

 VIE_lf_b3_reward_tt:0 "Tiêu chuẩn hóa Hệ thống Trang bị và Vũ khí Bộ binh Thế hệ Mới:\n • Chế tạo và trang bị súng trường tiến công thế hệ mới (STV-380, STV-215, Galil ACE).\n • Cấp phát đồng bộ áo giáp, mũ chống đạn, kính nhìn đêm và khí tài quang học cá nhân.\n • Nhận ưu đãi nghiên cứu Vũ khí Bộ binh: §G+50%§!."

 VIE_lf_b4_reward_tt:0 "Nâng cao Năng lực Công binh Chiến đấu và Bảo đảm Cơ động:\n • Tốc độ đào hào công sự (Dig-in Speed): §G+3.0%§!\n • Giảm hình phạt tác chiến trên địa hình hiểm trở: §G+1.0%§!\n • Trang bị khí tài vượt sông, mở đường và xử lý chướng ngại vật dã chiến.\n • Nhận ưu đãi nghiên cứu Kỹ thuật Công binh: §G+50%§!."

 VIE_lf_b5_reward_tt:0 "Hiện đại hóa Hỏa lực Pháo binh và Tên lửa Mặt đất:\n • Tăng cường độ chính xác và tốc độ phản ứng hỏa lực chiến dịch.\n • Tích hợp radar trinh sát pháo binh và trinh sát dẫn bắn quang - điện tử.\n • Nhận ưu đãi nghiên cứu Pháo binh và Pháo phản lực: §G+50%§!.\n • Nhận §G+15 Kinh nghiệm Lục quân§!."

 VIE_lf_b6_reward_tt:0 "Chuẩn hóa Lưới Phòng không Dã chiến Bảo vệ Lục quân:\n • Tăng cường khả năng đánh chặn trực thăng vũ trang và máy bay tầm thấp của địch.\n • Bảo vệ an toàn các đội hình thiết giáp và sở chỉ huy quân đoàn cơ động.\n • Nhận ưu đãi nghiên cứu Phòng không Lục quân: §G+50%§!."

 VIE_lf_b7_reward_tt:0 "Thành lập Phân đội UAV Trinh sát và Chỉ thị Mục tiêu Chiến thuật:\n • Tăng hệ số trinh sát chiến trường (Reconnaissance): §G+2.0%§!\n • Cung cấp tọa độ mục tiêu theo thời gian thực cho hỏa lực pháo binh và chỉ huy quân đoàn.\n • Nhận ưu đãi nghiên cứu Thiết bị Không người lái (UAV): §G+50%§!."

 VIE_lf_b8_reward_tt:0 "Tổ chức Bảo đảm Hậu cần – Kỹ thuật Tác chiến Hợp nhất:\n • Giảm tiêu thụ tiếp tế toàn quân đội: §G-2.0%§!\n • Giảm tỉ lệ hao hụt kỹ thuật và tiêu hao cơ giới: §G-2.0%§!\n • Tăng tốc độ phục hồi sẵn sàng chiến đấu sau các đợt hành quân tác chiến đường dài."

 VIE_lf_i1_reward_tt:0 "Đổi mới Quản trị các Tổ hợp Công nghiệp Quốc phòng Lục quân:\n • Cấp tinh thần: §YQuản trị Công nghiệp Quốc phòng Tiên tiến§!\n   - Tốc độ tăng hiệu suất xưởng quân khí: §G+3.0%§!\n • Chuẩn hóa quy trình chế tạo vũ khí trang bị theo tiêu chuẩn quân sự hiện đại.\n • Nhận ưu đãi nghiên cứu Công nghiệp Quân sự: §G+50%§!."

 VIE_lf_i2_reward_tt:0 "Đầu tư Dây chuyền Chế tạo Đạn dược Chính xác tại Nhà máy Z131 / Z113:\n • Tự chủ hoàn toàn nguồn cung cấp đạn pháo, đạn cối và liều phóng chất lượng cao.\n • Hỗ trợ vật tư giảm hao hụt chiến trường: §G-1.0%§!.\n • Nhận ưu đãi nghiên cứu Đạn dược và Hỏa lực Pháo binh: §G+50%§!."

 VIE_lf_i3_reward_tt:0 "Nâng cao Năng lực Đại tu và Chế tạo Kết cấu Vỏ giáp Cơ giới (Z153):\n • Tự chủ nâng cấp vòng đời xe tăng T-54/55M và xe chiến đấu bộ binh BMP.\n • Làm chủ công nghệ luyện kim giáp thép và tích hợp giáp phản ứng nổ bảo vệ tổ lái.\n • Nhận ưu đãi nghiên cứu Xe Chiến đấu Bộ binh (IFV): §G+50%§!."

 VIE_lf_i4_reward_tt:0 "Đề án Chế tạo Xe Chiến đấu Bộ binh Bánh xích XCB-01 Nội địa:\n • Mở khóa các quyết định nghiên cứu và chế tạo xe chiến đấu bộ binh XCB-01.\n • Làm chủ tích hợp tháp pháo tự động 30mm, tên lửa chống tăng và hệ thống kính ngắm kỹ thuật số.\n • Nhận ưu đãi nghiên cứu Xe Chiến đấu Bộ binh (IFV): §G+50%§!."

 VIE_lf_i5_reward_tt:0 "Hoàn thiện Dây chuyền Sản xuất Loạt Khí tài Mặt đất Nội địa:\n • Mở khóa quyết định đưa xe chiến đấu bộ binh XCB-01 vào sản xuất hàng loạt.\n • Giảm chi phí công nghiệp chế tạo phương tiện chiến đấu cơ giới: §G-5.0%§!.\n • Nhận ưu đãi nghiên cứu Thiết giáp và Xe cơ giới Chiến đấu: §G+50%§!."

 VIE_lf_p1_reward_tt:0 "Xác lập Học thuyết Chiến tranh Nhân dân Bảo vệ Tổ quốc:\n • Cấp học thuyết: §YChiến tranh Nhân dân Phòng thủ Chiến lược (Bậc 1)§!\n   - Sức phòng thủ lục quân toàn tuyến: §G+1.0%§!\n   - Tốc độ di chuyển cơ động: -1.0% (tập trung chốt giữ địa bàn)\n • Lấy thế trận làng xã, khu vực phòng thủ và quân khu làm nền tảng giam chân đối phương."

 VIE_lf_p2_reward_tt:0 "Thiết lập Lưới Hỏa lực Phòng ngự Nhiều tầng Trận địa:\n • Hệ số đào hào tối đa (Max Entrenchment): §G+5.0%§!\n • Bố trí hỏa lực tầm xa, tầm trung và tầm gần đan xen tiêu diệt sinh lực địch.\n • Nhận §G+10 Kinh nghiệm Lục quân§!."

 VIE_lf_p3_reward_tt:0 "Xây dựng Lực lượng Dự bị Chiến dịch Quân khu Cơ động:\n • Cấp tinh thần: §YDự bị Chiến dịch Thường trực§!\n   - Tốc độ hồi phục tổ chức (Army Morale): §G+3.0%§!\n • Sẵn sàng bổ sung hỏa lực và quân số ứng cứu kịp thời các trận tuyến bị uy hiếp."

 VIE_lf_p4_reward_tt:0 "Tổ chức Cụm Hỏa lực Chống Đột phá Thiết giáp Chiến dịch:\n • Tăng cường độ phòng thủ toàn quân: §G+1.0%§!\n • Tối ưu hóa lưới hỏa lực tên lửa chống tăng và chướng ngại vật mìn chống tăng.\n • Nhận ưu đãi nghiên cứu Vũ khí Chống tăng (ATGM): §G+50%§!."

 VIE_lf_p5_reward_tt:0 "Thế trận Tiêu hao và Bào mòn Chiến lược Theo Chiều sâu:\n • Giảm tiêu thụ tiếp tế cho quân đội: §G-2.0%§!\n • Giảm hao tổn vật tư chiến đấu khi phòng ngự kéo dài: §G-1.0%§!\n • Làm kiệt quệ tiềm lực tấn công và bẻ gãy ý chí tác chiến của đối phương."

 VIE_lf_p6_reward_tt:0 "Đỉnh cao Học thuyết: Phản công Chiến dịch Trong Chiến tranh Nhân dân:\n • Cấp học thuyết tối cao: §YChiến tranh Nhân dân Phòng thủ Chiến lược (Bậc 2)§!\n   - Sức phòng thủ lục quân toàn tuyến: đạt §G+2.0%§!\n   - Tốc độ đào hào công sự: §G+6.0%§!\n   - Tỷ lệ tiếp viện chiến trường: §G+0.5%§!\n • Đập tan mọi mưu toan xâm lược bằng sức mạnh tổng hợp của toàn dân tộc."

 VIE_lf_m1_reward_tt:0 "Xác lập Học thuyết Tác chiến Hiệp đồng Binh chủng Cơ giới:\n • Cấp học thuyết: §YTác chiến Cơ giới Hợp thành (Bậc 1)§!\n   - Sức tấn công của lực lượng thiết giáp: §G+2.0%§!\n   - Tăng nhẹ mức tiêu hao nhiên liệu: +3.0%\n   - Tăng nhẹ mức tiêu thụ tiếp tế: +1.0%\n • Chuẩn hóa phối hợp tác chiến giữa xe tăng, xe chiến đấu bộ binh và pháo tự hành."

 VIE_lf_m2_reward_tt:0 "Xây dựng các Lữ đoàn Bộ binh Cơ giới Thọc sâu Tiên phong:\n • Nâng cao khả năng cơ động việt dã và đột kích hỏa lực mạnh.\n • Chuẩn bị đội hình tiến công thọc sâu đánh chiếm các mục tiêu chiến lược.\n • Nhận §G+15 Kinh nghiệm Lục quân / Độ thông thạo học thuyết§!."

 VIE_lf_m3_reward_tt:0 "Hoàn thiện Chiến thuật Mũi nhọn Thiết giáp Đột kích ('Nắm đấm thép'):\n • Tổ chức lục quân sẵn sàng chiến đấu: §G+1.0%§!\n • Tối ưu hóa khả năng dẫn đầu mũi tiến công của các trung đoàn xe tăng chủ lực.\n • Nhận ưu đãi nghiên cứu Xe tăng Chiến đấu Chủ lực (MBT): §G+50%§!."

 VIE_lf_m4_reward_tt:0 "Tập trung Hỏa lực Pháo binh Yểm trợ Tiến công Cơ giới:\n • Sức tấn công pháo binh mặt đất: §G+2.0%§!\n • Dựng màn đạn hỏa lực dọn đường cho xe tăng và bộ binh cơ giới xung phong.\n • Nhận ưu đãi nghiên cứu Pháo binh Tự hành và Cơ giới: §G+50%§!."

 VIE_lf_m5_reward_tt:0 "Chiến thuật Đột phá Xung kích và Chia cắt Chiến dịch Chiều sâu:\n • Tốc độ lập kế hoạch tác chiến tiến công: §G+3.0%§!\n • Tăng cường khả năng khoét sâu lỗ phá vỡ và làm tê liệt hậu phương địch.\n • Nhận §G+15 Kinh nghiệm Lục quân§!."

 VIE_lf_m6_reward_tt:0 "Đỉnh cao Học thuyết: Phản công Cơ giới Hợp thành Quy mô Quân đoàn:\n • Cấp học thuyết tối cao: §YTác chiến Cơ giới Hợp thành (Bậc 2)§!\n   - Sức tấn công thiết giáp: đạt §G+4.0%§!\n   - Phòng thủ thiết giáp: §G+1.0%§!\n   - Tiêu hao nhiên liệu: +5.0%\n   - Tiêu thụ tiếp tế: +2.0%\n • Làm chủ nghệ thuật tác chiến cơ động quy mô chiến dịch hiện đại."

 VIE_lf_r1_reward_tt:0 "Xác lập Học thuyết Tác chiến Cơ động Linh hoạt:\n • Cấp học thuyết: §YTác chiến Cơ động Linh hoạt (Bậc 1)§!\n   - Tốc độ hành quân cơ động lục quân: §G+2.0%§!\n • Phát huy truyền thống tác chiến 'Tránh chỗ mạnh, đánh chỗ yếu, thoắt ẩn thoắt hiện'."

 VIE_lf_r2_reward_tt:0 "Cơ cấu Chỉ huy Phân tán và Trao quyền Quyết đoán Chiến thuật:\n • Tổ chức lục quân sẵn sàng chiến đấu: §G+1.0%§!\n • Giữ vững sức chiến đấu độc lập của các phân đội khi chiến trường bị chia cắt.\n • Nhận §G+20 Điểm Chỉ huy§!."

 VIE_lf_r3_reward_tt:0 "Nghệ thuật Khai thác Địa hình Rừng núi và Thủy văn Nhiệt đới:\n • Giảm hình phạt tác chiến trên địa hình rừng, núi và đầm lầy: §G+4.0%§!\n • Biến chiến trường hiểm trở thành mồ chôn các tập đoàn quân cơ giới nặng nề của địch."

 VIE_lf_r4_reward_tt:0 "Chiến thuật Đột kích 'Tụ nhanh — Đánh mạnh — Tán gọn':\n • Tập trung ưu thế hỏa lực chớp nhoáng tiêu diệt sinh lực đối phương.\n • Phân tán an toàn tránh đòn phản kích bằng không quân và pháo binh địch.\n • Nhận ưu đãi nghiên cứu Xe Cơ động Tác chiến: §G+50%§!."

 VIE_lf_r5_reward_tt:0 "Nghệ thuật Tác chiến Đêm và Tập kích Luồn sâu Tầm gần:\n • Giảm mất tổ chức lục quân khi hành quân ban đêm: §G-3.0%§!\n • Phát huy sở trường đánh gần, đánh đêm, triệt tiêu ưu thế không kích và hỏa lực xa của đối phương.\n • Nhận §G+15 Kinh nghiệm Lục quân§!."

 VIE_lf_r6_reward_tt:0 "Đỉnh cao Học thuyết: Bậc thầy Vận động Tác chiến Phi đối xứng:\n • Cấp học thuyết tối cao: §YTác chiến Cơ động Linh hoạt (Bậc 2)§!\n   - Tốc độ hành quân cơ động: đạt §G+4.0%§!\n   - Khả năng trinh sát chiến trường: §G+2.0%§!\n • Làm chủ không gian tác chiến, đánh bại mọi đối thủ bằng nghệ thuật cơ động siêu việt."

 VIE_lf_f1_reward_tt:0 "Hiện đại hóa Hệ thống Chỉ huy Tác chiến Mặt đất C4ISR:\n • Tốc độ lập kế hoạch tác chiến chiến dịch: §G+2.0%§!\n • Tăng giới hạn Điểm Chỉ huy (Command Power): §G+20§!.\n • Kết nối thông suốt sở chỉ huy chiến dịch tới từng phân đội chiến đấu.\n • Nhận ưu đãi nghiên cứu Thiết bị Chỉ huy & Liên lạc (C&C): §G+50%§!."

 VIE_lf_f2_reward_tt:0 "Hoàn tất Xây dựng Lục quân Nhân dân 'Tinh, Gọn, Mạnh, Hiện đại':\n • Thiết lập danh hiệu: §YLục quân Nhân dân Việt Nam Hiện đại Thế kỷ 21§!\n • Sẵn sàng tổ chức toàn quân: §G+1.0%§! (tổng cộng các nguồn đạt mức tối ưu)\n • Hội tụ trọn vẹn sức mạnh quốc phòng toàn dân và các quân đoàn chủ lực tinh nhuệ.\n • Nhận §G+35 Điểm Chỉ huy§! và vinh danh toàn quân chủng Lục quân!"


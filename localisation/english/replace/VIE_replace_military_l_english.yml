 VIE_vaeco_mio_trait_trainer_fleet:0 "Đội bay huấn luyện"
 VIE_vaeco_mio_trait_transport_helicopters:0 "Trực thăng vận tải"
 VIE_vaeco_mio_trait_naval_helicopters:0 "Trực thăng hải quân"

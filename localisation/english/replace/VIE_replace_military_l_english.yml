 ### Quyết định thường kỳ - sẵn sàng chiến đấu
 VIE_exercise_military_region:0 "Diễn tập quân khu"
 VIE_exercise_military_region_desc:0 "Tổ chức diễn tập cấp quân khu hằng năm, kết hợp bộ đội chủ lực, bộ đội địa phương và dân quân tự vệ. Tích lũy kinh nghiệm chỉ huy và nâng độ sẵn sàng."
 VIE_procurement_batch:0 "Mua sắm bổ sung trang bị"
 VIE_procurement_batch_desc:0 "Dùng ngân khố mua thêm một lô vũ khí bộ binh và xe cơ giới từ các đối tác quốc phòng. Không thay thế được năng lực sản xuất trong nước, nhưng lấp nhanh chỗ thiếu."
 VIE_procurement_batch_tt:0 "Ngân khố đủ chi trả cho đợt mua sắm"
 VIE_asean_joint_patrol:0 "Tuần tra chung với hải quân ASEAN"
 VIE_asean_joint_patrol_desc:0 "Phối hợp tuần tra và huấn luyện với hải quân Philippines, Malaysia và Indonesia ở khu vực Biển Đông. Được lòng các nước láng giềng nhưng Bắc Kinh không vui."
 VIE_extended_conscription:0 "Đợt tuyển quân mở rộng"
 VIE_extended_conscription_desc:0 "Nâng chỉ tiêu nhập ngũ trong một năm. Tăng nhân lực sẵn có nhưng gây áp lực lên nông thôn và ổn định xã hội."

 # Hai quan V35.1
 vie_nav35.7.t:0 "Mốc đặt ky tàu hộ vệ năm 2026"
 vie_nav35.7.d:0 "Ngày 5/10/2026 đánh dấu lễ đặt ky tàu hộ vệ chống ngầm đa năng tại Sông Thu trong lịch sử. Mốc này được ghi nhận như thông tin bối cảnh; tiến độ nghiên cứu, giải ngân và thử nghiệm trong trò chơi vẫn theo chương trình đã lựa chọn, không tự nhận tàu hoặc hoàn tất dự án."
 vie_nav35.7.a:0 "Tiếp tục đầu tư theo tiến độ"
 VIE_nav35_N00:0 "Hiện đại hóa lực lượng bảo vệ hướng biển"
 VIE_nav35_N00_desc:0 "Xác lập chương trình phát triển Hải quân theo điều kiện kinh tế và chiến lược tự vệ của Việt Nam. Mở năm tuyến năng lực: bộ máy chỉ huy, nhận thức tình huống biển, lực lượng tác chiến, công nghiệp và bảo đảm."
 VIE_nav35_T01:0 "Kiện toàn hệ thống các Vùng Hải quân"
 VIE_nav35_T01_desc:0 "Chương trình kiện toàn các Vùng Hải quân bắt đầu từ năm 2000. Khi đến năm 2009, sự kiện thành lập Vùng 2 bổ sung hiệu ứng tổ chức và phối hợp liên vùng. Không tự tuyên bố đã tồn tại đủ năm vùng từ đầu game."
 VIE_nav35_T02:0 "Học viện Hải quân: đào tạo sĩ quan thế hệ mới"
 VIE_nav35_T02_desc:0 "Đầu tư giáo trình cho khí tài mới, ngoại ngữ kỹ thuật, huấn luyện mô phỏng và trình độ sĩ quan. Focus giải quyết vấn đề nhân lực đi trước trang bị."
 VIE_nav35_T03:0 "Kíp tàu chính quy và luyện tập trên biển"
 VIE_nav35_T03_desc:0 "Chuẩn hóa quy trình huấn luyện thường xuyên, kiểm tra kỹ thuật, phối hợp cán bộ tàu và cơ quan bảo đảm. Có tính áp dụng cho nhiều lớp tàu, không phụ thuộc vào một thương vụ mua sắm."
 VIE_nav35_T04:0 "Bộ chỉ huy hiệp đồng tác chiến biển"
 VIE_nav35_T04_desc:0 "Xây dựng chuẩn trao đổi thông tin và tham mưu hợp đồng cho các đơn vị tàu mặt nước, trên không, dưới mặt nước và lực lượng bờ. Đây là chương trình tổ chức giả định dựa trên nhu cầu hiện đại hóa đã được công khai."
 VIE_nav35_S01:0 "Mạng cảnh giới biển và radar bờ"
 VIE_nav35_S01_desc:0 "Hiện đại hóa công tác trinh sát, cảnh giới và tiếp nhận báo cáo từ lực lượng bờ và tàu biển. Không đồng nhất hoạt động Hải quân với nhiệm vụ thực thi pháp luật của Cảnh sát biển."
 VIE_nav35_S02:0 "Lữ đoàn Không quân Hải quân 954"
 VIE_nav35_S02_desc:0 "Phát triển khai thác Ka-28, DHC-6 và EC-225 theo nhiệm vụ được công bố. Nhấn mạnh đào tạo phi hành đoàn, bảo dưỡng và nhận thức tình huống chung; các thương vụ mua sắm xử lý bằng event."
 VIE_nav35_S03:0 "Bức tranh tình huống biển hợp nhất"
 VIE_nav35_S03_desc:0 "Bức tranh tình huống biển có thể được xây dựng từng bước từ radar bờ và thông tin của tàu mặt nước. Sau khi thành lập Lữ đoàn Không quân Hải quân 954 năm 2013, nếu đã hoàn thành S02 thì nhận thêm hiệu ứng trinh sát và phối hợp; S02 không khóa học thuyết ở giai đoạn 2000-2012."
 VIE_nav35_W01:0 "Tái cơ cấu đội tàu chiến hiện đại"
 VIE_nav35_W01_desc:0 "Không trực tiếp cấp tàu: mở hướng huấn luyện, bảo đảm và những chương trình phát triển năng lực theo lớp tàu."
 VIE_nav35_W02:0 "Lữ đoàn 167: khai thác Molniya"
 VIE_nav35_W02_desc:0 "Tập trung năng lực làm chủ và bảo đảm tàu tên lửa Molniya. Tàu HQ-377, HQ-378 được Ba Son bàn giao cho Lữ đoàn 167 năm 2014, nhưng việc đóng tàu và bàn giao trang bị vẫn do nhánh công nghiệp/event phụ trách."
 VIE_nav35_W03:0 "Lữ đoàn 162: làm chủ tàu hộ vệ Gepard"
 VIE_nav35_W03_desc:0 "Khác với tàu tấn công nhanh, Gepard hướng tới nhiệm vụ chiến đấu mặt nước, phối hợp đội hình và hoạt động biển dài ngày hơn. Focus thưởng vận hành; thương vụ và số lượng tàu là event lịch sử."
 VIE_nav35_W04:0 "Lữ đoàn 189: làm chủ tàu ngầm Kilo 636"
 VIE_nav35_W04_desc:0 "Lữ đoàn Tàu ngầm 189 thành lập năm 2011. Focus không tự tạo sáu tàu Kilo; tập trung sẵn sàng khai thác, đào tạo kíp tàu và phát triển nghiệp vụ dưới mặt nước."
 VIE_nav35_W05:0 "Đội hình hộ vệ và chống ngầm phối hợp"
 VIE_nav35_W05_desc:0 "Phát triển cách tổ chức và huấn luyện giữa tàu hộ vệ, tàu ngầm và đơn vị hỗ trợ. Mốc 2014 phản ánh bước đầu chuyển đổi năng lực, không khẳng định Việt Nam đã sở hữu một biên đội chống ngầm đầy đủ theo cấu hình giả định trong game."
 VIE_nav35_I01:0 "Chương trình công nghiệp đóng tàu quân sự"
 VIE_nav35_I01_desc:0 "Định hướng làm chủ kỹ thuật, tăng tỷ lệ nội địa hóa từng bước và xây dựng danh mục dự án tàu quân sự, tàu bổ trợ. Không biến công nghiệp thành một khoản thưởng dockyard miễn phí."
 VIE_nav35_I02:0 "Ba Son: loạt tàu tên lửa Molniya"
 VIE_nav35_I02_desc:0 "Khởi động chương trình đóng theo giấy phép Project 12418 từ năm 2009; chuyển giao bản vẽ, công nghệ và tổ chức phân đoạn, tổng đoạn; các sự kiện nghiệm thu/bàn giao được phân theo năm 2014-2017, không cấp đủ sáu tàu ngay khi hoàn thành focus."
 VIE_nav35_I03:0 "Z173 Hồng Hà: các dòng TT400-TT400TP"
 VIE_nav35_I03_desc:0 "Nhà máy Z173 góp phần hình thành năng lực thiết kế và đóng các loại tàu nhỏ và vừa. Phân biệt tàu tuần tra và tàu chiến chủ lực; không dùng TT400TP làm tàu khu trục giả định."
 VIE_nav35_I04:0 "Viện Thiết kế tàu quân sự: tự chủ thiết kế"
 VIE_nav35_I04_desc:0 "Viện Thiết kế tàu quân sự thành lập năm 2009. Các nghiên cứu thiết kế, thử nghiệm và tích hợp là một tuyến riêng, khác với mở rộng nhà máy đóng tàu."
 VIE_nav35_I05:0 "Sông Thu: công nghệ tàu chuyên dụng và bảo đảm"
 VIE_nav35_I05_desc:0 "Sông Thu có các dự án tàu công vụ, tàu hỗ trợ, cứu nạn và vận tải. Focus thể hiện năng lực cơ khí-đóng tàu, không giả định mọi mẫu tàu này đều là chiến hạm trực tiếp chiến đấu."
 VIE_nav35_I06:0 "Tích hợp hệ thống vũ khí và khí tài tàu chiến"
 VIE_nav35_I06_desc:0 "Tích hợp radar, khí tài và hệ thống chỉ huy tàu chiến. Các mốc tiến bộ kỹ thuật năm 2022 và 2025 bổ sung năng lực khi chương trình đã được triển khai."
 VIE_nav35_I07:0 "Sông Thu: dự án hộ vệ chống ngầm đa năng"
 VIE_nav35_I07_desc:0 "Khởi động chương trình đóng tàu hộ vệ chống ngầm đa năng tại Sông Thu từ năm 2026. Sau event phê duyệt, quyết định đóng chiếc đầu tiên giải ngân 0,6 tỷ USD và bàn giao một hộ vệ sau 1.095 ngày; cần công nghệ và cơ sở đóng tàu phù hợp."
 VIE_nav35_L01:0 "Cam Ranh: trung tâm bảo đảm hải quân"
 VIE_nav35_L01_desc:0 "Củng cố tổ chức bảo đảm kỹ thuật, cứu hộ và tiếp tế với Cam Ranh làm trung tâm. Mở chương trình đầu tư bảo đảm căn cứ; mở rộng xưởng đóng tàu được thực hiện bằng quyết định riêng tại một state ven biển đang sở hữu."
 VIE_nav35_L02:0 "Nhà máy X52: bảo dưỡng tàu mặt nước và tàu ngầm"
 VIE_nav35_L02_desc:0 "Đầu tư công nghệ sửa chữa khí tài, hỗ trợ khai thác tàu ngầm và tàu mặt nước. Đây là năng lực duy trì vòng đời phương tiện, khác với đóng mới tại các nhà máy thuộc Tổng cục Công nghiệp quốc phòng."
 VIE_nav35_L03:0 "VTĐN-01: tàu vận tải đa năng 530 và 531"
 VIE_nav35_L03_desc:0 "Chuẩn bị tiếp nhận và khai thác năng lực vận tải đa năng VTĐN-01, gắn với tàu 530 và 531. Chương trình đầu tư có thời gian nâng cao bảo đảm hậu cần; kết quả được thể hiện bằng năng lực vận hành, không sinh tàu trên bản đồ."
 VIE_nav35_L04:0 "Cứu hộ tàu ngầm và bảo đảm hoạt động dài ngày"
 VIE_nav35_L04_desc:0 "Kết hợp năng lực của các cơ sở kỹ thuật hải quân với các tàu và phương tiện hỗ trợ. L03 tạo thưởng bổ sung nhưng không được là gate bắt buộc vì hai tàu VTĐN-01 chỉ bàn giao năm 2026."
 VIE_nav35_P01:0 "Học thuyết phòng thủ biển tích hợp"
 VIE_nav35_P01_desc:0 "Lấy việc bảo vệ vùng biển và lợi ích quốc gia làm ưu tiên. Đây là lựa chọn phân bổ đầu tư trong game, không phải lời khẳng định Việt Nam hoàn toàn từ bỏ lực lượng tàu mặt nước."
 VIE_nav35_P02:0 "Lữ đoàn 681: làm chủ tên lửa bờ"
 VIE_nav35_P02_desc:0 "Không phải focus mua tổ hợp Bastion: chỉ phát triển năng lực khai thác, chỉ huy và huấn luyện tên lửa bờ. Sự kiện mua sắm được để ở chuỗi event riêng."
 VIE_nav35_P03:0 "Lữ đoàn 146 và thế trận bảo vệ đảo"
 VIE_nav35_P03_desc:0 "Tập trung nhiệm vụ của lực lượng tại đảo và bảo đảm quân y, hậu cần, thông tin với đất liền. Phần đối ngoại và luật biển tiếp tục nằm ở nhánh Biển Đông riêng, tránh trùng lặp."
 VIE_nav35_P04:0 "Lưới phối hợp bờ - đảo - hạm đội"
 VIE_nav35_P04_desc:0 "Focus phát triển huấn luyện hợp đồng cấp quân chủng trong bối cảnh địa lý biển đảo; không đưa các chi tiết chiến thuật nhạy cảm hoặc phương án tấn công cụ thể."
 VIE_nav35_P05:0 "Hải quân đánh bộ 101/147: cơ động bảo vệ đảo"
 VIE_nav35_P05_desc:0 "Lữ đoàn 101 và 147 có lịch sử huấn luyện chuyên ngành Hải quân đánh bộ. Focus chỉ biểu thị đào tạo và khả năng cơ động chung, không coi đây là hướng chinh phục đổ bộ xa bờ."
 VIE_nav35_P06:0 "Lá chắn biển nhiều tầng"
 VIE_nav35_P06_desc:0 "Nhánh kết thúc với ưu tiên bảo vệ chủ quyền, tối ưu hóa khí tài và duy trì hoạt động trong giới hạn ngân sách. Có lợi thế khi bảo vệ nhưng giới hạn ở hoạt động viễn dương."
 VIE_nav35_H01:0 "Ưu tiên xây dựng các biên đội hạm đội"
 VIE_nav35_H01_desc:0 "Chấp nhận đầu tư lớn hơn cho vận hành tàu mặt nước, chống ngầm và hậu cần. Đây là lựa chọn ngân sách, không mặc định Việt Nam sẽ có tàu sân bay."
 VIE_nav35_H02:0 "Biên đội tàu hộ vệ - chống ngầm"
 VIE_nav35_H02_desc:0 "Dựa trên bài học khai thác Gepard, Kilo và khả năng hàng không hải quân. Mở hai hướng green-water và blue-water với mức đầu tư, phạm vi nhiệm vụ khác nhau."
 VIE_nav35_G01:0 "Lựa chọn Green-water: làm chủ vùng biển lân cận"
 VIE_nav35_G01_desc:0 "Green-water không có nghĩa là chỉ đứng sát bờ: đây là khả năng hoạt động lâu dài tại vùng biển lân cận với năng lực bảo đảm phù hợp, thay vì triển khai viễn dương thường xuyên."
 VIE_nav35_G02:0 "Tự chủ chuỗi bảo đảm tàu hộ vệ"
 VIE_nav35_G02_desc:0 "Tự chủ chuỗi bảo đảm tàu hộ vệ trong nước. Không bắt buộc dự án Sông Thu 2026 để hoàn thiện green-water; nhận thêm bonus bảo đảm khi chiếc hộ vệ đầu tiên đã được bàn giao."
 VIE_nav35_G03:0 "Hạm đội khu vực tự chủ"
 VIE_nav35_G03_desc:0 "Ưu tiên hệ thống tàu mặt nước, chống ngầm và hậu cần đủ dùng, phù hợp mức ngân sách trung bình. Mở công nghệ tàu hộ vệ nội địa qua decision nếu điều kiện công nghiệp đáp ứng."
 VIE_nav35_B01:0 "Lựa chọn Blue-water: triển khai biển xa"
 VIE_nav35_B01_desc:0 "Khả năng viễn dương đòi hỏi đầu tư cơ sở bảo đảm, dự trữ và mạng lưới hợp tác phù hợp chính sách quốc phòng. Đây là lựa chọn giả định, không phải chương trình tàu sân bay đã công bố."
 VIE_nav35_B02:0 "Hạm đội tiếp tế và bảo đảm viễn hành"
 VIE_nav35_B02_desc:0 "Tăng năng lực tàu hậu cần, sửa chữa và tổ chức vận tải. Nếu hoàn thành L03, sử dụng thành quả VTĐN-01 làm bước đệm; không tự ý suy diễn VTĐN-01 là tàu tiếp dầu hạm đội biển xa."
 VIE_nav35_B03:0 "Hải quân biển xa cân đối"
 VIE_nav35_B03_desc:0 "Khả năng hoạt động xa bờ theo kỳ hạn dài, nhiệm vụ hộ tống và hợp tác hàng hải. Muốn phát triển tiếp đến hạm đội tàu sân bay cần nhánh viễn cảnh riêng, không thể là kết quả tự động."
 VIE_nav35_F01:0 "Chuẩn hóa học thuyết và cơ cấu quân chủng"
 VIE_nav35_F01_desc:0 "Một trong ba capstone P06/G03/B03 đủ để mở F01, không dùng ba prerequisite AND vì các nhánh lựa chọn loại trừ nhau. Tùy focus trước đó, hiệu ứng F01 phản ánh ưu tiên sea-denial, green-water hoặc blue-water."
 VIE_nav35_F02:0 "Hải quân nhân dân chính quy, tinh nhuệ, hiện đại"
 VIE_nav35_F02_desc:0 "Hoàn thành sau F01 với các điều kiện S03 và L04. Đầu tư công nghiệp và các chương trình hậu 2026 không mặc nhiên bắt buộc cho mọi lối chơi; được thưởng theo tiến độ đã đạt và con đường chiến lược."
 VIE_nav35_dockyard_program:0 "Mở rộng xưởng đóng tàu quân sự"
 VIE_nav35_dockyard_program_desc:0 "Đầu tư 7,5 tỷ USD qua cơ chế xây dựng của Millennium Dawn để thêm một xưởng đóng tàu tại state ven biển đang sở hữu và kiểm soát, còn chỗ xây dựng. Quyết định được theo dõi trong 365 ngày; xưởng được xây khi giải ngân."
 VIE_nav35_dockyard_start_tt:0 "Giải ngân §Y7.5 tỷ USD§! một lần; theo dõi chương trình trong §Y365 ngày§!."
 VIE_nav35_dockyard_finish_tt:0 "Mở rộng xưởng đóng tàu đã được ghi nhận; không thu thêm tiền."

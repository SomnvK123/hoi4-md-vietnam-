 ### Hướng chiến lược quân sự (focus)

 ### Hướng chiến lược quân sự (idea)
 VIE_peoples_war_idea:0 "Pháo đài chiến tranh nhân dân"
 VIE_peoples_war_idea_desc:0 "Toàn dân là một pháo đài. Phòng thủ vững hơn, công sự hiệu quả hơn, nhưng sức tấn công thấp và không ai dễ tin rằng ta sẽ đi xa."

 ### Danh mục quyết định quân sự

 ### Idea bổ sung của nhánh quân sự
 VIE_corps_restructure_idea:0 "Tái cơ cấu quân đoàn"
 VIE_corps_restructure_idea_desc:0 "Các cấp chỉ huy được sắp xếp lại để điều hành lực lượng trên cả một chiến trường, không chỉ trong một tỉnh."
 VIE_pilot_training_idea:0 "Hệ thống huấn luyện phi công hiện đại"
 VIE_pilot_training_idea_desc:0 "Máy bay huấn luyện thế hệ mới giúp phi công lên tay nhanh hơn và ít tai nạn hơn."
 VIE_force_47_idea:0 "Lực lượng 47"
 VIE_force_47_idea_desc:0 "Một lực lượng chuyên trách đấu tranh trên không gian mạng, bảo vệ nền tảng tư tưởng và làm lạnh các chiến dịch thông tin thù địch."
 VIE_cyber_command_idea:0 "Bộ Tư lệnh tác chiến không gian mạng"
 VIE_cyber_command_idea_desc:0 "Bảo vệ mạng lưới quân sự và trực tiếp tiến hành các chiến dịch trên không gian mạng."
 VIE_kilo_flotilla_idea:0 "Hải đội tàu ngầm Kilo"
 VIE_kilo_flotilla_idea_desc:0 "Sáu tàu ngầm hiện đại đã vào biên chế và huấn luyện xong. Không ai còn coi thường vùng biển của ta."
 VIE_arbitral_track:0 "Con đường pháp lý"
 VIE_arbitral_track_desc:0 "Đưa tranh chấp ra tòa và dựa vào luật pháp quốc tế. Ít thắng bằng vũ lực, nhưng được nhiều nước thông cảm và khó bị kết tội gây hấn."
 VIE_limited_war_idea:0 "Học thuyết chiến tranh hạn chế"
 VIE_limited_war_idea_desc:0 "Một cuộc chiến ngắn, quyết liệt với một đối thủ, trên một khu vực nhỏ, và một lối thoát đã tính sẵn. §YChỉ có hiệu lực đặc biệt khi đối đầu Trung Quốc.§!"

 ### Sự kiện
 vie_scs.19.t:0 "Tòa trọng tài thụ lý vụ kiện"
 vie_scs.19.d:0 "Tòa án đã chính thức thụ lý đơn kiện của ta về các vùng biển tranh chấp. Bắc Kinh tuyên bố không công nhận thẩm quyền của tòa, còn các nước láng giềng chờ xem ta sẽ làm gì tiếp theo."
 vie_scs.19.a:0 "Theo đuổi vụ kiện đến cùng"
 vie_scs.19.b:0 "Dùng vụ kiện làm đòn bẩy trong đàm phán về Bộ Quy tắc Ứng xử"

 ### Điều khiển nhịp căng thẳng trên biển (hướng C)

 ### Hải quân
 ### Không quân

 ### Idea của các hướng phát triển binh chủng
 VIE_expeditionary_idea:0 "Học thuyết cơ động"
 VIE_expeditionary_idea_desc:0 "Lực lượng nhẹ, nhanh, sẵn sàng hoạt động xa căn cứ và tiếp nhận quân tình nguyện, đổi lại phòng thủ tại chỗ kém hơn."
 VIE_iron_triangle_idea:0 "Tam giác thép"
 VIE_iron_triangle_idea_desc:0 "Công sự, hậu cần và dự bị kết hợp thành một lá chắn vững chắc."
 VIE_blue_water_idea:0 "Hạm đội viễn dương"
 VIE_blue_water_idea_desc:0 "Tầm hoạt động xa, hỏa lực mạnh, nhưng đầu tư vào bờ biển bị bỏ lại phía sau."
 VIE_sea_control_idea:0 "Kiểm soát vùng biển"
 VIE_sea_control_idea_desc:0 "Tàu, tàu ngầm và thủy lôi phối hợp chặt, đặc biệt vào ban đêm."
 VIE_full_spectrum_idea:0 "Không quân toàn phổ"
 VIE_full_spectrum_idea_desc:0 "Ưu thế trên không, khả năng tác chiến ban đêm và tầm hoạt động xa, đồng thời yểm trợ lục quân."

 ### Dynamic modifier và tooltip
 VIE_armed_forces_modifier:0 "Quân đội Nhân dân Việt Nam"

 ### Chuyên mục Quyết định Quân sự
 VIE_military_readiness_category:0 "Sẵn sàng Chiến đấu & Diễn tập Quân đội"
 VIE_military_readiness_category_desc:0 "Kế hoạch nâng cao khả năng sẵn sàng tác chiến, các đợt diễn tập quân khu thường niên, tuần tra duyên hải và tập dượt hiệp đồng quân binh chủng của Quân đội Nhân dân Việt Nam."

 ### Cờ Điều kiện Tiên quyết Quốc gia

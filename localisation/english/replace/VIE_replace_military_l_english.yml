 ### 38 Focuses (V8)
 # 1. Khoi Nen tang Chung
 VIE_air8_r00_foundation:0 "Tái thiết Nền tảng PK-KQ"
 VIE_air8_r00_foundation_desc:0 "Đánh giá lại thực trạng lực lượng, trang bị và tổ chức của Quân chủng Phòng không - Không quân, xác lập nền móng cho tiến trình hiện đại hóa đồng bộ."
 VIE_air8_p01_radar_network:0 "Hiện đại hóa Mạng Cảnh giới Radar"
 VIE_air8_p01_radar_network_desc:0 "Nâng cấp các trạm radar cảnh giới bờ biển và biên giới, bảo đảm tầm phát hiện sớm và quản lý chặt chẽ không phận quốc gia."
 VIE_air8_p02_s300pmu1:0 "Tiếp nhận S-300PMU1"
 VIE_air8_p02_s300pmu1_desc:0 "Tiếp nhận tổ hợp tên lửa phòng không tầm cao S-300PMU1, tạo bước đột phá về năng lực phòng thủ đường không tầm xa."
 VIE_air8_p03_multitier_sam:0 "Lực lượng Phòng không Đa tầng"
 VIE_air8_p03_multitier_sam_desc:0 "Tổ chức phối hợp nhịp nhàng giữa tên lửa phòng không tầm cao, tầm trung và pháo phòng không tầm thấp bảo vệ các mục tiêu đầu não."
 VIE_air8_f01_legacy_fleet:0 "Duy trì Su-22 và Su-27"
 VIE_air8_f01_legacy_fleet_desc:0 "Bảo đảm hệ số kỹ thuật cho các dòng tiêm kích bom Su-22 và tiêm kích Su-27 hiện có, duy trì khả năng sẵn sàng chiến đấu trong giai đoạn quá độ."
 VIE_air8_f02_su30mk2_procurement:0 "Tiếp nhận Su-30MK2"
 VIE_air8_f02_su30mk2_procurement_desc:0 "Đưa dòng tiêm kích đa năng hiện đại Su-30MK2 vào biên chế, nâng cao vượt bậc hỏa lực đối không và đối hải của Không quân."
 VIE_air8_f03_su30mk2_fleet_expansion:0 "Mở rộng Phi đội Su-30MK2"
 VIE_air8_f03_su30mk2_fleet_expansion_desc:0 "Tiếp tục trang bị bổ sung các lô tiêm kích Su-30MK2, xây dựng lực lượng hổ mang chúa thành nòng cốt tác chiến trên không và trên biển."
 VIE_air8_t01_academy_reform:0 "Đổi mới Trường Sĩ quan Không quân"
 VIE_air8_t01_academy_reform_desc:0 "Cải cách toàn diện chương trình giảng dạy, mô phỏng bay và tuyển chọn phi công quân sự đáp ứng yêu cầu vận hành khí tài hiện đại."
 VIE_air8_t02_t6c_basic_trainer:0 "T-6C — Huấn luyện Cơ bản"
 VIE_air8_t02_t6c_basic_trainer_desc:0 "Tiếp nhận máy bay huấn luyện động cơ cánh quạt phản lực hiện đại T-6C Texan II, chuẩn hóa quy trình huấn luyện bay sơ cấp."
 VIE_air8_t03_l39ng_jet_trainer:0 "L-39NG — Huấn luyện Phản lực"
 VIE_air8_t03_l39ng_jet_trainer_desc:0 "Trang bị máy bay huấn luyện phản lực thế hệ mới L-39NG, nâng cao kỹ năng điều khiển phản lực cơ bản cho học viên phi công."
 VIE_air8_t04_yak130_advanced_trainer:0 "Yak-130 — Chuyển loại Nâng cao"
 VIE_air8_t04_yak130_advanced_trainer_desc:0 "Biên chế phản lực huấn luyện chiến đấu Yak-130 với buồng lái kính số hóa, rút ngắn thời gian chuyển loại phi công lên Su-30MK2."
 VIE_air8_r01_c2_guidance_reform:0 "Cải cách Sở Chỉ huy và Dẫn đường"
 VIE_air8_r01_c2_guidance_reform_desc:0 "Hợp nhất chỉ huy và cải tiến hệ thống trạm radar dẫn đường cho tiêm kích đánh chặn, bảo đảm hiệp đồng thông suốt giữa đài mặt đất và phi công."
 VIE_air8_r02_air_orientation:0 "Xác lập Định hướng Không quân"
 VIE_air8_r02_air_orientation_desc:0 "Hoàn tất giai đoạn tái thiết nền tảng, mở đường cho Quân chủng PK-KQ lựa chọn định hướng phát triển học thuyết chiến lược phù hợp."

 # 2. Huong A: Phong khong Chieu sau
 VIE_air8_a01_doctrine_defense_in_depth:0 "Học thuyết Phòng không Chiều sâu"
 VIE_air8_a01_doctrine_defense_in_depth_desc:0 "Lựa chọn chiến lược tập trung hỏa lực phòng không đa tầng nhiều lớp, biến không phận quốc gia thành một pháo đài thép bất khả xâm phạm."
 VIE_air8_a02_expanded_air_defense_alert:0 "Mở rộng Hệ thống Báo động PK"
 VIE_air8_a02_expanded_air_defense_alert_desc:0 "Tăng cường các trạm radar trinh sát và cảnh giới tại các khu vực duyên hải trọng điểm, nâng cao thời gian phản ứng trước các đòn tập kích đường không."
 VIE_air8_a03_interceptor_airspace_defense:0 "Tiêm kích Đánh chặn Vùng trời"
 VIE_air8_a03_interceptor_airspace_defense_desc:0 "Huấn luyện các biên đội tiêm kích chuyên trách đánh chặn tốc độ cao, phối hợp chặt chẽ với lưới lửa phòng không mặt đất."
 VIE_air8_a04_sam_radar_combat_crews:0 "Kíp Chiến đấu Tên lửa & Radar"
 VIE_air8_a04_sam_radar_combat_crews_desc:0 "Huấn luyện chuyên sâu cho các kíp trắc thủ radar và trắc thủ điều khiển tên lửa trong điều kiện đối phương gây nhiễu điện tử ác liệt."
 VIE_air8_a05_dispersion_recovery_readiness:0 "Phân tán, Ngụy trang & Sân bay Dã chiến"
 VIE_air8_a05_dispersion_recovery_readiness_desc:0 "Xây dựng các công sự kiên cố, chuẩn bị các đường băng dã chiến và quy trình sửa chữa đường băng thần tốc nhằm bảo toàn lực lượng."
 VIE_air8_a06_multilayer_sky_shield:0 "Vùng trời Bất khả Xâm phạm"
 VIE_air8_a06_multilayer_sky_shield_desc:0 "Đỉnh cao của học thuyết phòng không chiều sâu: toàn bộ hệ thống radar cảnh giới, tên lửa phòng không và tiêm kích đánh chặn tạo thành một lá chắn bầu trời thép."

 # 3. Huong B: Phong thu Co dong Khong quan
 VIE_air8_b01_doctrine_mobile_air_defense:0 "Học thuyết Phòng thủ Cơ động Không quân"
 VIE_air8_b01_doctrine_mobile_air_defense_desc:0 "Lựa chọn chiến lược lấy lực lượng không quân tiêm kích cơ động cao làm chủ đạo, vươn dài cánh bay kiểm soát vùng trời và bảo vệ biển đảo từ xa."
 VIE_air8_b02_nextgen_multirole_program:0 "Tiêm kích Đa năng Thế hệ Mới"
 VIE_air8_b02_nextgen_multirole_program_desc:0 "Khởi động chương trình mua sắm thế hệ tiêm kích tiên tiến tiếp theo, nâng cao tầm bay và khả năng mang vũ khí chính xác tầm xa."
 VIE_air8_b03_forward_basing_rapid_reaction:0 "Đóng quân Tiền phương & Phản ứng Nhanh"
 VIE_air8_b03_forward_basing_rapid_reaction_desc:0 "Bố trí các biên đội tiêm kích trực chiến tại các căn cứ tiền phương duyên hải, sẵn sàng xuất kích chỉ trong vài phút khi có tình huống."
 VIE_air8_b04_maritime_night_strike_training:0 "Tác chiến Biển xa & Bay đêm"
 VIE_air8_b04_maritime_night_strike_training_desc:0 "Đẩy mạnh các khoa mục bay biển xa tầm thấp, tiếp dầu trên không và tập kích diệt hạm ban đêm bằng vũ khí dẫn đường chính xác."
 VIE_air8_b05_mobile_interception_command:0 "Dẫn đường & Đánh chặn Cơ động"
 VIE_air8_b05_mobile_interception_command_desc:0 "Nâng cấp năng lực dẫn đường cơ động chiến thuật, cho phép phi đội tiêm kích chủ động cơ động tìm diệt đối phương từ ngoài vùng phòng ngự."
 VIE_air8_b06_agile_multirole_air_force:0 "Không quân Đa nhiệm Linh hoạt"
 VIE_air8_b06_agile_multirole_air_force_desc:0 "Đỉnh cao của học thuyết cơ động: Không quân Việt Nam sở hữu năng lực tác chiến đa nhiệm toàn diện, làm chủ vùng trời và biển đảo chủ quyền."

 # 4. Huong C: Tac chien PK-KQ Tich hop
 VIE_air8_c01_doctrine_integrated_air_warfare:0 "Học thuyết Tác chiến PK-KQ Tích hợp"
 VIE_air8_c01_doctrine_integrated_air_warfare_desc:0 "Lựa chọn chiến lược tích hợp số hóa C4ISR toàn diện, kết nối mạng trung tâm giữa đài quan sát, sở chỉ huy, tên lửa và tiêm kích."
 VIE_air8_c02_unified_radar_data_network:0 "Tích hợp Mạng Radar & Truyền số liệu"
 VIE_air8_c02_unified_radar_data_network_desc:0 "Xây dựng mạng truyền dẫn số liệu bảo mật tốc độ cao, hợp nhất toàn bộ dữ liệu radar dân sự và quân sự thành một bức tranh đường không duy nhất."
 VIE_air8_c03_network_centric_fighters:0 "Tác chiến Mạng Trung tâm Tiêm kích"
 VIE_air8_c03_network_centric_fighters_desc:0 "Tích hợp liên kết dữ liệu số (datalink) trực tiếp lên tiêm kích, cho phép chia sẻ tham số mục tiêu thời gian thực giữa các biên đội."
 VIE_air8_c04_joint_simulated_exercises:0 "Diễn tập Mô phỏng & Hợp đồng Tác chiến"
 VIE_air8_c04_joint_simulated_exercises_desc:0 "Tổ chức các cuộc diễn tập mô phỏng máy tính kết hợp thực binh quy mô lớn, rèn luyện khả năng hiệp đồng giữa PK-KQ và Hải quân, Lục quân."
 VIE_air8_c05_uav_fleet_recon_teaming:0 "Hiệp đồng Tiêm kích & UAV Trinh sát"
 VIE_air8_c05_uav_fleet_recon_teaming_desc:0 "Sử dụng đội bay không người lái làm tai mắt tiền phương, trinh sát phát hiện mục tiêu và dẫn đường cho tiêm kích tiến công từ cự ly an toàn."
 VIE_air8_c06_networked_pkkq_battlespace:0 "Hệ sinh thái PK-KQ Số hóa"
 VIE_air8_c06_networked_pkkq_battlespace_desc:0 "Đỉnh cao của tác chiến số hóa: toàn bộ không gian chiến trường PK-KQ được điều khiển trong mạng lưới tác chiến C4ISR thông minh và tự động hóa."

 # 5. Khoi Cong nghiep PK-KQ
 VIE_air8_i00_selective_air_industry:0 "Công nghệ PK-KQ Chọn lọc"
 VIE_air8_i00_selective_air_industry_desc:0 "Định hướng phát triển công nghiệp quốc phòng PK-KQ có trọng tâm trọng điểm, ưu tiên tự chủ kỹ thuật bảo dưỡng và nội địa hóa thiết bị cốt lõi."
 VIE_air8_i01_a32_su30mk2_overhaul:0 "Nhà máy A32 — Đại tu Su-30MK2"
 VIE_air8_i01_a32_su30mk2_overhaul_desc:0 "Làm chủ quy trình sửa chữa lớn, đại tu và tăng hạn sử dụng tiêm kích Su-30MK2 tại Nhà máy A32 Đà Nẵng, giảm phụ thuộc vào nước ngoài."
 VIE_air8_i02_domestic_avionics:0 "Thiết bị Điện tử Máy bay Nội địa"
 VIE_air8_i02_domestic_avionics_desc:0 "Nghiên cứu chế tạo các khối thiết bị điện tử hàng không, máy tính điều khiển và khối hiển thị buồng lái phục vụ hiện đại hóa phi đội."
 VIE_air8_i03_s125vt_upgrade_program:0 "S-125-VT — Hiện đại hóa Phòng không"
 VIE_air8_i03_s125vt_upgrade_program_desc:0 "Chương trình nâng cấp tổ hợp tên lửa S-125 Pechora lên chuẩn S-125-VT, tăng cường tầm bắn và khả năng bám bắt mục tiêu bay thấp."
 VIE_air8_i04_viettel_vrs_3d_radar:0 "Viettel — Radar 3D VRS"
 VIE_air8_i04_viettel_vrs_3d_radar_desc:0 "Nghiên cứu, chế tạo và trang bị hàng loạt các đài radar cảnh giới 3D băng S và VRS do Viettel sản xuất, nâng cao tính tự chủ công nghệ."
 VIE_air8_i05_vq2_digital_c2:0 "VQ2 — Chỉ huy Tác chiến Số"
 VIE_air8_i05_vq2_digital_c2_desc:0 "Triển khai hệ thống tự động hóa chỉ huy tác chiến phòng không VQ2 do Việt Nam tự phát triển, tự động hóa xử lý và phân bổ hỏa lực."
 VIE_air8_i06_viettel_tactical_uav:0 "Viettel — UAV Chiến thuật"
 VIE_air8_i06_viettel_tactical_uav_desc:0 "Chế tạo hàng loạt các dòng máy bay không người lái trinh sát chiến thuật phục vụ theo dõi mục tiêu và cảnh giới chiến trường."


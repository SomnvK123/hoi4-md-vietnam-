 VIE_nav35_asw_frigate_program:0 "Đóng hộ vệ chống ngầm Sông Thu đầu tiên"
 VIE_nav35_asw_frigate_program_desc:0 "Giải ngân 0,6 tỷ USD một lần để đóng một hộ vệ Song Thu ASW 2026 trong 1.095 ngày. Cần một xưởng đóng tàu và căn cứ hải quân ven biển đang sở hữu, kiểm soát, cùng công nghệ của cấu hình cố định. Nếu khi hoàn thành không còn căn cứ phù hợp, tàu chờ bàn giao; hệ thống kiểm tra lại mỗi tháng. Đây là hợp đồng duy nhất cho chiếc đầu tiên, không phải giá lịch sử được xác nhận."
 VIE_nav35_asw_frigate_requirements_tt:0 "Đã nhận phê duyệt I07; còn ít nhất 0,6 tỷ USD; có xưởng đóng tàu và căn cứ ven biển đang sở hữu, kiểm soát. Đã nghiên cứu thân hộ vệ 2010, động lực diesel 1990, điều khiển hỏa lực 1990, sonar 2005, pháo nhẹ 2025, CIWS 2020, ngư lôi 2020, VLS/tên lửa mặt nước 2000 và kỹ thuật hệ thống tàu. Chưa khởi đóng hoặc bàn giao chiếc đầu tiên."
 VIE_nav35_asw_frigate_start_tt:0 "Chi §Y0,6 tỷ USD§! một lần; bắt đầu đóng §Y1 hộ vệ§! theo cấu hình cố định trong §Y1.095 ngày§!."
 VIE_nav35_asw_frigate_finish_tt:0 "Hoàn tất đóng tàu. Bàn giao §Y1 hộ vệ Song Thu ASW 2026§! vào hạm đội dự bị khi có căn cứ và công nghệ phù hợp; nếu thiếu thì chờ và kiểm tra lại mỗi tháng. Không thu thêm tiền."

 VIE_nav35_N00_reward_tt:0 "Khởi động §YChương trình Hiện đại hóa Hải quân Nhân dân Việt Nam§!:\n • Mở khóa 5 trụ cột phát triển: §YChỉ huy & Đào tạo§!, §YTrinh sát biển C4ISR§!, §YHạm đội tác chiến§!, §YCông nghiệp đóng tàu§!, §YCăn cứ hậu cần kỹ thuật§!.\n • Tăng sẵn sàng tổ chức hải quân: §G+2.0%§!, phối hợp tác chiến: §G+2.0%§!.\n • Tiếp nhận §G50 thiết bị C4ISR / Thông tin chỉ huy§! vào kho dự trữ.\n • Giảm §G25%§! chi phí nghiên cứu Học thuyết Hải quân; nhận §G+25 Điểm Chỉ huy§! và §G+15 Kinh nghiệm Hải quân§!."
 VIE_nav35_T01_reward_tt:0 "Kiện toàn cơ cấu tổ chức và chỉ huy 5 Vùng Hải quân (Vùng 1 đến Vùng 5):\n • Cấp tinh thần: §YTổ chức Quân chủng Hải quân (Bậc 1)§!\n   - Sẵn sàng tổ chức hải quân: §G+2.0§!\n   - Phối hợp tác chiến biên đội: §G+1.5%§!\n   - Tốc độ tích lũy kinh nghiệm: §G+2.5%§!\n • Hiệp đồng chỉ huy tác chiến biển: §G+3.0%§!, tổ chức hạm đội: §G+2.0%§!.\n • Tiếp nhận §G80 thiết bị Thông tin C4ISR§! cho các sở chỉ huy vùng.\n • Giảm §G20%§! chi phí nghiên cứu Học thuyết Hải quân và nhận §G+20 Điểm Chỉ huy§!."
 VIE_nav35_T02_reward_tt:0 "Chuẩn hóa đào tạo sĩ quan thế hệ mới tại Học viện Hải quân Nha Trang:\n • Tốc độ tích lũy kinh nghiệm chiến đấu hải quân: §G+5.0%§!.\n • Đào tạo chuyên sâu kíp chỉ huy hạm tàu, tác chiến săn ngầm và chỉ huy biên đội hiện đại.\n • Giảm §G30%§! chi phí nghiên cứu Học thuyết Hải quân.\n • Nhận ưu đãi nghiên cứu Hải quân §G+50%§!, §G+15 Điểm Chỉ huy§! và §G+15 Kinh nghiệm Hải quân§!."
 VIE_nav35_T03_reward_tt:0 "Quy chuẩn huấn luyện kíp tàu và tổ chức tuần tra thực địa dài ngày trên biển:\n • Tăng sẵn sàng tổ chức hải quân: §G+3.0%§!.\n • Xác suất bắn trúng mục tiêu hải chiến (Naval Hit Chance): §G+2.0%§!.\n • Cung cấp §G30 xe cơ động chuyên dụng bảo đảm ven bờ§! cho các đơn vị.\n • Nhận §G+20 Điểm Chỉ huy§! và §G+20 Kinh nghiệm Hải quân / Độ thông thạo học thuyết§!."
 VIE_nav35_T04_reward_tt:0 "Thiết lập Bộ Chỉ huy Hiệp đồng Tác chiến Biển Liên quân chủng:\n • Cấp tinh thần: §YTổ chức Quân chủng Hải quân (Bậc 4)§!\n   - Sẵn sàng tổ chức hải quân: §G+8.0§!\n   - Phối hợp tác chiến biển: §G+6.0%§!\n   - Tốc độ tích lũy kinh nghiệm: §G+10.0%§!\n • Nâng cao phối hợp tác chiến hạm đội: §G+5.0%§!, tổ chức hạm đội: §G+3.0%§!.\n • Tiếp nhận §G50 thiết bị C4ISR chỉ huy thế hệ mới§!.\n • Giảm §G50%§! chi phí nghiên cứu Học thuyết Hải quân và nhận §G+25 Điểm Chỉ huy§!."
 VIE_nav35_S01_reward_tt:0 "Xây dựng mạng cảnh giới duyên hải và hệ thống trạm radar bờ biển:\n • Xây dựng §G1 Đài Radar cảnh giới bờ biển§! tại Nam Định / Hải Phòng (§Y519§!) và §G1 Đài Radar§! tại Cam Ranh (§Y521§!).\n • Khả năng phát hiện hạm đội và mục tiêu mặt nước (Naval Detection): §G+5.0%§!.\n • Cấp tinh thần: §YNhận thức Tình huống Biển (Bậc 1)§!.\n • Nhận ưu đãi nghiên cứu Radar hải quân §G+50%§! và §G+15 Điểm Chỉ huy§!."
 VIE_nav35_S02_reward_tt:0 "Làm chủ khí tài và mở rộng nhiệm vụ của Lữ đoàn Không quân Hải quân 954:\n • Sức tấn công săn ngầm (Submarine Attack): §G+5.0%§!, tấn công đánh biển (Naval Strike Attack): §G+5.0%§!.\n • Tiếp nhận §G8 trực thăng săn ngầm / tuần thám biển Ka-28 Helix & DHC-6§! vào trang bị.\n • Nhận ưu đãi nghiên cứu Thủy âm và Sonar săn ngầm §G+50%§!.\n • Nhận §G+15 Điểm Chỉ huy§!, §G+15 Kinh nghiệm Hải quân§! và §G+25 Kinh nghiệm Không quân§!."
 VIE_nav35_S03_reward_tt:0 "Hợp nhất bức tranh tình huống biển C4ISR đa tầng (Bờ — Đảo — Hạm tàu — Trên không):\n • Xây dựng §G1 Đài Radar cảnh giới tầm xa§! trên bán đảo Sơn Trà / Đà Nẵng (§Y520§!).\n • Khả năng phát hiện hạm đội (Naval Detection): §G+5.0%§!, phối hợp tác chiến biển: §G+3.0%§!.\n • Cấp tinh thần: §YTrinh sát Biển Hợp nhất§! và bổ sung §G60 bộ khí tài C4ISR kỹ thuật số§!.\n • Nhận §G+20 Điểm Chỉ huy§!."
 VIE_nav35_W01_reward_tt:0 "Tái cơ cấu quy hoạch phát triển đội tàu chiến đấu mặt nước và tàu ngầm:\n • Tốc độ hành quân cơ động hạm đội (Naval Speed): §G+3.0%§!.\n • Xác suất bắn trúng mục tiêu hải chiến (Naval Hit Chance): §G+2.0%§!.\n • Giảm §G25%§! chi phí nghiên cứu Học thuyết Hải quân.\n • Nhận ưu đãi nghiên cứu Tàu mặt nước §G+50%§!, §G+20 Điểm Chỉ huy§! và §G+15 Kinh nghiệm Hải quân§!."
 VIE_nav35_W02_reward_tt:0 "Khai thác biên đội tàu tên lửa tấn công nhanh Molniya Project 12418 (Lữ đoàn 167):\n • Tốc độ xung kích của tàu tấn công nhanh: §G+5.0%§!, sức tấn công hỏa lực tên lửa diệt hạm: §G+5.0%§!.\n • Bàn giao §G32 quả tên lửa hành trình chống hạm Kh-35 Uran-E§! vào kho đạn dự trữ hạm đội.\n • Nhận ưu đãi nghiên cứu Tàu hộ tống / Tàu tên lửa (Corvettes) §G+50%§!.\n • Nhận §G+15 Điểm Chỉ huy§! và §G+20 Kinh nghiệm Hải quân§!."
 VIE_nav35_W03_reward_tt:0 "Làm chủ biên đội tàu hộ vệ tên lửa tàng hình Gepard 3.9 (Lữ đoàn 162):\n • Hỏa lực phòng không hạm đội (Fleet Anti-Air): §G+5.0%§!, xác suất bắn trúng mục tiêu: §G+3.0%§!.\n • Phòng thủ tàu chủ lực: §G+5.0%§!; cấp tinh thần §YSẵn sàng Chiến đấu Tàu mặt nước§!.\n • Tiếp nhận §G40 quả tên lửa phòng không hạm tàu§! và §G24 quả tên lửa chống hạm Kh-35§!.\n • Nhận §G+20 Điểm Chỉ huy§!."
 VIE_nav35_W04_reward_tt:0 "Xây dựng lực lượng tàu ngầm Kilo 636.1 hiện đại tại căn cứ Cam Ranh (Lữ đoàn 189):\n • Sức tấn công của tàu ngầm (Submarine Attack): §G+8.0%§!, phòng thủ tàu ngầm: §G+5.0%§!.\n • Khai thác hỏa lực tên lửa Club-S và ngư lôi hạng nặng 533mm dưới nước.\n • Tiếp nhận §G16 tên lửa hành trình tấn công ngầm Kalibr/Club-S§! vào biên chế.\n • Nhận ưu đãi nghiên cứu Tàu ngầm §G+50%§!, §G+20 Điểm Chỉ huy§! và §G+20 Kinh nghiệm Hải quân§!."
 VIE_nav35_W05_reward_tt:0 "Xây dựng biên đội tác chiến phối hợp Hộ vệ mặt nước và Chống ngầm liên hợp:\n • Khả năng săn ngầm và diệt tàu ngầm (Submarine Attack): §G+5.0%§!, phát hiện tàu ngầm: §G+3.0%§!.\n • Cấp tinh thần: §YNăng lực Chống ngầm Toàn diện (ASW Mastery)§!.\n • Giảm §G25%§! chi phí nghiên cứu Học thuyết Hải quân.\n • Nhận ưu đãi nghiên cứu Sonar và Thiết bị Săn ngầm §G+50%§!, §G+20 Điểm Chỉ huy§! và §G+15 Kinh nghiệm Hải quân§!."
 VIE_nav35_I03_reward_tt:0 "Tự chủ thiết kế và đóng mới loạt tàu pháo tuần tra TT-400TP tại Nhà máy Z173 Hồng Hà:\n • Xây dựng §G1 Xưởng đóng tàu quân sự (Dockyard)§! và §G1 ô đất công nghiệp§! tại Nam Định / Hải Phòng (§Y519§!).\n • Nâng cao khả năng cảnh giới ven bờ (Naval Detection): §G+2.0%§!.\n • Bổ sung §G20 quả tên lửa phòng không tầm thấp vác vai Igla/Strela§! trang bị cho kíp tàu.\n • Nhận ưu đãi nghiên cứu Tàu tuần tiễu và tàu nhỏ §G+50%§!."
 VIE_nav35_I04_reward_tt:0 "Thành lập Viện Thiết kế Tàu quân sự trực thuộc Tổng cục Công nghiệp Quốc phòng:\n • Nâng cao khả năng hiệp đồng thiết kế hạm tàu: §G+2.0%§!.\n • Giảm §G25%§! chi phí nghiên cứu Học thuyết Hải quân và nhận ưu đãi nghiên cứu Tàu hộ vệ §G+50%§!.\n • Mở khóa quyết định thiết kế các dòng thân tàu chiến đấu thế hệ mới.\n • Nhận §G+20 Điểm Chỉ huy§!."
 VIE_nav35_I05_reward_tt:0 "Phát triển công nghệ đóng tàu chuyên dụng và bảo đảm tại Nhà máy đóng tàu Sông Thu:\n • Xây dựng §G1 Xưởng đóng tàu quân sự (Dockyard)§! và §G1 ô đất xây dựng§! tại Đà Nẵng (§Y520§!).\n • Tốc độ vận tải và cứu nạn trên biển: §G+2.0%§!.\n • Tiếp nhận §G15 tàu vận tải / tàu kéo chuyên dụng (Convoys)§! vào hạm đội bảo đảm.\n • Nhận ưu đãi nghiên cứu Tàu chuyên dụng mặt nước §G+50%§!."
 VIE_nav35_I06_reward_tt:0 "Làm chủ tích hợp hệ thống điều khiển hỏa lực, cảm biến radar và vũ khí hạm tàu:\n • Xác suất bắn trúng mục tiêu hải chiến: §G+3.0%§!, phòng không hạm tàu: §G+5.0%§!.\n • Bổ sung §G20 tổ hợp tên lửa chống hạm thế hệ mới§! vào dự trữ kỹ thuật.\n • Cấp tinh thần: §YCông nghiệp Đóng tàu Quân sự (Bậc 4)§! và ưu đãi nghiên cứu Radar hải quân §G+50%§!.\n • Nhận §G+20 Điểm Chỉ huy§!."
 VIE_nav35_L02_reward_tt:0 "Hiện đại hóa Nhà máy X52 — Cơ sở đại tu chiến lược cho tàu ngầm Kilo và tàu mặt nước:\n • Xây dựng §G1 Xưởng đóng tàu / Ụ nổi quân sự (Dockyard)§! và §G1 ô đất công nghiệp§! tại Cam Ranh (§Y521§!).\n • Phòng thủ và độ bền bảo đảm kỹ thuật của tàu ngầm: §G+5.0%§!.\n • Cấp tinh thần: §YBảo đảm Kỹ thuật Hải quân (Bậc 2)§!.\n • Nhận §G+15 Điểm Chỉ huy§! và §G+15 Kinh nghiệm Hải quân§!."
 VIE_nav35_L04_reward_tt:0 "Trang bị tàu cứu hộ tàu ngầm 927 Yết Kiêu và năng lực bảo đảm dài ngày trên biển:\n • Tầm hoạt động tối đa của toàn hạm đội (Navy Max Range): §G+5.0%§!.\n • Tiếp nhận §G6 trực thăng vận tải và cứu hộ biển tầm xa§! phục vụ nhiệm vụ cứu nạn.\n • Cấp tinh thần: §YBảo đảm Kỹ thuật Hải quân (Bậc 4 / 5)§! và §YVận tải Cứu hộ Dài ngày§!.\n • Nhận §G+20 Điểm Chỉ huy§! và §G+15 Kinh nghiệm Hải quân§!."
 VIE_nav35_P01_reward_tt:0 "Xác lập Học thuyết Phòng thủ Biển Tích hợp bảo vệ chủ quyền biển đảo:\n • Nâng cao hiệu suất rải thủy lôi hạm đội: §G+5.0%§!, giảm tổn thất do thủy lôi địch: §G-5.0%§!.\n • Cấp học thuyết: §YPhòng thủ Biển Tích hợp (Giai đoạn I)§!.\n • Giảm §G30%§! chi phí nghiên cứu Học thuyết Hải quân.\n • Nhận §G+20 Điểm Chỉ huy§! và §G+15 Kinh nghiệm Hải quân§!."
 VIE_nav35_P02_reward_tt:0 "Làm chủ các tổ hợp tên lửa bờ đối hải Bastion-P và Redut (Lữ đoàn 681 & Lữ đoàn 679):\n • Xây dựng §G1 Cụm công sự phòng thủ bờ biển kiên cố§! tại Cam Ranh (§Y521§!) và §G1 Cụm công sự bờ biển§! tại Hải Phòng (§Y519§!).\n • Sức công phá đánh biển của tên lửa bờ: §G+8.0%§!, xác suất bắn trúng mục tiêu mặt nước: §G+3.0%§!.\n • Bàn giao §G36 quả tên lửa hành trình bờ đối hải P-800 Yakhont§! vào kho chiến lược.\n • Cấp tinh thần: §YTrận địa Tên lửa Bờ Lữ đoàn 681§!, nhận §G+20 Điểm Chỉ huy§! và §G+15 Kinh nghiệm Hải quân§!."
 VIE_nav35_P03_reward_tt:0 "Củng cố thế trận bảo vệ quần đảo Trường Sa và hệ thống nhà giàn DK1 (Lữ đoàn 146):\n • Xây dựng §G1 Cụm công sự phòng ngự đảo kiên cố§! và §G1 Căn cứ neo đậu hạm tàu§! tại quần đảo Trường Sa (§Y801§!).\n • Tốc độ lập kế hoạch phòng thủ và cơ động bảo vệ đảo: §G+5.0%§!.\n • Cung cấp §G2.000 súng bộ binh thế hệ mới§! và §G24 tổ hợp tên lửa phòng không tầm thấp§! cho các đảo.\n • Cấp tinh thần: §YThế trận Bảo vệ Đảo Lữ đoàn 146§!, nhận §G+25 Điểm Chỉ huy§!."
 VIE_nav35_P04_reward_tt:0 "Thiết lập mạng lưới hỏa lực liên kết ba mũi giáp công Bờ — Đảo — Hạm đội:\n • Phối hợp tác chiến biển: §G+5.0%§!, khả năng phát hiện hạm đội: §G+3.0%§!.\n • Cung cấp §G60 bộ khí tài thông tin chỉ huy và chỉ thị mục tiêu chiến dịch (C4ISR)§!.\n • Cấp tinh thần: §YHiệp đồng Bờ — Đảo — Hạm đội§! và giảm §G25%§! chi phí nghiên cứu Học thuyết Hải quân.\n • Nhận §G+20 Điểm Chỉ huy§! và §G+15 Kinh nghiệm Hải quân§!."
 VIE_nav35_P05_reward_tt:0 "Nâng cao khả năng cơ động chiến đấu của Lực lượng Hải quân Đánh bộ (Lữ đoàn 101 & 147):\n • Năng lực đổ bộ cơ động chiếm lĩnh đảo: §G+10 sư đoàn / lữ đoàn§!, tốc độ cơ động đổ bộ: §G+3.0%§!.\n • Cấp tinh thần: §YLữ đoàn Hải quân Đánh bộ Tinh nhuệ§!.\n • Trang bị §G2.500 súng trường tiến công thế hệ mới§! và §G30 xe bọc thép lội nước bánh xích/bánh lốp (APC)§!.\n • Nhận §G+25 Điểm Chỉ huy§!, §G+20 Kinh nghiệm Hải quân§! và §G+25 Kinh nghiệm Lục quân§!."
 VIE_nav35_P06_reward_tt:0 "Hoàn thành đỉnh cao Lá chắn Biển Nhiều tầng (Iron Shield) bảo vệ thềm lục địa:\n • Xây dựng §G1 Trạm Radar trinh sát biển tầm xa§! tại Trường Sa (§Y801§!) và §G1 Cụm công sự phòng ngự biển§! tại Cam Ranh (§Y521§!).\n • Sẵn sàng tổ chức hải quân: §G+4.0%§!, phối hợp tác chiến: §G+5.0%§!, cảnh giới biển: §G+5.0%§!.\n • Cấp học thuyết tối cao: §YLá chắn Thép Biển Đông (Iron Shield)§!.\n • Bổ sung §G48 quả tên lửa hành trình diệt hạm tầm xa§! vào kho đạn dự trữ chiến lược.\n • Nhận §G+30 Điểm Chỉ huy§! và §G+25 Kinh nghiệm Hải quân§!."
 VIE_nav35_H01_reward_tt:0 "Ưu tiên xây dựng các biên đội hạm đội cơ động tác chiến đa nhiệm:\n • Tốc độ cơ động đội hình hạm đội: §G+3.0%§!, phối hợp tác chiến biển: §G+3.0%§!.\n • Cấp học thuyết: §YƯu tiên Xây dựng Biên đội Hạm đội§! (Chi phí nhân sự +5%).\n • Giảm §G30%§! chi phí nghiên cứu Học thuyết Hải quân và ưu đãi nghiên cứu Tàu mặt nước §G+50%§!.\n • Nhận §G+20 Điểm Chỉ huy§!."
 VIE_nav35_H02_reward_tt:0 "Biên đội tàu hộ vệ phối hợp săn ngầm và phòng không mặt nước:\n • Hỏa lực phòng không biên đội: §G+5.0%§!, sức tấn công săn ngầm: §G+5.0%§!.\n • Nâng cấp học thuyết: §YBiên đội Hộ vệ — Chống ngầm Đa nhiệm§!.\n • Bàn giao §G24 quả tên lửa chống hạm Kh-35§! và §G30 quả tên lửa phòng không hạm tàu§!.\n • Nhận §G+25 Điểm Chỉ huy§! và §G+20 Kinh nghiệm Hải quân§!."
 VIE_nav35_G01_reward_tt:0 "Chọn con đường Hạm đội Vùng biển Lân cận Tự chủ (Học thuyết Green-water):\n • Xác suất bắn trúng mục tiêu hải chiến: §G+3.0%§!, phối hợp tác chiến hạm đội: §G+3.0%§!.\n • Cấp học thuyết: §YHải quân Biển gần Hiện đại (Green-water I)§! (Chi phí nhân sự +10%).\n • Giảm §G35%§! chi phí nghiên cứu Học thuyết Hải quân.\n • Nhận §G+25 Điểm Chỉ huy§! và §G+15 Kinh nghiệm Hải quân§!."
 VIE_nav35_G02_reward_tt:0 "Tự chủ chuỗi bảo đảm kỹ thuật và hậu cần khép kín cho các biên đội tàu hộ vệ:\n • Xây dựng §G1 Xưởng đóng tàu quân sự (Dockyard)§! và §G1 ô đất xây dựng§! tại Đà Nẵng (§Y520§!).\n • Nâng cao năng lực săn ngầm độc lập của hạm đội khu vực: §G+5.0%§!.\n • Cấp tinh thần: §YBảo đảm Chống ngầm Nội địa§! và ưu đãi nghiên cứu Sonar §G+50%§!.\n • Nhận §G+20 Điểm Chỉ huy§!."
 VIE_nav35_G03_reward_tt:0 "Hoàn thiện Hạm đội Khu vực Tự chủ — Làm chủ Vùng biển Đặc quyền Kinh tế:\n • Sẵn sàng tổ chức hải quân: §G+4.0%§!, phối hợp tác chiến: §G+5.0%§!, xác suất bắn trúng: §G+3.0%§!.\n • Cấp học thuyết tối cao: §YLàm chủ Vùng biển Chủ quyền (Master of Seas)§!.\n • Bổ sung §G40 quả tên lửa diệt hạm tiên tiến§! và §G30 tên lửa phòng không hạm tàu§!.\n • Nhận §G+30 Điểm Chỉ huy§! và §G+25 Kinh nghiệm Hải quân§!."
 VIE_nav35_B01_reward_tt:0 "Chọn con đường Hải quân Biển xa Hiện đại (Học thuyết Blue-water):\n • Tầm hoạt động tối đa của hạm đội: §G+6.0%§!, tốc độ cơ động viễn dương: §G+3.0%§!.\n • Cấp học thuyết: §YChương trình Hải quân Biển xa (Blue-water I)§! (Chi phí nhân sự +25%).\n • Giảm §G35%§! chi phí nghiên cứu Học thuyết Hải quân.\n • Nhận §G+25 Điểm Chỉ huy§! và §G+15 Kinh nghiệm Hải quân§!."
 VIE_nav35_B03_reward_tt:0 "Hoàn thiện Hải quân Biển xa Cân đối — Hùng cường Vươn khơi Đại dương:\n • Tầm hoạt động tối đa: §G+8.0%§!, tổ chức hạm đội: §G+4.0%§!, phối hợp tác chiến biển: §G+5.0%§!.\n • Cấp học thuyết tối cao: §YHùng cường Vươn khơi Đại dương (Ocean Surge)§!.\n • Tiếp nhận §G48 tên lửa hành trình diệt hạm tầm xa§! và §G36 tên lửa phòng không tầm trung/xa hạm tàu§!.\n • Nhận §G+30 Điểm Chỉ huy§! và §G+25 Kinh nghiệm Hải quân§!."
 VIE_nav35_F01_reward_tt:0 "Chuẩn hóa toàn diện học thuyết, biểu biên chế và cơ cấu quân chủng Hải quân:\n • Sẵn sàng tổ chức hải quân: §G+3.0%§!, phối hợp tác chiến toàn quân chủng: §G+3.0%§!.\n • Giảm §G50%§! chi phí nghiên cứu Học thuyết Hải quân.\n • Hội tụ các thành tựu chỉ huy, công nghiệp, hậu cần và tác chiến theo con đường đã chọn.\n • Nhận §G+30 Điểm Chỉ huy§! và §G+25 Kinh nghiệm Hải quân§!."
 VIE_nav35_F02_reward_tt:0 "Xây dựng Hải quân Nhân dân Việt Nam Chính quy, Tinh nhuệ, Hiện đại:\n • Xây dựng mở rộng §G1 Căn cứ Hải quân Chiến lược§! tại Cam Ranh (§Y521§!).\n • Tổ chức hải quân toàn quân: §G+5.0%§!, phối hợp tác chiến: §G+5.0%§!, xác suất bắn trúng: §G+3.0%§!, tốc độ hạm đội: §G+3.0%§!.\n • Bàn giao §G50 tên lửa diệt hạm tiên tiến§!, §G40 tên lửa phòng không hạm tàu§! và §G80 thiết bị thông tin tác chiến C4ISR§!.\n • Tăng §G+5.0% Độ ổn định chính trị§! và nhận §G+50 Điểm Chỉ huy§!, §G+35 Kinh nghiệm Hải quân§!."

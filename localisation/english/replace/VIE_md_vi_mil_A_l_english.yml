l_english:
 VIE_army_nco_corps:0 "Đội ngũ hạ sĩ quan chuyên nghiệp"
 VIE_army_nco_corps_desc:0 "Quân đội truyền thống dựa vào sĩ quan và lính nghĩa vụ ngắn hạn. Hạ sĩ quan chuyên nghiệp — những người ở lại quân ngũ đủ lâu để thành thạo vũ khí và truyền nghề cho lính mới — là mắt xích còn thiếu. Xây dựng chế độ phục vụ chuyên nghiệp và trường đào tạo hạ sĩ quan tại các quân khu."
 VIE_army_military_regions:0 "Cải tổ hệ thống quân khu"
 VIE_army_military_regions_desc:0 "Bảy quân khu và Bộ Tư lệnh Thủ đô là khung xương của lực lượng vũ trang. Rà soát địa giới, gộp các đầu mối trùng lặp và phân cấp quyền điều động cho quân khu để lệnh đi nhanh hơn, hậu cần gọn hơn."
 VIE_army_mech_corps:0 "Sư đoàn bộ binh cơ giới"
 VIE_army_mech_corps_desc:0 "Sư đoàn bộ binh cơ giới kết hợp xe bọc thép chở quân, xe tăng và pháo tự hành trong cùng một biên chế, cho phép đột phá nhanh ở đồng bằng Bắc Bộ và Nam Bộ. Lập đơn vị mẫu và dùng nó làm nòng cốt cho các sư đoàn còn lại."
 VIE_army_combat_engineers:0 "Công binh và đặc công"
 VIE_army_combat_engineers_desc:0 "Đặc công từng là mũi nhọn tác chiến của Quân đội nhân dân. Nâng cấp thành lực lượng nhỏ, tinh nhuệ, huấn luyện đột nhập cảng, sân bay và trận địa tên lửa; công binh lo cầu phà, đường cơ động và công sự."
 VIE_army_academies:0 "Học viện và trung tâm huấn luyện"
 VIE_army_academies_desc:0 "Học viện Lục quân, Học viện Kỹ thuật Quân sự và các trung tâm huấn luyện chiến thuật sẽ được nâng cấp giảng đường, thao trường và thiết bị mô phỏng. Sĩ quan trẻ ra trường với kiến thức tác chiến hiệp đồng thay vì chỉ thuộc giáo án cũ."
 VIE_army_sp_artillery:0 "Pháo tự hành và pháo phản lực"
 VIE_army_sp_artillery_desc:0 "Pháo kéo không theo kịp xe cơ giới. Đưa pháo tự hành 122 mm và 152 mm, cùng hệ thống pháo phản lực phóng loạt, vào biên chế các lữ đoàn pháo binh để bắn nhanh rồi chuyển vị trí trước khi bị phản pháo."
 VIE_army_short_range_ad:0 "Phòng không lục quân tầm gần"
 VIE_army_short_range_ad_desc:0 "Đội hình bộ binh cơ giới cần phòng không đi cùng: tên lửa vác vai Igla, pháo phòng không tự hành và tổ hợp Tor. Xây thêm trận địa phòng không quanh các cụm quân sự trọng yếu ở miền Trung."
 VIE_army_armor_modernization:0 "Hiện đại hóa xe tăng"
 VIE_army_armor_modernization_desc:0 "Đội xe tăng T-54/55 đã quá tuổi. Thay pháo, hệ thống điều khiển hỏa lực và giáp phản ứng nổ cho một phần đội xe, đồng thời chuẩn bị chỗ đứng cho xe tăng thế hệ mới trong các sư đoàn cơ giới."
 VIE_army_electronic_warfare:0 "Tác chiến điện tử và không gian mạng"
 VIE_army_electronic_warfare_desc:0 "Bộ Tư lệnh Tác chiến không gian mạng (Bộ Tư lệnh 86) được thành lập để bảo vệ hệ thống thông tin quân sự và phản công trên mạng. Kết hợp với binh chủng tác chiến điện tử, đây là lớp phòng thủ mới bên cạnh phòng thủ đất liền."
 VIE_army_night_optics:0 "Quang học đêm và ảnh nhiệt"
 VIE_army_night_optics_desc:0 "Trang bị ống nhòm đêm, kính ngắm ảnh nhiệt và thiết bị nhìn xuyên đêm cho từng tiểu đội. Chiến đấu ban đêm trong rừng và đồi núi là thế mạnh cũ của quân đội; công nghệ giúp giữ nó khi đối thủ đã có thiết bị hiện đại."
 VIE_army_dan_quan_modern:0 "Dân quân tự vệ hiện đại hóa"
 VIE_army_dan_quan_modern_desc:0 "Dân quân tự vệ ở xã, phường và doanh nghiệp được trang bị vũ khí nhẹ tốt hơn, có kế hoạch huy động rõ ràng và diễn tập thường xuyên với bộ đội địa phương. Chiến tranh nhân dân được cập nhật, không bị bỏ quên."
 VIE_army_underground_bases:0 "Căn cứ chiến đấu và công trình ngầm"
 VIE_army_underground_bases_desc:0 "Địa đạo Củ Chi và hệ thống hầm ngầm thời chiến vẫn là bài học về phòng thủ. Xây công trình ngầm kiên cố cho kho vũ khí, trạm chỉ huy và bệnh viện dã chiến quanh các cửa ngõ chiến lược, chịu được cả pháo binh và không kích."
 VIE_army_border_guard_corps:0 "Bộ đội Biên phòng và lực lượng cơ động"
 VIE_army_border_guard_corps_desc:0 "Bộ đội Biên phòng giữ hơn bốn nghìn cây số đường biên trên bộ. Nâng đồn biên phòng thành các cụm trạm trang bị cảm biến, đường tuần tra và trực thăng cơ động; kết nối trực tiếp với dân quân và chính quyền địa phương."
 VIE_army_exp_brigades:0 "Lữ đoàn viễn chinh"
 VIE_army_exp_brigades_desc:0 "Nếu Việt Nam từng phải gửi quân ra ngoài lãnh thổ — gìn giữ hòa bình, ứng cứu đồng minh, bảo vệ công dân — họ cần một lực lượng riêng thay vì rút từng đơn vị từ các quân khu. Thành lập lữ đoàn viễn chinh cơ động, biên chế gọn và tự lo hậu cần ban đầu. Đây là tình huống giả định, không có trong lịch sử."
 VIE_army_exp_hubs:0 "Căn cứ hậu cần tiền phương"
 VIE_army_exp_hubs_desc:0 "Lực lượng viễn chinh không thể sống bằng hậu cần kéo dài từ Hà Nội. Xây kho bãi, đường cơ động và sân bay dã chiến ở Tây Nguyên sát biên giới, làm bàn đạp hỗ trợ cho các nước láng giềng đồng minh khi cần."
 VIE_army_intervention_force:0 "Lực lượng can thiệp khu vực"
 VIE_army_intervention_force_desc:0 "Đỉnh cao của con đường viễn chinh: một lực lượng thường trực, có tiếng nói trong các cuộc khủng hoảng Đông Nam Á. Các nước xung quanh sẽ nhìn nó vừa như bảo đảm an ninh vừa như dấu hiệu Hà Nội sẵn sàng dùng vũ lực ngoài biên giới — điều mà chính sách Bốn Không luôn tránh."
 VIE_army_intervention_force_threat:0 "Lực lượng can thiệp khu vực của Việt Nam"
 VIE_army_c4isr:0 "Mạng chỉ huy C4ISR"
 VIE_army_c4isr_desc:0 "Nối trung tâm chỉ huy, radar, máy bay không người lái và đơn vị tiền tuyến trong một mạng dữ liệu bảo mật. Chỉ huy thấy toàn cảnh trận địa gần theo thời gian thực và ra lệnh nhanh hơn nhiều so với hệ thống thoại truyền thống."
 VIE_army_vpa_2030:0 "Quân đội tinh, gọn, mạnh, hiện đại"
 VIE_army_vpa_2030_desc:0 "Mục tiêu đến năm 2030: một quân đội cách mạng, chính quy, tinh nhuệ, từng bước hiện đại, với một số quân chủng tiến thẳng lên hiện đại. Kết quả của mọi cải cách trước đó gộp lại thành một lực lượng gọn hơn nhưng đánh hiệu quả hơn."
 VIE_regional_intervention_idea:0 "Lực lượng can thiệp khu vực"
 VIE_regional_intervention_idea_desc:0 "Một lực lượng viễn chinh thường trực giúp Việt Nam phản ứng nhanh ngoài biên giới, đổi lại là sự nghi ngại của các nước láng giềng."
 VIE_modern_vpa_2030_idea:0 "Quân đội hiện đại 2030"
 VIE_modern_vpa_2030_idea_desc:0 "Quân đội tinh gọn, chính quy, huấn luyện tốt và chỉ huy bằng mạng dữ liệu hiện đại."

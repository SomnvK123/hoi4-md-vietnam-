l_english:
 VIE_air_divisions:0 "Sư đoàn Phòng không – Không quân"
 VIE_air_divisions_desc:0 "Quân chủng Phòng không – Không quân hợp nhất phòng không và không quân dưới một bộ tư lệnh, gồm các sư đoàn 361, 363, 367, 370, 371, 372, 375, 377. Rà soát lại chức năng từng sư đoàn, tránh chồng chéo giữa sân bay, tên lửa và radar."
 VIE_air_academy:0 "Học viện Phòng không – Không quân"
 VIE_air_academy_desc:0 "Học viện Phòng không – Không quân đào tạo phi công, chỉ huy tên lửa và kỹ sư. Kéo dài thời gian bay huấn luyện, bổ sung máy mô phỏng và phi đội huấn luyện Yak-130 để phi công ra trường sẵn sàng bay ngay các loại tiêm kích hiện đại."
 VIE_air_hardened_airfields:0 "Sân bay kiên cố và bãi cất hạ cánh dự phòng"
 VIE_air_hardened_airfields_desc:0 "Sân bay Cam Ranh, Đà Nẵng, Nội Bài, Biên Hòa và Phú Quốc được xây thêm hầm chứa máy bay kiên cố, đường băng dự phòng và kho nhiên liệu ngầm. Nếu sân bay chính bị đánh, đường băng dã chiến trên quốc lộ vẫn dùng được."
 VIE_air_long_range_sam:0 "Phòng không tầm xa và chống tên lửa"
 VIE_air_long_range_sam_desc:0 "S-300PMU1 và các hệ thống mới hơn, kết hợp radar đa tầng và tên lửa tầm ngắn, tạo thành lá chắn phòng không vùng bao phủ các thành phố lớn và căn cứ hải quân. Mục tiêu là làm cho mọi chiến dịch không kích đều phải trả giá đắt."
 VIE_air_awacs_patrol:0 "Cảnh báo sớm trên không và tuần thám"
 VIE_air_awacs_patrol_desc:0 "Radar mặt đất bị che khuất bởi địa hình và độ cong Trái Đất; máy bay cảnh báo sớm và khinh khí cầu radar thấy xa hơn nhiều. Bổ sung máy bay tuần thám, thiết bị chụp ảnh và kết nối dữ liệu với trung tâm chỉ huy phòng không."
 VIE_air_maintenance:0 "Bảo dưỡng và sửa chữa hàng không (VAECO)"
 VIE_air_maintenance_desc:0 "Công ty kỹ thuật máy bay VAECO và các xưởng sửa chữa quân sự đại tu động cơ, hệ thống điện tử và tên lửa. Bảo dưỡng ngay trong nước nghĩa là máy bay ít nằm đất hơn và ít phụ thuộc vào nhà cung cấp nước ngoài."
 VIE_air_transport_fleet:0 "Vận tải quân sự"
 VIE_air_transport_fleet_desc:0 "Máy bay vận tải An-26, C-295 và trực thăng vận tải giữ cho các đảo xa, biên giới và vùng lũ không bị cô lập. Trong thời chiến, đây là cầu hàng không tiếp tế và cơ động lực lượng dự bị."
 VIE_air_ew:0 "Tác chiến điện tử trên không"
 VIE_air_ew_desc:0 "Máy bay tác chiến điện tử, thiết bị gây nhiễu và hệ thống cảnh báo radar trên tiêm kích giúp Su-30 sống sót trước phòng không đối phương. Kết hợp với mạng radar mặt đất để làm mù, làm nhiễu hoặc đánh lừa tên lửa đối phương."
 VIE_air_maritime_patrol:0 "Tuần thám biển"
 VIE_air_maritime_patrol_desc:0 "Máy bay tuần thám như DHC-6 và C-295MPA bay dọc bờ biển để phát hiện tàu lạ, hỗ trợ cảnh sát biển và dẫn đường cho tên lửa chống hạm. Vùng biển rộng, một máy bay tuần thám nhìn thay cả chục tàu."
 VIE_air_uav_armed:0 "UAV trinh sát và tấn công"
 VIE_air_uav_armed_desc:0 "Máy bay không người lái Viettel và các mẫu nhập khẩu đảm nhận trinh sát tầm gần và tấn công mục tiêu nhỏ. Chi phí thấp, không mất phi công, rất phù hợp cho nhiệm vụ nguy hiểm và tuần tra dài ngày."
 VIE_air_attack_helos:0 "Trực thăng vũ trang và vận tải"
 VIE_air_attack_helos_desc:0 "Trực thăng Mi-24, Mi-171 và trực thăng săn ngầm cho phép bộ binh cơ động qua địa hình rừng núi và hỗ trợ hỏa lực ngay trên chiến trường. Rất cần thiết cho vùng Tây Nguyên và các đảo."
 VIE_air_superiority_wing:0 "Sư đoàn tiêm kích ưu thế trên không"
 VIE_air_superiority_wing_desc:0 "Tập trung Su-30 và các tiêm kích mới nhất vào một sư đoàn duy nhất, có radar, tiếp dầu trên không và phi đội huấn luyện riêng. Mục tiêu là giành và giữ ưu thế trên không ở khu vực quanh Biển Đông."
 VIE_air_sead:0 "Chế áp phòng không đối phương (giả định)"
 VIE_air_sead_desc:0 "Nếu không quân muốn đánh xa, họ phải đánh được cả radar và tên lửa phòng không của đối phương trước tiên. Trang bị tên lửa chống bức xạ và huấn luyện phi công chế áp phòng không. Đây là kịch bản giả định, không có trong kế hoạch hiện nay."
 VIE_air_alcm:0 "Tên lửa hành trình phóng từ máy bay (giả định)"
 VIE_air_alcm_desc:0 "Tên lửa hành trình tầm xa, mang trên tiêm kích, cho phép đánh mục tiêu quan trọng mà không cần bay vào tầm phòng không. Thay đổi hẳn học thuyết không quân từ phòng thủ sang tấn công có chọn lọc."
 VIE_air_long_strike:0 "Máy bay tấn công tầm xa (giả định)"
 VIE_air_long_strike_desc:0 "Tiêm kích – bom tầm xa như Su-34, có tiếp dầu trên không, mang được bom dẫn đường và tên lửa. Đây là bước nhảy lớn so với không quân hiện tại, vốn chủ yếu để phòng thủ; chỉ phù hợp kịch bản Hà Nội chọn đường tấn công chiến lược."
 VIE_air_strat_reach:0 "Năng lực tấn công chiến lược"
 VIE_air_strat_reach_desc:0 "Kết hợp chế áp phòng không, tên lửa hành trình phóng từ máy bay và máy bay tầm xa thành một lực lượng có thể đánh mục tiêu sâu trong lãnh thổ đối phương. Các nước láng giềng sẽ nhìn nhận đây là lời cảnh báo, không chỉ là phòng thủ."
 VIE_air_strat_reach_threat:0 "Năng lực tấn công chiến lược của Việt Nam"
 VIE_air_domestic_radar:0 "Radar và tên lửa phòng không nội địa"
 VIE_air_domestic_radar_desc:0 "Viettel và các nhà máy quốc phòng sản xuất radar cảnh giới 3 chiều, radar bắn và tên lửa phòng không tầm ngắn ngay trong nước. Nội địa hóa giúp giảm phụ thuộc vào nhà cung cấp nước ngoài và cho phép cải tiến theo yêu cầu thực tế."
 VIE_air_air_2030:0 "Không quân hiện đại 2030"
 VIE_air_air_2030_desc:0 "Đến năm 2030, quân chủng Phòng không – Không quân tiến thẳng lên hiện đại: radar liên hoàn, tiêm kích đa nhiệm, tên lửa tầm xa, huấn luyện chất lượng cao và bảo dưỡng trong nước. Kết quả của toàn bộ nhánh không quân."
 VIE_strategic_air_idea:0 "Năng lực tấn công chiến lược"
 VIE_strategic_air_idea_desc:0 "Không quân có khả năng đánh xa và sâu, đổi lại lo ngại từ các nước láng giềng."
 VIE_modern_air_2030_idea:0 "Không quân hiện đại 2030"
 VIE_modern_air_2030_idea_desc:0 "Phòng không – không quân tiến thẳng lên hiện đại với radar liên hoàn, tên lửa tầm xa và bảo dưỡng trong nước."

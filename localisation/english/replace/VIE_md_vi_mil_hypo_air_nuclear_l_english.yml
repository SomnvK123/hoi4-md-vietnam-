l_english:
 VIE_air_tanker:0 "Máy bay Tiếp dầu trên không"
 VIE_air_tanker_desc:0 "Việt Nam chưa có máy bay tiếp dầu — một khoảng trống thật khiến Su-30MK2 khó vươn tới Trường Sa. Trang bị Il-78 (nguồn Nga) hoặc A330 MRTT (nguồn phương Tây) tùy đối tác."
 VIE_air_loitering_munitions:0 "Đạn Bay lảng vảng Tầm xa"
 VIE_air_loitering_munitions_desc:0 "Một lối đi tấn công tầm xa giá rẻ, phổ biến từ xung đột Nagorno-Karabakh (2020): đạn tuần kích tự sản xuất, hiệu quả giảm trước hệ phòng không mạnh."
 VIE_air_su34_strike:0 "Tiêm kích-bom Su-34 (mô hình Nga)"
 VIE_air_su34_strike_desc:0 "Mua sắm tiêm kích-bom hạng nặng từ Nga — rẻ, quen thuộc, nhưng có nguy cơ theo Đạo luật CAATSA của Mỹ."
 VIE_air_f16_package:0 "Gói Tiêm kích F-16 (mô hình phương Tây)"
 VIE_air_f16_package_desc:0 "Theo tin Reuters (9/2023) về khả năng Mỹ-Việt Nam bàn một thỏa thuận vũ khí lớn: chuyển đổi sang chuẩn NATO, đắt và cần chuyển đổi hậu cần."
 VIE_air_kf21_partner:0 "Đồng Sản xuất Tiêm kích KF-21"
 VIE_air_kf21_partner_desc:0 "Việt Nam tham gia chương trình KF-21 Boramae của Hàn Quốc như đối tác công nghiệp (tiền lệ: Indonesia). Không cần đứng hẳn về phía Nga hay phương Tây."
 VIE_air_hypersonic:0 "Tên lửa Siêu thanh"
 VIE_air_hypersonic_desc:0 "Nghiên cứu tên lửa siêu thanh phóng từ trên không, dựa trên dự án đặc biệt của công nghiệp quốc phòng."
 VIE_nuc_tpnw_champion:0 "Quốc gia Phi hạt nhân Gương mẫu"
 VIE_nuc_tpnw_champion_desc:0 "Củng cố cam kết theo NPT (1982), CTBT (2006), Hiệp ước Bangkok (1995) và TPNW (2018): Việt Nam giữ vai trò gương mẫu về không phổ biến vũ khí hạt nhân, khép lại hẳn hướng vũ khí hóa."
 VIE_nuc_civil_leadership:0 "Trung tâm Hạt nhân Dân sự Khu vực"
 VIE_nuc_civil_leadership_desc:0 "Mở rộng năng lực điện hạt nhân dân sự và đào tạo, trở thành một trung tâm hợp tác hạt nhân hòa bình trong khu vực."
 VIE_nuc_fuel_cycle:0 "Chu trình Nhiên liệu Hạt nhân trong nước"
 VIE_nuc_fuel_cycle_desc:0 "Bắt đầu chu trình làm giàu nhiên liệu trong nước dưới giám sát IAEA — bước đầu tiên có thể vũ khí hóa nếu tình hình xấu đi."
 VIE_nuc_latent_hedge:0 "Tiềm lực Ngưỡng (mô hình Nhật/Hàn)"
 VIE_nuc_latent_hedge_desc:0 "Duy trì đầy đủ năng lực kỹ thuật để chế tạo vũ khí hạt nhân trong thời gian ngắn nếu cần, nhưng không thực sự chế tạo và vẫn ở lại NPT — mô hình răn đe mơ hồ của Nhật Bản và Hàn Quốc."
 VIE_nuc_npt_withdrawal:0 "Rút khỏi Hiệp ước NPT"
 VIE_nuc_npt_withdrawal_desc:0 "Viện dẫn Điều X của NPT (báo trước 3 tháng) để rút khỏi hiệp ước — bước ngoặt không thể đảo ngược dễ dàng, kéo theo phản ứng dữ dội từ khu vực và quốc tế."
 VIE_nuc_ambiguity_doctrine:0 "Học thuyết Răn đe Mơ hồ"
 VIE_nuc_ambiguity_doctrine_desc:0 "Không cam kết công khai chính sách sử dụng, tối đa hóa hiệu ứng răn đe bằng sự bất định — đối lập với học thuyết ”không sử dụng trước”."
 VIE_air_deep_strike_desc:0 "Học thuyết Tấn công Chiều sâu: ưu tiên năng lực đột kích tầm xa và chế áp hỏa lực đối phương thay vì chỉ chiếm ưu thế trên không cục bộ."
 VIE_nuclear_ambiguity:0 "Răn đe Mơ hồ (Tiềm lực Ngưỡng)"
 VIE_nuclear_ambiguity_desc:0 "Có đủ năng lực kỹ thuật nhưng không công khai chế tạo vũ khí hạt nhân."
 VIE_nfu_doctrine_idea:0 "Học thuyết Không Sử dụng Trước"
 VIE_nfu_doctrine_idea_desc:0 "Cam kết không sử dụng vũ khí hạt nhân trước."
 VIE_nuclear_program_category:0 "Chương trình Hạt nhân"
 VIE_nuclear_program_category_desc:0 "Quản lý tiến độ và mức độ lộ diện của chương trình hạt nhân."
 VIE_nuc_expand_facility_decision:0 "Mở rộng Cơ sở"
 VIE_nuc_expand_facility_decision_desc:0 "Tăng tiến độ chương trình, đổi lại tăng mức lộ diện."
 VIE_nuc_go_underground:0 "Đưa Cơ sở xuống Lòng đất"
 VIE_nuc_go_underground_desc:0 "Mô hình Fordow của Iran: giảm mạnh nguy cơ bị phát hiện hoặc tấn công phòng ngừa."
 VIE_nuc_iaea_inspection:0 "Hợp tác Thanh sát IAEA"
 VIE_nuc_iaea_inspection_desc:0 "Giảm mức lộ diện, cải thiện quan hệ quốc tế."
 VIE_nuc_weapons_test:0 "Thử nghiệm Hạt nhân"
 VIE_nuc_weapons_test_desc:0 "Vi phạm CTBT: chứng minh năng lực răn đe với cái giá là bị cô lập và trừng phạt nghiêm trọng."
 VIE_nuc_program_rollback:0 "Từ bỏ Chương trình Hạt nhân"
 VIE_nuc_program_rollback_desc:0 "Theo tiền lệ Nam Phi (1991) và Libya (2003): tháo dỡ chương trình, khôi phục quan hệ quốc tế dần dần."
 vie_mil.21.t:0 "Cảnh báo CAATSA"
 vie_mil.21.d:0 "Mỹ cảnh báo về nguy cơ chế tài theo Đạo luật CAATSA nếu tiếp tục mua sắm vũ khí lớn từ Nga."
 vie_mil.21.a:0 "Vẫn tiếp tục mua sắm"
 vie_mil.21.b:0 "Tạm hoãn thương vụ"
 vie_mil.22.t:0 "Chuyển đổi Hậu cần Phương Tây"
 vie_mil.22.d:0 "Chuyển sang chuẩn NATO đòi hỏi tái cấu trúc hậu cần và huấn luyện."
 vie_mil.22.a:0 "Chuyển đổi nhanh (tốn kém)"
 vie_mil.22.b:0 "Chuyển đổi từ từ"
 vie_mil.31.t:0 "IAEA Yêu cầu Thanh sát Bổ sung"
 vie_mil.31.d:0 "Cơ quan Năng lượng Nguyên tử Quốc tế yêu cầu tiếp cận sâu hơn các cơ sở hạt nhân."
 vie_mil.31.a:0 "Chấp nhận hợp tác"
 vie_mil.31.b:0 "Trì hoãn"
 vie_mil.34.t:0 "Tuyên bố Rút khỏi NPT"
 vie_mil.34.d:0 "Việc tuyên bố rút khỏi Hiệp ước Không phổ biến Vũ khí Hạt nhân gây chấn động khu vực và quốc tế."
 vie_mil.34.a:0 "Kiên định với quyết định"
 vie_mil.34.b:0 "Đảo ngược quyết định trước áp lực"
 vie_mil.39.t:0 "Sau vụ Thử nghiệm"
 vie_mil.39.d:0 "Thế giới phản ứng trước vụ thử nghiệm hạt nhân đầu tiên của Việt Nam."
 vie_mil.39.a:0 "Ghi nhận"
 vie_mil.40.t:0 "Gỡ bỏ Trừng phạt"
 vie_mil.40.d:0 "Sau khi từ bỏ chương trình hạt nhân, cộng đồng quốc tế bắt đầu gỡ bỏ trừng phạt từng bước."
 vie_mil.40.a:0 "Ghi nhận"

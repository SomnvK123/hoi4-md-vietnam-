l_english:
 VIE_def_industry_law:0 "Luật Công nghiệp quốc phòng, an ninh và động viên công nghiệp"
 VIE_def_industry_law_desc:0 "Luật năm 2018 đặt nền móng pháp lý cho công nghiệp quốc phòng: cho phép doanh nghiệp tư nhân tham gia chuỗi cung ứng, xác định vai trò của Tổng cục Công nghiệp quốc phòng và quy định cơ chế động viên khi cần. Mở đường cho các doanh nghiệp quốc phòng phát triển thành những tập đoàn công nghệ thực sự."
 VIE_def_viettel_hightech:0 "Viettel High Tech"
 VIE_def_gdt_factories:0 "Tổng cục Công nghiệp quốc phòng và các nhà máy Z"
 VIE_def_ba_son_yard:0 "Ba Son và đóng tàu quân sự"
 VIE_def_vaeco_hangar:0 "Kỹ thuật hàng không quân sự"
 VIE_def_vaeco_hangar_desc:0 "Các công ty bảo dưỡng và sửa chữa máy bay như VAECO và Trung tâm Sửa chữa Không quân hợp lực để tự đại tu động cơ, thiết bị điện tử và cấu kiện máy bay. Lãnh vực nhỏ nhưng quyết định độ sẵn sàng thực tế của phi đội."
 VIE_def_research_partnership:0 "Hợp tác nghiên cứu quốc phòng"
 VIE_def_research_partnership_desc:0 "Viện Khoa học và Công nghệ Quân sự, các trường đại học kỹ thuật và doanh nghiệp quốc phòng đặt cùng một chương trình nghiên cứu chung. Kết quả nghiên cứu chuyển thẳng sang sản xuất thay vì nằm trong phòng thí nghiệm."
 VIE_def_ammo_localisation:0 "Nội địa hóa đạn dược"
 VIE_def_industry_2030:0 "Công nghiệp quốc phòng tự chủ 2030"
 VIE_def_industry_2030_desc:0 "Đến năm 2030, công nghiệp quốc phòng đáp ứng phần lớn nhu cầu về vũ khí bộ binh, đạn dược, radar, máy bay không người lái, tàu tuần tra và phần lớn phụ tùng, chỉ nhập những hệ thống công nghệ cao nhất. Kết quả của mọi nỗ lực nội địa hóa."
 VIE_msl_coastal_home:0 "Tên lửa chống hạm bờ nội địa hóa"
 VIE_msl_tactical_ssm:0 "Tên lửa chiến thuật đất đối đất"
 VIE_msl_missile_defence:0 "Phòng thủ tên lửa và cảnh báo sớm"
 VIE_msl_cruise_missiles:0 "Tên lửa hành trình nội địa"
 VIE_msl_cruise_missiles_desc:0 "Tên lửa hành trình phóng từ mặt đất, tàu và tàu ngầm mở rộng tầm bắn của mọi quân chủng. Việc tự thiết kế tên lửa dẫn đường bằng quán tính và vệ tinh là bước tiến lớn về công nghệ, có thể tận dụng năng lực điện tử của Viettel."
 VIE_msl_nuclear_power:0 "Điện hạt nhân và chương trình lò phản ứng (giả định)"
 VIE_msl_nuclear_power_desc:0 "Chương trình điện hạt nhân dân sự tạo ra kỹ sư, phòng thí nghiệm và chuỗi nhiên liệu hạt nhân. Đây cũng là nền tảng công nghệ mà một nước có thể dùng để đi xa hơn — nhưng Hà Nội chưa bao giờ tuyên bố ý định đó. Nhánh này chỉ là kịch bản giả định."
 VIE_msl_dual_use_threshold:0 "Ngưỡng lưỡng dụng (giả định)"
 VIE_msl_dual_use_threshold_desc:0 "Xây dựng chu trình nhiên liệu khép kín, gồm làm giàu urani và tái chế nhiên liệu. Về mặt kỹ thuật, đây là ngưỡng mà từ đó Việt Nam có thể chuyển sang vũ khí nếu quyết định như vậy. Bên ngoài sẽ xem xét rất kỹ mọi động thái. Đây là kịch bản giả định, đi ngược lại các cam kết hiện nay."
 VIE_threat_enrichment:0 "Chương trình làm giàu urani của Việt Nam"
 VIE_msl_minimum_deterrent:0 "Răn đe hạt nhân tối thiểu (giả định)"
 VIE_msl_minimum_deterrent_desc:0 "Vượt qua ngưỡng: chuyển các phòng thí nghiệm sang thiết kế đầu đạn và chấp nhận trả giá bằng sự cô lập ngoại giao. Một kho vũ khí nhỏ, chỉ đủ để răn đe một cuộc xâm lược quy mô lớn. Đây là kịch bản giả định cực đoan, trái với chính sách chính thức của Việt Nam."
 VIE_threat_bomb:0 "Vũ khí hạt nhân của Việt Nam"
 VIE_msl_deterrent_doctrine:0 "Học thuyết răn đe tối thiểu (giả định)"
 VIE_msl_deterrent_doctrine_desc:0 "Xác định rõ kho vũ khí nhỏ dùng để làm gì: chỉ trả đũa, không đánh trước; kèm cam kết minh bạch với các nước láng giềng nhằm hạn chế phản ứng dây chuyền. Điểm cuối của nhánh giả định này."
 VIE_defence_supply_chain_idea:0 "Chuỗi cung ứng quốc phòng"
 VIE_defence_supply_chain_idea_desc:0 "Doanh nghiệp trong nước cung cấp linh kiện và vật liệu cho công nghiệp quốc phòng."
 VIE_defence_industry_2030_idea:0 "Công nghiệp quốc phòng tự chủ"
 VIE_defence_industry_2030_idea_desc:0 "Công nghiệp quốc phòng đáp ứng phần lớn nhu cầu trang bị trong nước."
 VIE_minimum_deterrent_idea:0 "Răn đe tối thiểu"
 VIE_minimum_deterrent_idea_desc:0 "Một kho vũ khí nhỏ dùng để răn đe, đổi lại sự cô lập ngoại giao và bất ổn trong nước."

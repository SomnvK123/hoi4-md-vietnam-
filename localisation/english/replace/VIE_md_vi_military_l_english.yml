 VIE_w04_submarine_tech:0 "Nghiên cứu Kỹ thuật Tàu ngầm Hiện đại"
 VIE_i04_corvette_tech:0 "Nghiên cứu Chế tạo Tàu hộ vệ Nội địa"
 VIE_w02_missile_boat:0 "Nghiên cứu Tàu tên lửa Cao tốc"
 VIE_w03_frigate:0 "Nghiên cứu Khinh hạm Đa nhiệm"
 VIE_s03_sonar_tech:0 "Nghiên cứu Hệ thống Sonar Định vị Thủy âm"
 VIE_w05_asw_tech:0 "Nghiên cứu Vũ khí & Khí tài Chống ngầm"
 VIE_g02_frigate_tech:0 "Nghiên cứu Khinh hạm Tàng hình & ASW"
 VIE_b02_ocean_tech:0 "Nghiên cứu Kỹ thuật Tác chiến Biển xa"

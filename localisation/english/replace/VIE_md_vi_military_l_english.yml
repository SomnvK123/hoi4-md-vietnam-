 ### Tooltips & Flags
 VIE_v31_joint_modernization_ready_tt:0 "Đã hoàn thành ít nhất §Ymột học thuyết hiện đại hóa chủ lực§! của Lục quân"

 ### National Spirits V31
 VPA_Land_Readiness_1:0 "Sẵn sàng Chiến đấu Lục quân (Giai đoạn I)"
 VPA_Land_Readiness_1_desc:0 "Chuẩn hóa các đầu mối đơn vị và duy trì khả năng sẵn sàng chiến đấu trên các hướng chiến lược."
 VPA_Land_Readiness_2:0 "Sẵn sàng Chiến đấu Lục quân (Giai đoạn II)"
 VPA_Land_Readiness_2_desc:0 "Cơ cấu đơn vị bộ binh chuẩn mực, nâng cao kỷ luật và tốc độ lập kế hoạch tác chiến."
 VPA_Land_Readiness_3:0 "Sẵn sàng Chiến đấu Lục quân (Giai đoạn III)"
 VPA_Land_Readiness_3_desc:0 "Hiệp đồng tác chiến giữa bộ binh, tăng thiết giáp, pháo binh và công binh đã được hoàn thiện qua thực hành diễn tập."
 VPA_Land_Readiness_4:0 "Sẵn sàng Chiến đấu Lục quân Toàn diện"
 VPA_Land_Readiness_4_desc:0 "Lục quân sở hữu năng lực tác chiến hợp thành hoàn chỉnh, kỷ luật cao, bảo đảm kỹ thuật chiến dịch thông suốt và bền bỉ."

 VPA_Territorial_Defense_1:0 "Nền Quốc phòng Toàn dân"
 VPA_Territorial_Defense_1_desc:0 "Thế trận bảo vệ lãnh thổ dựa trên sự gắn kết chặt chẽ giữa bộ đội thường trực, bộ đội địa phương và nhân dân."
 VPA_Territorial_Defense_2:0 "Thế trận Phòng thủ Địa bàn Vững chắc"
 VPA_Territorial_Defense_2_desc:0 "Củng cố các khu vực phòng thủ then chốt, nâng cao năng lực sẵn sàng động viên quân nhân dự bị."
 VPA_Territorial_Defense_3:0 "Bảo đảm Hậu cần Tại chỗ"
 VPA_Territorial_Defense_3_desc:0 "Hệ thống kho tàng, trạm xưởng phân tán tại địa phương bảo đảm khả năng tự duy trì tác chiến dài ngày khi bị chia cắt."
 VPA_Territorial_Defense_4:0 "Thế trận Phòng thủ Chiều sâu Chủ động"
 VPA_Territorial_Defense_4_desc:0 "Hệ thống phòng thủ nhiều tầng, kiên cố, sẵn sàng bảo toàn lực lượng trước ưu thế hỏa lực của đối phương và chủ động phản công khi thời cơ đến."

 VPA_Industrial_Sustainment_1:0 "Năng lực Công nghiệp Quốc phòng (Cơ bản)"
 VPA_Industrial_Sustainment_1_desc:0 "Các nhà máy và xí nghiệp quốc phòng bảo đảm sửa chữa thường xuyên và cung ứng đạn dược cơ bản cho toàn quân."
 VPA_Industrial_Sustainment_2:0 "Làm chủ Bảo dưỡng và Nâng cấp Khí tài"
 VPA_Industrial_Sustainment_2_desc:0 "Các cơ sở đại tu như Nhà máy Z751 làm chủ quy trình sửa chữa lớn và nâng cấp các phương tiện cơ giới, tăng độ tin cậy của trang bị."
 VPA_Industrial_Sustainment_3:0 "Tự chủ Bảo đảm Kỹ thuật Toàn diện"
 VPA_Industrial_Sustainment_3_desc:0 "Công nghiệp quốc phòng làm chủ từ khâu sản xuất vũ khí bộ binh đến sửa chữa trang bị hạng nặng, tự chủ chuỗi cung ứng trong chiến tranh kéo dài."

 VPA_Command_Integration_1:0 "Chỉ huy Tác chiến Hiệp đồng"
 VPA_Command_Integration_1_desc:0 "Tăng cường năng lực trinh sát chiến thuật, thông tin liên lạc và khả năng hiệp đồng giữa các cánh quân."
 VPA_Command_Integration_2:0 "Hệ thống Chỉ huy Tác chiến Hiện đại"
 VPA_Command_Integration_2_desc:0 "Mạng lưới C4ISR, dữ liệu số và chỉ huy hiệp đồng đa quân chủng cho phép ra quyết định nhanh chóng và chính xác vượt bậc."

### National Spirits Hoc thuyet V31.1 (P / M / R)
 VPA_Defensive_Doctrine_1:0 "Học thuyết Phòng thủ Chiến lược Chủ động (Cơ bản)"
 VPA_Defensive_Doctrine_1_desc:0 "Xác lập ưu tiên bảo toàn lực lượng, chuẩn bị công sự trận địa vững chắc và sẵn sàng tiêu hao mũi tiến công của đối phương."
 VPA_Defensive_Doctrine_2:0 "Học thuyết Phòng thủ Chiến lược Hoàn chỉnh"
 VPA_Defensive_Doctrine_2_desc:0 "Đỉnh cao của nghệ thuật phòng thủ chiều sâu: kết hợp trận địa kiên cố, lực lượng dự bị cơ động và đòn phản kích sấm sét làm thất bại ý đồ của đối phương."

 VPA_Mechanized_Doctrine_1:0 "Học thuyết Phản công Cơ giới Hợp thành (Cơ bản)"
 VPA_Mechanized_Doctrine_1_desc:0 "Ưu tiên đầu tư cho các đơn vị thiết giáp và bộ binh cơ giới, tạo mũi nhọn đột phá hỏa lực mạnh mẽ."
 VPA_Mechanized_Doctrine_2:0 "Phản công Cơ giới Hợp thành Chiến dịch"
 VPA_Mechanized_Doctrine_2_desc:0 "Hoàn thiện nghệ thuật phản công chiến dịch bằng các binh đoàn cơ giới hợp thành, hiệp đồng tác chiến thần tốc và giành lại địa bàn quyết định."

 VPA_Mobile_Doctrine_1:0 "Học thuyết Tác chiến Cơ động Linh hoạt (Cơ bản)"
 VPA_Mobile_Doctrine_1_desc:0 "Ưu tiên tốc độ triển khai, ngụy trang phân tán và tính linh hoạt của lực lượng bộ binh trên mọi địa hình hiểm trở."
 VPA_Mobile_Doctrine_2:0 "Nghệ thuật Tác chiến Cơ động Địa hình Hoàn thiện"
 VPA_Mobile_Doctrine_2_desc:0 "Làm chủ nghệ thuật cơ động chuyển hóa thế trận, thích nghi tuyệt hảo với địa hình rừng núi sông ngòi, đánh bại đối phương bằng sự mưu lược và bất ngờ."

 VIE_synergy_defense_commando_idea:0 "Hiệp đồng Phòng ngự Chiều sâu - Đặc công"
 VIE_synergy_defense_commando_idea_desc:0 "Các phân đội đặc công luồn sâu nắm chắc ý đồ tiến công của địch, phục kích quấy rối hậu phương và phối hợp đắc lực cho tuyến phòng thủ."
 VIE_synergy_mech_commando_idea:0 "Hiệp đồng Đột kích Cơ giới - Đặc công"
 VIE_synergy_mech_commando_idea_desc:0 "Đặc công tiềm nhập mở cửa đánh chiếm các cứ điểm đầu cầu, tạo điều kiện cho thọc sâu cơ giới tiến công áp đảo."
 VIE_synergy_mobility_commando_idea:0 "Hiệp đồng Cơ động Linh hoạt - Đặc công"
 VIE_synergy_mobility_commando_idea_desc:0 "Sự kết hợp giữa bộ binh cơ động nhẹ và đặc công tinh nhuệ giúp làm chủ hoàn toàn các vùng địa hình hiểm trở và chia cắt đối phương."

 VIE_vpa_modern_joint_autonomous_idea:0 "Quân đội Nhân dân Hiện đại, Hiệp đồng, Tự chủ"
 VIE_vpa_modern_joint_autonomous_idea_desc:0 "Quân đội nhân dân Việt Nam đã hoàn thành xuất sắc tiến trình chuyển đổi toàn diện, sở hữu sức mạnh phòng vệ vững chắc, tự chủ và sẵn sàng bảo vệ trọn vẹn chủ quyền Tổ quốc."

 ### PHẦN 1: CẤP TOÀN QUÂN (Focus)
 VIE_mil_org_structure_review:0 "Rà soát Tổ chức và Biên chế Quân đội"
 VIE_mil_org_structure_review_desc:0 "Đánh giá toàn diện cơ cấu các cơ quan, đơn vị, bảo đảm phù hợp với yêu cầu tác chiến trong tình hình mới."
 VIE_mil_lean_efficient_force:0 "Xây dựng Lực lượng Tinh, Gọn, Mạnh"
 VIE_mil_lean_efficient_force_desc:0 "Kiện toàn các đầu mối, giảm bớt cấp trung gian, tập trung nguồn lực xây dựng các đơn vị chủ lực cơ động mạnh."
 VIE_mil_professional_cadre:0 "Phát triển Đội ngũ Quân nhân Chuyên nghiệp"
 VIE_mil_professional_cadre_desc:0 "Xây dựng đội ngũ sĩ quan, quân nhân chuyên nghiệp và nhân viên kỹ thuật có trình độ cao, gắn bó lâu dài với quân đội."
 VIE_mil_academies_and_training:0 "Đổi mới Hệ thống Học viện và Huấn luyện"
 VIE_mil_academies_and_training_desc:0 "Nâng cao chất lượng đào tạo tại các học viện, nhà trường quân đội; chuẩn hóa giáo trình sát với thực tiễn chiến trường hiện đại."

 VIE_mil_joint_command_system:0 "Xây dựng Hệ thống Chỉ huy Liên quân"
 VIE_mil_joint_command_system_desc:0 "Tổ chức cơ chế chỉ huy hiệp đồng tác chiến chung giữa Lục quân, Hải quân và Phòng không - Không quân dưới sự điều hành tập trung của Bộ Tổng Tham mưu."
 VIE_mil_modern_joint_autonomous_vpa:0 "Quân đội Hiện đại, Hiệp đồng và Tự chủ"
 VIE_mil_modern_joint_autonomous_vpa_desc:0 "Cột mốc lịch sử đánh dấu Quân đội nhân dân Việt Nam bước vào kỷ nguyên hiện đại hóa, đủ sức răn đe và bảo vệ vững chắc non sông."

 VIE_mil_ind_consolidation:0 "Củng cố Nền Công nghiệp Quốc phòng"
 VIE_mil_ind_consolidation_desc:0 "Quy hoạch và nâng cấp hệ thống nhà máy, xí nghiệp thuộc Tổng cục Công nghiệp Quốc phòng, tăng cường năng lực tự lực tự cường."
 VIE_mil_ind_mro_upgrade:0 "Làm chủ Bảo dưỡng và Nâng cấp Khí tài"
 VIE_mil_ind_mro_upgrade_desc:0 "Phát triển các cơ sở đại tu, sửa chữa lớn như Z751, Z153, kéo dài niên hạn và nâng cao tính năng chiến đấu của vũ khí trang bị."
 VIE_mil_ind_infantry_weapons_z111:0 "Hiện đại hóa Vũ khí Bộ binh Nội địa"
 VIE_mil_ind_infantry_weapons_z111_desc:0 "Đầu tư dây chuyền sản xuất súng đạn hiện đại tại Nhà máy Z111, đáp ứng nhu cầu trang bị vũ khí cá nhân tiêu chuẩn cho toàn quân."
 VIE_mil_ind_traditional_procurement:0 "Duy trì Hợp tác Quốc phòng Truyền thống"
 VIE_mil_ind_traditional_procurement_desc:0 "Tiếp tục quan hệ hợp tác kỹ thuật quân sự tin cậy với đối tác truyền thống Liên bang Nga trong việc cung ứng phụ tùng và khí tài chuyên dụng."
 VIE_mil_ind_diversify_defense_partners:0 "Đa dạng hóa Hợp tác Kỹ thuật Quân sự"
 VIE_mil_ind_diversify_defense_partners_desc:0 "Mở rộng quan hệ hợp tác công nghiệp quốc phòng với các đối tác quốc tế phù hợp nhằm tiếp cận công nghệ tiên tiến và giảm thiểu rủi ro chuỗi cung ứng."
 VIE_mil_ind_viettel_digital_military:0 "Viettel và Công nghệ Quân sự Số"
 VIE_mil_ind_viettel_digital_military_desc:0 "Phát huy năng lực công nghệ của Tập đoàn Công nghiệp - Viễn thông Quân đội trong nghiên cứu chế tạo khí tài tác chiến điện tử, radar và UAV."
 VIE_mil_ind_supply_chain_autonomy:0 "Tự chủ Kỹ thuật và Chuỗi Cung ứng"
 VIE_mil_ind_supply_chain_autonomy_desc:0 "Hình thành mạng lưới bảo đảm kỹ thuật nội địa vững chắc, chuẩn hóa vật tư thay thế và nâng cao năng lực ứng phó tình trạng khẩn cấp."

 ### PHẦN 2: LỤC QUÂN VIỆT NAM (Focus)
 VIE_lf_root_modern_army:0 "Xây dựng Lục quân Tinh nhuệ, Hiện đại"
 VIE_lf_root_modern_army_desc:0 "Xác lập định hướng phát triển Lục quân Quân đội nhân dân Việt Nam tinh, gọn, mạnh, tiến thẳng lên hiện đại theo lộ trình bài bản."

 VIE_lf_territorial_defense_foundation:0 "Củng cố Nền Quốc phòng Toàn dân"
 VIE_lf_territorial_defense_foundation_desc:0 "Xây dựng thế trận quốc phòng toàn dân gắn với thế trận an ninh nhân dân vững chắc trên mọi vùng miền của Tổ quốc."
 VIE_lf_local_forces_militia:0 "Bộ đội Địa phương và Dân quân Tự vệ"
 VIE_lf_local_forces_militia_desc:0 "Nâng cao chất lượng huấn luyện và trang bị cho lực lượng vũ trang địa phương, giữ vai trò nòng cốt bảo vệ cơ sở."
 VIE_lf_reserve_mobilization:0 "Hoàn thiện Lực lượng Dự bị Động viên"
 VIE_lf_reserve_mobilization_desc:0 "Quản lý chặt chẽ nguồn quân dự bị, diễn tập tiếp nhận và huấn luyện định kỳ sẵn sàng mở rộng quân đội khi có tình huống."
 VIE_lf_strategic_defense_zones:0 "Khu vực Phòng thủ Trọng yếu"
 VIE_lf_strategic_defense_zones_desc:0 "Xây dựng các tỉnh, thành phố thành khu vực phòng thủ vững chắc, tạo thế trận liên hoàn bảo vệ Tổ quốc từ sớm, từ xa."
 VIE_lf_fortifications_defense_sites:0 "Hiện đại hóa Công sự và Trận địa"
 VIE_lf_fortifications_defense_sites_desc:0 "Kiên cố hóa các công trình phòng thủ, hầm hào, trận địa pháo binh và cơ sở ngụy trang tại các hướng chiến lược."
 VIE_lf_local_logistics_stockpiles:0 "Bảo đảm Hậu cần Tại chỗ"
 VIE_lf_local_logistics_stockpiles_desc:0 "Phát triển mạng lưới dự trữ lương thực, đạn dược, xăng dầu tại chỗ, đáp ứng yêu cầu tự chủ bảo đảm hậu cần tại địa bàn."
 VIE_lf_coordination_regular_local:0 "Hiệp đồng Lực lượng Chủ lực và Địa phương"
 VIE_lf_coordination_regular_local_desc:0 "Tổ chức cơ chế chỉ huy phối hợp tác chiến chặt chẽ giữa các sư đoàn chủ lực cơ động với các đơn vị lực lượng vũ trang địa phương."
 VIE_lf_active_defense_in_depth:0 "Thế trận Phòng thủ Chiều sâu Chủ động"
 VIE_lf_active_defense_in_depth_desc:0 "Hoàn thiện nghệ thuật phòng thủ nhiều tầng lớp, kết hợp đánh tiêu hao, kìm chân đối phương và sẵn sàng chuyển sang phản công quyết định."

 VIE_lf_standardize_infantry_structure:0 "Chuẩn hóa Tổ chức Lực lượng Bộ binh"
 VIE_lf_standardize_infantry_structure_desc:0 "Cải tiến biên chế tiểu đoàn, trung đoàn và lữ đoàn bộ binh theo hướng cân đối, linh hoạt, tăng cường hỏa lực cá nhân và tổ đội."
 VIE_lf_combined_arms_readiness:0 "Năng lực Tác chiến Hiệp đồng Binh chủng"
 VIE_lf_combined_arms_readiness_desc:0 "Tăng cường huấn luyện phối hợp giữa bộ binh, pháo binh, tăng thiết giáp và công binh trong các bài tập chiến thuật thực tế."
 VIE_lf_infantry_modern_equipment:0 "Hiện đại hóa Trang bị Bộ binh"
 VIE_lf_infantry_modern_equipment_desc:0 "Trang bị đồng bộ vũ khí cá nhân họ STV, khí tài quan sát đêm, áo giáp và thông tin liên lạc cho chiến sĩ bộ binh."
 VIE_lf_combat_engineers:0 "Công binh Chiến đấu Hiện đại"
 VIE_lf_combat_engineers_desc:0 "Trang bị phương tiện bắc cầu cơ động, phá vật cản và công sự dã chiến, bảo đảm đường cơ động cho các cánh quân chủ lực."
 VIE_lf_ground_artillery_modernization:0 "Hiện đại hóa Pháo binh Mặt đất"
 VIE_lf_ground_artillery_modernization_desc:0 "Nâng cấp hệ thống điều khiển hỏa lực pháo binh, khí tài trinh sát và tiếp nhận các loại pháo tự hành, pháo phản lực tầm xa."
 VIE_lf_tactical_air_defense:0 "Tăng cường Phòng không Lục quân"
 VIE_lf_tactical_air_defense_desc:0 "Trang bị tên lửa vác vai, pháo phòng không tự hành và phương tiện chế áp UAV bảo vệ đội hình hành quân của lục quân."
 VIE_lf_recon_tactical_command:0 "Trinh sát và Chỉ huy Chiến thuật"
 VIE_lf_recon_tactical_command_desc:0 "Kết hợp trinh sát cơ giới, trinh sát kỹ thuật và UAV trinh sát chiến thuật nâng cao khả năng nhận biết chiến trường."
 VIE_lf_operational_logistics_maintenance:0 "Hậu cần và Bảo đảm Kỹ thuật Chiến dịch"
 VIE_lf_operational_logistics_maintenance_desc:0 "Hình thành năng lực bảo đảm vật chất, xăng dầu và sửa chữa dã chiến cơ động đáp ứng các chiến dịch quy mô lớn."

 VIE_lf_sf_consolidation:0 "Củng cố Binh chủng Đặc công"
 VIE_lf_sf_consolidation_desc:0 "Tập trung đầu mối, nâng cao năng lực sẵn sàng chiến đấu và phẩm chất đặc biệt cho bộ đội Đặc công."
 VIE_lf_sf_selection_and_training:0 "Đổi mới Tuyển chọn và Huấn luyện Đặc công"
 VIE_lf_sf_selection_and_training_desc:0 "Tuyển chọn khắt khe và áp dụng giáo trình huấn luyện thể lực, võ thuật, sinh tồn dã ngoại và kỹ thuật đột nhập đỉnh cao."
 VIE_lf_sf_ground_commando:0 "Nâng cao Năng lực Đặc công Bộ"
 VIE_lf_sf_ground_commando_desc:0 "Huấn luyện chuyên sâu tác chiến rừng núi, đô thị và tập kích các căn cứ chỉ huy, kho tàng kiên cố của đối phương."
 VIE_lf_sf_water_commando:0 "Đặc công Nước và Tác chiến Ven biển"
 VIE_lf_sf_water_commando_desc:0 "Phát triển các đội người nhái tinh nhuệ, làm chủ kỹ thuật lặn sâu, tập kích cảng biển và phương tiện thủy của đối phương."
 VIE_lf_sf_special_warfare_capstone:0 "Hoàn thiện Năng lực Tác chiến Đặc biệt"
 VIE_lf_sf_special_warfare_capstone_desc:0 "Xây dựng Binh chủng Đặc công thành lực lượng đặc biệt tinh nhuệ, mưu trí dũng cảm, đánh hiểm thắng lớn."

### HOC THUYET P: PHONG THU CHIEN LUOC CHU DONG
 VIE_lf_p1_strategic_defense:0 "Học thuyết Phòng thủ Chiến lược Chủ động"
 VIE_lf_p1_strategic_defense_desc:0 "Xác lập tư duy lấy phòng thủ chiều sâu làm gốc, bảo toàn sinh lực trước ưu thế công nghệ và hỏa lực của đối phương, kiên trì chờ đợi thời cơ phản kích."
 VIE_lf_p2_multi_layered_defense:0 "Tổ chức Phòng ngự Nhiều tuyến"
 VIE_lf_p2_multi_layered_defense_desc:0 "Bố trí trận địa phòng thủ liên hoàn, nhiều tầng nấc có chiều sâu, bảo đảm lực lượng có thể linh hoạt chuyển đổi trận địa khi bị hỏa lực địch dồn ép."
 VIE_lf_p3_operational_reserves:0 "Xây dựng Lực lượng Dự bị Chiến dịch"
 VIE_lf_p3_operational_reserves_desc:0 "Chuẩn hóa các trung đoàn, sư đoàn dự bị chiến dịch cơ động, sẵn sàng tăng viện cho các hướng phòng thủ bị uy hiếp hoặc bịt lỗ thủng phòng tuyến."
 VIE_lf_p4_defensive_anti_breakthrough_firepower:0 "Tăng cường Hỏa lực Chống đột phá"
 VIE_lf_p4_defensive_anti_breakthrough_firepower_desc:0 "Tập trung hỏa lực pháo binh, tên lửa chống tăng và phòng không lục quân bảo đảm bẻ gãy các mũi nhọn đột phá thiết giáp của quân địch."
 VIE_lf_p5_protracted_combat_sustainment:0 "Duy trì Tác chiến Chiến tranh Kéo dài"
 VIE_lf_p5_protracted_combat_sustainment_desc:0 "Củng cố năng lực bảo đảm vật tư, phân tán kho tàng và duy trì chỉ huy tác chiến thông suốt khi phải đương đầu với áp lực tiến công dồn dập nhiều ngày."
 VIE_lf_p6_active_defense_counterattack:0 "Phòng thủ Vững chắc, Phản kích Đúng thời cơ"
 VIE_lf_p6_active_defense_counterattack_desc:0 "Đỉnh cao học thuyết phòng thủ chủ động: khi đối phương tiêu hao sức mạnh và sa lầy, lực lượng phòng ngự phối hợp với dự bị chiến dịch đồng loạt phản kích."

 ### HOC THUYET M: PHAN CONG CO GIOI HOP THANH
 VIE_lf_m1_combined_arms_mechanized:0 "Học thuyết Tác chiến Cơ giới Hợp thành"
 VIE_lf_m1_combined_arms_mechanized_desc:0 "Lựa chọn phát triển lực lượng cơ giới hỏa lực mạnh làm quả đấm thép của Lục quân, sẵn sàng đánh đòn tiêu diệt vào cụm quân đối phương."
 VIE_lf_m2_armor_combat_readiness:0 "Sẵn sàng Chiến đấu của Tăng Thiết giáp"
 VIE_lf_m2_armor_combat_readiness_desc:0 "Chuẩn hóa công tác bảo dưỡng, đại tu, huấn luyện kíp xe và cải thiện độ tin cậy vận hành của các trung đoàn, lữ đoàn tăng thiết giáp."
 VIE_lf_m3_mechanized_infantry_formations:0 "Hoàn thiện Đội hình Bộ binh Cơ giới"
 VIE_lf_m3_mechanized_infantry_formations_desc:0 "Trang bị đồng bộ xe chiến đấu bộ binh và xe bọc thép chở quân, bảo đảm bộ binh cơ giới cơ động cùng tốc độ và bảo vệ sườn cho xe tăng."
 VIE_lf_m4_mobile_fire_support:0 "Phát triển Hỏa lực Yểm trợ Cơ động"
 VIE_lf_m4_mobile_fire_support_desc:0 "Trang bị pháo tự hành và pháo phản lực bánh lốp cơ động cao, bám sát yểm trợ hỏa lực liên tục cho mũi tiến công cơ giới hiệp đồng."
 VIE_lf_m5_operational_combined_arms_units:0 "Đơn vị Hợp thành Cơ động Chiến dịch"
 VIE_lf_m5_operational_combined_arms_units_desc:0 "Tổ chức các lữ đoàn hợp thành độc lập với mạng lưới chỉ huy số và hậu cần cơ động thông suốt, đủ sức tác chiến thọc sâu trên nhiều hướng."
 VIE_lf_m6_operational_mechanized_counteroffensive:0 "Phản công Cơ giới Chiến dịch Quyết định"
 VIE_lf_m6_operational_mechanized_counteroffensive_desc:0 "Năng lực tập trung sức mạnh xe tăng và hỏa lực mở màn các chiến dịch phản công hiệp đồng quy mô lớn, đè bẹp phòng tuyến và giành lại thế trận."

 ### HOC THUYET R: TAC CHIEN CO DONG LINH HOAT
 VIE_lf_r1_flexible_mobile_warfare:0 "Học thuyết Tác chiến Cơ động Linh hoạt"
 VIE_lf_r1_flexible_mobile_warfare_desc:0 "Lựa chọn lối đánh cơ động phân tán, tận dụng triệt để địa hình và tính linh hoạt mưu lược để làm phá sản các kế hoạch tác chiến của địch."
 VIE_lf_r2_modernize_mobile_infantry:0 "Hiện đại hóa Bộ binh Cơ động"
 VIE_lf_r2_modernize_mobile_infantry_desc:0 "Nâng cao thể lực, trang bị cá nhân gọn nhẹ, thông tin liên lạc vệ tinh và khả năng tác chiến độc lập của các đơn vị bộ binh cơ động cao."
 VIE_lf_r3_terrain_adaptive_warfare:0 "Thích nghi Tác chiến Đa dạng Địa hình"
 VIE_lf_r3_terrain_adaptive_warfare_desc:0 "Huấn luyện bộ đội tác chiến điêu luyện trên địa hình rừng núi hiểm trở, đồng bằng chia cắt và sông nước, biến địa hình thành đồng minh chiến đấu."
 VIE_lf_r4_tactical_motorized_mobility:0 "Cơ động hóa Lực lượng Bằng Xe Chiến thuật"
 VIE_lf_r4_tactical_motorized_mobility_desc:0 "Trang bị xe cơ động đa dụng, xe bọc thép bánh lốp việt dã và phương tiện kỹ thuật chiến thuật phục vụ hành quân cơ động thần tốc."
 VIE_lf_r5_rapid_reaction_corps:0 "Lực lượng Phản ứng Nhanh Cấp chiến dịch"
 VIE_lf_r5_rapid_reaction_corps_desc:0 "Xây dựng các đơn vị ứng trực có khả năng chuyển trạng thái sẵn sàng chiến đấu tức thì, lập tức cơ động tới phong tỏa và đánh chặn các hướng nguy cấp."
 VIE_lf_r6_terrain_maneuver_mastery:0 "Tác chiến Cơ động Chuyển hóa Thế trận"
 VIE_lf_r6_terrain_maneuver_mastery_desc:0 "Đỉnh cao nghệ thuật vận động chiến: thoắt ẩn thoắt hiện, cơ động chia cắt đội hình địch, chuyển hóa từ thế phòng ngự sang thế bao vây tiêu diệt bất ngờ."

 VIE_lf_modernize_army_command_system:0 "Hiện đại hóa Chỉ huy Tác chiến Lục quân"
 VIE_lf_modernize_army_command_system_desc:0 "Tích hợp mạng thông tin tác chiến số hóa, radar mặt đất và trung tâm điều hành hỏa lực lục quân thống nhất."
 VIE_lf_modern_elite_combined_army_capstone:0 "Xây dựng Lục quân Hiện đại và Hiệp đồng"
 VIE_lf_modern_elite_combined_army_capstone_desc:0 "Đỉnh cao hoàn thiện của tiến trình xây dựng Lục quân Việt Nam cách mạng, chính quy, tinh nhuệ, từng bước hiện đại."
### Quyet dinh Chien luoc Hoc thuyet Luc quan V31.1
 VIE_decision_p_backup_defense_line:0 "Thiết lập Tuyến Phòng thủ Dự phòng"
 VIE_decision_p_backup_defense_line_desc:0 "Bố trí công sự dã chiến và tuyến chiến hào dự bị phía sau, tăng cường sức chống chịu và tốc độ đào công sự của các đơn vị trên hướng phòng thủ."
 VIE_decision_p_operational_reserves_boost:0 "Tăng cường Dự bị Chiến dịch"
 VIE_decision_p_operational_reserves_boost_desc:0 "Huy động nguồn lực cấp bách tăng cường vũ khí và quân số cho các trung đoàn dự bị, nâng cao tốc độ tiếp viện và khả năng phục hồi trận tuyến."
 VIE_decision_p_local_counterattack:0 "Tổ chức Phản kích Cục bộ"
 VIE_decision_p_local_counterattack_desc:0 "Tận dụng thời cơ quân địch mất đà tiến công trước tuyến phòng ngự kiên cố, tung lực lượng dự bị phản kích dũng mãnh để khôi phục trận địa."

 VIE_decision_m_mbt_modernization:0 "Chương trình Hiện đại hóa Xe tăng Chủ lực"
 VIE_decision_m_mbt_modernization_desc:0 "Đầu tư nâng cấp hệ thống ngắm bắn kỹ thuật số, giáp phản ứng nổ và tăng cường độ tin cậy động cơ cho lực lượng tăng thiết giáp chủ lực."
 VIE_decision_m_combined_arms_deployment:0 "Tổ chức Lực lượng Cơ giới Hợp thành"
 VIE_decision_m_combined_arms_deployment_desc:0 "Triển khai cơ cấu hiệp đồng chặt chẽ giữa xe tăng, xe chiến đấu bộ binh và pháo tự hành, nâng cao sức mạnh hỏa lực đột phá."
 VIE_decision_m_counteroffensive_surge:0 "Tập trung Sức mạnh Phản công Chiến dịch"
 VIE_decision_m_counteroffensive_surge_desc:0 "Dồn toàn bộ khí tài cơ giới và hỏa lực pháo binh mở mũi tiến công đột phá quyết định, bẻ gãy cánh quân đối phương."

 VIE_decision_r_terrain_mobility_training:0 "Huấn luyện Cơ động Thích nghi Địa hình"
 VIE_decision_r_terrain_mobility_training_desc:0 "Diễn tập chuyên sâu kỹ năng vượt sông suối, cơ động rừng núi và hành quân đêm, giảm hao mòn trang bị và nâng cao tốc độ cơ động."
 VIE_decision_r_rapid_readiness_force:0 "Thiết lập Lực lượng Ứng trực Cơ động Cao"
 VIE_decision_r_rapid_readiness_force_desc:0 "Duy trì trạng thái trực ban chiến đấu 100% cho các lữ đoàn phản ứng nhanh, nâng cao tinh thần và khả năng trinh sát phát hiện sớm."
 VIE_decision_r_maneuver_tempo_surge:0 "Tăng cường Nhịp độ Cơ động Chiến dịch"
 VIE_decision_r_maneuver_tempo_surge_desc:0 "Phát lệnh chuyển quân thần tốc trên toàn mặt trận, thay đổi hướng tác chiến bất ngờ khiến đối phương không kịp trở tay."

 ### Ideas tu Quyet dinh gameplay
 VIE_idea_p_backup_defense_line:0 "Tuyến Phòng thủ Dự phòng Đã Thiết lập"
 VIE_idea_p_backup_defense_line_desc:0 "Hệ thống công sự chiều sâu giúp bộ đội đào công sự nhanh hơn và giữ trận địa kiên cường."
 VIE_idea_p_operational_reserves:0 "Lực lượng Dự bị Sẵn sàng Tiếp viện"
 VIE_idea_p_operational_reserves_desc:0 "Tăng cường quân số và trang bị bảo đảm khả năng bổ sung lực lượng nhanh chóng vào vị trí chiến đấu."
 VIE_idea_p_local_counterattack:0 "Đợt Phản kích Cục bộ Đang Diễn ra"
 VIE_idea_p_local_counterattack_desc:0 "Lực lượng phòng ngự đang dồn hỏa lực đánh bật mũi tiến công của đối phương."
 VIE_idea_m_mbt_modernization:0 "Đội ngũ Xe tăng Nâng cấp Hiện đại"
 VIE_idea_m_mbt_modernization_desc:0 "Khí tài tăng thiết giáp được nâng cấp hỏa lực và giáp bảo vệ, tăng hiệu quả tác chiến."
 VIE_idea_m_combined_arms:0 "Đội hình Cơ giới Hiệp đồng Tác chiến"
 VIE_idea_m_combined_arms_desc:0 "Hiệp đồng chặt chẽ giữa bộ binh cơ giới, pháo binh và xe tăng nâng cao sức công phá."
 VIE_idea_m_counteroffensive_surge:0 "Cao trào Phản công Chiến dịch Cơ giới"
 VIE_idea_m_counteroffensive_surge_desc:0 "Mũi tiến công bọc thép đang thọc sâu với hỏa lực và sức đột phá tối đa."
 VIE_idea_r_terrain_mobility:0 "Lực lượng Cơ động Địa hình Tinh nhuệ"
 VIE_idea_r_terrain_mobility_desc:0 "Khả năng hành quân vượt địa hình giúp duy trì tốc độ và hạn chế hỏng hóc xe cộ."
 VIE_idea_r_rapid_readiness:0 "Lực lượng Ứng trực Phản ứng Nhanh"
 VIE_idea_r_rapid_readiness_desc:0 "Tinh thần cảnh giác và khả năng trinh sát giúp đơn vị triển khai chớp nhoáng khi có lệnh."
 VIE_idea_r_maneuver_tempo:0 "Nhịp độ Cơ động Thần tốc"
 VIE_idea_r_maneuver_tempo_desc:0 "Tốc độ hành quân và lập phương án tác chiến được đẩy lên mức cao nhất."

 ### Tech bonuses
 VIE_p4_artillery_bonus:0 "Nghiên cứu Hỏa lực Chống Đột phá"
 VIE_m4_sp_arty_bonus:0 "Nghiên cứu Pháo Tự hành Cơ động"
 VIE_r4_motorized_bonus:0 "Nghiên cứu Xe Cơ động Chiến thuật"

### ============================================================

### ============================================================
### ĐỀ ÁN V34: HẢI QUÂN NHÂN DÂN VIỆT NAM (40 FOCUS V34)
### ============================================================

 VIE_nav_n00_maritime_strategy_21st:0 "Chiến lược Biển Việt Nam thế kỷ XXI"
 VIE_nav_n00_maritime_strategy_21st_desc:0 "Xác lập định hướng phát triển sức mạnh biển toàn diện, bảo vệ vững chắc chủ quyền biển đảo, thềm lục địa và các lợi ích kinh tế biển của Tổ quốc trong kỷ nguyên mới."
 VIE_nav_t01_organization_reform:0 "Đánh giá và kiện toàn tổ chức Hải quân"
 VIE_nav_t01_organization_reform_desc:0 "Rà soát toàn diện cơ cấu lực lượng, tình trạng vũ khí kỹ thuật và hoàn thiện mô hình tổ chức chỉ huy, tạo tiền đề nâng cao chất lượng huấn luyện và sẵn sàng chiến đấu."
 VIE_nav_i01_shipbuilding_industry:0 "Củng cố nền công nghiệp đóng tàu quân sự"
 VIE_nav_i01_shipbuilding_industry_desc:0 "Đầu tư nâng cấp năng lực các nhà máy đóng tàu quân đội như Ba Son, Sông Thu, Hồng Hà; làm chủ công nghệ đóng mới tàu tuần tra và sửa chữa lớn khí tài hải quân."
 VIE_nav_t02_officer_sailor_quality:0 "Nâng cao chất lượng sĩ quan và thủy thủ"
 VIE_nav_t02_officer_sailor_quality_desc:0 "Chuẩn hóa chương trình đào tạo tại Học viện Hải quân, tăng cường giờ đi biển thực tế, nâng cao bản lĩnh chính trị và trình độ ngoại ngữ, kỹ thuật của cán bộ thủy thủ."
 VIE_nav_t03_regional_commands:0 "Kiện toàn lực lượng các Vùng Hải quân"
 VIE_nav_t03_regional_commands_desc:0 "Củng cố năng lực chỉ huy tác chiến, phân định rõ khu vực trách nhiệm chiến lược từ Vùng 1 đến Vùng 5, nâng cao khả năng phản ứng cơ động bảo vệ vùng biển chủ quyền."
 VIE_nav_i02_technology_transfer_molniya:0 "Tiếp nhận công nghệ đóng tàu chiến đấu hiện đại"
 VIE_nav_i02_technology_transfer_molniya_desc:0 "Thực hiện thành công chương trình chuyển giao công nghệ đóng tàu tên lửa tấn công nhanh Molniya Project 1241.8 trong nước, tạo bước đột phá về năng lực công nghệ đóng tàu quân sự."
 VIE_nav_i03_ship_systems_integration:0 "Làm chủ thiết kế và tích hợp hệ thống hạm tàu"
 VIE_nav_i03_ship_systems_integration_desc:0 "Từng bước tự chủ trong việc thiết kế kết cấu thân vỏ, tích hợp hệ thống chỉ huy chiến đấu CMS, radar dẫn bắn và cảm biến quang điện tử trên các lớp tàu mặt nước."
 VIE_nav_w01_surface_combatants:0 "Hiện đại hóa lực lượng tàu chiến đấu mặt nước"
 VIE_nav_w01_surface_combatants_desc:0 "Duy trì khả năng sẵn sàng chiến đấu cao cho các lữ đoàn tàu tuần tiễu, nâng cấp hệ thống điện tử và vũ khí tên lửa trên các tàu chiến mặt nước hiện có."
 VIE_nav_w04_kilo_submarine_force:0 "Xây dựng lực lượng tàu ngầm hiện đại"
 VIE_nav_w04_kilo_submarine_force_desc:0 "Xây dựng Lữ đoàn 189 tàu ngầm tinh nhuệ, đưa vào vận hành 6 tàu ngầm diesel-điện Kilo 636.1 trang bị tên lửa hành trình Club-S, tạo ra năng lực răn đe ngầm chiến lược dưới lòng biển."
 VIE_nav_t04_joint_command_system:0 "Hoàn thiện hệ thống chỉ huy hiệp đồng Hải quân"
 VIE_nav_t04_joint_command_system_desc:0 "Kết nối Sở Chỉ huy Quân chủng với các Bộ Tư lệnh Vùng, các biên đội tàu cơ động và lực lượng phòng thủ bờ biển, hình thành mạng lưới chỉ huy điều hành thống nhất."
 VIE_nav_i04_domestic_corvette_class:0 "Phát triển thế hệ tàu hộ vệ do Việt Nam đóng mới"
 VIE_nav_i04_domestic_corvette_class_desc:0 "Triển khai dự án đóng mới lớp tàu hộ vệ săn ngầm và đa năng thế hệ mới tại Nhà máy Sông Thu, khẳng định năng lực tự chủ hoàn toàn kỹ thuật đóng tàu chiến hiện đại của đất nước."
 VIE_nav_s01_maritime_surveillance:0 "Mở rộng khả năng cảnh giới vùng biển"
 VIE_nav_s01_maritime_surveillance_desc:0 "Triển khai hệ thống trạm radar bờ biển tầm xa, tích hợp dữ liệu trinh sát quang học và vệ tinh, nâng cao khả năng phát hiện sớm mọi hoạt động trên các vùng biển trọng điểm."
 VIE_nav_l01_naval_bases:0 "Hiện đại hóa căn cứ Hải quân"
 VIE_nav_l01_naval_bases_desc:0 "Nâng cấp cơ sở hạ tầng các quân cảng Cam Ranh, Đà Nẵng, Hải Phòng, Phú Quốc; trang bị cầu cảng hiện đại, trạm nạp nhiên liệu và cơ sở kỹ thuật bảo đảm cho hạm đội."
 VIE_nav_w02_missile_boats:0 "Phát triển lực lượng tàu tên lửa cơ động"
 VIE_nav_w02_missile_boats_desc:0 "Biên chế các biên đội tàu tên lửa cao tốc Molniya và BPS-500, sở hữu hỏa lực diệt hạm tập trung Uran-E với khả năng tác chiến đánh luồn, phục kích bất ngờ trên biển."
 VIE_nav_w03_multirole_frigates:0 "Tiếp nhận và làm chủ tàu hộ vệ đa nhiệm"
 VIE_nav_w03_multirole_frigates_desc:0 "Khai thác làm chủ lực lượng khinh hạm Gepard 3.9 (Project 11661E), trang bị hỏa lực chống hạm, phòng không Palma và trực thăng săn ngầm Ka-28, đóng vai trò nòng cốt hạm đội."
 VIE_nav_s03_subsurface_recon:0 "Hiện đại hóa trinh sát biển và dưới mặt nước"
 VIE_nav_s03_subsurface_recon_desc:0 "Trang bị hệ thống định vị thủy âm sonar cố định và cơ động, nâng cao năng lực trinh sát phát hiện tàu ngầm đối phương và bảo vệ an toàn các luồng hàng hải trọng yếu."
 VIE_nav_s02_island_defense_forces:0 "Củng cố lực lượng bảo vệ đảo"
 VIE_nav_s02_island_defense_forces_desc:0 "Tăng cường năng lực tác chiến phòng thủ đảo cho Lữ đoàn 146 và các đơn vị Trường Sa; củng cố công sự, trận địa pháo và các trạm quan sát cảnh giới kiên cố."
 VIE_nav_l02_overhaul_maintenance:0 "Chuẩn hóa hệ thống bảo dưỡng và đại tu"
 VIE_nav_l02_overhaul_maintenance_desc:0 "Xây dựng quy trình kỹ thuật sửa chữa định kỳ, trung tu và đại tu tàu mặt nước và tàu ngầm trong nước, giảm thiểu phụ thuộc vào cơ sở kỹ thuật nước ngoài."
 VIE_nav_l03_island_logistics:0 "Xây dựng hệ thống hậu cần biển đảo"
 VIE_nav_l03_island_logistics_desc:0 "Tổ chức tuyến vận tải tiếp tế định kỳ và đột xuất cho các đảo và nhà giàn DK1; nâng cao năng lực dự trữ nước ngọt, lương thực và nhiên liệu trong mọi điều kiện thời tiết."
 VIE_nav_h01_fleet_development_priority:0 "Ưu tiên xây dựng hạm đội tác chiến hiện đại"
 VIE_nav_h01_fleet_development_priority_desc:0 "Chuyển hướng chiến lược tập trung nguồn lực phát triển các biên đội tàu chiến đấu mặt nước đa năng, sẵn sàng vươn khơi làm chủ các vùng biển khu vực."
 VIE_nav_p01_integrated_defense_choice:0 "Lựa chọn chiến lược phòng thủ biển tích hợp"
 VIE_nav_p01_integrated_defense_choice_desc:0 "Tập trung xây dựng thế trận chống tiếp cận/chống thâm nhập khu vực (A2/AD) nhiều tầng, kết hợp hỏa lực tên lửa bờ biển, tàu ngầm Kilo và hệ thống công sự đảo."
 VIE_nav_w05_asw_fleet_defense:0 "Nâng cao năng lực chống ngầm và tự vệ hạm đội"
 VIE_nav_w05_asw_fleet_defense_desc:0 "Trang bị ngư lôi săn ngầm hiện đại, nâng cao năng lực phối hợp giữa trực thăng săn ngầm hải quân Ka-28 và hệ thống hỏa lực phòng vệ trên tàu chiến."
 VIE_nav_s04_joint_island_defense:0 "Hiệp đồng bảo vệ biển đảo"
 VIE_nav_s04_joint_island_defense_desc:0 "Tổ chức thế trận hiệp đồng tác chiến chặt chẽ giữa Hải quân, Phòng không - Không quân, Cảnh sát biển, Kiểm ngư và Hải đội Dân quân thường trực."
 VIE_nav_l04_support_rescue_vessels:0 "Phát triển lực lượng tàu hỗ trợ và cứu hộ"
 VIE_nav_l04_support_rescue_vessels_desc:0 "Biên chế tàu cứu nạn tàu ngầm đa năng Yết Kiêu 927 và các tàu vận tải tiếp tế thế hệ mới, bảo đảm an toàn tuyệt đối cho hoạt động tác chiến của hạm đội."
 VIE_nav_p02_coastal_island_network:0 "Xây dựng mạng lưới phòng thủ bờ – đảo"
 VIE_nav_p02_coastal_island_network_desc:0 "Liên kết chặt chẽ các trận địa tên lửa phòng thủ bờ biển Bastion-P, Redut-M với các cụm đảo tiền tiêu, hình thành lá chắn hỏa lực bảo vệ vững chắc lãnh hải."
 VIE_nav_p03_island_territory_defense:0 "Củng cố lực lượng bảo vệ các địa bàn biển đảo"
 VIE_nav_p03_island_territory_defense_desc:0 "Tăng cường năng lực cơ động tác chiến và hỏa lực cho Lữ đoàn Hải quân đánh bộ 101 và 147, sẵn sàng đổ bộ tái chiếm và bảo vệ các đảo trọng yếu."
 VIE_nav_h02_multirole_task_groups:0 "Hình thành các biên đội tàu tác chiến đa nhiệm"
 VIE_nav_h02_multirole_task_groups_desc:0 "Tổ chức các biên đội tác chiến kết hợp khinh hạm hộ vệ, tàu pháo tên lửa cao tốc và tàu bảo đảm hậu cần, có năng lực tuần tra tác chiến độc lập tầm trung."
 VIE_nav_s05_unified_maritime_picture:0 "Hình thành hệ thống nhận thức tình hình biển thống nhất"
 VIE_nav_s05_unified_maritime_picture_desc:0 "Hợp nhất toàn bộ dữ liệu cảnh giới từ radar bờ, tàu ngầm, máy bay tuần thám và các trạm quan sát đảo thành một bức tranh nhận thức tình hình biển (MDA) thời gian thực."
 VIE_nav_l05_sustained_operations:0 "Nâng cao khả năng duy trì hoạt động dài ngày"
 VIE_nav_l05_sustained_operations_desc:0 "Hoàn thiện quy trình luân phiên lực lượng, tiếp tế cơ động trên biển (RAS) và bảo dưỡng ngoài khơi, giúp tàu chiến có thể bám biển hoạt động liên tục nhiều tháng."
 VIE_nav_p04_layered_defense:0 "Hiện đại hóa năng lực phòng thủ biển nhiều lớp"
 VIE_nav_p04_layered_defense_desc:0 "Tích hợp tên lửa hành trình chống hạm tầm siêu âm, bãi thủy lôi thông minh và các bệ phóng ngụy trang cơ động, tạo nên thế trận phòng thủ hiểm hóc không thể xuyên phá."
 VIE_nav_g01_greenwater_navy:0 "Định hướng xây dựng Hải quân biển gần hiện đại"
 VIE_nav_g01_greenwater_navy_desc:0 "Xác lập học thuyết Hải quân biển gần (Green-water), tập trung xây dựng hạm đội mặt nước cơ động và lực lượng săn ngầm làm chủ hoàn toàn vùng đặc quyền kinh tế (EEZ)."
 VIE_nav_b01_bluewater_navy:0 "Khởi động chương trình Hải quân biển xa"
 VIE_nav_b01_bluewater_navy_desc:0 "Mở rộng tầm nhìn hướng ra đại dương (Blue-water), đặt mục tiêu xây dựng các cụm tàu chiến đấu có khả năng bảo vệ tuyến hàng hải huyết mạch và hiện diện tại các vùng biển xa."
 VIE_nav_p05_joint_coastal_defense:0 "Hiệp đồng tác chiến phòng thủ biển"
 VIE_nav_p05_joint_coastal_defense_desc:0 "Kết hợp nhịp nhàng các đòn phục kích của tàu ngầm Kilo với hỏa lực bờ biển và lực lượng không quân tiêm kích bom Su-30MK2, giáng đòn tiêu diệt các hạm đội tàu đối phương."
 VIE_nav_g02_advanced_frigates_asw:0 "Hiện đại hóa lực lượng tàu hộ vệ và chống ngầm"
 VIE_nav_g02_advanced_frigates_asw_desc:0 "Trang bị các tàu hộ vệ cỡ lớn có khả năng tàng hình, hệ thống phóng thẳng đứng VLS hiện đại và sonar thủy âm kéo theo tiên tiến, nâng cao vượt bậc năng lực săn ngầm."
 VIE_nav_b02_extended_deployment_fleet:0 "Xây dựng hạm đội có khả năng triển khai dài ngày"
 VIE_nav_b02_extended_deployment_fleet_desc:0 "Đầu tư tàu hậu cần viễn dương cỡ lớn, hoàn thiện kỹ năng tiếp vận trên biển và khả năng phối hợp tác chiến liên tục nhiều tháng ở vùng biển quốc tế."
 VIE_nav_p06_active_coastal_defense_capstone:0 "Hoàn thiện thế trận phòng thủ biển chủ động"
 VIE_nav_p06_active_coastal_defense_capstone_desc:0 "Đỉnh cao của học thuyết Phòng thủ tích hợp: xác lập thế trận phòng ngự chủ động kiên cường, biến từng mét biển, từng hòn đảo thành pháo đài thép bất khả xâm phạm."
 VIE_nav_g03_self_reliant_greenwater_capstone:0 "Xây dựng hạm đội biển gần có năng lực tự chủ tác chiến"
 VIE_nav_g03_self_reliant_greenwater_capstone_desc:0 "Đỉnh cao của học thuyết Green-water: Hạm đội tác chiến hiện đại có khả năng kiểm soát và bảo vệ toàn bộ vùng biển khu vực và quần đảo với độ tin cậy và tự chủ cao nhất."
 VIE_nav_b03_sustained_bluewater_capstone:0 "Hình thành năng lực tác chiến Hải quân biển xa bền vững"
 VIE_nav_b03_sustained_bluewater_capstone_desc:0 "Đỉnh cao của học thuyết Blue-water: Hình thành các biên đội tàu chiến đấu tầm xa, có khả năng tham gia các chiến dịch quốc tế và bảo vệ lợi ích hàng hải trên các đại dương."
 VIE_nav_f01_tactical_doctrine_alignment:0 "Hoàn thiện học thuyết tác chiến Hải quân"
 VIE_nav_f01_tactical_doctrine_alignment_desc:0 "Đúc kết kinh nghiệm thực tiễn và tinh hoa các học thuyết tác chiến, hoàn thiện cơ chế chỉ huy tham mưu và nghệ thuật quân sự Hải quân nhân dân Việt Nam."
 VIE_nav_f02_regular_modern_navy:0 "Xây dựng Hải quân nhân dân Việt Nam chính quy, hiện đại"
 VIE_nav_f02_regular_modern_navy_desc:0 "Khẳng định tầm vóc mới của Hải quân nhân dân Việt Nam: Quân chủng cách mạng, chính quy, tinh nhuệ, hiện đại, làm nòng cốt quản lý và bảo vệ vững chắc chủ quyền biển đảo thiêng liêng của Tổ quốc."

### ============================================================
### HỆ THỐNG Ý NIỆM TĂNG TIẾN (TIERED SPIRITS) HẢI QUÂN V34
### ============================================================

 VPA_Naval_Org_1:0 "Kiện toàn Tổ chức Hải quân (Cấp I)"
 VPA_Naval_Org_1_desc:0 "Cơ cấu tổ chức và chỉ huy các cấp bước đầu được chuẩn hóa, nâng cao ý thức kỷ luật và chỉ huy điều hành."
 VPA_Naval_Org_2:0 "Chuẩn hóa Đào tạo Thủy thủ (Cấp II)"
 VPA_Naval_Org_2_desc:0 "Đội ngũ sĩ quan và thủy thủ được đào tạo bài bản, tăng cường giờ đi biển, nâng cao khả năng tác chiến thực tế."
 VPA_Naval_Org_3:0 "Kiện toàn 5 Vùng Hải quân (Cấp III)"
 VPA_Naval_Org_3_desc:0 "Củng cố năng lực chỉ huy và phân định vùng biển chiến lược từ Vùng 1 đến Vùng 5, nâng cao khả năng hiệp đồng khu vực."
 VPA_Naval_Org_4:0 "Chỉ huy Hiệp đồng Số hóa C4ISR (Cấp IV)"
 VPA_Naval_Org_4_desc:0 "Mạng lưới truyền tin tác chiến số hóa bảo đảm chỉ huy thông suốt và đồng bộ từ Bộ Tư lệnh tới từng biên đội tàu cơ động."
 VPA_Maritime_MDA_1:0 "Cảnh giới Duyên hải (Cấp I)"
 VPA_Maritime_MDA_1_desc:0 "Mạng lưới radar trinh sát tầm xa duyên hải cung cấp tham số mục tiêu mặt biển chuẩn xác cho các lực lượng tác chiến."
 VPA_Maritime_MDA_2:0 "Trinh sát Thủy âm Dưới nước (Cấp II)"
 VPA_Maritime_MDA_2_desc:0 "Hệ thống sonar cố định và cơ động nâng cao khả năng phát hiện tàu ngầm và mối đe dọa ngầm dưới lòng biển."
 VPA_Maritime_MDA_3:0 "Hiệp đồng An ninh Biển đảo (Cấp III)"
 VPA_Maritime_MDA_3_desc:0 "Phối hợp chia sẻ dữ liệu mục tiêu nhịp nhàng giữa Hải quân, Cảnh sát biển, Kiểm ngư và Hải đội Dân quân."
 VPA_Maritime_MDA_4:0 "Nhận thức Biển Thống nhất MDA (Capstone)"
 VPA_Maritime_MDA_4_desc:0 "Bức tranh tình huống biển toàn cảnh thời gian thực, liên kết dữ liệu trinh sát đa tầng giúp dẫn đường tên lửa chính xác."
 VPA_Naval_Logistics_1:0 "Hạ tầng Quân cảng Căn cứ (Cấp I)"
 VPA_Naval_Logistics_1_desc:0 "Quân cảng Cam Ranh, Hải Phòng và các căn cứ duyên hải bảo đảm điều kiện neo đậu, bảo quản và tiếp tế cơ bản."
 VPA_Naval_Logistics_2:0 "Đại tu Kỹ thuật Nội địa (Cấp II)"
 VPA_Naval_Logistics_2_desc:0 "Năng lực tự chủ kiểm định và sửa chữa lớn tàu thuyền trong nước, duy trì hệ số kỹ thuật cao cho hạm đội."
 VPA_Naval_Logistics_3:0 "Bảo đảm Hậu cần Biển đảo (Cấp III)"
 VPA_Naval_Logistics_3_desc:0 "Tuyến vận tải tiếp tế và dự trữ nước ngọt, lương thực, nhiên liệu bảo đảm hoạt động thường trực tại Trường Sa và DK1."
 VPA_Naval_Logistics_4:0 "Đội tàu Hỗ trợ & Cứu nạn (Cấp IV)"
 VPA_Naval_Logistics_4_desc:0 "Tàu cứu nạn chuyên dụng Yết Kiêu và tàu hậu cần đa năng bảo đảm sự an toàn và sức bền chiến đấu của hạm đội."
 VPA_Naval_Logistics_5:0 "Bám biển Trường kỳ Viễn dương (Capstone)"
 VPA_Naval_Logistics_5_desc:0 "Khả năng tiếp tế cơ động trên biển (RAS) giúp biên đội duy trì hiện diện thường trực dài ngày ở các vùng biển xa."
 VPA_Naval_Industry_1:0 "Công nghiệp Đóng tàu Quân sự (Cấp I)"
 VPA_Naval_Industry_1_desc:0 "Đầu tư nâng cấp các nhà máy Ba Son, Hồng Hà, Sông Thu, nâng cao năng lực đóng mới và sửa chữa tàu vỏ thép."
 VPA_Naval_Industry_2:0 "Chuyển giao Công nghệ Tàu chiến (Cấp II)"
 VPA_Naval_Industry_2_desc:0 "Làm chủ quy trình công nghệ chế tạo tàu tên lửa tấn công nhanh Molniya Project 1241.8 theo tiêu chuẩn quốc tế."
 VPA_Naval_Industry_3:0 "Làm chủ Hệ thống Hạm tàu CMS (Cấp III)"
 VPA_Naval_Industry_3_desc:0 "Tự chủ thiết kế thân vỏ, tích hợp radar dẫn bắn và hệ thống điều khiển chỉ huy chiến đấu hạm tàu CMS."
 VPA_Naval_Industry_4:0 "Tự chủ Đóng tàu Hộ vệ Đa năng (Capstone)"
 VPA_Naval_Industry_4_desc:0 "Năng lực công nghiệp hoàn thiện cho phép tự chủ đóng mới tàu hộ vệ săn ngầm thế hệ mới do Việt Nam thiết kế."
 VIE_nav_surface_fleet_readiness:0 "Sẵn sàng Chiến đấu Tàu mặt nước"
 VIE_nav_surface_fleet_readiness_desc:0 "Các lữ đoàn tàu tuần tiễu duy trì trạng thái ứng trực chiến đấu 100%, sẵn sàng xuất kích bảo vệ chủ quyền."
 VIE_nav_asw_mastery:0 "Năng lực Chống ngầm Toàn diện"
 VIE_nav_asw_mastery_desc:0 "Hiệp đồng chặt chẽ giữa tàu hộ vệ và trực thăng săn ngầm Ka-28, kiểm soát hoàn toàn các mối đe dọa dưới nước."
 VIE_nav_marine_brigades:0 "Lữ đoàn Hải quân Đánh bộ Tinh nhuệ"
 VIE_nav_marine_brigades_desc:0 "Lực lượng Hải quân đánh bộ 101 và 147 được huấn luyện cơ động cao, thiện chiến trong tác chiến đảo và đổ bộ."
 VPA_Integrated_Defense_Doctrine_1:0 "Phòng thủ Biển Tích hợp (Giai đoạn I)"
 VPA_Integrated_Defense_Doctrine_1_desc:0 "Xây dựng tuyến phòng thủ bờ biển chiều sâu, kết hợp trận địa tên lửa cơ động và chốt chặn đảo."
 VPA_Integrated_Defense_Doctrine_Capstone:0 "Lưới lửa Phòng thủ Bờ - Đảo (Capstone P)"
 VPA_Integrated_Defense_Doctrine_Capstone_desc:0 "Hệ thống A2/AD hoàn chỉnh: tên lửa bờ Bastion-P, tàu ngầm Kilo và công sự đảo tạo thành lá chắn bất khả xâm phạm."
 VPA_Fleet_Development_Priority:0 "Định hướng Phát triển Hạm đội"
 VPA_Fleet_Development_Priority_desc:0 "Ưu tiên đầu tư trang bị các lớp tàu chiến đấu mặt nước đa nhiệm có tầm hoạt động lớn và hỏa lực mạnh."
 VPA_Multirole_Task_Groups:0 "Biên đội Tác chiến Đa nhiệm Hạm đội"
 VPA_Multirole_Task_Groups_desc:0 "Biên đội khinh hạm hộ vệ kết hợp tàu tên lửa và tàu bảo đảm có khả năng độc lập tác chiến trên biển."
 VPA_Greenwater_Doctrine_1:0 "Hải quân Biển gần Hiện đại (Green-water I)"
 VPA_Greenwater_Doctrine_1_desc:0 "Hạm đội mặt nước cơ động và lực lượng săn ngầm làm chủ hoàn toàn vùng biển đặc quyền kinh tế và thềm lục địa."
 VPA_Greenwater_Doctrine_Capstone:0 "Hải quân Biển gần Tự chủ (Capstone G)"
 VPA_Greenwater_Doctrine_Capstone_desc:0 "Hạm đội Green-water hoàn thiện, bảo vệ trọn vẹn 200 hải lý vùng đặc quyền kinh tế và các tuyến đảo chủ quyền."
 VPA_Bluewater_Doctrine_1:0 "Chương trình Hải quân Biển xa (Blue-water I)"
 VPA_Bluewater_Doctrine_1_desc:0 "Đặt nền móng kỹ thuật và hậu cần để đưa hạm đội vươn ra các vùng biển quốc tế và bảo vệ các tuyến hàng hải."
 VPA_Bluewater_Doctrine_Capstone:0 "Hải quân Biển xa Bền vững (Capstone B)"
 VPA_Bluewater_Doctrine_Capstone_desc:0 "Hải quân viễn dương có khả năng hiện diện thường trực, bảo vệ lợi ích quốc gia và hợp tác quốc tế trên đại dương."
 VIE_nav_capstone_iron_shield:0 "Hải quân Chính quy: Lá chắn Thép Biển Đông"
 VIE_nav_capstone_iron_shield_desc:0 "Đỉnh cao của thế trận quốc phòng toàn dân trên biển: từng mét bờ cõi và hòn đảo trở thành pháo đài thép kiên cường."
 VIE_nav_capstone_master_of_seas:0 "Hải quân Chính quy: Làm chủ Vùng biển Chủ quyền"
 VIE_nav_capstone_master_of_seas_desc:0 "Đỉnh cao của hạm đội cơ động hiện đại: làm chủ tuyệt đối vùng biển chủ quyền với sức mạnh tác chiến tinh nhuệ."
 VIE_nav_capstone_ocean_surge:0 "Hải quân Chính quy: Hùng cường Vươn khơi Đại dương"
 VIE_nav_capstone_ocean_surge_desc:0 "Đỉnh cao của hạm đội viễn dương: tự tin vươn ra biển lớn, bảo vệ chủ quyền và lợi ích quốc gia trên các đại dương."
 VIE_nav_shipbuilding_mastery:0 "Tự chủ Công nghiệp Đóng tàu Chiến lược"
 VIE_nav_shipbuilding_mastery_desc:0 "Nền công nghiệp đóng tàu quân sự tự chủ hoàn toàn, đủ sức đóng mới và bảo dưỡng mọi lớp tàu chiến đấu."
 VIE_decision_molniya_surge_spirit:0 "Cao trào Sản xuất Tàu tên lửa Molniya"
 VIE_decision_molniya_surge_spirit_desc:0 "Đẩy nhanh tiến độ đóng mới và bàn giao loạt tàu tên lửa tấn công nhanh Project 1241.8 trong nước."
 VIE_decision_gepard_fleet_spirit:0 "Nâng cấp Khinh hạm Gepard 3.9"
 VIE_decision_gepard_fleet_spirit_desc:0 "Tối ưu hóa khả năng tác chiến và tự vệ của các biên đội khinh hạm tàng hình Đinh Tiên Hoàng, Quang Trung."
 VIE_decision_kilo_sustainment_spirit:0 "Duy tu Kỹ thuật Hạm đội Tàu ngầm Kilo"
 VIE_decision_kilo_sustainment_spirit_desc:0 "Bảo dưỡng chuyên sâu nâng cao độ tĩnh âm và khả năng tác chiến bí mật của 6 tàu ngầm diesel-điện 636.1."
 VIE_decision_domestic_corvette_construction_spirit:0 "Khởi đóng Tàu hộ vệ Sông Thu Dẫn đầu"
 VIE_decision_domestic_corvette_construction_spirit_desc:0 "Dự án đóng mới tàu hộ vệ săn ngầm thế hệ mới tại Đà Nẵng đang được tập trung toàn bộ nguồn lực."
 VIE_decision_island_bastion_spirit:0 "Kiên cố hóa Pháo đài Quần đảo Trường Sa"
 VIE_decision_island_bastion_spirit_desc:0 "Tăng cường năng lực phòng thủ công sự và khả năng chống trả tập kích đường không, đổ bộ đường biển tại các đảo."
 VIE_decision_asw_combat_drill_spirit:0 "Diễn tập Tác chiến Chống ngầm Hạm đội"
 VIE_decision_asw_combat_drill_spirit_desc:0 "Đợt tập trận săn ngầm liên vùng nâng cao khả năng phát hiện và tiêu diệt tàu ngầm đối phương."
 VIE_decision_coastal_alert_surge_spirit:0 "Báo động Tác chiến Toàn tuyến Duyên hải"
 VIE_decision_coastal_alert_surge_spirit_desc:0 "Toàn bộ các trận địa pháo, tên lửa bờ biển và công sự đảo chuyển sang trạng thái sẵn sàng chiến đấu cao nhất."

### ============================================================
### QUYẾT ĐỊNH & CHIẾN DỊCH HẢI QUÂN V34
### ============================================================

 VIE_naval_procurement_category:0 "Chương trình Mua sắm & Phát triển Hải quân"
 VIE_naval_procurement_category_desc:0 "Các dự án đầu tư đóng mới, tiếp nhận tàu chiến và kiên cố hóa hạ tầng quốc phòng biển đảo của Hải quân nhân dân Việt Nam."
 VIE_decision_molniya_production_run:0 "Sản xuất Loạt Tàu tên lửa Molniya"
 VIE_decision_molniya_production_run_desc:0 "Cấp ngân sách đóng mới loạt tàu tên lửa tấn công nhanh đề án 1241.8 Molniya trong nước."
 VIE_decision_gepard_batch_procurement:0 "Tiếp nhận Khinh hạm Gepard 3.9"
 VIE_decision_gepard_batch_procurement_desc:0 "Ký kết hợp đồng tiếp nhận và bảo đảm kỹ thuật cho các khinh hạm tàng hình đa nhiệm lớp Gepard 3.9."
 VIE_decision_kilo_submarine_sustainment:0 "Bảo đảm Kỹ thuật Hạm đội Kilo 636.1"
 VIE_decision_kilo_submarine_sustainment_desc:0 "Đầu tư gói bảo dưỡng định kỳ và đại tu trang thiết bị điện tử, vũ khí cho 6 tàu ngầm Kilo."
 VIE_decision_domestic_corvette_lead_ship:0 "Khởi đóng Tàu hộ vệ Đa năng Nội địa"
 VIE_decision_domestic_corvette_lead_ship_desc:0 "Khởi động dự án đóng mới chiếc tàu hộ vệ săn ngầm dẫn đầu tại Nhà máy Đóng tàu Sông Thu."
 VIE_decision_island_bastion_fortification:0 "Kiên cố hóa Trận địa Biển đảo"
 VIE_decision_island_bastion_fortification_desc:0 "Đầu tư xây dựng thêm công sự pháo bờ biển và hầm ngầm kiên cố tại các thực thể đảo tiền tiêu."
 VIE_decision_scs_joint_patrol_mission:0 "Tuần tra Liên hợp Vùng biển Chủ quyền"
 VIE_decision_scs_joint_patrol_mission_desc:0 "Triển khai các biên đội tuần tra phối hợp bảo vệ an ninh ngư trường và chủ quyền vùng biển."
 VIE_decision_asw_combat_drill:0 "Diễn tập Hiệp đồng Chống ngầm Hạm đội"
 VIE_decision_asw_combat_drill_desc:0 "Tổ chức đợt huấn luyện thực binh săn ngầm giữa khinh hạm Gepard và trực thăng Ka-28."
 VIE_decision_coastal_alert_surge:0 "Kích hoạt Báo động Phòng thủ Duyên hải"
 VIE_decision_coastal_alert_surge_desc:0 "Chuyển trạng thái sẵn sàng chiến đấu cao cho toàn bộ hệ thống tên lửa bờ và công sự đảo."


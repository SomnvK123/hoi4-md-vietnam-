 ### Hải quân
 ### Không quân

 ### Idea của các hướng phát triển binh chủng
 VIE_expeditionary_idea:0 "Học thuyết cơ động"
 VIE_expeditionary_idea_desc:0 "Lực lượng nhẹ, nhanh, sẵn sàng hoạt động xa căn cứ và tiếp nhận quân tình nguyện, đổi lại phòng thủ tại chỗ kém hơn."
 VIE_iron_triangle_idea:0 "Tam giác thép"
 VIE_iron_triangle_idea_desc:0 "Công sự, hậu cần và dự bị kết hợp thành một lá chắn vững chắc."
 VIE_blue_water_idea:0 "Hạm đội viễn dương"
 VIE_blue_water_idea_desc:0 "Tầm hoạt động xa, hỏa lực mạnh, nhưng đầu tư vào bờ biển bị bỏ lại phía sau."
 VIE_sea_control_idea:0 "Kiểm soát vùng biển"
 VIE_sea_control_idea_desc:0 "Tàu, tàu ngầm và thủy lôi phối hợp chặt, đặc biệt vào ban đêm."
 VIE_full_spectrum_idea:0 "Không quân toàn phổ"
 VIE_full_spectrum_idea_desc:0 "Ưu thế trên không, khả năng tác chiến ban đêm và tầm hoạt động xa, đồng thời yểm trợ lục quân."

 ### Dynamic modifier và tooltip
 VIE_armed_forces_modifier:0 "Quân đội Nhân dân Việt Nam"

 ### Chuyên mục Quyết định Quân sự
 VIE_military_readiness_category:0 "Sẵn sàng Chiến đấu & Diễn tập Quân đội"
 VIE_military_readiness_category_desc:0 "Kế hoạch nâng cao khả năng sẵn sàng tác chiến, các đợt diễn tập quân khu thường niên, tuần tra duyên hải và tập dượt hiệp đồng quân binh chủng của Quân đội Nhân dân Việt Nam."

 ### Cờ Điều kiện Tiên quyết Quốc gia
 VIE_indochina_open:0 "Đã mở rộng Hợp tác Đông Dương"
 VIE_apec_year:0 "Năm Đăng cai Diễn đàn APEC"
 VIE_tariff_negotiating:0 "Đang trong Tiến trình Đàm phán Thuế quan"

  # Ideas Localisation
  VIE_189th_submarine_brigade_spirit:0 "Lữ đoàn Tàu ngầm 189 'Hố đen Đại dương'"
  VIE_189th_submarine_brigade_spirit_desc:0 "Đơn vị tác chiến ngầm tinh nhuệ làm chủ tàu ngầm Kilo 636.1, sẵn sàng phục kích bí mật bảo vệ vùng biển."
  VIE_162nd_frigate_brigade_spirit:0 "Lữ đoàn Khinh hạm 162 'Hạm đội Thép'"
  VIE_162nd_frigate_brigade_spirit_desc:0 "Lực lượng tàu chiến mặt nước hiện đại nhất của Hải quân nhân dân Việt Nam, bảo đảm an ninh trên các tuyến biển xa."
  VIE_naval_weapons_integration_spirit:0 "Tích hợp Vũ khí Diệt hạm Uran-E & VCM-01"
  VIE_naval_weapons_integration_spirit_desc:0 "Khả năng làm chủ và tích hợp đạn tên lửa diệt hạm siêu thanh và đạn hành trình tầm xa lên tàu chiến."
  VIE_island_fortress_spirit:0 "Thế trận Pháo đài Trường Sa & Nhà giàn DK1"
  VIE_island_fortress_spirit_desc:0 "Hệ thống công sự kiên cố trên các đảo và nhà giàn bảo đảm khả năng trụ bám và phòng ngự kiên cường."
  VIE_undersea_warfare_network_spirit:0 "Mạng lưới Tác chiến Biển ngầm Hiệp đồng"
  VIE_undersea_warfare_network_spirit_desc:0 "Phối hợp giữa tàu ngầm, bãi mìn thông minh và đòn đánh tên lửa hành trình Club-S."
  VIE_coastal_a2ad_shield_spirit:0 "Lưới lửa Bờ đối hải Bastion-P A2/AD"
  VIE_coastal_a2ad_shield_spirit_desc:0 "Chiếc ô phòng thủ bờ biển tầm xa ngăn chặn mọi mưu toan tiếp cận bờ biển của hạm đội đối phương."
  VIE_marine_infantry_readiness_spirit:0 "Hải quân Đánh bộ Sẵn sàng Chiến đấu"
  VIE_marine_infantry_readiness_spirit_desc:0 "Khả năng phản ứng nhanh đổ bộ chiếm đảo và phòng ngự giữ vững hải đảo."
  VIE_subsurface_steel_wall_spirit:0 "Lũy thép Tác chiến Biển ngầm"
  VIE_subsurface_steel_wall_spirit_desc:0 "Mạng lưới phong tỏa ngầm ngăn chặn mọi sự xâm nhập dưới lòng biển."
  VIE_island_fleet_defense_spirit:0 "Hiệp đồng Phòng thủ Đảo - Hạm đội"
  VIE_island_fleet_defense_spirit_desc:0 "Thế trận liên hoàn kết hợp hỏa lực đảo và tính cơ động của hạm đội tàu chiến."
  VIE_doctrine_asymmetric_sea_denial_spirit:0 "Học thuyết Khước từ Biển Bất đối xứng"
  VIE_doctrine_asymmetric_sea_denial_spirit_desc:0 "Biến vùng biển thành vùng cấm đối với đối phương bằng sức mạnh răn đe ngầm và tên lửa siêu thanh."
  VIE_doctrine_active_maritime_presence_spirit:0 "Học thuyết Làm chủ Vùng biển Đặc quyền"
  VIE_doctrine_active_maritime_presence_spirit_desc:0 "Duy trì sự hiện diện thường trực bảo vệ các quyền chủ quyền và thềm lục địa của Việt Nam."
  VIE_eastern_sea_sovereignty_capstone_spirit:0 "Chủ quyền Biển đảo Thiêng liêng"
  VIE_eastern_sea_sovereignty_capstone_spirit_desc:0 "Khẳng định trọn vẹn chủ quyền biển đảo, thềm lục địa và lợi ích kinh tế biển của quốc gia."
  VIE_naval_technical_cooperation:0 "Hợp tác Kỹ thuật Hải quân Việt - Nga"

  # ======================================================================
  # HẢI QUÂN NHÂN DÂN VIỆT NAM (ORGANIC DIAMOND FLOW - 25 FOCUS)
  # ======================================================================
  VIE_nav_maritime_strategy_21st:0 "Chiến lược Biển Việt Nam Thế kỷ 21"
  VIE_nav_maritime_strategy_21st_desc:0 "Đề ra đường lối hiện đại hóa Hải quân nhân dân Việt Nam tiến thẳng lên hiện đại, xác định biển đảo là không gian sinh tồn chiến lược và phên dậu bảo vệ Tổ quốc."
  VIE_nav_maritime_strategy_21st_tt:0 "§GKhởi động lộ trình hiện đại hóa hạm đội và nâng cấp năng lực tác chiến biển.§!"

  VIE_nav_russian_naval_partnership:0 "Hợp tác Kỹ thuật Hải quân Việt - Nga"
  VIE_nav_russian_naval_partnership_desc:0 "Ký kết các hiệp định hợp tác chiến lược toàn diện với Liên bang Nga về chuyển giao khí tài hải quân hiện đại, bảo đảm kỹ thuật và đào tạo kíp chiến đấu."
  VIE_nav_russian_naval_partnership_tt:0 "§GThiết lập cầu nối kỹ thuật mua sắm và chuyển giao công nghệ tàu ngầm và khinh hạm.§!"

  VIE_nav_bason_shipbuilding_core:0 "Hiện đại hóa Tổ hợp Đóng tàu Ba Son"
  VIE_nav_bason_shipbuilding_core_desc:0 "Đầu tư mở rộng và hiện đại hóa Tổng công ty Ba Son và các nhà máy X51, tạo nền tảng công nghiệp tự chủ sửa chữa và đóng mới tàu quân sự vỏ thép trong nước."
  VIE_nav_bason_shipbuilding_core_tt:0 "§GMở rộng hạ tầng xưởng đóng tàu quân sự tại Nhà Bè và TP. Hồ Chí Minh.§!"

  VIE_nav_kilo_submarine_procurement:0 "Đề án Hạm đội Tàu ngầm Kilo 636.1"
  VIE_nav_kilo_submarine_procurement_desc:0 "Ký hợp đồng lịch sử mua 6 tàu ngầm điện-diesel thế hệ 3 đề án 636.1 Varshavyanka ('Hố đen đại dương'), mở ra kỷ nguyên tác chiến ngầm bảo vệ vùng biển Việt Nam."
  VIE_nav_kilo_submarine_procurement_tt:0 "§GNhận thưởng nghiên cứu tàu ngầm và chuẩn bị thành lập đơn vị tác chiến ngầm.§!"

  VIE_nav_gepard_frigate_procurement:0 "Đề án Khinh hạm Tàng hình Gepard 3.9"
  VIE_nav_gepard_frigate_procurement_desc:0 "Trang bị các tàu hộ vệ tên lửa tàng hình lớp Gepard 3.9 (Đinh Tiên Hoàng, Lý Thái Tổ, Trần Hưng Đạo, Quang Trung) với khả năng tác chiến mặt nước và săn ngầm tầm xa."
  VIE_nav_gepard_frigate_procurement_tt:0 "§GNhận thưởng nghiên cứu khinh hạm và khu trục hạm hiện đại.§!"

  VIE_nav_molniya_fast_attack_craft:0 "Đóng tàu Tên lửa Tấn công nhanh Molniya"
  VIE_nav_molniya_fast_attack_craft_desc:0 "Tiếp nhận chuyển giao bản quyền đóng loạt tàu tên lửa tấn công nhanh Project 1241.8 Molniya trang bị 16 tên lửa Uran-E tại Nhà máy Ba Son."
  VIE_nav_molniya_fast_attack_craft_tt:0 "§GNâng cấp hiệu suất xưởng đóng tàu nội địa lên cấp độ 2.§!"

  VIE_nav_cam_ranh_naval_base:0 "Căn cứ Chiến lược Quân cảng Cam Ranh"
  VIE_nav_cam_ranh_naval_base_desc:0 "Xây dựng và nâng cấp Vịnh Cam Ranh thành quân cảng nước sâu hiện đại hàng đầu khu vực, căn cứ mẹ vững chắc cho hạm đội tàu ngầm và tàu mặt nước chủ lực."
  VIE_nav_cam_ranh_naval_base_tt:0 "§GNâng cấp quân cảng Cam Ranh và tăng cường năng lực tiếp vận hạm đội.§!"

  VIE_nav_189th_submarine_brigade:0 "Thành lập Lữ đoàn Tàu ngầm 189"
  VIE_nav_189th_submarine_brigade_desc:0 "Chính thức thành lập Lữ đoàn Tàu ngầm 189 tại Cam Ranh, làm chủ vũ khí kỹ thuật, đào tạo thủy thủ ngầm tinh nhuệ và xây dựng trung tâm huấn luyện mô phỏng hiện đại."
  VIE_nav_189th_submarine_brigade_tt:0 "§GTăng cường khả năng ẩn mình và sức tấn công của hạm đội tàu ngầm.§!"

  VIE_nav_clubs_cruise_missiles:0 "Tên lửa Hành trình Tấn công ngầm Club-S"
  VIE_nav_clubs_cruise_missiles_desc:0 "Trang bị đạn tên lửa hành trình diệt hạm siêu thanh 3M-54E và đạn tấn công mục tiêu mặt đất 3M-14E cho tàu ngầm Kilo, tạo năng lực răn đe chiến lược tầm xa."
  VIE_nav_clubs_cruise_missiles_tt:0 "§GNâng cao sức mạnh hỏa lực tên lửa hành trình của hải quân.§!"

  VIE_nav_162nd_frigate_brigade:0 "Lữ đoàn Tàu chiến Mặt nước 162"
  VIE_nav_162nd_frigate_brigade_desc:0 "Xây dựng Lữ đoàn 162 ('Lữ đoàn thép') thành nắm đấm cơ động mặt nước tinh nhuệ của Vùng 4 Hải quân, tổ chức huấn luyện tác chiến hiệp đồng bảo vệ Trường Sa."
  VIE_nav_162nd_frigate_brigade_tt:0 "§GTăng cường hiệu quả hộ tống và năng lực phòng không hạm đội.§!"

  VIE_nav_naval_aviation_ka28:0 "Không quân Hải quân & Trực thăng Săn ngầm"
  VIE_nav_naval_aviation_ka28_desc:0 "Biên chế các phi đội trực thăng săn ngầm Ka-28/Ka-32 cất cánh từ sàn đáp Gepard, kết hợp phi đội tuần thám biển mở rộng bán kính phát hiện mục tiêu dưới ngầm."
  VIE_nav_naval_aviation_ka28_tt:0 "§GNhận điểm kinh nghiệm không quân và mở rộng trinh sát săn ngầm.§!"

  VIE_nav_uran_e_integration:0 "Tích hợp Tên lửa Diệt hạm Uran-E & VCM-01"
  VIE_nav_uran_e_integration_desc:0 "Tự chủ tích hợp hệ thống điều khiển hỏa lực tên lửa Uran-E lên tàu chiến và nghiên cứu phát triển thế hệ tên lửa hành trình diệt hạm VCM-01 do Việt Nam tự chế tạo."
  VIE_nav_uran_e_integration_tt:0 "§GTăng cường năng lực tích hợp vũ khí và xác suất bắn trúng mục tiêu biển.§!"

  VIE_nav_domestic_patrol_craft:0 "Đóng mới Tàu pháo TT-400TP & Tuần tra"
  VIE_nav_domestic_patrol_craft_desc:0 "Đẩy mạnh dây chuyền tự thiết kế và đóng mới các tàu pháo tuần tra TT-400TP, tàu tuần tra cao tốc phục vụ tuần tra vùng biển ven bờ và cửa vịnh."
  VIE_nav_domestic_patrol_craft_tt:0 "§GBổ sung dockyard và tăng cường tốc độ đóng tàu tuần tra.§!"

  VIE_nav_submarine_rescue_logistics:0 "Tàu Cứu hộ Yết Kiêu 927 & Tiếp vận Đa năng"
  VIE_nav_submarine_rescue_logistics_desc:0 "Biên chế tàu tìm kiếm cứu nạn tàu ngầm đa năng 927 Yết Kiêu, cùng các tàu bệnh viện Khánh Hòa 01 và tàu vận tải Trường Sa bảo đảm cứu sinh và tiếp vận biển xa."
  VIE_nav_submarine_rescue_logistics_tt:0 "§GNâng cấp năng lực duy trì hạm đội lên mức tối ưu.§!"

  VIE_nav_spratly_dk1_defense_system:0 "Phòng thủ Quần đảo Trường Sa & Nhà giàn DK1"
  VIE_nav_spratly_dk1_defense_system_desc:0 "Kiên cố hóa công sự trận địa trên các đảo thuộc Quần đảo Trường Sa và hệ thống Nhà giàn DK1 trên thềm lục địa phía Nam, xây dựng âu tàu tránh trú bão và điểm tựa hậu cần."
  VIE_nav_spratly_dk1_defense_system_tt:0 "§GXây dựng công sự kiên cố và tăng cường phòng thủ đảo.§!"

  VIE_nav_integrated_undersea_warfare:0 "Mạng lưới Tác chiến Ngầm & Phục kích Biển"
  VIE_nav_integrated_undersea_warfare_desc:0 "Kết hợp hạm đội tàu ngầm Kilo, bãi mìn phong tỏa và tên lửa hành trình Club-S thành mạng lưới tác chiến ngầm hiệp đồng, sẵn sàng tung đòn phục kích bất ngờ."
  VIE_nav_integrated_undersea_warfare_tt:0 "§GTối ưu hóa đòn phục kích ngầm và khả năng phát hiện tàu ngầm đối phương.§!"

  VIE_nav_bastion_a2ad_coastal_shield:0 "Lưới lửa Bờ đối hải Bastion-P & Radar Bờ"
  VIE_nav_bastion_a2ad_coastal_shield_desc:0 "Triển khai các tổ hợp tên lửa bờ siêu thanh cơ động K-300P Bastion-P (Yakhont), Redut và mạng lưới trinh sát radar bờ nhìn vòng tạo nên chiếc ô A2/AD chống tiếp cận bờ biển."
  VIE_nav_bastion_a2ad_coastal_shield_tt:0 "§GThiết lập lưới lửa bờ đối hải siêu thanh bảo vệ toàn dải ven biển.§!"

  VIE_nav_offshore_task_groups:0 "Hải đội Tác chiến Biển xa Vùng đặc quyền"
  VIE_nav_offshore_task_groups_desc:0 "Hình thành các biên đội tàu hỗn hợp hộ vệ, tên lửa, cứu hộ và tiếp tế có khả năng tác chiến dài ngày và độc lập tại các vùng biển xa thuộc vùng đặc quyền kinh tế 200 hải lý."
  VIE_nav_offshore_task_groups_tt:0 "§GNâng cấp Sẵn sàng Chiến đấu Hải quân lên Cấp độ 2.§!"

  VIE_nav_c4isr_maritime_domain_awareness:0 "Hệ thống C4ISR & Nhận thức Không gian Biển"
  VIE_nav_c4isr_maritime_domain_awareness_desc:0 "Kết nối dữ liệu từ vệ tinh viễn thám Vinasat/VNREDSat, radar đối hải tầm xa và máy bay tuần thám biển vào hệ thống chỉ huy chỉ thị mục tiêu thời gian thực cho toàn quân chủng."
  VIE_nav_c4isr_maritime_domain_awareness_tt:0 "§GNâng cấp năng lực trinh sát phát hiện mặt nước và điều phối hiệp đồng hạm đội.§!"

  VIE_nav_naval_infantry_and_sappers:0 "Hải quân Đánh bộ & Đặc công Nước Đổ bộ Đảo"
  VIE_nav_naval_infantry_and_sappers_desc:0 "Hiện đại hóa Lữ đoàn 147, 101 Hải quân Đánh bộ và các đơn vị Đặc công nước tinh nhuệ, huấn luyện tác chiến đổ bộ đường biển, tái chiếm và phòng thủ đảo kiên cường."
  VIE_nav_naval_infantry_and_sappers_tt:0 "§GTăng cường phòng ngự đổ bộ và rút ngắn thời gian chuẩn bị tấn công đường biển.§!"

  VIE_nav_subsurface_steel_wall:0 "Thế trận Lũy thép Biển ngầm"
  VIE_nav_subsurface_steel_wall_desc:0 "Quy hoạch các vùng tuần tra phục kích ngầm bí mật, thiết lập mạng lưới cảm biến âm học đáy biển và thủy lôi thông minh bảo vệ các tuyến luồng hàng hải huyết mạch."
  VIE_nav_subsurface_steel_wall_tt:0 "§GHoàn thiện năng lực tác chiến ngầm trước ngưỡng cửa học thuyết chiến lược.§!"

  VIE_nav_integrated_island_fleet_defense:0 "Phòng thủ Đảo - Bờ - Hạm đội Liên hoàn"
  VIE_nav_integrated_island_fleet_defense_desc:0 "Tổ chức thế trận tác chiến liên hoàn giữa hỏa lực pháo - tên lửa trên các đảo, biên đội tàu cơ động mặt nước và các trận địa tên lửa bờ lục địa."
  VIE_nav_integrated_island_fleet_defense_tt:0 "§GTối đa hóa hiệu quả bảo vệ đảo và cự ly hoạt động của biên đội tàu.§!"

  VIE_nav_doctrine_asymmetric_sea_denial:0 "Học thuyết Khước từ Biển Bất đối xứng"
  VIE_nav_doctrine_asymmetric_sea_denial_desc:0 "Lựa chọn chiến lược tập trung nguồn lực vào tác chiến phi đối xứng: biến vùng biển thành tử địa đối với kẻ thù bằng đòn đánh ngầm tàng hình, mìn biển và tên lửa bờ siêu thanh."
  VIE_nav_doctrine_asymmetric_sea_denial_tt:0 "§G§YTẬP TRUNG HỌC THUYẾT:§! Tối đa hóa sức mạnh tàu ngầm, phục kích bí mật và cấm biển đối phương."

  VIE_nav_doctrine_active_maritime_presence:0 "Học thuyết Làm chủ Vùng biển Đặc quyền"
  VIE_nav_doctrine_active_maritime_presence_desc:0 "Lựa chọn chiến lược hiện diện chủ động: duy trì hải đội cơ động mặt nước tuần tra thường trực, làm chủ vùng biển đặc quyền kinh tế, bảo vệ tài nguyên dầu khí và tuyến giao thương quốc tế."
  VIE_nav_doctrine_active_maritime_presence_tt:0 "§G§YTẬP TRUNG HỌC THUYẾT:§! Tối đa hóa sức mạnh tàu mặt nước, tầm hoạt động hạm đội và hộ tống đường biển."

  VIE_nav_capstone_eastern_sea_sovereignty:0 "Giữ vững Chủ quyền Biển đảo Tổ quốc"
  VIE_nav_capstone_eastern_sea_sovereignty_desc:0 "Hội tụ tối thượng sức mạnh quốc phòng toàn dân trên biển: khẳng định chủ quyền toàn vẹn không thể tranh cãi trên thềm lục địa và hai quần đảo Hoàng Sa, Trường Sa thiêng liêng của Tổ quốc."
  VIE_nav_capstone_eastern_sea_sovereignty_tt:0 "§G§TĐỈNH CAO HẢI QUÂN:§! Nâng cấp Sẵn sàng Chiến đấu Hải quân lên Cấp 3 và khẳng định vững chắc chủ quyền biển đảo."

  # Ideas Localisation
  VIE_189th_submarine_brigade_spirit:0 "Lữ đoàn Tàu ngầm 189 'Hố đen Đại dương'"
  VIE_189th_submarine_brigade_spirit_desc:0 "Đơn vị tác chiến ngầm tinh nhuệ làm chủ tàu ngầm Kilo 636.1, sẵn sàng phục kích bí mật bảo vệ vùng biển."
  VIE_162nd_frigate_brigade_spirit:0 "Lữ đoàn Khinh hạm 162 'Hạm đội Thép'"
  VIE_162nd_frigate_brigade_spirit_desc:0 "Lực lượng tàu chiến mặt nước hiện đại nhất của Hải quân nhân dân Việt Nam, bảo đảm an ninh trên các tuyến biển xa."
  VIE_naval_weapons_integration_spirit:0 "Tích hợp Vũ khí Diệt hạm Uran-E & VCM-01"
  VIE_naval_weapons_integration_spirit_desc:0 "Khả năng làm chủ và tích hợp đạn tên lửa diệt hạm siêu thanh và đạn hành trình tầm xa lên tàu chiến."
  VIE_island_fortress_spirit:0 "Thế trận Pháo đài Trường Sa & Nhà giàn DK1"
  VIE_island_fortress_spirit_desc:0 "Hệ thống công sự kiên cố trên các đảo và nhà giàn bảo đảm khả năng trụ bám và phòng ngự kiên cường."
  VIE_undersea_warfare_network_spirit:0 "Mạng lưới Tác chiến Biển ngầm Hiệp đồng"
  VIE_undersea_warfare_network_spirit_desc:0 "Phối hợp giữa tàu ngầm, bãi mìn thông minh và đòn đánh tên lửa hành trình Club-S."
  VIE_coastal_a2ad_shield_spirit:0 "Lưới lửa Bờ đối hải Bastion-P A2/AD"
  VIE_coastal_a2ad_shield_spirit_desc:0 "Chiếc ô phòng thủ bờ biển tầm xa ngăn chặn mọi mưu toan tiếp cận bờ biển của hạm đội đối phương."
  VIE_marine_infantry_readiness_spirit:0 "Hải quân Đánh bộ Sẵn sàng Chiến đấu"
  VIE_marine_infantry_readiness_spirit_desc:0 "Khả năng phản ứng nhanh đổ bộ chiếm đảo và phòng ngự giữ vững hải đảo."
  VIE_subsurface_steel_wall_spirit:0 "Lũy thép Tác chiến Biển ngầm"
  VIE_subsurface_steel_wall_spirit_desc:0 "Mạng lưới phong tỏa ngầm ngăn chặn mọi sự xâm nhập dưới lòng biển."
  VIE_island_fleet_defense_spirit:0 "Hiệp đồng Phòng thủ Đảo - Hạm đội"
  VIE_island_fleet_defense_spirit_desc:0 "Thế trận liên hoàn kết hợp hỏa lực đảo và tính cơ động của hạm đội tàu chiến."
  VIE_doctrine_asymmetric_sea_denial_spirit:0 "Học thuyết Khước từ Biển Bất đối xứng"
  VIE_doctrine_asymmetric_sea_denial_spirit_desc:0 "Biến vùng biển thành vùng cấm đối với đối phương bằng sức mạnh răn đe ngầm và tên lửa siêu thanh."
  VIE_doctrine_active_maritime_presence_spirit:0 "Học thuyết Làm chủ Vùng biển Đặc quyền"
  VIE_doctrine_active_maritime_presence_spirit_desc:0 "Duy trì sự hiện diện thường trực bảo vệ các quyền chủ quyền và thềm lục địa của Việt Nam."
  VIE_eastern_sea_sovereignty_capstone_spirit:0 "Chủ quyền Biển đảo Thiêng liêng"
  VIE_eastern_sea_sovereignty_capstone_spirit_desc:0 "Khẳng định trọn vẹn chủ quyền biển đảo, thềm lục địa và lợi ích kinh tế biển của quốc gia."
  VIE_naval_technical_cooperation:0 "Hợp tác Kỹ thuật Hải quân Việt - Nga"
# Naval Readiness & Base Spirits
  VPA_Naval_Readiness_1:0 "Sẵn sàng Chiến đấu Hải quân Cấp 1"
  VPA_Naval_Readiness_1_desc:0 "Các hải đội ven bờ bước đầu củng cố kỷ luật thao diễn và nâng cao mức độ sẵn sàng trực ban bảo vệ chủ quyền."
  VPA_Naval_Readiness_2:0 "Sẵn sàng Chiến đấu Hải quân Cấp 2"
  VPA_Naval_Readiness_2_desc:0 "Nâng cấp năng lực hiệp đồng tác chiến biên đội, mở rộng tuần tra tác chiến thường trực trên các vùng biển trọng điểm."
  VPA_Naval_Readiness_3:0 "Sẵn sàng Chiến đấu Toàn diện Hải quân Cấp 3"
  VPA_Naval_Readiness_3_desc:0 "Quân chủng Hải quân làm chủ khí tài hiện đại, hiệp đồng tác chiến ngầm - mặt nước - không hải đạt chuẩn tối ưu."

  VIE_naval_shipbuilding_spirit:0 "Năng lực Đóng tàu Quân sự Ba Son"
  VIE_naval_shipbuilding_spirit_desc:0 "Đẩy mạnh công nghiệp đóng mới và sửa chữa tàu chiến vỏ thép tại Tổng công ty Ba Son và nhà máy X51."
  VIE_naval_shipbuilding_spirit_2:0 "Tổ hợp Đóng tàu Chiến lược Ba Son"
  VIE_naval_shipbuilding_spirit_2_desc:0 "Làm chủ hoàn toàn dây chuyền đóng tàu tên lửa cao tốc và tích hợp vũ khí khí tài phức tạp trong nước."

  VIE_fleet_sustainment_spirit:0 "Bảo đảm Hậu cần Quân cảng Cam Ranh"
  VIE_fleet_sustainment_spirit_desc:0 "Thiết lập căn cứ bảo đảm kỹ thuật, nhiên liệu và hậu cần nước sâu cho các biên đội tàu chiến Vùng 4."
  VIE_fleet_sustainment_spirit_2:0 "Hệ thống Tiếp vận Hạm đội Biển xa"
  VIE_fleet_sustainment_spirit_2_desc:0 "Đội ngũ tàu tìm kiếm cứu nạn tàu ngầm và vận tải đa năng bảo đảm hải trình tác chiến xa bờ dài ngày."

  VIE_maritime_domain_awareness_spirit_2:0 "Hệ thống Nhận thức Không gian Biển Tích hợp"
  VIE_maritime_domain_awareness_spirit_2_desc:0 "Mạng lưới kết nối radar bờ, vệ tinh trinh sát và cảm biến hạm đội cung cấp bức tranh tác chiến thời gian thực."

# SECTION: VIE_md_vi_digital_l_english.yml
# ====================================================================

 # --- Nhanh Internet / So: 4 focus moi ---
 VIE_mobile_3g_4g:0 "Mạng di động 3G và 4G"
 VIE_mobile_3g_4g_desc:0 "Tháng 8/2009 Bộ Thông tin và Truyền thông cấp giấy phép 3G cho Viettel, VNPT (VinaPhone, MobiFone) và liên danh EVN Telecom - Hanoi Telecom; dịch vụ thương mại bắt đầu từ cuối năm 2009, mở đường cho internet di động đại chúng. Tháng 10/2016 Viettel, VNPT, MobiFone và GTEL được cấp phép 4G trên băng tần 1800 MHz."
 VIE_submarine_cables:0 "Cáp quang biển và an ninh mạng"
 VIE_submarine_cables_desc:0 "Các tuyến cáp quang biển quốc tế, nổi bật là AAG, nhiều lần bị đứt từ cuối năm 2013 (năm 2014 đứt hai lần, năm 2015 bốn sự cố), kéo theo gián đoạn internet quốc tế kéo dài nhiều tuần. Việt Nam đầu tư thêm tuyến cáp mới, đa dạng hóa hướng kết nối và tăng cường bảo vệ hạ tầng mạng lõi."
 VIE_make_in_vietnam:0 "Make in Vietnam"
 VIE_make_in_vietnam_desc:0 "Ngày 9/5/2019 Bộ trưởng Bộ Thông tin và Truyền thông Nguyễn Mạnh Hùng phát động chiến dịch 'Make in Vietnam', kêu gọi doanh nghiệp công nghệ trong nước làm chủ thiết kế, đổi mới và sản xuất. Tháng 1/2020 cuộc gọi 5G đầu tiên được thực hiện trên thiết bị do Viettel tự nghiên cứu và sản xuất."
 VIE_digital_tech_industry_law:0 "Luật Công nghiệp Công nghệ số"
 VIE_digital_tech_industry_law_desc:0 "Quốc hội thông qua Luật Công nghiệp Công nghệ số (Luật số 71/2025/QH15, ngày 14/6/2025, hiệu lực từ 1/1/2026), lần đầu đặt công nghiệp bán dẫn, trí tuệ nhân tạo, tài sản số và công nghiệp nội dung số trong một khuôn khổ pháp lý riêng, kèm các ưu đãi cho doanh nghiệp công nghệ."


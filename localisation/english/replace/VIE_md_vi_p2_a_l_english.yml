l_english:

 ### Phase 2 ideas (generated)
 VIE_rule_of_law_idea:0 "Nhà nước pháp quyền xã hội chủ nghĩa"
 VIE_rule_of_law_idea_desc:0 "Hiến pháp 2013 và một loạt bộ luật mới làm cho hành vi của nhà nước dễ đoán hơn."
 VIE_party_discipline_idea:0 "Lò"
 VIE_party_discipline_idea_desc:0 "Một chiến dịch bền bỉ chống tham nhũng trong Đảng và nhà nước đã làm rung chuyển giới chính trị."
 VIE_official_caution:0 "Cán bộ chọn cách an toàn"
 VIE_official_caution_desc:0 "Nỗi sợ bị điều tra khiến cán bộ chậm ký duyệt các dự án."
 VIE_streamlined_state_idea:0 "Bộ máy nhà nước tinh gọn"
 VIE_streamlined_state_idea_desc:0 "Các bộ và cơ quan được sáp nhập và hàng nghìn vị trí bị cắt giảm."
 VIE_reorg_disruption:0 "Xáo trộn do tái cơ cấu"
 VIE_reorg_disruption_desc:0 "Cơ quan sáp nhập, nhân sự chuyển đổi và sự nghiệp bất định làm nhà nước chậm lại một thời gian."
 VIE_provincial_merger_idea:0 "Ít tỉnh hơn, tỉnh lớn hơn"
 VIE_provincial_merger_idea_desc:0 "Sáu mươi ba tỉnh thành ba mươi bốn và cấp huyện bị bãi bỏ."
 VIE_era_of_rising_idea:0 "Kỷ nguyên vươn mình của dân tộc"
 VIE_era_of_rising_idea_desc:0 "Giới lãnh đạo đề ra một tầm nhìn mới: một nước thu nhập cao vào năm 2045."
 VIE_state_conglomerates_idea:0 "Các tập đoàn kinh tế nhà nước"
 VIE_state_conglomerates_idea_desc:0 "Các tập đoàn nhà nước khổng lồ như Vinashin và PetroVietnam là trụ cột của nền kinh tế, và họ vay rất nhiều."
 VIE_state_debt_overhang:0 "Gánh nặng nợ nhà nước"
 VIE_state_debt_overhang_desc:0 "Các khoản vay xấu cho các tập đoàn nhà nước đè nặng lên ngân hàng và tài chính công."
 VIE_petrovietnam_idea:0 "Mở rộng PetroVietnam"
 VIE_petrovietnam_idea_desc:0 "Các lô ngoài khơi và nhà máy lọc dầu làm tăng nguồn thu của nhà nước."
 VIE_private_champions_idea:0 "Các tập đoàn tư nhân quốc gia"
 VIE_private_champions_idea_desc:0 "Các tập đoàn tư nhân lớn đầu tư vào bất động sản, ô tô, bán lẻ và công nghệ."
 VIE_expressway_idea:0 "Đường cao tốc Bắc - Nam"
 VIE_expressway_idea_desc:0 "Một tuyến cao tốc liên tục rút ngắn thời gian vận chuyển hàng hóa suốt chiều dài đất nước."
 VIE_cptpp_idea:0 "Thành viên CPTPP"
 VIE_cptpp_idea_desc:0 "Tiếp cận ưu đãi với mười một nền kinh tế Thái Bình Dương, kèm quy tắc chặt hơn về lao động và doanh nghiệp nhà nước."
 VIE_evfta_idea:0 "Hiệp định Thương mại Tự do với EU"
 VIE_evfta_idea_desc:0 "Thuế đối với phần lớn hàng hóa buôn bán với Liên minh châu Âu được xóa dần trong mười năm."
 VIE_semiconductor_idea:0 "Tham vọng chip và AI"
 VIE_semiconductor_idea_desc:0 "Các nhà máy đóng gói, công ty thiết kế và trung tâm dữ liệu là bước khởi đầu của ngành bán dẫn trong nước."
 VIE_nq57_68_idea:0 "Nghị quyết đột phá 57 và 68"
 VIE_nq57_68_idea_desc:0 "Khoa học công nghệ và khu vực tư nhân được xác định là động lực chính của tăng trưởng."
 VIE_nuclear_program_idea:0 "Chương trình điện hạt nhân"
 VIE_nuclear_program_idea_desc:0 "Hai lò phản ứng ở Ninh Thuận hứa hẹn nguồn điện nền ổn định và một lực lượng kỹ thuật mới."
 VIE_net_zero_idea:0 "Cam kết phát thải ròng bằng 0 vào năm 2050"
 VIE_net_zero_idea_desc:0 "Điện gió, điện mặt trời và nâng cấp lưới điện sẽ được tính vào giá kể từ nay."
 VIE_vpa_modernization_idea:0 "Hiện đại hóa Quân đội Nhân dân"
 VIE_vpa_modernization_idea_desc:0 "Hiện đại hóa có chọn lọc và huấn luyện tốt hơn nâng cao khả năng sẵn sàng của quân đội."
 VIE_bastion_idea:0 "Tổ hợp tên lửa bờ"
 VIE_bastion_idea_desc:0 "Các tổ hợp tên lửa chống hạm cơ động khiến việc đổ bộ vào bờ biển trở nên đắt giá."
 VIE_provincial_defence_idea:0 "Khu vực phòng thủ tỉnh"
 VIE_provincial_defence_idea_desc:0 "Mỗi tỉnh và thành phố tổ chức khu vực phòng thủ riêng, được dân quân và lực lượng dự bị hậu thuẫn."
 VIE_maritime_militia_idea:0 "Dân quân biển"
 VIE_maritime_militia_idea_desc:0 "Ngư dân được huấn luyện và tổ chức để báo cáo và bám biển."
 VIE_spratly_garrison_idea:0 "Các tiền đồn Trường Sa kiên cố"
 VIE_spratly_garrison_idea_desc:0 "Đất được cải tạo và các công trình mới củng cố sự hiện diện của Việt Nam ở quần đảo Trường Sa."
 VIE_four_nos_doctrine_idea:0 "Học thuyết quốc phòng Bốn Không"
 VIE_four_nos_doctrine_idea_desc:0 "Chính sách quốc phòng được xây quanh độc lập, tự chủ và không liên minh."
 VIE_bamboo_diplomacy_idea:0 "Ngoại giao cây tre"
 VIE_bamboo_diplomacy_idea_desc:0 "Vững vàng về nguyên tắc, linh hoạt trong thực tiễn: Hà Nội giữ quan hệ tốt với mọi cường quốc lớn."
 VIE_education_idea:0 "Cải cách giáo dục"
 VIE_education_idea_desc:0 "Các trường đại học và trường nghề nhận nguồn lực mới và quyền tự chủ lớn hơn."
 VIE_universal_health_idea:0 "Bảo hiểm y tế toàn dân"
 VIE_universal_health_idea_desc:0 "Hầu như mọi công dân nay đều có bảo hiểm y tế công."
 VIE_digital_idea:0 "Chuyển đổi số quốc gia"
 VIE_digital_idea_desc:0 "Định danh điện tử, chính phủ điện tử và thanh toán di động lan rộng khắp cả nước."
 VIE_disaster_prep_idea:0 "Phòng chống thiên tai"
 VIE_disaster_prep_idea_desc:0 "Cảnh báo sớm, kế hoạch sơ tán và đê điều vững chắc hơn giảm thiệt hại do bão lũ."
 VIE_high_inflation:0 "Lạm phát cao"
 VIE_high_inflation_desc:0 "Giá cả tăng nhanh hơn tiền lương."
 VIE_bond_overhang:0 "Gánh nặng trái phiếu doanh nghiệp"
 VIE_bond_overhang_desc:0 "Các chủ đầu tư bất động sản chật vật đảo nợ trái phiếu."
 VIE_us_tariff_shock:0 "Cú sốc thuế quan Mỹ"
 VIE_us_tariff_shock_desc:0 "Mức thuế đột ngột đánh vào hàng xuất khẩu sang Hoa Kỳ làm nhà máy và công nhân xáo động."
 VIE_us_tariff_mild:0 "Thỏa thuận thuế quan với Mỹ"
 VIE_us_tariff_mild_desc:0 "Một mức thuế thấp hơn nhưng vẫn đáng kể còn áp lên hàng xuất khẩu sang Hoa Kỳ."
 VIE_sars_outbreak:0 "Nỗi sợ dịch bệnh"
 VIE_sars_outbreak_desc:0 "Một đợt dịch không kiểm soát được đã làm dân chúng hoảng sợ."
 VIE_bird_flu_losses:0 "Thiệt hại gia cầm"
 VIE_bird_flu_losses_desc:0 "Nông dân mất đàn gia cầm vì cúm gia cầm."
 VIE_flood_damage:0 "Thiệt hại do lũ"
 VIE_flood_damage_desc:0 "Đường sá, ruộng đồng và nhà cửa ở các tỉnh miền Trung chìm trong nước."
 VIE_democratic_consolidation:0 "Dân chủ được củng cố"
 VIE_democratic_consolidation_desc:0 "Bầu cử tự do, tòa án và báo chí tự do nay là một phần của sinh hoạt chính trị thường ngày."
 VIE_democratic_transition_idea:0 "Nỗi đau chuyển đổi"
 VIE_democratic_transition_idea_desc:0 "Những quyền tự do mới kéo theo xung đột mới, và trật tự cũ vẫn còn người bảo vệ."
 VIE_china_orbit_idea:0 "Trong quỹ đạo Trung Quốc"
 VIE_china_orbit_idea_desc:0 "Quan hệ kinh tế và chính trị gần gũi hơn với Bắc Kinh mang lại vốn nhưng phải trả giá bằng một phần độc lập."
 VIE_bri_idea:0 "Các dự án Vành đai và Con đường"
 VIE_bri_idea_desc:0 "Đường sắt và cảng do Trung Quốc tài trợ đẩy nhanh xây dựng và làm tăng nợ."
 VIE_socialist_bloc_idea:0 "Đoàn kết xã hội chủ nghĩa"
 VIE_socialist_bloc_idea_desc:0 "Phối hợp chặt chẽ hơn với Trung Quốc và các nước xã hội chủ nghĩa khác."
 VIE_west_alignment_idea:0 "Liên kết với phương Tây"
 VIE_west_alignment_idea_desc:0 "Quan hệ gần gũi hơn với Washington và các đối tác mở ra thị trường và công nghệ."
 VIE_us_defence_idea:0 "Hợp tác quốc phòng với Mỹ"
 VIE_us_defence_idea_desc:0 "Huấn luyện và trang bị của Mỹ nâng cao tiêu chuẩn của các lực lượng vũ trang."
 VIE_china_pressure_idea:0 "Sức ép kinh tế của Trung Quốc"
 VIE_china_pressure_idea_desc:0 "Bắc Kinh làm chậm hải quan, cấm du khách và cắt nguồn cung."
 VIE_indochina_idea:0 "Đoàn kết Đông Dương"
 VIE_indochina_idea_desc:0 "Việt Nam, Lào và Campuchia phối hợp chính sách chặt chẽ hơn."
 VIE_import_shock_idea:0 "Cú sốc nhập khẩu"
 VIE_import_shock_idea_desc:0 "Thiếu linh kiện và hàng tiêu dùng gây thiệt hại cho nhà máy và hộ gia đình."
 VIE_yugoslav_model_idea:0 "Mô hình xã hội chủ nghĩa độc lập"
 VIE_yugoslav_model_idea_desc:0 "Thử nghiệm đã trụ vững: một nhà nước xã hội chủ nghĩa độc lập, không liên kết."
 VIE_civil_unrest_idea:0 "Bất ổn dân sự"
 VIE_civil_unrest_idea_desc:0 "Đình công và biểu tình làm gián đoạn công việc ở các vùng bị ảnh hưởng."
 VIE_security_state_idea:0 "Nhà nước an ninh"
 VIE_security_state_idea_desc:0 "Bộ máy an ninh nằm ở trung tâm chính quyền."
 VIE_surveillance_idea:0 "Mạng lưới giám sát"
 VIE_surveillance_idea_desc:0 "Camera, mật báo viên và hệ thống dữ liệu theo dõi mọi điều quan trọng."
 VIE_security_economy_idea:0 "Kinh tế an ninh"
 VIE_security_economy_idea_desc:0 "Các ngành chiến lược trước hết được đánh giá theo giá trị đối với an ninh."
 VIE_sez_idea:0 "Đặc khu kinh tế"
 VIE_sez_idea_desc:0 "Ba đặc khu ven biển vận hành theo quy tắc riêng thân thiện với nhà đầu tư."
 VIE_sez_unrest_idea:0 "Biểu tình phản đối cho thuê đất"
 VIE_sez_unrest_idea_desc:0 "Đám đông biểu tình phản đối việc cho nhà đầu tư nước ngoài thuê đất."
 VIE_bubble_burst_idea:0 "Sụp đổ bất động sản"
 VIE_bubble_burst_idea_desc:0 "Bong bóng đã vỡ và ngân hàng cùng chủ nhà đang chật vật."
 VIE_bubble_burst_mild_idea:0 "Thị trường bất động sản hạ nhiệt"
 VIE_bubble_burst_mild_idea_desc:0 "Một đợt giảm tốc có quản lý giữ thiệt hại ở mức hạn chế."
 VIE_post_collapse_idea:0 "Tái thiết sau chiến tranh"
 VIE_post_collapse_idea_desc:0 "Thành phố, đường sá và lòng tin đều phải được xây lại."
 VIE_public_admin_idea:0 "Cải cách hành chính"
 VIE_public_admin_idea_desc:0 "Cơ chế một cửa và thủ tục rõ ràng hơn giảm giấy tờ mà người dân và doanh nghiệp phải làm."
 VIE_clean_cadres_idea:0 "Đội ngũ cán bộ trong sạch"
 VIE_clean_cadres_idea_desc:0 "Kê khai tài sản, kiểm toán và thanh tra đã biến sự liêm chính thành một phần sự nghiệp của cán bộ."
 VIE_two_tier_gov_idea:0 "Chính quyền địa phương hai cấp"
 VIE_two_tier_gov_idea_desc:0 "Khi cấp huyện không còn, quyết định đi nhanh hơn giữa tỉnh và xã."
 VIE_bank_health_idea:0 "Bảng cân đối ngân hàng lành mạnh hơn"
 VIE_bank_health_idea_desc:0 "Nợ xấu đã được chuyển sang công ty quản lý tài sản và các ngân hàng vững vàng hơn."
 VIE_investment_grade_idea:0 "Xếp hạng tín nhiệm đầu tư"
 VIE_investment_grade_idea_desc:0 "Các hãng xếp hạng đánh giá đất nước là nơi an toàn cho vốn dài hạn."
 VIE_rice_power_idea:0 "Nước xuất khẩu gạo và cà phê"
 VIE_rice_power_idea_desc:0 "Nông dân nuôi cả nước và bán ra thế giới, và an ninh lương thực là điều hiển nhiên."
 VIE_shared_future_idea:0 "Cộng đồng chia sẻ tương lai"
 VIE_shared_future_idea_desc:0 "Hà Nội và Bắc Kinh định khung quan hệ bằng một công thức giữ hòa bình với một cái giá."
 VIE_tourism_idea:0 "Điểm đến hàng đầu châu Á"
 VIE_tourism_idea_desc:0 "Bãi biển, thành phố và di sản đón hàng chục triệu du khách."
 VIE_diaspora_idea:0 "Gắn kết với kiều bào"
 VIE_diaspora_idea_desc:0 "Kiều hối và nhân tài trở về nối đất nước với cộng đồng người Việt ở nước ngoài."
 VIE_developed_nation_idea:0 "Nước phát triển thu nhập cao"
 VIE_developed_nation_idea_desc:0 "Mục tiêu đặt ra năm 2021 đã đạt: Việt Nam là một quốc gia hiện đại, thịnh vượng."
 VIE_export_power_idea:0 "Cường quốc xuất khẩu"
 VIE_export_power_idea_desc:0 "Hàng Việt Nam bán ở hầu hết mọi thị trường, và xuất khẩu có giá trị hơn cả nền kinh tế."
 VIE_manufacturing_hub_idea:0 "Công xưởng Đông Nam Á"
 VIE_manufacturing_hub_idea_desc:0 "Điện tử, may mặc và máy móc được lắp ráp tại đây cho các thương hiệu toàn cầu."
 VIE_private_engine_idea:0 "Kinh tế tư nhân là động lực tăng trưởng"
 VIE_private_engine_idea_desc:0 "Doanh nghiệp tư nhân được xác định là động lực quan trọng nhất của nền kinh tế."
 VIE_hydro_idea:0 "Xương sống thủy điện"
 VIE_hydro_idea_desc:0 "Các đập Sơn La và Hòa Bình cung cấp điện rẻ, ổn định cho miền Bắc."
 VIE_power_plan_idea:0 "Quy hoạch Điện VIII"
 VIE_power_plan_idea_desc:0 "Một kế hoạch dài hạn cân bằng khí, năng lượng tái tạo, nhập khẩu và lưới điện truyền tải chúng."
 VIE_ports_idea:0 "Cảng nước sâu"
 VIE_ports_idea_desc:0 "Lạch Huyện ở phía Bắc và Cái Mép ở phía Nam đón được những tàu container lớn nhất."
 VIE_peoples_defence_idea:0 "Quốc phòng toàn dân"
 VIE_peoples_defence_idea_desc:0 "Mọi công dân và mọi cấp chính quyền đều có phần trong quốc phòng."
 VIE_law_of_sea_idea:0 "Luật Biển"
 VIE_law_of_sea_idea_desc:0 "Yêu sách biển của Việt Nam được ghi vào luật quốc gia và được viện dẫn trong mọi tranh chấp."
 VIE_coast_guard_idea:0 "Cảnh sát biển hiện đại"
 VIE_coast_guard_idea_desc:0 "Luật trao cho cảnh sát biển quyền hạn rõ ràng và một đội tàu tuần tra mới."
 VIE_partner_network_idea:0 "Mạng lưới đối tác"
 VIE_partner_network_idea_desc:0 "Quan hệ với châu Á, châu Âu, vùng Vịnh và Nam Bán cầu khiến không đối tác nào là không thể thiếu."
 VIE_reserve_force_idea:0 "Lực lượng dự bị được huấn luyện"
 VIE_reserve_force_idea_desc:0 "Một lực lượng dự bị gồm công dân được huấn luyện có thể được gọi nhanh để tăng cường quân chính quy."
 VIE_cam_ranh_idea:0 "Cảng quốc tế Cam Ranh"
 VIE_cam_ranh_idea_desc:0 "Tàu chiến và tàu buôn của nhiều nước ghé Cam Ranh. Không lá cờ nào có căn cứ."
 VIE_air_dominance_idea:0 "Làm chủ bầu trời ven biển"
 VIE_air_dominance_idea_desc:0 "Chiến đấu cơ, radar và tên lửa cùng bao phủ bờ biển và các đảo ngoài khơi."
 VIE_english_idea:0 "Tiếng Anh là ngoại ngữ thứ hai"
 VIE_english_idea_desc:0 "Trường học dạy bằng hai ngôn ngữ và sinh viên tốt nghiệp làm việc dễ dàng với các công ty nước ngoài."
 VIE_preventive_health_idea:0 "Y tế dự phòng"
 VIE_preventive_health_idea_desc:0 "Sàng lọc, tiêm chủng và các trạm y tế bắt bệnh trước khi lây lan."
 VIE_digital_nation_idea:0 "Quốc gia số"
 VIE_digital_nation_idea_desc:0 "Chính phủ, ngân hàng và cửa hàng cùng chạy trên một nền tảng số, và gần như ai cũng trực tuyến."
 VIE_science_breakthrough_idea:0 "Đột phá khoa học và công nghệ"
 VIE_science_breakthrough_idea_desc:0 "Nghị quyết 57 đặt nghiên cứu, kỹ năng số và đổi mới sáng tạo lên hàng đầu trong ngân sách."
 VIE_chip_sector_idea:0 "Ngành sản xuất chip"

l_english:
 VIE_navy_lhd_program:0 "Tàu Đổ bộ Trực thăng (LHD)"
 VIE_navy_lhd_program_desc:0 "Mô hình Dokdo của Hàn Quốc: một tàu đổ bộ trực thăng phục vụ tiếp tế Trường Sa, cứu trợ thiên tai và vận chuyển Lữ đoàn Hải quân Đánh bộ. Không cần từ bỏ ”Bốn Không”."
 VIE_navy_drone_carrier:0 "Tàu mang UAV (mô hình Anadolu)"
 VIE_navy_drone_carrier_desc:0 "Thổ Nhĩ Kỳ chuyển TCG Anadolu thành tàu mang UAV sau khi bị loại khỏi chương trình F-35 (2019). Một lối đi rẻ hơn tàu sân bay: mang UAV trinh sát và tấn công thay vì máy bay có người lái."
 VIE_carrier_ex_russian:0 "Cải hoán Tàu sân bay từ Nga"
 VIE_carrier_ex_russian_desc:0 "Mô hình Vikramaditya của Ấn Độ: mua và cải hoán một tàu cũ. Rẻ nhất trong 3 lựa chọn, nhưng rủi ro trễ hạn và đội chi phí (tiền lệ Vikramaditya trễ nhiều năm)."
 VIE_carrier_stovl_west:0 "Tàu sân bay STOVL (mô hình Izumo)"
 VIE_carrier_stovl_west_desc:0 "Nhật cải hoán tàu Izumo để mang F-35B. Việt Nam đi theo hướng nhẹ hơn: trực thăng và UAV cất/hạ cánh thẳng đứng, tương thích chuẩn Mỹ/Nhật."
 VIE_carrier_domestic:0 "Tự đóng Tàu sân bay trong nước"
 VIE_carrier_domestic_desc:0 "Đóng tại Ba Son/Sông Thu với hỗ trợ kỹ thuật nước ngoài. Chậm và đắt nhất trong 3 lựa chọn, nhưng không phụ thuộc nguồn cung bên ngoài."
 VIE_carrier_air_wing:0 "Không đoàn trên Hạm"
 VIE_carrier_air_wing_desc:0 "Biên chế phi đội cho tàu sân bay: chiến đấu cơ hải quân nếu theo nguồn Nga, trực thăng/UAV nếu theo nguồn phương Tây hoặc trong nước."
 VIE_navy_ssn_lease:0 "Thuê Tàu ngầm Hạt nhân"
 VIE_navy_ssn_lease_desc:0 "Mô hình INS Chakra: Ấn Độ thuê tàu ngầm hạt nhân tấn công Akula của Nga 10 năm (2012-2021). Việt Nam có thêm một tàu ngầm hạt nhân trong biên chế mà không cần tự chế tạo."
 VIE_navy_cam_ranh_access:0 "Mở Cam Ranh cho Đối tác Quốc tế"
 VIE_navy_cam_ranh_access_desc:0 "Cảng Quốc tế Cam Ranh mở cửa cho tàu nước ngoài từ 2016. Đi xa hơn: chọn một đối tác chiến lược được luân phiên/thường trực sử dụng dịch vụ hậu cần."
 VIE_army_hadr_task_force:0 "Lực lượng Cứu hộ Quốc tế"
 VIE_army_hadr_task_force_desc:0 "Tiếp nối các đợt cứu trợ thật: động đất Thổ Nhĩ Kỳ (2/2023), động đất Myanmar (3/2025). Thành lập một lực lượng cứu hộ - cứu nạn sẵn sàng triển khai quốc tế."
 VIE_army_pk_battalion:0 "Tiểu đoàn Gìn giữ Hòa bình LHQ"
 VIE_army_pk_battalion_desc:0 "Bước tiếp theo sau bệnh viện dã chiến cấp 2 (Nam Sudan, từ 2018) và đội công binh (Abyei, từ 2022): gửi một tiểu đoàn bộ binh tham gia gìn giữ hòa bình."
 VIE_army_asean_peace_force:0 "Lực lượng Gìn giữ Hòa bình ASEAN"
 VIE_army_asean_peace_force_desc:0 "Tham gia một khung lực lượng gìn giữ hòa bình khu vực dưới bảo trợ ASEAN/LHQ, giữ nguyên ”Bốn Không”."
 VIE_army_northern_contingency:0 "Kế hoạch Tác chiến Biên giới phía Bắc"
 VIE_army_northern_contingency_desc:0 "Rút kinh nghiệm từ Chiến tranh biên giới 1979 và mặt trận Vị Xuyên (1984-1989): củng cố công sự và trận địa phòng thủ dọc biên giới phía Bắc. Vẫn giữ ”Bốn Không”."
 VIE_army_total_defence:0 "Tổng Động viên Thời chiến"
 VIE_army_total_defence_desc:0 "Luật động viên toàn quốc khi có chiến tranh hoặc căng thẳng cực độ: mở rộng quân số nhanh, đổi lấy gánh nặng kinh tế và ổn định."
 VIE_navy_blue_water:0 "Hải quân Vùng biển xa"
 VIE_navy_blue_water_desc:0 "Vượt ra ngoài chiến lược chống tiếp cận ven bờ: xây dựng một hải quân có khả năng hoạt động xa bờ, hộ tống và bảo vệ tuyến hàng hải."
 VIE_navy_light_carrier:0 "Chương trình Tàu sân bay"
 VIE_navy_light_carrier_desc:0 "Sau LHD và tàu mang UAV, bước tiếp theo là một tàu sân bay thực thụ — với cái giá duy trì không nhỏ (xem thanh ”Sẵn sàng Hạm đội xa bờ”)."
 VIE_navy_spratly_fleet:0 "Hạm đội Biển Đông"
 VIE_army_exp_hubs:0 "Hỗ trợ An ninh Đông Dương theo Lời mời"
 VIE_carrier_source_russia:0 "Nguồn tàu sân bay: Nga"
 VIE_carrier_source_west:0 "Nguồn tàu sân bay: Phương Tây"
 VIE_carrier_source_domestic:0 "Nguồn tàu sân bay: Trong nước"
 VIE_carrier_fleet_category:0 "Hạm đội Xa bờ"
 VIE_carrier_fleet_category_desc:0 "Vận hành và duy trì hạm đội tàu sân bay/LHD: bảo dưỡng, diễn tập, tuần tra Trường Sa."
 VIE_overseas_mission_category:0 "Nhiệm vụ Ngoài Lãnh thổ"
 VIE_overseas_mission_category_desc:0 "Các nhiệm vụ gìn giữ hòa bình, cứu trợ và hỗ trợ an ninh ngoài lãnh thổ."
 VIE_carrier_maintenance:0 "Chi Bảo dưỡng Định kỳ"
 VIE_carrier_maintenance_desc:0 "Tăng chỉ số Sẵn sàng Hạm đội xa bờ."
 VIE_carrier_overseas_exercise:0 "Diễn tập Vượt Đại dương"
 VIE_carrier_overseas_exercise_desc:0 "Diễn tập xa bờ dài ngày, tăng kinh nghiệm hải quân."
 VIE_spratly_patrol:0 "Tuần tra Trường Sa bằng Nhóm Tác chiến"
 VIE_spratly_patrol_desc:0 "Điều nhóm tác chiến tàu sân bay/LHD tuần tra Trường Sa."
 VIE_port_visit_friendship:0 "Chuyến thăm Cảng Hữu nghị"
 VIE_port_visit_friendship_desc:0 "Cải thiện quan hệ với các đối tác khu vực."
 VIE_carrier_layup:0 "Niêm cất Tàu sân bay"
 VIE_carrier_layup_desc:0 "Cho tàu nằm cảng, gỡ bỏ hậu quả của tình trạng thiếu bảo dưỡng."
 VIE_carrier_overhaul:0 "Đại tu Tàu sân bay"
 VIE_carrier_overhaul_desc:0 "Đại tu toàn diện, khôi phục sẵn sàng gần như hoàn toàn."
 VIE_un_mission_south_sudan:0 "Nhận Nhiệm vụ LHQ tại Nam Sudan"
 VIE_un_mission_south_sudan_desc:0 "Tiếp nối bệnh viện dã chiến cấp 2 đã triển khai từ 2018."
 VIE_hadr_deployment:0 "Triển khai Cứu trợ Thiên tai Khu vực"
 VIE_hadr_deployment_desc:0 "Cử lực lượng cứu hộ hỗ trợ một nước trong khu vực đang gặp thiên tai."
 VIE_security_assistance_deployment:0 "Triển khai Hỗ trợ An ninh"
 VIE_security_assistance_deployment_desc:0 "Cử lực lượng hỗ trợ an ninh cho Lào hoặc Campuchia theo lời mời."
 VIE_withdraw_overseas_forces:0 "Rút Toàn bộ Lực lượng Ngoài Lãnh thổ"
 VIE_withdraw_overseas_forces_desc:0 "Rút quân có trật tự, theo tiền lệ rút khỏi Campuchia năm 1989."
 VIE_carrier_upkeep:0 "Chi phí Duy trì Hạm đội"
 VIE_carrier_upkeep_desc:0 "Một hạm đội tàu sân bay tốn kém để vận hành liên tục."
 VIE_carrier_idle:0 "Hạm đội Nằm cảng"
 VIE_carrier_idle_desc:0 "Thiếu bảo dưỡng, hạm đội gần như không thể ra khơi (tiền lệ Chakri Naruebet)."
 VIE_hadr_idea:0 "Sẵn sàng Cứu hộ Quốc tế"
 VIE_hadr_idea_desc:0 "Đội ngũ cứu hộ đã có kinh nghiệm triển khai quốc tế."
 vie_mil.1.t:0 "Cải hoán Trễ hạn"
 vie_mil.1.d:0 "Việc cải hoán tàu sân bay từ Nga đang chậm tiến độ, giống tiền lệ Vikramaditya của Ấn Độ."
 vie_mil.1.a:0 "Trả thêm chi phí để đẩy nhanh"
 vie_mil.1.b:0 "Chấp nhận trễ hạn"
 vie_mil.2.t:0 "Bẫy Chakri Naruebet"
 vie_mil.2.d:0 "Thiếu ngân sách bảo dưỡng, hạm đội gần như nằm cảng suốt — đúng số phận của tàu sân bay Thái Lan HTMS Chakri Naruebet."
 vie_mil.2.a:0 "Cấp ngân sách khẩn cấp"
 vie_mil.2.b:0 "Cho hạm đội nằm cảng"
 vie_mil.3.t:0 "Bắc Kinh Phản ứng"
 vie_mil.3.d:0 "Hạm đội Biển Đông ra khơi tuần tra khiến Bắc Kinh phản ứng gay gắt."
 vie_mil.3.a:0 "Giữ vững lập trường"
 vie_mil.3.b:0 "Xuống thang căng thẳng"
 vie_mil.6.t:0 "Chọn Đối tác cho Cam Ranh"
 vie_mil.6.d:0 "Cảng Quốc tế Cam Ranh mở cửa — chọn đối tác chiến lược nào được ưu tiên sử dụng dịch vụ hậu cần."
 vie_mil.6.a:0 "Nga"
 vie_mil.6.b:0 "Mỹ luân phiên"
 vie_mil.6.c:0 "Ấn Độ"
 vie_mil.12.t:0 "Bóng ma 1979"
 vie_mil.12.d:0 "Việc can thiệp quân sự khu vực gợi lại ký ức về cuộc chiến 1978-1989 tại Campuchia, khiến ASEAN lo ngại."
 vie_mil.12.a:0 "Giải thích tại các diễn đàn ASEAN"
 vie_mil.12.b:0 "Phớt lờ phản ứng"

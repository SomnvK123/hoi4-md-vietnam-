l_english:
 VIE_space_milsat:0 "Chùm Vệ tinh Trinh sát Quân sự"
 VIE_space_milsat_desc:0 "Nối tiếp VNREDSat-1 (2013) và chương trình LOTUSat với Nhật: một chùm vệ tinh quan sát phục vụ trinh sát quân sự, tăng tầm phát hiện cho hải quân và không quân."
 VIE_space_command:0 "Bộ Tư lệnh Không gian"
 VIE_space_command_desc:0 "Thành lập một bộ tư lệnh chuyên trách không gian, theo xu hướng nhiều quốc gia (Nhật Bản, 2020) đã làm."
 VIE_cyber_national_shield:0 "Lá chắn Mạng Quốc gia"
 VIE_cyber_national_shield_desc:0 "Xây dựng năng lực phòng thủ không gian mạng toàn diện, giảm rủi ro bị phá hoại các cơ sở hạ tầng trọng yếu (kể cả cơ sở hạt nhân nếu có)."
 VIE_cyber_active_ops:0 "Tác chiến Mạng Chủ động"
 VIE_cyber_active_ops_desc:0 "Phát triển năng lực tấn công mạng chủ động, đánh đổi rủi ro bị phát hiện và phản ứng ngoại giao."
 VIE_joint_island_defence:0 "Tác chiến Hiệp đồng Bảo vệ Trường Sa"
 VIE_joint_island_defence_desc:0 "Phối hợp đổ bộ, phòng thủ điểm đảo và yểm trợ trên không thành một thế trận thống nhất — có tác dụng dù đi theo học thuyết lịch sử hay các nhánh giả định."
 VIE_joint_integrated_deterrence:0 "Răn đe Thông thường Tích hợp"
 VIE_joint_integrated_deterrence_desc:0 "Kết hợp học thuyết biển (chống tiếp cận hoặc viễn dương) với năng lực tấn công tầm xa và tên lửa quốc gia thành một hệ răn đe tổng thể."
 VIE_joint_nuclear_triad:0 "Bộ ba Răn đe Hạt nhân (giả định cực cao)"
 VIE_joint_nuclear_triad_desc:0 "Kết hợp răn đe hạt nhân tối thiểu với tàu ngầm hạt nhân thuê và năng lực tấn công từ trên không thành một bộ ba răn đe hoàn chỉnh."
 VIE_nuclear_triad_idea:0 "Bộ ba Răn đe Hoàn chỉnh"
 VIE_nuclear_triad_idea_desc:0 "Việt Nam sở hữu một bộ ba răn đe hạt nhân đầy đủ: trên bộ, trên biển và trên không."

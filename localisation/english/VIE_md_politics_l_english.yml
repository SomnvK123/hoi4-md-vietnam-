 # "Con duong Kien dinh" (CPV Hardline). Reform pressure line shown in the VIE_state_modifier tooltip.
 VIE_hl_rp_line_none:0 ""
 VIE_hl_rp_line_1:0 "\n§YÁp lực cải cách:§! §G[?VIE_rp|0]§! (Ổn định)"
 VIE_hl_rp_line_2:0 "\n§YÁp lực cải cách:§! §Y[?VIE_rp|0]§! (Âm ỉ, căng thẳng từ 56)"
 VIE_hl_rp_line_3:0 "\n§YÁp lực cải cách:§! §O[?VIE_rp|0]§! (Căng thẳng, khủng hoảng từ 80)"
 VIE_hl_rp_line_4:0 "\n§YÁp lực cải cách:§! §R[?VIE_rp|0]§! (Khủng hoảng)"

 # Ideas
 VIE_hl_pressure_tense_idea:0 "Bất bình âm ỉ"
 VIE_hl_pressure_tense_idea_desc:0 "Các biện pháp siết chặt đã vượt quá mức xã hội và bộ máy chấp nhận dễ dàng. Phản ứng chưa thành khủng hoảng, nhưng ổn định và năng suất đã chịu ảnh hưởng."
 VIE_hl_pressure_crisis_idea:0 "Khủng hoảng chính danh"
 VIE_hl_pressure_crisis_idea_desc:0 "Áp lực cải cách đã chạm ngưỡng. Nếu không lùi một bước, đường lối hiện hành sẽ phải trả giá nặng về ổn định và tăng trưởng."

 # Debug category and decisions
 VIE_hl_debug_category:0 "Kiên định: gỡ lỗi"
 VIE_hl_debug_category_desc:0 "Chỉ hiện khi chạy game với -debug. Đặt nhanh Áp lực cải cách để thử các ngưỡng."
 VIE_hl_dbg_rp_30:0 "Đặt Áp lực cải cách = 30"
 VIE_hl_dbg_rp_30_desc:0 "Mức Ổn định. Không có idea mức."
 VIE_hl_dbg_rp_60:0 "Đặt Áp lực cải cách = 60"
 VIE_hl_dbg_rp_60_desc:0 "Mức Căng thẳng. Phải có idea Bất bình âm ỉ."
 VIE_hl_dbg_rp_85:0 "Đặt Áp lực cải cách = 85"
 VIE_hl_dbg_rp_85_desc:0 "Mức Khủng hoảng. Phải có idea Khủng hoảng chính danh."
 VIE_hl_dbg_rp_add:0 "Áp lực cải cách +6"
 VIE_hl_dbg_rp_add_desc:0 "Gọi VIE_hl_add_pressure. Kiểm tra kẹp 0-100 và việc tạm dừng giảm tự nhiên 120 ngày."

 # Debug decision: take power at once
 VIE_hl_dbg_take_power:0 "Kiên định: lên nắm quyền ngay"
 VIE_hl_dbg_take_power_desc:0 "Gọi sự kiện Nhận quyền (vie_hl.1). Chỉ để thử."

 # Way B to power: extraordinary Central Committee plenum
 VIE_hl_extraordinary_plenum:0 "Triệu tập Hội nghị Trung ương bất thường"
 VIE_hl_extraordinary_plenum_desc:0 "Trước bối cảnh tình hình biến động và yêu cầu giữ vững bản chất cách mạng của Đảng, triệu tập Hội nghị Trung ương bất thường nhằm chuyển giao quyền lãnh đạo sang cánh Kiên định."

 # Congress options (hardline path / hardline already ruling)
 vie_pol.3.c:0 "Đại hội X khẳng định đường lối Kiên định"
 vie_pol.4.b:0 "Đại hội XI giữ vững ngọn cờ Xã hội Chủ nghĩa"
 vie_pol.4.hl_take:0 "Đại hội XI: Giữ vững bản chất, kiên định mục tiêu"
 vie_pol.5.c:0 "Đại hội XII củng cố chuyên chính vô sản và kỷ luật thép"
 vie_pol.5.hl_take:0 "Đại hội XII: Giữ vững bản chất, kiên định mục tiêu"
 vie_pol.6.hl:0 "Đại hội XIII quyết tâm bảo vệ thành quả cách mạng"
 vie_pol.6.hl_take:0 "Đại hội XIII: Giữ vững bản chất, kiên định mục tiêu"
 vie_pol.8.c:0 "Đại hội XIV bước vào kỷ nguyên kiên định vững chắc"
 vie_pol.8.hl_take:0 "Đại hội XIV: Giữ vững bản chất, kiên định mục tiêu"
 vie_pol.12.hl_keep:0 "Đại hội khẳng định đường lối Kiên định"
 vie_pol.12.hl_take:0 "Đại hội XV: Giữ vững bản chất, kiên định mục tiêu"
 vie_pol.13.hl_keep:0 "Đại hội khẳng định đường lối Kiên định"
 vie_pol.13.hl_take:0 "Đại hội XVI: Giữ vững bản chất, kiên định mục tiêu"

 # vie_hl.1 The conservative line takes power
 vie_hl.1.t:0 "Thống nhất ý chí và hành động"
 vie_hl.1.d:0 "Ban Chấp hành Trung ương đánh giá rằng những khó khăn vừa qua bắt nguồn từ việc để suy giảm bản chất cách mạng của Đảng. Hội nghị thông qua chủ trương ngăn chặn suy thoái về tư tưởng, chính trị, đạo đức, lối sống và \"tự diễn biến, tự chuyển hóa\" trong nội bộ.\n\nĐường lối mới giữ nguyên mục tiêu, nhưng quản chặt hơn về tổ chức và tư tưởng. Cái giá là áp lực cải cách sẽ tích tụ nếu siết quá mức."
 vie_hl.1.a:0 "Con đường Kiên định bắt đầu"

 # ---- Ideas of the focus tree
 VIE_hl_ideology_work_idea:0 "Công tác tư tưởng"
 VIE_hl_ideology_work_idea_desc:0 "Ban Tuyên giáo và hệ thống Học viện được tăng cường, giữ định hướng tư tưởng trong báo chí, giáo dục và đoàn thể."
 VIE_hl_state_leading_idea:0 "Chủ đạo nhà nước"
 VIE_hl_state_leading_idea_desc:0 "Kinh tế nhà nước được khẳng định là then chốt, các tập đoàn và tổng công ty được ưu tiên."
 VIE_hl_state_transition_idea:0 "Chuyển đổi sang chủ đạo nhà nước"
 VIE_hl_state_transition_idea_desc:0 "Việc đặt lại ưu tiên cho khu vực nhà nước tạm thời làm chậm tăng trưởng năng suất."
 VIE_hl_soe_spearhead_idea:0 "Tập đoàn đầu tàu"
 VIE_hl_soe_spearhead_idea_desc:0 "Các tập đoàn nhà nước được giao dẫn dắt dự án lớn về hạ tầng, năng lượng và đóng tàu."
 VIE_hl_fdi_slowdown_idea:0 "FDI chững lại"
 VIE_hl_fdi_slowdown_idea_desc:0 "Danh mục ưu tiên và giám sát dòng vốn khiến dòng vốn ngoại chậm lại."
 VIE_hl_planning_idea:0 "Kế hoạch định hướng"
 VIE_hl_planning_idea_desc:0 "Mục tiêu sản lượng và danh mục dự án quốc gia theo nhiệm kỳ, đổi lại là sự cứng nhắc của kế hoạch."
 VIE_hl_army_party_work_idea:0 "Công tác Đảng, công tác chính trị trong quân đội"
 VIE_hl_army_party_work_idea_desc:0 "Hệ thống chính ủy và Tổng cục Chính trị giữ vai trò trung tâm trong quân đội."
 VIE_hl_all_people_defence_idea:0 "Thế trận toàn dân gắn với Đảng cơ sở"
 VIE_hl_all_people_defence_idea_desc:0 "Tổ chức Đảng cấp cơ sở là trục tổ chức của thế trận quốc phòng toàn dân."
 VIE_hl_cyber_content_idea:0 "Quản lý nội dung mạng"
 VIE_hl_cyber_content_idea_desc:0 "Nội dung 'sai trái, thù địch' trên không gian mạng bị đấu tranh có hệ thống."
 VIE_hl_school_theory_idea:0 "Giáo dục lý luận"
 VIE_hl_school_theory_idea_desc:0 "Thời lượng môn lý luận chính trị tăng lên, bớt đi thời gian cho nghiên cứu."
 VIE_hl_controlled_renewal_idea:0 "Đổi mới có kiểm soát"
 VIE_hl_controlled_renewal_idea_desc:0 "Giữ vững mục tiêu, điều chỉnh phương thức: hội nhập và kinh tế tư nhân tiếp tục trong khuôn khổ."
 VIE_hl_fusion_idea:0 "Nhất thể hóa"
 VIE_hl_fusion_idea_desc:0 "Lãnh đạo Đảng và quản lý Nhà nước hợp nhất ở mọi cấp: ra quyết định nhanh, không còn đối trọng."

 # Tooltips & Ideas
 VIE_hl_indochina_union_tt:0 "Tuyên bố thành lập Liên bang Xã hội Chủ nghĩa Đông Dương, củng cố vị thế chiến lược ba nước."
 VIE_hl_defense_self_reliance_idea:0 "Tự lực Công nghiệp Quốc phòng"
 VIE_hl_defense_self_reliance_idea_desc:0 "Đẩy mạnh năng lực sản xuất của các nhà máy quốc phòng Z-Factory, làm chủ vũ khí bộ binh và trang thiết bị tác chiến, nâng cao hiệu suất quân xưởng và sẵn sàng chiến đấu."
 VIE_hl_indochina_union_idea:0 "Liên bang XHCN Đông Dương"
 VIE_hl_indochina_union_idea_desc:0 "Khối liên kết đặc biệt toàn diện giữa ba nước Đông Dương trên nền tảng Luận cương 1930, tạo nên thế trận phòng thủ và không gian sinh tồn chiến lược vững chắc."
 VIE_hl_unbreakable_fortress_idea:0 "Pháo đài XHCN Bất khả Xâm phạm"
 VIE_hl_unbreakable_fortress_idea_desc:0 "Đỉnh cao của mô hình chuyên chính vô sản kết hợp với quốc phòng toàn dân và công nghiệp hóa XHCN, bảo đảm an ninh chính trị và chủ quyền tối thượng."

 VIE_hl_rp_p1_tt:0 "Áp lực cải cách tăng §R1§!"
 VIE_hl_rp_p2_tt:0 "Áp lực cải cách tăng §R2§!"

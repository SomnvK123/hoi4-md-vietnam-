 VIE_hl_take_power_tt:0 "§YĐảng Cộng sản Việt Nam (Đường lối Kiên định) lên cầm quyền§!, mở cây §YCon đường Kiên định§!"
 VIE_hl_cpv_main_tt:0 "Đảng cầm quyền có ID 19 (CPV)"
 VIE_hl_cpv_main_tt_NOT:0 "Đảng cầm quyền không phải ID 19 (CPV)"

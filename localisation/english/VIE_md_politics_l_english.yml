 ### Events
 vie_disaster.1.t:0 "Siêu bão Biển Đông Đổ bộ Miền Trung & Vịnh Bắc Bộ"
 vie_disaster.1.d:0 "Một siêu bão cuồng phong với sức gió giật trên cấp 16 đang càn quét dọc bờ biển miền Trung và vịnh Bắc Bộ. Mưa lớn xối xả đe dọa gây ngập lụt diện rộng, vỡ đê và sạt lở đất kinh hoàng tại các sườn đồi núi dốc. Toàn bộ chính quyền các cấp đã được đặt vào tình trạng báo động đỏ."
 vie_disaster.1.a:0 "Toàn hệ thống và quân đội vào cuộc - Bảo vệ tính mạng nhân dân là trên hết!"
 vie_disaster.1.b:0 "Tập trung tối đa lực lượng khắc phục sự cố tại các điểm nóng."
 vie_disaster.1.c:0 "Hạ tầng tan hoang, thiệt hại hàng ngàn tỷ đồng..."

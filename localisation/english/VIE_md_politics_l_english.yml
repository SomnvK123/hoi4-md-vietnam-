 ### Ideas
 VIE_non_alignment_policy:0 "Độc lập và Tự chủ"
 VIE_non_alignment_policy_desc:0 "Kể từ thập niên 1990, Hà Nội kiên trì theo đuổi đường lối đối ngoại độc lập, tự chủ, đa phương hóa, đa dạng hóa quan hệ quốc tế và không tham gia bất kỳ liên minh quân sự nào."
 VIE_four_nos:0 "Chính sách Quốc phòng Bốn Không"
 VIE_four_nos_desc:0 "Không tham gia liên minh quân sự; không liên kết với nước này để chống nước kia; không cho nước ngoài đặt căn cứ quân sự hoặc sử dụng lãnh thổ Việt Nam để chống lại nước khác; không sử dụng vũ lực hoặc đe dọa sử dụng vũ lực trong quan hệ quốc tế. Sách trắng Quốc phòng 2019 đã chính thức thể chế hóa học thuyết này."
 VIE_us_bta_idea:0 "Hiệp định Thương mại Song phương Việt - Mỹ (BTA)"
 VIE_us_bta_idea_desc:0 "Cánh cửa tiếp cận thị trường Mỹ đã mở ra cơ hội vàng cho hàng dệt may, thủy hải sản và da giày Việt Nam vươn tới phân khúc khách hàng tiềm năng mới."
 VIE_fdi_zones_idea:0 "Khu Công nghiệp và Thu hút FDI"
 VIE_fdi_zones_idea_desc:0 "Hàng loạt khu công nghiệp xung quanh Hà Nội và TP. Hồ Chí Minh thu hút mạnh mẽ các nhà sản xuất Nhật Bản, Hàn Quốc và Đài Loan."
 VIE_public_anger:0 "Làn sóng Phẫn nộ Dư luận"
 VIE_public_anger_desc:0 "Tinh thần dân tộc dâng cao sau các vụ đối đầu căng thẳng quanh giàn khoan."
 VIE_fdi_confidence_shock:0 "Cú Sốc Niềm tin Nhà đầu tư"
 VIE_fdi_confidence_shock_desc:0 "Các nhà đầu tư nước ngoài đang đánh giá lại mức độ rủi ro sau các vụ gây rối đập phá."

 ### Balance of power: Conservative <-> Reform
 VIE_party_balance:0 "§YĐịnh hướng của Đảng§!"
 VIE_party_balance_desc:0 "Trong nội bộ Đảng, một luồng ý kiến chủ trương thận trọng, giữ vững kỷ luật và đề cao khu vực kinh tế nhà nước; luồng ý kiến còn lại thúc đẩy cải cách thị trường sâu rộng và hội nhập quốc tế. Mọi quyết sách lớn đều tác động đến cán cân này."

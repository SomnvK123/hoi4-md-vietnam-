 ### Category
 VIE_party_balance_category:0 "Quyết sách Định hướng của Đảng"
 VIE_party_balance_category_desc:0 "Các quyết sách điều hành vĩ mô, công tác tư tưởng, tổ chức cán bộ và cơ chế kinh tế nhằm tác động trực tiếp tới Cán cân Định hướng của Đảng."

 ### Group 1: Conservative Decisions (Kiên định Nền tảng)
 VIE_bop_edu_marxism:0 "§C[Kiên định]§! Giáo dục Lý luận Chính trị & Kỷ luật Đảng"
 VIE_bop_edu_marxism_desc:0 "Mở các đợt sinh hoạt chính trị sâu rộng trong toàn Đảng và hệ thống chính trị nhằm nâng cao bản lĩnh tư tưởng, giữ vững lập trường kiên định mục tiêu xã hội chủ nghĩa."

 VIE_bop_inspect_soe:0 "§C[Kiên định]§! Thanh tra Chuyên đề DNNN & Dự án Thua lỗ"
 VIE_bop_inspect_soe_desc:0 "Ủy ban Kiểm tra Trung ương và Thanh tra Chính phủ tiến hành thanh tra toàn diện các dự án trọng điểm, chấn chỉnh tình trạng thất thoát tài sản nhà nước và lợi ích nhóm."

 VIE_bop_appoint_cadres:0 "§C[Kiên định]§! Bố trí Cán bộ An ninh - Vũ trang vào Vị trí Trọng yếu"
 VIE_bop_appoint_cadres_desc:0 "Quy hoạch và điều động các cán bộ có lập trường kiên định, trưởng thành từ lực lượng vũ trang và cơ quan kiểm tra Đảng tham gia cấp ủy và cơ quan điều hành."

 VIE_bop_fund_soe:0 "§C[Kiên định]§! Củng cố Vai trò Chủ đạo của DNNN"
 VIE_bop_fund_soe_desc:0 "Bơm nguồn lực và giao các công trình hạ tầng then chốt cho các Tập đoàn, Tổng công ty Nhà nước để bảo đảm tính tự chủ chiến lược của nền kinh tế."

 VIE_bop_plenum_anticorrupt:0 "§C[Kiên định]§! Hội nghị TW: Chống Tự diễn biến, Tự chuyển hóa"
 VIE_bop_plenum_anticorrupt_desc:0 "Triệu tập Hội nghị Ban Chấp hành Trung ương chuyên đề để thảo luận và ban hành nghị quyết đặc biệt về chỉnh đốn Đảng, ngăn chặn mọi biểu hiện chệch hướng."

 ### Group 2: Reform Decisions (Đổi mới Sâu rộng)
 VIE_bop_private_econ_forum:0 "§G[Đổi mới]§! Diễn đàn Kinh tế Tư nhân & Khởi nghiệp Sáng tạo"
 VIE_bop_private_econ_forum_desc:0 "Tổ chức các diễn đàn cấp cao giữa lãnh đạo chính phủ và cộng đồng doanh nghiệp tư nhân, khẳng định kinh tế tư nhân là động lực quan trọng của nền kinh tế."

 VIE_bop_pci_reform:0 "§G[Đổi mới]§! Cải cách Thủ tục Hành chính & Nâng cao Chỉ số PCI"
 VIE_bop_pci_reform_desc:0 "Cắt giảm điều kiện kinh doanh, đo lường chỉ số hài lòng của người dân và doanh nghiệp, thúc đẩy cạnh tranh lành mạnh giữa các địa phương."

 VIE_bop_technocrat_advisors:0 "§G[Đổi mới]§! Trọng dụng Chuyên gia Kỹ trị & Nhân tài ngoài Đảng"
 VIE_bop_technocrat_advisors_desc:0 "Đưa các nhà khoa học, nhà quản lý kỹ trị và chuyên gia kinh tế có năng lực cao vào các tổ tư vấn chính sách vĩ mô của Chính phủ."

 VIE_bop_equitize_soe:0 "§G[Đổi mới]§! Đẩy mạnh Cổ phần hóa DNNN trên Sàn Chứng khoán"
 VIE_bop_equitize_soe_desc:0 "Thoái vốn nhà nước tại các doanh nghiệp thương mại và dịch vụ thông qua đấu giá công khai, nâng cao tính minh bạch và thu hút dòng vốn phát triển."

 VIE_bop_breakthrough_resol:0 "§G[Đổi mới]§! Nghị quyết Đột phá Thể chế & Hội nhập Toàn diện"
 VIE_bop_breakthrough_resol_desc:0 "Ban hành nghị quyết mang tính bước ngoặt, dỡ bỏ triệt để các rào cản hành chính bao cấp, mở rộng tối đa không gian cho kinh tế thị trường."


 ### Country selection screen (bookmark)
 VIE_MILLENNIUM_DAWN_DESC:0 "14 năm sau khi công cuộc Đổi Mới mở cửa nền kinh tế, Việt Nam trở thành một trong những quốc gia trỗi dậy nhanh nhất châu Á. Tăng trưởng đạt gần 7%, nông dân trở thành các nhà xuất khẩu gạo và cà phê hàng đầu, và một hiệp định thương mại song phương mang tính bước ngoặt với Hoa Kỳ sắp sửa được ký kết. Tuy nhiên, cuộc khủng hoảng tài chính châu Á đã để lại cho các ngân hàng và doanh nghiệp nhà nước gánh nặng nợ xấu, và nội bộ Đảng đang phân hóa giữa sự thận trọng của Tổng Bí thư Lê Khả Phiêu và những người muốn đẩy nhanh cải cách.\n\nĐất nước phải duy trì tăng trưởng mà không đánh mất quyền kiểm soát trong nước, đồng thời cân bằng giữa sức hút từ người láng giềng khổng lồ phương Bắc với ký ức về các cuộc chiến tranh trong quá khứ và mong muốn làm bạn với tất cả các quốc gia. Những lựa chọn trong các thập kỷ tới, tại các kỳ Đại hội Đảng và trên Biển Đông, sẽ quyết định diện mạo của một nước Việt Nam mới."


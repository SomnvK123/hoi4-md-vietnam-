 # Tooltips cho Quyết định Lãnh đạo & Chương trình Nhiệm kỳ
 VIE_tt_req_meeting_disagreements:0 "Không có phiên hiệp thương nào khác đang diễn ra."
 VIE_tt_req_bop_cooldown:0 "Không trong thời gian chờ điều phối cán cân quyền lực (§Y180 ngày§!)."
 VIE_tt_eff_meeting_resolve_start:0 "Bắt đầu tiến trình hiệp thương tháo gỡ bất đồng trong §Y90 ngày§!.\n(Được hoàn trả §G15 Điểm Chính trị§! nếu Độ gắn kết nội bộ dưới §Y20§!)."
 VIE_tt_eff_meeting_resolve_finish:0 "Kết thúc hiệp thương: Khôi phục sự đồng thuận và tăng Độ gắn kết nội bộ (§G+10§!)."
 VIE_tt_req_adopt_dual_role:0 "Cán cân ở vùng §YLãnh đạo Tập trung§! (§Y> 0.25§!) và Độ gắn kết nội bộ đạt từ §Y55 trở lên§!."
 VIE_tt_eff_adopt_dual_role:0 "Thực hiện nhất thể hóa vai trò Tổng Bí thư và Chủ tịch nước:\n • Tập trung đầu mối chỉ đạo tối cao của Đảng và Nhà nước\n • Rút ngắn thời gian ban hành các quyết sách chiến lược liên ngành\n • Tăng chi phí gắn kết nội bộ khi chuyển giao nhiệm kỳ Đại hội"
 VIE_tt_req_split_dual_role:0 "Hiện đang duy trì cơ chế nhất thể hóa chức danh."
 VIE_tt_eff_split_dual_role:0 "Phân định rõ các vị trí lãnh đạo chủ chốt cho từng cá nhân riêng biệt:\n • Tăng cường cơ chế lãnh đạo tập thể và phân công trách nhiệm\n • Giảm áp lực gắn kết nội bộ khi chuyển giao nhiệm kỳ Đại hội"
 VIE_tt_req_side_project:0 "Đã hoàn thành xuất sắc Chương trình trọng điểm nhiệm kỳ và chưa triển khai dự án hỗ trợ bổ sung nào trong nhiệm kỳ này."
 VIE_tt_eff_side_project_start:0 "Bắt đầu triển khai dự án hỗ trợ bổ trợ sau nghiệm thu trong §Y270 ngày§!."
 VIE_tt_eff_side_project_finish:0 "Nhận tinh thần §YHiệu quả dự án bổ trợ§! trong 365 ngày, giảm bớt chi phí vận hành bộ máy."
 VIE_tt_req_select_programme:0 "Chưa có Chương trình trọng điểm nào đang được lựa chọn hoặc triển khai trong nhiệm kỳ này."
 VIE_tt_eff_select_cadre:0 "Xác định trọng tâm nhiệm kỳ: §YTổ chức – Cán bộ§!. Mở khóa các phương thức khởi động chương trình."
 VIE_tt_eff_select_admin:0 "Xác định trọng tâm nhiệm kỳ: §YĐiều hành – Công vụ§!. Mở khóa các phương thức khởi động chương trình."
 VIE_tt_eff_select_inspection:0 "Xác định trọng tâm nhiệm kỳ: §YKiểm tra – Giám sát§!. Mở khóa các phương thức khởi động chương trình."
 VIE_tt_eff_select_social:0 "Xác định trọng tâm nhiệm kỳ: §YDân vận – Xã hội§!. Mở khóa các phương thức khởi động chương trình."
 VIE_tt_req_programme_selected:0 "Đã xác định lĩnh vực trọng tâm cho nhiệm kỳ hiện tại."
 VIE_tt_eff_launch_mode_standard:0 "Khởi động chương trình nhiệm kỳ theo §YTiến độ chuẩn mực§!:\n • Bắt đầu đếm khung thời hạn 900 ngày\n • Chi phí khởi động từ 25 đến 40 Điểm Chính trị tùy theo Bậc Cán bộ và Độ gắn kết nội bộ"
 VIE_tt_req_launch_mode_fast_paid:0 "Đã chọn lĩnh vực trọng tâm và Cán cân ở vùng §YLãnh đạo Tập trung§! (§Y> 0.25§!)."
 VIE_tt_eff_launch_mode_fast_paid:0 "Khởi động cấp tốc qua cơ chế thương lượng:\n • Bắt đầu đếm khung thời hạn 900 ngày\n • Chi phí: §R-25 Điểm Chính trị§!, Ngân khố §R-0.5 tỷ USD§!\n • Cán cân dịch chuyển về phía §YLãnh đạo Tập thể§! (§G-0.10§!)"
 VIE_tt_req_launch_mode_fast_override:0 "Đã chọn lĩnh vực trọng tâm, Cán cân ở vùng §YLãnh đạo Tập trung§! (§Y> 0.25§!) và Độ gắn kết nội bộ §Y> 55§!."
 VIE_tt_eff_launch_mode_fast_override:0 "Khởi động cấp tốc qua quyết sách tập trung:\n • Bắt đầu đếm khung thời hạn 900 ngày\n • Chi phí: §R-25 Điểm Chính trị§!\n • Độ gắn kết nội bộ: §R-16§!\n • Cán cân dịch chuyển mạnh về phía §YLãnh đạo Tập trung§! (§R+0.10§!)"
 VIE_tt_req_review_programme_early:0 "Đã hoàn thành toàn bộ §Y4 mục tiêu trọng tâm§! của chương trình nhiệm kỳ."
 VIE_tt_eff_review_programme_early:0 "Nghiệm thu toàn diện trước thời hạn:\n • Nâng Bậc (Tier) cho lĩnh vực tương ứng lên cấp độ tiếp theo\n • Nhận phần thưởng đột phá chuyên ngành\n • Thưởng hoàn thành sớm: §G+50 Điểm Chính trị§!\n • Độ gắn kết nội bộ: §G+6§!"
 VIE_tt_eff_deadline_mission_eval:0 "Khi hết thời hạn 900 ngày, chương trình sẽ tự động được nghiệm thu theo số lượng mục tiêu đã đạt được:\n • Đạt 4 mục tiêu: Nghiệm thu toàn diện và nâng Bậc\n • Đạt 2 - 3 mục tiêu: Nghiệm thu một phần, nhận gói hỗ trợ chuyển tiếp\n • Dưới 2 mục tiêu: Chương trình dở dang, chịu chế tài hành chính"

 # Events
 vie_pol.1.t:0 "Đại hội Đại biểu Toàn quốc lần thứ IX"
 vie_pol.1.d:0 "Đại hội IX của Đảng khai mạc tại Hà Nội, đề ra chiến lược phát triển kinh tế - xã hội giai đoạn 2001 - 2010, đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước."
 vie_pol.1.a:0 "Nắm vững thời cơ, vượt qua thách thức!"
 vie_pol.2.t:0 "Đại hội Đại biểu Toàn quốc lần thứ X"
 vie_pol.2.d:0 "Đại hội X khai mạc năm 2006, đánh dấu chặng đường 20 năm đổi mới, chuẩn bị cho bước ngoặt hội nhập kinh tế quốc tế sâu rộng và gia nhập WTO."
 vie_pol.2.a:0 "Nâng cao năng lực lãnh đạo và sức chiến đấu của Đảng!"
 vie_pol.3.t:0 "Đại hội Đại biểu Toàn quốc lần thứ XI"
 vie_pol.3.d:0 "Đại hội XI thông qua Cương lĩnh bổ sung, phát triển năm 2011, xác định ba đột phá chiến lược trong bối cảnh đối mặt với thách thức nợ xấu và bất động sản đóng băng."
 vie_pol.3.a:0 "Tiếp tục đổi mới toàn diện và đồng bộ!"
 vie_pol.4.t:0 "Đại hội Đại biểu Toàn quốc lần thứ XII"
 vie_pol.4.d:0 "Đại hội XII năm 2016 đặt trọng tâm vào xây dựng, chỉnh đốn Đảng, phân định rõ thẩm quyền và trách nhiệm của người đứng đầu, tăng cường kỷ luật kỷ cương."
 vie_pol.4.a:0 "Tăng cường xây dựng Đảng trong sạch, vững mạnh!"
 vie_pol.5.t:0 "Đại hội Đại biểu Toàn quốc lần thứ XIII"
 vie_pol.5.d:0 "Đại hội XIII năm 2021 đề ra mục tiêu phát triển đất nước đến năm 2030 và tầm nhìn 2045, củng cố vị thế quốc gia, chuyển đổi số và phát triển kinh tế biển."
 vie_pol.5.a:0 "Khát vọng phát triển đất nước phồn vinh, hạnh phúc!"
 vie_pol.6.t:0 "Đại hội Đại biểu Toàn quốc lần thứ XIV"
 vie_pol.6.d:0 "Đại hội XIV năm 2026 tổng kết chặng đường 40 năm đổi mới, hoàn thiện thể chế công vụ và hoạch định các chiến lược chuyển giao trọng đại đến năm 2031."
 vie_pol.6.a:0 "Vững bước tiến vào kỷ nguyên vươn mình của dân tộc!"

 vie_pol.101.t:0 "Giải quyết phương án đền bù và giải phóng mặt bằng"
 vie_pol.101.d:0 "Dự án phát triển địa phương đang đứng trước bài toán cân đối quyền lợi giữa tiến độ giải ngân dự án và sự đồng thuận của nhân dân về giá đền bù đất đai."
 vie_pol.101.a:0 "Chốt thỏa thuận đền bù trước khi khởi công (Tốn PP & Ngân khố, Độ gắn kết nội bộ +2)"
 vie_pol.101.b:0 "Ưu tiên tiến độ theo đơn giá đã duyệt (Độ gắn kết nội bộ -8, bảo đảm tiến độ)"
 vie_pol.101.c:0 "Điều chỉnh giảm quy mô thu hồi đất (Tối ưu ngân sách, giữ sự ủng hộ)"

 vie_pol.102.t:0 "Kiểm toán và bảo lãnh doanh nghiệp nhà nước"
 vie_pol.102.d:0 "Các tập đoàn, tổng công ty nhà nước đề nghị tiếp tục duy trì bảo lãnh tín dụng cho các dự án mở rộng, trong khi cơ quan kiểm toán yêu cầu minh bạch dòng tiền."
 vie_pol.102.a:0 "Cấp vốn đi kèm điều kiện kiểm toán độc lập và công khai"
 vie_pol.102.b:0 "Kiểm toán nội bộ và giữ kín dữ liệu nhạy cảm"
 vie_pol.102.c:0 "Duy trì bảo lãnh, hoãn công khai để giữ tốc độ thi công"

 vie_pol.103.t:0 "Hạn nộp bằng chứng kiểm toán nhiệm kỳ"
 vie_pol.103.d:0 "Đã đến hạn rà soát tiến độ kiểm toán các dự án trọng điểm. Hội đồng đánh giá yêu cầu xác nhận mức độ hoàn thiện của các hồ sơ chứng cứ."
 vie_pol.103.a:0 "Cam kết nộp đầy đủ hồ sơ đúng hạn 690 ngày"
 vie_pol.103.b:0 "Xin gia hạn đến ngày 780 và công khai phần còn thiếu (Chi 0.50 ngân khố)"
 vie_pol.103.c:0 "Công bố kết quả có giới hạn và tiếp tục thẩm định"

 vie_pol.104.t:0 "Hợp tác kỹ thuật quốc tế và an ninh dữ liệu"
 vie_pol.104.d:0 "Đối tác quốc tế gửi đề nghị tài trợ kỹ thuật và hỗ trợ tài chính cho doanh nghiệp nhà nước, đổi lại yêu cầu quyền tiếp cận một số luồng dữ liệu vận hành."
 vie_pol.104.a:0 "Ký thỏa thuận tiếp cận dữ liệu có kiểm soát (Nhận 0.75 ngân khố hỗ trợ)"
 vie_pol.104.b:0 "Thu hẹp phạm vi hỗ trợ vào đào tạo chuyên gia (Nhận 0.25 ngân khố)"
 vie_pol.104.c:0 "Từ chối đề nghị, chỉ sử dụng đội ngũ kỹ thuật trong nước"

 vie_pol.108.t:0 "Hồ sơ ứng phó sự cố trên biển"
 vie_pol.108.d:0 "Tình hình Biển Đông xuất hiện diễn biến phức tạp đe dọa chủ quyền. Các cơ quan chức năng cần xác lập phương án xử lý phù hợp."
 vie_pol.108.a:0 "Duy trì kênh trao đổi kín để giữ dư địa ngoại giao"
 vie_pol.108.b:0 "Lập hồ sơ chứng cứ công khai và phối hợp chấp pháp trên thực địa"

 vie_pol.135.t:0 "Xử lý nghĩa vụ thị trường trái phiếu doanh nghiệp"
 vie_pol.135.d:0 "Thị trường vốn doanh nghiệp xuất hiện áp lực đáo hạn đột ngột, đòi hỏi sự can thiệp và định hướng điều hành từ cơ quan quản lý."
 vie_pol.135.a:0 "Rà soát từng tổ chức phát hành và giám sát chặt chẽ"
 vie_pol.135.b:0 "Minh bạch hóa sổ nghĩa vụ để củng cố niềm tin thị trường"

 vie_pol.132.t:0 "Điều chỉnh thỏa thuận hợp tác sau cảnh báo an ninh"
 vie_pol.132.d:0 "Cơ quan an ninh phát đi khuyến cáo về rủi ro dữ liệu đối với hợp đồng kỹ thuật đang có hiệu lực. Cần đưa ra quyết định xử lý dứt khoát."
 vie_pol.132.a:0 "Sửa đổi điều khoản kỹ thuật để bịt các lỗ hổng dữ liệu"
 vie_pol.132.b:0 "Chấm dứt hợp đồng, đóng nghĩa vụ tương lai một cách an toàn"

 # Focuses (74 Nodes)
 VIE_review_public_administration:0 "Rà soát thủ tục và vốn nhà nước"
 VIE_review_public_administration_desc:0 "Tiến hành rà soát toàn diện các thủ tục hành chính công và thực trạng quản lý vốn nhà nước tại các bộ, ngành và địa phương để chuẩn bị cho giai đoạn phát triển mới."
 VIE_publish_responsibility_rules:0 "Công bố quy trình trách nhiệm"
 VIE_publish_responsibility_rules_desc:0 "Ban hành và công khai các quy định cụ thể về trách nhiệm người đứng đầu, làm cơ sở pháp lý vững chắc cho việc triển khai 4 chương trình trọng điểm quốc gia."
 VIE_consult_provincial_leaders:0 "Tham vấn địa phương trước giải ngân"
 VIE_consult_provincial_leaders_desc:0 "Tổ chức các hội nghị hiệp thương, lấy ý kiến lãnh đạo các tỉnh, thành phố nhằm tạo sự đồng thuận cao giữa trung ương và địa phương trước khi phân bổ nguồn lực."
 VIE_establish_project_command:0 "Lập đầu mối chỉ đạo dự án"
 VIE_establish_project_command_desc:0 "Thành lập ban chỉ đạo tập trung nhằm rút ngắn các khâu trung gian, đẩy nhanh tiến độ phê duyệt và tháo gỡ điểm nghẽn cho các dự án trọng điểm."
 VIE_publish_land_compensation_plan:0 "Công khai phương án đền bù đất"
 VIE_publish_land_compensation_plan_desc:0 "Công khai minh bạch khung giá và chính sách đền bù, hỗ trợ tái định cư nhằm giải quyết căn cơ các vướng mắc trong công tác giải phóng mặt bằng."
 VIE_audit_state_enterprise_guarantees:0 "Kiểm toán bảo lãnh DNNN"
 VIE_audit_state_enterprise_guarantees_desc:0 "Kiểm toán chặt chẽ các khoản bảo lãnh vốn vay của chính phủ dành cho khối doanh nghiệp nhà nước nhằm bảo đảm an toàn nợ công và kỷ luật tài chính."
 VIE_publish_term_action_plan:0 "Công bố kế hoạch thực hiện nghị quyết"
 VIE_publish_term_action_plan_desc:0 "Ban hành chương trình hành động toàn diện thực hiện Nghị quyết Đại hội Đảng, xác định rõ lộ trình, nguồn lực và các mục tiêu đột phá của nhiệm kỳ."
 VIE_pilot_one_stop_service:0 "Thí điểm thủ tục một cửa"
 VIE_pilot_one_stop_service_desc:0 "Thí điểm triển khai cơ chế một cửa tại các cơ quan hành chính nhà nước nhằm tinh gọn quy trình, giảm bớt phiền hà và phục vụ người dân, doanh nghiệp tốt hơn."
 VIE_train_successor_candidates:0 "Đào tạo cán bộ và người kế cận"
 VIE_train_successor_candidates_desc:0 "Mở các lớp bồi dưỡng lý luận chính trị và năng lực quản lý nhà nước cho đội ngũ cán bộ nguồn, chuẩn bị nguồn nhân lực lãnh đạo kế cận vững vàng."
 VIE_publish_procurement_audits:0 "Công bố kiểm toán mua sắm công"
 VIE_publish_procurement_audits_desc:0 "Công khai kết quả kiểm toán các gói thầu mua sắm công sử dụng ngân sách nhà nước nhằm phòng ngừa tiêu cực, lãng phí và thất thoát tài sản công."
 VIE_establish_grievance_hearings:0 "Mở phiên tiếp nhận khiếu nại dự án"
 VIE_establish_grievance_hearings_desc:0 "Thiết lập các buổi tiếp công dân định kỳ và đường dây nóng tiếp nhận khiếu nại, tố cáo liên quan đến các dự án kinh tế - xã hội tại cơ sở."
 VIE_review_program_delivery:0 "Nghiệm thu và công bố kết quả"
 VIE_review_program_delivery_desc:0 "Tổ chức tổng kết, đánh giá và công bố công khai kết quả thực hiện các chương trình trọng điểm, rút ra bài học kinh nghiệm cho chặng đường tiếp theo."
 VIE_ix11_rotate_cadres:0 "Luân chuyển cán bộ trong đợt thí điểm"
 VIE_ix11_rotate_cadres_desc:0 "Tổ chức luân chuyển các cán bộ phụ trách dự án thí điểm để đào tạo thực tiễn và chuẩn bị nguồn cán bộ lãnh đạo kế cận."
 VIE_ix12_retain_cadres:0 "Giữ người phụ trách đến nghiệm thu"
 VIE_ix12_retain_cadres_desc:0 "Giữ nguyên người đứng đầu dự án cho đến khi hoàn thành nghiệm thu nhằm bảo đảm tiến độ liên tục và tính trách nhiệm cao nhất."
 VIE_x01_state_capital_list:0 "Công khai danh mục vốn nhà nước"
 VIE_x01_state_capital_list_desc:0 "Công khai và phân loại danh mục vốn nhà nước tại các doanh nghiệp. Mở hồ sơ kiểm toán độc lập để bảo đảm tính minh bạch trước khi tái cơ cấu."
 VIE_x02_separate_guarantees:0 "Tách bảo lãnh khỏi kế hoạch kinh doanh"
 VIE_x02_separate_guarantees_desc:0 "Tách bạch nghĩa vụ bảo lãnh của nhà nước khỏi phương án sản xuất kinh doanh của DNNN nhằm hạn chế rủi ro nợ công và tăng cường tự chủ tài chính."
 VIE_x03_equitize_under_published_terms:0 "Cổ phần hóa theo điều kiện công bố"
 VIE_x03_equitize_under_published_terms_desc:0 "Tiến hành cổ phần hóa doanh nghiệp nhà nước theo phương án công khai, bảo đảm quyền lợi người lao động và giữ lại tỷ lệ chi phối tại các ngành then chốt."
 VIE_x04_audit_post_equitization:0 "Kiểm toán sau chuyển đổi sở hữu"
 VIE_x04_audit_post_equitization_desc:0 "Tiến hành kiểm toán toàn diện sau chuyển đổi sở hữu nhằm truy vết tài sản công và ngăn chặn các hành vi chuyển nhượng tài sản trái quy định."
 VIE_x05_investment_approval_rules:0 "Công bố quy trình chấp thuận đầu tư"
 VIE_x05_investment_approval_rules_desc:0 "Ban hành bộ tiêu chuẩn minh bạch về điều kiện chấp thuận đầu tư, giảm bớt thủ tục can thiệp tùy nghi của các cơ quan quản lý nhà nước."
 VIE_x06_market_access_standards:0 "Đàm phán tiêu chuẩn tiếp cận thị trường"
 VIE_x06_market_access_standards_desc:0 "Đàm phán tiêu chuẩn tiếp cận thị trường với các đối tác thương mại quốc tế, bảo lưu các ngoại lệ ngành thiết yếu để chuẩn bị cho hội nhập."
 VIE_x07_screen_sensitive_investments:0 "Rà soát đầu tư tại ngành nhạy cảm"
 VIE_x07_screen_sensitive_investments_desc:0 "Thiết lập cơ chế thẩm tra an ninh nghiêm ngặt đối với các dòng vốn đầu tư trực tiếp nước ngoài vào các lĩnh vực kinh tế và địa bàn trọng yếu."
 VIE_x08_data_governance_roles:0 "Phân định trách nhiệm quản lý dữ liệu"
 VIE_x08_data_governance_roles_desc:0 "Phân định rõ ràng trách nhiệm quản lý, quyền truy cập và liên thông cơ sở dữ liệu quốc gia giữa các bộ, ngành và chính quyền địa phương."
 VIE_x09_audited_tranches:0 "Giải ngân vốn theo từng đợt kiểm chứng"
 VIE_x09_audited_tranches_desc:0 "Áp dụng cơ chế giải ngân vốn đầu tư công theo từng đợt có đối chiếu kết quả kiểm toán thực tế nhằm nâng cao hiệu quả sử dụng nguồn vốn."
 VIE_x10_advance_key_project_capital:0 "Cấp vốn trước cho dự án trọng điểm"
 VIE_x10_advance_key_project_capital_desc:0 "Tập trung phân bổ vốn trước cho các công trình hạ tầng và dự án trọng điểm quốc gia để đẩy nhanh tiến độ thi công và sớm đưa vào khai thác."
 VIE_x11_disclose_enterprise_guarantees:0 "Công khai bảo lãnh của doanh nghiệp"
 VIE_x11_disclose_enterprise_guarantees_desc:0 "Yêu cầu các tập đoàn, tổng công ty nhà nước công bố đầy đủ các khoản bảo lãnh và nghĩa vụ nợ tiềm ẩn để kiểm soát rủi ro toàn hệ thống."
 VIE_x12_dialogue_investment_terms:0 "Tổ chức đối thoại về điều kiện đầu tư"
 VIE_x12_dialogue_investment_terms_desc:0 "Tổ chức các diễn đàn đối thoại thường kỳ giữa các cơ quan quản lý và cộng đồng doanh nghiệp nhằm tháo gỡ khó khăn về điều kiện đầu tư kinh doanh."
 VIE_xi01_land_acquisition_records:0 "Công bố hồ sơ thu hồi đất"
 VIE_xi01_land_acquisition_records_desc:0 "Công khai minh bạch hồ sơ, phương án và quy hoạch thu hồi đất tại các địa phương để nhân dân và các tổ chức liên quan giám sát đối chiếu."
 VIE_xi02_compensation_fund:0 "Lập quỹ đền bù trước triển khai"
 VIE_xi02_compensation_fund_desc:0 "Thành lập quỹ đền bù và tái định cư trước khi triển khai các dự án giải phóng mặt bằng, bảo đảm quyền lợi chính đáng của các hộ bị ảnh hưởng."
 VIE_xi03_land_dispute_hearings:0 "Mở phiên giải quyết tranh chấp đất"
 VIE_xi03_land_dispute_hearings_desc:0 "Tổ chức các phiên đối thoại và hòa giải công khai để giải quyết thỏa đáng các tranh chấp, khiếu nại về đất đai ngay tại cấp cơ sở."
 VIE_xi04_audit_land_revenues:0 "Kiểm tra nguồn thu từ đất"
 VIE_xi04_audit_land_revenues_desc:0 "Tiến hành thanh tra, kiểm tra toàn diện các khoản thu ngân sách từ giao đất, cho thuê đất và chuyển mục đích sử dụng đất nhằm thu hồi nguồn hụt."
 VIE_xi05_real_estate_bad_debt:0 "Rà soát nợ xấu có tài sản bảo đảm là bất động sản"
 VIE_xi05_real_estate_bad_debt_desc:0 "Rà soát, phân loại toàn diện các khoản nợ xấu của hệ thống tổ chức tín dụng có tài sản bảo đảm bằng quyền sử dụng đất và bất động sản."
 VIE_xi06_vamc_debt_resolution:0 "Xử lý nợ xấu qua cơ chế mua bán nợ"
 VIE_xi06_vamc_debt_resolution_desc:0 "Triển khai cơ chế mua bán và xử lý nợ xấu thông qua Công ty Quản lý tài sản (VAMC) để khơi thông dòng vốn tín dụng và làm sạch bảng cân đối."
 VIE_xi07_frozen_real_estate_projects:0 "Xử lý dự án bất động sản đóng băng"
 VIE_xi07_frozen_real_estate_projects_desc:0 "Đưa ra các giải pháp đồng bộ để tháo gỡ khó khăn, tái cấu trúc chủ đầu tư và tái khởi động các dự án bất động sản đang bị đóng băng."
 VIE_xi08_oil_rig_incident_dossier:0 "Lập hồ sơ ứng phó sự cố giàn khoan"
 VIE_xi08_oil_rig_incident_dossier_desc:0 "Xây dựng hồ sơ pháp lý và phương án đấu tranh ngoại giao, pháp lý kiên quyết nhằm bảo vệ chủ quyền biển đảo trước các hành vi hạ đặt trái phép giàn khoan."
 VIE_xi09_stalled_project_recovery_fund:0 "Lập quỹ xử lý dự án dở dang"
 VIE_xi09_stalled_project_recovery_fund_desc:0 "Bố trí nguồn lực hỗ trợ tài chính để tái khởi động các công trình dở dang, bảo vệ quyền lợi hợp pháp của người mua nhà và khách hàng."
 VIE_xi10_restructure_stalled_projects:0 "Buộc dự án dở dang tái cơ cấu"
 VIE_xi10_restructure_stalled_projects_desc:0 "Yêu cầu các chủ đầu tư dự án chậm tiến độ phải thực hiện phương án tái cơ cấu toàn diện hoặc chuyển giao cho các đơn vị có đủ năng lực."
 VIE_xi11_land_inspection_conclusions:0 "Công khai kết quả thanh tra đất đai"
 VIE_xi11_land_inspection_conclusions_desc:0 "Công khai kết luận thanh tra các vi phạm trong quản lý đất đai, kiên quyết thu hồi đất chậm triển khai và xử lý nghiêm các sai phạm."
 VIE_xi12_credit_guarantor_audit:0 "Kiểm tra trách nhiệm bên bảo lãnh tín dụng"
 VIE_xi12_credit_guarantor_audit_desc:0 "Xác định rõ ràng trách nhiệm của các bên bảo lãnh và tổ chức tín dụng trong việc cấp bảo lãnh cho các khoản vay kém chất lượng."
 VIE_xii01_delegated_signing_authority:0 "Mở rộng quyền ký theo ủy quyền"
 VIE_xii01_delegated_signing_authority_desc:0 "Mở rộng thẩm quyền phê duyệt và ký kết các văn bản hành chính theo ủy quyền cho các cấp phó và thủ trưởng đơn vị cấp dưới để đẩy nhanh tiến độ."
 VIE_xii02_post_audit_approval:0 "Giao quyền phê duyệt kèm hậu kiểm"
 VIE_xii02_post_audit_approval_desc:0 "Chuyển mạnh phương thức quản lý từ tiền kiểm sang hậu kiểm, trao quyền chủ động cho người thực thi đi đôi với quy chế trách nhiệm giải trình."
 VIE_xii03_reform_acceptance_records:0 "Công khai biên bản nghiệm thu cải cách"
 VIE_xii03_reform_acceptance_records_desc:0 "Công khai biên bản nghiệm thu và kết quả đánh giá thực hiện các chương trình cải cách thủ tục hành chính để xã hội cùng giám sát."
 VIE_xii04_conclude_handover:0 "Chốt chuyển giao trước đại hội"
 VIE_xii04_conclude_handover_desc:0 "Chốt phương án bàn giao công việc và hồ sơ trách nhiệm trước thềm đại hội nhằm bảo đảm tính liên tục và thông suốt của bộ máy lãnh đạo."
 VIE_xii05_cross_sectoral_programmes:0 "Điều phối nhiều chương trình liên ngành"
 VIE_xii05_cross_sectoral_programmes_desc:0 "Thiết lập cơ chế điều phối liên ngành tập trung nhằm thống nhất đầu mối chỉ đạo giữa các bộ, ngành đối với các chương trình phát triển lớn."
 VIE_xii06_long_term_dual_role:0 "Phê chuẩn phương án kiêm nhiệm dài hạn"
 VIE_xii06_long_term_dual_role_desc:0 "Phê chuẩn quy chế hoạt động và cơ chế giám sát đối với mô hình lãnh đạo kiêm nhiệm nhằm tập trung chỉ đạo các nhiệm vụ trọng yếu."
 VIE_xii07_leadership_accountability:0 "Kiểm tra trách nhiệm người đứng đầu"
 VIE_xii07_leadership_accountability_desc:0 "Tăng cường kiểm tra, giám sát và phân định rõ trách nhiệm cá nhân của người đứng đầu cấp ủy, cơ quan, đơn vị trong công tác phòng chống tham nhũng."
 VIE_xii08_dual_role_succession:0 "Bàn giao hai chức vụ theo kế cận"
 VIE_xii08_dual_role_succession_desc:0 "Tổ chức bàn giao đồng thời các chức danh chủ chốt cho đội ngũ cán bộ kế cận đã được quy hoạch, bảo đảm tính kế thừa vững chắc."
 VIE_xii09_protect_substantive_decisions:0 "Ban hành quy trình bảo vệ quyết định đúng"
 VIE_xii09_protect_substantive_decisions_desc:0 "Ban hành cơ chế bảo vệ và khuyến khích cán bộ năng động, sáng tạo, dám nghĩ, dám làm, dám chịu trách nhiệm vì lợi ích chung."
 VIE_xii10_cross_sectoral_timeframe:0 "Đặt thời hạn xử lý hồ sơ liên ngành"
 VIE_xii10_cross_sectoral_timeframe_desc:0 "Quy định thời hạn bắt buộc đối với việc lấy ý kiến và xử lý các hồ sơ liên ngành nhằm chấm dứt tình trạng đùn đẩy, né tránh trách nhiệm."
 VIE_xii11_disclose_dual_role_power:0 "Công khai quyền hạn khi kiêm nhiệm"
 VIE_xii11_disclose_dual_role_power_desc:0 "Công khai minh bạch ranh giới quyền hạn và quy trình kiểm soát quyền lực đối với các chức danh kiêm nhiệm lãnh đạo chủ chốt."
 VIE_xii12_mid_term_reassignment:0 "Thẩm định phương án thay người giữa nhiệm kỳ"
 VIE_xii12_mid_term_reassignment_desc:0 "Xây dựng phương án thẩm định và quy trình kiện toàn, điều động cán bộ giữa nhiệm kỳ khi có yêu cầu sắp xếp lại bộ máy tổ chức."
 VIE_xiii01_maritime_incident_channel:0 "Thiết lập kênh xử lý sự cố trên biển"
 VIE_xiii01_maritime_incident_channel_desc:0 "Thiết lập kênh trao đổi thông tin liên lạc nghiệp vụ để kịp thời xử lý các tình huống đột xuất, sự cố va chạm phát sinh trên các vùng biển."
 VIE_xiii02_coordinate_maritime_enforcement:0 "Giao nhiệm vụ phối hợp chấp pháp"
 VIE_xiii02_coordinate_maritime_enforcement_desc:0 "Phân công rõ ràng nhiệm vụ và cơ chế chỉ huy phối hợp giữa các lực lượng Hải quân, Cảnh sát biển, Kiểm ngư và Bộ đội Biên phòng."
 VIE_xiii03_regional_forum_position:0 "Công bố lập trường tại diễn đàn khu vực"
 VIE_xiii03_regional_forum_position_desc:0 "Tuyên bố nhất quán lập trường nguyên tắc về giải quyết tranh chấp bằng biện pháp hòa bình trên cơ sở luật pháp quốc tế tại các diễn đàn khu vực."
 VIE_xiii04_protect_maritime_economy:0 "Bảo vệ hoạt động kinh tế biển"
 VIE_xiii04_protect_maritime_economy_desc:0 "Triển khai các biện pháp đồng bộ để bảo vệ an toàn cho các hoạt động khai thác hải sản, dầu khí và phát triển kinh tế biển của đất nước."
 VIE_xiii05_corporate_bond_obligations:0 "Công khai nghĩa vụ trái phiếu doanh nghiệp"
 VIE_xiii05_corporate_bond_obligations_desc:0 "Rà soát toàn diện và công khai nghĩa vụ thanh toán nợ gốc, lãi trái phiếu doanh nghiệp của các tổ chức phát hành nhằm ổn định thị trường."
 VIE_xiii06_bond_maturity_restructuring:0 "Đàm phán cơ cấu lại kỳ hạn"
 VIE_xiii06_bond_maturity_restructuring_desc:0 "Hỗ trợ các doanh nghiệp phát hành đàm phán với trái chủ để cơ cấu lại thời hạn trả nợ và hoán đổi tài sản hợp pháp nhằm khôi phục thanh khoản."
 VIE_xiii07_protect_retail_bondholders:0 "Bảo vệ người mua trong phương án xử lý"
 VIE_xiii07_protect_retail_bondholders_desc:0 "Áp dụng các biện pháp bảo vệ quyền lợi hợp pháp của các nhà đầu tư cá nhân mua trái phiếu thông qua việc giám sát tài sản bảo đảm."
 VIE_xiii08_bond_underwriter_audit:0 "Kiểm tra trách nhiệm bên phân phối và bảo lãnh"
 VIE_xiii08_bond_underwriter_audit_desc:0 "Thanh tra, kiểm tra trách nhiệm của các tổ chức tư vấn phát hành, đại lý phân phối và ngân hàng bảo lãnh trong việc cung cấp thông tin trái phiếu."
 VIE_xiii09_technical_cooperation_terms:0 "Công khai điều kiện hợp tác kỹ thuật"
 VIE_xiii09_technical_cooperation_terms_desc:0 "Công bố minh bạch các tiêu chí và điều kiện hợp tác kỹ thuật quốc tế trong lĩnh vực an ninh, an toàn hàng hải và nghiên cứu biển."
 VIE_xiii10_sea_incident_dialogue:0 "Xử lý sự cố trên biển qua đối thoại"
 VIE_xiii10_sea_incident_dialogue_desc:0 "Kiên trì giải quyết các tranh chấp và bất đồng trên biển thông qua cơ chế đàm phán, đối thoại hòa bình và xây dựng lòng tin chiến lược."
 VIE_xiii11_enforcement_presence_at_sea:0 "Duy trì hiện diện chấp pháp sau sự cố"
 VIE_xiii11_enforcement_presence_at_sea_desc:0 "Tăng cường hiện diện chấp pháp thường trực của lực lượng Cảnh sát biển và Kiểm ngư tại các vùng biển trọng điểm để giữ vững chủ quyền."
 VIE_xiii12_security_contract_adjustment:0 "Điều chỉnh hợp đồng sau cảnh báo an ninh"
 VIE_xiii12_security_contract_adjustment_desc:0 "Rà soát và điều chỉnh kịp thời các điều khoản hợp đồng hợp tác kỹ thuật sau khi nhận diện các nguy cơ tiềm ẩn về an ninh quốc gia."
 VIE_xiv01_civil_service_standards:0 "Áp chuẩn công vụ sau thí điểm"
 VIE_xiv01_civil_service_standards_desc:0 "Chuẩn hóa và ban hành hệ thống tiêu chuẩn chức danh công vụ sau giai đoạn thí điểm, làm căn cứ tuyển dụng, đánh giá và đãi ngộ cán bộ."
 VIE_xiv02_term_audit_results:0 "Công khai kết quả kiểm toán nhiệm kỳ"
 VIE_xiv02_term_audit_results_desc:0 "Công bố công khai kết quả kiểm toán toàn diện việc quản lý, sử dụng tài chính và tài sản công trong cả nhiệm kỳ trước Quốc hội và nhân dân."
 VIE_xiv03_services_and_compensation:0 "Nghiệm thu dịch vụ và đền bù"
 VIE_xiv03_services_and_compensation_desc:0 "Nghiệm thu toàn bộ các công trình dịch vụ công và giải quyết dứt điểm các hồ sơ đền bù tồn đọng để bàn giao cho chính quyền địa phương."
 VIE_xiv04_handover_new_term:0 "Bàn giao chương trình cho nhiệm kỳ mới"
 VIE_xiv04_handover_new_term_desc:0 "Hoàn tất thủ tục bàn giao các chương trình, dự án trọng điểm quốc gia cho ban điều hành nhiệm kỳ mới tiếp tục triển khai thực hiện."
 VIE_xiv05_extend_incomplete_programmes:0 "Gia hạn chương trình chưa hoàn thành"
 VIE_xiv05_extend_incomplete_programmes_desc:0 "Đánh giá và cho phép gia hạn có điều kiện đối với các chương trình có ý nghĩa chiến lược nhưng chưa kịp hoàn thành do nguyên nhân khách quan."
 VIE_xiv06_reallocate_failed_resources:0 "Chuyển nguồn lực khỏi chương trình thất bại"
 VIE_xiv06_reallocate_failed_resources_desc:0 "Quyết liệt dừng triển khai và điều chuyển nguồn lực tài chính, nhân lực từ các chương trình kém hiệu quả sang các mục tiêu ưu tiên mới."
 VIE_xiv07_audit_handover_results:0 "Kiểm toán kết quả bàn giao"
 VIE_xiv07_audit_handover_results_desc:0 "Tiến hành kiểm toán độc lập đối với toàn bộ các hồ sơ, số liệu và tài sản bàn giao giữa hai nhiệm kỳ để bảo đảm tính chính xác, khách quan."
 VIE_xiv08_retain_specialist_teams:0 "Giữ nhóm chuyên môn qua chuyển giao"
 VIE_xiv08_retain_specialist_teams_desc:0 "Ban hành chính sách giữ chân các chuyên gia đầu ngành và nhóm nhân sự nòng cốt qua giai đoạn chuyển giao để duy trì năng lực kỹ thuật."
 VIE_xiv09_replace_delivery_team:0 "Thay nhóm triển khai sau kiểm toán"
 VIE_xiv09_replace_delivery_team_desc:0 "Thay thế kịp thời các ban quản lý, đội ngũ triển khai yếu kém sau kết luận kiểm toán bằng những cán bộ có đủ năng lực và phẩm chất."
 VIE_xiv10_delivered_service_commitments:0 "Công khai cam kết dịch vụ đã nghiệm thu"
 VIE_xiv10_delivered_service_commitments_desc:0 "Công bố công khai các cam kết chất lượng dịch vụ công đã được nghiệm thu để nhân dân và cộng đồng doanh nghiệp trực tiếp thụ hưởng, giám sát."
 VIE_xiv11_review_extended_contracts:0 "Rà soát hợp đồng có nghĩa vụ kéo dài"
 VIE_xiv11_review_extended_contracts_desc:0 "Rà soát toàn diện các thỏa thuận, hiệp định và hợp đồng quốc tế có nghĩa vụ kéo dài qua nhiều nhiệm kỳ để kịp thời điều chỉnh cho phù hợp."
 VIE_xiv12_finalize_2031_transition:0 "Chốt phương án chuyển giao năm 2031"
 VIE_xiv12_finalize_2031_transition_desc:0 "Hoàn thiện phương án tổng thể về nhân sự, đường lối và thể chế chuẩn bị cho giai đoạn chuyển giao quyền lực chiến lược đến năm 2031."

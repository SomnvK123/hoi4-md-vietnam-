 ### Focuses
 VIE_doi_moi_continues:0 "Tiếp tục Công cuộc Đổi Mới"
 VIE_doi_moi_continues_desc:0 "Đường lối Đổi Mới khởi xướng từ năm 1986 tiếp tục là nền tảng vững chắc cho sự phát triển của Việt Nam. Ổn định trong nước và hội nhập quốc tế luôn đồng hành cùng nhau."
 VIE_border_settlement:0 "Hoàn tất Phân giới Cắm mốc Biên giới"
 VIE_border_settlement_desc:0 "Hiệp ước biên giới trên đất liền được phê chuẩn, các cột mốc chủ quyền được dựng lên dọc đường biên. Việc loại bỏ các tranh chấp tồn đọng trong lịch sử giúp hai bên giao thương hòa bình."
 VIE_asean_integration:0 "Đường lối Đối ngoại"
 VIE_asean_integration_desc:0 "Đường lối đối ngoại độc lập, tự chủ, hòa bình, hợp tác và phát triển, đa phương hóa, đa dạng hóa quan hệ quốc tế: \"sẵn sàng là bạn, là đối tác tin cậy của các nước trong cộng đồng quốc tế\". ASEAN là mỏ neo trong khu vực, trên đó Việt Nam xây dựng quan hệ với các nước láng giềng, các nước lớn và các thiết chế đa phương toàn cầu."
 VIE_assert_maritime_rights:0 "Khẳng định Chủ quyền Biển đảo"
 VIE_assert_maritime_rights_desc:0 "Sau các cuộc chạm trán liên tiếp trên biển, Hà Nội công khai bảo vệ các tuyên bố chủ quyền của mình. §RĐiều này sẽ làm xấu đi mối quan hệ với Trung Quốc.§!"


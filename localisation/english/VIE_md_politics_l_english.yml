 # Categories
 VIE_leadership_balance_category:0 "Cán cân Phương thức Lãnh đạo"
 VIE_leadership_balance_category_desc:0 "Các quyết định điều phối trực tiếp cán cân giữa phương thức lãnh đạo tập thể và lãnh đạo tập trung."
 VIE_political_leadership_category:0 "Hệ thống Lãnh đạo & Quản trị Nội bộ"
 VIE_political_leadership_category_desc:0 "Các quyết định điều phối cán cân phương thức lãnh đạo, củng cố sự gắn kết nội bộ, kiện toàn nhân sự và triển khai các dự án hỗ trợ thực thi."
 VIE_term_programmes_category:0 "Chương trình Trọng điểm Nhiệm kỳ"
 VIE_term_programmes_category_desc:0 "Chương trình hành động lớn được Đại hội Đảng thông qua. Mỗi nhiệm kỳ triển khai một trong bốn lĩnh vực với thời hạn 900 ngày."

 # Decisions
 VIE_meeting_resolve_disagreements:0 "Hội nghị hiệp thương xử lý bất đồng"
 VIE_meeting_resolve_disagreements_desc:0 "Tổ chức phiên làm việc hiệp thương để tháo gỡ các vướng mắc, khôi phục sự đồng thuận và củng cố độ gắn kết nội bộ (+10). Có thể sử dụng để khép lại một kiến nghị tồn đọng."
 VIE_bop_expand_collective_consultation:0 "Mở rộng tham vấn tập thể"
 VIE_bop_expand_collective_consultation_desc:0 "Tổ chức các phiên họp lấy ý kiến tập thể và lắng nghe ý kiến phản biện từ các cơ quan đầu ngành nhằm tăng cường tính đồng thuận trong việc hoạch định chủ trương."
 VIE_bop_strengthen_central_coordination:0 "Tăng quyền điều phối trung tâm"
 VIE_bop_strengthen_central_coordination_desc:0 "Tập trung đầu mối chỉ đạo và tăng quyền hạn quyết đoán cho cơ quan thường trực nhằm nâng cao tính kịp thời và hiệu lực điều hành."
 VIE_adopt_dual_role_decision:0 "Nhất thể hóa chức danh Tổng Bí thư và Chủ tịch nước"
 VIE_adopt_dual_role_decision_desc:0 "Thực hiện nhất thể hóa vai trò Tổng Bí thư và Chủ tịch nước nhằm tập trung đầu mối chỉ đạo, nâng cao hiệu lực điều hành và rút ngắn thời gian ban hành quyết sách liên ngành xuống 21 ngày."
 VIE_split_dual_role_decision:0 "Phân định chức danh lãnh đạo chủ chốt"
 VIE_split_dual_role_decision_desc:0 "Kiện toàn bộ máy theo hướng phân định rõ các vị trí lãnh đạo chủ chốt cho từng nhân sự riêng biệt, tăng cường tính tập thể và cơ chế kiểm soát quyền lực."
 VIE_side_project_decision:0 "Triển khai dự án bổ trợ sau nghiệm thu"
 VIE_side_project_decision_desc:0 "Triển khai dự án hỗ trợ bổ sung tại đơn vị đã nghiệm thu thành công nhằm duy trì đà cải cách thủ tục và tối ưu hóa hiệu quả hoạt động của bộ máy."

 VIE_select_cadre_decision:0 "Xác định trọng tâm: Tổ chức – Cán bộ"
 VIE_select_cadre_decision_desc:0 "Tập trung nguồn lực nhiệm kỳ vào xây dựng quy trình trách nhiệm, đào tạo cán bộ kế cận và củng cố khối đoàn kết nội bộ."
 VIE_select_admin_decision:0 "Xác định trọng tâm: Điều hành – Công vụ"
 VIE_select_admin_decision_desc:0 "Tập trung nguồn lực nhiệm kỳ vào chuẩn hóa cơ chế một cửa, hoàn thành các dự án cải cách hành chính và bảo đảm cân đối ngân sách."
 VIE_select_inspection_decision:0 "Xác định trọng tâm: Kiểm tra – Giám sát"
 VIE_select_inspection_decision_desc:0 "Tập trung nguồn lực nhiệm kỳ vào ban hành chuẩn kiểm toán, thanh tra toàn diện nguồn vốn công và kiên quyết ngăn ngừa tham nhũng."
 VIE_select_social_decision:0 "Xác định trọng tâm: Dân vận – Xã hội"
 VIE_select_social_decision_desc:0 "Tập trung nguồn lực nhiệm kỳ vào giải quyết thỏa đáng đền bù đất đai, bảo đảm an sinh xã hội và củng cố niềm tin của nhân dân."

 VIE_launch_mode_standard_decision:0 "Triển khai theo tiến độ chuẩn mực"
 VIE_launch_mode_standard_decision_desc:0 "Khởi động chương trình nhiệm kỳ theo nhịp độ thẩm định chuẩn mực, bảo đảm tính thận trọng và chất lượng kiểm soát ở từng bước."
 VIE_launch_mode_fast_paid_decision:0 "Triển khai cấp tốc qua cơ chế thương lượng"
 VIE_launch_mode_fast_paid_decision_desc:0 "Đẩy nhanh tiến độ hoàn thành chương trình thông qua việc bố trí ngân sách thỏa đáng cho các khâu thương lượng và giải quyết kịp thời phản biện."
 VIE_launch_mode_fast_override_decision:0 "Triển khai cấp tốc qua quyết sách tập trung"
 VIE_launch_mode_fast_override_decision_desc:0 "Vận dụng kỷ luật lãnh đạo tập trung để giải quyết nhanh các thủ tục phản đối kéo dài, đòi hỏi mức độ đồng thuận nội bộ vững chắc."
 VIE_review_programme_early_decision:0 "Nghiệm thu sớm chương trình trọng điểm"
 VIE_review_programme_early_decision_desc:0 "Tổ chức phiên họp đánh giá và nghiệm thu toàn diện trước thời hạn khi đã hoàn thành xuất sắc toàn bộ 4 nhóm chỉ tiêu cam kết."
 VIE_term_programme_deadline_mission:0 "Thời hạn hoàn thành chương trình nhiệm kỳ"
 VIE_term_programme_deadline_mission_desc:0 "Khung thời hạn tối đa 900 ngày để hoàn thành đầy đủ các mục tiêu hành động đã được Đại hội Đảng thông qua."

 # Ideas & Tiers
 VIE_tier_cadre_1:0 "Bộ máy Cán bộ (Bậc 1)"
 VIE_tier_cadre_1_desc:0 "Đã xây dựng được quy trình đánh giá trách nhiệm và mạng lưới cán bộ kế cận cơ bản."
 VIE_tier_cadre_2:0 "Bộ máy Cán bộ (Bậc 2)"
 VIE_tier_cadre_2_desc:0 "Quy trình luân chuyển và đào tạo cán bộ kế cận hoạt động ổn định và chuyên nghiệp."
 VIE_tier_cadre_3:0 "Bộ máy Cán bộ (Bậc 3)"
 VIE_tier_cadre_3_desc:0 "Hệ thống tổ chức cán bộ hiện đại, vững vàng trước mọi giai đoạn chuyển giao quyền lực."

 VIE_tier_admin_1:0 "Cải cách Công vụ (Bậc 1)"
 VIE_tier_admin_1_desc:0 "Thủ tục hành chính được đơn giản hóa bước đầu, giảm bớt chi phí vận hành bộ máy."
 VIE_tier_admin_2:0 "Cải cách Công vụ (Bậc 2)"
 VIE_tier_admin_2_desc:0 "Cơ chế một cửa liên thông phát huy hiệu quả thực chất, giảm gánh nặng chi phí công quyền."
 VIE_tier_admin_3:0 "Cải cách Công vụ (Bậc 3)"
 VIE_tier_admin_3_desc:0 "Hành chính công hiện đại, minh bạch, phục vụ đắc lực cho hoạt động kinh tế - xã hội."

 VIE_tier_inspection_1:0 "Kỷ cương Kiểm tra (Bậc 1)"
 VIE_tier_inspection_1_desc:0 "Thiết lập các chuẩn mực kiểm toán và giám sát chi tiêu công cơ bản."
 VIE_tier_inspection_2:0 "Kỷ cương Kiểm tra (Bậc 2)"
 VIE_tier_inspection_2_desc:0 "Hoạt động thanh tra, kiểm tra tài chính công đi vào chiều sâu, hạn chế thất thoát vốn."
 VIE_tier_inspection_3:0 "Kỷ cương Kiểm tra (Bậc 3)"
 VIE_tier_inspection_3_desc:0 "Hệ thống giám sát liêm chính toàn diện, kiểm soát chặt chẽ mọi rủi ro tài chính công."

 VIE_tier_social_1:0 "Đồng thuận Xã hội (Bậc 1)"
 VIE_tier_social_1_desc:0 "Công tác dân vận và tiếp nhận khiếu nại cơ sở đạt kết quả tích cực bước đầu."
 VIE_tier_social_2:0 "Đồng thuận Xã hội (Bậc 2)"
 VIE_tier_social_2_desc:0 "Quyền lợi của người dân được bảo đảm tốt hơn trong các dự án phát triển, củng cố ổn định."
 VIE_tier_social_3:0 "Đồng thuận Xã hội (Bậc 3)"
 VIE_tier_social_3_desc:0 "Khối đại đoàn kết và niềm tin xã hội được củng cố vững chắc, tạo nền tảng ổn định lâu dài."

 VIE_programme_partial_support_idea:0 "Gói hỗ trợ điều hành chuyển tiếp"
 VIE_programme_partial_support_idea_desc:0 "Chính sách hỗ trợ tạm thời sau khi chương trình nhiệm kỳ đạt được kết quả một phần."
 VIE_programme_fail_penalty_idea:0 "Hệ lụy chương trình dở dang"
 VIE_programme_fail_penalty_idea_desc:0 "Áp lực dư luận và khó khăn trong phối hợp điều hành do chương trình nhiệm kỳ không đạt chỉ tiêu."
 VIE_side_project_bureaucracy_idea:0 "Hiệu quả dự án bổ trợ"
 VIE_side_project_bureaucracy_idea_desc:0 "Thực thi hiệu quả dự án hỗ trợ sau nghiệm thu, tối ưu hóa quy trình thủ tục hành chính."
 VIE_e102_c_soe_construction_idea:0 "Bảo lãnh đầu tư hạ tầng DNNN"
 VIE_e102_c_soe_construction_idea_desc:0 "Duy trì bảo lãnh vốn để đẩy nhanh tiến độ thi công các công trình trọng điểm của doanh nghiệp nhà nước."
 VIE_xiv10_service_stability_idea:0 "Cam kết dịch vụ công ổn định"
 VIE_xiv10_service_stability_idea_desc:0 "Dịch vụ công được công khai và bảo đảm chất lượng, nâng cao sự hài lòng của nhân dân."
 VIE_pilot_one_stop_legacy_idea:0 "Di sản thủ tục một cửa thí điểm"
 VIE_pilot_one_stop_legacy_idea_desc:0 "Thành quả từ việc nhân rộng mô hình thủ tục một cửa trên phạm vi toàn quốc."
 VIE_leadership_transition_penalty:0 "Giai đoạn chuyển giao bộ máy"
 VIE_leadership_transition_penalty_desc:0 "Khó khăn tạm thời trong công tác lãnh đạo khi bộ máy đang trong quá trình kiện toàn nhân sự mới."


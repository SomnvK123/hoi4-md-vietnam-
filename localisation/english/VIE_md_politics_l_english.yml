 VIE_conservative_side:0 "§CKiên định Nền tảng§!"
 VIE_conservative_side_desc:0 "Ổn định chính trị, kỷ luật Đảng và vai trò chủ đạo của doanh nghiệp nhà nước phải được đặt lên hàng đầu."
 VIE_reform_side:0 "§GĐổi mới Sâu rộng§!"
 VIE_reform_side_desc:0 "Kinh tế thị trường, doanh nghiệp tư nhân và hội nhập quốc tế toàn diện là con đường dẫn tới sự thịnh vượng."
 VIE_mid_range:0 "Đường lối Trung dung Cân bằng"
 VIE_mid_range_desc:0 "§gBan lãnh đạo chèo lái khéo léo giữa hai khuynh hướng, giữ vững sự đoàn kết thống nhất trong Đảng.§!"
 VIE_conservative_range:0 "Đường lối Thận trọng"
 VIE_conservative_range_desc:0 "§gKỷ luật và ổn định chính trị được coi trọng hơn tốc độ tăng trưởng.§!"
 VIE_hardline_range:0 "Đường lối Cứng rắn"
 VIE_hardline_range_desc:0 "§gÝ thức hệ giáo điều chiếm ưu thế. Tăng trưởng kinh tế, thương mại và nghiên cứu khoa học chịu ảnh hưởng tiêu cực, song sự lãnh đạo của Đảng được bảo đảm an toàn tuyệt đối.§!"
 VIE_reform_range:0 "Đường lối Canh tân Cải cách"
 VIE_reform_range_desc:0 "§gPhe cải cách giành ưu thế: tăng trưởng nhanh hơn và thương mại khởi sắc, mức độ kiểm soát giảm nhẹ.§!"
 VIE_radical_reform_range:0 "Cải cách Triệt để"
 VIE_radical_reform_range_desc:0 "§gCải cách sâu rộng thúc đẩy tăng trưởng vượt bậc nhưng gây sức ép rất lớn lên khả năng kiểm soát của Đảng.§!"


 VIE_sec_category:0 "Bộ máy An ninh"
 VIE_sec_category_desc:0 "Các công cụ điều hành của nhà nước an ninh."
 VIE_sec_dec_opinion_campaign:0 "Chiến dịch Dư luận"
 VIE_sec_dec_opinion_campaign_desc:0 "Huy động bộ máy truyền thông và an ninh mạng để dập tắt các điểm nóng dư luận. Ổn định tăng, không gian chính trị thu hẹp."
 VIE_sec_dec_fdi_screening:0 "Thẩm tra FDI"
 VIE_sec_dec_fdi_screening_desc:0 "Mọi dự án đầu tư nước ngoài phải qua vòng thẩm tra an ninh; phần vốn bị định hướng lại chảy về các tập đoàn an ninh. Hội nhập và thị trường bị thu hẹp."
 VIE_sec_dec_purge_disloyal:0 "Cách chức Cán bộ không Trung thành"
 VIE_sec_dec_purge_disloyal_desc:0 "Loại bỏ những cán bộ bị nghi ngờ lòng trung thành và tịch thu tài sản phát sinh. Ổn định giảm nhẹ, nỗi sợ lan trong bộ máy."
 VIE_sec_dec_social_credit:0 "Điểm Tín nhiệm Xã hội"
 VIE_sec_dec_social_credit_desc:0 "Thưởng và phạt công dân theo điểm tín nhiệm lập từ dữ liệu giám sát. Ổn định tăng; chưa có Trung tâm Dữ liệu Quốc gia thì việc chấm điểm tốn kém."
 VIE_sec_dec_freeze_assets:0 "Đóng băng Tài sản Đối lập"
 VIE_sec_dec_freeze_assets_desc:0 "Dữ liệu tài chính tập trung cho phép phong tỏa quỹ của các nhóm đối lập và tịch thu. Ngân khố được bổ sung, giới kinh doanh bất an."



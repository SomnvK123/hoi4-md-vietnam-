l_english:

 ### Trigger and tooltip texts (Phase 3)
 VIE_formosa_open_tt:0 "Thảm họa môi trường Formosa đã được giải quyết công khai"
 VIE_d2_open_tt:0 "Cuộc đối thoại với xã hội dân sự đã được khai mở"
 VIE_indochina_formable_tt:0 "Mở khóa quyết định thành lập §YLiên bang Đông Dương§! khi kiểm soát hoặc nắm giữ 11 bang/tỉnh theo yêu cầu."
 VIE_bubble_tt:0 "Bong bóng bất động sản bắt đầu hình thành. Sử dụng quyết định §YSiết chặt Tín dụng§! để làm chậm tốc độ tăng nhiệt."

 ### Decisions
 VIE_oligarch_category:0 "Nhà nước Tài phiệt Tập đoàn"
 VIE_oligarch_category_desc:0 "Vận mệnh quốc gia bị gắn chặt vào một nhóm nhỏ các đại tập đoàn kinh tế tư nhân khổng lồ."
 VIE_ol_credit_squeeze_desc:0 "Hạn chế dòng vốn cho vay đối với các công ty bất động sản nhằm hạ nhiệt bong bóng nhà đất. Điều này làm hao tổn vốn liếng chính trị nhưng giúp giảm thiểu thiệt hại đổ vỡ về sau."

 ### Balance of power: populist (State <-> Street)

 ### Balance of power: oligarchic (Conglomerates <-> Public)
 VIE_oligarch_balance:0 "§YĐại tập đoàn và Công chúng§!"
 VIE_oligarch_balance_desc:0 "Nhà nước vận hành dựa trên nguồn vốn tín dụng từ các tập đoàn. Nợ họ càng nhiều, nhà nước càng có ít quyền lựa chọn."
 VIE_oli_conglomerate_side:0 "§CCác Đại tập đoàn§!"
 VIE_oli_conglomerate_side_desc:0 "Một nhóm nhỏ các tập đoàn quyết định ai được cấp tín dụng, trao hợp đồng dự án và quyền đưa tin truyền thông."
 VIE_oli_public_side:0 "§GCông chúng§!"
 VIE_oli_public_side_desc:0 "Người gửi tiền tiết kiệm, các tiểu thương và cử tri đòi hỏi một tiếng nói công bằng."
 VIE_oli_mid_range:0 "Thế trận Giằng co"
 VIE_oli_mid_range_desc:0 "§gChưa bên nào, giữa các tập đoàn và công chúng, giành được thế thượng phong.§!"
 VIE_oli_conglomerate_range:0 "Tập đoàn Chi phối"
 VIE_oli_conglomerate_range_desc:0 "§gTăng trưởng kinh tế mạnh mẽ, đi kèm sức ảnh hưởng ngày một lớn của các tập đoàn khổng lồ.§!"
 VIE_oli_conglomerate_full_range:0 "Nhà nước Bị Thâu tóm"
 VIE_oli_conglomerate_full_range_desc:0 "§gCác tập đoàn chính là nhà nước. Tăng trưởng bề nổi cao nhưng niềm tin xã hội chạm đáy.§!"
 VIE_oli_public_range:0 "Giám sát của Công luận"
 VIE_oli_public_range_desc:0 "§gCác cơ quan quản lý và báo chí buộc các tập đoàn phải chịu trách nhiệm, dù phải trả giá bằng một phần tốc độ tăng trưởng.§!"
 VIE_oli_public_full_range:0 "Kiểm soát của Nhân dân"
 VIE_oli_public_full_range_desc:0 "§gCác tập đoàn bị đặt dưới sự kiểm soát chặt chẽ; tăng trưởng duy trì ở mức khiêm tốn.§!"

 ### Events: doors and regime events (Phase 3)
 vie_alt.1.t:0 "Sau Khủng hoảng Giàn khoan"
 vie_alt.1.d:0 "Giàn khoan đã rút đi, song đất nước không còn như trước nữa. Một số ý kiến trong ban lãnh đạo cho rằng Việt Nam đã quá phụ thuộc vào một người láng giềng vừa để lộ nanh vuốt. Những người khác cho rằng chỉ có sức mạnh toàn dân mới bảo vệ được tổ quốc. Quan điểm thứ ba lại khẳng định duy trì sự bình tĩnh là phương sách tốt nhất."
 vie_alt.1.a:0 "Trở lại bình thường với những bài học đã rút ra"
 vie_alt.1.b:0 "Đảng sẽ dẫn dắt con đường tự chủ chiến lược"
 vie_alt.2.t:0 "Kiến nghị và Xã hội Dân sự"
 vie_alt.2.d:0 "Các tầng lớp trí thức, luật sư và nhà báo gửi nhiều bức tâm thư kiến nghị mở rộng tranh luận và công nhận pháp lý cho các hội đoàn độc lập. Một nền báo chí cởi mở hơn đã tạo diễn đàn cho tiếng nói của họ."
 vie_alt.2.a:0 "Khéo léo từ chối"
 vie_alt.2.b:0 "Mở cuộc đối thoại có giới hạn"
 vie_alt.3.t:0 "Khủng hoảng Niềm tin Toàn diện"
 vie_alt.3.d:0 "Hàng loạt đại án nợ xấu, lạm phát phi mã và nỗi bất bình trong nhân dân đã làm lung lay uy tín của chính quyền. Một số muốn siết chặt kỷ cương quyền lực nhà nước; số khác muốn đặt niềm tin vào các tập đoàn kinh tế tư nhân lớn nhất; số còn lại muốn lần lữa vượt qua sóng gió."
 vie_alt.3.a:0 "Ổn định tình hình trong khuôn khổ hệ thống hiện tại"
 vie_alt.3.b:0 "Trật tự là trên hết: Giao quyền chỉ đạo cho bộ máy an ninh"
 vie_alt.3.c:0 "Để các đại tập đoàn đứng ra tự giải quyết"
 vie_alt.6.t:0 "Dự thảo Luật Đặc khu Kinh tế"
 vie_alt.6.d:0 "Dự luật thành lập ba đơn vị hành chính - kinh tế đặc biệt với cơ chế ưu đãi cho nhà đầu tư thuê đất lên tới 99 năm đang được trình trước Quốc hội. Đám đông người dân đã xuống đường biểu tình vì lo sợ đất đai biên cương sẽ rơi vào tay các doanh nghiệp nước ngoài."
 vie_alt.6.a:0 "Đối thoại, lắng nghe người biểu tình"
 vie_alt.6.b:0 "Giữ trật tự, không nhượng bộ"
 vie_alt.7.t:0 "Làn sóng Rút tiền Hàng loạt tại Ngân hàng Lớn"
 vie_alt.7.d:0 "Người gửi tiền xếp hàng dài tại các chi nhánh của một trong những ngân hàng lớn nhất nước. Chủ sở hữu thực sự của ngân hàng đang bị điều tra hình sự, và niềm tin vào toàn bộ hệ thống ngân hàng đang bị đe dọa nghiêm trọng."
 vie_alt.7.a:0 "Nhà nước lập tức can thiệp và bảo đảm chi trả"
 vie_alt.7.b:0 "Để các đại tập đoàn tự thu xếp dàn xếp với nhau"
 vie_alt.8.t:0 "Ai Đang Thuê Đất Đặc khu?"
 vie_alt.8.d:0 "Các phóng viên điều tra phát hiện ra rằng một phần lớn diện tích đất đai tại các đặc khu đang được các công ty đến từ một quốc gia duy nhất thuê lại. Sự phẫn nộ trong dư luận đang bùng phát dữ dội."
 vie_alt.8.a:0 "Thu hồi toàn bộ các quyết định cho thuê đất"
 vie_alt.8.b:0 "Chấp nhận đó là cái giá phải trả cho tăng trưởng"
 vie_alt.12.t:0 "Phe Bảo thủ Theo dõi Bàn Đàm phán"
 vie_alt.12.d:0 "Các cuộc hội đàm bàn tròn đã chính thức bắt đầu, và một nhóm các tướng lĩnh cùng các bậc lão thành trong Đảng đang theo dõi với sự bất an ngày một tăng."
 vie_alt.12.a:0 "Kiên quyết xúc tiến các cuộc hội đàm"
 vie_alt.12.b:0 "Làm chậm tiến trình để trấn an phe bảo thủ"
 vie_alt.13.t:0 "Bản Hiến pháp Mới"
 vie_alt.13.d:0 "Dự thảo hiến pháp mới bảo đảm quyền tự do bầu cử, một nền tư pháp độc lập và các quyền tự do công dân đã hoàn tất. Bản dự thảo có thể được đưa ra trưng cầu dân ý toàn quốc hoặc biểu quyết thông qua tại quốc hội."
 vie_alt.13.a:0 "Đưa ra trưng cầu dân ý toàn dân"
 vie_alt.13.b:0 "Thông qua tại nghị viện"
 vie_alt.14.t:0 "Cuộc Tổng Tuyển cử Tự do Đầu tiên"
 vie_alt.14.d:0 "Cử tri trên khắp cả nước lần đầu tiên sau nhiều thập kỷ được bỏ phiếu trong một cuộc bầu cử tự do đa đảng. Ba lực lượng dẫn đầu cuộc đua là phái tự do, phái bảo thủ và phái xã hội."
 vie_alt.14.a:0 "Đảng Dân chủ Tự do giành thắng lợi"
 vie_alt.14.b:0 "Đảng Bảo thủ giành thắng lợi"
 vie_alt.14.c:0 "Đảng Xã hội giành thắng lợi"

 ### Events: international reactions (Phase 3)
 vie_int.2.t:0 "Căng thẳng Bùng phát Nơi Biên giới"
 vie_int.2.d:0 "Quân đội Trung Quốc đã tổ chức các cuộc tập trận quy mô lớn dọc tuyến biên giới khi các phát ngôn từ phía phong trào ngày càng gay gắt. Các vụ chạm trán nhỏ lẻ đang gia tăng nhanh chóng."
 vie_int.2.a:0 "Tăng cường quân lực bảo vệ biên cương"
 vie_int.2.b:0 "Chủ động hạ nhiệt căng thẳng"
 vie_int.4.t:0 "Bắc Kinh Phản ứng khi Việt Nam Ngả sang Phương Tây"
 vie_int.4.d:0 "Trung Quốc rà soát lại toàn bộ chính sách thương mại và biên giới đối với Việt Nam, đồng thời đưa ra cảnh báo rằng việc xích lại gần các đối thủ của họ sẽ phải trả giá đắt."
 vie_int.4.a:0 "Chấp nhận đối mặt với sức ép"
 vie_int.4.b:0 "Đưa ra các thông điệp trấn an"
 vie_int.5.t:0 "Quan hệ với Washington Lạnh nhạt"
 vie_int.5.d:0 "Khi Việt Nam có những bước đi xích lại gần hơn với Bắc Kinh, Hoa Kỳ và các đối tác đồng minh bắt đầu cắt giảm hợp tác và xem xét lại các dự án đầu tư lớn."
 vie_int.5.a:0 "Chấp nhận sự băng giá trong quan hệ"
 vie_int.5.b:0 "Cân bằng lại bằng các kênh tiếp xúc ngoại giao kín đáo"
 vie_int.6.t:0 "Đề xuất Viện trợ cho Thể chế Mới"
 vie_int.6.d:0 "Washington và các đồng minh đề xuất các gói viện trợ, vốn vay ưu đãi và cử cố vấn kỹ thuật để hỗ trợ chính quyền mới củng cố vị thế. Truyền thông nhà nước Trung Quốc lập tức lên án đây là hành vi can thiệp thô bạo vào công việc nội bộ."
 vie_int.6.a:0 "Tiếp nhận các khoản viện trợ"
 vie_int.6.b:0 "Từ chối viện trợ để giữ nguyên mọi cánh cửa lựa chọn"
 vie_int.7.t:0 "Bắc Kinh Đề nghị Hỗ trợ Ổn định Tình hình Việt Nam"
 vie_int.7.d:0 "Khi nội chiến leo thang ác liệt, Trung Quốc ngỏ ý sẵn sàng cung cấp 'hỗ trợ lập lại trật tự' và bóng gió chuẩn bị bảo vệ kiều dân cùng các lợi ích cốt lõi của họ."
 vie_int.7.a:0 "Thẳng thừng bác bỏ đề xuất"
 vie_int.7.b:0 "Chấp nhận sự hỗ trợ hạn chế"
 vie_int.7.c:0 "Kêu gọi sự can thiệp của ASEAN và Liên Hợp Quốc"
 vie_int.8.t:0 "Làn sóng Tị nạn nơi Vùng Biên"
 vie_int.8.d:0 "Hàng ngàn người dân Việt Nam chạy trốn khỏi vùng chiến sự sang Lào, Campuchia hoặc tìm đường vượt biển bằng thuyền. Các nước láng giềng yêu cầu Hà Nội phải làm rõ phương án giải quyết."
 vie_int.8.a:0 "Mở cửa biên giới để tiếp nhận cứu trợ và bảo hộ người sơ tán"
 vie_int.8.b:0 "Đóng cửa biên giới"

 ### Events: collapse (Phase 3)
 vie_col.1.t:0 "Mùa Đông Khủng hoảng"
 vie_col.1.d:0 "Bão giá, biểu tình bạo loạn và tin đồn đảo chính dồn dập xuất hiện. Lòng trung thành của các địa phương dao động mạnh mẽ và các cơ quan an ninh không còn dám chắc mệnh lệnh sẽ được chấp hành. Chính phủ chỉ còn một cơ hội duy nhất để vãn hồi tình thế trước khi sụp đổ."
 vie_col.1.a:0 "Ổn định khẩn cấp bằng bất cứ giá nào"
 vie_col.1.b:0 "Gồng mình vượt qua cơn bão"
 vie_col.2.t:0 "Khủng hoảng Toàn diện"
 vie_col.2.d:0 "Trung ương không còn kiểm soát được các địa phương. Tư lệnh các quân khu, phe cải cách và các thủ lĩnh phong trào đường phố đều tự ý hành động theo toan tính riêng. Vùng thủ đô và các hải đảo vẫn giữ lòng trung thành; phần còn lại của đất nước bị chia cắt."
 vie_col.2.a:0 "Đất nước phân liệt"
 vie_col.4.t:0 "Hội nghị tại Cố Đô Huế"
 vie_col.4.d:0 "Sự kiệt quệ bao trùm lên tất cả các phe phái. Nhiều tiếng nói kêu gọi triệu tập một hội nghị hòa bình tại cố đô Huế, với sự tham gia của mọi bên đối kháng và biểu tượng trung lập của hoàng gia xưa."
 vie_col.4.a:0 "Triệu tập hội nghị hòa bình"
 vie_col.4.b:0 "Từ chối ngồi vào bàn đàm phán"
 vie_col.6.t:0 "Sau Cuộc Chiến"
 vie_col.6.d:0 "Tiếng súng cuối cùng đã chấm dứt. Các thành phố và mạng lưới giao thông đổ nát cần được tái thiết, tù binh cần được trao trả và một chính quyền mới cần được thành lập."
 vie_col.6.a:0 "Vạch ra lộ trình tiến tới bầu cử"
 vie_col.6.c:0 "Tái lập quyền kiểm soát tập trung dưới sự lãnh đạo của Đảng"
 vie_col.6.e:0 "Củng cố trật tự mới"

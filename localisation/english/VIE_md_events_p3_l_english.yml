 ### Events: doors and regime events (Phase 3)
 vie_alt.1.t:0 "Sau Khủng hoảng Giàn khoan"
 vie_alt.1.d:0 "Giàn khoan đã rút đi, song đất nước không còn như trước nữa. Một số ý kiến trong ban lãnh đạo cho rằng Việt Nam đã quá phụ thuộc vào một người láng giềng vừa để lộ nanh vuốt. Những người khác cho rằng chỉ có sức mạnh toàn dân mới bảo vệ được tổ quốc. Quan điểm thứ ba lại khẳng định duy trì sự bình tĩnh là phương sách tốt nhất."
 vie_alt.1.a:0 "Trở lại bình thường với những bài học đã rút ra"
 vie_alt.1.b:0 "Đảng sẽ dẫn dắt con đường tự chủ chiến lược"
 vie_alt.2.t:0 "Kiến nghị và Xã hội Dân sự"
 vie_alt.2.d:0 "Các tầng lớp trí thức, luật sư và nhà báo gửi nhiều bức tâm thư kiến nghị mở rộng tranh luận và công nhận pháp lý cho các hội đoàn độc lập. Một nền báo chí cởi mở hơn đã tạo diễn đàn cho tiếng nói của họ."
 vie_alt.2.a:0 "Khéo léo từ chối"
 vie_alt.2.b:0 "Mở cuộc đối thoại có giới hạn"
 vie_alt.3.t:0 "Khủng hoảng Niềm tin Toàn diện"
 vie_alt.3.d:0 "Hàng loạt đại án nợ xấu, lạm phát phi mã và nỗi bất bình trong nhân dân đã làm lung lay uy tín của chính quyền. Một số muốn siết chặt kỷ cương quyền lực nhà nước; số khác muốn đặt niềm tin vào các tập đoàn kinh tế tư nhân lớn nhất; số còn lại muốn lần lữa vượt qua sóng gió."
 vie_alt.3.a:0 "Ổn định tình hình trong khuôn khổ hệ thống hiện tại"
 vie_alt.3.c:0 "Để các đại tập đoàn đứng ra tự giải quyết"
 vie_alt.6.t:0 "Dự thảo Luật Đặc khu Kinh tế"
 vie_alt.6.d:0 "Dự luật thành lập ba đơn vị hành chính - kinh tế đặc biệt với cơ chế ưu đãi cho nhà đầu tư thuê đất lên tới 99 năm đang được trình trước Quốc hội. Đám đông người dân đã xuống đường biểu tình vì lo sợ đất đai biên cương sẽ rơi vào tay các doanh nghiệp nước ngoài."
 vie_alt.6.a:0 "Đối thoại, lắng nghe người biểu tình"
 vie_alt.6.b:0 "Giữ trật tự, không nhượng bộ"
 vie_alt.7.t:0 "Làn sóng Rút tiền Hàng loạt tại Ngân hàng Lớn"
 vie_alt.7.d:0 "Người gửi tiền xếp hàng dài tại các chi nhánh của một trong những ngân hàng lớn nhất nước. Chủ sở hữu thực sự của ngân hàng đang bị điều tra hình sự, và niềm tin vào toàn bộ hệ thống ngân hàng đang bị đe dọa nghiêm trọng."
 vie_alt.7.a:0 "Nhà nước lập tức can thiệp và bảo đảm chi trả"
 vie_alt.7.b:0 "Để các đại tập đoàn tự thu xếp dàn xếp với nhau"
 vie_alt.8.t:0 "Ai Đang Thuê Đất Đặc khu?"
 vie_alt.8.d:0 "Các phóng viên điều tra phát hiện ra rằng một phần lớn diện tích đất đai tại các đặc khu đang được các công ty đến từ một quốc gia duy nhất thuê lại. Sự phẫn nộ trong dư luận đang bùng phát dữ dội."
 vie_alt.8.a:0 "Thu hồi toàn bộ các quyết định cho thuê đất"
 vie_alt.8.b:0 "Chấp nhận đó là cái giá phải trả cho tăng trưởng"
 vie_alt.12.t:0 "Phe Bảo thủ Theo dõi Bàn Đàm phán"
 vie_alt.12.d:0 "Các cuộc hội đàm bàn tròn đã chính thức bắt đầu, và một nhóm các tướng lĩnh cùng các bậc lão thành trong Đảng đang theo dõi với sự bất an ngày một tăng."
 vie_alt.12.a:0 "Kiên quyết xúc tiến các cuộc hội đàm"
 vie_alt.12.b:0 "Làm chậm tiến trình để trấn an phe bảo thủ"
 vie_alt.13.t:0 "Bản Hiến pháp Mới"
 vie_alt.13.d:0 "Dự thảo hiến pháp mới bảo đảm quyền tự do bầu cử, một nền tư pháp độc lập và các quyền tự do công dân đã hoàn tất. Bản dự thảo có thể được đưa ra trưng cầu dân ý toàn quốc hoặc biểu quyết thông qua tại quốc hội."
 vie_alt.13.a:0 "Đưa ra trưng cầu dân ý toàn dân"
 vie_alt.13.b:0 "Thông qua tại nghị viện"
 vie_alt.14.t:0 "Cuộc Tổng Tuyển cử Tự do Đầu tiên"
 vie_alt.14.d:0 "Cử tri trên khắp cả nước lần đầu tiên sau nhiều thập kỷ được bỏ phiếu trong một cuộc bầu cử tự do đa đảng. Ba lực lượng dẫn đầu cuộc đua là phái tự do, phái bảo thủ và phái xã hội."
 vie_alt.14.a:0 "Đảng Dân chủ Tự do giành thắng lợi"
 vie_alt.14.b:0 "Đảng Bảo thủ giành thắng lợi"
 vie_alt.14.c:0 "Đảng Xã hội giành thắng lợi"

 ### Events: international reactions (Phase 3)
 vie_int.2.t:0 "Căng thẳng Bùng phát Nơi Biên giới"
 vie_int.2.d:0 "Quân đội Trung Quốc đã tổ chức các cuộc tập trận quy mô lớn dọc tuyến biên giới khi các phát ngôn từ phía phong trào ngày càng gay gắt. Các vụ chạm trán nhỏ lẻ đang gia tăng nhanh chóng."
 vie_int.2.a:0 "Tăng cường quân lực bảo vệ biên cương"
 vie_int.2.b:0 "Chủ động hạ nhiệt căng thẳng"
 vie_int.6.t:0 "Đề xuất Viện trợ cho Thể chế Mới"
 vie_int.6.d:0 "Washington và các đồng minh đề xuất các gói viện trợ, vốn vay ưu đãi và cử cố vấn kỹ thuật để hỗ trợ chính quyền mới củng cố vị thế. Truyền thông nhà nước Trung Quốc lập tức lên án đây là hành vi can thiệp thô bạo vào công việc nội bộ."
 vie_int.6.a:0 "Tiếp nhận các khoản viện trợ"
 vie_int.6.b:0 "Từ chối viện trợ để giữ nguyên mọi cánh cửa lựa chọn"

 ### Events: collapse (Phase 3)

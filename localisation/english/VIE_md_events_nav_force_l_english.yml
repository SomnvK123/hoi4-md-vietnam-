l_english:
 VIE_nf_training_standardization:0 "Chuẩn hóa Đào tạo Hải quân"
 VIE_nf_training_standardization_desc:0 "Thống nhất giáo trình, khung sĩ quan và tiêu chuẩn kíp tàu cho toàn quân chủng. Đây là nền cho hai lực lượng mặt nước và tàu ngầm, và mở nhóm quyết định xây dựng lực lượng."
 VIE_nf_surface_force:0 "Phát triển Lực lượng Tàu mặt nước"
 VIE_nf_surface_force_desc:0 "Xây dựng khung sĩ quan và chuẩn hóa kíp tàu cho các biên đội tàu mặt nước. Mở quyết định huấn luyện lực lượng tàu mặt nước."
 VIE_nf_submarine_force:0 "Phát triển Lực lượng Tàu ngầm"
 VIE_nf_submarine_force_desc:0 "Chuẩn bị nhân lực và tổ chức cho lực lượng tàu ngầm trước khi nhận tàu. Mở quyết định huấn luyện lực lượng tàu ngầm."
 VIE_nf_command_reform_1:0 "Cải cách Bộ chỉ huy Hải quân I"
 VIE_nf_command_reform_1_desc:0 "Dựng bộ chỉ huy hải quân với ba thành phần: tàu mặt nước, tàu ngầm và bảo đảm. Mở quyết định huấn luyện hiệp đồng hạm đội."
 VIE_nf_first_force:0 "Cơ cấu Lực lượng Ban đầu"
 VIE_nf_first_force_desc:0 "Chọn ưu tiên cho lực lượng hải quân đầu tiên dựa trên số thân tàu đã tiếp nhận và năng lực bảo dưỡng hoặc đóng tàu nhỏ trong nước. Mở quyết định cơ cấu lực lượng."
 VIE_nf_command_reform_2:0 "Cải cách Bộ chỉ huy Hải quân II"
 VIE_nf_command_reform_2_desc:0 "Tổ chức lại thành biên đội và hải đoàn, hợp nhất chỉ huy tác chiến."
 VIE_nf_medium_force:0 "Lực lượng Hải quân Trung bình"
 VIE_nf_medium_force_desc:0 "Nâng lực lượng từ tuần tra ven bờ lên các biên đội cỡ trung: hộ vệ hạm nhẹ, khinh hạm, chống ngầm cơ động và tàu ngầm khu vực. Mở các chương trình mua sắm bổ sung (chương trình 1B)."
 VIE_nf_operating_range:0 "Mở rộng Phạm vi Hoạt động"
 VIE_nf_operating_range_desc:0 "Tăng tầm hoạt động và khả năng phát hiện của hạm đội. Đây là điểm rẽ chiến lược: Ngăn chặn biển, Hải quân khu vực hay Hải quân viễn dương."
 VIE_nf_hulls_4_tt:0 "Đã tiếp nhận hơn §Y3§! thân tàu chiến đấu"
 VIE_nf_denial:0 "Ngăn chặn biển (Maritime Denial)"
 VIE_nf_denial_desc:0 "Dựa vào tàu ngầm, tàu tên lửa nhanh và tên lửa bờ để ngăn đối phương hoạt động gần bờ biển Việt Nam. Đây là hướng gần nhất với thực tế của Hải quân Nhân dân."
 VIE_nf_denial_defence:0 "Phòng thủ Ven bờ Tích hợp"
 VIE_nf_denial_defence_desc:0 "Kết nối trạm radar, tên lửa bờ, bãi mìn và các biên đội ven bờ thành một hệ thống phòng thủ."
 VIE_nf_denial_subs:0 "Lực lượng Tàu ngầm Ngăn chặn"
 VIE_nf_denial_subs_desc:0 "Phát triển lực lượng tàu ngầm làm xương sống cho nhiệm vụ ngăn chặn."
 VIE_nf_denial_command:0 "Bộ chỉ huy Phòng thủ Ven bờ"
 VIE_nf_denial_command_desc:0 "Dựng bộ chỉ huy thống nhất cho phòng thủ ven bờ, hoàn tất nhánh Ngăn chặn biển."
 VIE_nf_greenwater:0 "Hải quân Khu vực"
 VIE_nf_greenwater_desc:0 "Mở rộng hoạt động ra toàn vùng biển Đông Nam Á bằng khinh hạm viễn hành và hạm đội đổ bộ."
 VIE_nf_regional_frigates:0 "Khinh hạm Viễn hành"
 VIE_nf_regional_frigates_desc:0 "Đưa khinh hạm đủ tầm hoạt động và tự duy trì cho các chuyến hải trình dài."
 VIE_nf_amphibious_fleet:0 "Hạm đội Đổ bộ"
 VIE_nf_amphibious_fleet_desc:0 "Tổ chức tàu và biên đội đổ bộ cho nhiệm vụ trên biển và đảo. Lực lượng hải quân đánh bộ thuộc nhánh khác."
 VIE_nf_lhd_program:0 "Chương trình Tàu đổ bộ Trực thăng"
 VIE_nf_lhd_program_desc:0 "Chuẩn bị đưa tàu đổ bộ trực thăng vào biên chế, mở chương trình mua sắm tàu đổ bộ."
 VIE_nf_regional_command:0 "Bộ chỉ huy Hạm đội Khu vực"
 VIE_nf_regional_command_desc:0 "Dựng bộ chỉ huy hạm đội khu vực, hoàn tất nhánh Hải quân khu vực."
 VIE_nf_bluewater:0 "Hải quân Viễn dương"
 VIE_nf_bluewater_desc:0 "Hướng tới hoạt động xa bờ lâu dài với khu trục, tàu sân bay và hậu cần hạm đội."
 VIE_nf_ocean_escort:0 "Chương trình Hộ tống Viễn dương"
 VIE_nf_ocean_escort_desc:0 "Chuẩn bị khu trục và hộ vệ hạm đủ sức bảo vệ lực lượng trên biển xa."
 VIE_nf_replenishment:0 "Bảo đảm Hậu cần Hạm đội"
 VIE_nf_replenishment_desc:0 "Tiếp tế trên biển và hậu cần là điều kiện bắt buộc cho hoạt động viễn dương."
 VIE_nf_naval_aviation:0 "Không quân Hải quân"
 VIE_nf_naval_aviation_desc:0 "Xây dựng không quân hải quân làm điều kiện cho tàu sân bay hạng nhẹ."
 VIE_nf_carrier_group:0 "Nhóm Tác chiến Tàu sân bay"
 VIE_nf_carrier_group_desc:0 "Hoàn tất nhánh viễn dương. Hiệu ứng tổ chức tăng theo số tàu sân bay thực tế sau khi lập nhóm tác chiến."
 VIE_nf_branch_mismatch_idea:0 "Chi phí chuyển đổi nhánh"
 VIE_nf_branch_mismatch_idea_desc:0 "Hướng chiến lược đã chọn lệch với cơ cấu lực lượng ban đầu, nên tổ chức hạm đội tạm thời kém hơn khi chuyển đổi."
 VIE_naval_force_category:0 "Xây dựng Lực lượng Hải quân"
 VIE_naval_force_category_desc:0 "Đào tạo, tổ chức và xác định hướng đi cho các lực lượng tàu mặt nước, tàu ngầm và hạm đội.\n\n§YChương trình đang chạy:§! [?VIE_var_force_program_active|0] / 2\n§gTối đa hai chương trình cùng lúc. Phần thưởng là các chỉ số vận hành (tổ chức, hiệp đồng, phát hiện), không phải tàu hay chi phí đóng tàu.§!"
 VIE_nf_slot_tt:0 "Đang chạy ít hơn §Y2§! chương trình xây dựng lực lượng"
 VIE_nf_d1_surface:0 "Huấn luyện Lực lượng Tàu mặt nước"
 VIE_nf_d1_surface_desc:0 "Chuẩn hóa kíp tàu và khung sĩ quan cho lực lượng tàu mặt nước, chọn chuyên môn hỏa lực hoặc chống ngầm.\n\n§gChi phí 0,40 tỷ (cơ bản) hoặc 0,60 tỷ (chuyên sâu).§!"
 VIE_nf_d2_submarine:0 "Huấn luyện Lực lượng Tàu ngầm"
 VIE_nf_d2_submarine_desc:0 "Chuẩn bị nhân lực và tổ chức cho lực lượng tàu ngầm. Khởi động chương trình là bước chuẩn bị cho các hợp đồng tàu ngầm.\n\n§gChi phí từ 0,30 đến 0,75 tỷ tùy định hướng và mức đầu tư.§!"
 VIE_nf_d3_fleet_coord:0 "Huấn luyện Hiệp đồng Hạm đội"
 VIE_nf_d3_fleet_coord_desc:0 "Huấn luyện hiệp đồng giữa tàu mặt nước và tàu ngầm, kèm mạng lưới chống ngầm ven bờ."
 VIE_nf_d4_first_force:0 "Cơ cấu Lực lượng Ban đầu"
 VIE_nf_d4_first_force_desc:0 "Chọn ưu tiên cho lực lượng hải quân đầu tiên: phòng thủ ven bờ, cân bằng hoặc tầm xa."
 VIE_nf_prog_surface:0 "Huấn luyện tàu mặt nước đang thực hiện"
 VIE_nf_prog_surface_desc:0 "Chương trình huấn luyện đang chạy. Hoàn tất khi thời hạn kết thúc."
 VIE_nf_prog_sub:0 "Huấn luyện tàu ngầm đang thực hiện"
 VIE_nf_prog_sub_desc:0 "Chương trình huấn luyện đang chạy. Hoàn tất khi thời hạn kết thúc."
 VIE_nf_prog_coord:0 "Huấn luyện hiệp đồng đang thực hiện"
 VIE_nf_prog_coord_desc:0 "Chương trình huấn luyện đang chạy. Hoàn tất khi thời hạn kết thúc."
 VIE_nf_prog_first:0 "Xây dựng cơ cấu lực lượng đang thực hiện"
 VIE_nf_prog_first_desc:0 "Chương trình đang chạy. Hoàn tất khi thời hạn kết thúc."
 VIE_nf_prog_csg:0 "Lập nhóm tác chiến đang thực hiện"
 VIE_nf_prog_csg_desc:0 "Chương trình đang chạy. Hoàn tất khi thời hạn kết thúc."

 vie_nav_force.1.t:0 "Huấn luyện lực lượng tàu mặt nước: mức đầu tư"
 vie_nav_force.1.d:0 "Bộ tư lệnh Hải quân đề nghị chương trình chuẩn hóa kíp tàu cho các biên đội tàu mặt nước. Mức đầu tư quyết định thời gian và độ sâu của chương trình."
 vie_nav_force.1.a:0 "Cơ bản: 0,40 tỷ USD, 12 tháng"
 vie_nav_force.1.b:0 "Chuyên sâu: 0,60 tỷ USD, 18 tháng, thưởng cao hơn 50%"
 vie_nav_force.2.t:0 "Huấn luyện lực lượng tàu mặt nước: chuyên môn"
 vie_nav_force.2.d:0 "Cần chọn trọng tâm huấn luyện. Hỏa lực tăng sức tấn công và tổ chức; chống ngầm tăng khả năng phòng thủ trước tàu ngầm và khả năng phát hiện. Hướng còn lại chỉ được bù một phần qua huấn luyện hiệp đồng hạm đội."
 vie_nav_force.2.a:0 "Hỏa lực: radar, pháo, tên lửa và phòng không"
 vie_nav_force.2.b:0 "Chống ngầm: sonar và hiệp đồng trực thăng"
 vie_nav_force.10.t:0 "Huấn luyện lực lượng tàu ngầm: định hướng"
 vie_nav_force.10.d:0 "Sĩ quan và kíp tàu ngầm cần được chuẩn bị trước khi nhận tàu. Có thể làm đúng tiến độ nhận tàu hoặc chuẩn bị sớm hơn với chi phí cao hơn. Dù chọn cách nào, việc chuẩn bị nhân lực bắt đầu ngay và giúp gói huấn luyện tàu ngầm Kilo rẻ hơn."
 vie_nav_force.10.a:0 "Lịch sử: chuẩn bị nhân lực đúng tiến độ nhận tàu"
 vie_nav_force.10.b:0 "Sớm: chuẩn bị sớm hơn, đắt hơn, phát hiện cao hơn"
 vie_nav_force.11.t:0 "Huấn luyện lực lượng tàu ngầm: mức đầu tư"
 vie_nav_force.11.d:0 "Mức đầu tư quyết định thời gian và độ sâu của chương trình. Chi phí: định hướng lịch sử 0,30 hoặc 0,45 tỷ, định hướng sớm 0,50 hoặc 0,75 tỷ."
 vie_nav_force.11.a:0 "Cơ bản: 12 tháng"
 vie_nav_force.11.b:0 "Chuyên sâu: 18 tháng, thưởng cao hơn 50%"
 vie_nav_force.61.t:0 "Huấn luyện tàu mặt nước hoàn tất"
 vie_nav_force.61.d:0 "Chương trình huấn luyện lực lượng tàu mặt nước đã hoàn tất. Chỉ số vận hành theo chuyên môn đã chọn được cộng vào hải quân."
 vie_nav_force.61.a:0 "Tốt."
 vie_nav_force.62.t:0 "Huấn luyện tàu ngầm hoàn tất"
 vie_nav_force.62.d:0 "Chương trình huấn luyện lực lượng tàu ngầm đã hoàn tất. Chỉ số tấn công và phát hiện của tàu ngầm được cộng vào hải quân."
 vie_nav_force.62.a:0 "Tốt."
 VIE_nf_d5_carrier_group:0 "Lập Nhóm Tác chiến Tàu sân bay"
 VIE_nf_d5_carrier_group_desc:0 "Lập nhóm tác chiến quanh tàu sân bay và các khu trục hộ tống. Hiệu ứng tổ chức tăng theo số tàu sân bay đã tiếp nhận.\n\n§gChi phí 1,0 tỷ USD.§!"
 VIE_nf_d1_done_tt:0 "Đã hoàn tất huấn luyện lực lượng tàu mặt nước"
 VIE_nf_d2_done_tt:0 "Đã hoàn tất huấn luyện lực lượng tàu ngầm"
 VIE_nf_carrier_tt:0 "Đã tiếp nhận ít nhất §Y1§! tàu sân bay"
 VIE_nf_destroyers_tt:0 "Đã tiếp nhận ít nhất §Y2§! khu trục"

 vie_nav_force.30.t:0 "Cơ cấu lực lượng ban đầu"
 vie_nav_force.30.d:0 "Sau những thân tàu đầu tiên, Bộ tư lệnh cần quyết định ưu tiên cho lực lượng: tàu nhanh và tên lửa bờ cho phòng thủ ven bờ, cân bằng mọi mặt, hay tầm xa cho hải quân khu vực. Lựa chọn nhánh chiến lược sau này nên khớp với ưu tiên này; lệch nhánh phải chịu chi phí chuyển đổi."
 vie_nav_force.30.a:0 "Phòng thủ ven bờ: tấn công tàu mặt nước +2%, tầm hoạt động -3%"
 vie_nav_force.30.b:0 "Cân bằng: bonus nhỏ đều mọi mặt"
 vie_nav_force.30.c:0 "Tầm xa: tầm hoạt động +4%, tổ chức +2%, chi phí duy trì nhân sự +3%"
 vie_nav_force.63.t:0 "Huấn luyện hiệp đồng hạm đội hoàn tất"
 vie_nav_force.63.d:0 "Chương trình hiệp đồng giữa tàu mặt nước và tàu ngầm, cùng mạng lưới chống ngầm ven bờ, đã hoàn tất."
 vie_nav_force.63.a:0 "Tốt."
 vie_nav_force.64.t:0 "Cơ cấu lực lượng ban đầu hoàn tất"
 vie_nav_force.64.d:0 "Lực lượng hải quân đã được tổ chức theo ưu tiên đã chọn."
 vie_nav_force.64.a:0 "Tốt."
 vie_nav_force.65.t:0 "Nhóm tác chiến tàu sân bay đã lập"
 vie_nav_force.65.d:0 "Nhóm tác chiến quanh tàu sân bay đã đi vào hoạt động. Hiệu ứng tổ chức tăng theo số tàu sân bay thực tế."
 vie_nav_force.65.a:0 "Tốt."

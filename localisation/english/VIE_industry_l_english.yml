l_english:
 VIE_vinashin_restructuring_sbic:0 "Tái cơ cấu Vinashin thành SBIC"
 VIE_vinashin_restructuring_sbic_desc:0 "Sau vụ vỡ nợ năm 2010, ngày 21/10/2013 Vinashin được chuyển từ tập đoàn về mô hình tổng công ty, đổi tên thành Tổng công ty Công nghiệp tàu thủy (SBIC). Trong 234 doanh nghiệp thành viên, phần lớn bị bán, giải thể hoặc phá sản. Bản thân SBIC vẫn thua lỗ kéo dài và đến cuối năm 2023 bị đưa vào lộ trình phá sản."
 VIE_shipbuilding_joint_ventures:0 "Liên doanh đóng tàu với nước ngoài"
 VIE_shipbuilding_joint_ventures_desc:0 "Các liên doanh với nước ngoài là phần sống khỏe nhất của ngành đóng tàu: Hyundai Vinashin ở Khánh Hòa (liên doanh từ năm 1996, đổi tên thành Đóng tàu Hyundai Việt Nam năm 2020) và Damen - Sông Cấm ở Hải Phòng (thành lập năm 2011, Damen góp 70% vốn) đóng tàu xuất khẩu theo tiêu chuẩn châu Âu."
 VIE_hoa_phat_dung_quat_2:0 "Khu liên hợp Gang thép Dung Quất 2"
 VIE_hoa_phat_dung_quat_2_desc:0 "Dự án Dung Quất 2 của Hòa Phát (tổng vốn khoảng 85.000 tỷ đồng, công suất thiết kế 5,6 triệu tấn thép cán nóng mỗi năm) đưa lò cao số 1 vào vận hành đầu năm 2025, giảm phụ thuộc vào thép tấm nhập khẩu cho đóng tàu, ô tô và cơ khí."
 VIE_textile_garment_exports:0 "Dệt may và Da giày xuất khẩu"
 VIE_textile_garment_exports_desc:0 "Dệt may và da giày tạo việc làm cho hàng triệu lao động, phần lớn là phụ nữ từ nông thôn. Sau khi gia nhập WTO, đây là ngành xuất khẩu chủ lực, nhưng chủ yếu vẫn là gia công."
 VIE_cptpp_yarn_forward:0 "Quy tắc xuất xứ \"từ sợi trở đi\""
 VIE_cptpp_yarn_forward_desc:0 "CPTPP (có hiệu lực với Việt Nam từ 14/1/2019) chỉ ưu đãi thuế cho hàng may mặc khi cả ba công đoạn kéo sợi, dệt nhuộm và cắt may diễn ra trong khối, tức quy tắc \"từ sợi trở đi\". Muốn hưởng lợi, Việt Nam phải tự xây dựng khâu sợi và vải thay vì nhập từ ngoài khối."
 VIE_textile_dyeing_parks:0 "Khu công nghiệp dệt nhuộm tập trung"
 VIE_textile_dyeing_parks_desc:0 "Gom các nhà máy dệt nhuộm vào khu công nghiệp có hệ thống xử lý nước thải chung. Khâu nhuộm bị nhiều địa phương e ngại vì ô nhiễm, nhưng thiếu nó thì chuỗi cung ứng dệt may không khép kín được."
 VIE_green_textiles:0 "Dệt may xanh theo chuẩn châu Âu"
 VIE_green_textiles_desc:0 "Để giữ thị trường EU sau EVFTA, doanh nghiệp dệt may chuyển sang năng lượng tái tạo, tái chế nước và truy xuất nguồn gốc nguyên liệu theo yêu cầu của người mua."
 VIE_nq23_industrial_policy:0 "Chính sách công nghiệp quốc gia (NQ 23)"
 VIE_nq23_industrial_policy_desc:0 "Nghị quyết 23-NQ/TW ngày 22/3/2018 của Bộ Chính trị đặt mục tiêu đến năm 2030 hoàn thành công nghiệp hóa, hiện đại hóa: công nghiệp chiếm trên 40% GDP, chế biến chế tạo khoảng 30%. Công nghệ thông tin và điện tử là hướng đi chính, chế biến chế tạo là trung tâm, sản xuất thông minh là bước đột phá."
 VIE_eco_industrial_parks:0 "Khu công nghiệp sinh thái"
 VIE_eco_industrial_parks_desc:0 "Nghị định 82/2018/NĐ-CP (22/5/2018) lần đầu quy định khu công nghiệp sinh thái: doanh nghiệp sản xuất sạch hơn, dùng tài nguyên hiệu quả và cộng sinh công nghiệp với nhau, được ưu tiên vay vốn từ Quỹ Bảo vệ môi trường."
 VIE_nq29_industrialization_2045:0 "Đẩy mạnh công nghiệp hóa đến 2045 (NQ 29)"
 VIE_nq29_industrialization_2045_desc:0 "Nghị quyết 29-NQ/TW ngày 17/11/2022 là nghị quyết chuyên đề đầu tiên của Đảng về công nghiệp hóa, hiện đại hóa. Tầm nhìn đến năm 2045: Việt Nam trở thành nước phát triển, thu nhập cao, thuộc nhóm các nước công nghiệp phát triển hàng đầu châu Á."
 VIE_investment_support_fund:0 "Quỹ Hỗ trợ đầu tư"
 VIE_investment_support_fund_desc:0 "Thuế tối thiểu toàn cầu áp dụng từ năm 2024 làm mất tác dụng của ưu đãi thuế truyền thống. Nghị định 182/2024/NĐ-CP lập Quỹ Hỗ trợ đầu tư, lấy từ khoản thuế bổ sung, để hỗ trợ trực tiếp cho doanh nghiệp công nghệ cao, dự án nghiên cứu phát triển và đào tạo nhân lực, tối đa 5 năm mỗi dự án."
 VIE_modern_industrial_nation_2030:0 "Nền công nghiệp hiện đại"
 VIE_modern_industrial_nation_2030_desc:0 "Năng suất, mạng lưới nhà cung ứng và nhiều ngành chế tạo đã phát triển đủ sâu để nâng vị thế công nghiệp của Việt Nam. Thành tựu có thể dựa trên các ngành truyền thống, điện tử hoặc công nghệ mới."
 VIE_textile_supply_chain_idea:0 "Chuỗi cung ứng dệt may khép kín"
 VIE_textile_supply_chain_idea_desc:0 "Từ sợi, dệt, nhuộm đến may được làm trong nước, giúp hàng dệt may hưởng ưu đãi thuế của các hiệp định thương mại thế hệ mới."
 VIE_industrialization_2045_idea:0 "Công nghiệp hóa đến 2045"
 VIE_industrialization_2045_idea_desc:0 "Toàn hệ thống chính trị tập trung cho mục tiêu trở thành nước công nghiệp: đất đai, vốn và nhân lực được ưu tiên cho khu vực chế biến chế tạo."
 VIE_modern_industrial_nation_idea:0 "Nước công nghiệp hiện đại"
 VIE_modern_industrial_nation_idea_desc:0 "Công nghiệp chế biến chế tạo hiện đại, chuỗi cung ứng nội địa sâu và năng lực tự chủ trong các ngành công nghiệp nền tảng."
 VIE_ind_localization_tt:0 "Điểm năng lực nội địa hóa: $RIGHT|+=0$"
 VIE_apple_supply_chain:0 "Chuỗi cung ứng Apple và các hãng công nghệ"
 VIE_apple_supply_chain_desc:0 "Các nhà cung cấp của Apple như Luxshare, Goertek và Foxconn mở rộng nhà máy ở Bắc Giang, Bắc Ninh, Nghệ An. Từ năm 2020 Việt Nam lắp ráp tai nghe AirPods, và số nhà cung cấp của Apple có nhà máy tại Việt Nam tăng mạnh."
 VIE_osat_packaging:0 "Đóng gói và kiểm thử chip"
 VIE_osat_packaging_desc:0 "Các nhà máy Hana Micron và Amkor mở rộng đóng gói, kiểm thử tại miền Bắc; Amkor khánh thành nhà máy Bắc Ninh tháng 10/2023. Năng lực OSAT có thể phát triển song song với thiết kế và không bắt buộc phải sở hữu nhà máy chế tạo wafer."
 VIE_offshore_wind_fabrication:0 "Chế tạo kết cấu điện gió ngoài khơi"
 VIE_offshore_wind_fabrication_desc:0 "Các xưởng cơ khí dầu khí chuyển sang chế tạo kết cấu điện gió ngoài khơi. Theo hợp đồng ký với Ørsted tháng 5/2023, PTSC chế tạo 33 chân đế cho dự án Greater Changhua 2b và 4 ở Đài Loan, hợp đồng xuất khẩu lớn đầu tiên của Việt Nam trong lĩnh vực này."
 VIE_industrial_productivity_program:0 "Nâng cao năng suất lao động công nghiệp"
 VIE_industrial_productivity_program_desc:0 "Hỗ trợ doanh nghiệp cải tiến quy trình, chuẩn hóa quản lý chất lượng và nâng kỹ năng lao động. Năng suất và năng lực nhà cung ứng tạo nền tảng chung cho các ngành công nghiệp."
 VIE_origin_fraud_scrutiny:0 "Bị giám sát gian lận xuất xứ"
 VIE_origin_fraud_scrutiny_desc:0 "Các đối tác thương mại nghi ngờ hàng hóa nước thứ ba đội lốt hàng Việt Nam để né thuế, kéo theo điều tra chống lẩn tránh và đơn hàng bị trì hoãn."
 vie_ind.1.t:0 "Làn sóng dịch chuyển chuỗi cung ứng"
 vie_ind.1.d:0 "Chiến tranh thương mại Mỹ - Trung khiến hàng loạt nhà máy tìm nơi đặt mới ngoài Trung Quốc. Các khu công nghiệp phía Bắc kín đơn đăng ký. Câu hỏi là nhận tất cả hay chỉ chọn những dự án mang theo công nghệ và liên kết với doanh nghiệp trong nước."
 vie_ind.1.a:0 "Mở cửa tối đa, nhận mọi dự án."
 vie_ind.1.b:0 "Chọn lọc dự án có công nghệ và tỷ lệ nội địa hóa."
 vie_ind.2.t:0 "Nghi vấn gian lận xuất xứ"
 vie_ind.2.d:0 "Một số doanh nghiệp mới đến chỉ lắp ráp đơn giản rồi dán nhãn \"Made in Vietnam\" để né thuế. Đối tác thương mại lớn yêu cầu Việt Nam siết chặt kiểm tra, nếu không sẽ mở điều tra chống lẩn tránh thuế."
 vie_ind.2.a:0 "Siết chặt kiểm tra xuất xứ."
 vie_ind.2.b:0 "Không can thiệp sâu."

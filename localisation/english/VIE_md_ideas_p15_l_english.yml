l_english:
 VIE_xcb01_mechanized_idea:0 "Cơ giới hóa theo chuẩn XCB-01"
 VIE_xcb01_mechanized_idea_desc:0 "Việc tiếp nhận và làm chủ khung gầm xe chiến đấu bộ binh XCB-01 nâng sức mạnh tiến công của lực lượng cơ giới và giảm giá thành khung gầm xe thiết giáp hạng trung."
 VIE_k9_localization_idea:0 "Nội địa hóa pháo tự hành K9"
 VIE_k9_localization_idea_desc:0 "Chuyển giao công nghệ và sản xuất trong nước pháo tự hành K9 mở rộng nền tảng nghiên cứu của ngành pháo binh, từ khung gầm đến hệ thống điều khiển hỏa lực."
 VIE_def_ind_core_idea:0 "Doanh nghiệp quân đội làm nòng cốt"
 VIE_def_ind_core_idea_desc:0 "Các cơ sở công nghiệp quốc phòng thuộc Bộ Quốc phòng được đầu tư tập trung và giữ vai trò chủ đạo. Hiệu quả sản xuất và năng lực nhà máy cao hơn, nhưng chi phí cho khu vực dân sự lớn hơn."
 VIE_def_ind_divest_idea:0 "Cơ cấu lại doanh nghiệp quốc phòng"
 VIE_def_ind_divest_idea_desc:0 "Nhà nước chỉ giữ các cơ sở thiết yếu; phần còn lại đã cổ phần hóa hoặc thoái vốn. Xây dựng nhà máy vũ khí nhanh hơn và có thêm nguồn thu, nhưng năng lực động viên mỏng hơn và ổn định xã hội giảm."
 VIE_self_reliant_deterrence_idea:0 "Nền quốc phòng tự chủ"
 VIE_self_reliant_deterrence_idea_desc:0 "Công nghiệp quốc phòng trong nước đủ năng lực trang bị, sửa chữa và tiếp tế cho quân đội trong một cuộc xung đột kéo dài mà không phụ thuộc nguồn cung nước ngoài. Đây là nền tảng vật chất của chính sách quốc phòng hòa bình, tự vệ và chính sách bốn không."

 VIE_hl_rp_below_56_tt:0 "Áp lực cải cách dưới 56 (chưa ở mức Căng thẳng)"

 # ---- Phase 4: reaction events vie_hl.2 - .8, extra ideas and pressure tooltips
 VIE_hl_rp_m3_tt:0 "Áp lực cải cách giảm §G3§!"
 VIE_hl_rp_m5_tt:0 "Áp lực cải cách giảm §G5§!"
 VIE_hl_rp_m20_tt:0 "Áp lực cải cách giảm §G20§!"
 VIE_hl_investors_wary_idea:0 "Nhà đầu tư dè chừng"
 VIE_hl_investors_wary_idea_desc:0 "Các nhà đầu tư nước ngoài giữ thái độ chờ đợi trước đường lối siết chặt, kéo năng suất đi xuống."
 VIE_hl_self_reliance_idea:0 "Thời kỳ tự lực"
 VIE_hl_self_reliance_idea_desc:0 "Đường lối kiên trì giữ nguyên trước sức ép: ưu tiên ổn định, tự lực và nhà máy nội địa, đổi lại là năng suất và thương mại bị tổn hại. Áp lực cải cách không tăng quá 80 trong thời kỳ này."

 vie_hl.2.t:0 "Thư kiến nghị của các đồng chí lão thành"
 vie_hl.2.d:0 "Một nhóm nguyên lãnh đạo và cán bộ lão thành gửi thư tới Bộ Chính trị, lo ngại việc chỉnh đốn đang đi quá nhanh và đụng chạm tới nhiều cán bộ có công. Họ đề nghị xem xét lại cách làm, không phải mục tiêu."
 vie_hl.2.a:0 "Tiếp thu ý kiến, điều chỉnh cách làm"
 vie_hl.2.b:0 "Ghi nhận nhưng giữ nguyên chủ trương"

 vie_hl.3.t:0 "Doanh nghiệp FDI tạm hoãn đầu tư"
 vie_hl.3.d:0 "Hiệp hội các nhà đầu tư nước ngoài thông báo tạm hoãn một số dự án mở rộng. Họ cho rằng quy định về dòng vốn và chuyển giá còn thiếu rõ ràng, và việc đảng viên không được làm kinh tế tư nhân khiến nhiều đối tác địa phương rút lui."
 vie_hl.3.a:0 "Trấn an: ban hành hướng dẫn rõ ràng và ưu đãi bổ sung"
 vie_hl.3.b:0 "Không thay đổi, dòng vốn sẽ tự điều chỉnh"

 vie_hl.4.t:0 "Cảnh báo về cam kết lao động và thương mại"
 vie_hl.4.d:0 "Đối tác trong EVFTA và CPTPP gửi công hàm quan ngại về việc quản lý nội dung mạng và báo chí, cho rằng ảnh hưởng tới các cam kết về tự do hiệp hội và minh bạch thông tin trong hiệp định."
 vie_hl.4.a:0 "Điều chỉnh để tuân thủ các cam kết"
 vie_hl.4.b:0 "Giữ lập trường, chấp nhận ảnh hưởng quan hệ"

 vie_hl.5.t:0 "Hội nghị Trung ương đánh giá giữa nhiệm kỳ"
 vie_hl.5.d:0 "Ban Chấp hành Trung ương họp đánh giá việc thực hiện đường lối Kiên định. Có ba luồng ý kiến: giữ nguyên nhịp độ, nới nhẹ để giảm áp lực, hoặc siết thêm để hoàn tất các mục tiêu chỉnh đốn."
 vie_hl.5.a:0 "Giữ nguyên"
 vie_hl.5.b:0 "Nới nhẹ để giảm áp lực"
 vie_hl.5.c:0 "Siết thêm"

 vie_hl.6.t:0 "Dư luận về Biển Đông"
 vie_hl.6.d:0 "Căng thẳng ở Biển Đông leo thang khiến dư luận trong nước đặt câu hỏi về quan hệ gần gũi giữa các đảng với phía Trung Quốc."
 vie_hl.6.a:0 "Khẳng định chủ quyền, hợp tác không có nghĩa là lệ thuộc"
 vie_hl.6.b:0 "Giải thích và trấn an dư luận"

 vie_hl.7.t:0 "Khủng hoảng chính danh"
 vie_hl.7.d:0 "Áp lực cải cách đã chạm ngưỡng. Doanh nghiệp rút vốn, cán bộ nội bộ bất mãn và dư luận ngày càng gay gắt. Hội nghị Trung ương phải quyết định: lùi một bước để lấy lại ổn định, hoặc kiên trì đường lối và chấp nhận cái giá."
 vie_hl.7.a:0 "Lùi một bước, điều chỉnh đường lối"
 vie_hl.7.b:0 "Kiên trì: bước vào thời kỳ tự lực"

 vie_hl.8.t:0 "Đánh giá lại sau thời kỳ tự lực"
 vie_hl.8.d:0 "Thời kỳ tự lực kết thúc. Ban lãnh đạo đánh giá kết quả: ổn định đạt được nhưng năng suất và thương mại đều chịu thiệt. Cần quyết định có tiếp tục hay không."
 vie_hl.8.a:0 "Mở lại quan hệ và điều chỉnh"
 vie_hl.8.b:0 "Gia hạn thêm một năm (chỉ một lần)"

 vie_hl.10.t:0 "Ban hành Kế hoạch 5 năm định hướng XHCN"
 vie_hl.10.d:0 "Chính phủ và Ban Chấp hành Trung ương chính thức thông qua Kế hoạch phát triển kinh tế - xã hội 5 năm theo định hướng Xã hội Chủ nghĩa. Kế hoạch xác định rõ vai trò chủ đạo tuyệt đối của kinh tế nhà nước, siết chặt kỷ cương tài chính và ưu tiên nguồn lực cho công nghiệp nặng và quốc phòng."
 vie_hl.10.a:0 "Kiên quyết thực hiện thắng lợi kế hoạch"

 vie_hl.11.t:0 "Tuyên bố Nhất thể hóa Đảng và Nhà nước"
 vie_hl.11.d:0 "Trung ương Đảng tuyên bố hoàn thành lộ trình Nhất thể hóa các chức danh lãnh đạo Đảng và chính quyền các cấp. Bộ máy nhà nước được tinh gọn triệt để, xóa bỏ hoàn toàn sự chồng chéo và phân tán quyền lực, tạo nên một cơ chế chỉ đạo thống nhất và kỷ luật thép."
 vie_hl.11.a:0 "Một ý chí, một hành động"

 vie_hl.12.t:0 "Đại hội Bàn giao Đường lối"
 vie_hl.12.d:0 "Sau một nhiệm kỳ củng cố và chỉnh đốn quyết liệt, Đảng đã làm trong sạch đội ngũ cán bộ và lập lại kỷ cương trật tự. Đại hội Đảng quyết định hoàn thành giai đoạn đặc biệt và bàn giao lại quyền lãnh đạo cho đường lối chính thống, tiếp tục công cuộc Đổi mới và hội nhập sâu rộng trên nền tảng vững chắc đã được tôi luyện."
 vie_hl.12.a:0 "Đất nước bước vào chặng đường mới"

 vie_hl.23.t:0 "Thành lập Liên bang Xã hội Chủ nghĩa Đông Dương"
 vie_hl.23.d:0 "Tại Hà Nội, đại biểu ba nước Việt Nam, Lào và Campuchia đã chính thức ký kết Hiệp ước Liên bang, tuyên bố thành lập Liên bang Xã hội Chủ nghĩa Đông Dương. Ba dân tộc anh em trên bán đảo Đông Dương nay đã hòa làm một, xây dựng một khối phòng thủ và không gian sinh tồn chiến lược hùng mạnh."
 vie_hl.23.a:0 "Muôn năm tình hữu nghị và đoàn kết Đông Dương!"

 vie_hl.100.t:0 "Đường lối Kiên định lên nắm quyền tại Việt Nam"
 vie_hl.100.d:0 "Tin tức từ Hà Nội cho biết Ban Chấp hành Trung ương Đảng Cộng sản Việt Nam đã thông qua nghị quyết quan trọng, khẳng định kiên định nền tảng chủ nghĩa Mác - Lênin và tư tưởng Hồ Chí Minh. Phe kiên định đã chính thức nắm quyền lãnh đạo tối cao, cam kết siết chặt kỷ luật Đảng, củng cố vai trò chủ đạo của kinh tế nhà nước và tái lập các nguyên tắc chuyên chính vô sản."
 vie_hl.100.a:0 "Thời cuộc tại Đông Nam Á đang biến đổi."

 vie_hl.101.t:0 "Liên bang Xã hội Chủ nghĩa Đông Dương ra đời"
 vie_hl.101.d:0 "Việt Nam, Lào và Campuchia đã chính thức hợp nhất thành Liên bang Xã hội Chủ nghĩa Đông Dương dưới sự lãnh đạo thống nhất từ Hà Nội. Sự kiện lịch sử này làm thay đổi căn bản cán cân địa chính trị tại Đông Nam Á và đặt ra những thách thức lớn đối với trật tự khu vực."
 vie_hl.101.a:0 "Một thực thể mới đã hình thành."

 # Indochina decisions localisation
 VIE_hl_indochina_category:0 "Thống nhất Đông Dương"
 VIE_hl_indochina_category_desc:0 "Khối liên kết đặc biệt toàn diện giữa ba nước Đông Dương dưới sự lãnh đạo của Đảng, hướng tới một liên bang xã hội chủ nghĩa vững mạnh."
 VIE_hl_ultimatum_laos:0 "Tối hậu thư Viêng Chăn"
 VIE_hl_ultimatum_laos_desc:0 "Yêu cầu Cộng hòa Dân chủ Nhân dân Lào đặt an ninh, đối ngoại và quốc phòng trong khuôn khổ liên minh đặc biệt Đông Dương dưới sự lãnh đạo của Hà Nội."
 VIE_hl_ultimatum_cambodia:0 "Tối hậu thư Phnôm Pênh"
 VIE_hl_ultimatum_cambodia_desc:0 "Yêu cầu Vương quốc Campuchia đặt an ninh, đối ngoại và quốc phòng trong khuôn khổ liên minh đặc biệt Đông Dương dưới sự lãnh đạo của Hà Nội."
 VIE_hl_unify_indochina:0 "Tuyên bố Thống nhất Đông Dương"
 VIE_hl_unify_indochina_desc:0 "Toàn bộ không gian ba nước Việt Nam - Lào - Campuchia đã nằm trong quyền kiểm soát hoặc liên minh chặt chẽ. Đã đến lúc chính thức tuyên bố thành lập Liên bang Xã hội Chủ nghĩa Đông Dương."
 VIE_hl_indochina_control_tt:0 "Kiểm soát hoặc bảo hộ toàn bộ các vùng lãnh thổ của Lào và Campuchia (các bang 511-517)"


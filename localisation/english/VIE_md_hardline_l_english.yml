 VIE_hl_indochina_alliance:0 "Liên minh đặc biệt Đông Dương"
 VIE_hl_indochina_alliance_desc:0 "Nâng quan hệ đặc biệt với Lào và Campuchia thành một liên minh chính trị do Đảng dẫn dắt, chuẩn bị cho việc thống nhất ba nước Đông Dương."
 VIE_hl_vientiane_ultimatum:0 "Tối hậu thư Viêng Chăn"
 VIE_hl_vientiane_ultimatum_desc:0 "Yêu cầu Lào đặt quốc phòng và đối ngoại dưới sự lãnh đạo của Hà Nội. Nếu bị từ chối, Việt Nam có thể dùng vũ lực."
 VIE_hl_phnom_penh_ultimatum:0 "Tối hậu thư Phnôm Pênh"
 VIE_hl_phnom_penh_ultimatum_desc:0 "Yêu cầu Campuchia đặt quốc phòng và đối ngoại dưới sự lãnh đạo của Hà Nội. Nếu bị từ chối, Việt Nam có thể dùng vũ lực."
 VIE_hl_indochina_union:0 "Thống nhất Đông Dương"
 VIE_hl_indochina_union_desc:0 "Sáp nhập Lào và Campuchia vào Việt Nam, công nhận lãnh thổ của họ là lãnh thổ chính thức. Mở đường cho việc thành lập Liên bang Đông Dương."
 VIE_hl_ultimatum_lao_tt:0 "Gửi tối hậu thư tới §YLào§!: chấp nhận thì trở thành chư hầu, từ chối thì Việt Nam nhận mục tiêu chiến tranh"
 VIE_hl_ultimatum_cbd_tt:0 "Gửi tối hậu thư tới §YCampuchia§!: chấp nhận thì trở thành chư hầu, từ chối thì Việt Nam nhận mục tiêu chiến tranh"
 VIE_hl_indochina_controlled_tt:0 "Kiểm soát cả 7 vùng của Lào và Campuchia (trực tiếp hoặc qua chư hầu)"
 VIE_hl_indochina_controlled_tt_NOT:0 "Chưa kiểm soát cả 7 vùng của Lào và Campuchia"

 VIE_paracel_ultimatum:0 "Thu hồi Quần đảo Hoàng Sa"
 VIE_paracel_ultimatum_desc:0 "Yêu cầu Trung Quốc trao trả Quần đảo Hoàng Sa. §RCảnh báo: sẽ tạo mục tiêu chiến tranh với Trung Quốc.§!"
 VIE_retake_north_spratlys:0 "Thu hồi Bắc Trường Sa"
 VIE_retake_north_spratlys_desc:0 "Lấy lại các đảo ở phía bắc Trường Sa đang do Trung Quốc chiếm giữ. §RCảnh báo: sẽ tạo mục tiêu chiến tranh với Trung Quốc.§!"
 VIE_retake_east_spratlys:0 "Thu hồi Đông Trường Sa"
 VIE_retake_east_spratlys_desc:0 "Lấy lại các đảo ở phía đông Trường Sa đang do Philippines quản lý. §RCảnh báo: sẽ tạo mục tiêu chiến tranh với Philippines, một thành viên ASEAN.§!"
 VIE_retake_south_spratlys:0 "Thu hồi Nam Trường Sa"
 VIE_retake_south_spratlys_desc:0 "Lấy lại các đảo ở phía nam Trường Sa đang do Malaysia quản lý. §RCảnh báo: sẽ tạo mục tiêu chiến tranh với Malaysia, một thành viên ASEAN.§!"


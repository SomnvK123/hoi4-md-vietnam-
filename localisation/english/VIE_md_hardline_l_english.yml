 VIE_hl_pillars_three_tt:0 "Hoàn thành ít nhất ba trong bốn trụ cột (Công nghiệp hóa XHCN, Nhà nước Kỷ luật Sắt, Lá chắn Phòng thủ Thép, Liên bang XHCN Đông Dương)"
 VIE_hl_pillars_all_tt:0 "Hoàn thành toàn bộ bốn trụ cột Kiên định (Công nghiệp hóa XHCN, Nhà nước Kỷ luật Sắt, Lá chắn Phòng thủ Thép, Liên bang XHCN Đông Dương)"

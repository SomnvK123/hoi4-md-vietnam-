l_english:

 ### vie_int.10
 vie_int.10.t:0 "Moskva Đề nghị Sử dụng Căn cứ Cam Ranh"
 vie_int.10.d:0 "Nga, một trong những nhà cung cấp vũ khí truyền thống lâu đời nhất của Việt Nam, đề nghị được tiếp tục sử dụng căn cứ Cam Ranh cho các chiến hạm của mình. Đề xuất đi kèm các khoản tín dụng, giảm giá khí tài và sự đón tiếp nồng hậu. Tuy nhiên, điều này lại đến vào thời điểm đất nước đã khẳng định nguyên tắc không cho nước ngoài đặt căn cứ quân sự."
 vie_int.10.a:0 "Từ chối một cách lịch thiệp"
 vie_int.10.b:0 "Chấp thuận và từ bỏ nguyên tắc"

 ### vie_alt.25
 vie_alt.25.t:0 "Casino và Tội phạm Có Tổ chức"
 vie_alt.25.d:0 "Các khu nghỉ dưỡng kết hợp sòng bạc casino mới mang lại nguồn ngoại tệ lớn nhưng cũng kéo theo những vị khách không mong muốn. Lực lượng công an báo cáo tình trạng tín dụng đen, buôn lậu và rửa tiền đang bùng phát trong khu vực đặc khu."
 vie_alt.25.a:0 "Triệt phá quyết liệt"
 vie_alt.25.b:0 "Nhắm mắt làm ngơ"

 ### vie_alt.26
 vie_alt.26.t:0 "Đặc khu Đòi Quyền Tự trị"
 vie_alt.26.d:0 "Ban quản lý đặc khu cho rằng sự thành công của họ phụ thuộc vào việc được tự quản lý tòa án, chính sách thuế và lực lượng cảnh sát riêng. Các bộ ngành tại Hà Nội đang phân vân không biết ranh giới quyền lực nên dừng ở đâu."
 vie_alt.26.a:0 "Trao quyền tự quyết sâu rộng cho đặc khu"
 vie_alt.26.b:0 "Bác bỏ đề xuất"

 ### vie_alt.27
 vie_alt.27.t:0 "Tỷ phú Muốn Có Ghế Trong Chính phủ"
 vie_alt.27.d:0 "Người đứng đầu một trong những tập đoàn tư nhân lớn nhất bắn tiếng rằng ông ta muốn có một vị trí trong nội các chính phủ. Những khoản tài trợ của ông ta là rất hào phóng, và việc từ chối nhân vật này sẽ phải trả giá."
 vie_alt.27.a:0 "Chấp thuận"
 vie_alt.27.b:0 "Từ chối"

 ### vie_alt.29
 vie_alt.29.t:0 "Các Cố vấn Hàn Quốc Tới Làm việc"
 vie_alt.29.d:0 "Một phái đoàn cố vấn đến từ Seoul, những người từng trải qua giai đoạn tăng trưởng thần kỳ của Hàn Quốc, đã đến để hỗ trợ xây dựng quy hoạch kinh tế. Họ có những quan điểm rất kiên định, song không phải điều gì cũng phù hợp với điều kiện thực tế của Việt Nam."
 vie_alt.29.a:0 "Tuân thủ chặt chẽ các lời khuyên"
 vie_alt.29.b:0 "Chỉ tiếp thu những phần phù hợp"

 ### vie_int.10

 ### vie_alt.25
 vie_alt.25.t:0 "Casino và Tội phạm Có Tổ chức"
 vie_alt.25.d:0 "Các khu nghỉ dưỡng kết hợp sòng bạc casino mới mang lại nguồn ngoại tệ lớn nhưng cũng kéo theo những vị khách không mong muốn. Lực lượng công an báo cáo tình trạng tín dụng đen, buôn lậu và rửa tiền đang bùng phát trong khu vực đặc khu."
 vie_alt.25.a:0 "Triệt phá quyết liệt"
 vie_alt.25.b:0 "Nhắm mắt làm ngơ"

 ### vie_alt.26
 vie_alt.26.t:0 "Đặc khu Đòi Quyền Tự trị"
 vie_alt.26.d:0 "Ban quản lý đặc khu cho rằng sự thành công của họ phụ thuộc vào việc được tự quản lý tòa án, chính sách thuế và lực lượng cảnh sát riêng. Các bộ ngành tại Hà Nội đang phân vân không biết ranh giới quyền lực nên dừng ở đâu."
 vie_alt.26.a:0 "Trao quyền tự quyết sâu rộng cho đặc khu"
 vie_alt.26.b:0 "Bác bỏ đề xuất"


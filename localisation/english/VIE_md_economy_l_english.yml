 VIE_tt_infra_refunded:0 "Đợt đầu tư không thể bàn giao: hoàn lại ngân sách đã trả, không tăng tiến độ. Có thể thực hiện lại khi điều kiện được khôi phục."
 VIE_infrastructure_category:0 "Hạ tầng quốc gia"
 VIE_infrastructure_category_desc:0 "Đường bộ: [VIEInfraRoadStatus]\nĐường sắt: [VIEInfraRailStatus]\nCảng biển: [VIEInfraPortsStatus]\nHàng không: [VIEInfraAirStatus]\n\nBốn ngành có thể đầu tư song song; mỗi ngành chỉ thực hiện một đợt tại một thời điểm. Tiến độ cao tốc: [?VIE_expressway_km|0]/5.000 km. Các focus mở chương trình; quyết sách mới giải ngân và bàn giao. Giá và thời gian là thông số gameplay.\n\nĐường bộ: nền tảng [?VIE_infra_road_foundation_stage|0]/1, Bắc - Nam [?VIE_infra_road_spine_stage|0]/1, kết nối vùng [?VIE_infra_road_regions_stage|0]/2, 3.000 km [?VIE_infra_road_3000_stage|0]/1, mở rộng [?VIE_infra_road_5000_stage|0]/4.\nĐường sắt: hiện hữu [?VIE_infra_rail_upgrade_stage|0]/1, metro [?VIE_infra_metro_stage|0]/2, đào tạo [?VIE_infra_rail_training_stage|0]/1; HSR Nhật [?VIE_infra_hsr_japan_stage|0]/1, châu Âu [?VIE_infra_hsr_eu_stage|0]/1, Trung Quốc [?VIE_infra_hsr_china_stage|0]/1.\nCảng biển: cảng nước sâu [?VIE_infra_ports_stage|0]/2, logistics [?VIE_infra_logistics_stage|0]/1, đa phương thức [?VIE_infra_multimodal_stage|0]/1.\nHàng không: hiện đại hóa [?VIE_infra_air_modern_stage|0]/2, chuẩn bị Long Thành [?VIE_infra_long_thanh_prepare_stage|0]/1, bàn giao [?VIE_infra_long_thanh_stage|0]/1."
 vie_infra.1.t:0 "Bài học giám sát công trình"
 vie_infra.1.d:0 "Các chương trình cầu, hầm và cao tốc đầu kỳ nhắc lại bài học về an toàn thi công. Cầu Cần Thơ và hầm Hải Vân là những kinh nghiệm để nâng chuẩn giám sát các dự án tiếp theo."
 vie_infra.1.a:0 "Siết chặt giám sát chất lượng."
 vie_infra.1.b:0 "Giữ ưu tiên tiến độ."
 vie_infra.2.t:0 "Phản ứng về trạm thu phí BOT"
 vie_infra.2.d:0 "Vốn tư nhân giảm gánh nặng đầu tư, nhưng thỏa thuận thu phí tạo tranh chấp giữa nhà đầu tư và người sử dụng đường. Chính quyền phải chọn điều chỉnh mức phí hoặc giữ hợp đồng."
 vie_infra.2.a:0 "Giảm phí và kéo dài thời gian thu."
 vie_infra.2.b:0 "Giữ mức phí đã thỏa thuận."
 vie_infra.3.t:0 "Vietnam Airlines giữa đại dịch"
 vie_infra.3.d:0 "Đường bay quốc tế gần như ngừng hoàn toàn, hãng hàng không quốc gia thua lỗ và cạn tiền mặt. Chính quyền có thể hỗ trợ thanh khoản hoặc để thị trường tự điều tiết."
 vie_infra.3.a:0 "Hỗ trợ hãng hàng không quốc gia."
 vie_infra.3.b:0 "Để thị trường tự điều tiết."
 vie_infra.4.t:0 "Lựa chọn thời điểm đầu tư HSR"
 vie_infra.4.d:0 "Chương trình đường sắt tốc độ cao cần vốn lớn và năng lực kỹ thuật dài hạn. Đầu tư sớm mở cửa từ năm 2012 nhưng mang gánh nặng nợ 10 năm khi giải ngân; trì hoãn giữ nguồn lực cho mạng hiện hữu và metro, mở lại HSR từ cuối năm 2024."
 vie_infra.4.a:0 "Trì hoãn đầu tư đường sắt tốc độ cao."
 vie_infra.4.b:0 "Chuẩn bị đầu tư HSR sớm."
 vie_infra.5.t:0 "Chọn đối tác công nghệ HSR"
 vie_infra.5.d:0 "Chờ đối tác đủ điều kiện để đàm phán lại."
 vie_infra.5.a:0 "Hợp tác công nghệ Nhật Bản."
 vie_infra.5.b:0 "Hợp tác công nghệ châu Âu."
 vie_infra.5.c:0 "Hợp tác công nghệ Trung Quốc."
 vie_infra.6.t:0 "Mạng cao tốc đạt 3.000 km"
 vie_infra.6.d:0 "Các đợt đầu tư đã nâng tiến độ mạng lưới tới 3.000 km. Hiệu quả kinh tế đã được ghi nhận khi bàn giao."
 vie_infra.6.a:0 "Ghi nhận kết quả đầu tư."
 vie_infra.7.t:0 "Mạng cao tốc đạt 5.000 km"
 vie_infra.7.d:0 "Chương trình mạng cao tốc đã hoàn thành đủ các đợt đầu tư. Đường bộ đáp ứng một trong bốn tiêu chí của hạ tầng đồng bộ."
 vie_infra.7.a:0 "Ghi nhận kết quả đầu tư."
 vie_infra.8.t:0 "Long Thành được bàn giao"
 vie_infra.8.d:0 "Sau chuẩn bị và xây dựng, Long Thành đã bổ sung năng lực dân dụng cho mạng hàng không. Chương trình hàng không đáp ứng tiêu chí hạ tầng đồng bộ."
 vie_infra.8.a:0 "Ghi nhận kết quả đầu tư."
 vie_infra.9.t:0 "Bàn giao đợt triển khai HSR"
 vie_infra.9.d:0 "Đợt triển khai đầu tiên của chương trình HSR đã hoàn thành. Đây là bước đầu xây dựng năng lực, chưa phải khai thác toàn tuyến Bắc - Nam."
 vie_infra.9.a:0 "Ghi nhận kết quả đầu tư."
 VIE_tt_infra_notice_only:0 "Kết quả đã được cấp khi bàn giao. Thông báo này không cấp thêm phần thưởng."
 VIE_modern_rail_idea:0 "Mạng đường sắt hiện đại"
 VIE_modern_rail_idea_desc:0 "Mạng hiện hữu và metro được nâng cấp, công nghệ đã tiếp nhận và đợt HSR ban đầu đã bàn giao. Toàn tuyến HSR chưa được coi là đã khai thác."
 VIE_multimodal_idea:0 "Hệ thống vận tải đa phương thức"
 VIE_multimodal_idea_desc:0 "Cảng nước sâu, logistics và kết nối đa phương thức được tích hợp thành một hệ thống. Thay thế hai tinh thần cảng và logistics, không cộng chồng với chúng."
 VIE_expressway_km_tt:0 "Tiến độ cao tốc (km gameplay): $RIGHT|+=0$"
 VIE_expressway_idea:0 "Mạng lưới cao tốc quốc gia"
 VIE_expressway_idea_desc:0 "Năng lực đường bộ được ghi nhận sau các đợt đầu tư và tăng theo tiến độ mạng cao tốc."
 VIE_expressway_idea_2:0 "Mạng lưới cao tốc 3.000 km"
 VIE_expressway_idea_2_desc:0 "Đã bàn giao các đợt đầu tư đạt mốc 3.000 km; thay thế bậc cao tốc ban đầu."
 VIE_expressway_idea_3:0 "Mạng lưới cao tốc 5.000 km"
 VIE_expressway_idea_3_desc:0 "Đã hoàn tất chương trình cao tốc 5.000 km; thay thế bậc 3.000 km."
 VIE_airport_network_idea:0 "Mạng cảng hàng không hiện đại"
 VIE_airport_network_idea_desc:0 "Nội Bài và Tân Sơn Nhất đã được hiện đại hóa bằng đầu tư dân dụng. Long Thành là chương trình tiếp theo."
 VIE_ports_idea:0 "Hệ thống cảng nước sâu"
 VIE_ports_idea_desc:0 "Hai đợt cảng nước sâu đã bàn giao, bổ sung năng lực vận tải biển quốc gia."
 VIE_logistics_idea:0 "Logistics quốc gia"
 VIE_logistics_idea_desc:0 "Kho vận và trung chuyển kết nối với hệ thống cảng. Tinh thần này được tích hợp vào vận tải đa phương thức khi hoàn tất chương trình."
 VIE_synchronized_infra_idea:0 "Hạ tầng đồng bộ"
 VIE_synchronized_infra_idea_desc:0 "Ít nhất ba trong bốn chương trình quốc gia đã đạt kết quả thực, tạo nền tảng năng suất và thương mại."

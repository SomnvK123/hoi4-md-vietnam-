 VIE_tt_infra_road_foundation_done:0 "Đợt đường bộ nền tảng đã bàn giao."
 VIE_tt_infra_road_spine_done:0 "Đợt cao tốc Bắc - Nam ban đầu đã bàn giao."
 VIE_tt_infra_ports_done:0 "Hai đợt cảng nước sâu đã bàn giao."
 VIE_tt_infra_logistics_done:0 "Đợt logistics quốc gia đã bàn giao."
 VIE_tt_infra_air_modern_done:0 "Cả Nội Bài và Tân Sơn Nhất đã được hiện đại hóa."
 VIE_tt_infra_partner_selected:0 "Đã lựa chọn một đối tác công nghệ HSR: Nhật Bản, châu Âu hoặc Trung Quốc."
 VIE_tt_infra_partner_selected_NOT:0 "Chưa lựa chọn đối tác công nghệ HSR."
 VIE_tt_infra_road_network_gate:0 "Hai đợt kết nối vùng đã bàn giao; tiến độ cao tốc đạt ít nhất 1.800 km (hiện tại: [?VIE_expressway_km|0] km)."
 VIE_tt_infra_hsr_approval_gate:0 "Đã chọn đầu tư HSR sớm, hoặc đã đến tháng 12/2024."
 VIE_tt_infra_rail_network_gate:0 "Đã bàn giao nâng cấp mạng hiện hữu, metro tại cả hai đô thị, đào tạo công nghệ và đợt triển khai HSR ban đầu."
 VIE_tt_infra_three_programs:0 "Ít nhất 3/4 chương trình đạt kết quả thực:\nĐường bộ: [VIEInfraRoadStatus]\nĐường sắt: [VIEInfraRailStatus]\nCảng biển: [VIEInfraPortsStatus]\nHàng không: [VIEInfraAirStatus]\n\nTiêu chí:\n - Đường bộ: focus mạng cao tốc và 5.000 km đã bàn giao.\n - Đường sắt: mạng hiện đại, gồm đợt HSR ban đầu.\n - Cảng biển: đợt đa phương thức đã bàn giao.\n - Hàng không: Long Thành đã bàn giao."
 VIE_infrastructure_development:0 "Chiến lược hạ tầng quốc gia"
 VIE_infrastructure_development_desc:0 "Xây dựng bốn chương trình đường bộ, đường sắt, cảng biển và hàng không. Chính sách mở hướng đầu tư; công trình chỉ được bàn giao sau khi giải ngân và thực hiện các quyết sách."
 VIE_transport_strategy_2004:0 "Chương trình phát triển đường bộ"
 VIE_transport_strategy_2004_desc:0 "Tập hợp cầu Cần Thơ, hầm Hải Vân, cao tốc TP. Hồ Chí Minh - Trung Lương và các tuyến đầu kỳ vào một chương trình nền tảng. Chiều dài cao tốc trong chương trình là đơn vị tiến độ gameplay, không phải số liệu lịch sử từng dự án."
 VIE_expressway_bot:0 "Huy động vốn BOT/PPP"
 VIE_expressway_bot_desc:0 "Huy động vốn tư nhân để giảm 25% chi ngân sách cho các đợt cao tốc sau nền tảng. Đổi lại, chính quyền phải xử lý tranh chấp thu phí và lợi ích giữa người sử dụng với nhà đầu tư."
 VIE_expressway_public_investment:0 "Cao tốc bằng đầu tư công"
 VIE_expressway_public_investment_desc:0 "Ngân sách nhà nước chịu toàn bộ chi phí mở rộng cao tốc. Nhà nước kiểm soát nguồn vốn và giảm nguy cơ tranh chấp trạm thu phí BOT."
 VIE_north_south_expressway:0 "Trục cao tốc Bắc - Nam"
 VIE_north_south_expressway_desc:0 "Mở chương trình xây dựng trục vận tải xuyên quốc gia sau khi hoàn tất nền tảng đường bộ. Focus phê duyệt chương trình; quyết sách đầu tư mới tạo công trình và tăng chiều dài mạng lưới."
 VIE_expressway_regional_links:0 "Kết nối vùng và vành đai"
 VIE_expressway_regional_links_desc:0 "Kết nối Đông Bắc và đồng bằng sông Cửu Long với trục quốc gia, đồng thời tổ chức các vành đai Hà Nội và TP. Hồ Chí Minh. Hai đợt đầu tư mở rộng vùng phục vụ của cao tốc."
 VIE_expressway_5000km_2030:0 "Mạng lưới cao tốc 5.000 km"
 VIE_expressway_5000km_2030_desc:0 "Mở các đợt giải ngân để đạt 3.000 km rồi 5.000 km cao tốc. Năm 2030 là mục tiêu phát triển; hoàn thành focus chưa đồng nghĩa mạng lưới đã được xây dựng."
 VIE_railway_national_program:0 "Chiến lược đường sắt quốc gia"
 VIE_railway_national_program_desc:0 "Phân biệt nâng cấp mạng hiện hữu, đường sắt đô thị và đường sắt tốc độ cao. Chương trình mở lựa chọn đầu tư sớm hoặc trì hoãn HSR, thay vì buộc mọi tuyến vận tải phải đi cùng một đối tác."
 VIE_reunification_line_upgrade:0 "Nâng cấp mạng đường sắt"
 VIE_reunification_line_upgrade_desc:0 "Cải tạo cầu, hầm và ga trên tuyến Thống Nhất, đồng thời chuẩn bị kết nối hành lang Lào Cai - Hà Nội - Hải Phòng. Đây là nền tảng năng lực để mở các chương trình đô thị và HSR."
 VIE_urban_rail_program:0 "Phát triển đường sắt đô thị"
 VIE_urban_rail_program_desc:0 "Hợp nhất chương trình metro Hà Nội và TP. Hồ Chí Minh, gồm Cát Linh - Hà Đông, Nhổn - ga Hà Nội và Bến Thành - Suối Tiên. Cơ chế TOD và tinh thần NQ188 được tích hợp vào quá trình đầu tư hai đô thị."
 VIE_north_south_hsr:0 "Chương trình HSR Bắc - Nam"
 VIE_north_south_hsr_desc:0 "Chi ngân sách khảo sát và phê duyệt chương trình HSR, rồi lựa chọn đối tác công nghệ. Triển khai ban đầu và chuyển giao công nghệ là các bước riêng; không coi toàn tuyến đã khai thác."
 VIE_rail_technology_transfer:0 "Chuyển giao công nghệ đường sắt"
 VIE_rail_technology_transfer_desc:0 "Đào tạo đội ngũ kỹ thuật, tiếp nhận tiêu chuẩn và từng bước nội địa hóa thiết bị đường sắt. Bonus nghiên cứu chỉ được cấp sau đợt đào tạo, với mức khác nhau theo đối tác."
 VIE_modern_rail_network:0 "Mạng đường sắt hiện đại"
 VIE_modern_rail_network_desc:0 "Công nhận mạng hiện hữu đã được nâng cấp, hai chương trình metro đã bàn giao và đợt triển khai HSR đầu tiên đã hoàn thành. Đây là năng lực tích hợp, không phải tuyên bố hoàn tất toàn tuyến HSR."
 VIE_national_deepwater_ports:0 "Hệ thống cảng nước sâu"
 VIE_national_deepwater_ports_desc:0 "Hợp nhất Cái Mép - Thị Vải và Lạch Huyện thành chương trình cảng nước sâu quốc gia. Hai đợt đầu tư tạo năng lực tiếp nhận hàng hóa ở hai đầu đất nước."
 VIE_logistics_strategy:0 "Chiến lược logistics quốc gia"
 VIE_logistics_strategy_desc:0 "Tổ chức kho bãi, trung chuyển và kết nối cửa khẩu quanh mạng cảng nước sâu. Lợi ích logistics xuất hiện sau đầu tư, không chỉ sau khi ban hành chiến lược."
 VIE_multimodal_transport:0 "Vận tải đa phương thức"
 VIE_multimodal_transport_desc:0 "Kết nối vận tải biển với mạng đường bộ và đường sắt hiện hữu. Đợt bàn giao cuối tích hợp hai tinh thần cảng và logistics thành một hệ thống, không cộng chồng phần thưởng."
 VIE_airport_master_plan:0 "Quy hoạch mạng sân bay"
 VIE_airport_master_plan_desc:0 "Quy hoạch mạng cảng hàng không và lựa chọn mô hình vốn. Nhà ga và sân bay dân dụng được thể hiện bằng hạ tầng cùng hiệu quả kinh tế; căn cứ quân sự thuộc chương trình lưỡng dụng riêng."
 VIE_socialized_airports:0 "Xã hội hóa đầu tư sân bay"
 VIE_socialized_airports_desc:0 "Mở vốn tư nhân cho sân bay, giảm 25% ngân sách đầu tư dân dụng và cho phép phát triển Vân Đồn. Khâu chuẩn bị Long Thành và công trình lưỡng dụng vẫn dùng ngân sách đầy đủ."
 VIE_acv_monopoly:0 "Doanh nghiệp nhà nước chủ đạo"
 VIE_acv_monopoly_desc:0 "Giữ doanh nghiệp nhà nước làm đầu mối đầu tư và điều phối sân bay. Ngân sách chịu chi phí đầy đủ, đổi lại duy trì quyền kiểm soát và ổn định chính sách."
 VIE_airport_network_2030:0 "Hiện đại hóa mạng sân bay"
 VIE_airport_network_2030_desc:0 "Tổ chức chương trình hiện đại hóa Nội Bài và Tân Sơn Nhất, thay các focus nhà ga riêng lẻ. Mạng sân bay hiện đại là nền tảng của Long Thành; Vân Đồn và sân bay lưỡng dụng là các đầu tư tùy chọn."
 VIE_long_thanh_airport:0 "Trung tâm hàng không Long Thành"
 VIE_long_thanh_airport_desc:0 "Chuẩn bị dự án rồi triển khai Long Thành từ năm 2021. Không phụ thuộc metro hoặc lựa chọn vốn đường bộ; chỉ công nhận chương trình hàng không hoàn thành khi dự án đã bàn giao."
 VIE_synchronized_infrastructure_2030:0 "Hạ tầng đồng bộ Việt Nam 2030"
 VIE_synchronized_infrastructure_2030_desc:0 "Công nhận ít nhất ba trong bốn chương trình hạ tầng đạt kết quả thực. Đường bộ cần đủ 5.000 km, đường sắt cần triển khai HSR ban đầu, cảng cần vận tải đa phương thức và hàng không cần Long Thành bàn giao."
 VIE_tt_infra_new_game:0 "Nhánh hạ tầng mới yêu cầu bắt đầu game mới. Mở bốn chương trình đầu tư có thời gian; năm 2030 là mục tiêu, không là khóa ngày của focus cuối."
 VIE_tt_infra_building_capped:0 "State mục tiêu đã đạt trần công trình: công nhận tiến độ kinh tế, không xây bù tại state khác."
 VIE_tt_infra_road_free:0 "Ngành đường bộ không có đợt đầu tư đang thực hiện."
 VIE_tt_infra_rail_free:0 "Ngành đường sắt không có đợt đầu tư đang thực hiện."
 VIE_tt_infra_ports_free:0 "Ngành cảng biển không có đợt đầu tư đang thực hiện."
 VIE_tt_infra_air_free:0 "Ngành hàng không không có đợt đầu tư đang thực hiện."
 VIE_tt_infra_money_road_foundation:0 "Có ít nhất 7 tỷ USD ngân sách."
 VIE_tt_infra_targets_VIE_infra_d_road_foundation_1:0 "Sở hữu và kiểm soát tất cả state mục tiêu: 521, 518."
 VIE_infra_d_road_foundation_1:0 "Đầu tư đường bộ nền tảng"
 VIE_infra_d_road_foundation_1_desc:0 "Cầu Cần Thơ, hầm Hải Vân và các tuyến cao tốc đầu kỳ được gom thành chương trình chung. Ngân sách 7 tỷ USD, thời gian 180 ngày. Tiến độ cao tốc +400 km. Hạ tầng +1 tại 521, 518. Tiền được trừ một lần lúc bắt đầu. Nếu mất quyền sở hữu hoặc kiểm soát state mục tiêu trước bàn giao, hoàn lại tiền và chưa tăng tiến độ. Công trình đạt trần không được xây bù ở nơi khác."

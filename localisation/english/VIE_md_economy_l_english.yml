 ### Focuses - Petrolimex & Downstream Energy
 VIE_petrolimex_downstream_network:0 "Mạng lưới Hạ nguồn Petrolimex"
 VIE_petrolimex_downstream_network_desc:0 "Tập đoàn Xăng dầu Việt Nam (Petrolimex) quản lý hơn 2.700 cửa hàng xăng dầu trực thuộc, chiếm hơn 50% thị phần cả nước. Tuyến ống ngầm chiến lược B12 từ cảng Bãi Cháy về đồng bằng Bắc Bộ cùng hệ thống tổng kho Nhà Bè, Liên Chiểu là mạch máu vận tải nuôi dưỡng toàn bộ nền kinh tế quốc dân."

 VIE_strategic_petroleum_reserve:0 "Dự trữ Xăng dầu Chiến lược Quốc gia"
 VIE_strategic_petroleum_reserve_desc:0 "Xây dựng các tổ hợp kho ngầm chứa dầu thô và sản phẩm xăng dầu quy mô hàng triệu mét khối tại Dung Quất và các căn cứ ven biển. Nâng mức dự trữ năng lượng quốc gia lên chuẩn tối thiểu 90 ngày nhập khẩu ròng, bảo đảm Việt Nam không bao giờ bị tê liệt trước các cú sốc địa chính trị hay phong tỏa hàng hải thế giới."

 VIE_petrolimex_eneos_partnership:0 "Hợp tác Chiến lược ENEOS Nhật Bản"
 VIE_petrolimex_eneos_partnership_desc:0 "Bán 13% cổ phần chiến lược cho tập đoàn năng lượng số 1 Nhật Bản ENEOS Corporation và chính thức niêm yết mã PLX trên sàn HOSE. Chuyên gia Nhật Bản mang đến chuẩn mực quản trị quốc tế, quy trình tự động hóa đo bể không hao hụt và nâng cao uy tín tài chính minh bạch cho tập đoàn nhà nước."

 VIE_petrolimex_green_ev_hubs:0 "Trạm Dịch vụ Xanh & Siêu hạ tầng Sạc EV"
 VIE_petrolimex_green_ev_hubs_desc:0 "Cú bắt tay lịch sử giữa Petrolimex và VinFast: triển khai lắp đặt trạm sạc xe điện siêu nhanh tại hàng ngàn cây xăng trên khắp 63 tỉnh thành. Mạng lưới tiên phong cung ứng dầu Diesel Euro 5 sạch nhất thị trường và xuất hóa đơn điện tử từng lần bơm xăng theo thời gian thực về Tổng cục Thuế."

 ### Focuses - Power & Market Reform
 VIE_dppa_market_reform:0 "Cơ chế DPPA & Thị trường Điện Cạnh tranh"
 VIE_dppa_market_reform_desc:0 "Ban hành cơ chế Mua bán điện Trực tiếp (DPPA), cho phép các đại bàng công nghệ cao như Samsung, Apple và các nhà máy bán dẫn mua điện sạch trực tiếp từ các trang trại năng lượng tái tạo. Tách Trung tâm Điều độ Hệ thống điện Quốc gia (A0) thành NSMO độc lập trực thuộc Bộ Công Thương, dọn đường cho thị trường bán lẻ điện cạnh tranh công bằng."

 ### Ideas
 VIE_petrolimex_idea:0 "Mạng lưới Lưu thông Xăng dầu Petrolimex"
 VIE_petrolimex_idea_desc:0 "Mạng lưới hơn 5.500 cây xăng và kho cảng trải rộng khắp mọi miền đất nước bảo đảm dòng chảy nhiên liệu thông suốt cho logistics và sản xuất."

 VIE_strategic_fuel_reserve_idea:0 "Dự trữ Năng lượng Chiến lược Quốc gia"
 VIE_strategic_fuel_reserve_idea_desc:0 "Hệ thống kho ngầm dự trữ 90 ngày bảo đảm khả năng chịu đựng cao độ của nền kinh tế và quân đội trước mọi nguy cơ phong tỏa hay khủng hoảng dầu mỏ quốc tế."

 VIE_dppa_reform_idea:0 "Cơ chế DPPA & Thị trường Điện Cạnh tranh"
 VIE_dppa_reform_idea_desc:0 "Thị trường điện mở và cơ chế DPPA tạo niềm tin vững chắc cho các nhà đầu tư công nghệ cao đòi hỏi tiêu chuẩn năng lượng xanh RE100 khắt khe."

 VIE_fuel_shortage_crisis:0 "Cơn sốc Nguồn cung Xăng dầu"
 VIE_fuel_shortage_crisis_desc:0 "Giá dầu thế giới biến động mạnh và chiết khấu 0 đồng khiến nhiều cây xăng tư nhân đóng cửa, gây gián đoạn lưu thông và tăng chi phí xã hội."

 ### Events
 vie_petro.1.t:0 "Khủng hoảng Đứt gãy Nguồn cung Xăng dầu"
 vie_petro.1.d:0 "Biến động dữ dội của giá dầu thế giới và xung đột địa chính trị khiến nguồn cung xăng dầu nhập khẩu gặp khó khăn lớn. Do chiết khấu bằng 0 hoặc âm, hàng loạt cửa hàng bán lẻ xăng dầu tư nhân trên cả nước đã đồng loạt treo biển 'hết xăng' hoặc bán nhỏ giọt. Dòng người xếp hàng dài xuyên đêm chờ đổ xăng tại các thành phố lớn đang làm dấy lên nỗi lo sợ đứt gãy mạch máu lưu thông kinh tế. Chính phủ cần đưa ra chỉ đạo khẩn cấp!"
 vie_petro.1.a:0 "Lệnh điều động: Petrolimex mở bán 24/7 gánh toàn bộ thị trường!"
 vie_petro.1.b:0 "Thả nổi theo thị trường và chấp nhận thiếu hụt cục bộ."



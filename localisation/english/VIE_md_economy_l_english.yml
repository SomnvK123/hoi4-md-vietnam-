 vie_ind.1.a:0 "Huy động vốn FDI"
 vie_ind.1.b:0 "Phát triển doanh nghiệp nội địa"
 vie_ind.1.t:0 "Mô hình vốn cho ngành thép"
 vie_ind.1.d:0 "FDI: 6 tỷ/365 ngày, tiếp cận vốn nhanh và gắn với bối cảnh Formosa nếu bàn giao trong cửa sổ lịch sử. Nội địa: 7,5 tỷ/450 ngày, phát triển doanh nghiệp trong nước. Cả hai nhận cùng năng lực nền tảng; chỉ chọn một lần."
 vie_ind.2.t:0 "Kiểm tra xuất xứ hàng xuất khẩu"
 vie_ind.2.d:0 "Mô hình thu hút FDI nhanh gây áp lực về truy xuất xuất xứ. Chi 1 tỷ để tăng giám sát, hoặc chấp nhận scrutiny trong một năm."
 vie_ind.2.a:0 "Chi 1 tỷ và tăng giám sát"
 vie_ind.2.b:0 "Chấp nhận rủi ro kiểm tra"
 vie_ind.3.t:0 "Năng lực chế tạo chip thí điểm"
 vie_ind.3.d:0 "Đợt đầu tư fab đã bàn giao. Đây là dây chuyền thí điểm ở công nghệ trưởng thành, không phải tuyên bố tự chủ toàn bộ ngành chip. Công trình và modifier đã được ghi nhận tại bàn giao; thông báo không thưởng thêm."
 vie_ind.3.a:0 "Ghi nhận năng lực thí điểm"
 vie_auto.1.t:0 "Năng lực xuất khẩu ô tô"
 vie_auto.1.d:0 "Chương trình tiêu chuẩn và xuất khẩu đã bàn giao. VinFast và các doanh nghiệp là bối cảnh phát triển thương hiệu; thông báo không tạo treasury miễn phí hoặc cấp lại reward."
 vie_auto.1.a:0 "Ghi nhận thành tựu xuất khẩu"
 vie_auto.2.t:0 "Liên minh xe điện và trạm sạc"
 vie_auto.2.d:0 "Năng lực xe điện đã bàn giao và mạng dịch vụ Petrolimex đã phát triển. Cấp một lần 25 PP và stability +0,01; không cộng tăng trưởng riêng. Đây là tích hợp tùy chọn, không khóa thành tựu công nghiệp."
 vie_auto.2.a:0 "Phối hợp mạng lưới xe điện"
 vie_eco.5.a:0 "Cứu trợ và tái cơ cấu: 3 tỷ, còn 1 tỷ nếu đã cải cách"
 vie_eco.5.b:0 "Truy trách nhiệm: 1 tỷ, còn 0,5 tỷ nếu đã cải cách"
 vie_eco.5.t:0 "Khủng hoảng Vinashin"
 vie_eco.5.d:0 "Khủng hoảng năm 2010 đặt ra bài toán trách nhiệm và quản trị. Cải cách sớm giảm rủi ro và chi phí xử lý; rủi ro trên 1 làm phát sinh debt overhang hai năm. Quyết sách quản trị không tự coi sự kiện này đã được giải quyết."

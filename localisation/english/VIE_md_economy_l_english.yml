 VIE_industry_category:0 "Chương trình công nghiệp quốc gia"
 VIE_industry_category_desc:0 "[VIEIndustryShipStatus] Đóng tàu\n[VIEIndustryTextileStatus] Dệt may\n[VIEIndustrySteelStatus] Thép\n[VIEIndustryAutoStatus] Ô tô\n[VIEIndustrySupplyStatus] Điện tử\n[VIEIndustryChipStatus] Bán dẫn\n\nNội địa hóa: [?VIE_ind_localization|1]/32. Sáu ngành và chương trình chung có slot riêng. Mở focus chưa phải đã bàn giao; 2030 là mục tiêu, không bắt chờ đúng năm."

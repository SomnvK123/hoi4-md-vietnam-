 VIE_tt_ind_policy_industrialization_strategy:0 "§YNhận ngay:§! PP +25; nội địa hóa +10.\n§YMở đầu tư:§! Không giải ngân hoặc cấp công trình tại focus này. Các chương trình mở theo focus tương ứng trong quyết sách.\n§YSau bàn giao:§! công trình, tiến độ và bonus chỉ cấp theo đợt đã thanh toán; bậc hoàn chỉnh thay bậc chính sách. Bậc cao hơn đã đạt luôn được giữ."
 VIE_tt_ind_policy_supporting_industries:0 "§YNhận ngay:§! Chính sách công nghiệp hỗ trợ: Growth modifier +0.4%; Sản lượng nhà máy +0.5%; Thu nhập thuế doanh nghiệp +0.5%.\n§YMở đầu tư:§! Đầu tư công nghiệp hỗ trợ: 2 tỷ USD/180 ngày\n§YSau bàn giao:§! Hỗ trợ +6 điểm; thay idea chính sách bằng hỗ trợ hoàn chỉnh 100%. Khu vực đạt giới hạn xây dựng vẫn được nâng cấp năng lực, không xây nơi khác. Các bậc idea thay thế nhau; không cộng chồng."
 VIE_tt_ind_policy_vinashin_restructuring_sbic:0 "§YNhận ngay:§! Quy hoạch và quản trị đóng tàu: Tốc độ xây dockyard +2%. Giữ ghi nhận risk di sản +2 một lần trước 2010.\n§YMở đầu tư:§! Quản trị và tái cơ cấu đóng tàu: 1 tỷ USD/180 ngày\n§YSau bàn giao:§! Quản trị +2 điểm; risk về 0, stability +1%, checks +1. Giữ bậc chính sách đóng tàu +2%; chưa bàn giao xưởng. Khu vực đạt giới hạn xây dựng vẫn được nâng cấp năng lực, không xây nơi khác. Các bậc idea thay thế nhau; không cộng chồng."
 VIE_tt_ind_policy_national_steel_program:0 "§YNhận ngay:§! Quy hoạch công nghiệp thép: Tốc độ xây IC +0.75%; Tốc độ xây hạ tầng +0.5%; Tốc độ xây nhà máy quân sự +0.5%.\n§YMở đầu tư:§! Thép nền tảng bằng vốn FDI: 6 tỷ USD/365 ngày; Thép nền tảng bằng vốn nội địa: 7,5 tỷ USD/450 ngày\n§YSau bàn giao:§! Một nhà máy dân sự tại $STATE_521$, +2 điểm; giữ idea thép 25%. HRC hoàn chỉnh cần focus và đợt đầu tư tiếp theo. Khu vực đạt giới hạn xây dựng vẫn được nâng cấp năng lực, không xây nơi khác. Các bậc idea thay thế nhau; không cộng chồng."

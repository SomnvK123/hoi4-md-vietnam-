l_english:
 VIE_change_unstarted_programme:0 "Đổi trọng tâm trước khởi động"
 VIE_change_unstarted_programme_desc:0 "Chưa thu phí khởi động thì có thể đổi trọng tâm trong cửa sổ270ngày. Không đổi chương trình đã chạy hoặc kéo dài hạn khởi động. Hồi phục gắn kết trước khi chọn kiểm tra nếu không có mode khởi động hợp lệ."
 VIE_e104_fund_check_1:0 "Cấp phí kiểm chứng hợp đồng lần 1"
 VIE_e104_fund_check_1_desc:0 "Chi10PP cho đợt kiểm chứng kết thúc ngày90 từ lúc ký/sửa. Cần quy trình kiểm toán mua sắm công. Không cấp đủ phí trước hạn thì mất hỗ trợ chưa nhận/quyền đào tạo và gắn kết−6."
 VIE_e104_fund_check_2:0 "Cấp phí kiểm chứng hợp đồng lần 2"
 VIE_e104_fund_check_2_desc:0 "Chi10PP cho đợt kiểm chứng kết thúc ngày180 từ lúc ký/sửa. Cần quy trình kiểm toán mua sắm công. Không cấp đủ phí trước hạn thì mất hỗ trợ chưa nhận/quyền đào tạo và gắn kết−6."
 VIE_e104_training_task:0 "Đào tạo kỹ thuật theo hợp đồng"
 VIE_e104_training_task_desc:0 "Công việc90ngày. Chỉ nhận25PP một lần sau hoàn tất đào tạo và hai đợt kiểm chứng hợp đồng; hủy hợp đồng mất quyền chưa dùng."
 VIE_e104_cancel_task:0 "Chấm dứt hợp đồng kỹ thuật"
 VIE_e104_cancel_task_desc:0 "Đóng nghĩa vụ tương lai và mất hỗ trợ chưa nhận/quyền đào tạo chưa dùng. Không thu hồi tiền hoặc thưởng đã nhận."

 ### Trục 1 hải quân: mua sắm (namespace vie_naval) và Decision mở lại chương trình đã lỡ.
 vie_naval.1.t:0 "Hợp đồng tàu tên lửa Molniya"
 vie_naval.1.d:0 "Moskva đề nghị bán cho Hải quân Nhân dân hai tàu tên lửa tấn công nhanh lớp Molniya hoàn chỉnh. Hợp đồng là bước đầu của một gói lớn hơn: giấy phép đóng tàu sẽ được bàn riêng sau đó.\n\nHai tàu đầu có thể về nước trong vòng vài năm tới."
 vie_naval.1.a:0 "Ký hợp đồng mua hai tàu."
 vie_naval.1.b:0 "Đặt mua bốn tàu, trả giá cao hơn."
 vie_naval.1.c:0 "Chưa mua, chờ khả năng tự đóng."
 vie_naval.3.t:0 "Chuyển giao công nghệ Molniya"
 vie_naval.3.d:0 "Xưởng Ba Son đã đủ năng lực tiếp nhận hồ sơ kỹ thuật và giấy phép đóng tàu Molniya. Nếu ký, những chiếc đầu tiên sẽ khởi đóng ngay trong nước và lần lượt hạ thủy trong những năm sau.\n\nSố tàu đặt đóng quyết định gánh nặng cho ngân sách và cho xưởng."
 vie_naval.3.a:0 "Đóng sáu tàu theo giấy phép."
 vie_naval.3.b:0 "Đóng tám tàu."
 vie_naval.3.c:0 "Đóng mười tàu."
 vie_naval.3.e:0 "Dừng ở số tàu đã mua, không đóng thêm."
 vie_naval.10.t:0 "Khinh hạm Gepard 3.9: cấu hình"
 vie_naval.10.d:0 "Nhà máy Zelenodolsk chào bán lớp khinh hạm Gepard 3.9 cho Hải quân Nhân dân. Trước khi bàn số lượng, ta phải chọn cấu hình: bản tiêu chuẩn thiên về tên lửa chống hạm và phòng không, bản chống ngầm bổ sung ngư lôi và thiết bị phát hiện tàu ngầm."
 vie_naval.10.a:0 "Cấu hình tiêu chuẩn."
 vie_naval.10.b:0 "Cấu hình chống ngầm."
 vie_naval.10.c:0 "Hoãn, chưa ký trong đợt này."
 vie_naval.11.t:0 "Khinh hạm Gepard 3.9: số lượng"
 vie_naval.11.d:0 "Cấu hình đã chọn. Còn lại là số tàu đặt đóng. Tàu đầu dự kiến về nước sau vài năm."
 vie_naval.11.a:0 "Đặt hai tàu."
 vie_naval.11.b:0 "Đặt bốn tàu."
 vie_naval.11.c:0 "Hoãn."
 vie_naval.12.t:0 "Khinh hạm Gepard 3.9: lô thứ hai"
 vie_naval.12.d:0 "Các khinh hạm lô một đã vào biên chế và đáp ứng yêu cầu. Zelenodolsk đề nghị đóng tiếp lô chống ngầm, với giá cao hơn nhưng đã gồm đạn dược và gói bảo dưỡng."
 vie_naval.12.a:0 "Đặt hai tàu chống ngầm."
 vie_naval.12.b:0 "Đặt bốn tàu chống ngầm."
 vie_naval.12.c:0 "Không mua lô hai."
 vie_naval.20.t:0 "Tàu ngầm Kilo dự án 636"
 vie_naval.20.d:0 "Hà Nội và Moskva đã đàm phán xong gói tàu ngầm diesel-điện lớp Kilo cải tiến. Đây sẽ là một trong những hợp đồng lớn nhất của Hải quân Nhân dân, mỗi chiếc đóng riêng tại Saint Petersburg."
 vie_naval.20.a:0 "Ký hợp đồng sáu tàu."
 vie_naval.20.b:0 "Ký hợp đồng bốn tàu."
 vie_naval.20.c:0 "Ký hợp đồng hai tàu."
 vie_naval.20.e:0 "Hoãn, chưa ký trong đợt này."
 vie_naval.20.g:0 "Ký hợp đồng tám tàu."
 vie_naval.21.t:0 "Huấn luyện và hạ tầng tàu ngầm"
 vie_naval.21.d:0 "Tàu ngầm không chỉ là thân tàu: cần kíp lái, trạm bờ, kho đạn và xưởng sửa chữa. Gói đầy đủ tốn kém hơn nhưng giúp hạm đội vận hành ổn định ngay từ những chiếc đầu."
 vie_naval.21.a:0 "Gói đầy đủ: huấn luyện và hạ tầng."
 vie_naval.21.b:0 "Gói cắt giảm: chấp nhận chậm và rủi ro."
 vie_naval.30.t:0 "Tổ hợp tên lửa bờ Bastion-P"
 vie_naval.30.d:0 "Nga chào bán tổ hợp tên lửa phòng thủ bờ cơ động Bastion-P. Mỗi tổ hợp gồm xe phóng, xe chỉ huy và tên lửa chống hạm hành trình."
 vie_naval.30.a:0 "Mua hai tổ hợp."
 vie_naval.30.b:0 "Mua một tổ hợp."
 vie_naval.30.c:0 "Mua bốn tổ hợp."
 vie_naval.30.g:0 "Hoãn, chưa ký trong đợt này."
 vie_naval.31.t:0 "Triển khai Bastion-P"
 vie_naval.31.d:0 "Các tổ hợp tên lửa bờ cần được bố trí. Tập trung ở một khu vực cho phòng thủ mạnh tại đó, hay phân tán để che chắn toàn bộ bờ biển."
 vie_naval.31.a:0 "Tập trung ở miền Bắc."
 vie_naval.31.b:0 "Tập trung ở miền Trung."
 vie_naval.31.c:0 "Tập trung ở miền Nam."
 vie_naval.31.g:0 "Phân tán ba miền."
 vie_naval.40.t:0 "Tàu hộ vệ Sigma 9814"
 vie_naval.40.d:0 "Tập đoàn Damen của Hà Lan chào bán thiết kế tàu hộ vệ Sigma 9814 cho Hải quân Nhân dân. Đàm phán đã đi khá xa, nhưng phần tài chính vẫn chưa ngã ngũ. Ta có thể tiếp tục thương lượng mà chưa cam kết, hoặc chuyển sang đặt mua thật sự."
 vie_naval.40.a:0 "Tiếp tục đàm phán, chưa cam kết mua."
 vie_naval.40.b:0 "Chuyển sang đặt mua."
 vie_naval.40.c:0 "Từ bỏ chương trình."
 vie_naval.41.t:0 "Sigma 9814: số lượng"
 vie_naval.41.d:0 "Số tàu đặt quyết định gánh nặng tài chính và chuỗi hậu cần cho một dòng tàu hoàn toàn mới trong hạm đội."
 vie_naval.41.a:0 "Hai tàu."
 vie_naval.41.b:0 "Bốn tàu."
 vie_naval.41.c:0 "Sáu tàu."
 vie_naval.41.e:0 "Hoãn."
 vie_naval.42.t:0 "Sigma 9814: cấu hình"
 vie_naval.42.d:0 "Bản nhập nguyên khối từ Hà Lan tích hợp cao nhưng kéo theo một hệ hậu cần mới. Bản lai giảm bớt phụ thuộc. Bản nội địa hóa đắt và chậm hơn, nhưng mở cho ngành đóng tàu trong nước nhiều kinh nghiệm hơn."
 vie_naval.42.a:0 "Nhập nguyên khối từ Hà Lan."
 vie_naval.42.b:0 "Lai: lắp ráp một phần trong nước."
 vie_naval.42.c:0 "Nội địa hóa cao."
 vie_naval.43.t:0 "Sigma 9814: ngân khố không đủ"
 vie_naval.43.d:0 "Bộ Tài chính báo cáo ngân khố hiện tại không đủ chi trả toàn bộ hợp đồng. Ta có thể thu hẹp quy mô, vay vốn nước ngoài với lãi suất cao, hoãn lại, hoặc hủy hẳn."
 vie_naval.43.a:0 "Cắt giảm một nửa số tàu."
 vie_naval.43.b:0 "Vay vốn để ký đủ."
 vie_naval.43.c:0 "Hoãn."
 vie_naval.43.e:0 "Hủy chương trình."
 vie_naval.44.t:0 "Sigma 9814: đàm phán dừng lại"
 vie_naval.44.d:0 "Hai bên đạt thỏa thuận cho hai tàu, nhưng hợp đồng chính thức vẫn chưa được ký vì phần tài chính còn vướng. Chương trình tạm dừng."
 vie_naval.44.a:0 "Ghi nhận."
 VIE_naval_procurement_category:0 "Mua sắm Hải quân (muộn)"
 VIE_naval_procurement_category_desc:0 "Những chương trình đóng và mua tàu mà ta đã lỡ cửa sổ lịch sử. Có thể mở lại, nhưng giá cao hơn 25% và tàu về chậm hơn."
 VIE_naval_late_gepard1:0 "Mở lại: Khinh hạm Gepard 3.9, lô một"
 VIE_naval_late_gepard1_desc:0 "Zelenodolsk vẫn nhận đơn, nhưng với giá cao hơn và thời gian giao dài hơn."
 VIE_naval_late_gepard2:0 "Mở lại: Khinh hạm Gepard 3.9, lô hai"
 VIE_naval_late_gepard2_desc:0 "Đặt tiếp lô chống ngầm sau khi lô một đã giao xong, với giá cao hơn và thời gian giao dài hơn."
 VIE_naval_late_bastion:0 "Mở lại: Tổ hợp tên lửa bờ Bastion-P"
 VIE_naval_late_bastion_desc:0 "Đàm phán lại hợp đồng tên lửa bờ với giá cao hơn và thời gian giao dài hơn."
 VIE_naval_late_kilo:0 "Mở lại: Tàu ngầm Kilo dự án 636"
 VIE_naval_late_kilo_desc:0 "Hợp đồng tàu ngầm vẫn có thể ký, với giá cao hơn và thời gian giao dài hơn."
 VIE_naval_late_molniya:0 "Mở lại: Tàu tên lửa Molniya"
 VIE_naval_late_molniya_desc:0 "Mở lại pha còn khả thi của chương trình Molniya: đóng tại Ba Son nếu xưởng đã sẵn sàng, nếu không thì mua tàu từ Nga."
 VIE_naval_late_sigma:0 "Mở lại: Tàu hộ vệ Sigma 9814"
 VIE_naval_late_sigma_desc:0 "Đàm phán với Damen đã dừng. Có thể bắt đầu lại và đặt mua thật sự, với giá cao hơn và thời gian giao dài hơn."



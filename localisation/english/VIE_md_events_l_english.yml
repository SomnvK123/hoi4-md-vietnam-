 ### Truc 2 khong quan (CNQP hang khong - phong khong): focus va category (vie_air_ind)

 VIE_apm_law:0 "Thể chế Công nghiệp Quốc phòng Hàng không"
 VIE_apm_law_desc:0 "Quân chủng Phòng không - Không quân không tự sản xuất máy bay chiến đấu, nhưng ngành đại tu, tên lửa, radar và tích hợp hệ thống cần một khung thể chế riêng để nâng năng lực từng bước."
 VIE_apm_a32:0 "Nhà máy A32: đại tu và kéo dài niên hạn"
 VIE_apm_a32_desc:0 "Nhà máy A32 ở Đà Nẵng đại tu máy bay chiến đấu cho Quân chủng: từ Su-27 bằng tài liệu mua ngoài, đến kéo dài niên hạn Su-22 và Su-27, rồi Su-30MK2."
 VIE_apm_a31:0 "Nhà máy A31: tên lửa phòng không"
 VIE_apm_a31_desc:0 "Phát triển năng lực nâng cấp tên lửa phòng không đời cũ, thay thế linh kiện và bảo đảm hệ thống thực có. Bảo dưỡng S-300 chỉ mở khi trang bị đã được giao."
 VIE_apm_radar:0 "Radar và chỉ huy - điều khiển nội địa"
 VIE_apm_radar_desc:0 "Viettel phát triển radar cảnh giới và hệ điều khiển hỏa lực số, từ radar tầm thấp đến radar 3D và radar chống tàng hình."
 VIE_apm_integration:0 "Tích hợp vũ khí và hệ thống đa nguồn"
 VIE_apm_integration_desc:0 "Đội bay và phòng không của Việt Nam đến từ nhiều nguồn: Nga, Israel, Séc, Mỹ. Tích hợp liên kết dữ liệu, vũ khí và chuẩn chỉ huy là điều kiện để mua sắm đa nguồn."
 VIE_apm_uav:0 "Chương trình UAV nội địa"
 VIE_apm_uav_desc:0 "Xây dựng chương trình mục tiêu bay, thử nghiệm UAV trinh sát và nghiên cứu UAV tấn công. Năng lực được nâng bằng từng chương trình đã hoàn tất."
 VIE_apm_mature:0 "Công nghiệp hàng không - phòng không trưởng thành"
 VIE_apm_mature_desc:0 "Năng lực tích hợp đạt bậc 2 và ít nhất ba trong bốn trụ A32, A31, radar, UAV đạt bậc 2. Có thể trưởng thành bằng đại tu, tên lửa và radar mà không bắt buộc UAV."
 VIE_apm_category:0 "Công nghiệp Quốc phòng Hàng không"
 VIE_apm_category_desc:0 "Các chương trình nâng năng lực cho đại tu máy bay, tên lửa phòng không, radar, tích hợp hệ thống và UAV. Mỗi trụ nâng từng bậc; tối đa hai chương trình chạy cùng lúc."

 VIE_apm_prog_a32:0 "Đang nâng năng lực Nhà máy A32"
 VIE_apm_prog_a32_desc:0 "Nhà máy A32 đang thực hiện chương trình đại tu và kéo dài niên hạn máy bay chiến đấu."
 VIE_apm_prog_a31:0 "Đang nâng năng lực Nhà máy A31"
 VIE_apm_prog_a31_desc:0 "Nhà máy A31 đang hiện đại hóa tổ hợp tên lửa phòng không."
 VIE_apm_prog_radar:0 "Đang phát triển radar Viettel"
 VIE_apm_prog_radar_desc:0 "Viettel đang phát triển radar cảnh giới và hệ chỉ huy - điều khiển."
 VIE_apm_prog_integ:0 "Đang tích hợp hệ thống đa nguồn"
 VIE_apm_prog_integ_desc:0 "Các nhóm kỹ sư đang tích hợp liên kết dữ liệu và vũ khí từ nhiều nguồn."
 VIE_apm_prog_uav:0 "Đang phát triển UAV nội địa"
 VIE_apm_prog_uav_desc:0 "Chương trình UAV nội địa đang được thực hiện."

 ### Trụ A32 (bước 4)
 VIE_apm_slot_tt:0 "Đang chạy ít hơn §Y2§! chương trình công nghiệp quốc phòng hàng không"
 VIE_apm_busy_tt:0 "Trụ này chưa có chương trình đang chạy"
 VIE_apm_a32_gate_tt:0 "Bậc 1: đã mở A32. Bậc 2: hoàn tất bậc 1. Bậc 3: hoàn tất bậc 2 và (đã kéo dài niên hạn Su-30, có ít nhất 12 chiếc đã giao; hoặc đã giao C-295)."
 VIE_apm_d_a32:0 "Nâng năng lực Nhà máy A32"
 VIE_apm_d_a32_desc:0 "Nhà máy A32 ở Đà Nẵng nâng năng lực đại tu máy bay chiến đấu qua ba bậc: tự đại tu Su-27, kéo dài niên hạn Su-22 và Su-27, rồi đại tu Su-30MK2 và sửa chữa C-295M.\n\nGiảm tai nạn không quân tổng cộng khoảng 8%.\n\nNgân sách theo phương án của từng chương trình và giảm giá lịch sử; PP và thời lượng giữ nguyên."

 vie_air_ind.11.t:0 "Nhà máy A32 tự đại tu Su-27"
 vie_air_ind.11.d:0 "Quân chủng muốn Nhà máy A32 làm chủ việc đại tu Su-27 thay vì gửi sang Nga. Có hai cách: mua trọn bộ tài liệu kỹ thuật nước ngoài, hoặc để kỹ sư tự biên soạn quy trình từ máy tháo rời."
 vie_air_ind.11.a:0 "Mua tài liệu kỹ thuật nước ngoài (nhanh, đắt hơn)."
 vie_air_ind.11.b:0 "Tự biên soạn quy trình (chậm, rẻ, tích lũy kinh nghiệm)."
 vie_air_ind.12.t:0 "Kéo dài niên hạn máy bay chiến đấu"
 vie_air_ind.12.d:0 "Đề nghị phát triển quy trình kiểm định và kéo dài niên hạn Su-22, Su-27. Nếu Su-30 đã được giao, có thể mở rộng chương trình sang loại máy bay này với thêm chi phí và thời gian."
 vie_air_ind.12.a:0 "Kéo dài cả Su-22, Su-27 và kiểm tra cục bộ Su-30MK2."
 vie_air_ind.12.b:0 "Chỉ Su-22 và Su-27."
 vie_air_ind.13.t:0 "Đại tu Su-30MK2 và sửa chữa vận tải cơ"
 vie_air_ind.13.d:0 "Đầu tư hoàn thiện năng lực đại tu theo một trong hai hướng. Hướng Su-30 cần đủ 12 chiếc đã giao và đã hoàn tất chương trình kéo dài niên hạn; hướng vận tải cần C-295 đã giao, độc lập với số Su-30."
 vie_air_ind.13.a:0 "Ưu tiên đại tu Su-30MK2."
 vie_air_ind.13.b:0 "Ưu tiên C-295M và trực thăng (rẻ hơn)."
 vie_air_ind.19.t:0 "Nhà máy A32 hoàn tất một giai đoạn"
 vie_air_ind.19.d:0 "Chương trình nâng năng lực của Nhà máy A32 đã hoàn tất; tỷ lệ tai nạn của đội bay giảm."
 vie_air_ind.19.a:0 "Tốt."

 ### Trụ A31 và Radar (bước 5)
 VIE_apm_a31_gate_tt:0 "Bậc 1: đã mở A31, có thể hợp tác hoặc tự phát triển. Bậc 2: hoàn tất bậc 1. Bậc 3: hoàn tất bậc 2 và (SAM tầm xa đã giao hoặc radar bậc 2)."
 VIE_apm_radar_gate_tt:0 "Đã mở chương trình radar; mỗi bậc kế tiếp cần hoàn tất bậc trước. Không dùng năm hoặc cờ scheduler làm kết quả."
 VIE_apm_d_a31:0 "Nâng năng lực Nhà máy A31"
 VIE_apm_d_a31_desc:0 "Nhà máy A31 hiện đại hóa tổ hợp tên lửa phòng không đời cũ (S-75, S-125) bằng linh kiện điện tử trong nước, rồi bảo dưỡng S-300PMU1.\n\nTăng phòng không, giảm chi phí duy trì, và nuôi tổ chức công nghiệp Viettel.\n\nNgân sách theo phương án của từng chương trình và giảm giá lịch sử; PP và thời lượng giữ nguyên."
 VIE_apm_d_radar:0 "Nâng năng lực radar và chỉ huy - điều khiển"
 VIE_apm_d_radar_desc:0 "Viettel phát triển radar cảnh giới và hệ điều khiển hỏa lực số: từ radar tầm thấp đến radar 3D và radar chống tàng hình.\n\nTăng khả năng phát hiện trên không.\n\nNgân sách theo phương án của từng chương trình và giảm giá lịch sử; PP và thời lượng giữ nguyên."

 vie_air_ind.21.t:0 "Nâng cấp tổ hợp S-75 và S-125"
 vie_air_ind.21.d:0 "Đầu tư nâng cấp các tổ hợp tên lửa phòng không đời cũ. Có thể hợp tác với Belarus khi đối tác tồn tại, hoặc tự phát triển quy trình trong nước; không bắt buộc một hợp đồng Pechora trước đó."
 vie_air_ind.21.a:0 "Làm cùng Belarus (nhanh)."
 vie_air_ind.21.b:0 "Tự làm (rẻ, chậm hơn một năm)."
 vie_air_ind.22.t:0 "Điện tử nội địa cho S-125"
 vie_air_ind.22.d:0 "Đầu tư phát triển và kiểm định các khối điện tử thay thế linh kiện nhập khẩu. Chọn tập trung S-125 hoặc mở rộng sang S-75; năng lực chỉ được ghi nhận khi chương trình hoàn tất."
 vie_air_ind.22.a:0 "Chỉ S-125."
 vie_air_ind.22.b:0 "Cả S-125 và S-75."
 vie_air_ind.23.t:0 "Bảo dưỡng S-300 và tên lửa mới"
 vie_air_ind.23.d:0 "Chọn hoàn thiện quy trình bảo dưỡng S-300 nếu hệ thống đã được giao, hoặc nghiên cứu năng lực sản xuất tên lửa mới khi radar nội địa đạt bậc 2. Đầu tư công nghiệp không tự cấp tổ hợp tên lửa chiến đấu."
 vie_air_ind.23.a:0 "Bảo dưỡng S-300."
 vie_air_ind.23.b:0 "Nghiên cứu năng lực sản xuất tên lửa mới."
 vie_air_ind.29.t:0 "Nhà máy A31 hoàn tất một giai đoạn"
 vie_air_ind.29.d:0 "Chương trình nâng năng lực của Nhà máy A31 đã hoàn tất; lực lượng tên lửa phòng không mạnh hơn."
 vie_air_ind.29.a:0 "Tốt."

 vie_air_ind.31.t:0 "Chương trình Radar Tầm thấp"
 vie_air_ind.31.d:0 "Đầu tư thiết kế, thử nghiệm và chuẩn hóa radar tầm thấp. Có thể tập trung cảnh giới hoặc bổ sung điều khiển hỏa lực số; không mặc nhiên sở hữu một mẫu radar tương lai có tên."
 vie_air_ind.31.a:0 "Chỉ radar."
 vie_air_ind.31.b:0 "Radar và điều khiển hỏa lực số."
 vie_air_ind.32.t:0 "Radar 3D tầm trung"
 vie_air_ind.32.d:0 "Phát triển cảm biến 3D tầm trung sau khi hoàn tất bậc radar đầu. Chọn tiến độ thông thường hoặc đầu tư tăng tốc; không dùng ngày tháng thay cho kết quả thử nghiệm."
 vie_air_ind.32.a:0 "Tiến độ thông thường."
 vie_air_ind.32.b:0 "Đẩy nhanh."
 vie_air_ind.33.t:0 "Radar 3D và radar chống tàng hình"
 vie_air_ind.33.d:0 "Hoàn thiện năng lực radar sau hai chương trình nền tảng. Chọn nghiên cứu mục tiêu khó phát hiện hoặc radar 3D; chương trình là mục tiêu phát triển, không xác nhận một mẫu trang bị đã ra đời."
 vie_air_ind.33.a:0 "Ưu tiên phát hiện mục tiêu khó thấy."
 vie_air_ind.33.b:0 "Ưu tiên radar 3D."
 vie_air_ind.39.t:0 "Chương trình radar Viettel hoàn tất một giai đoạn"
 vie_air_ind.39.d:0 "Chương trình radar và chỉ huy - điều khiển đã hoàn tất một giai đoạn; khả năng phát hiện trên không tăng."
 vie_air_ind.39.a:0 "Tốt."

 ### Trụ Tích hợp và UAV (bước 6)
 VIE_apm_integ_gate_tt:0 "Bậc 1: đã mở tích hợp. Bậc 2: hoàn tất bậc 1 và radar bậc 1. Bậc 3: hoàn tất bậc 2 và radar bậc 2."
 VIE_apm_uav_gate_tt:0 "Bậc 1: đã mở UAV. Bậc 2: hoàn tất bậc 1 và radar bậc 1. Bậc 3: hoàn tất bậc 2, radar và tích hợp bậc 2."
 VIE_apm_d_integ:0 "Tích hợp vũ khí và hệ thống đa nguồn"
 VIE_apm_d_integ_desc:0 "Liên kết dữ liệu, chuẩn chỉ huy và vũ khí giữa các hệ thống Nga, Israel, Séc và phương Tây. Là điều kiện để các chương trình mua sắm giả định có thể nội địa hóa một phần.\n\nNgân sách theo phương án của từng chương trình và giảm giá lịch sử; PP và thời lượng giữ nguyên."
 VIE_apm_d_uav:0 "Chương trình UAV nội địa"
 VIE_apm_d_uav_desc:0 "Từ mục tiêu bay M-100CT đến UAV trinh sát và UAV tấn công do Viettel phát triển. Các bậc cao dựa trên tin chưa được xác nhận chính thức.\n\nNgân sách theo phương án của từng chương trình và giảm giá lịch sử; PP và thời lượng giữ nguyên."

 vie_air_ind.41.t:0 "Nghiên cứu Tích hợp Vũ khí Đa nguồn"
 vie_air_ind.41.d:0 "Phát triển quy trình giao tiếp, kiểm thử và tích hợp vũ khí từ nhiều nguồn. Chọn nghiên cứu không đối không hoặc không đối đất; không mặc nhiên coi tên lửa đi kèm tổ hợp phòng không là vũ khí đã tích hợp lên máy bay."
 vie_air_ind.41.a:0 "Ưu tiên tên lửa không đối không."
 vie_air_ind.41.b:0 "Ưu tiên tên lửa không đối đất."
 vie_air_ind.42.t:0 "Liên kết dữ liệu và chỉ huy đa nguồn"
 vie_air_ind.42.d:0 "Xây dựng liên kết dữ liệu giữa cảm biến, phòng không và đội bay trên nền radar đã phát triển. Chọn chuẩn tương thích nguồn trang bị truyền thống hoặc chuẩn mở; không tự giao hệ thống ngoại nhập."
 vie_air_ind.42.a:0 "Dùng chuẩn Nga."
 vie_air_ind.42.b:0 "Dựng chuẩn mở (đắt hơn)."
 vie_air_ind.43.t:0 "Tích hợp theo chuẩn phương Tây"
 vie_air_ind.43.d:0 "Phát triển quy trình huấn luyện, kiểm định và chỉ huy tương thích nhiều nguồn trang bị. Chọn ưu tiên huấn luyện hoặc tác chiến; không yêu cầu một mẫu huấn luyện cơ tương lai đã vào biên chế."
 vie_air_ind.43.a:0 "Ưu tiên huấn luyện."
 vie_air_ind.43.b:0 "Ưu tiên tác chiến."
 vie_air_ind.49.t:0 "Chương trình tích hợp hoàn tất một giai đoạn"
 vie_air_ind.49.d:0 "Các nhóm kỹ sư đã hoàn tất một giai đoạn tích hợp hệ thống và vũ khí đa nguồn."
 vie_air_ind.49.a:0 "Tốt."

 vie_air_ind.51.t:0 "Chương trình Mục tiêu Bay"
 vie_air_ind.51.d:0 "Phát triển mục tiêu bay để huấn luyện phòng không, kiểm thử cảm biến và đào tạo kỹ sư UAV. Kết quả được ghi nhận sau khi đầu tư và hoàn tất chương trình."
 vie_air_ind.51.a:0 "Bắt đầu."
 vie_air_ind.52.t:0 "UAV trinh sát nội địa"
 vie_air_ind.52.d:0 "Viettel đề nghị phát triển UAV trinh sát nội địa. Có thể tự làm, hoặc mua công nghệ ngoài để nhanh hơn."
 vie_air_ind.52.a:0 "Phát triển nội địa."
 vie_air_ind.52.b:0 "Mua công nghệ ngoài (nhanh, đắt hơn)."
 vie_air_ind.53.t:0 "UAV tấn công và loitering"
 vie_air_ind.53.d:0 "Nghiên cứu UAV tấn công cánh cố định và khả năng bổ sung đạn bay lảng vảng sau khi đạt nền radar, tích hợp cần thiết. Đây là chương trình phát triển năng lực; không khẳng định mẫu trang bị có tên đã được biên chế."
 vie_air_ind.53.a:0 "Chỉ UAV cánh cố định."
 vie_air_ind.53.b:0 "Thêm cả đạn bay lảng vảng."
 vie_air_ind.59.t:0 "Chương trình UAV hoàn tất một giai đoạn"
 vie_air_ind.59.d:0 "Chương trình UAV nội địa đã hoàn tất một giai đoạn."
 vie_air_ind.59.a:0 "Tốt."




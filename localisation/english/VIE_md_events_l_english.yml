 ### vie_alt.23
 vie_alt.23.t:0 "Khủng hoảng Niềm tin"
 vie_alt.23.d:0 "Sau một loạt các cú sốc liên tiếp, nhiều người dân không còn tin rằng chính quyền đang nắm quyền kiểm soát tình hình. Tình trạng xếp hàng, những lời đồn đoán và các cuộc biểu tình nhỏ lẻ lan rộng khắp nơi; ngay cả những cán bộ trung kiên cũng bắt đầu nhắc đến vấn đề tính chính danh."
 vie_alt.23.a:0 "Ban bố các biện pháp khẩn cấp"
 vie_alt.23.b:0 "Nhượng bộ và tiến hành cải cách"
 vie_alt.23.c:0 "Kiên quyết giữ vững lập trường"

 ### vie_scs.16
 vie_scs.16.t:0 "Đụng độ tại Quần đảo Hoàng Sa"
 vie_scs.16.d:0 "Tàu thuyền hai bên đã nổ súng gần Quần đảo Hoàng Sa và xuất hiện thương vong từ cả hai phía. Đám đông bắt đầu tụ tập bên ngoài đại sứ quán tại Hà Nội, và ban lãnh đạo phải đưa ra tuyên bố chỉ trong vòng vài giờ tới."
 vie_scs.16.a:0 "Thể hiện sự kiềm chế"
 vie_scs.16.b:0 "Đáp trả vũ lực bằng vũ lực"

 ### vie_scs.17
 vie_scs.17.t:0 "Đàm phán Ngừng bắn"
 vie_scs.17.d:0 "Giao tranh trên biển đã rơi vào thế bế tắc kéo dài. Đặc phái viên của nhiều quốc gia đề nghị đứng ra dàn xếp một thỏa thuận ngừng bắn, và chính phủ hai bên đang được yêu cầu đưa ra các điều kiện tiên quyết."
 vie_scs.17.a:0 "Chấp nhận hiện trạng và dừng lại"
 vie_scs.17.b:0 "Tiếp tục chiến đấu"




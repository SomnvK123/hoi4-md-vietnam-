 ### vie_pol.10
 vie_pol.10.t:0 "Luật An ninh Mạng"
 vie_pol.10.d:0 "Quốc hội được đề nghị thông qua luật yêu cầu dữ liệu người dùng Việt Nam phải được lưu trữ trong nước và trao cho cơ quan chức năng quyền yêu cầu gỡ bỏ các nội dung vi phạm. Các nền tảng nước ngoài cảnh báo về chi phí và các ý kiến chỉ trích lo ngại về việc kiểm duyệt, trong khi ban soạn thảo khẳng định luật này nhằm bảo vệ ổn định quốc gia."
 vie_pol.10.a:0 "Thông qua luật theo đúng dự thảo ban đầu"
 vie_pol.10.b:0 "Thông qua phiên bản điều chỉnh sau khi đối thoại với các tập đoàn công nghệ"

 ### vie_pol.18
 vie_pol.18.t:0 "Bất ổn tại Tây Nguyên"
 vie_pol.18.d:0 "Đám đông đã tụ tập tại nhiều tỉnh Tây Nguyên vì các mâu thuẫn về đất đai và tôn giáo, một số nơi đã xảy ra xô xát với lực lượng công an. Chính quyền các địa phương xin ý kiến chỉ đạo từ Hà Nội về mức độ xử lý."
 vie_pol.18.a:0 "Lập lại trật tự trước tiên"
 vie_pol.18.b:0 "Mở cuộc đối thoại và cam kết tăng cường đầu tư"

 ### vie_pol.21
 vie_pol.21.t:0 "Tâm lý Sợ sai, Đùn đẩy Trách nhiệm"
 vie_pol.21.d:0 "Các chiến dịch điều tra khiến cán bộ trở nên thận trọng quá mức. Hàng loạt dự án phải nằm chờ những chữ ký mà không ai dám đặt bút, các bộ ngành phàn nàn rằng ngân sách không thể giải ngân trong khi thủ tục giấy tờ bị đùn đẩy qua lại."
 vie_pol.21.a:0 "Có cơ chế bảo vệ cán bộ dám nghĩ, dám làm"
 vie_pol.21.b:0 "Tiếp tục duy trì sức ép thanh tra, kiểm tra"

 ### vie_cor.6
 vie_cor.6.t:0 "Làn sóng Từ chức của Cán bộ Cấp cao"
 vie_cor.6.d:0 "Các bộ trưởng, lãnh đạo tỉnh và nhiều nhân vật cấp cao lần lượt rời ghế trong thời gian ngắn, một số do thiếu trách nhiệm trong giám sát và một số vì những vi phạm nghiêm trọng hơn. Chiến dịch phòng chống tham nhũng đang chạm tới các cấp cao hơn bao giờ hết, khiến giới chính trị không khỏi bất an."
 vie_cor.6.a:0 "Kiên quyết tiếp tục đẩy mạnh chiến dịch"
 vie_cor.6.b:0 "Tạm dừng để bảo vệ sự ổn định bộ máy"

 ### vie_eco.13
 vie_eco.13.t:0 "Triển vọng Nâng hạng Thị trường"
 vie_eco.13.d:0 "Sau khi đáp ứng các tiêu chuẩn cốt lõi, thị trường chứng khoán Việt Nam dự kiến sẽ được tổ chức xếp hạng quốc tế nâng hạng lên thị trường mới nổi. Dòng vốn ngoại sẽ đổ vào, nhưng các tập đoàn lớn trong nước lại lo ngại về các điều kiện đi kèm."
 vie_eco.13.a:0 "Mở rộng hơn nữa tỷ lệ sở hữu cho nhà đầu tư nước ngoài"
 vie_eco.13.b:0 "Giữ giới hạn trần sở hữu nước ngoài ở các doanh nghiệp trọng yếu"


# ====================================================================
# SECTION: VIE_md_events_p6_l_english.yml
# ====================================================================


 ### vie_eco.19
 vie_eco.19.t:0 "Chiến tranh Thương mại Giữa các Cường quốc"
 vie_eco.19.d:0 "Thuế quan trả đũa giữa Hoa Kỳ và Trung Quốc đang thúc đẩy các nhà sản xuất dịch chuyển một phần chuỗi sản xuất. Việt Nam nằm trong số những điểm đến hàng đầu mà họ nhắm tới. Washington đưa ra lời cảnh báo rằng hàng hóa không được chỉ mượn đường trung chuyển, trong khi Bắc Kinh cũng chăm chú theo dõi xem ai đang hưởng lợi từ các đơn hàng này."
 vie_eco.19.a:0 "Chào đón làn sóng dịch chuyển nhà máy"
 vie_eco.19.b:0 "Siết chặt kiểm tra nguồn gốc xuất xứ hàng tạm nhập tái xuất"

 ### vie_eco.21
 vie_eco.21.t:0 "Bùng nổ Điện mặt trời Vượt tải Lưới điện"
 vie_eco.21.d:0 "Hàng ngàn dự án điện mặt trời mới hòa vào hệ thống lưới điện vốn chưa được thiết kế để chịu tải lượng công suất lớn đến vậy. Tại các tỉnh miền Trung, đơn vị vận hành lưới điện đã bắt đầu phải cắt giảm công suất phát vào giữa trưa, khiến các nhà đầu tư vô cùng bức xúc."
 vie_eco.21.a:0 "Cắt giảm công suất phát điện mặt trời"
 vie_eco.21.b:0 "Cấp kinh phí nâng cấp khẩn cấp hệ thống lưới truyền tải"

 ### vie_eco.25
 vie_eco.25.t:0 "Cắt điện Luân phiên tại Miền Bắc"
 vie_eco.25.d:0 "Mùa hè nắng nóng gay gắt và khô hạn đã làm sụt giảm nghiêm trọng sản lượng của các hồ thủy điện trong khi nhu cầu tiêu thụ điện tăng vọt. Các nhà máy ở miền Bắc liên tục mất điện hàng giờ liền, khiến các nhà đầu tư nước ngoài lo lắng về độ tin cậy của hệ thống năng lượng."
 vie_eco.25.a:0 "Cắt điện luân phiên giữa các khu vực"
 vie_eco.25.b:0 "Nhập khẩu điện khẩn cấp với giá cao"
 vie_eco.25.c:0 "Huy động tối đa công suất các nhà máy nhiệt điện than"

 ### vie_scs.13
 vie_scs.13.t:0 "Luật Hải cảnh của Trung Quốc"
 vie_scs.13.d:0 "Đạo luật mới của Bắc Kinh cho phép lực lượng hải cảnh sử dụng vũ lực đối với tàu thuyền nước ngoài trong các vùng biển mà họ tự tuyên bố chủ quyền, bao gồm cả những vùng biển thuộc chủ quyền và quyền tài phán của Việt Nam. Ngư dân và các nhà phân tích lo ngại sâu sắc về nguy cơ bùng phát xung đột trong các vụ chạm trán sắp tới."
 vie_scs.13.a:0 "Trao công hàm phản đối chính thức và tiếp tục bám biển"
 vie_scs.13.b:0 "Tăng cường năng lực lực lượng Cảnh sát biển để đáp trả"

 ### vie_dip.5
 vie_dip.5.t:0 "Hội nghị Thượng đỉnh APEC tại Hà Nội"
 vie_dip.5.d:0 "Lãnh đạo các nền kinh tế khu vực châu Á - Thái Bình Dương sẽ hội tụ tại thủ đô Hà Nội. Đây là hội nghị ngoại giao đa phương lớn nhất mà đất nước từng đăng cai tổ chức, và chính phủ mong muốn tận dụng cơ hội này để quảng bá hình ảnh đẹp nhất của đất nước ra thế giới."
 vie_dip.5.a:0 "Tổ chức trang trọng, hoành tráng"
 vie_dip.5.b:0 "Tổ chức tinh gọn, tiết kiệm"

 ### vie_dip.17
 vie_dip.17.t:0 "Ai Sẽ Mua Đất Hiếm?"
 vie_dip.17.d:0 "Những lô quặng đất hiếm đầu tiên đã sẵn sàng xuất xưởng. Washington và các đối tác mong muốn tìm kiếm một nguồn cung ứng không phụ thuộc vào Trung Quốc. Bắc Kinh, quốc gia dẫn đầu thế giới về công nghệ tinh chế, đề nghị bao tiêu toàn bộ sản lượng. Con đường thứ ba là kiên nhẫn tự xây dựng các tổ hợp tinh chế trong nước."
 vie_dip.17.a:0 "Bán cho Hoa Kỳ và các đối tác chiến lược"
 vie_dip.17.b:0 "Bán cho Trung Quốc"
 vie_dip.17.c:0 "Từng bước phát triển công nghệ tinh chế trong nước"


# ====================================================================
# SECTION: VIE_md_events_p7_l_english.yml
# ====================================================================


 ### vie_dip.16
 vie_dip.16.t:0 "Ai Sẽ Cung Cấp Máy Bay Chiến Đấu Mới?"
 vie_dip.16.d:0 "Không quân cần thay thế phi đội tiêm kích cũ kỹ nhất của mình. Moskva đề xuất dòng tiêm kích đã được kiểm chứng với mức giá phải chăng. Các nhà sản xuất phương Tây, nay đã được tự do bán vũ khí cho Việt Nam, mang đến các máy bay tiên tiến hơn nhưng đi kèm với nhiều điều kiện ràng buộc. Phương án thứ ba là tạm hoãn quyết định."
 vie_dip.16.a:0 "Tiếp tục mua máy bay của Nga"
 vie_dip.16.b:0 "Mua tiêm kích của phương Tây"
 vie_dip.16.c:0 "Tạm hoãn quyết định"

 ### vie_soc.14
 vie_soc.14.t:0 "Sương Mù Ô Nhiễm Mùa Đông tại Hà Nội"
 vie_soc.14.d:0 "Lớp sương mù xám xịt bao phủ thủ đô suốt nhiều ngày liền. Các trường học phải đóng cửa, bệnh viện ghi nhận số ca mắc bệnh về đường hô hấp tăng vọt, và người dân yêu cầu thành phố phải có biện pháp xử lý kịp thời."
 vie_soc.14.a:0 "Áp đặt các biện pháp hạn chế khẩn cấp"
 vie_soc.14.b:0 "Chờ cho hướng gió thay đổi"

 ### vie_soc.18
 vie_soc.18.t:0 "Tỷ Lệ Sinh Suy Giảm"
 vie_soc.18.d:0 "Số trẻ em sinh ra mỗi năm ngày càng giảm, và các chuyên gia nhân khẩu học cảnh báo nguy cơ đất nước sẽ già trước khi giàu. Quy định giới hạn hai con trước đây đã lỗi thời và nhiều người muốn bãi bỏ nó."
 vie_soc.18.a:0 "Hỗ trợ tài chính và nhà ở cho các gia đình"
 vie_soc.18.b:0 "Nghiên cứu kỹ vấn đề trước khi hành động"

 ### vie_eco.29
 vie_eco.29.t:0 "Khó Khăn tại Hãng Xe Quốc Gia"
 vie_eco.29.d:0 "Thương hiệu ô tô quốc gia đang thua lỗ nhanh hơn dự kiến, trong khi các đối thủ nước ngoài liên tục hạ giá bán. Các nhà sáng lập và quản lý kiến nghị cần thêm thời gian và bổ sung nguồn vốn đầu tư."
 vie_eco.29.a:0 "Bổ sung thêm nguồn vốn"
 vie_eco.29.b:0 "Thu hẹp quy mô dự án"



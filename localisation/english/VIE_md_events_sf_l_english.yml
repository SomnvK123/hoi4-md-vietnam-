l_english:
 VIE_sf_command:0 "Bộ Tư lệnh Lực lượng Đặc biệt"
 VIE_sf_command_desc:0 "Thống nhất đầu mối chỉ huy, huấn luyện và trang bị cho các lực lượng tác chiến đặc thù, tách khỏi khung bộ binh thông thường. Mở hai hướng: Đặc công và Hải quân đánh bộ. (ĐỀ XUẤT) hướng phát triển tổ chức"
 VIE_sf_sapper:0 "Phát triển Binh chủng Đặc công"
 VIE_sf_sapper_desc:0 "Đặc công là binh chủng tinh nhuệ có truyền thống lâu đời của quân đội, chuyên đánh sâu vào các mục tiêu trọng yếu bằng lực lượng nhỏ. Hướng này nâng huấn luyện, trang bị và chỉ huy cho binh chủng. (THẬT) nền"
 VIE_sf_sapper_training:0 "Huấn luyện Đặc công"
 VIE_sf_sapper_training_desc:0 "Rèn kỹ năng lặn, sinh tồn trong rừng núi, đột nhập và đánh gần. Rút ngắn thời gian huấn luyện và giảm ảnh hưởng của địa hình."
 VIE_sf_sapper_equipment:0 "Trang bị Đột kích Đặc công"
 VIE_sf_sapper_equipment_desc:0 "Mua vũ khí giảm thanh, thuốc nổ chuyên dụng và khí tài đặc chủng cho các đội đột kích. Tốn ngân sách, đổi lại giảm tiêu hao tiếp liệu và được thưởng kinh nghiệm công nghệ trang bị đặc nhiệm."
 VIE_sf_sapper_command:0 "Chiến thuật và Chỉ huy Đặc công"
 VIE_sf_sapper_command_desc:0 "Phối hợp tổ đội nhỏ, trinh sát kỹ trước khi đánh và tận dụng ban đêm. Tăng khả năng trinh sát và sức đánh ban đêm."
 VIE_sf_sapper_elite:0 "Lữ đoàn Đặc công Tinh nhuệ"
 VIE_sf_sapper_elite_desc:0 "Biên chế chính thức một lữ đoàn đặc công tinh nhuệ, đủ người và trang bị. Tăng trần lực lượng đặc biệt và tốc độ đào công sự. (ĐỀ XUẤT) biên chế và tên đơn vị"
 VIE_sf_marine:0 "Phát triển Hải quân đánh bộ"
 VIE_sf_marine_desc:0 "Xây dựng lực lượng đổ bộ và tác chiến biển đảo, gắn với yêu cầu giữ vững chủ quyền trên biển. Hạm đội đổ bộ thuộc nhánh Hải quân; nhánh này lo phần bộ binh đổ bộ. (ĐỀ XUẤT) hướng phát triển"
 VIE_sf_marine_training:0 "Huấn luyện Đổ bộ"
 VIE_sf_marine_training_desc:0 "Luyện vượt sóng, đánh chiếm bãi đổ bộ và tác chiến trên đảo. Rút ngắn thời gian huấn luyện và tăng tốc độ lập kế hoạch đổ bộ."
 VIE_sf_marine_equipment:0 "Trang bị Đổ bộ"
 VIE_sf_marine_equipment_desc:0 "Mua xuồng, phương tiện đổ bộ và khí tài cho bộ binh hải quân. Tốn ngân sách, đổi lại giảm tiêu hao tiếp liệu và được thưởng kinh nghiệm công nghệ tàu đổ bộ."
 VIE_sf_marine_command:0 "Tác chiến Biển và Chỉ huy"
 VIE_sf_marine_command_desc:0 "Phối hợp giữa hải quân và bộ binh, giữ liên lạc từ bờ ra đảo. Tăng khả năng trinh sát và khả năng phòng thủ của lực lượng đổ bộ."
 VIE_sf_marine_elite:0 "Lữ đoàn Hải quân đánh bộ Tinh nhuệ"
 VIE_sf_marine_elite_desc:0 "Biên chế chính thức một lữ đoàn hải quân đánh bộ tinh nhuệ ở vùng ven biển phía nam, đủ sức tái chiếm đảo. Tăng trần lực lượng đặc biệt và sức chở đổ bộ. (ĐỀ XUẤT) biên chế và địa điểm đóng quân"
 VIE_sf_tb_sapper_equipment:0 "Kinh nghiệm trang bị đặc công"
 VIE_sf_tb_marine_landing:0 "Kinh nghiệm phương tiện đổ bộ"

 ### vie_dip.16
 vie_dip.16.t:0 "Ai Sẽ Cung Cấp Máy Bay Chiến Đấu Mới?"
 vie_dip.16.d:0 "Không quân cần thay thế phi đội tiêm kích cũ kỹ nhất của mình. Moskva đề xuất dòng tiêm kích đã được kiểm chứng với mức giá phải chăng. Các nhà sản xuất phương Tây, nay đã được tự do bán vũ khí cho Việt Nam, mang đến các máy bay tiên tiến hơn nhưng đi kèm với nhiều điều kiện ràng buộc. Phương án thứ ba là tạm hoãn quyết định."
 vie_dip.16.a:0 "Tiếp tục mua máy bay của Nga"
 vie_dip.16.b:0 "Mua tiêm kích của phương Tây"
 vie_dip.16.c:0 "Tạm hoãn quyết định"

 ### vie_soc.14
 vie_soc.14.t:0 "Sương Mù Ô Nhiễm Mùa Đông tại Hà Nội"
 vie_soc.14.d:0 "Lớp sương mù xám xịt bao phủ thủ đô suốt nhiều ngày liền. Các trường học phải đóng cửa, bệnh viện ghi nhận số ca mắc bệnh về đường hô hấp tăng vọt, và người dân yêu cầu thành phố phải có biện pháp xử lý kịp thời."
 vie_soc.14.a:0 "Áp đặt các biện pháp hạn chế khẩn cấp"
 vie_soc.14.b:0 "Chờ cho hướng gió thay đổi"

 ### vie_soc.18
 vie_soc.18.t:0 "Tỷ Lệ Sinh Suy Giảm"
 vie_soc.18.d:0 "Số trẻ em sinh ra mỗi năm ngày càng giảm, và các chuyên gia nhân khẩu học cảnh báo nguy cơ đất nước sẽ già trước khi giàu. Quy định giới hạn hai con trước đây đã lỗi thời và nhiều người muốn bãi bỏ nó."
 vie_soc.18.a:0 "Hỗ trợ tài chính và nhà ở cho các gia đình"
 vie_soc.18.b:0 "Nghiên cứu kỹ vấn đề trước khi hành động"

 ### vie_eco.29
 vie_eco.29.t:0 "Khó Khăn tại Hãng Xe Quốc Gia"
 vie_eco.29.d:0 "Thương hiệu ô tô quốc gia đang thua lỗ nhanh hơn dự kiến, trong khi các đối thủ nước ngoài liên tục hạ giá bán. Các nhà sáng lập và quản lý kiến nghị cần thêm thời gian và bổ sung nguồn vốn đầu tư."
 vie_eco.29.a:0 "Bổ sung thêm nguồn vốn"
 vie_eco.29.b:0 "Thu hẹp quy mô dự án"
